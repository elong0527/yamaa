yamaa: "1.0"
type: spec
model: ADaM
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  DM: {path: input/dm.csv, types: {AGE: int}}

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, AGE, AGEGR1]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID
    submission:
      core: Req
      mandatory: true
      length: 8
      origins:
        - type: Predecessor
          description: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID
    submission:
      core: Req
      mandatory: true
      length: 12
      origins:
        - type: Predecessor
          description: DM.USUBJID

  - name: AGE
    type: int
    label: Age
    derivation: DM.AGE
    submission:
      core: Req
      mandatory: false
      length: 3
      origins:
        - type: Predecessor
          description: DM.AGE

  # The age group is derived, but no method says how.
  - name: AGEGR1
    type: str
    label: Pooled Age Group 1
    derivation:
      case:
        - when: "AGE < 65"
          then: "'<65'"
        - when: "AGE >= 65"
          then: "'>=65'"
    submission:
      core: Perm
      mandatory: false
      length: 4
      origins:
        - type: Derived

submission:
  label: Subject-Level Analysis Dataset
  class: SUBJECT LEVEL ANALYSIS DATASET
  structure: One record per subject
  repeating: false
