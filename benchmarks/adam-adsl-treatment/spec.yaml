schema_version: "1.0"
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  DM: input/dm.csv
  EX: {path: input/ex.csv, types: {EXSEQ: int}}
base: DM

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, TRT01A, TRTSDT, TRTSDTM, TRTSTMF,
    TRTEDT, TRTEDTM, TRTETMF, TRTDURD, SAFFL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  - name: TRT01RAW
    type: str
    label: First Actual Treatment from Exposure
    derivation:
      source:
        variable: EX.EXTRT
        filter: "EX.EXTRT IN ('VITAMIN D3', 'PLACEBO') AND EX.EXSTDTC IS NOT NULL"
        multiple_matches:
          order_by: [EX.EXSTDTC, EX.EXSEQ]
          keep: first
  - name: TRT01SRC
    type: str
    label: Selected Actual Treatment for Period 01
    derivation:
      first_available:
        sources: [TRT01RAW, DM.ACTARM]
        default: NOT TREATED

  - name: TRT01A
    type: str
    label: Actual Treatment for Period 01
    derivation:
      str_upper:
        source: TRT01SRC
    verifications:
      allowed_values:
        values: [VITAMIN D3, PLACEBO, NOT TREATED]

  - name: TRTSDTC
    type: str
    label: Collected Date/Time of First Exposure to Treatment
    derivation:
      aggregate:
        filter: "EX.EXTRT IN ('VITAMIN D3', 'PLACEBO') AND EX.EXSTDTC IS NOT NULL"
        expr: "MIN(EX.EXSTDTC)"

  - name: TRTEDTC
    type: str
    label: Collected Date/Time of Last Exposure to Treatment
    derivation:
      aggregate:
        filter: "EX.EXTRT IN ('VITAMIN D3', 'PLACEBO') AND EX.EXENDTC IS NOT NULL"
        expr: "MAX(EX.EXENDTC)"

  - name: TRTSDTM
    type: datetime
    label: Datetime of First Exposure to Treatment
    derivation:
      datetime_impute:
        source: TRTSDTC
        time: first
        missing: null
        invalid: null

  - name: TRTSTPR
    type: str
    label: First Exposure Date/Time Collected Precision
    derivation:
      datetime_precision:
        source: TRTSDTM
        missing: null

  - name: TRTSTMF
    type: str
    label: Time of First Exposure Imputation Flag
    derivation:
      case:
        - when: "TRTSTPR = 'D'"
          then:
            literal: H
    verifications:
      allowed_values:
        values: [H]

  - name: TRTEDTM
    type: datetime
    label: Datetime of Last Exposure to Treatment
    derivation:
      datetime_impute:
        source: TRTEDTC
        time: last
        missing: null
        invalid: null

  - name: TRTETPR
    type: str
    label: Last Exposure Date/Time Collected Precision
    derivation:
      datetime_precision:
        source: TRTEDTM
        missing: null

  - name: TRTETMF
    type: str
    label: Time of Last Exposure Imputation Flag
    derivation:
      case:
        - when: "TRTETPR = 'D'"
          then:
            literal: H
    verifications:
      allowed_values:
        values: [H]

  - name: TRTSDT
    type: date
    label: Date of First Exposure to Treatment
    derivation:
      to_date:
        source: TRTSDTM

  - name: TRTEDT
    type: date
    label: Date of Last Exposure to Treatment
    derivation:
      to_date:
        source: TRTEDTM

  - name: TRTDURD
    type: int
    label: Total Treatment Duration (Days)
    derivation:
      date_diff:
        start: TRTSDT
        end: TRTEDT
        unit: day
        bounds: inclusive
    verifications:
      range:
        min: 1

  - name: SAFFL
    type: str
    label: Safety Population Flag
    derivation:
      case:
        - when: "TRTSDT IS NOT NULL"
          then:
            literal: Y
        - otherwise:
            literal: N
    verifications:
      - not_missing: {}
      - allowed_values:
          values: [Y, N]

verifications:
  - unique:
      columns: [STUDYID, USUBJID]
  - row_count:
      min: 4
      max: 4
  - all_or_none:
      id: treatment-period-completeness
      columns: [TRTSDT, TRTSDTM, TRTEDT, TRTEDTM, TRTDURD]
  - implies:
      id: start-time-imputation-requires-a-start-datetime
      when: "TRTSTMF = 'H'"
      then: "TRTSDTM IS NOT NULL"
  - implies:
      id: end-time-imputation-requires-an-end-datetime
      when: "TRTETMF = 'H'"
      then: "TRTEDTM IS NOT NULL"
  - implies:
      id: placebo-subject-is-in-safety-population
      when: "TRT01A = 'PLACEBO'"
      then: "SAFFL = 'Y'"
