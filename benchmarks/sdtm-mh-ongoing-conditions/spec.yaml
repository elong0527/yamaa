schema_version: "1.0"
domain: MH
keys: [STUDYID, USUBJID, MHSEQ]
input:
  MH_FORM: input/mh_form.csv

output:
  path: mh.csv
  columns: [STUDYID, USUBJID, MHSEQ, MHTERM, MHSTDTC, MHENDTC, MHENRTPT, MHENTPT]
  order_by: [STUDYID, USUBJID, MHSEQ]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: MH_FORM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: MH_FORM.USUBJID

  - name: MHSEQ
    type: int
    label: Sequence Number
    derivation: MH_FORM.MHSEQ

  - name: MHTERM
    type: str
    label: Reported Term for the Medical History Condition
    derivation: MH_FORM.MHTERM
    verifications:
      not_missing: {}

  # The collected start year alone, or year and month joined with a hyphen.
  # A month with no year, or no year at all, leaves the start empty.
  - name: MHSTDTC
    type: str
    label: Start Date/Time of Medical History Condition
    derivation:
      case:
        - when: "MH_FORM.MHSTYY IS NOT NULL AND MH_FORM.MHSTMM IS NULL"
          then: MH_FORM.MHSTYY
        - when: "MH_FORM.MHSTYY IS NOT NULL AND MH_FORM.MHSTMM IS NOT NULL"
          then:
            str_template:
              template: "{MH_FORM.MHSTYY}-{MH_FORM.MHSTMM}"

  - name: MHENDTC
    type: str
    label: End Date/Time of Medical History Condition
    derivation: MH_FORM.MHENDTC

  # An ongoing answer of Y wins. Otherwise BEFORE when the end date is
  # earlier than the screening date (both compared as ISO 8601 text); an
  # end on or after screening, or a missing date, leaves it empty.
  - name: MHENRTPT
    type: str
    label: End Reference Relative to the Screening Visit
    derivation:
      case:
        - when: "MH_FORM.MHONGO = 'Y'"
          then: {literal: ONGOING}
        - when: "MHENDTC < MH_FORM.SCRFDTC"
          then: {literal: BEFORE}
    verifications:
      allowed_values:
        values: [ONGOING, BEFORE]

  - name: MHENTPT
    type: str
    label: Reference Time Point Name
    derivation:
      case:
        - when: "MHENRTPT IS NOT NULL"
          then: {literal: SCREENING}

verifications:
  - unique:
      columns: [STUDYID, USUBJID, MHSEQ]
  - row_count:
      min: 7
      max: 7
  - implies:
      id: ongoing-has-no-end-date
      when: "MHENRTPT = 'ONGOING'"
      then: "MHENDTC IS NULL"
  - implies:
      id: ended-before-has-end-date
      when: "MHENRTPT = 'BEFORE'"
      then: "MHENDTC IS NOT NULL"
  - implies:
      id: end-reference-names-screening
      when: "MHENRTPT IS NOT NULL"
      then: "MHENTPT = 'SCREENING'"
