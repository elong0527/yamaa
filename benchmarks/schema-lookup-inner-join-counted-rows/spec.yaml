yamaa: "1.0"
type: spec
domain: ADEX
keys: [STUDYID, USUBJID, EXSEQ, ADOSEN]
input:
  EX:
    path: input/ex.csv
    types: {EXSEQ: int, EXDOSE: float, EXSTDTC: date, EXENDTC: date}
  DAYS:
    path: input/dosing_days.csv
    types: {DOSEDAY: int}

output:
  path: adex.csv
  columns: [STUDYID, USUBJID, EXSEQ, EXTRT, EXDOSE, EXDOSU, ADOSEN, ASTDT]

intermediates:
  # The day of the protocol's dosing period that a collected record's last
  # administration falls on. A record the dosing period cannot hold finds no
  # day here and rejects the run: one that covers more days than the period
  # has, one that ends before it starts, and one with no start date.
  - id: LAST
    dataset: DAYS
    key:
      STUDYID: STUDYID
      DOSEDAY: NDAYS
    require_match: true

  # Each collected record with the number of days it covers, its first and
  # last day both counted. A record with no end date covers its start date
  # alone.
  - id: EXREC
    dataset: EX
    derivations:
      ENDDT:
        type: date
        derivation:
          first_available:
            sources: [EX.EXENDTC, EX.EXSTDTC]
      NDAYS:
        type: int
        derivation:
          diff:
            type: date
            start: EX.EXSTDTC
            end: ENDDT
            unit: day
            closed: both
      LASTDAY:
        type: int
        derivation: LAST.DOSEDAY

  # Each collected record paired with each day of the dosing period up to
  # its last day, which the record read from the dosing period itself. The
  # first administration is on the start date, so an administration lies
  # its number less one day after it.
  - id: ADMIN
    dataset: EXREC
    inner_join: DAYS
    key: [STUDYID]
    filter: "DAYS.DOSEDAY <= EXREC.LASTDAY"
    derivations:
      STUDYID: EXREC.STUDYID
      USUBJID: EXREC.USUBJID
      EXSEQ: EXREC.EXSEQ
      EXTRT: EXREC.EXTRT
      EXDOSE: EXREC.EXDOSE
      EXDOSU: EXREC.EXDOSU
      NDAYS: EXREC.NDAYS
      ADOSEN: DAYS.DOSEDAY
      OFFSET: "DAYS.DOSEDAY - 1"
      ASTDT:
        shift: {type: date, source: EXREC.EXSTDTC, days: OFFSET}

columns:
  - name: STUDYID
    type: str
    label: Study Identifier

  - name: USUBJID
    type: str
    label: Unique Subject Identifier

  - name: EXSEQ
    type: int
    label: Sequence Number

  - name: EXTRT
    type: str
    label: Name of Treatment

  - name: EXDOSE
    type: float
    label: Dose

  - name: EXDOSU
    type: str
    label: Dose Units

  # No administration is numbered before the first: a record that the dosing
  # period gives a day before day 1 rejects the run.
  - name: ADOSEN
    type: int
    label: Administration Sequence Number
    verifications:
      - range:
          min: 1

  - name: ASTDT
    type: date
    label: Analysis Start Date

  # How many days the collected record covers, and how many administrations
  # were built from it. Neither is in the output.
  - name: NDAYS
    type: int
    label: Number of Days Covered

  - name: NBUILT
    type: int
    label: Number of Administrations Built
    derivation:
      aggregate:
        group_by: [STUDYID, USUBJID, EXSEQ]
        expr: "COUNT(ADOSEN)"

rows:
  # One record per administration.
  - id: administration
    dataset: ADMIN
    derivations:
      STUDYID: ADMIN.STUDYID
      USUBJID: ADMIN.USUBJID
      EXSEQ: ADMIN.EXSEQ
      EXTRT: ADMIN.EXTRT
      EXDOSE: ADMIN.EXDOSE
      EXDOSU: ADMIN.EXDOSU
      ADOSEN: ADMIN.ADOSEN
      ASTDT: ADMIN.ASTDT
      NDAYS: ADMIN.NDAYS

verifications:
  # The record read only its last day from the dosing period. Its
  # administrations are numbered from 1 to that day and no number repeats
  # within a record, so as many administrations as the days it covers are
  # every day once, and a period that leaves an earlier day out builds fewer.
  - assert:
      id: a-record-builds-an-administration-for-every-day-it-covers
      require: "NBUILT = NDAYS"
