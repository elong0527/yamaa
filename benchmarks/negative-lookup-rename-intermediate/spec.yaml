yamaa: "1.0"
type: spec
model: SDTM
domain: CM
keys: [STUDYID, USUBJID, CMSEQ]
input:
  CM_RAW: input/cm_raw.csv
  CODING: {path: input/coding.csv, key: [STUDYID, USUBJID, CMSEQ]}
  WHODRUG: input/whodrug.csv
base: CM_RAW

output:
  path: cm.csv
  columns: [STUDYID, USUBJID, CMSEQ, CMTRT, CMDECOD]

intermediates:
  # CODED only renames CODING: it adds no filter, key, computed field or
  # projection, so the spec is rejected before any data is read.
  - id: CODED
    dataset: CODING
    key: [STUDYID, USUBJID, CMSEQ]
    absent: null

  - id: WHODRUG_LOOKUP
    dataset: WHODRUG
    key: {DRUG_RECORD_NO: CODING.DRUG_RECORD_NO, ATC_CODE: CODING.ATC_CODE}
    require_match: true

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: CM_RAW.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: CM_RAW.USUBJID

  - name: CMSEQ
    type: int
    label: Sequence Number
    derivation: CM_RAW.CMSEQ

  - name: CMTRT
    type: str
    label: Reported Name of Drug, Med, or Therapy
    derivation: CM_RAW.CMTRT

  - name: CMDECOD
    type: str
    label: Standardized Medication Name
    derivation: WHODRUG_LOOKUP.PREFERRED_NAME
