schema_version: "1.0"
domain: ADLB
keys: [STUDYID, USUBJID, PARAMCD]
input:
  LB: input/lb.csv

output:
  path: adlb.csv
  columns: [STUDYID, USUBJID, PARAMCD, AVAL, AVALTOT]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: LB.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: LB.USUBJID

  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation: LB.LBTESTCD

  - name: AVAL
    type: float
    label: Analysis Value
    derivation: LB.LBSTRESN

  # The defect: SUM totals several records, but a row formula sees one
  # record at a time, so the specification is rejected before any data is
  # read.
  - name: AVALTOT
    type: float
    label: Total Analysis Value
    derivation:
      compute:
        expr: "SUM(AVAL)"
