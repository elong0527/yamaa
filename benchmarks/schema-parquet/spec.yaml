yamaa: "1.0"
type: spec
model: ADaM
domain: ADSL
keys: [STUDYID, USUBJID]
# Parquet fields carry their own types, so the input declares none.
input:
  DM: input/dm.parquet

output:
  path: adsl.parquet
  columns: [STUDYID, USUBJID, AGE]
  report: adsl-violations.parquet

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  - name: AGE
    type: int
    label: Age
    derivation: DM.AGE
    # A warning, not an error: an age outside 18 to 100 stays in the output
    # and its subject is listed in the run report instead of stopping the run.
    verifications:
      - range:
          min: 18
          max: 100
          severity: warning
