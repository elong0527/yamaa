schema_version: "1.0"
domain: ADSL
keys: [STUDYID, USUBJID]
# Parquet fields carry their own types, so the input declares none.
input:
  DM: input/dm.parquet

output:
  path: adsl.parquet
  columns: [STUDYID, USUBJID, AGE]
  warning_log: adsl-violations.parquet

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  - name: AGE
    type: int
    label: Age
    derivation: DM.AGE
    # A warning, not a failure: an age outside 18-100 stays in the output
    # and is listed in the warning log.
    verifications:
      - range:
          min: 18
          max: 100
          severity: warning
