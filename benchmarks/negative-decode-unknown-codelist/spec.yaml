yamaa: "1.0"
type: spec
model: ADaM
domain: ADLB
keys: [STUDYID, USUBJID, PARAMCD]
input:
  LB: input/lb.csv

output:
  path: adlb.csv
  columns: [STUDYID, USUBJID, PARAMCD, PARAM]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: LB.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: LB.USUBJID

  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation: LB.LBTESTCD

  # The defect: PARAM is the name of the CDISC codelist of parameter names,
  # which this study does not declare; its codes and their names are the items
  # of PARAMCD, so the spec is rejected before any data is read.
  - name: PARAM
    type: str
    label: Parameter
    derivation:
      decode:
        source: PARAMCD
        codelist: PARAM
