# Fixed creation time is supplied by the submission call in benchmark.yaml.
yamaa: "1.0"
type: project
# Each codelist is named for the dataset and variable it serves, as submitted
# data-definition documents commonly name them, so its identifier carries a
# period.
codelists:
- codelists:
  - id: ADSL.ARMCD
    name: Planned Arm Code
    items:
    - {value: PBO, decode: Placebo}
    - {value: VITD, decode: Vitamin D3}
  - id: ADSL.ARM
    name: Description of Planned Arm
    items:
    - value: Placebo
    - value: Vitamin D3
study:
  id: CATH
  name: CATH
  description: Example study naming its codelists by dataset and variable
  protocol_name: CATH-01

adam:
  specs:
  - spec.yaml
  standards:
  - name: ADaMIG
    version: '1.3'
    status: Final
  define: define.xml
  context: Other
  source_system_version: '1.0'
