schema_version: "1.0"
domain: ADLB
keys: [USUBJID, VISIT, PARAMCD]
input:
  # SDTM LB: the laboratory domain as the ADaM programmer receives it.
  # Absolute differentials (LYMPH, ...) are not LB tests; they appear
  # here only when the lab reported them, which blocks derivation.
  LB: {path: input/lb.csv, types: {LBSTRESN: float}}

output:
  path: adlb.csv
  columns: [USUBJID, PARAMCD, AVAL, PARAM, VISIT, DTYPE]

columns:
  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: LB.USUBJID

  - name: VISIT
    type: str
    label: Visit Name
    derivation: LB.VISIT

  - name: PARAMCD
    type: str
    label: Parameter Code

  - name: PARAM
    type: str
    label: Parameter

  # The visit's WBC count, the fraction of the differential this template
  # adds, and how many records of the new absolute parameter it already
  # has, gathered to decide whether to add an absolute record. Every row
  # template must set them, so collected rows set them empty; none is output.
  - name: WBCVAL
    type: float
    label: White Blood Cell Count

  - name: FRACVAL
    type: float
    label: Differential Fraction

  - name: EXISTING_ABS_COUNT
    type: int
    label: Existing Absolute Differential Record Count

  - name: AVAL
    type: float
    label: Analysis Value

  - name: DTYPE
    type: str
    label: Derivation Type

rows:
  # Every collected record, unchanged.
  - id: collected
    derivations:
      PARAMCD: LB.LBTESTCD
      PARAM: LB.LBTEST
      WBCVAL: {literal: null}
      FRACVAL: {literal: null}
      EXISTING_ABS_COUNT: {literal: null}
      AVAL: LB.LBSTRESN
      DTYPE: {literal: null}

  # One absolute record per subject, visit, and differential that has a WBC
  # count and a fraction result and no absolute record yet. ONLY() stops the
  # run if the visit has more than one of either contributing value; COUNT()
  # of no absolute records is empty, not 0. Each differential is gated
  # independently: the fraction filter and the existing-record filter change
  # per template, the WBC gate does not.
  - id: derived_lymph
    group_by: [LB.USUBJID, LB.VISIT]
    filter: >-
      WBCVAL IS NOT NULL
      AND FRACVAL IS NOT NULL
      AND EXISTING_ABS_COUNT IS NULL
    derivations:
      PARAMCD: {literal: LYMPH}
      PARAM: {literal: Lymphocytes Abs (10^9/L)}
      WBCVAL:
        aggregate:
          filter: "LB.LBTESTCD = 'WBC'"
          expr: "ONLY(LB.LBSTRESN)"
      FRACVAL:
        aggregate:
          filter: "LB.LBTESTCD = 'LYMLE'"
          expr: "ONLY(LB.LBSTRESN)"
      EXISTING_ABS_COUNT:
        aggregate:
          filter: "LB.LBTESTCD = 'LYMPH'"
          expr: "COUNT(LB.*)"
      AVAL:
        compute:
          expr: "WBCVAL * FRACVAL"
      DTYPE: {literal: CALCULATION}

  - id: derived_neut
    group_by: [LB.USUBJID, LB.VISIT]
    filter: >-
      WBCVAL IS NOT NULL
      AND FRACVAL IS NOT NULL
      AND EXISTING_ABS_COUNT IS NULL
    derivations:
      PARAMCD: {literal: NEUT}
      PARAM: {literal: Neutrophils Abs (10^9/L)}
      WBCVAL:
        aggregate:
          filter: "LB.LBTESTCD = 'WBC'"
          expr: "ONLY(LB.LBSTRESN)"
      FRACVAL:
        aggregate:
          filter: "LB.LBTESTCD = 'NEUTLE'"
          expr: "ONLY(LB.LBSTRESN)"
      EXISTING_ABS_COUNT:
        aggregate:
          filter: "LB.LBTESTCD = 'NEUT'"
          expr: "COUNT(LB.*)"
      AVAL:
        compute:
          expr: "WBCVAL * FRACVAL"
      DTYPE: {literal: CALCULATION}

  - id: derived_mono
    group_by: [LB.USUBJID, LB.VISIT]
    filter: >-
      WBCVAL IS NOT NULL
      AND FRACVAL IS NOT NULL
      AND EXISTING_ABS_COUNT IS NULL
    derivations:
      PARAMCD: {literal: MONO}
      PARAM: {literal: Monocytes Abs (10^9/L)}
      WBCVAL:
        aggregate:
          filter: "LB.LBTESTCD = 'WBC'"
          expr: "ONLY(LB.LBSTRESN)"
      FRACVAL:
        aggregate:
          filter: "LB.LBTESTCD = 'MONOLE'"
          expr: "ONLY(LB.LBSTRESN)"
      EXISTING_ABS_COUNT:
        aggregate:
          filter: "LB.LBTESTCD = 'MONO'"
          expr: "COUNT(LB.*)"
      AVAL:
        compute:
          expr: "WBCVAL * FRACVAL"
      DTYPE: {literal: CALCULATION}

  - id: derived_eos
    group_by: [LB.USUBJID, LB.VISIT]
    filter: >-
      WBCVAL IS NOT NULL
      AND FRACVAL IS NOT NULL
      AND EXISTING_ABS_COUNT IS NULL
    derivations:
      PARAMCD: {literal: EOS}
      PARAM: {literal: Eosinophils Abs (10^9/L)}
      WBCVAL:
        aggregate:
          filter: "LB.LBTESTCD = 'WBC'"
          expr: "ONLY(LB.LBSTRESN)"
      FRACVAL:
        aggregate:
          filter: "LB.LBTESTCD = 'EOSLE'"
          expr: "ONLY(LB.LBSTRESN)"
      EXISTING_ABS_COUNT:
        aggregate:
          filter: "LB.LBTESTCD = 'EOS'"
          expr: "COUNT(LB.*)"
      AVAL:
        compute:
          expr: "WBCVAL * FRACVAL"
      DTYPE: {literal: CALCULATION}

  - id: derived_baso
    group_by: [LB.USUBJID, LB.VISIT]
    filter: >-
      WBCVAL IS NOT NULL
      AND FRACVAL IS NOT NULL
      AND EXISTING_ABS_COUNT IS NULL
    derivations:
      PARAMCD: {literal: BASO}
      PARAM: {literal: Basophils Abs (10^9/L)}
      WBCVAL:
        aggregate:
          filter: "LB.LBTESTCD = 'WBC'"
          expr: "ONLY(LB.LBSTRESN)"
      FRACVAL:
        aggregate:
          filter: "LB.LBTESTCD = 'BASOLE'"
          expr: "ONLY(LB.LBSTRESN)"
      EXISTING_ABS_COUNT:
        aggregate:
          filter: "LB.LBTESTCD = 'BASO'"
          expr: "COUNT(LB.*)"
      AVAL:
        compute:
          expr: "WBCVAL * FRACVAL"
      DTYPE: {literal: CALCULATION}

verifications:
  - unique:
      columns: [USUBJID, VISIT, PARAMCD]
  - row_count:
      min: 29
      max: 29
