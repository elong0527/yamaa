schema_version: "1.0"
domain: ADLB
keys: [USUBJID, VISIT, PARAMCD]
input:
  ADLB_RAW: {path: input/adlb.csv, types: {AVAL: float}}

output:
  path: adlb.csv
  columns: [USUBJID, PARAMCD, AVAL, PARAM, VISIT, DTYPE]

columns:
  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: ADLB_RAW.USUBJID

  - name: VISIT
    type: str
    label: Visit Name
    derivation: ADLB_RAW.VISIT

  - name: PARAMCD
    type: str
    label: Parameter Code

  - name: PARAM
    type: str
    label: Parameter

  # The visit's WBC count and LYMLE fraction, and how many LYMPH records it
  # already has, gathered to decide whether to add a LYMPH record. Every row
  # template must set them, so collected rows set them empty; none is output.
  - name: WBCVAL
    type: float
    label: White Blood Cell Count

  - name: LYMLEVAL
    type: float
    label: Lymphocyte Fraction

  - name: EXISTING_ABS_COUNT
    type: int
    label: Existing Absolute Lymphocyte Record Count

  - name: AVAL
    type: float
    label: Analysis Value

  - name: DTYPE
    type: str
    label: Derivation Type

rows:
  # Every collected record, unchanged.
  - id: collected
    derivations:
      PARAMCD: {source: ADLB_RAW.PARAMCD}
      PARAM: {source: ADLB_RAW.PARAM}
      WBCVAL: {literal: null}
      LYMLEVAL: {literal: null}
      EXISTING_ABS_COUNT: {literal: null}
      AVAL: {source: ADLB_RAW.AVAL}
      DTYPE: {literal: null}

  # One LYMPH record per subject and visit that has a WBC and a LYMLE result
  # and no LYMPH record yet. ONLY() stops the run if the visit has more than
  # one of either; COUNT() of no LYMPH records is empty, not 0.
  - id: derived_lymph
    group_by: [ADLB_RAW.USUBJID, ADLB_RAW.VISIT]
    filter: >-
      WBCVAL IS NOT NULL
      AND LYMLEVAL IS NOT NULL
      AND EXISTING_ABS_COUNT IS NULL
    derivations:
      PARAMCD: {literal: LYMPH}
      PARAM: {literal: Lymphocytes Abs (10^9/L)}
      WBCVAL:
        aggregate:
          filter: "ADLB_RAW.PARAMCD = 'WBC'"
          expr: "ONLY(ADLB_RAW.AVAL)"
      LYMLEVAL:
        aggregate:
          filter: "ADLB_RAW.PARAMCD = 'LYMLE'"
          expr: "ONLY(ADLB_RAW.AVAL)"
      EXISTING_ABS_COUNT:
        aggregate:
          filter: "ADLB_RAW.PARAMCD = 'LYMPH'"
          expr: "COUNT(ADLB_RAW.*)"
      AVAL:
        compute:
          expr: "WBCVAL * LYMLEVAL"
      DTYPE: {literal: CALCULATION}

verifications:
  - unique:
      columns: [USUBJID, VISIT, PARAMCD]
  - row_count:
      min: 15
      max: 15
