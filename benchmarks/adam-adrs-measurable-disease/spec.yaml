schema_version: "1.0"
domain: ADRS
keys: [STUDYID, USUBJID, PARAMCD]
input:
  ADSL: input/adsl.csv
  TU: input/tu.csv
base: ADSL
intermediates:
  # The subject's screening tumor identification records showing target
  # disease, matched on STUDYID and USUBJID. Only whether one exists is
  # read; keep: first picks one when there are several.
  - id: TU_TARGET
    dataset: TU
    filter: >-
      TU.TUTESTCD = 'TUMIDENT' AND TU.VISIT = 'SCREENING'
      AND TU.TUSTRESC = 'TARGET'
    order_by: [TU.TUSEQ]
    keep: first

output:
  path: adrs.csv
  columns: [STUDYID, USUBJID, PARAMCD, PARAM, AVALC, AVAL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: ADSL.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: ADSL.USUBJID

  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation: {literal: MDIS}

  - name: PARAM
    type: str
    label: Parameter
    derivation: {literal: Measurable Disease at Baseline}

  - name: AVALC
    type: str
    label: Analysis Value (C)
    derivation:
      flag:
        condition: "TU_TARGET.TUSTRESC IS NOT NULL"
        false_value: "N"
    verifications:
      - not_missing: {}
      - allowed_values:
          values: [Y, N]

  - name: AVAL
    type: int
    label: Analysis Value
    derivation:
      mapping:
        source: AVALC
        dict:
          Y: 1
          N: 0
    verifications:
      - not_missing: {}
      - range:
          min: 0
          max: 1

verifications:
  - unique:
      columns: [STUDYID, USUBJID, PARAMCD]
  - row_count:
      min: 6
      max: 6
