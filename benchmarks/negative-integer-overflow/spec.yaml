schema_version: "1.0"
domain: ADLB
keys: [STUDYID, USUBJID]
input:
  LB: input/lb.csv

output:
  path: adlb.csv
  columns: [STUDYID, USUBJID, CELLTOT]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: LB.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: LB.USUBJID

  - name: CELLCNT
    type: int
    label: Cell Concentration
    derivation: LB.CELLCNT

  - name: VOLUML
    type: int
    label: Sample Volume (L)
    derivation: LB.VOLUML

  - name: CELLTOT
    type: int
    label: Total Cell Count
    derivation:
      compute:
        expr: "CELLCNT * VOLUML"
