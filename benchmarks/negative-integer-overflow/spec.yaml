schema_version: "1.0"
domain: ADLB
keys: [STUDYID, USUBJID]
input:
  LB: input/lb.csv

output:
  path: adlb.csv
  columns: [STUDYID, USUBJID, CELLTOT]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: LB.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: LB.USUBJID

  # The input declares no types, so these two columns read the collected
  # text as whole numbers for the product below.
  - name: CELLCNT
    type: int
    label: Cell Concentration
    derivation: LB.CELLCNT

  - name: VOLUML
    type: int
    label: Sample Volume (L)
    derivation: LB.VOLUML

  # A whole-number product beyond the signed 64-bit range fails the run
  # rather than wrapping or becoming an approximate value.
  - name: CELLTOT
    type: int
    label: Total Cell Count
    derivation:
      compute:
        expr: "CELLCNT * VOLUML"
