yamaa: "1.0"
type: spec
model: ADaM
domain: ADLB
keys: [USUBJID, LBSEQ]
input:
  LB:
    path: input/lb.csv
    types: {LBSEQ: int, ADT: date, AVAL: float, TRTSDT: date}

output:
  path: adlb.csv
  columns: [USUBJID, LBSEQ, ADT, ATM, AVAL, TRTSDT, ABLFL]

columns:
  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: LB.USUBJID

  - name: LBSEQ
    type: int
    label: Sequence Number
    derivation: LB.LBSEQ

  - name: ADT
    type: date
    label: Analysis Date
    derivation: LB.ADT

  - name: ATM
    type: str
    label: Analysis Time
    derivation: LB.ATM

  - name: AVAL
    type: float
    label: Analysis Value
    derivation: LB.AVAL

  - name: TRTSDT
    type: date
    label: Date of First Exposure to Treatment
    derivation: LB.TRTSDT

  # The latest result on or before treatment start, same-day results ordered
  # by collection time. Two results sharing that date and time still tie,
  # and the run stops rather than pick one.
  - name: ABLFL
    type: str
    label: Baseline Record Flag
    derivation:
      baseline_flag:
        date: ADT
        reference: TRTSDT
        source: AVAL
        window:
          group_by: [USUBJID]
          order_by: [ADT, ATM]
