schema_version: "1.0"
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  DM:
    path: input/dm.csv
    # Intentionally invalid: the producing DM specification types RANDDT.
    types: {RANDDT: date}
    schema: input/dm.schema.yaml

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, RANDDT]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  - name: RANDDT
    type: date
    label: Date of Randomization
    derivation: DM.RANDDT
