yamaa: "1.0"
type: spec
model: SDTM
domain: DM
keys: [STUDYID, USUBJID]
input:
  ODM: input/odm.csv

output:
  path: dm.csv
  columns: [DOMAIN, STUDYID, USUBJID, RFICDTC, BRTHDTC, AGE, AGEU]

columns:
  - name: DOMAIN
    type: str
    label: Domain Abbreviation
    derivation: "'DM'"

  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: ODM.StudyOID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: ODM.SubjectKey

  - name: RFICDTC
    type: date
    label: Date/Time of Informed Consent
    derivation:
      source:
        filter: ODM.ItemOID = 'IT.DM.RFICDTC'
        variable: ODM.Value
    verifications:
      - not_missing

  - name: BRTHDTC
    type: str
    label: Date/Time of Birth
    derivation:
      source:
        filter: ODM.ItemOID = 'IT.DM.BRTHDT'
        variable: ODM.Value

  # year, month or day by how much of the birth date was collected;
  # missing when none was.
  - name: BRTH_PREC
    type: str
    label: Collected Precision of the Birth Date
    derivation:
      precision:
        type: date
        source: BRTHDTC

  # Only a complete birth date becomes a date; a year-month or year-only
  # one gives none, and so no age.
  - name: BRTHDT
    type: date
    label: Birth Date as a Date
    derivation:
      case:
        - when: "BRTH_PREC = 'day'"
          then: BRTHDTC
        - otherwise: null

  # Completed years from birth to informed consent: one fewer when the
  # birthday falls after the consent date's month and day.
  - name: AGE
    type: int
    label: Age in AGEU at RFICDTC
    derivation:
      case:
        - when: "BRTH_PREC = 'day'"
          then:
            diff:
              type: date
              start: BRTHDT
              end: RFICDTC
              unit: year
        - otherwise: null

  - name: AGEU
    type: str
    label: Age Units
    derivation:
      case:
        - when: "AGE IS NOT NULL"
          then: "'YEARS'"
        - otherwise: null

verifications:
  - row_count:
      min: 5
      max: 5
  - all_or_none:
      id: age-unit-completeness
      columns: [AGE, AGEU]
  - assert:
      id: complete-birth-date-gives-age
      when: "BRTH_PREC = 'day'"
      require: "AGE IS NOT NULL"
  - assert:
      id: partial-birth-date-gives-no-age
      when: "BRTH_PREC IN ('month', 'year') OR BRTHDTC IS NULL"
      require: "AGE IS NULL"
  - assert:
      id: age-is-not-negative
      when: "AGE IS NOT NULL"
      require: "AGE >= 0"
