yamaa: "1.0"
type: spec
model: ADaM
domain: ADAE
keys: [STUDYID, USUBJID, AESEQ]
input:
  AE: {path: input/ae.csv, types: {AESEQ: int}}
  SUPPAE: {path: input/suppae.csv, types: {IDVARVAL: int}}
base: AE

output:
  path: adae.csv
  columns: [STUDYID, USUBJID, AESEQ, AEXSITE, AEXCAUS]

intermediates:
  # The listed qualifier names are the only ones the event's qualifier
  # records may carry: a record named otherwise stops the run.
  - id: QUAL
    dataset: SUPPAE
    key: {STUDYID: AE.STUDYID, USUBJID: AE.USUBJID, IDVARVAL: AE.AESEQ}
    filter: "SUPPAE.RDOMAIN = 'AE' AND SUPPAE.IDVAR = 'AESEQ'"
    pivot: {name: QNAM, value: QVAL, fields: [AEXSITE, AEXCAUS]}

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: AE.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: AE.USUBJID

  - name: AESEQ
    type: int
    label: Sequence Number
    derivation: AE.AESEQ

  - name: AEXSITE
    type: str
    label: Location Detail
    derivation: QUAL.AEXSITE

  - name: AEXCAUS
    type: str
    label: Suspected Cause
    derivation: QUAL.AEXCAUS
