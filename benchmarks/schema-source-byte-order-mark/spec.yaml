yamaa: "1.0"

type: spec

model: ADaM
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  # Saved by a spreadsheet program as UTF-8 text: the file starts with one
  # byte-order mark, which the declaration skips, and its records end in
  # CR LF.
  DM:
    path: input/dm.csv
    byte_order_mark: true

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, SITENM]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  - name: SITENM
    type: str
    label: Study Site Name
    derivation: DM.SITENM
