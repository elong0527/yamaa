schema_version: "1.0"
domain: ADLB
keys: [STUDYID, USUBJID, PARAMCD]
input:
  LB: {path: input/lb.csv, types: {AVAL: float, ANRLO: float}}

output:
  path: adlb.csv
  # Every float column is written with exactly four decimals, rounded once
  # as the file is written, an exact half going away from zero.
  decimals: 4
  columns: [STUDYID, USUBJID, PARAMCD, AVAL, ANRLO, R2ANRLO]
  order_by: [USUBJID]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: LB.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: LB.USUBJID

  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation: LB.PARAMCD

  - name: AVAL
    type: float
    label: Analysis Value
    derivation: LB.AVAL

  - name: ANRLO
    type: float
    label: Analysis Normal Range Lower Limit
    derivation: LB.ANRLO

  # NULLIF turns a zero lower limit into missing, so the ratio is empty
  # instead of dividing by zero; a missing result or limit also leaves it
  # empty.
  - name: R2ANRLO
    type: float
    label: Ratio to Lower Limit of Normal
    derivation:
      compute:
        expr: "AVAL / NULLIF(ANRLO, 0)"

verifications:
  - unique:
      columns: [STUDYID, USUBJID, PARAMCD]
  - row_count:
      min: 5
      max: 5
  - implies:
      id: ratio-needs-a-usable-lower-limit
      when: "R2ANRLO IS NULL"
      then: "AVAL IS NULL OR ANRLO IS NULL OR ANRLO = 0"
