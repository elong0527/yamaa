schema_version: "1.0"
domain: LB
keys: [STUDYID, USUBJID, LBSEQ]
input:
  LB_RAW:
    path: input/lb_raw.csv
    types: {LBSEQ: int, LBSTRESN: float}
  DM:
    path: input/dm.csv
    types: {AGE: int}
  LBRANGE:
    path: input/lbrange.csv
    types: {AGELO: int, AGEHI: int, LBSTNRLO: float, LBSTNRHI: float}
base: LB_RAW

output:
  path: lb.csv
  columns: [STUDYID, USUBJID, LBSEQ, LBTESTCD, LBSTRESN, LBSTNRLO, LBSTNRHI]

intermediates:
  # The reference range for the result's test code whose age band holds the
  # subject's age. DM.AGE names a demographics record, and a laboratory row is
  # built from a laboratory record, so the specification is rejected before
  # any data is read.
  - id: REFRANGE
    dataset: LBRANGE
    key: [LBTESTCD]
    between: {value: DM.AGE, lower: AGELO, upper: AGEHI}
    no_match: null

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: LB_RAW.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: LB_RAW.USUBJID

  - name: LBSEQ
    type: int
    label: Sequence Number
    derivation: LB_RAW.LBSEQ

  - name: LBTESTCD
    type: str
    label: Lab Test or Examination Short Name
    derivation: LB_RAW.LBTESTCD

  - name: LBSTRESN
    type: float
    label: Numeric Result/Finding in Standard Units
    derivation: LB_RAW.LBSTRESN

  - name: LBSTNRLO
    type: float
    label: Reference Range Lower Limit-Std Units
    derivation: REFRANGE.LBSTNRLO

  - name: LBSTNRHI
    type: float
    label: Reference Range Upper Limit-Std Units
    derivation: REFRANGE.LBSTNRHI
