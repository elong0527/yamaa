schema_version: "1.0"
domain: ADTR
keys: [STUDYID, USUBJID, AVISIT]
input:
  TRVISIT: input/trvisit.csv
  TR: {path: input/tr.csv, types: {TRSTRESN: float}}
  TU: input/tu.csv
base: TRVISIT

output:
  path: adtr.csv
  columns: [STUDYID, USUBJID, AVISIT, AVISITN, ADT, PARAMCD, PARAM, AVAL, NMEAS, NTARGET, ANL01FL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: TRVISIT.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: TRVISIT.USUBJID

  - name: AVISIT
    type: str
    label: Analysis Visit
    derivation: TRVISIT.AVISIT

  - name: AVISITN
    type: int
    label: Analysis Visit (N)
    derivation: TRVISIT.AVISITN

  - name: ADT
    type: date
    label: Analysis Date
    derivation: TRVISIT.ADT

  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation: {literal: SDIAM}

  - name: PARAM
    type: str
    label: Parameter
    derivation: {literal: Sum of Target Lesion Diameters (mm)}

  # The subject's target-lesion longest diameters at this visit (TR matches
  # on study, subject and visit). A missing result is skipped; a visit with
  # no such record leaves both AVAL and NMEAS empty, not 0, while records
  # with no result at all give NMEAS 0 and still leave AVAL empty.
  - name: AVAL
    type: float
    label: Analysis Value
    derivation:
      aggregate:
        filter: "TR.TRGRPID = 'TARGET' AND TR.TRTESTCD = 'LDIAM'"
        expr: "SUM(TR.TRSTRESN)"

  - name: NMEAS
    type: int
    label: Number of Measured Target Lesions
    derivation:
      aggregate:
        filter: "TR.TRGRPID = 'TARGET' AND TR.TRTESTCD = 'LDIAM'"
        expr: "COUNT(TR.TRSTRESN)"

  # TU has no visit, so it matches on study and subject alone: the same
  # count at every visit of the subject.
  - name: NTARGET
    type: int
    label: Number of Target Lesions
    derivation:
      aggregate:
        filter: "TU.TUGRPID = 'TARGET'"
        expr: "COUNT(TU.TULNKID)"

  - name: ANL01FL
    type: str
    label: Analysis Record Flag 01
    derivation:
      flag: "NMEAS = NTARGET"
    verifications:
      allowed_values:
        values: [Y]

verifications:
  - unique:
      columns: [STUDYID, USUBJID, AVISIT]
  - row_count:
      min: 9
      max: 9
  - assert:
      id: measured-lesions-do-not-exceed-the-target-lesions
      expr: "NMEAS IS NULL OR NMEAS <= NTARGET"
  - implies:
      id: complete-assessment-has-a-sum
      when: "ANL01FL = 'Y'"
      then: "AVAL IS NOT NULL"
