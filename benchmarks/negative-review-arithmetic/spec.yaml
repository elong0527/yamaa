schema_version: "1.0"
domain: ADAE
keys: [STUDYID, USUBJID, AESEQ]
input:
  AE:
    path: input/ae.csv
    types: {AESEQ: int, AESTDTC: date}

output: {path: adae.csv, columns: [STUDYID, USUBJID, AESEQ, REVIEWFL]}

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: AE.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: AE.USUBJID

  - name: AESEQ
    type: int
    label: Sequence Number
    derivation: AE.AESEQ

  # Intentionally invalid: a condition compares named values and cannot
  # do arithmetic, so AESEQ + 1 is refused.
  - name: REVIEWFL
    type: str
    label: Protocol Review Flag
    derivation:
      case:
        - when: "AE.AESEQ + 1 > 1"
          then: {literal: Y}
        - otherwise: {literal: N}
