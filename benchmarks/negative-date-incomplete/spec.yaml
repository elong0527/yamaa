schema_version: "1.0"
domain: ADAE
keys: [STUDYID, USUBJID, AESEQ]
input:
  AE: input/ae.csv

output:
  path: adae.csv
  columns: [STUDYID, USUBJID, AESEQ, ASTDT]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: AE.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: AE.USUBJID

  - name: AESEQ
    type: int
    label: Sequence Number
    derivation: AE.AESEQ

  # The collected start text is read as a date as it stands: nothing
  # completes a partial date and nothing replaces text that is not a date,
  # so a start collected to the month only stops the run.
  - name: ASTDT
    type: date
    label: Analysis Start Date
    derivation:
      value:
        source: AE.AESTDTC
      strict: true
