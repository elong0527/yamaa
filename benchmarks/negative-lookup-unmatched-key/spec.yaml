yamaa: "1.0"
type: spec
model: SDTM
domain: LB
keys: [STUDYID, USUBJID, LBSEQ]
input:
  LB_RAW: input/lb_raw.csv
  LBRANGE: input/lbrange.csv
base: LB_RAW

output:
  path: lb.csv
  columns: [STUDYID, USUBJID, LBSEQ, LBTESTCD, SEX, LBSTNRHI]

intermediates:
  # The limit for the result's test code and sex. A match is required, so a
  # result whose test code and sex match no table row stops the run.
  - id: REFRANGE
    dataset: LBRANGE
    key: [LBTESTCD, SEX]
    require_match: true

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: LB_RAW.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: LB_RAW.USUBJID

  - name: LBSEQ
    type: int
    label: Sequence Number
    derivation: LB_RAW.LBSEQ

  - name: LBTESTCD
    type: str
    label: Lab Test or Examination Short Name
    derivation: LB_RAW.LBTESTCD

  - name: SEX
    type: str
    label: Sex
    derivation: LB_RAW.SEX

  - name: LBSTNRHI
    type: float
    label: Reference Range Upper Limit-Std Units
    derivation: REFRANGE.NRHI
