schema_version: "1.0"
domain: ADSL
keys: [STUDYID, USUBJID]

# The path is declared relative to this shared file. The parent traversal
# reaches the study input beside the entry specification.
input:
  DM:
    path: ../input/dm.csv
    types:
      AGE: int
base: DM

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  - name: AGE
    type: int
    label: Age
    derivation: DM.AGE

metadata:
  scope: common
