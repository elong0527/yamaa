yamaa: "1.0"
type: spec
model: ADaM
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  DM: {path: input/dm.csv, types: {RFXSTDT: date}}
  EX: {path: input/ex.csv, types: {EXSEQ: int, EXSTDT: date}}
  PERIODS:
    path: input/periods.csv
    types: {APERIOD: int, APERSDT: date, APEREDT: date}
base: DM

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, TR02SDT]

intermediates:
  # The subject's period that holds a date. P2DOSE's derivation reads it
  # once for each exposure record, which is the only record there: the
  # subject's demographics record DM.RFXSTDT names is not, so the
  # specification is rejected before any data is read.
  - id: PERIOD
    dataset: PERIODS
    key: [STUDYID, USUBJID]
    between: {value: DM.RFXSTDT, lower: APERSDT, upper: APEREDT}

  # Each exposure record's period, then the subject's first dose in period 2.
  - id: P2DOSE
    dataset: EX
    key: [STUDYID, USUBJID]
    filter: "EX.DOSEPER = 2"
    order_by: [EX.EXSTDT]
    keep: first
    derivations:
      DOSEPER: PERIOD.APERIOD

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  - name: TR02SDT
    type: date
    label: Date of First Exposure in Period 02
    derivation: P2DOSE.EXSTDT
