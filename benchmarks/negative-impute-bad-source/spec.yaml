schema_version: "1.0"
domain: ADAE
keys: [STUDYID, USUBJID, AESEQ]
input:
  AE: input/ae.csv

output:
  path: adae.csv
  columns: [STUDYID, USUBJID, AESEQ, ASTDT]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: AE.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: AE.USUBJID

  - name: AESEQ
    type: int
    label: Sequence Number
    derivation: AE.AESEQ

  # Month 1 and day 1 give the earliest date the text allows. No outcome is
  # declared for a missing onset or for text that is not a date (UNKNOWN), so
  # either one stops the run.
  - name: ASTDT
    type: date
    label: Analysis Start Date
    derivation:
      date_impute:
        source: AE.AESTDTC
        month: 1
        day: 1
