schema_version: "1.0"
domain: ADLBC
keys: [STUDYID, USUBJID, PARAMCD, AVISITN]
input:
  LB:
    path: input/lb.csv
output:
  path: adlbc.csv
  columns: [STUDYID, USUBJID, PARAMCD, AVISITN, AVAL, PREV_AVAL, CHG, PREV2]

windows:
  VISIT_ORDER:
    group_by: [USUBJID, PARAMCD]
    order_by: [AVISITN]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: LB.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: LB.USUBJID

  - name: PARAMCD
    type: str
    label: Parameter Code

  - name: AVISITN
    type: int
    label: Analysis Visit Number
    derivation: LB.VISITNUM

  - name: AVAL
    type: float
    label: Analysis Value
    derivation: LB.LBSTRESN

  - name: PREV_AVAL
    type: float
    label: Previous Analysis Value
    derivation:
      row_value:
        source: AVAL
        offset: -1
        window: VISIT_ORDER

  - name: CHG
    type: float
    label: Change from Previous Value
    derivation:
      compute:
        expr: "AVAL - PREV_AVAL"

  # PREV2 chains on the finished CHG: the previous visit's change is
  # read after CHG is complete for every row in the window.
  - name: PREV2
    type: float
    label: Lag of Change
    derivation:
      row_value:
        source: CHG
        offset: -1
        window: VISIT_ORDER

rows:
  # One row per albumin record with a numeric result. The window
  # orders rows by visit number within each subject, so a skipped or
  # uncollected visit never appears in the chain.
  - id: change_alb
    dataset: LB
    filter: "LB.LBTESTCD = 'ALB' AND LB.LBSTRESN IS NOT NULL"
    derivations:
      PARAMCD: {literal: "_ALB"}
