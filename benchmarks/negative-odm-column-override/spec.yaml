schema_version: "1.0"
domain: DM
keys: [STUDYID, USUBJID]
input:
  ODM: input/odm.csv

output:
  path: dm.csv
  columns: [STUDYID, USUBJID, SEX]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier

  - name: USUBJID
    type: str
    label: Unique Subject Identifier

  # An item read is not row-local, so it is not a default the template
  # below may override: the template deriving SEX derives it twice.
  - name: SEX
    type: str
    label: Sex
    derivation: {odm: ODM.IT.DM.SEX}

rows:
  - id: subjects
    dataset: ODM
    group_by: [ODM.StudyOID, ODM.SubjectKey]
    derivations:
      STUDYID: ODM.StudyOID
      USUBJID: ODM.SubjectKey
      SEX: {literal: U}
