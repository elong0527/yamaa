schema_version: "1.0"
domain: ADVS
keys: [STUDYID, USUBJID, PARAMCD, AVISIT]
input:
  ADVS_RAW: input/advs_raw.csv

output:
  path: advs.csv
  columns: [STUDYID, USUBJID, PARAMCD, VSSEQ, ADT, ADY, AVAL, AVISIT]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: ADVS_RAW.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: ADVS_RAW.USUBJID

  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation: ADVS_RAW.PARAMCD

  - name: VSSEQ
    type: int
    label: Sequence Number
    derivation: ADVS_RAW.VSSEQ

  - name: ADT
    type: date
    label: Analysis Date
    derivation: ADVS_RAW.ADT

  - name: ADY
    type: int
    label: Analysis Relative Day
    derivation: ADVS_RAW.ADY

  - name: AVAL
    type: float
    label: Analysis Value
    derivation: ADVS_RAW.AVAL

  # AVISIT is a key, and with no row templates the rows are the distinct
  # key values, settled before any other column. Reading the ADY column
  # here is therefore rejected before any data is read. Windows: SCREENING
  # before day 0, BASELINE days 0-1, WEEK 2 days 2-21, WEEK 4 days 22-42,
  # POST-TREATMENT from day 43.
  - name: AVISIT
    type: str
    label: Analysis Visit
    derivation:
      cut:
        source: ADY
        breaks: [0, 2, 22, 43]
        labels: [SCREENING, BASELINE, WEEK 2, WEEK 4, POST-TREATMENT]
        right: false
        missing: null
