yamaa: "1.0"
type: spec
model: SDTM
domain: DM
keys: [STUDYID, USUBJID]
input:
  DM_RAW: input/dm_raw.csv

output:
  path: dm.csv
  columns: [DOMAIN, STUDYID, USUBJID, SUBJID, RFSTDTC, SITEID, AGE, AGEU,
    SEX, RACE, COUNTRY]

columns:
  - name: DOMAIN
    type: str
    label: Domain Abbreviation
    derivation: "'DM'"
    submission:
      core: Req
      role: Identifier
      length: 2
      origins:
        - type: Assigned
          source: Sponsor

  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM_RAW.STUDYID
    submission:
      core: Req
      role: Identifier
      length: 20
      origins:
        - type: Protocol
          source: Sponsor

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM_RAW.USUBJID
    submission:
      core: Req
      role: Identifier
      length: 30
      origins:
        - type: Assigned
          source: Sponsor

  - name: SUBJID
    type: str
    label: Subject Identifier for the Study
    derivation: DM_RAW.SUBJID
    submission:
      core: Req
      role: Topic
      length: 10
      origins:
        - type: Collected
          source: Investigator
          documents:
            - document: acrf
              pages: {type: PhysicalRef, refs: "1"}

  - name: RFSTDTC
    type: date
    label: Subject Reference Start Date/Time
    derivation: DM_RAW.RFSTDTC
    submission:
      core: Exp
      role: Record Qualifier
      origins:
        - type: Collected
          source: Investigator
          documents:
            - document: acrf
              pages: {type: PhysicalRef, refs: "1"}

  - name: SITEID
    type: str
    label: Study Site Identifier
    derivation: DM_RAW.SITEID
    submission:
      core: Req
      role: Record Qualifier
      length: 10
      origins:
        - type: Collected
          source: Investigator
          documents:
            - document: acrf
              pages: {type: PhysicalRef, refs: "1"}

  - name: AGE
    type: int
    label: Age
    derivation: DM_RAW.AGE
    submission:
      core: Exp
      role: Record Qualifier
      length: 3
      origins:
        - type: Collected
          source: Investigator
          documents:
            - document: acrf
              pages: {type: PhysicalRef, refs: "1"}

  - name: AGEU
    type: str
    label: Age Units
    derivation: "'YEARS'"
    submission:
      core: Exp
      role: Variable Qualifier
      length: 6
      origins:
        - type: Assigned
          source: Sponsor

  - name: SEX
    type: str
    label: Sex
    derivation: DM_RAW.SEX
    submission:
      core: Req
      role: Record Qualifier
      length: 1
      origins:
        - type: Collected
          source: Investigator
          documents:
            - document: acrf
              pages: {type: PhysicalRef, refs: "1"}

  - name: RACE
    type: str
    label: Race
    derivation: DM_RAW.RACE
    submission:
      core: Exp
      role: Record Qualifier
      length: 40
      origins:
        - type: Collected
          source: Investigator
          documents:
            - document: acrf
              pages: {type: PhysicalRef, refs: "1"}

  - name: COUNTRY
    type: str
    label: Country
    derivation: DM_RAW.COUNTRY
    submission:
      core: Req
      role: Record Qualifier
      length: 3
      origins:
        - type: Collected
          source: Investigator
          documents:
            - document: acrf
              pages: {type: PhysicalRef, refs: "1"}

submission:
  label: Demographics
  class: SPECIAL PURPOSE
  structure: One record per subject
  repeating: false
