yamaa: "1.0"
type: spec
model: ADaM
domain: ADPC
keys: [STUDYID, USUBJID, PCSEQ]
input:
  PC:
    path: input/pc.csv
    types: {PCSEQ: int, PCSTRESN: float, PCTPTNUM: float}
base: PC

output:
  path: adpc.csv
  columns: [STUDYID, USUBJID, PCSEQ, PARAMCD, ATPTREF, ATPT, ATPTN, AVAL,
            AVALU, NCAXFL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: PC.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: PC.USUBJID

  - name: PCSEQ
    type: int
    label: Sequence Number
    derivation: PC.PCSEQ

  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation: PC.PCTESTCD

  - name: ATPTREF
    type: str
    label: Analysis Timepoint Reference
    derivation: PC.PCTPTREF

  - name: ATPT
    type: str
    label: Analysis Timepoint
    derivation: PC.PCTPT

  - name: ATPTN
    type: float
    label: Analysis Timepoint (N)
    derivation: PC.PCTPTNUM

  # A profile is one subject, analyte and dose (the time point reference),
  # ordered by planned time point. A result is quantified when it has a
  # number; a below-limit result and a sample not done have none, so
  # neither moves the first or last quantified time point.
  - name: FIRSTQ
    type: float
    label: First Quantified Timepoint of the Profile
    derivation:
      aggregate:
        key: {STUDYID: STUDYID, USUBJID: USUBJID, PCTESTCD: PARAMCD,
              PCTPTREF: ATPTREF}
        filter: "PC.PCSTRESN IS NOT NULL"
        expr: "MIN(PC.PCTPTNUM)"

  - name: LASTQ
    type: float
    label: Last Quantified Timepoint of the Profile
    derivation:
      aggregate:
        key: {STUDYID: STUDYID, USUBJID: USUBJID, PCTESTCD: PARAMCD,
              PCTPTREF: ATPTREF}
        filter: "PC.PCSTRESN IS NOT NULL"
        expr: "MAX(PC.PCTPTNUM)"

  # Every below-limit result is 0; a sample not done stays without a value.
  - name: AVAL
    type: float
    label: Analysis Value
    derivation:
      case:
        - when: "PC.PCSTRESN IS NOT NULL"
          then: PC.PCSTRESN
        - when: "PC.PCSTRESC LIKE '<%'"
          then: 0.0

  - name: AVALU
    type: str
    label: Analysis Value Unit
    derivation: PC.PCSTRESU

  # PKNCA v0.12.1 clean.conc.blq() with its default
  # conc.blq = list(first = "keep", middle = "drop", last = "keep"): a
  # below-limit result between the first and the last quantified result of
  # its profile is dropped from the noncompartmental analysis, so it is
  # flagged for exclusion. One before the first or after the last, or in a
  # profile with no quantified result, is kept as 0.
  - name: NCAXFL
    type: str
    label: NCA Exclusion Flag
    derivation:
      flag: "PC.PCSTRESC LIKE '<%' AND ATPTN > FIRSTQ AND ATPTN < LASTQ"

verifications:
  - unique: [STUDYID, USUBJID, PARAMCD, ATPTREF, ATPTN]
  - row_count:
      min: 20
      max: 20
  - assert:
      id: an-excluded-result-is-below-the-limit
      when: "NCAXFL = 'Y'"
      require: "AVAL = 0"
