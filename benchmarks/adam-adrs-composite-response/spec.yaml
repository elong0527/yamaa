schema_version: "1.0"
domain: ADRS
keys: [STUDYID, USUBJID, PARAMCD, AVISIT]
input:
  ADRS_RAW: input/adrs_raw.csv
  ADSL: input/adsl.csv

base: ADRS_RAW

output:
  path: adrs.csv
  columns: [STUDYID, USUBJID, PARAMCD, PARAM, AVISIT, PCHG, SAEFL, DCSREAS, AVALC, ARSN, AVAL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: ADRS_RAW.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: ADRS_RAW.USUBJID

  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation: {literal: RESP75}

  - name: PARAM
    type: str
    label: Parameter
    derivation: {literal: EASI-75 Response}

  - name: AVISIT
    type: str
    label: Analysis Visit
    derivation: ADRS_RAW.AVISIT

  - name: PCHG
    type: float
    label: Percent Change from Baseline
    derivation: ADRS_RAW.PCHG

  - name: SAEFL
    type: str
    label: Serious Adverse Event Flag
    derivation: ADSL.SAEFL

  - name: DCSREAS
    type: str
    label: Reason for Discontinuation
    derivation: ADSL.DCSREAS

  # Which check decides the record, first match wins: the safety or
  # discontinuation override, then a missing efficacy value, then the
  # 75% reduction mark. AVALC and ARSN both translate this one code.
  - name: RULE
    type: str
    label: Decision Rule
    derivation:
      case:
        - when: "SAEFL = 'Y' OR DCSREAS IS NOT NULL"
          then: {literal: SAFETY}
        - when: "PCHG IS NULL"
          then: {literal: MISSING}
        - when: "PCHG <= -75"
          then: {literal: THRESHOLD}
        - otherwise: {literal: OTHERWISE}

  - name: AVALC
    type: str
    label: Analysis Value (C)
    derivation:
      mapping:
        source: RULE
        dict:
          SAFETY: NON-RESPONDER
          MISSING: NOT EVALUABLE
          THRESHOLD: RESPONDER
          OTHERWISE: NON-RESPONDER
        strict: true
    verifications:
      - not_missing: {}
      - allowed_values:
          values: [RESPONDER, NON-RESPONDER, NOT EVALUABLE]

  - name: ARSN
    type: str
    label: Analysis Reason
    derivation:
      mapping:
        source: RULE
        dict:
          SAFETY: SAFETY OR DISCONTINUATION RULE
          MISSING: COMPONENT MISSING
          THRESHOLD: THRESHOLD MET
          OTHERWISE: THRESHOLD NOT MET
        strict: true
    verifications:
      not_missing: {}

  # No branch for NOT EVALUABLE, so AVAL stays empty there.
  - name: AVAL
    type: int
    label: Analysis Value
    derivation:
      case:
        - when: "AVALC = 'RESPONDER'"
          then: {literal: 1}
        - when: "AVALC = 'NON-RESPONDER'"
          then: {literal: 0}

verifications:
  - unique:
      columns: [STUDYID, USUBJID, PARAMCD, AVISIT]
  - row_count:
      min: 5
      max: 5
  - implies:
      id: numeric-response-is-missing-only-when-not-evaluable
      when: "AVAL IS NULL"
      then: "AVALC = 'NOT EVALUABLE'"
  - implies:
      id: responder-meets-threshold
      when: "AVALC = 'RESPONDER'"
      then: "PCHG <= -75"
  - implies:
      id: safety-override-is-not-a-responder
      when: "SAEFL = 'Y' OR DCSREAS IS NOT NULL"
      then: "AVALC = 'NON-RESPONDER'"
