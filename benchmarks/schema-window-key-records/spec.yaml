schema_version: "1.0"
domain: LB
keys: [USUBJID, LBSEQ]
input:
  LB_RAW:
    path: input/lb_raw.csv
    types: {LBDY: int, STRESN: float, HIGH: float}

output:
  path: lb.csv
  columns: [USUBJID, LBSEQ, LBTESTCD, LBDY, LBORRES, LBSTRESN, LBSTAT, LBNRIND]

columns:
  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: LB_RAW.USUBJID

  # Each subject's results numbered by study day, so every collected result
  # is its own record, also when a test is repeated on one day.
  - name: LBSEQ
    type: int
    label: Sequence Number
    derivation:
      row_number:
        window:
          group_by: [USUBJID]
          order_by: [LB_RAW.LBDY]

  - name: LBTESTCD
    type: str
    label: Lab Test or Examination Short Name
    derivation: LB_RAW.LBTESTCD

  - name: LBDY
    type: int
    label: Study Day of Specimen Collection
    derivation: LB_RAW.LBDY

  # Each of the following reads the one collected result its record holds.
  - name: LBORRES
    type: str
    label: Result or Finding in Original Units
    derivation:
      first_available:
        sources: [LB_RAW.RESULT, LB_RAW.RESULTC]

  - name: LBSTRESN
    type: float
    label: Numeric Result/Finding in Standard Units
    derivation:
      function:
        name: project_value
        args: {x: LB_RAW.STRESN}

  - name: LBSTAT
    type: str
    label: Completion Status
    derivation:
      flag:
        condition: "LB_RAW.STRESN IS NULL"
        true_value: NOT DONE

  - name: LBNRIND
    type: str
    label: Reference Range Indicator
    derivation:
      case:
        - when: "LB_RAW.STRESN IS NULL"
          then: {literal: null}
        - otherwise:
            flag:
              condition: "LB_RAW.STRESN > LB_RAW.HIGH"
              true_value: HIGH
              false_value: NORMAL
              missing: {literal: null}
