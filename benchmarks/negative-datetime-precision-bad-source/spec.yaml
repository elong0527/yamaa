schema_version: "1.0"
domain: ADSL
keys: [STUDYID, USUBJID, EXSEQ]
input:
  EX: input/ex.csv

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, EXSEQ, TRTSTPR]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: EX.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: EX.USUBJID

  - name: EXSEQ
    type: int
    label: Sequence Number
    derivation: EX.EXSEQ

  # S when the collected start carries a time, D when it is a complete date
  # alone. Neither handler is declared, so a missing start, or one cut off
  # before its day such as 2025-01, stops the run.
  - name: TRTSTPR
    type: str
    label: First Exposure Date/Time Collected Precision
    derivation:
      datetime_precision:
        source: EX.EXSTDTC
