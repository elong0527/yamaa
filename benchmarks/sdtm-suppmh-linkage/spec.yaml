schema_version: "1.0"
domain: SUPPMH
keys: [STUDYID, RDOMAIN, USUBJID, IDVAR, IDVARVAL, QNAM]
input:
  MH_SUPP_RAW: input/mh_supp_raw.csv
  MH: input/mh.csv

output:
  path: suppmh.csv
  columns: [STUDYID, RDOMAIN, USUBJID, IDVAR, IDVARVAL, QNAM, QLABEL, QVAL, QORIG, QEVAL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: MH_SUPP_RAW.STUDYID

  - name: RDOMAIN
    type: str
    label: Related Domain Abbreviation
    derivation: {literal: MH}

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: MH_SUPP_RAW.USUBJID

  - name: IDVAR
    type: str
    label: Identifying Variable
    derivation: {literal: MHSEQ}

  # The parent MH record for the same subject and condition term; its MHSEQ
  # (read as text) is the link. A qualifier with no parent record leaves this
  # missing, and the not_missing check fails the run.
  - name: IDVARVAL
    type: str
    label: Identifying Variable Value
    derivation:
      lookup:
        dataset: MH
        key_base: [MH_SUPP_RAW.USUBJID, MH_SUPP_RAW.MHTERM]
        key: [USUBJID, MHTERM]
        value: MHSEQ
    verifications:
      not_missing: {}

  - name: QNAM
    type: str
    label: Qualifier Variable Name
    verifications:
      allowed_values:
        values: [MHFAMHX, MHCONF]

  - name: QLABEL
    type: str
    label: Qualifier Label

  - name: QVAL
    type: str
    label: Data Value
    verifications:
      - not_missing: {}
      - allowed_values:
          values: [Y, N]

  - name: QORIG
    type: str
    label: Origin
    derivation: {literal: Collected}

  - name: QEVAL
    type: str
    label: Evaluator
    derivation: {literal: null}

# One row template per qualifier. Each writes a row only for a condition
# record where that qualifier was collected; a blank answer writes none.
rows:
  - id: family_history
    dataset: MH_SUPP_RAW
    filter: "MH_SUPP_RAW.MHFAMHX IS NOT NULL"
    derivations:
      QNAM: {literal: MHFAMHX}
      QLABEL: {literal: Family History}
      QVAL: MH_SUPP_RAW.MHFAMHX

  - id: medical_record_confirmation
    dataset: MH_SUPP_RAW
    filter: "MH_SUPP_RAW.MHCONF IS NOT NULL"
    derivations:
      QNAM: {literal: MHCONF}
      QLABEL: {literal: Confirmed by Medical Records}
      QVAL: MH_SUPP_RAW.MHCONF

verifications:
  - unique:
      columns: [STUDYID, RDOMAIN, USUBJID, IDVAR, IDVARVAL, QNAM]
  - row_count:
      min: 7
      max: 7
  - implies:
      id: qualifier-value-has-parent-identifier
      when: "QVAL IS NOT NULL"
      then: "RDOMAIN IS NOT NULL AND IDVAR IS NOT NULL AND IDVARVAL IS NOT NULL"
