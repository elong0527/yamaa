yamaa: "1.0"
type: spec
model: ADaM
domain: ADTTE
keys: [STUDYID, USUBJID, PARAMCD]

# Single-spec benchmark: the deterioration flag is derived in the
# intermediates below (BASELINE/FIRSTDETER), not in a separate producer
# spec. The flag is a derivation step of the ADTTE build, the same way
# adam-adtte-pfs derives its progression picks in intermediates.
input:
  ADSL: {path: input/adsl.csv, types: {RANDDT: date, DTHDT: date}}
  QS:
    path: input/qs.csv
    types: {QSSEQ: int, ADT: date, AVAL: int}
    key: [STUDYID, USUBJID]
  DS:
    path: input/ds.csv
    types: {DSDTC: date, DSSEQ: int}

base: ADSL

output:
  path: adtte.csv
  columns: [STUDYID, USUBJID, PARAMCD, PARAM, STARTDT, ADT, AVAL, CNSR,
            EVNTDESC, CNSDTDSC, SRCDOM, SRCVAR, SRCSEQ]

intermediates:
  # The baseline assessment: the earliest dated assessment with a score
  # per subject. A scoreless row cannot be the baseline: its score is
  # null, so no later row could ever meet the cutoff against it. The
  # deterioration search below runs strictly after it, so the baseline
  # record itself can never flag even though its own change from baseline
  # is zero.
  - id: BASELINE
    dataset: QS
    key: [STUDYID, USUBJID]
    filter: "QS.ADT IS NOT NULL AND QS.AVAL IS NOT NULL"
    order_by: [QS.ADT, QS.QSSEQ]
    keep: first

  # The first deteriorated assessment: dated after the baseline assessment
  # with a score at least 10 points below the baseline score. The cutoff is
  # read from BASELINE per donor record, so the flag logic lives here
  # instead of in a separate flagged dataset. Ordered by date, then
  # sequence, so one record wins whatever the input order.
  - id: FIRSTDETER
    dataset: QS
    key: [STUDYID, USUBJID]
    filter: "QS.ADT IS NOT NULL AND QS.ADT > QS.BASELINEDT
      AND QS.AVAL <= QS.CUTOFF"
    order_by: [QS.ADT, QS.QSSEQ]
    keep: first
    derivations:
      BASELINEDT: BASELINE.ADT
      CUTOFF: "BASELINE.AVAL - 10"

  # The first censoring reason: progression, discontinuation, or
  # withdrawal. Only the earliest counts; later ones do not move the
  # censor date. A DS record naming anything else is not a censoring
  # reason and is ignored here.
  - id: FIRSTDS
    dataset: DS
    key: [STUDYID, USUBJID]
    filter: "DS.DSDECOD IN ('DISEASE PROGRESSION',
      'STUDY DISCONTINUATION', 'WITHDRAWAL OF CONSENT')"
    order_by: [DS.DSDTC, DS.DSSEQ]
    keep: first

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: ADSL.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: ADSL.USUBJID

  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation: "'TTDGHS'"

  - name: PARAM
    type: str
    label: Parameter
    derivation: "'Time to Deterioration in Global Health Status'"

  - name: STARTDT
    type: date
    label: Time-to-Event Origin Date
    derivation: ADSL.RANDDT

  - name: DETERDT
    type: date
    label: Deterioration Date
    derivation: FIRSTDETER.ADT

  - name: DEATHDT
    type: date
    label: Death Date
    derivation: ADSL.DTHDT

  # The censoring reason's date and description, when a reason was
  # recorded; empty for subjects with no reason on file. Declared before
  # EVENTDT because the event logic below reads the reason date.
  - name: CENSORRSNDT
    type: date
    label: Censoring Reason Date
    derivation: FIRSTDS.DSDTC

  - name: CENSORRSN
    type: str
    label: Censoring Reason
    derivation: FIRSTDS.DSDECOD

  # The event is the earlier of deterioration and death; a deterioration
  # and a death on the same date count as deterioration. Neither counts
  # when it falls after the first censoring reason: progression,
  # discontinuation, and withdrawal are censoring reasons, never events.
  # A deterioration or death dated the same day as the censoring reason
  # still counts as the event.
  - name: EVENTDT
    type: date
    label: Event Date
    derivation:
      case:
        - when: "DETERDT IS NOT NULL AND (DEATHDT IS NULL
            OR DETERDT <= DEATHDT) AND (CENSORRSNDT IS NULL
            OR DETERDT <= CENSORRSNDT)"
          then: DETERDT
        - when: "DEATHDT IS NOT NULL AND (CENSORRSNDT IS NULL
            OR DEATHDT <= CENSORRSNDT)"
          then: DEATHDT

  # The last assessment with a score dated on or before the censoring
  # reason; a scoreless row is not an evaluable assessment and cannot
  # set the censoring date. A missing reason date admits no assessment,
  # so the match is empty then and the subject falls back to
  # randomization below.
  - name: LASTQSLE
    type: date
    label: Last Assessment On Or Before Censoring
    derivation:
      aggregate:
        filter: "QS.ADT IS NOT NULL AND QS.AVAL IS NOT NULL"
        group_by: [QS.STUDYID, QS.USUBJID]
        between: {value: CENSORRSNDT, lower: ADT}
        expr: "MAX(QS.ADT)"

  # The sequence of that assessment: the latest sequence among the
  # scored records sharing the censoring date.
  - name: LASTQSSEQ
    type: int
    label: Sequence of Last Assessment On Or Before Censoring
    derivation:
      aggregate:
        filter: "QS.ADT IS NOT NULL AND QS.AVAL IS NOT NULL"
        group_by: [QS.STUDYID, QS.USUBJID]
        between: {value: LASTQSLE, lower: ADT, upper: ADT}
        expr: "MAX(QS.QSSEQ)"

  # With no usable assessment the subject is censored at randomization.
  - name: CENSORDT
    type: date
    label: Censoring Date
    derivation:
      first_available:
        sources: [LASTQSLE, STARTDT]

  - name: ADT
    type: date
    label: Analysis Date
    derivation:
      first_available:
        sources: [EVENTDT, CENSORDT]

  - name: AVAL
    type: int
    label: Analysis Value
    derivation:
      diff:
        type: date
        start: STARTDT
        end: ADT
        unit: month

  - name: CNSR
    type: int
    label: Censor
    derivation:
      case:
        - when: "EVENTDT IS NOT NULL"
          then: 0
        - otherwise: 1

  # A deterioration and a censoring reason on the same date count as a
  # deterioration: the event always wins over censoring, but only when the
  # event is not dated after the censoring reason.
  - name: EVNTDESC
    type: str
    label: Event or Censoring Description
    derivation:
      case:
        - when: "DETERDT IS NOT NULL AND (DEATHDT IS NULL
            OR DETERDT <= DEATHDT) AND (CENSORRSNDT IS NULL
            OR DETERDT <= CENSORRSNDT)"
          then: "'PRO DETERIORATION'"
        - when: "DEATHDT IS NOT NULL AND (CENSORRSNDT IS NULL
            OR DEATHDT <= CENSORRSNDT)"
          then: "'DEATH'"
        - otherwise: "'CENSORED'"

  - name: CNSDTDSC
    type: str
    label: Censoring Date Description
    derivation:
      case:
        - when: "EVENTDT IS NOT NULL"
          then: null
        - when: "CENSORRSN IS NOT NULL"
          then: CENSORRSN
        - otherwise: "'STUDY COMPLETION'"

  - name: SRCDOM
    type: str
    label: Source Data
    derivation:
      case:
        - when: "DETERDT IS NOT NULL AND (DEATHDT IS NULL
            OR DETERDT <= DEATHDT) AND (CENSORRSNDT IS NULL
            OR DETERDT <= CENSORRSNDT)"
          then: "'QS'"
        - when: "DEATHDT IS NOT NULL AND (CENSORRSNDT IS NULL
            OR DEATHDT <= CENSORRSNDT)"
          then: "'ADSL'"
        - when: "LASTQSLE IS NULL"
          then: "'ADSL'"
        - otherwise: "'QS'"

  - name: SRCVAR
    type: str
    label: Source Variable
    derivation:
      case:
        - when: "DETERDT IS NOT NULL AND (DEATHDT IS NULL
            OR DETERDT <= DEATHDT) AND (CENSORRSNDT IS NULL
            OR DETERDT <= CENSORRSNDT)"
          then: "'ADT'"
        - when: "DEATHDT IS NOT NULL AND (CENSORRSNDT IS NULL
            OR DEATHDT <= CENSORRSNDT)"
          then: "'DTHDT'"
        - when: "LASTQSLE IS NULL"
          then: "'RANDDT'"
        - otherwise: "'ADT'"

  - name: SRCSEQ
    type: int
    label: Source Sequence Number
    derivation:
      case:
        - when: "DETERDT IS NOT NULL AND (DEATHDT IS NULL
            OR DETERDT <= DEATHDT) AND (CENSORRSNDT IS NULL
            OR DETERDT <= CENSORRSNDT)"
          then: FIRSTDETER.QSSEQ
        - when: "EVNTDESC = 'CENSORED' AND LASTQSLE IS NOT NULL"
          then: LASTQSSEQ
