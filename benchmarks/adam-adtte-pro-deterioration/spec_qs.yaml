schema_version: "1.0"
domain: QS
keys: [STUDYID, USUBJID, QSSEQ]

input:
  ADSL: {path: input/adsl.csv, types: {RANDDT: date, DTHDT: date}}
  QSRAW:
    path: input/qs.csv
    types: {QSSEQ: int, ADT: date, AVAL: int}

base: QSRAW

output:
  path: qs_flagged.csv
  columns: [STUDYID, USUBJID, QSSEQ, AVISIT, ADT, AVAL, DETERFL]

# The baseline assessment: the earliest dated assessment. The deterioration
# search below runs strictly after it, so the baseline record itself can
# never flag even though its own change from baseline is zero.
intermediates:
  - id: BASELINE
    dataset: QSRAW
    key: [STUDYID, USUBJID]
    filter: "QSRAW.ADT IS NOT NULL"
    order_by: [QSRAW.ADT, QSRAW.QSSEQ]
    keep: first
    no_match: null

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: QSRAW.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: QSRAW.USUBJID

  - name: QSSEQ
    type: int
    label: Sequence Number
    derivation: QSRAW.QSSEQ

  - name: AVISIT
    type: str
    label: Analysis Visit
    derivation: QSRAW.AVISIT

  - name: ADT
    type: date
    label: Assessment Date
    derivation: QSRAW.ADT

  - name: AVAL
    type: int
    label: PRO Score
    derivation: QSRAW.AVAL

  # The baseline date as a column: the flag below compares against it, and
  # predicates cannot do date arithmetic on the intermediate read itself.
  - name: BASELINEDT
    type: date
    label: Baseline Assessment Date
    derivation: BASELINE.ADT

  # Ten points below the baseline score. The meaningful-change threshold is
  # a study constant, stated here rather than derived.
  - name: CUTOFF10
    type: int
    label: Deterioration Cutoff Score
    derivation:
      compute: {expr: "BASELINE.AVAL - 10"}

  # A deterioration is an assessment dated after the baseline assessment
  # whose score has fallen to the cutoff or below. The baseline record
  # itself is excluded by the strict date comparison.
  - name: DETERFL
    type: str
    label: Deterioration Flag
    derivation:
      case:
        - when: "QSRAW.ADT IS NOT NULL AND QSRAW.ADT > BASELINEDT
            AND QSRAW.AVAL <= CUTOFF10"
          then: {literal: "Y"}
