schema_version: "1.0"
domain: VS
keys: [STUDYID, USUBJID, VSSEQ]
input:
  ODM: input/odm.csv

output:
  path: vs.csv
  columns: [DOMAIN, STUDYID, USUBJID, VSSEQ, VISIT, VSTESTCD, VSTEST, VSORRES,
    VSORRESU, VSSTRESN, VSSTRESC, VSSTRESU, VSPOS, VSMETHOD, VSSTAT, VSREASND, VSDTC]
  order_by: [STUDYID, USUBJID, VSSEQ]

columns:
  - name: DOMAIN
    type: str
    label: Domain Abbreviation
    derivation:
      literal: VS

  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: ODM.StudyOID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: ODM.SubjectKey

  - name: VISIT
    type: str
    label: Visit Name
    derivation: ODM.StudyEventOID

  - name: VSDTC
    type: date
    label: Date/Time of Measurements

  - name: VSTESTCD
    type: str
    label: Vital Signs Test Short Name

  - name: VSTEST
    type: str
    label: Vital Signs Test Name

  - name: TESTORD
    type: int
    label: Test Order Within Visit

  - name: VSORRES
    type: str
    label: Result or Finding in Original Units

  - name: VSORRESU
    type: str
    label: Original Units

  - name: VSSTRESN
    type: float
    label: Numeric Result/Finding in Standard Units

  - name: VSSTRESC
    type: str
    label: Character Result/Finding in Std Format
    derivation: VSSTRESN

  - name: VSSTRESU
    type: str
    label: Standard Units

  - name: POSITION
    type: str
    label: Body Position Collected on the Form

  - name: TEMPMETHOD
    type: str
    label: Temperature Method Collected on the Form

  - name: BPNOTDONE
    type: str
    label: Blood Pressure Not-Done Flag Collected on the Form

  - name: BPREASND
    type: str
    label: Blood Pressure Not-Done Reason Collected on the Form

  - name: VSPOS
    type: str
    label: Position of Subject
    derivation:
      case:
        - when: "(VSTESTCD = 'SYSBP' OR VSTESTCD = 'DIABP' OR VSTESTCD = 'PULSE') AND VSORRES IS NOT NULL"
          then:
            source: POSITION

  - name: VSMETHOD
    type: str
    label: Method of Test or Examination
    derivation:
      case:
        - when: "VSTESTCD = 'TEMP' AND VSORRES IS NOT NULL"
          then:
            source: TEMPMETHOD

  - name: VSSTAT
    type: str
    label: Completion Status
    derivation:
      case:
        - when: "(VSTESTCD = 'SYSBP' OR VSTESTCD = 'DIABP') AND BPNOTDONE = 'Y'"
          then:
            literal: NOT DONE

  - name: VSREASND
    type: str
    label: Reason Not Done
    derivation:
      case:
        - when: "(VSTESTCD = 'SYSBP' OR VSTESTCD = 'DIABP') AND BPNOTDONE = 'Y'"
          then:
            source: BPREASND

  - name: VSSEQ
    type: int
    label: Sequence Number
    derivation:
      row_number:
        window:
          group_by: [STUDYID, USUBJID]
          order_by: [VSDTC, TESTORD]
    verifications:
      not_missing: {}

rows:
  - id: sysbp
    group_by: [ODM.StudyOID, ODM.SubjectKey, ODM.StudyEventOID]
    derivations:
      VSTESTCD:
        literal: SYSBP
      VSTEST:
        literal: Systolic Blood Pressure
      TESTORD:
        literal: 1
      VSORRES:
        aggregate:
          filter: "ODM.ItemOID = 'IT.VS.SYSBP'"
          expr: "ONLY(ODM.Value)"
      VSORRESU:
        aggregate:
          filter: "ODM.ItemOID = 'IT.VS.SYSBPU'"
          expr: "ONLY(ODM.Value)"
      VSSTRESN:
        value:
          source: VSORRES
        missing:
      VSSTRESU:
        aggregate:
          filter: "ODM.ItemOID = 'IT.VS.SYSBPU'"
          expr: "ONLY(ODM.Value)"
      VSDTC:
        aggregate:
          filter: "ODM.ItemOID = 'IT.VS.VSDTC'"
          expr: "ONLY(ODM.Value)"
      POSITION:
        aggregate:
          filter: "ODM.ItemOID = 'IT.VS.POSITION'"
          expr: "ONLY(ODM.Value)"
      TEMPMETHOD:
        aggregate:
          filter: "ODM.ItemOID = 'IT.VS.TEMPMETHOD'"
          expr: "ONLY(ODM.Value)"
      BPNOTDONE:
        aggregate:
          filter: "ODM.ItemOID = 'IT.VS.BPNOTDONE'"
          expr: "ONLY(ODM.Value)"
      BPREASND:
        aggregate:
          filter: "ODM.ItemOID = 'IT.VS.BPREASND'"
          expr: "ONLY(ODM.Value)"

  - id: diabp
    group_by: [ODM.StudyOID, ODM.SubjectKey, ODM.StudyEventOID]
    derivations:
      VSTESTCD:
        literal: DIABP
      VSTEST:
        literal: Diastolic Blood Pressure
      TESTORD:
        literal: 2
      VSORRES:
        aggregate:
          filter: "ODM.ItemOID = 'IT.VS.DIABP'"
          expr: "ONLY(ODM.Value)"
      VSORRESU:
        aggregate:
          filter: "ODM.ItemOID = 'IT.VS.DIABPU'"
          expr: "ONLY(ODM.Value)"
      VSSTRESN:
        value:
          source: VSORRES
        missing:
      VSSTRESU:
        aggregate:
          filter: "ODM.ItemOID = 'IT.VS.DIABPU'"
          expr: "ONLY(ODM.Value)"
      VSDTC:
        aggregate:
          filter: "ODM.ItemOID = 'IT.VS.VSDTC'"
          expr: "ONLY(ODM.Value)"
      POSITION:
        aggregate:
          filter: "ODM.ItemOID = 'IT.VS.POSITION'"
          expr: "ONLY(ODM.Value)"
      TEMPMETHOD:
        aggregate:
          filter: "ODM.ItemOID = 'IT.VS.TEMPMETHOD'"
          expr: "ONLY(ODM.Value)"
      BPNOTDONE:
        aggregate:
          filter: "ODM.ItemOID = 'IT.VS.BPNOTDONE'"
          expr: "ONLY(ODM.Value)"
      BPREASND:
        aggregate:
          filter: "ODM.ItemOID = 'IT.VS.BPREASND'"
          expr: "ONLY(ODM.Value)"

  - id: pulse
    group_by: [ODM.StudyOID, ODM.SubjectKey, ODM.StudyEventOID]
    derivations:
      VSTESTCD:
        literal: PULSE
      VSTEST:
        literal: Pulse Rate
      TESTORD:
        literal: 3
      VSORRES:
        aggregate:
          filter: "ODM.ItemOID = 'IT.VS.PULSE'"
          expr: "ONLY(ODM.Value)"
      VSORRESU:
        aggregate:
          filter: "ODM.ItemOID = 'IT.VS.PULSEU'"
          expr: "ONLY(ODM.Value)"
      VSSTRESN:
        value:
          source: VSORRES
        missing:
      VSSTRESU:
        aggregate:
          filter: "ODM.ItemOID = 'IT.VS.PULSEU'"
          expr: "ONLY(ODM.Value)"
      VSDTC:
        aggregate:
          filter: "ODM.ItemOID = 'IT.VS.VSDTC'"
          expr: "ONLY(ODM.Value)"
      POSITION:
        aggregate:
          filter: "ODM.ItemOID = 'IT.VS.POSITION'"
          expr: "ONLY(ODM.Value)"
      TEMPMETHOD:
        aggregate:
          filter: "ODM.ItemOID = 'IT.VS.TEMPMETHOD'"
          expr: "ONLY(ODM.Value)"
      BPNOTDONE:
        aggregate:
          filter: "ODM.ItemOID = 'IT.VS.BPNOTDONE'"
          expr: "ONLY(ODM.Value)"
      BPREASND:
        aggregate:
          filter: "ODM.ItemOID = 'IT.VS.BPREASND'"
          expr: "ONLY(ODM.Value)"

  - id: resp
    group_by: [ODM.StudyOID, ODM.SubjectKey, ODM.StudyEventOID]
    derivations:
      VSTESTCD:
        literal: RESP
      VSTEST:
        literal: Respiratory Rate
      TESTORD:
        literal: 4
      VSORRES:
        aggregate:
          filter: "ODM.ItemOID = 'IT.VS.RESP'"
          expr: "ONLY(ODM.Value)"
      VSORRESU:
        aggregate:
          filter: "ODM.ItemOID = 'IT.VS.RESPU'"
          expr: "ONLY(ODM.Value)"
      VSSTRESN:
        value:
          source: VSORRES
        missing:
      VSSTRESU:
        aggregate:
          filter: "ODM.ItemOID = 'IT.VS.RESPU'"
          expr: "ONLY(ODM.Value)"
      VSDTC:
        aggregate:
          filter: "ODM.ItemOID = 'IT.VS.VSDTC'"
          expr: "ONLY(ODM.Value)"
      POSITION:
        aggregate:
          filter: "ODM.ItemOID = 'IT.VS.POSITION'"
          expr: "ONLY(ODM.Value)"
      TEMPMETHOD:
        aggregate:
          filter: "ODM.ItemOID = 'IT.VS.TEMPMETHOD'"
          expr: "ONLY(ODM.Value)"
      BPNOTDONE:
        aggregate:
          filter: "ODM.ItemOID = 'IT.VS.BPNOTDONE'"
          expr: "ONLY(ODM.Value)"
      BPREASND:
        aggregate:
          filter: "ODM.ItemOID = 'IT.VS.BPREASND'"
          expr: "ONLY(ODM.Value)"

  - id: temp
    group_by: [ODM.StudyOID, ODM.SubjectKey, ODM.StudyEventOID]
    derivations:
      VSTESTCD:
        literal: TEMP
      VSTEST:
        literal: Temperature
      TESTORD:
        literal: 5
      VSORRES:
        aggregate:
          filter: "ODM.ItemOID = 'IT.VS.TEMP'"
          expr: "ONLY(ODM.Value)"
      VSORRESU:
        aggregate:
          filter: "ODM.ItemOID = 'IT.VS.TEMPU'"
          expr: "ONLY(ODM.Value)"
      VSSTRESN:
        value:
          source: VSORRES
        missing:
      VSSTRESU:
        aggregate:
          filter: "ODM.ItemOID = 'IT.VS.TEMPU'"
          expr: "ONLY(ODM.Value)"
      VSDTC:
        aggregate:
          filter: "ODM.ItemOID = 'IT.VS.VSDTC'"
          expr: "ONLY(ODM.Value)"
      POSITION:
        aggregate:
          filter: "ODM.ItemOID = 'IT.VS.POSITION'"
          expr: "ONLY(ODM.Value)"
      TEMPMETHOD:
        aggregate:
          filter: "ODM.ItemOID = 'IT.VS.TEMPMETHOD'"
          expr: "ONLY(ODM.Value)"
      BPNOTDONE:
        aggregate:
          filter: "ODM.ItemOID = 'IT.VS.BPNOTDONE'"
          expr: "ONLY(ODM.Value)"
      BPREASND:
        aggregate:
          filter: "ODM.ItemOID = 'IT.VS.BPREASND'"
          expr: "ONLY(ODM.Value)"

  - id: weight
    group_by: [ODM.StudyOID, ODM.SubjectKey, ODM.StudyEventOID]
    derivations:
      VSTESTCD:
        literal: WEIGHT
      VSTEST:
        literal: Weight
      TESTORD:
        literal: 6
      VSORRES:
        aggregate:
          filter: "ODM.ItemOID = 'IT.VS.WEIGHT'"
          expr: "ONLY(ODM.Value)"
      VSORRESU:
        aggregate:
          filter: "ODM.ItemOID = 'IT.VS.WEIGHTU'"
          expr: "ONLY(ODM.Value)"
      VSSTRESN:
        value:
          source: VSORRES
        missing:
      VSSTRESU:
        aggregate:
          filter: "ODM.ItemOID = 'IT.VS.WEIGHTU'"
          expr: "ONLY(ODM.Value)"
      VSDTC:
        aggregate:
          filter: "ODM.ItemOID = 'IT.VS.VSDTC'"
          expr: "ONLY(ODM.Value)"
      POSITION:
        aggregate:
          filter: "ODM.ItemOID = 'IT.VS.POSITION'"
          expr: "ONLY(ODM.Value)"
      TEMPMETHOD:
        aggregate:
          filter: "ODM.ItemOID = 'IT.VS.TEMPMETHOD'"
          expr: "ONLY(ODM.Value)"
      BPNOTDONE:
        aggregate:
          filter: "ODM.ItemOID = 'IT.VS.BPNOTDONE'"
          expr: "ONLY(ODM.Value)"
      BPREASND:
        aggregate:
          filter: "ODM.ItemOID = 'IT.VS.BPREASND'"
          expr: "ONLY(ODM.Value)"

verifications:
  - unique:
      columns: [STUDYID, USUBJID, VSSEQ]
  - row_count:
      min: 24
      max: 24
  - all_or_none:
      id: standardized-result-completeness
      columns: [VSSTRESN, VSSTRESC, VSSTRESU]
  - implies:
      id: not-done-record-has-no-result
      when: "VSSTAT = 'NOT DONE'"
      then: "VSORRES IS NULL AND VSSTRESN IS NULL"
  - implies:
      id: collected-result-is-not-flagged
      when: "VSORRES IS NOT NULL"
      then: "VSSTAT IS NULL"
