schema_version: "1.0"
domain: VS
keys: [STUDYID, USUBJID, VSSEQ]
input:
  ODM: input/odm.csv
  TESTS:
    path: input/vs_tests.csv
    types: {TESTORD: int, HAS_POSITION: int, HAS_METHOD: int, HAS_NOTDONE: int}

# The test table, read through each record's test code.
intermediates:
  - id: TEST
    dataset: TESTS
    key: VSTESTCD
    strict: true
    verification:
      unique: [VSTESTCD]

output:
  path: vs.csv
  columns: [DOMAIN, STUDYID, USUBJID, VSSEQ, VISIT, VSTESTCD, VSTEST, VSORRES,
    VSORRESU, VSSTRESN, VSSTRESC, VSSTRESU, VSPOS, VSMETHOD, VSSTAT, VSREASND, VSDTC]
  order_by: [STUDYID, USUBJID, VSSEQ]

columns:
  - name: DOMAIN
    type: str
    label: Domain Abbreviation
    derivation: {literal: VS}

  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: ODM.StudyOID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: ODM.SubjectKey

  - name: VISIT
    type: str
    label: Visit Name
    derivation: ODM.StudyEventOID

  # Each form item value reads the visit form group's single record for that
  # item: an absent item gives missing, and a repeated item stops the run.
  # The form-level items below are read by every test's record; only the
  # date is in the output.
  - name: VSDTC
    type: date
    label: Date/Time of Measurements
    derivation:
      aggregate:
        key: {StudyOID: ODM.StudyOID, SubjectKey: ODM.SubjectKey,
          StudyEventOID: ODM.StudyEventOID, StudyEventRepeatKey: ODM.StudyEventRepeatKey,
          ItemGroupOID: ODM.ItemGroupOID, ItemGroupRepeatKey: ODM.ItemGroupRepeatKey}
        filter: "ODM.ItemOID = 'IT.VS.VSDTC'"
        expr: "ONLY(ODM.Value)"

  - name: POSITION
    type: str
    label: Body Position Collected on the Form
    derivation:
      aggregate:
        key: {StudyOID: ODM.StudyOID, SubjectKey: ODM.SubjectKey,
          StudyEventOID: ODM.StudyEventOID, StudyEventRepeatKey: ODM.StudyEventRepeatKey,
          ItemGroupOID: ODM.ItemGroupOID, ItemGroupRepeatKey: ODM.ItemGroupRepeatKey}
        filter: "ODM.ItemOID = 'IT.VS.POSITION'"
        expr: "ONLY(ODM.Value)"

  - name: TEMPMETHOD
    type: str
    label: Temperature Method Collected on the Form
    derivation:
      aggregate:
        key: {StudyOID: ODM.StudyOID, SubjectKey: ODM.SubjectKey,
          StudyEventOID: ODM.StudyEventOID, StudyEventRepeatKey: ODM.StudyEventRepeatKey,
          ItemGroupOID: ODM.ItemGroupOID, ItemGroupRepeatKey: ODM.ItemGroupRepeatKey}
        filter: "ODM.ItemOID = 'IT.VS.TEMPMETHOD'"
        expr: "ONLY(ODM.Value)"

  - name: BPNOTDONE
    type: str
    label: Blood Pressure Not-Done Flag Collected on the Form
    derivation:
      aggregate:
        key: {StudyOID: ODM.StudyOID, SubjectKey: ODM.SubjectKey,
          StudyEventOID: ODM.StudyEventOID, StudyEventRepeatKey: ODM.StudyEventRepeatKey,
          ItemGroupOID: ODM.ItemGroupOID, ItemGroupRepeatKey: ODM.ItemGroupRepeatKey}
        filter: "ODM.ItemOID = 'IT.VS.BPNOTDONE'"
        expr: "ONLY(ODM.Value)"

  - name: BPREASND
    type: str
    label: Blood Pressure Not-Done Reason Collected on the Form
    derivation:
      aggregate:
        key: {StudyOID: ODM.StudyOID, SubjectKey: ODM.SubjectKey,
          StudyEventOID: ODM.StudyEventOID, StudyEventRepeatKey: ODM.StudyEventRepeatKey,
          ItemGroupOID: ODM.ItemGroupOID, ItemGroupRepeatKey: ODM.ItemGroupRepeatKey}
        filter: "ODM.ItemOID = 'IT.VS.BPREASND'"
        expr: "ONLY(ODM.Value)"

  - name: VSTESTCD
    type: str
    label: Vital Signs Test Short Name

  - name: VSTEST
    type: str
    label: Vital Signs Test Name
    derivation: TEST.VSTEST

  - name: TESTORD
    type: int
    label: Test Order Within Visit
    derivation: TEST.TESTORD

  # The form items that hold the test's result and its unit.
  - name: RESULT_ITEM
    type: str
    label: Result Item Identifier
    derivation: TEST.RESULT_ITEM

  - name: UNIT_ITEM
    type: str
    label: Unit Item Identifier
    derivation: TEST.UNIT_ITEM

  # Test table flags, 1 or 0: whether the test uses the form's body
  # position, its temperature method, or its blood pressure not-done flag.
  - name: HAS_POSITION
    type: int
    label: Test Uses Collected Body Position
    derivation: TEST.HAS_POSITION

  - name: HAS_METHOD
    type: int
    label: Test Uses Collected Method
    derivation: TEST.HAS_METHOD

  - name: HAS_NOTDONE
    type: int
    label: Test Uses Blood Pressure Not-Done Flag
    derivation: TEST.HAS_NOTDONE

  - name: VSORRES
    type: str
    label: Result or Finding in Original Units
    derivation:
      aggregate:
        key: {StudyOID: ODM.StudyOID, SubjectKey: ODM.SubjectKey,
          StudyEventOID: ODM.StudyEventOID, StudyEventRepeatKey: ODM.StudyEventRepeatKey,
          ItemGroupOID: ODM.ItemGroupOID, ItemGroupRepeatKey: ODM.ItemGroupRepeatKey,
          ItemOID: RESULT_ITEM}
        expr: "ONLY(ODM.Value)"

  - name: VSORRESU
    type: str
    label: Original Units
    derivation:
      aggregate:
        key: {StudyOID: ODM.StudyOID, SubjectKey: ODM.SubjectKey,
          StudyEventOID: ODM.StudyEventOID, StudyEventRepeatKey: ODM.StudyEventRepeatKey,
          ItemGroupOID: ODM.ItemGroupOID, ItemGroupRepeatKey: ODM.ItemGroupRepeatKey,
          ItemOID: UNIT_ITEM}
        expr: "ONLY(ODM.Value)"

  # The form collects standard units, so this is the collected result read
  # as a number. A result that is not a number becomes missing here, and the
  # completeness check at the end then stops the run.
  - name: VSSTRESN
    type: float
    label: Numeric Result/Finding in Standard Units
    derivation:
      value: {source: VSORRES}
      missing: null

  - name: VSSTRESC
    type: str
    label: Character Result/Finding in Std Format
    derivation: VSSTRESN

  - name: VSSTRESU
    type: str
    label: Standard Units
    derivation: VSORRESU

  # Position and method go only on the tests that use them, and only when
  # a result was collected; otherwise they stay missing.
  - name: VSPOS
    type: str
    label: Position of Subject
    derivation:
      case:
        - when: "HAS_POSITION = 1 AND VSORRES IS NOT NULL"
          then: POSITION

  - name: VSMETHOD
    type: str
    label: Method of Test or Examination
    derivation:
      case:
        - when: "HAS_METHOD = 1 AND VSORRES IS NOT NULL"
          then: TEMPMETHOD

  # A not-done flag of Y marks only the blood pressure tests, which then
  # also carry the form's reason.
  - name: VSSTAT
    type: str
    label: Completion Status
    derivation:
      case:
        - when: "HAS_NOTDONE = 1 AND BPNOTDONE = 'Y'"
          then: {literal: NOT DONE}

  - name: VSREASND
    type: str
    label: Reason Not Done
    derivation:
      case:
        - when: "HAS_NOTDONE = 1 AND BPNOTDONE = 'Y'"
          then: BPREASND

  # Numbered per subject by visit date, then by test order within the visit.
  - name: VSSEQ
    type: int
    label: Sequence Number
    derivation:
      row_number:
        window:
          group_by: [STUDYID, USUBJID]
          order_by: [VSDTC, TESTORD]
    verifications:
      not_missing: {}

# One row template per test, so every visit form group yields one record
# per test even when the test's items are absent. Each template names only
# its test; the test table supplies the rest.
rows:
  - id: sysbp
    dataset: ODM
    group_by: [ODM.StudyOID, ODM.SubjectKey, ODM.StudyEventOID,
      ODM.StudyEventRepeatKey, ODM.ItemGroupOID, ODM.ItemGroupRepeatKey]
    derivations: {VSTESTCD: {literal: SYSBP}}

  - id: diabp
    dataset: ODM
    group_by: [ODM.StudyOID, ODM.SubjectKey, ODM.StudyEventOID,
      ODM.StudyEventRepeatKey, ODM.ItemGroupOID, ODM.ItemGroupRepeatKey]
    derivations: {VSTESTCD: {literal: DIABP}}

  - id: pulse
    dataset: ODM
    group_by: [ODM.StudyOID, ODM.SubjectKey, ODM.StudyEventOID,
      ODM.StudyEventRepeatKey, ODM.ItemGroupOID, ODM.ItemGroupRepeatKey]
    derivations: {VSTESTCD: {literal: PULSE}}

  - id: resp
    dataset: ODM
    group_by: [ODM.StudyOID, ODM.SubjectKey, ODM.StudyEventOID,
      ODM.StudyEventRepeatKey, ODM.ItemGroupOID, ODM.ItemGroupRepeatKey]
    derivations: {VSTESTCD: {literal: RESP}}

  - id: temp
    dataset: ODM
    group_by: [ODM.StudyOID, ODM.SubjectKey, ODM.StudyEventOID,
      ODM.StudyEventRepeatKey, ODM.ItemGroupOID, ODM.ItemGroupRepeatKey]
    derivations: {VSTESTCD: {literal: TEMP}}

  - id: weight
    dataset: ODM
    group_by: [ODM.StudyOID, ODM.SubjectKey, ODM.StudyEventOID,
      ODM.StudyEventRepeatKey, ODM.ItemGroupOID, ODM.ItemGroupRepeatKey]
    derivations: {VSTESTCD: {literal: WEIGHT}}

verifications:
  - unique:
      columns: [STUDYID, USUBJID, VSSEQ]
  - row_count:
      min: 24
      max: 24
  - all_or_none:
      id: standardized-result-completeness
      columns: [VSSTRESN, VSSTRESC, VSSTRESU]
  - implies:
      id: not-done-record-has-no-result
      when: "VSSTAT = 'NOT DONE'"
      then: "VSORRES IS NULL AND VSSTRESN IS NULL"
  - implies:
      id: collected-result-is-not-flagged
      when: "VSORRES IS NOT NULL"
      then: "VSSTAT IS NULL"
