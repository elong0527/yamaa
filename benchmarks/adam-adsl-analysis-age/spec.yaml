schema_version: "1.0"
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  DM: input/dm.csv

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, BRTHDT, RANDDT, AAGE, AAGEU]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  - name: BRTHDT
    type: date
    label: Date of Birth
    derivation: DM.BRTHDT

  - name: RANDDT
    type: date
    label: Date of Randomization
    derivation: DM.RANDDT

  # Whole years from birth to randomization, counted as birthdays reached;
  # randomization before birth gives minus the whole years back. Empty if
  # either date is missing. exclusive is the only bounds a year count takes.
  - name: AAGE
    type: int
    label: Analysis Age
    derivation:
      date_diff:
        start: BRTHDT
        end: RANDDT
        unit: year
        bounds: exclusive

  - name: AAGEU
    type: str
    label: Analysis Age Unit
    derivation:
      literal: YEARS
