schema_version: "1.0"
domain: ADLB
keys: [STUDYID, USUBJID, PARAMCD]
input:
  LB: input/lb.csv
  # An absolute location on the machine that runs the study, not a file
  # the study carries: rejected before any data is read.
  LBREF: /shared/reference/lbref.csv
base: LB

output:
  path: adlb.csv
  columns: [STUDYID, USUBJID, PARAMCD, SEX, AVAL, ANRHI]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: LB.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: LB.USUBJID

  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation: LB.LBTESTCD

  - name: SEX
    type: str
    label: Sex
    derivation: LB.SEX

  - name: AVAL
    type: float
    label: Analysis Value
    derivation: LB.LBSTRESN

  - name: ANRHI
    type: float
    label: Analysis Normal Range Upper Limit
    # The reference limit for the record's test code and sex; missing when
    # the table has no row for that pair or the sex is missing.
    derivation:
      lookup:
        key_base: [PARAMCD, SEX]
        dataset: LBREF
        key: [LBTESTCD, SEX]
        value: ANRHI
