schema_version: "1.0"
domain: ADAE
keys: [STUDYID, USUBJID, ASEQ]
input:
  AE: input/ae.csv

output:
  path: adae.csv
  columns: [STUDYID, USUBJID, ASEQ, AETERM, ASTDT]
  order_by:
    - USUBJID
    - variable: ASTDT
      direction: desc
    - variable: USUBJID
      direction: desc

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: AE.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: AE.USUBJID

  - name: ASEQ
    type: int
    label: Analysis Sequence Number
    derivation: AE.AESEQ

  - name: AETERM
    type: str
    label: Reported Term for the Adverse Event
    derivation: AE.AETERM

  - name: ASTDT
    type: date
    label: Analysis Start Date
    derivation: AE.AESTDTC
