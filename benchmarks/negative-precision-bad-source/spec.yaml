yamaa: "1.0"
type: spec
model: ADaM
domain: ADAE
keys: [STUDYID, USUBJID, AESEQ]
input:
  AE: input/ae.csv

output:
  path: adae.csv
  columns: [STUDYID, USUBJID, AESEQ, ASTDTF]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: AE.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: AE.USUBJID

  - name: AESEQ
    type: int
    label: Sequence Number
    derivation: AE.AESEQ

  # day, month or year for a full date, a year and month, or a year alone;
  # missing when AESTDTC is missing. Nothing answers text that is not a
  # date.
  - name: ASTDTF
    type: str
    label: Analysis Start Date Imputation Flag
    derivation:
      precision:
        type: date
        source: AE.AESTDTC
