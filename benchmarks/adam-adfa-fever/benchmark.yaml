lifecycle: draft
standard: ADaM
domain: ADFA
review:
  concerns:
    - Vaccine trials report fever from reactogenicity temperatures at or above
      38 degrees Celsius.
    - Two subjects cover temperatures above and below 38 C, a missing result,
      one in Fahrenheit, a blood pressure, and a temperature from another
      category.
    - A temperature recorded in Fahrenheit (SUBJ2's 101.3 F, about 38.5 C) gets
      no fever flag rather than being converted, and the temperature outside the
      reactogenicity category gives no record.
