schema_version: "1.0"
domain: ADFA
keys: [STUDYID, USUBJID, ASEQ]
input:
  VS:
    path: input/vs.csv
    types:
      VSSEQ: int
      VSSTRESN: float
filter: "VS.VSTESTCD = 'TEMP' AND VS.VSCAT = 'REACTOGENICITY'"

output:
  path: adfa.csv
  columns:
    - DOMAIN
    - STUDYID
    - USUBJID
    - ASEQ
    - PARAMCD
    - PARAM
    - AVAL
    - AVALC
    - ADT
    - SRCDOM
    - SRCVAR
    - SRCSEQ

columns:
  - name: DOMAIN
    type: str
    label: Domain Abbreviation
    derivation: {literal: ADFA}

  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: VS.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: VS.USUBJID

  # Analysis sequence numbers run 1, 2, 3 ... within each subject in
  # assessment-date order, the collected sequence breaking ties.
  - name: ASEQ
    type: int
    label: Analysis Sequence Number
    derivation:
      row_number:
        window:
          group_by: [STUDYID, USUBJID]
          order_by: [VS.VSDTC, VS.VSSEQ]

  - name: ADT
    type: date
    label: Analysis Date
    derivation:
      to_date: {source: VS.VSDTC}

  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation: {literal: FEVER}

  - name: PARAM
    type: str
    label: Parameter
    derivation: {literal: Fever Occurrence}

  # Fever is 38 degrees Celsius or higher. A missing result or a unit other
  # than C matches neither branch, so the flag is left blank.
  - name: AVALC
    type: str
    label: Character Analysis Value
    derivation:
      case:
        - when: "VS.VSSTRESU = 'C' AND VS.VSSTRESN >= 38"
          then: {literal: Y}
        - when: "VS.VSSTRESU = 'C' AND VS.VSSTRESN < 38"
          then: {literal: N}

  - name: AVAL
    type: float
    label: Analysis Value
    derivation:
      case:
        - when: "AVALC = 'Y'"
          then: {literal: 1}
        - when: "AVALC = 'N'"
          then: {literal: 0}

  - name: SRCDOM
    type: str
    label: Source Domain
    derivation: {literal: VS}

  - name: SRCVAR
    type: str
    label: Source Variable
    derivation: {literal: VSSTRESN}

  - name: SRCSEQ
    type: int
    label: Source Sequence Number
    derivation: VS.VSSEQ

verifications:
  - unique:
      columns: [STUDYID, USUBJID, ASEQ]
  - row_count:
      min: 5
      max: 5
