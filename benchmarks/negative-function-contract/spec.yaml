schema_version: "1.0"
domain: TEST
keys: [ID]
input:
  SOURCE:
    path: input/source.csv
    types: {VALUE: float}

output:
  path: test.csv
  columns: [ID, RESULT]

columns:
  - name: ID
    type: str
    label: Identifier
    derivation: SOURCE.ID

  # The required numeric argument is deliberately omitted, so static
  # checking rejects the call before any project code or study data is read.
  - name: RESULT
    type: float
    label: Project Function Result
    derivation:
      function:
        name: project_value
        args: {}
