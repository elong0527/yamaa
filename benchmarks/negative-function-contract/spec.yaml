schema_version: "1.0"
domain: TEST
keys: [ID]
input:
  SOURCE:
    path: input/source.csv
    types: {VALUE: float}

output:
  path: test.csv
  columns: [ID, RESULT]

columns:
  - name: ID
    type: str
    label: Identifier
    derivation: SOURCE.ID

  # Intentionally asks for contract 2.0.0 of project_value; environment.yaml
  # supplies only 1.0.0, so the call is rejected before any data is read.
  - name: RESULT
    type: float
    label: Project Function Result
    derivation:
      function:
        name: project_value
        contract_version: "2.0.0"
        args: {x: SOURCE.VALUE}
