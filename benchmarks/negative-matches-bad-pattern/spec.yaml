schema_version: "1.0"
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  DM: input/dm.csv

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, SEX]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  - name: SEX
    type: str
    label: Sex
    verifications:
      - matches:
          # (?P<name>...) is a Python-only named group; the portable
          # spelling is (?<name>...), so this pattern is rejected before
          # any data is read.
          pattern: '(?P<code>[MFU])'
    derivation: DM.SEX
