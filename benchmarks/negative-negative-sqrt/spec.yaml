schema_version: "1.0"
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  DM: input/dm.csv

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, BSA]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  # Numeric copies of the measurements: DM is read as text.
  - name: HEIGHTCM
    type: float
    label: Height (cm)
    derivation: DM.HEIGHTCM

  - name: WEIGHTKG
    type: float
    label: Weight (kg)
    derivation: DM.WEIGHTKG

  # Mosteller formula. A missing measurement gives missing; a negative
  # height times weight has no real square root and stops the run.
  - name: BSA
    type: float
    label: Body Surface Area (m2)
    derivation:
      compute:
        expr: "SQRT(HEIGHTCM * WEIGHTKG / 3600)"
