schema_version: "1.0"
domain: ADEG
keys: [STUDYID, USUBJID, PARAMCD, AVISIT]
input:
  ADEG_RAW: {path: input/adeg.csv, types: {AVAL: float}}

output:
  path: adeg.csv
  columns: [STUDYID, USUBJID, PARAMCD, PARAM, AVISIT, AVAL, AVALU]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: ADEG_RAW.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: ADEG_RAW.USUBJID

  - name: PARAMCD
    type: str
    label: Parameter Code

  - name: PARAM
    type: str
    label: Parameter

  - name: AVISIT
    type: str
    label: Analysis Visit
    derivation: ADEG_RAW.AVISIT

  - name: QTVAL
    type: float
    label: QT Interval

  - name: RRVAL
    type: float
    label: RR Interval

  - name: AVAL
    type: float
    label: Analysis Value

  - name: AVALU
    type: str
    label: Analysis Value Unit

rows:
  - id: original
    derivations:
      PARAMCD:
        source: ADEG_RAW.PARAMCD
      PARAM:
        source: ADEG_RAW.PARAM
      AVAL:
        source: ADEG_RAW.AVAL
      QTVAL:
        literal: null
      RRVAL:
        literal: null
      AVALU:
        source: ADEG_RAW.AVALU
  - id: qtcfr
    group_by: [ADEG_RAW.STUDYID, ADEG_RAW.USUBJID, ADEG_RAW.AVISIT]
    filter: "QTVAL IS NOT NULL AND RRVAL IS NOT NULL"
    derivations:
      PARAMCD:
        literal: QTCFR
      PARAM:
        literal: "QTcF - Fridericia's Correction Formula Rederived (ms)"
      QTVAL:
        aggregate:
          filter: "ADEG_RAW.PARAMCD = 'QT'"
          expr: "ONLY(ADEG_RAW.AVAL)"
      RRVAL:
        aggregate:
          filter: "ADEG_RAW.PARAMCD = 'RR'"
          expr: "ONLY(ADEG_RAW.AVAL)"
      AVAL:
        compute:
          expr: "QTVAL / POWER(RRVAL / 1000, 1 / 3)"
      AVALU:
        literal: ms

verifications:
  - unique:
      columns: [STUDYID, USUBJID, PARAMCD, AVISIT]
  - row_count:
      min: 8
      max: 8
  - implies:
      id: derived-parameter-has-expected-unit
      when: "PARAMCD = 'QTCFR'"
      then: "AVALU = 'ms'"
