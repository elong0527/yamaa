schema_version: "1.0"
domain: ADAE
keys: [STUDYID, USUBJID, AESEQ]
input:
  AE:
    path: input/ae.csv
    types: {AESEQ: int, AESTDTC: date}
intermediates:
  # Each subject's first COVID-19 event: earliest start, then lowest AESEQ.
  - id: FIRSTCOV
    dataset: AE
    key: [STUDYID, USUBJID]
    filter: "AE.AEDECOD = 'COVID-19'"
    order_by: [AE.AESTDTC, AE.AESEQ]
    keep: first

output:
  path: adae.csv
  columns: [STUDYID, USUBJID, AESEQ, AEDECOD, ASTDT, AFTCOVFL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: AE.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: AE.USUBJID

  - name: AESEQ
    type: int
    label: Sequence Number
    derivation: AE.AESEQ

  - name: AEDECOD
    type: str
    label: Dictionary-Derived Term
    derivation: AE.AEDECOD

  - name: ASTDT
    type: date
    label: Analysis Start Date
    derivation: AE.AESTDTC

  # Strictly after the first COVID-19 event in (start date, AESEQ) order.
  # A missing start compares as unknown, so the flag stays empty.
  - name: AFTCOVFL
    type: str
    label: After First COVID-19 Flag
    derivation:
      flag:
        condition: >-
            ASTDT > FIRSTCOV.AESTDTC OR
            (ASTDT = FIRSTCOV.AESTDTC AND AESEQ > FIRSTCOV.AESEQ)

verifications:
  - unique:
      columns: [STUDYID, USUBJID, AESEQ]
  - row_count:
      min: 11
      max: 11
