schema_version: "1.0"
domain: ADEX
keys: [STUDYID, USUBJID, EXSEQ]
input:
  EX: {path: input/ex.csv, types: {EXSEQ: int}}

output:
  path: adex.csv
  columns: [STUDYID, USUBJID, EXSEQ, EXSTDY]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: EX.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: EX.USUBJID

  - name: EXSEQ
    type: int
    label: Sequence Number
    derivation: EX.EXSEQ

  # EX.EXSTDT has no declared input type, so it is text, and to_epoch_day
  # counts days only from a date: the specification is rejected before any
  # data is read.
  - name: EXSTDY
    type: int
    label: Epoch Day of Exposure Start
    derivation:
      to_epoch_day:
        source: EX.EXSTDT

# One row for each exposure record with sequence number 1.
rows:
  - id: exposure
    filter: "EX.EXSEQ = 1"
    derivations: {}
