schema_version: "1.0"
domain: ADVS
keys: [STUDYID, USUBJID, VSSEQ]
input:
  VS: input/vs.csv

output:
  path: advs.csv
  columns: [STUDYID, USUBJID, VSSEQ, SEVAL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: VS.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: VS.USUBJID

  - name: VSSEQ
    type: int
    label: Sequence Number
    derivation: VS.VSSEQ

  # SEVAL lists itself as its own fallback. A column cannot read its own
  # value, so the cycle rejects the specification before any data is read.
  - name: SEVAL
    type: int
    label: Severity Value
    derivation:
      first_available:
        sources: [VS.SEVAL, SEVAL]
        missing: 0
