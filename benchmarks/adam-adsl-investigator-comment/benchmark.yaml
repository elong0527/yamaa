lifecycle: reviewed
standard: ADaM
domain: ADSL
review:
  concerns:
    - Investigator comments are free text that must reach ADSL exactly as
      written, with a flag for whether one was collected.
    - Six subjects cover a comment with a comma, one with quotation marks, one
      with a line break, empty fields, and a field of only spaces.
    - Commas, quotes and line breaks pass through unchanged, and a field that
      is empty or holds only spaces counts as no comment, so subject 106's
      two-space field gives no comment and CMNTFL N, as missing text does in
      SAS.
