schema_version: "1.0"
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  DM: input/dm.csv

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, CMNT, CMNTFL]
  order_by: [USUBJID]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  - name: REVIEWER
    type: str
    label: Reviewer Initials
    derivation: DM.REVIEWER

  - name: CMNT
    type: str
    label: Investigator Comment
    derivation: DM.COMMENT

  - name: CMNTFL
    type: str
    label: Comment Collected Flag
    derivation:
      case:
        - when: "CMNT IS NULL"
          then: {literal: "N"}
        - otherwise: {literal: "Y"}

verifications:
  - unique:
      columns: [STUDYID, USUBJID]
  - row_count:
      min: 5
      max: 5
  - implies:
      id: flag-follows-collection
      when: "CMNTFL = 'N'"
      then: "CMNT IS NULL"
