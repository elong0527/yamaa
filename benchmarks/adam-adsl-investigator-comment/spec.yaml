yamaa: "1.0"
type: spec
model: ADaM
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  DM: input/dm.csv
  CO: {path: input/co.csv, types: {COSEQ: int}, key: [STUDYID, USUBJID]}
base: DM

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, CMNT, CMNTFL]
  order_by: [USUBJID]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  # Each comment read as collected: the source file's quoting keeps a comma,
  # a doubled quote and a line break inside it. A comment longer than 200
  # characters continues in COVAL1, split between words, so the two parts
  # join with one space; an empty COVAL1, quoted or not, adds nothing. A
  # subject's comments join in COSEQ order.
  - name: CMNT
    type: str
    label: Investigator Comment
    derivation:
      aggregate:
        derivations:
          COTEXT:
            type: str
            derivation:
              case:
                - when: "CO.COVAL1 IS NULL"
                  then: CO.COVAL
                - otherwise:
                    str_template: "{CO.COVAL} {CO.COVAL1}"
        order_by: [CO.COSEQ]
        separator: "; "
        expr: "STR_JOIN(COTEXT)"

  - name: CMNTFL
    type: str
    label: Comment Collected Flag
    derivation:
      case:
        - when: "CMNT IS NULL"
          then: "'N'"
        - otherwise: "'Y'"

verifications:
  - row_count:
      min: 6
      max: 6
  - assert:
      id: flag-follows-collection
      when: "CMNTFL = 'N'"
      require: "CMNT IS NULL"
