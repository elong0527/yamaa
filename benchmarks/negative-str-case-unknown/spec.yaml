schema_version: "1.0"
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  DM: input/dm.csv

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, SITE]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  # The defect: capitalize is none of the four cases (upper, lower,
  # sentence, title), so the spec is rejected before any data is read.
  - name: SITE
    type: str
    label: Site Name
    derivation:
      str_case:
        source: DM.SITENM
        to: capitalize
