schema_version: "1.0"
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  DM: input/dm.csv

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, STDT, ENDT, DURW, DURM]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  - name: STDT
    type: date
    label: Start Date
    derivation: DM.STDT

  - name: ENDT
    type: date
    label: End Date
    derivation: DM.ENDT

  # Both durations run from STDT to ENDT: negative when ENDT is earlier,
  # empty when either date is missing.
  # Whole weeks: the day count divided by 7, any remainder dropped.
  - name: DURW
    type: int
    label: Duration in Whole Weeks
    derivation:
      date_diff:
        start: STDT
        end: ENDT
        unit: week

  # Whole months: anniversaries of STDT on or before ENDT, each keeping the
  # start day or the month's last day when the month is shorter.
  - name: DURM
    type: int
    label: Duration in Whole Months
    derivation:
      date_diff:
        start: STDT
        end: ENDT
        unit: month
