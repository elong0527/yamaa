schema_version: "1.0"
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  DM: input/dm.csv

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, SEX, SEXN, SEXDECOD, RACE, RACEN, AGE, AGEGR1]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  # The three sex columns match the collected sex without regard to case
  # ('m' is M). An empty or unlisted value takes the fallback: U, 0, Unknown.
  - name: SEX
    type: str
    label: Sex
    derivation:
      mapping:
        source: DM.SEX
        case_sensitive: false
        dict:
          M: M
          F: F
          U: U
        missing: U
    verifications:
      - not_missing: {}
      - allowed_values:
          values: [M, F, U]
      - matches:
          pattern: '^[MFU]$'

  - name: SEXN
    type: int
    label: Sex (N)
    derivation:
      mapping:
        source: DM.SEX
        case_sensitive: false
        dict:
          M: 1
          F: 2
          U: 0
        missing: 0

  - name: SEXDECOD
    type: str
    label: Sex Decoded
    derivation:
      mapping:
        source: DM.SEX
        case_sensitive: false
        dict:
          M: Male
          F: Female
          U: Unknown
        missing: Unknown

  - name: RACE
    type: str
    label: Race
    derivation: DM.RACE

  # Matched exactly as collected: a race in other case or wording is 99, as
  # is an empty race.
  - name: RACEN
    type: int
    label: Race (N)
    derivation:
      mapping:
        source: DM.RACE
        dict:
          WHITE: 1
          BLACK OR AFRICAN AMERICAN: 2
          ASIAN: 3
        missing: 99

  # A collected age that is not a whole number (text, or 34.5) cannot become
  # an int; the fallback makes it empty instead of stopping the run.
  - name: AGE
    type: int
    label: Age
    derivation:
      value:
        source: DM.AGE
      missing: null
    verifications:
      - range:
          min: 0
          max: 120

  # Under 18, 18 to 64, and 65 or over: each group includes its lower
  # break. An empty AGE is UNKNOWN.
  - name: AGEGR1
    type: str
    label: Pooled Age Group 1
    derivation:
      cut:
        source: AGE
        breaks: [18, 65]
        labels: ['<18', '18-64', '>=65']
        missing: UNKNOWN

verifications:
  - unique:
      columns: [STUDYID, USUBJID]
  - row_count:
      min: 8
      max: 8
  - assert:
      id: numeric-mappings-are-in-range
      expr: "SEXN >= 0 AND RACEN >= 1"
