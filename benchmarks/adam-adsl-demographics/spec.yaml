schema_version: "1.0"
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  DM: input/dm.csv

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, SEX, SEXN, RACE, RACEN, AGE, AGEGR1]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  # SEX carries the collected DM value through unchanged; a missing source
  # becomes U. SEXN is the numeric code of the carried SEX.
  - name: SEX
    type: str
    label: Sex
    derivation:
      first_available:
        sources: [DM.SEX]
        missing: U
    verifications:
      - not_missing: {}
      - allowed_values:
          values: [M, F, U]
      - matches:
          pattern: '^[MFU]$'

  - name: SEXN
    type: int
    label: Sex (N)
    derivation:
      mapping:
        source: SEX
        dict:
          M: 1
          F: 2
          U: 0
        missing: 0

  - name: RACE
    type: str
    label: Race
    derivation: DM.RACE

  # Matched exactly as collected: MULTIPLE has its own code, a race in
  # other case or wording is 99, and an empty race leaves RACEN empty.
  - name: RACEN
    type: int
    label: Race (N)
    derivation:
      mapping:
        source: DM.RACE
        dict:
          WHITE: 1
          BLACK OR AFRICAN AMERICAN: 2
          ASIAN: 3
          MULTIPLE: 4
        missing: null
        unmapped: 99

  # A collected age that is not a whole number (text, or 34.5) cannot become
  # an int; the fallback makes it empty instead of stopping the run.
  - name: AGE
    type: int
    label: Age
    derivation:
      value:
        source: DM.AGE
      missing: null
    verifications:
      - range:
          min: 0
          max: 120

  # Under 18, 18 to 64, and 65 or over: each group includes its lower
  # break. An empty AGE is UNKNOWN.
  - name: AGEGR1
    type: str
    label: Pooled Age Group 1
    derivation:
      cut:
        source: AGE
        breaks: [18, 65]
        labels: ['<18', '18-64', '>=65']
        missing: UNKNOWN

verifications:
  - unique:
      columns: [STUDYID, USUBJID]
  - row_count:
      min: 11
      max: 11
  - assert:
      id: numeric-mappings-are-in-range
      expr: "SEXN >= 0 AND (RACEN IS NULL OR RACEN >= 1)"
