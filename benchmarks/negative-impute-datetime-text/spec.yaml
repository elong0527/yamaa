schema_version: "1.0"
domain: ADSL
keys: [STUDYID, USUBJID, EXSEQ]
input:
  EX: input/ex.csv

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, EXSEQ, TRTSDTM]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: EX.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: EX.USUBJID

  - name: EXSEQ
    type: int
    label: Sequence Number
    derivation: EX.EXSEQ

  # A collected date/time is kept and a complete date gets the first second
  # of its day; a start cut off before its day, such as 2025-01, gives no
  # date/time. No invalid handler is declared, so a start that is not ISO
  # 8601 date or date/time text, such as one written with a space before
  # its time, stops the run.
  - name: TRTSDTM
    type: datetime
    label: Datetime of First Exposure to Treatment
    derivation:
      impute:
        type: datetime
        source: EX.EXSTDTC
        minimum_source_precision: day
        time: first
