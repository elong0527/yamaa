schema_version: "1.0"
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  DM: input/dm.csv

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, AGEGRP]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  - name: SEX
    type: str
    label: Sex
    derivation: DM.SEX

  # The age bands are applied to the coded sex, a text column, where a
  # number such as the age belongs.
  - name: AGEGRP
    type: str
    label: Age Group
    derivation:
      cut:
        source: SEX
        breaks: [65]
        labels: [younger, elderly]
