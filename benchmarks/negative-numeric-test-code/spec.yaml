yamaa: "1.0"
type: spec
model: SDTM
domain: LB
keys: [STUDYID, USUBJID, LBTESTCD]
input:
  LB_RAW: input/lb_raw.csv

output:
  path: lb.csv
  columns: [STUDYID, USUBJID, LBTESTCD, LBORRES]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: LB_RAW.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: LB_RAW.USUBJID

  # The laboratory numbers its tests, so the test code was declared an
  # integer. Each test's result length below applies to the rows carrying
  # that test code, which an integer column never holds, so the
  # specification is rejected before any data is read.
  - name: LBTESTCD
    type: int
    label: Lab Test or Examination Short Name

  # Each test states its own maximum result length.
  - name: LBORRES
    type: str
    label: Result or Finding in Original Units
    submission:
      length: 4
      origins:
        - type: Collected
          source: Vendor
      value_level:
        - id: GLUC
          where: {LBTESTCD: ["1001"]}
          length: 4
        - id: CREAT
          where: {LBTESTCD: ["1002"]}
          length: 3

rows:
  # One glucose and one creatinine record per collected sample.
  - id: glucose
    derivations:
      LBTESTCD: "'1001'"
      LBORRES: LB_RAW.GLUC

  - id: creatinine
    derivations:
      LBTESTCD: "'1002'"
      LBORRES: LB_RAW.CREAT
