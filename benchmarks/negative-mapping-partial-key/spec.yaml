schema_version: "1.0"
domain: ADLB
keys: [STUDYID, USUBJID, PARAMCD]
input:
  LB: input/lb.csv
  LBREF: input/lbref.csv
base: LB

output:
  path: adlb.csv
  columns: [STUDYID, USUBJID, PARAMCD, SEX, AVAL, ANRHI]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: LB.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: LB.USUBJID

  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation: LB.LBTESTCD

  - name: SEX
    type: str
    label: Sex
    derivation: LB.SEX

  - name: AVAL
    type: float
    label: Analysis Value
    derivation: LB.LBSTRESN

  # The upper limit for the parameter and sex. strict: a result that finds
  # no limit, including one with a blank sex, stops the run.
  - name: ANRHI
    type: float
    label: Analysis Normal Range Upper Limit
    derivation:
      lookup:
        key_base: [PARAMCD, SEX]
        dataset: LBREF
        key: [LBTESTCD, SEX]
        value: ANRHI
        strict: true
