schema_version: "1.0"
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  DM: input/dm.csv

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, ELDFL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  # The flag is written as a bare number instead of a predicate string or
  # a mapping naming its condition.
  - name: ELDFL
    type: str
    label: Elderly Flag
    derivation:
      flag: 65
