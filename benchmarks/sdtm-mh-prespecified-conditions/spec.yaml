schema_version: "1.0"
domain: MH
keys: [STUDYID, USUBJID, MHSEQ]
input:
  ODM:
    path: input/odm.csv
    types: {StudyEventRepeatKey: int, ItemGroupRepeatKey: int}
  MH_ITEMS:
    path: input/mh_items.csv
    types: {SORTORD: int}

output:
  path: mh.csv
  columns: [DOMAIN, STUDYID, USUBJID, MHSEQ, MHTERM, MHCAT, MHPRESP, MHOCCUR,
            MHSTAT]
  order_by: [USUBJID, MHSEQ]

intermediates:
  - id: MH_MAP
    dataset: MH_ITEMS
    key: {ItemOID: ODM.ItemOID}

columns:
  - name: DOMAIN
    type: str
    label: Domain Abbreviation
    derivation: {literal: MH}

  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: ODM.StudyOID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: ODM.SubjectKey

  - name: MHTERM
    type: str
    label: Reported Term for the Medical History
    verifications:
      - not_missing: {}

  - name: MHCAT
    type: str
    label: Category for Medical History

  - name: MHPRESP
    type: str
    label: Pre-Specified Medical History Indicator
    verifications:
      - allowed_values:
          values: [Y]

  - name: MHOCCUR
    type: str
    label: Medical History Occurrence
    verifications:
      - allowed_values:
          values: [Y, N]

  - name: MHSTAT
    type: str
    label: Completion Status
    verifications:
      - allowed_values:
          values: [NOT DONE]

  # SORTORD, EVENTORD, EVENTREPEAT and REPEATKEY exist only to order MHSEQ;
  # none is in the output.
  - name: SORTORD
    type: int
    label: Record order within a subject

  - name: EVENTORD
    type: int
    label: Collection event order

  - name: EVENTREPEAT
    type: int
    label: Collection event repeat
    derivation: ODM.StudyEventRepeatKey

  - name: REPEATKEY
    type: int
    label: Medical history form repeat
    derivation: ODM.ItemGroupRepeatKey

  # Checklist conditions in form order first, then volunteered conditions by
  # visit, visit repeat, and form repeat.
  - name: MHSEQ
    type: int
    label: Sequence Number
    derivation:
      row_number:
        window:
          group_by: [STUDYID, USUBJID]
          order_by: [SORTORD, EVENTORD, EVENTREPEAT, REPEATKEY]

rows:
  # One record per checklist item recorded at screening, answered or not.
  # The term and form order come from the item-definition table; an item
  # it does not define stops the run. Derivations run before the row
  # filter, so each unhandled operation is guarded by a case that only runs
  # it on the rows it is total over; the filter discards the rest.
  - id: checklist
    dataset: ODM
    filter: >-
      ODM.StudyEventOID = 'SCREENING'
      AND ODM.ItemGroupOID = 'IG.MH.CHECKLIST'
    derivations:
      MHTERM:
        case:
          - when: "ODM.ItemGroupOID = 'IG.MH.CHECKLIST'"
            then: MH_MAP.MHTERM
          - otherwise: {literal: null}
      MHCAT: {literal: DISEASE-SPECIFIC HISTORY}
      MHPRESP: {literal: Y}
      # The answer is Y, N, or blank for an item left unanswered.
      MHOCCUR:
        case:
          - when: "ODM.Value = 'Y'"
            then: {literal: Y}
          - when: "ODM.Value = 'N'"
            then: {literal: N}
          - otherwise: {literal: null}
      MHSTAT:
        case:
          - when: "ODM.Value IS NULL"
            then: {literal: NOT DONE}
          - otherwise: {literal: null}
      SORTORD:
        case:
          - when: "ODM.ItemGroupOID = 'IG.MH.CHECKLIST'"
            then: MH_MAP.SORTORD
          - otherwise: {literal: null}
      EVENTORD:
        case:
          - when: "ODM.StudyEventOID IN ('SCREENING', 'BASELINE')"
            then:
              mapping:
                source: ODM.StudyEventOID
                dict:
                  SCREENING: 1
                  BASELINE: 2
          - otherwise: {literal: 99}

  # One record per non-blank free-text condition. SORTORD 4 places these
  # after the three checklist items; a visit other than SCREENING or
  # BASELINE stops the run.
  - id: volunteered
    dataset: ODM
    filter: >-
      ODM.ItemGroupOID = 'IG.MH.FREETEXT' AND ODM.ItemOID = 'IT.MH.MHTERM'
      AND ODM.Value IS NOT NULL
    derivations:
      MHTERM: ODM.Value
      MHCAT: {literal: GENERAL HISTORY}
      MHPRESP: {literal: null}
      MHOCCUR: {literal: null}
      MHSTAT: {literal: null}
      SORTORD: {literal: 4}
      EVENTORD:
        case:
          # Guard the unhandled mapping with this template's filter. A retained
          # free-text condition at an unknown visit still fails loudly.
          - when: >-
              ODM.ItemGroupOID = 'IG.MH.FREETEXT'
              AND ODM.ItemOID = 'IT.MH.MHTERM'
              AND ODM.Value IS NOT NULL
            then:
              mapping:
                source: ODM.StudyEventOID
                dict:
                  SCREENING: 1
                  BASELINE: 2
          - otherwise: {literal: 99}

verifications:
  - unique:
      columns: [STUDYID, USUBJID, MHSEQ]
  - row_count:
      min: 10
      max: 10
  - implies:
      id: unanswered-prespecified-has-status
      when: "MHPRESP = 'Y' AND MHOCCUR IS NULL"
      then: "MHSTAT = 'NOT DONE'"
