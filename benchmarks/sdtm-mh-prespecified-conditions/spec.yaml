schema_version: '1.0'
domain: MH
keys:
  - STUDYID
  - USUBJID
  - MHSEQ
input:
  ODM:
    path: input/odm.csv
    types:
      StudyEventRepeatKey: int
      ItemGroupRepeatKey: int
  MH_ITEMS:
    path: input/mh_items.csv
    types:
      SORTORD: int
output:
  path: mh.csv
  columns:
    - DOMAIN
    - STUDYID
    - USUBJID
    - MHSEQ
    - MHTERM
    - MHCAT
    - MHPRESP
    - MHOCCUR
    - MHSTAT
  order_by:
    - USUBJID
    - MHSEQ
columns:
  - name: DOMAIN
    type: str
    label: Domain Abbreviation
    derivation: {literal: MH}
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: ODM.StudyOID
  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: ODM.SubjectKey
  - name: MHTERM
    type: str
    label: Reported Term for the Medical History
    verifications:
      - not_missing: {}
  - name: MHCAT
    type: str
    label: Category for Medical History
  - name: ANSWER
    type: str
    label: Raw answer to the pre-specified checklist question
  - name: MHPRESP
    type: str
    label: Pre-Specified Medical History Indicator
    verifications:
      - allowed_values:
          values:
            - Y
  - name: MHOCCUR
    type: str
    label: Medical History Occurrence
    verifications:
      - allowed_values:
          values:
            - Y
            - N
  - name: MHSTAT
    type: str
    label: Completion Status
    verifications:
      - allowed_values:
          values:
            - NOT DONE
  - name: SORTORD
    type: int
    label: Record order within a subject
  - name: EVENTORD
    type: int
    label: Collection event order
  - name: EVENTREPEAT
    type: int
    label: Collection event repeat
  - name: REPEATKEY
    type: int
    label: Medical history form repeat
  - name: MHSEQ
    type: int
    label: Sequence Number
    derivation:
      row_number:
        window:
          group_by:
            - STUDYID
            - USUBJID
          order_by:
            - SORTORD
            - EVENTORD
            - EVENTREPEAT
            - REPEATKEY
rows:
  - id: checklist
    dataset: ODM
    filter: ODM.StudyEventOID = 'SCREENING' AND ODM.ItemGroupOID = 'IG.MH.CHECKLIST'
    derivations:
      MHTERM:
        lookup:
          dataset: MH_ITEMS
          key_base: ODM.ItemOID
          key: ItemOID
          value: MHTERM
          strict: true
      MHCAT: {literal: DISEASE-SPECIFIC HISTORY}
      ANSWER: ODM.Value
      MHPRESP: {literal: Y}
      MHOCCUR:
        case:
          - when: ANSWER = 'Y'
            then: {literal: Y}
          - when: ANSWER = 'N'
            then: {literal: N}
          - otherwise: {literal: null}
      MHSTAT:
        case:
          - when: ANSWER IS NULL
            then: {literal: NOT DONE}
          - otherwise: {literal: null}
      SORTORD:
        lookup:
          dataset: MH_ITEMS
          key_base: ODM.ItemOID
          key: ItemOID
          value: SORTORD
          strict: true
      EVENTORD:
        mapping:
          source: ODM.StudyEventOID
          dict:
            SCREENING: 1
            BASELINE: 2
          strict: true
      EVENTREPEAT: ODM.StudyEventRepeatKey
      REPEATKEY: ODM.ItemGroupRepeatKey
  - id: volunteered
    dataset: ODM
    filter: ODM.ItemGroupOID = 'IG.MH.FREETEXT' AND ODM.ItemOID = 'IT.MH.MHTERM' AND ODM.Value
      IS NOT NULL
    derivations:
      MHTERM: ODM.Value
      MHCAT: {literal: GENERAL HISTORY}
      ANSWER: {literal: null}
      MHPRESP: {literal: null}
      MHOCCUR: {literal: null}
      MHSTAT: {literal: null}
      SORTORD: {literal: 4}
      EVENTORD:
        mapping:
          source: ODM.StudyEventOID
          dict:
            SCREENING: 1
            BASELINE: 2
          strict: true
      EVENTREPEAT: ODM.StudyEventRepeatKey
      REPEATKEY: ODM.ItemGroupRepeatKey
verifications:
  - unique:
      columns:
        - STUDYID
        - USUBJID
        - MHSEQ
  - row_count:
      min: 10
      max: 10
  - implies:
      id: unanswered-prespecified-has-status
      when: MHPRESP = 'Y' AND MHOCCUR IS NULL
      then: MHSTAT = 'NOT DONE'
