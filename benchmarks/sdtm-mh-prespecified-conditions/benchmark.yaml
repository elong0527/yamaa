lifecycle: draft
standard: SDTM
domain: MH
review:
  concerns:
    - Disease-specific medical history is often a checklist of pre-specified
      conditions, and analysis must tell an answered No apart from a question
      left unanswered.
    - Two subjects answer a three-item checklist, with one item left blank, and
      volunteer four free-text conditions, one at a later visit with a reused
      repeat number.
    - An unanswered checklist item becomes a NOT DONE record (subject 0001's
      asthma), but a question missing from the extract is not assumed to have
      been asked, and volunteered conditions carry no occurrence answer.
