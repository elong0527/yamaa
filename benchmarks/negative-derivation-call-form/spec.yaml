schema_version: "1.0"
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  DM: input/dm.csv

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, BRTHDT]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  # A bare string is only ever the name of a value to copy. This one is
  # written like a function call, which names no value.
  - name: BRTHDT
    type: date
    label: Date of Birth
    derivation: to_date(DM.BRTHDTC)
