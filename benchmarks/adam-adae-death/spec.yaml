schema_version: "1.0"
domain: ADAE
keys: [STUDYID, USUBJID, AESEQ]
input:
  AE: input/ae.csv
  DM: input/dm.csv
base: AE
intermediates:
  - id: DEATHEV
    dataset: AE
    key: [STUDYID, USUBJID]
    filter: "AE.AEOUT = 'FATAL'"
    order_by: [AE.ASTDT, AE.AESEQ]
    keep: last

output:
  path: adae.csv
  columns: [STUDYID, USUBJID, AESEQ, AEDECOD, ASTDT, DTHFL, DTHCAUS, DTHDT]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: AE.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: AE.USUBJID

  - name: AESEQ
    type: int
    label: Sequence Number
    derivation: AE.AESEQ

  - name: AEDECOD
    type: str
    label: Dictionary-Derived Term
    derivation: AE.AEDECOD

  - name: ASTDT
    type: date
    label: Analysis Start Date
    derivation: AE.ASTDT

  - name: EVDTHDT
    type: date
    label: Death Date from Fatal Event
    derivation: DEATHEV.ASTDT

  - name: WINAESEQ
    type: int
    label: Sequence Number of the Fatal Event Setting the Death Date
    derivation: DEATHEV.AESEQ

  - name: DMDTHDT
    type: date
    label: Death Date from Demographics
    derivation: DM.DTHDT
  - name: FATALFL
    type: str
    label: Fatal Event Flag
    derivation:
      case:
        - when: "AE.AEOUT = 'FATAL'"
          then:
            literal: Y

  - name: DTHFL
    type: str
    label: Death Flag
    derivation:
      case:
        - when: "EVDTHDT IS NOT NULL OR DMDTHDT IS NOT NULL"
          then:
            literal: Y
    verifications:
      allowed_values:
        values: [Y]

  - name: DTHCAUS
    type: str
    label: Cause of Death
    derivation: DEATHEV.AEDECOD

  - name: DTHDT
    type: date
    label: Date of Death
    derivation:
      first_available:
        sources: [EVDTHDT, DMDTHDT]

verifications:
  - unique:
      columns: [STUDYID, USUBJID, AESEQ]
  - row_count:
      min: 10
      max: 10
  - implies:
      id: fatal-event-carries-its-own-cause
      when: "FATALFL = 'Y' AND AESEQ = WINAESEQ"
      then: "DTHCAUS = AEDECOD AND DTHDT = ASTDT"
  - implies:
      id: no-cause-without-a-fatal-event
      when: "DTHCAUS IS NOT NULL"
      then: "DTHDT IS NOT NULL"
  - implies:
      id: death-date-marks-the-subject
      when: "DTHDT IS NOT NULL"
      then: "DTHFL = 'Y'"
