yamaa: "1.0"
type: spec
model: SDTM
domain: CO
keys: [STUDYID, USUBJID, COSEQ]
input:
  CO_RAW: {path: input/co_raw.csv, types: {COSEQ: int}}

output:
  path: co.csv
  columns: [DOMAIN, STUDYID, USUBJID, COSEQ, COVAL]

columns:
  - {name: DOMAIN, type: str, label: Domain Abbreviation, derivation: "'CO'"}

  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: CO_RAW.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: CO_RAW.USUBJID

  - {name: COSEQ, type: int, label: Sequence Number, derivation: CO_RAW.COSEQ}

  - name: COVAL
    type: str
    label: Comment
    derivation: CO_RAW.COMMENT

  # The defect: the length is counted from the comment number, an integer,
  # instead of the comment text, so the spec is rejected before any data is
  # read.
  - name: COLEN
    type: int
    label: Comment Length
    derivation:
      str_length: {source: CO_RAW.COSEQ}
    verifications:
      - range: {max: 200}
