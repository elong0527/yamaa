schema_version: "1.0"
domain: ADAE
keys: [STUDYID, USUBJID, AESEQ]
input:
  AE:
    path: input/ae.csv
    types: {AESEQ: int, AESTDTC: date, AESTDTM: datetime, SCORE: float}
base: AE

output:
  path: adae.csv
  columns: [STUDYID, USUBJID, AESEQ, ASTDT, ASTDT2, REVIEWFL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: AE.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: AE.USUBJID

  - name: AESEQ
    type: int
    label: Sequence Number
    derivation: AE.AESEQ

  - name: ASTDT
    type: date
    label: Analysis Start Date
    derivation: AE.AESTDTC

  - name: ASTDT2
    type: date
    label: Analysis Start Date from Datetime
    derivation:
      to_date: {source: AE.AESTDTM}

  # Three checks: a review window (January 2025 by date, or from 09:30 on
  # 1 February 2025 by datetime), a term starting with the literal text INF_
  # ('!' escapes the underscore), and a score floor. An event with no known
  # start cannot be shown in the window, so it falls through to N.
  - name: REVIEWFL
    type: str
    label: Protocol Review Flag
    derivation:
      case:
        - when: >-
            (ASTDT BETWEEN DATE '2025-01-01' AND DATE '2025-01-31'
              OR AE.AESTDTM >= DATETIME '2025-02-01T09:30')
            AND AE.AETERM LIKE 'INF!_%' ESCAPE '!'
            AND AE.SCORE >= -1.5
          then: {literal: Y}
        - otherwise: {literal: N}
    verifications:
      allowed_values: {values: [Y, N]}

verifications:
  - unique: {columns: [STUDYID, USUBJID, AESEQ]}
  - row_count: {min: 12, max: 12}
