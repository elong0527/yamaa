schema_version: "1.0"
domain: DM
keys: [STUDYID, USUBJID]

input:
  ODM:
    path: input/odm.csv
    types:
      StudyEventRepeatKey: int

output:
  path: dm.csv
  columns: [DOMAIN, STUDYID, USUBJID, SEX, AGE]

columns:
  - name: DOMAIN
    type: str
    label: Domain Abbreviation
    derivation:
      literal: DM

  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: ODM.StudyOID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: ODM.SubjectKey

  - name: SEX
    type: str
    label: Sex
    derivation:
      mapping:
        source:
          filter: ODM.ItemOID = 'IT.DM.SEX'
          variable: ODM.Value
        dict:
          Male: M
          Female: F
        missing: U

  - name: AGE
    type: int
    label: Age
    derivation:
      source:
        filter: ODM.ItemOID = 'IT.DM.AGE'
        variable: ODM.Value
