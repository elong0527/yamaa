schema_version: '1.0'
codelists:
  - standard:
      name: CDISC/NCI
      publishing_set: SDTM
      version: '2023-12-15'
    codelists:
      - id: SEX
        name: Sex
        alias: C66731
        # The sex codes are text, so the format a reader applies to them is a
        # character format; this name lacks the dollar sign that begins one.
        format_name: SEX
        items:
          - {value: F, decode: Female, alias: C16576}
          - {value: M, decode: Male, alias: C20197}
          - {value: U, decode: Unknown, alias: C17998}
sdtm:
  specs:
  - spec.yaml
