lifecycle: reviewed
standard: SDTM
domain: AE
review:
  concerns:
    - Serious adverse events drive expedited reporting and their own safety
      tables, so the seriousness flag must reflect any of the six criteria.
    - Four events cover hospitalization alone, two criteria at once, no
      criteria, and an event whose criteria were all left empty.
    - An event with every criterion empty (subject 004's FATIGUE) is reported as
      not serious, with its empty flags kept empty, rather than being treated as
      unknown.
