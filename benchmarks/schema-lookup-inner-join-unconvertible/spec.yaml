yamaa: "1.0"
type: spec
domain: AECM
keys: [USUBJID, AESEQ, CMSEQ]
input:
  AE: {path: input/ae.csv, types: {AESEQ: int}}
  CM: {path: input/cm.csv, types: {CMSEQ: int}}

output:
  path: aecm.csv
  columns: [USUBJID, AESEQ, CMSEQ, CMTRT, CMDOSE]
  # How many pairs held a dose that is no number is counted in the run
  # report, which needs a report file.
  report: aecm-report.csv

intermediates:
  # Each adverse event paired with each medication of the same subject given
  # for its term, with the dose as a whole number: a dose collected as text
  # that is no number is left missing in each pair it is in.
  - id: GIVEN
    dataset: AE
    inner_join: CM
    key:
      USUBJID: AE.USUBJID
      CMINDC: AE.AETERM
    derivations:
      USUBJID: AE.USUBJID
      AESEQ: AE.AESEQ
      CMSEQ: CM.CMSEQ
      CMTRT: CM.CMTRT
      CMDOSE: {type: int, derivation: CM.CMDOSE, unconvertible: null}

columns:
  - name: USUBJID
    type: str
    label: Unique Subject Identifier

  - name: AESEQ
    type: int
    label: Sequence Number of the Adverse Event

  - name: CMSEQ
    type: int
    label: Sequence Number of the Medication

  - name: CMTRT
    type: str
    label: Reported Name of Drug, Med, or Therapy

  - name: CMDOSE
    type: int
    label: Dose per Administration

rows:
  - id: pairs
    dataset: GIVEN
    derivations:
      USUBJID: GIVEN.USUBJID
      AESEQ: GIVEN.AESEQ
      CMSEQ: GIVEN.CMSEQ
      CMTRT: GIVEN.CMTRT
      CMDOSE: GIVEN.CMDOSE
