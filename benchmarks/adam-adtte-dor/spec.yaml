yamaa: "1.0"
type: spec
model: ADaM
domain: ADTTE
keys: [STUDYID, USUBJID, PARAMCD]
input:
  ADSL: {path: input/adsl.csv, types: {RESPDT: date, NACTDT: date}}
  ADRS_RAW: {path: input/adrs_raw.csv, types: {ADT: date, ASEQ: int},
             key: [STUDYID, USUBJID]}
  DS: {path: input/ds.csv, key: [STUDYID, USUBJID]}
base: ADSL
# One record per responder: a subject with no response date has none.
filter: "ADSL.RESPDT IS NOT NULL"

output:
  path: adtte.csv
  columns: [STUDYID, USUBJID, PARAMCD, PARAM, STARTDT, ADT, AVAL, CNSR,
            EVNTDESC, CNSDTDSC, SRCDOM, SRCVAR, SRCSEQ]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: ADSL.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: ADSL.USUBJID

  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation: "'DOR'"

  - name: PARAM
    type: str
    label: Parameter
    derivation: "'Duration of Response'"

  - name: STARTDT
    type: date
    label: Time to Event Origin Date for Subject
    derivation: ADSL.RESPDT
    verifications:
      - not_missing

  # The therapy start as a date: ADSL is read as text, and the comparisons
  # below need a date.
  - name: NACTDT
    type: date
    label: New Anti-Cancer Therapy Start Date
    derivation: ADSL.NACTDT

  # The earliest progression (PD) and its record, ties on a date to the
  # lower ASEQ. An undated record can never be the progression: the
  # date pick (MIN) skips blank dates, so the sequence pick must skip
  # them too, or it would name a record its own date does not match
  # (issue #1008).
  - name: PDDT
    type: date
    label: Disease Progression Date
    derivation:
      aggregate:
        filter: "ADRS_RAW.AVALC = 'PD' AND ADRS_RAW.ADT IS NOT NULL"
        expr: "MIN(ADRS_RAW.ADT)"

  - name: PDSEQ
    type: int
    label: Disease Progression Source Sequence Number
    derivation:
      source:
        variable: ADRS_RAW.ASEQ
        filter: "ADRS_RAW.AVALC = 'PD' AND ADRS_RAW.ADT IS NOT NULL"
        order_by: [ADRS_RAW.ADT, ADRS_RAW.ASEQ]
        keep: first

  # The earliest death in disposition, ties on a date to the lower DSSEQ.
  # An undated death record is skipped for the same reason as an undated
  # progression record above.
  - name: DEATHDT
    type: date
    label: Death Date
    derivation:
      aggregate:
        filter: "DS.DSDECOD = 'DEATH' AND DS.DSSTDTC IS NOT NULL"
        expr: "MIN(DS.DSSTDTC)"

  - name: DEATHSEQ
    type: int
    label: Death Source Sequence Number
    derivation:
      source:
        variable: DS.DSSEQ
        filter: "DS.DSDECOD = 'DEATH' AND DS.DSSTDTC IS NOT NULL"
        order_by: [DS.DSSTDTC, DS.DSSEQ]
        keep: first

  # The latest assessment with a response other than not evaluable (NE),
  # ties on a date to the higher ASEQ. An undated assessment is never the
  # latest valid one: the date pick (MAX) skips blank dates, so the
  # sequence pick must skip them too (issue #1008).
  - name: LASTVLDT
    type: date
    label: Last Valid Assessment Date
    derivation:
      aggregate:
        filter: "ADRS_RAW.AVALC <> 'NE' AND ADRS_RAW.ADT IS NOT NULL"
        expr: "MAX(ADRS_RAW.ADT)"

  - name: LASTVLSEQ
    type: int
    label: Last Valid Assessment Sequence Number
    derivation:
      source:
        variable: ADRS_RAW.ASEQ
        filter: "ADRS_RAW.AVALC <> 'NE' AND ADRS_RAW.ADT IS NOT NULL"
        order_by: [ADRS_RAW.ADT, ADRS_RAW.ASEQ]
        keep: last

  # The latest valid assessment dated on or before the start of new
  # anti-cancer therapy (issue #4873): the usual censoring rule, as the PFS
  # benchmark applies it. The between match is per current row, so a
  # missing therapy date admits no records and the aggregate is empty.
  - name: PRENACTDT
    type: date
    label: Last Valid Assessment By New-Therapy Start
    derivation:
      aggregate:
        filter: "ADRS_RAW.AVALC <> 'NE' AND ADRS_RAW.ADT IS NOT NULL"
        group_by: [ADRS_RAW.STUDYID, ADRS_RAW.USUBJID]
        between:
          value: NACTDT
          lower: ADT
        expr: "MAX(ADRS_RAW.ADT)"

  # The sequence number of that assessment: the highest among the valid
  # records sharing its date.
  - name: PRENACTSEQ
    type: int
    label: Sequence of Last Valid Assessment By New-Therapy Start
    derivation:
      aggregate:
        filter: "ADRS_RAW.AVALC <> 'NE' AND ADRS_RAW.ADT IS NOT NULL"
        group_by: [ADRS_RAW.STUDYID, ADRS_RAW.USUBJID]
        between:
          value: PRENACTDT
          lower: ADT
          upper: ADT
        expr: "MAX(ADRS_RAW.ASEQ)"

  # The assessment that supplies a censoring date: the last valid one, or,
  # when new therapy started, the last valid one by therapy start. Empty
  # when no valid assessment is usable.
  - name: CENSASDT
    type: date
    label: Censoring Assessment Date
    derivation:
      case:
        - when: "NACTDT IS NULL"
          then: LASTVLDT
        - otherwise: PRENACTDT

  - name: CENSASSEQ
    type: int
    label: Censoring Assessment Sequence Number
    derivation:
      case:
        - when: "NACTDT IS NULL"
          then: LASTVLSEQ
        - otherwise: PRENACTSEQ

  - name: EVENTALLDT
    type: date
    label: Earliest Progression or Death Date
    derivation:
      least:
        sources: [PDDT, DEATHDT]

  # The first of progression and death counts only on or before the start
  # of a new anti-cancer therapy; with no therapy start it always counts.
  - name: EVENTDT
    type: date
    label: Event Date
    derivation:
      case:
        - when: "EVENTALLDT IS NOT NULL AND (NACTDT IS NULL
            OR EVENTALLDT <= NACTDT)"
          then: EVENTALLDT

  - name: CNSR
    type: int
    label: Censor
    derivation:
      case:
        - when: "EVENTDT IS NOT NULL"
          then: 0
        - otherwise: 1

  - name: EVNTDESC
    type: str
    label: Event or Censoring Description
    derivation:
      case:
        - when: "EVENTDT IS NULL"
          then: "'CENSORED'"
        - when: "EVENTDT = PDDT"
          then: "'DISEASE PROGRESSION'"
        - otherwise: "'DEATH'"

  # Censored at the assessment above, or at the response date when no
  # valid assessment is usable, for a one-day duration.
  - name: CENSORDT
    type: date
    label: Censoring Date
    derivation:
      first_available:
        sources: [CENSASDT, STARTDT]

  - name: ADT
    type: date
    label: Analysis Date
    derivation:
      first_available:
        sources: [EVENTDT, CENSORDT]
    verifications:
      - not_missing

  - name: AVAL
    type: int
    label: Analysis Value
    derivation:
      diff:
        type: date
        start: STARTDT
        end: ADT
        unit: day
        closed: both

  - name: CNSDTDSC
    type: str
    label: Censoring Date Description
    derivation:
      case:
        - when: "EVENTDT IS NOT NULL"
          then: null
        - when: "CENSASDT IS NOT NULL"
          then: "'LAST TUMOUR ASSESSMENT'"
        - otherwise: "'RESPONSE DATE'"

  - name: SRCDOM
    type: str
    label: Source Data
    derivation:
      case:
        - when: "EVNTDESC = 'DEATH'"
          then: "'DS'"
        - when: "EVNTDESC = 'DISEASE PROGRESSION'"
          then: "'ADRS'"
        - when: "CNSDTDSC = 'LAST TUMOUR ASSESSMENT'"
          then: "'ADRS'"
        - otherwise: "'ADSL'"

  - name: SRCVAR
    type: str
    label: Source Variable
    derivation:
      case:
        - when: "SRCDOM = 'DS'"
          then: "'DSSTDTC'"
        - when: "SRCDOM = 'ADRS'"
          then: "'ADT'"
        - otherwise: "'RESPDT'"

  # Censoring at the response date traces to ADSL, which has no sequence
  # number, so SRCSEQ stays empty there.
  - name: SRCSEQ
    type: int
    label: Source Sequence Number
    derivation:
      case:
        - when: "EVNTDESC = 'DISEASE PROGRESSION'"
          then: PDSEQ
        - when: "EVNTDESC = 'DEATH'"
          then: DEATHSEQ
        - when: "CNSDTDSC = 'LAST TUMOUR ASSESSMENT'"
          then: CENSASSEQ

verifications:
  - row_count:
      min: 11
      max: 11
  - all_or_none:
      id: traceability-source-is-complete
      columns: [SRCDOM, SRCVAR]
  - assert:
      id: record-level-source-carries-a-sequence-number
      when: "SRCDOM <> 'ADSL'"
      require: "SRCSEQ IS NOT NULL"
  - assert:
      id: censored-record-states-why
      when: "CNSR = 1"
      require: "CNSDTDSC IS NOT NULL"
  - assert:
      id: response-duration-is-at-least-one-day
      require: "AVAL >= 1"
