schema_version: "1.0"
domain: ADTTE
keys: [STUDYID, USUBJID, PARAMCD]
input:
  ADSL: input/adsl.csv
  ADRS_RAW: input/adrs_raw.csv
  DS: input/ds.csv
base: ADSL

output:
  path: adtte.csv
  columns: [STUDYID, USUBJID, PARAMCD, PARAM, STARTDT, ADT, AVAL, CNSR, EVNTDESC, CNSDTDSC, SRCDOM, SRCVAR, SRCSEQ]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: ADSL.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: ADSL.USUBJID

  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation:
      literal: DOR

  - name: PARAM
    type: str
    label: Parameter
    derivation:
      literal: Duration of Response

  - name: STARTDT
    type: date
    label: Time-to-Event Origin Date
    derivation: ADSL.RESPDT
    verifications:
      not_missing: {}

  # The therapy start as a date: ADSL is read as text, and the comparisons
  # below need a date.
  - name: NACTDT
    type: date
    label: New Anti-Cancer Therapy Start Date
    derivation: ADSL.NACTDT

  # The earliest progression (PD) and its record, ties on a date to the
  # lower ASEQ.
  - name: PDDT
    type: date
    label: Disease Progression Date
    derivation:
      aggregate:
        filter: "ADRS_RAW.AVALC = 'PD'"
        expr: "MIN(ADRS_RAW.ADT)"

  - name: PDSEQ
    type: int
    label: Disease Progression Source Sequence Number
    derivation:
      source:
        variable: ADRS_RAW.ASEQ
        filter: "ADRS_RAW.AVALC = 'PD'"
        multiple_matches:
          order_by: [ADRS_RAW.ADT, ADRS_RAW.ASEQ]
          keep: first

  # The earliest death in disposition, ties on a date to the lower DSSEQ.
  - name: DEATHDT
    type: date
    label: Death Date
    derivation:
      aggregate:
        filter: "DS.DSDECOD = 'DEATH'"
        expr: "MIN(DS.DSSTDTC)"

  - name: DEATHSEQ
    type: int
    label: Death Source Sequence Number
    derivation:
      source:
        variable: DS.DSSEQ
        filter: "DS.DSDECOD = 'DEATH'"
        multiple_matches:
          order_by: [DS.DSSTDTC, DS.DSSEQ]
          keep: first

  # The latest assessment with a response other than not evaluable (NE),
  # ties on a date to the higher ASEQ.
  - name: LASTVLDT
    type: date
    label: Last Valid Assessment Date
    derivation:
      aggregate:
        filter: "ADRS_RAW.AVALC <> 'NE'"
        expr: "MAX(ADRS_RAW.ADT)"

  - name: LASTVLSEQ
    type: int
    label: Last Valid Assessment Sequence Number
    derivation:
      source:
        variable: ADRS_RAW.ASEQ
        filter: "ADRS_RAW.AVALC <> 'NE'"
        multiple_matches:
          order_by: [ADRS_RAW.ADT, ADRS_RAW.ASEQ]
          keep: last

  - name: EVENTALLDT
    type: date
    label: Earliest Progression or Death Date
    derivation:
      least:
        sources: [PDDT, DEATHDT]

  # The first of progression and death counts only on or before the start
  # of a new anti-cancer therapy; with no therapy start it always counts.
  - name: EVENTDT
    type: date
    label: Event Date
    derivation:
      case:
        - when: "EVENTALLDT IS NOT NULL AND (NACTDT IS NULL OR EVENTALLDT <= NACTDT)"
          then: EVENTALLDT

  - name: CNSR
    type: int
    label: Censor
    derivation:
      case:
        - when: "EVENTDT IS NOT NULL"
          then: {literal: 0}
        - otherwise: {literal: 1}

  - name: EVNTDESC
    type: str
    label: Event or Censoring Description
    derivation:
      case:
        - when: "EVENTDT IS NULL"
          then: {literal: CENSORED}
        - when: "EVENTDT = PDDT"
          then: {literal: DISEASE PROGRESSION}
        - otherwise: {literal: DEATH}

  # Censored at the last valid assessment, or at the therapy start when
  # that comes first.
  - name: CENSORDT
    type: date
    label: Censoring Date
    derivation:
      least:
        sources: [LASTVLDT, NACTDT]

  - name: ADT
    type: date
    label: Analysis Date
    derivation:
      first_available:
        sources: [EVENTDT, CENSORDT]
    verifications:
      not_missing: {}

  - name: AVAL
    type: int
    label: Analysis Value
    derivation:
      date_diff:
        start: STARTDT
        end: ADT
        unit: day
        bounds: inclusive

  - name: CNSDTDSC
    type: str
    label: Censoring Date Description
    derivation:
      case:
        - when: "EVENTDT IS NOT NULL"
          then: {literal: null}
        - when: "CENSORDT = LASTVLDT"
          then: {literal: LAST TUMOUR ASSESSMENT}
        - otherwise: {literal: START OF NEW ANTI-CANCER THERAPY}

  - name: SRCDOM
    type: str
    label: Source Data
    derivation:
      case:
        - when: "EVNTDESC = 'DEATH'"
          then: {literal: DS}
        - when: "EVNTDESC = 'DISEASE PROGRESSION'"
          then: {literal: ADRS}
        - when: "CNSDTDSC = 'LAST TUMOUR ASSESSMENT'"
          then: {literal: ADRS}
        - otherwise: {literal: ADSL}

  - name: SRCVAR
    type: str
    label: Source Variable
    derivation:
      case:
        - when: "SRCDOM = 'DS'"
          then: {literal: DSSTDTC}
        - when: "SRCDOM = 'ADRS'"
          then: {literal: ADT}
        - otherwise: {literal: NACTDT}

  # Censoring at the therapy start traces to ADSL, which has no sequence
  # number, so SRCSEQ stays empty there.
  - name: SRCSEQ
    type: int
    label: Source Sequence Number
    derivation:
      case:
        - when: "EVNTDESC = 'DISEASE PROGRESSION'"
          then: PDSEQ
        - when: "EVNTDESC = 'DEATH'"
          then: DEATHSEQ
        - when: "CNSDTDSC = 'LAST TUMOUR ASSESSMENT'"
          then: LASTVLSEQ

# One record per responder: a subject with no response date has none.
filter: "ADSL.RESPDT IS NOT NULL"

verifications:
  - unique:
      columns: [STUDYID, USUBJID, PARAMCD]
  - row_count:
      min: 5
      max: 5
  - all_or_none:
      id: traceability-source-is-complete
      columns: [SRCDOM, SRCVAR]
  - implies:
      id: record-level-source-carries-a-sequence-number
      when: "SRCDOM <> 'ADSL'"
      then: "SRCSEQ IS NOT NULL"
  - implies:
      id: censored-record-states-why
      when: "CNSR = 1"
      then: "CNSDTDSC IS NOT NULL"
  - assert:
      id: response-duration-is-at-least-one-day
      expr: "AVAL >= 1"
