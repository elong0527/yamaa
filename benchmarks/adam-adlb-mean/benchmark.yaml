lifecycle: reviewed
standard: ADaM
domain: ADLB
review:
  concerns:
    - Per-subject mean lab values support summaries such as the average
      neutrophil count during treatment, kept as a separate average record
      (DTYPE AVERAGE) as the BDS structure expects.
    - Three subjects cover several results, a missing result among them, and a
      subject with only a missing result.
    - The average ignores missing results (subject 101's average record has
      AVAL 3.1 from three results), and a subject with no results (103) gets no
      average record, rather than one with an empty or zero value.
