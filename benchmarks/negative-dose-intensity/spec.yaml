schema_version: "1.0"
domain: ADEX
keys: [STUDYID, USUBJID, EXTRT]
input:
  TRT: input/subject_treatment.csv
  EX: {path: input/ex.csv, types: {EXDOSE: float, EXPLDOS: float}}
base: TRT

output:
  path: adex.csv
  columns: [STUDYID, USUBJID, EXTRT, EXDOSU, DOSECUM, RDI]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: TRT.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: TRT.USUBJID

  - name: EXTRT
    type: str
    label: Name of Treatment
    derivation: TRT.EXTRT

  - name: EXDOSU
    type: str
    label: Dose Units
    derivation: TRT.EXDOSU

  - name: DOSECUM
    type: float
    label: Cumulative Dose
    derivation:
      aggregate:
        expr: "SUM(EX.EXDOSE)"

  # EX.EXPLDOS stands outside any reduction. The plan is recorded on every
  # administration record, so nothing says which record's plan divides the
  # total, and the specification is rejected before any data is read.
  - name: RDI
    type: float
    label: Relative Dose Intensity
    derivation:
      aggregate:
        expr: "100 * SUM(EX.EXDOSE) / EX.EXPLDOS"
