schema_version: "1.0"
domain: ADVS
keys: [STUDYID, USUBJID, VSSEQ]
input:
  VS:
    path: input/vs.csv
    types: {VSSEQ: int, AVISITN: int}

output:
  path: advs.csv
  columns: [STUDYID, USUBJID, VSSEQ, SERIES, AVISITN, AVALC, PREVAVALC]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: VS.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: VS.USUBJID

  - name: VSSEQ
    type: int
    label: Sequence Number
    derivation: VS.VSSEQ

  - name: SERIES
    type: str
    label: Analysis Series
    derivation: VS.SERIES

  - name: AVISITN
    type: int
    label: Analysis Visit Number
    derivation: VS.AVISITN

  - name: AVALC
    type: str
    label: Analysis Value (C)
    derivation: VS.AVALC

  # The closest earlier non-missing AVALC for the same subject and series,
  # never the row's own. Rows are ordered by visit number, missing numbers
  # last; rows tied on visit number keep their collected order (VSSEQ).
  - name: PREVAVALC
    type: str
    label: Previous Non-Missing Analysis Value (C)
    derivation:
      previous_non_missing:
        source: AVALC
        window:
          group_by: [STUDYID, USUBJID, SERIES]
          order_by: [AVISITN, VSSEQ]

verifications:
  - unique:
      columns: [STUDYID, USUBJID, VSSEQ]
  - row_count:
      min: 14
      max: 14
