schema_version: "1.0"
domain: ADAE
keys: [STUDYID, USUBJID, AESEQ]
input:
  AE: input/ae.csv

output:
  path: adae.csv
  columns: [STUDYID, USUBJID, AESEQ, AESER, ASTDT, SERSEQ]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: AE.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: AE.USUBJID

  - name: AESEQ
    type: int
    label: Sequence Number
    derivation: AE.AESEQ

  - name: AESER
    type: str
    label: Serious Event
    derivation: AE.AESER
    verifications:
      - allowed_values:
          values: ["Y", "N"]

  - name: ASTDT
    type: date
    label: Analysis Start Date
    derivation: AE.AESTDTC

  # Only serious events are numbered: earliest onset first, AESEQ breaking
  # same-day ties, an undated onset last. Other events stay empty.
  - name: SERSEQ
    type: int
    label: Serious Event Sequence Number
    derivation:
      row_number:
        window:
          group_by: [STUDYID, USUBJID]
          order_by: [ASTDT, AESEQ]
          filter: "AESER = 'Y'"
