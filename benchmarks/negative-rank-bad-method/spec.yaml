schema_version: "1.0"
domain: ADAE
keys: [STUDYID, USUBJID, AESEQ]
input:
  AE: input/ae.csv

output:
  path: adae.csv
  columns: [STUDYID, USUBJID, AESEQ, AESEV, SEVRANK]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: AE.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: AE.USUBJID

  - name: AESEQ
    type: int
    label: Sequence Number
    derivation: AE.AESEQ

  - name: AESEV
    type: str
    label: Severity
    derivation: AE.AESEV

  - name: SEVRANK
    type: int
    label: Severity Rank
    derivation:
      rank:
        method: {competition: true}
        window:
          group_by: [STUDYID, USUBJID]
          order_by:
            - {variable: AESEV, direction: desc}
