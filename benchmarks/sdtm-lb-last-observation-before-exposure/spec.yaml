schema_version: "1.0"
domain: LB
keys: [STUDYID, USUBJID, LBSEQ]
input:
  ODM:
    path: input/odm.csv
    types: {ItemGroupRepeatKey: int}
  DM:
    path: input/dm.csv
    types: {RFSTDTC: date}
  LB_MAPPING: input/lb_mapping.csv
base: ODM

output:
  path: lb.csv
  columns: [DOMAIN, STUDYID, USUBJID, LBSEQ, LBTESTCD, LBSPEC, LBORRES, LBDTC, LBSTAT, LBLOBXFL]

rows:
  - id: lb_result
    dataset: ODM
    group_by: [ODM.StudyOID, ODM.SubjectKey, ODM.StudyEventOID, ODM.FormOID, ODM.ItemGroupOID, ODM.ItemGroupRepeatKey, ODM.ItemOID]
    filter: "LBTESTCD IS NOT NULL"
    derivations:
      LBTESTCD:
        lookup:
          dataset: LB_MAPPING
          key_base: ODM.ItemOID
          key: ItemOID
          value: LBTESTCD
      LBSPEC:
        lookup:
          dataset: LB_MAPPING
          key_base: ODM.ItemOID
          key: ItemOID
          value: LBSPEC
      LBORRES:
        aggregate:
          expr: "ONLY(ODM.Value)"

columns:
  - name: DOMAIN
    type: str
    label: Domain Abbreviation
    derivation: {literal: LB}

  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: ODM.StudyOID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: ODM.SubjectKey

  - name: LBSEQ
    type: int
    label: Sequence Number
    derivation: ODM.ItemGroupRepeatKey
    verifications:
      not_missing: {}

  - name: LBTESTCD
    type: str
    label: Lab Test or Examination Short Name

  - name: LBSPEC
    type: str
    label: Specimen Material Type

  - name: LBORRES
    type: str
    label: Result or Finding in Original Units

  - name: LBDTC
    type: date
    label: Date/Time of Specimen Collection
    derivation:
      aggregate:
        filter: "ODM.ItemOID = 'IT.LB.LBDTC'"
        key: [StudyOID, SubjectKey, StudyEventOID, FormOID, ItemGroupOID, ItemGroupRepeatKey]
        key_base: [ODM.StudyOID, ODM.SubjectKey, ODM.StudyEventOID, ODM.FormOID, ODM.ItemGroupOID, ODM.ItemGroupRepeatKey]
        expr: "ONLY(ODM.Value)"

  - name: LBSTAT
    type: str
    label: Completion Status
    derivation:
      aggregate:
        filter: "ODM.ItemOID = 'IT.LB.LBSTAT'"
        key: [StudyOID, SubjectKey, StudyEventOID, FormOID, ItemGroupOID, ItemGroupRepeatKey]
        key_base: [ODM.StudyOID, ODM.SubjectKey, ODM.StudyEventOID, ODM.FormOID, ODM.ItemGroupOID, ODM.ItemGroupRepeatKey]
        expr: "ONLY(ODM.Value)"

  - name: RFSTDTC
    type: date
    label: Subject Reference Start Date/Time
    derivation: DM.RFSTDTC

  # Rank each record against the other results for the same subject,
  # test, and specimen. Only records with a result, collected on or
  # before the reference start date (or with no reference start at
  # all), are ranked; the latest collection date wins, with the
  # sequence number breaking ties.
  - name: LOBXRNK
    type: int
    label: Last Observation Before Exposure Rank
    derivation:
      row_number:
        window:
          group_by: [STUDYID, USUBJID, LBTESTCD, LBSPEC]
          order_by:
            - {variable: LBDTC, direction: desc}
            - {variable: LBSEQ, direction: desc}
          filter: "LBORRES IS NOT NULL AND (RFSTDTC IS NULL OR LBDTC <= RFSTDTC)"

  - name: LBLOBXFL
    type: str
    label: Last Observation Before Exposure Flag
    derivation:
      flag: "LOBXRNK = 1"

verifications:
  - unique:
      columns: [STUDYID, USUBJID, LBSEQ]
  - row_count:
      min: 14
      max: 14
  - implies:
      id: flagged-record-has-a-result
      when: "LBLOBXFL = 'Y'"
      then: "LBORRES IS NOT NULL"
  - implies:
      id: flagged-record-is-done
      when: "LBLOBXFL = 'Y'"
      then: "LBSTAT IS NULL"
