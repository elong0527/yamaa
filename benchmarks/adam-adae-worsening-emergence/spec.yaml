schema_version: "1.0"
domain: ADAE
keys: [STUDYID, USUBJID, AESEQ]
input:
  AE:
    path: input/ae.csv
    types: {AESTDTC: datetime, AEENDTC: datetime, AETOXGR: int}
  ADSL: {path: input/adsl.csv, types: {TRTSDTM: datetime}}
base: AE

output:
  path: adae.csv
  columns: [STUDYID, USUBJID, AESEQ, AEDECOD, ASTDTM, AENDTM, TRTSDTM, AESEV,
            AETOXGR, TRTEMFL]

windows:
  EPISODE_ORDER:
    group_by: [STUDYID, USUBJID, AEDECOD]
    order_by: [ASTDTM, AESEQ]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: AE.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: AE.USUBJID

  - name: AESEQ
    type: int
    label: Sequence Number
    derivation: AE.AESEQ

  - name: AEDECOD
    type: str
    label: Dictionary-Derived Term
    derivation: AE.AEDECOD

  - name: ASTDTM
    type: datetime
    label: Analysis Start Date/Time
    derivation: AE.AESTDTC

  - name: AENDTM
    type: datetime
    label: Analysis End Date/Time
    derivation: AE.AEENDTC

  - name: TRTSDTM
    type: datetime
    label: Datetime of First Exposure to Treatment
    derivation: ADSL.TRTSDTM

  - name: AESEV
    type: str
    label: Severity/Intensity
    derivation: AE.AESEV
    verifications:
      allowed_values:
        values: [MILD, MODERATE, SEVERE]

  - name: AETOXGR
    type: int
    label: Standard Toxicity Grade
    derivation: AE.AETOXGR
    verifications:
      allowed_values:
        values: [1, 2, 3, 4, 5]

  # Numeric rank of the collected severity, so a later episode can be
  # compared with an earlier one for the same term. Not in the output.
  - name: AESEVN
    type: int
    label: Severity/Intensity (N)
    derivation:
      mapping:
        source: AESEV
        dict:
          MILD: 1
          MODERATE: 2
          SEVERE: 3
        missing: null

  # The immediately preceding episode's end, in chronological term order.
  # Missing ends are retained: continuity must never skip an episode.
  - name: PREVEND
    type: datetime
    label: Previous Episode End Date/Time
    derivation:
      row_value:
        source: AENDTM
        offset: -1
        window: EPISODE_ORDER

  # Start a new chain unless the preceding end equals this onset exactly.
  # Unknown boundaries, gaps, and overlaps all start a new chain.
  - name: CHAINSTART
    type: int
    label: First Sequence Number in Continuous Chain
    derivation:
      case:
        - when: "PREVEND = ASTDTM"
          then: {literal: null}
        - otherwise: AESEQ

  # Carry the chain's first sequence number through every linked episode,
  # including unchanged episodes before treatment or before worsening.
  - name: CHAINID
    type: int
    label: Continuous Episode Chain Identifier
    derivation:
      locf:
        source: CHAINSTART
        window: EPISODE_ORDER

  # Highest severity at or after exposure in the same continuous chain.
  # Rows with no onset or no exposure never contribute. Not in the output.
  - name: POSTMAX
    type: int
    label: Maximum Post-Treatment Severity (N)
    derivation:
      aggregate:
        filter: "ASTDTM >= TRTSDTM"
        group_by: [STUDYID, USUBJID, AEDECOD, CHAINID]
        expr: "MAX(AESEVN)"

  # Highest toxicity grade at or after exposure in the same chain.
  # Rows with no onset, no grade, or no exposure never contribute.
  - name: POSTMAXG
    type: int
    label: Maximum Post-Treatment Toxicity Grade
    derivation:
      aggregate:
        filter: "ASTDTM >= TRTSDTM"
        group_by: [STUDYID, USUBJID, AEDECOD, CHAINID]
        expr: "MAX(AETOXGR)"

  # A comparison with a missing value is unknown, never true, so the
  # flag stays empty when the onset or the first exposure is missing,
  # and for an earlier event when neither the severity nor the grade
  # rises later.
  - name: TRTEMFL
    type: str
    label: Treatment Emergent Analysis Flag
    derivation:
      flag: "ASTDTM >= TRTSDTM OR (ASTDTM < TRTSDTM AND
        (AESEVN < POSTMAX OR AETOXGR < POSTMAXG))"
    verifications:
      allowed_values:
        values: [Y]

verifications:
  - unique:
      columns: [STUDYID, USUBJID, AESEQ]
  - row_count:
      min: 20
      max: 20
  - assert:
      id: treatment-emergent-event-has-known-onset-and-exposure
      when: "TRTEMFL = 'Y'"
      require: "ASTDTM IS NOT NULL AND TRTSDTM IS NOT NULL"
