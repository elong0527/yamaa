schema_version: "1.0"
domain: ADQS
keys: [STUDYID, USUBJID, VISIT, PARAMCD]
input:
  QS: {path: input/qs.csv}

output:
  path: adqs.csv
  columns: [STUDYID, USUBJID, VISIT, PARAMCD, PARAM, AVAL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: QS.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: QS.USUBJID

  - name: VISIT
    type: str
    label: Visit Name
    derivation: QS.VISIT

  - name: PARAMCD
    type: str
    label: Parameter Code

  - name: PARAM
    type: str
    label: Parameter

  # Sums the physical functioning responses of this row's subject and
  # visit. The derive binding's declared float type converts each text
  # response; a blank one stays missing and SUM skips it, while text that
  # is not a number is a conversion failure that stops the run.
  - name: AVAL
    type: float
    label: Analysis Value
    derivation:
      aggregate:
        filter: "QS.QSCAT = 'PHYSICAL FUNCTIONING SCALE'"
        key: [STUDYID, USUBJID, VISIT]
        derive:
          - name: QSNUM
            type: float
            derivation: QS.QSORRES
        expr: "SUM(QSNUM)"

rows:
  # One score row per subject and visit, built from the first item's
  # (PF01) record; a visit with no PF01 record gets no score row.
  - id: subscale
    filter: "QS.QSCAT = 'PHYSICAL FUNCTIONING SCALE' AND QS.QSTESTCD = 'PF01'"
    derivations:
      PARAMCD: {literal: PFSCORE}
      PARAM: {literal: Physical Functioning Subscale Score}
