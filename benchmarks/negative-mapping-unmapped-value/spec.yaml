schema_version: "1.0"
domain: ADRS
keys: [STUDYID, USUBJID, RSSEQ]
input:
  RS: input/rs.csv

output:
  path: adrs.csv
  columns: [STUDYID, USUBJID, RSSEQ, AVALC]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: RS.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: RS.USUBJID

  - name: RSSEQ
    type: int
    label: Sequence Number
    derivation: RS.RSSEQ

  - name: AVALC
    type: str
    label: Analysis Value (C)
    derivation:
      mapping:
        source: RS.OVRLRESP
        dict:
          CR: COMPLETE RESPONSE
          PR: PARTIAL RESPONSE
          SD: STABLE DISEASE
          PD: PROGRESSIVE DISEASE
