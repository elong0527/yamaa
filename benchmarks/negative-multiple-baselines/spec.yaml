schema_version: "1.0"
domain: ADLB
keys: [STUDYID, USUBJID, VISIT]
input:
  LB: input/lb.csv

output:
  path: adlb.csv
  columns: [STUDYID, USUBJID, VISIT, LBSTRESN, LBBLFL, BAVL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: LB.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: LB.USUBJID

  - name: VISIT
    type: str
    label: Visit Name
    derivation: LB.VISIT

  - name: LBSTRESN
    type: float
    label: Numeric Result
    derivation: LB.LBSTRESN

  - name: LBBLFL
    type: str
    label: Baseline Flag
    derivation: LB.LBBLFL

  - name: BAVL
    type: float
    label: Baseline Value
    # The result on the subject's one flagged row: no flagged row gives
    # missing, and more than one stops the run.
    derivation:
      aggregate:
        filter: "LBBLFL = 'Y'"
        group_by: [STUDYID, USUBJID]
        expr: "ONLY(LBSTRESN)"
