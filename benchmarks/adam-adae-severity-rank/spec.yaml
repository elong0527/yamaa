schema_version: "1.0"
domain: ADAE
keys: [STUDYID, USUBJID, AESEQ]
input:
  AE: input/ae.csv

output:
  path: adae.csv
  columns: [STUDYID, USUBJID, AESEQ, ASEV, ASEVN, SEVRANK, SEVLVL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: AE.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: AE.USUBJID

  - name: AESEQ
    type: int
    label: Sequence Number
    derivation: AE.AESEQ

  - name: ASEV
    type: str
    label: Analysis Severity/Intensity
    derivation: AE.AESEV
    verifications:
      - allowed_values:
          values: [MILD, MODERATE, SEVERE]

  - name: ASEVN
    type: int
    label: Analysis Severity/Intensity (N)
    derivation:
      mapping:
        source: ASEV
        missing: null
        dict:
          MILD: 1
          MODERATE: 2
          SEVERE: 3

  - name: SEVRANK
    type: int
    label: Severity Rank
    derivation:
      rank:
        window:
          group_by: [STUDYID, USUBJID]
          order_by:
            - variable: ASEVN
              direction: desc
              nulls: last

  - name: SEVLVL
    type: int
    label: Severity Level
    derivation:
      rank:
        method: dense
        window:
          group_by: [STUDYID, USUBJID]
          order_by:
            - variable: ASEVN
              direction: desc
              nulls: last

verifications:
  - row_count:
      min: 12
      max: 12
