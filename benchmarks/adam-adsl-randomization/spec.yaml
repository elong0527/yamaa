schema_version: "1.0"
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  DM:
    path: input/dm.parquet
    schema: input/dm.schema.yaml

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, RANDDT, RANDDY, RANDDTC]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  - name: RANDDT
    type: date
    label: Date of Randomization
    derivation: DM.RANDDT

  - name: RANDDY
    type: int
    label: Randomization Study Day
    derivation:
      study_day:
        date: DM.RANDDT
        reference: DM.RFSTDTC

  # DM holds the moment as a datetime; written as text it always carries
  # seconds, so a collected 14:30 becomes 14:30:00.
  - name: RANDDTC
    type: str
    label: Date and Time of Randomization
    derivation: DM.RANDDTTM
