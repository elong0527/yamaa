schema_version: "1.0"
domain: DM
keys: [STUDYID, USUBJID]
input:
  ODM: odm.csv

output:
  path: dm.parquet
  columns: [STUDYID, USUBJID, RFSTDTC, RANDDT, RANDDTTM]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: ODM.StudyOID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: ODM.SubjectKey

  - name: RFSTDTC
    type: date
    label: Subject Reference Start Date

  - name: RANDDT
    type: date
    label: Date of Randomization

  - name: RANDDTTM
    type: datetime
    label: Date and Time of Randomization

rows:
  - id: subject
    group_by: [ODM.StudyOID, ODM.SubjectKey]
    derivations:
      RFSTDTC:
        aggregate:
          filter: "ODM.ItemOID = 'IT.DM.RFSTDTC'"
          expr: "ONLY(ODM.Value)"
      RANDDT:
        aggregate:
          filter: "ODM.ItemOID = 'IT.DM.RANDDT'"
          expr: "ONLY(ODM.Value)"
      RANDDTTM:
        aggregate:
          filter: "ODM.ItemOID = 'IT.DM.RANDDTTM'"
          expr: "ONLY(ODM.Value)"
