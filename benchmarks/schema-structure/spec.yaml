yamaa: "1.0"
type: spec
model: ADaM
domain: ADLB
keys: [USUBJID, VISIT, PARAMCD]
input:
  # RAWSEQ rides along in the source file but is never declared:
  # the artifact carries only the columns the specification declares.
  LB: {path: input/lb.csv, types: {VISIT: int, LBSTRESN: str}}
base: LB

output:
  path: adlb.csv
  columns: [STUDYID, USUBJID, VISIT, PARAMCD, PARAM, AVISIT, AVAL, DTYPE, FLAG]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: "'YAMAA-01'"

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: LB.USUBJID

  - name: VISIT
    type: int
    label: Visit Number
    derivation: LB.VISIT

  # Every row template below derives PARAMCD, PARAM, AVISIT, AVAL,
  # and DTYPE while building its rows; none of them has a
  # column-level derivation.
  - name: PARAMCD
    type: str
    label: Parameter Code

  - name: PARAM
    type: str
    label: Parameter

  - name: AVISIT
    type: str
    label: Analysis Visit

  - name: AVAL
    type: float
    label: Analysis Value

  # No row carries a derivation type: each template still gives the
  # column a value, an explicit blank, rather than leaving it without
  # one.
  - name: DTYPE
    type: str
    label: Derivation Type

  # A working value behind FLAG: it feeds another column, it is kept
  # out of the artifact, and its own completeness check still runs.
  - name: HIGH
    type: int
    label: High Result Working Flag
    derivation:
      case:
        - when: "AVAL > 60"
          then: 1
        - otherwise: 0
    verifications:
      - not_missing

  - name: FLAG
    type: str
    label: High Value Flag
    derivation:
      case:
        - when: "HIGH = 1"
          then: "'H'"
        - otherwise: "'N'"

rows:
  # One row per record that carries a result.
  - id: components
    filter: "LB.LBSTRESN IS NOT NULL"
    derivations:
      PARAMCD: LB.LBTESTCD
      PARAM:
        case:
          - when: "LB.LBTESTCD = 'ALT'"
            then: "'Alanine Aminotransferase'"
          - otherwise: "'Aspartate Aminotransferase'"
      AVISIT:
        case:
          - when: "LB.VISIT = 1"
            then: "'WEEK 1 DAY 1'"
          - otherwise: "'WEEK 2 DAY 8'"
      AVAL: LB.LBSTRESN
      DTYPE: null

  # One candidate row per subject-visit. The visit whose results are
  # all missing is discarded after its summary is computed.
  - id: visit_low
    group_by: [LB.USUBJID, LB.VISIT]
    filter: "AVAL IS NOT NULL"
    derivations:
      PARAMCD: "'LOW'"
      PARAM: "'Lowest Result of Visit'"
      AVISIT: "'OVERALL'"
      AVAL:
        aggregate: "MIN(LB.LBSTRESN)"
      DTYPE: "'LOWEST'"
