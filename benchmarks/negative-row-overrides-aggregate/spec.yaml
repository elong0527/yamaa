yamaa: "1.0"
type: spec
model: ADaM
domain: ADEX
keys: [STUDYID, USUBJID, EXSEQ]
input:
  EX:
    path: input/ex.csv
    types: {EXSEQ: int, EXDOSE: float}
    key: [STUDYID, USUBJID]

output:
  path: adex.csv
  columns: [STUDYID, USUBJID, EXSEQ, AVAL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: EX.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: EX.USUBJID

  - name: EXSEQ
    type: int
    label: Sequence Number
    derivation: EX.EXSEQ

  # Each subject's total dose over all of their administrations.
  - name: AVAL
    type: float
    label: Analysis Value
    derivation:
      aggregate: "SUM(EX.EXDOSE)"

rows:
  # One record per administration, which states the dose given on that
  # record for the same column.
  - id: administration
    dataset: EX
    derivations:
      AVAL: EX.EXDOSE
