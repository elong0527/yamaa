schema_version: "1.0"
domain: ADEX
keys: [STUDYID, USUBJID]
input:
  TRT: input/subject_treatment.csv
  EX: input/ex.csv
base: TRT

output:
  path: adex.csv
  columns: [STUDYID, USUBJID, DOSEDBL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: TRT.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: TRT.USUBJID

  # The formula names EX.EXDOSE, a field of another input that can hold
  # several records per subject. A formula reads only this row's columns
  # and declared record lookups, so the specification is rejected before
  # any data is read.
  - name: DOSEDBL
    type: float
    label: Doubled Dose
    derivation:
      compute:
        expr: "EX.EXDOSE * 2"
