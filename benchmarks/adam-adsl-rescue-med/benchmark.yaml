lifecycle: reviewed
standard: ADaM
domain: ADSL
review:
  concerns:
    - Efficacy analyses often handle rescue medication as an intercurrent event,
      which needs a rescue flag and the date of the first rescue medication.
    - Seven subjects cover several rescue drugs out of date order, a year-month
      and a year-only start, two on the same date, a duplicated record, a
      rescue drug with no start date, and subjects with none.
    - A partial start completes to the first possible day before comparing, so
      subject 101's naproxen from 2025-03 (2025-03-01, flag D) comes before the
      prednisone of 2025-03-05, a tie goes to the smaller sequence
      (SALBUTAMOL), and the name is the standardized one, not the reported
      one.
