schema_version: "1.0"
domain: ADVS
keys: [STUDYID, USUBJID, VSSEQ]
input:
  VS: input/vs.csv

output:
  path: advs.csv
  columns: [STUDYID, USUBJID, VSSEQ, SYSBP, PRIORBP]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: VS.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: VS.USUBJID

  - name: VSSEQ
    type: int
    label: Sequence Number
    derivation: VS.VSSEQ

  - name: SYSBP
    type: int
    label: Systolic Blood Pressure
    derivation: VS.SYSBP

  # Meant as the closest earlier non-missing SYSBP for the subject, in
  # sequence-number order; the search is handed the fixed number 120.
  - name: PRIORBP
    type: int
    label: Prior Systolic Blood Pressure
    derivation:
      previous_non_missing:
        source: {literal: 120}
        window:
          group_by: [STUDYID, USUBJID]
          order_by: [VSSEQ]
