schema_version: "1.0"
domain: ADAE
keys: [STUDYID, USUBJID]
input:
  AE: input/ae.csv

output:
  path: adae.csv
  columns: [STUDYID, USUBJID, AESEV]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: AE.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: AE.USUBJID

  # The defect: '[' opens a character class that never closes, so the
  # pattern is not a valid regex and the spec is rejected before any data
  # is read.
  - name: AESEV
    type: str
    label: Severity/Intensity
    derivation:
      case:
        - when: "str_contains(AE.AETERM, 'SEVERE[')"
          then: {literal: SEVERE}
        - otherwise: {literal: MILD}
