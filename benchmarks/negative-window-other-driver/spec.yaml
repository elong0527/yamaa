yamaa: "1.0"
type: spec
model: SDTM
domain: VS
keys: [USUBJID, VSCAT, VSDY]
input:
  CLINIC: {path: input/clinic.csv, types: {VSDY: int, SYSBP: int}}
  HOME: {path: input/home.csv, types: {VSDY: int, SYSBP: int}}

output:
  path: vs.csv
  columns: [USUBJID, VSSEQ, VSCAT, VSDY, VSSTRESN]

columns:
  - {name: USUBJID, type: str, label: Unique Subject Identifier}
  - {name: VSCAT, type: str, label: Category for Vital Signs}
  - {name: VSDY, type: int, label: Study Day of Vital Signs}

  - name: VSSTRESN
    type: float
    label: Numeric Result/Finding in Standard Units

  # Each subject's records numbered from 1 in order of study day. The order
  # is taken from the day of the clinic measurement, which a record built
  # from a home reading does not have, so the specification is rejected
  # before any data is read.
  - name: VSSEQ
    type: int
    label: Sequence Number
    derivation:
      row_number:
        window:
          group_by: [USUBJID]
          order_by: [CLINIC.VSDY]

rows:
  # Each blood pressure measured at a clinic visit.
  - id: clinic
    dataset: CLINIC
    derivations:
      USUBJID: CLINIC.USUBJID
      VSCAT: "'CLINIC'"
      VSDY: CLINIC.VSDY
      VSSTRESN: CLINIC.SYSBP

  # Each blood pressure read at home.
  - id: home
    dataset: HOME
    derivations:
      USUBJID: HOME.USUBJID
      VSCAT: "'HOME'"
      VSDY: HOME.VSDY
      VSSTRESN: HOME.SYSBP
