schema_version: "1.0"
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  DM: input/dm.csv

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, AGE, SEX]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  # A subject collected on two records is still one row. Its records hold
  # two different ages and nothing says which answers, so the run fails
  # here. SEX is the same on both records and carries through.
  - name: AGE
    type: int
    label: Age
    derivation: DM.AGE

  - name: SEX
    type: str
    label: Sex
    derivation: DM.SEX
