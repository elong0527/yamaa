yamaa: "1.0"
type: spec
model: ADaM
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  DM: input/dm.csv

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, SUBJID, SITEID, SITEIDP, SUBJREF]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  - name: SUBJID
    type: str
    label: Subject Identifier for the Study
    derivation: DM.SUBJID
    verifications:
      - not_missing

  # The collected site, which DM requires.
  - name: SITEID
    type: str
    label: Study Site Identifier
    derivation: DM.SITEID
    verifications:
      - not_missing

  # A check on the identifier: the site part of a USUBJID shaped
  # YAMAA-<site>-<four digits>, kept beside SITEID so a disagreement shows,
  # never in its place; any other shape leaves it empty.
  - name: SITEIDP
    type: str
    label: Parsed Study Site Identifier
    derivation:
      str_extract:
        source: USUBJID
        pattern: '^YAMAA-([^-]+)-[0-9]{4}$'
        group: 1
        no_match: null

  - name: SUBJREF
    type: str
    label: Subject Display Reference
    derivation:
      str_template: "{SITEID}:{SUBJID}"

verifications:
  - row_count:
      min: 8
      max: 8
