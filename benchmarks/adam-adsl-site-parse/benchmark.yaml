lifecycle: reviewed
standard: ADaM
domain: ADSL
review:
  concerns:
    - The site comes from the collected DM site, and the site read from the
      subject identifier is kept beside it as a check on the identifier;
      listings show a combined site and subject reference.
    - Eight subjects cover well-formed identifiers, an identifier whose site
      disagrees with the collected one, other identifier shapes, and three-
      and five-digit subject numbers.
    - The collected site always wins (subject 0003 stays UCSD though its
      identifier reads UCLA), and only exactly four digits parse, so 006 and
      00007 have no site read from the identifier.
