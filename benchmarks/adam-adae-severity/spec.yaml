schema_version: "1.0"
domain: ADAE
keys: [STUDYID, USUBJID, AESEQ]
input:
  AE: {path: input/ae.csv, types: {AESEQ: int}}
  SUPP: {path: input/supp.csv, types: {AESEQ: int}}
base: AE

output:
  path: adae.csv
  columns: [STUDYID, USUBJID, AESEQ, AEDECOD, AESEV]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: AE.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: AE.USUBJID

  - name: AESEQ
    type: int
    label: Sequence Number
    derivation: AE.AESEQ

  - name: AEDECOD
    type: str
    label: Dictionary-Derived Term
    derivation: AE.AEDECOD

  # SUPP is matched on the dataset keys it carries (STUDYID, USUBJID,
  # AESEQ); an event with no supplemental record gets no severity.
  - name: AESEV
    type: str
    label: Severity/Intensity
    derivation: SUPP.AESEV
