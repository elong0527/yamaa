schema_version: "1.0"
domain: ADAE
keys: [STUDYID, USUBJID, AESEQ]
input:
  AE: input/ae.csv

output:
  path: adae.csv
  columns: [STUDYID, USUBJID, AESEQ, ASTDT]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: AE.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: AE.USUBJID

  - name: AESEQ
    type: int
    label: Sequence Number
    derivation: AE.AESEQ

  # month is never used here: at month precision a year alone is left
  # missing and a year and month keep their own. It is still range-checked,
  # so the out-of-range 15 rejects the specification before any data is read.
  - name: ASTDT
    type: date
    label: Analysis Start Date
    derivation:
      date_impute:
        source: AE.AESTDTC
        month: 15
        day: 1
        minimum_source_precision: month
