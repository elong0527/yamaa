schema_version: "1.0"
domain: ADCE
keys: [STUDYID, USUBJID, CESEQ]
input:
  CE: input/ce.csv

output:
  path: adce.csv
  columns: [STUDYID, USUBJID, CESEQ, CETERM, ASTDT, ASEV, ASEVN, ATOXGRN, AOCCFL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: CE.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: CE.USUBJID

  - name: CESEQ
    type: int
    label: Sequence Number
    derivation: CE.CESEQ

  - name: CETERM
    type: str
    label: Reported Term for Clinical Event
    derivation: CE.CETERM

  - name: ASTDT
    type: date
    label: Analysis Start Date
    derivation: CE.ASTDT

  - name: ASEV
    type: str
    label: Analysis Severity/Intensity
    derivation: CE.CESEV
    verifications:
      allowed_values:
        values: [MILD, MODERATE, SEVERE]

  - name: ASEVN
    type: int
    label: Analysis Severity/Intensity (N)
    derivation:
      mapping:
        source: ASEV
        dict: {MILD: 1, MODERATE: 2, SEVERE: 3}
        missing: null
    verifications:
      allowed_values:
        values: [1, 2, 3]

  - name: ATOXGRN
    type: int
    label: Analysis Toxicity Grade (N)
    derivation: ASEVN
    verifications:
      allowed_values:
        values: [1, 2, 3]

  # Number each subject's graded events: worst grade first, then earliest
  # start, then lowest CESEQ. AOCCFL marks number 1; an ungraded event is
  # left out, so it is never flagged.
  - name: WGRSEQ
    type: int
    label: Worst Grade Sequence Number
    derivation:
      row_number:
        window:
          group_by: [STUDYID, USUBJID]
          order_by:
            - {variable: ASEVN, direction: desc}
            - ASTDT
            - CESEQ
          filter: "ASEVN IS NOT NULL"

  - name: AOCCFL
    type: str
    label: Worst Grade Occurrence Flag
    derivation:
      flag:
        condition: "WGRSEQ = 1"
    verifications:
      allowed_values:
        values: [Y]

verifications:
  - unique:
      columns: [STUDYID, USUBJID, CESEQ]
  - row_count:
      min: 11
      max: 11
  - implies:
      id: worst-grade-flag-requires-a-graded-event
      when: "AOCCFL = 'Y'"
      then: "ASEV IS NOT NULL"
  - implies:
      id: worst-grade-flag-is-unique-within-subject
      when: "AOCCFL = 'Y'"
      then: "WGRSEQ = 1"
