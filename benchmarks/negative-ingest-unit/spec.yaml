schema_version: "1.0"
domain: ADEX
keys: [STUDYID, USUBJID, EXTRT]
input:
  TRT: input/subject_treatment.csv
  # EXDOSE is read as a number, so a stored dose with its unit attached
  # (200 mg) fails while the file is read.
  EX: {path: input/ex.csv, types: {EXDOSE: float}}
base: TRT

output:
  path: adex.csv
  columns: [STUDYID, USUBJID, EXTRT, DOSECUM]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: TRT.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: TRT.USUBJID

  - name: EXTRT
    type: str
    label: Name of Treatment
    derivation: TRT.EXTRT

  # Sum over the EX records sharing this row's study, subject and treatment;
  # missing when none of them carries a dose.
  - name: DOSECUM
    type: float
    label: Cumulative Dose
    derivation:
      aggregate: "SUM(EX.EXDOSE)"
