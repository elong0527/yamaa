yamaa: "1.0"
type: spec
model: SDTM
domain: VS
keys: [STUDYID, USUBJID, VSSEQ]
input:
  ODM:
    path: input/odm.csv
    types:
      StudyEventRepeatKey: int
      ItemGroupRepeatKey: int
      Value: float
# Each collected item is one reading; a blank reading was not taken and gives
# no record.
filter: "ODM.Value IS NOT NULL"

output:
  path: vs.csv
  columns: [DOMAIN, STUDYID, USUBJID, VSSEQ, VSSPID, VISIT, VSTESTCD, VSTEST,
            VSORRES, VSORRESU, VSSTRESN, VSSTRESC]
  order_by: [STUDYID, USUBJID, VSSEQ]

columns:
  - name: DOMAIN
    type: str
    label: Domain Abbreviation
    derivation: "'VS'"

  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: ODM.StudyOID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: ODM.SubjectKey

  - name: VISIT
    type: str
    label: Visit Name
    derivation:
      mapping:
        source: ODM.StudyEventOID
        dict:
          SE.VISIT1: VISIT 1
          SE.VISIT2: VISIT 2

  - name: VSTESTCD
    type: str
    label: Vital Signs Test Short Name
    derivation:
      mapping:
        source: ODM.ItemOID
        dict:
          IT.VS.SYSBP: SYSBP
          IT.VS.DIABP: DIABP
    verifications:
      - allowed_values:
          values: [SYSBP, DIABP]

  - name: VSTEST
    type: str
    label: Vital Signs Test Name
    derivation:
      mapping:
        source: ODM.ItemOID
        dict:
          IT.VS.SYSBP: Systolic Blood Pressure
          IT.VS.DIABP: Diastolic Blood Pressure

  # The item-group repeat key numbers the readings of one test at one visit,
  # and the sponsor keeps it as the reading's identifier.
  - name: VSSPID
    type: str
    label: Sponsor-Defined Identifier
    derivation: ODM.ItemGroupRepeatKey

  - name: VSSTRESN
    type: float
    label: Numeric Result/Finding in Standard Units
    derivation: ODM.Value

  - name: VSSTRESC
    type: str
    label: Character Result/Finding in Std Format
    derivation: VSSTRESN

  - name: VSORRES
    type: str
    label: Result or Finding in Original Units
    derivation: VSSTRESN

  - name: VSORRESU
    type: str
    label: Original Units
    derivation: "'mmHg'"

  # Within a subject: by visit, then test (DIABP before SYSBP), then the
  # readings in the order they were taken. A key reads only the collected
  # record, whose visit and item identifiers sort the same way.
  - name: VSSEQ
    type: int
    label: Sequence Number
    derivation:
      row_number:
        window:
          group_by: [STUDYID, USUBJID]
          order_by: [ODM.StudyEventOID, ODM.ItemOID, ODM.ItemGroupRepeatKey]

verifications:
  - row_count:
      min: 23
      max: 23
  - unique:
      id: one-record-per-reading
      columns: [STUDYID, USUBJID, VISIT, VSTESTCD, VSSPID]
