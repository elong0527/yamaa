lifecycle: draft
standard: SDTM
domain: VS
review:
  concerns:
    - Protocols often take blood pressure in triplicate. SDTM keeps each
      reading as its own record, identified by VSSPID, and leaves the visit
      mean to the analysis dataset.
    - Two subjects at two visits have three systolic and three diastolic
      readings each, except one systolic reading that was not taken.
    - A reading that was not taken gives no record and the other readings keep
      their numbers (subject 002's visit 2 systolic readings 1 and 2), and no
      mean record is added in SDTM.
