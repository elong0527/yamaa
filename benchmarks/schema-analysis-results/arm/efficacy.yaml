yamaa: "1.0"
type: analysis_results

displays:
- id: T14.3.01
  name: Table 14.3.01
  description: Summary of glucose in treatment group 1
  documents:
  - document: TLF
    pages:
      type: NamedDestination
      refs: T14_3_01
  results:
  - id: R1
    description: Mean glucose of the safety population in treatment group 1
    reason: SPECIFIED IN SAP
    purpose: PRIMARY OUTCOME MEASURE
    # ADSL only selects the subjects, so it lists no analysed column.
    datasets:
      ADSL:
        where:
          SAFFL: [Y]
          TRT01AN: ['1']
      ADLB:
        where:
          PARAMCD: [GLUC]
        variables: [AVAL]
    join: ADSL selects the subjects; ADLB is joined to it by USUBJID.
    documentation:
      text: Glucose is summarised as section 9.2 of the plan describes.
      documents:
      - document: SAP
        pages:
          type: NamedDestination
          refs: Sec9.2
    programming_code:
      context: R 4.5.1
      code: |
        s <- adsl[adsl$SAFFL == "Y" & adsl$TRT01AN == 1, ]
        d <- merge(s, adlb[adlb$PARAMCD == "GLUC", ], by = "USUBJID")
        mean(d$AVAL)
