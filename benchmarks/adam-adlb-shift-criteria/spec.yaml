schema_version: "1.0"
domain: ADLB
keys: [STUDYID, USUBJID, PARAMCD, ASEQ]
input:
  ADLB_RAW:
    path: input/adlb_raw.csv
    types: {ASEQ: int, AVAL: float, ANRLO: float, ANRHI: float}

output:
  path: adlb.csv
  columns: [STUDYID, USUBJID, PARAMCD, PARAM, ASEQ, AVISIT, AVAL, ANRLO, ANRHI, ANRIND, ABLFL, BASE, BNRIND, SHIFT1, R2BASE, CRIT1, CRIT1FL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: ADLB_RAW.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: ADLB_RAW.USUBJID

  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation: ADLB_RAW.PARAMCD

  - name: PARAM
    type: str
    label: Parameter
    derivation: ADLB_RAW.PARAM

  - name: ASEQ
    type: int
    label: Analysis Sequence Number
    derivation: ADLB_RAW.ASEQ

  - name: AVISIT
    type: str
    label: Analysis Visit
    derivation: ADLB_RAW.AVISIT

  - name: AVAL
    type: float
    label: Analysis Value
    derivation: ADLB_RAW.AVAL

  - name: ANRLO
    type: float
    label: Analysis Normal Range Lower Limit
    derivation: ADLB_RAW.ANRLO

  - name: ANRHI
    type: float
    label: Analysis Normal Range Upper Limit
    derivation: ADLB_RAW.ANRHI

  # Empty when the value or either limit is missing. The first branch is
  # needed: a comparison that cannot be made falls through, and could end
  # at NORMAL.
  - name: ANRIND
    type: str
    label: Analysis Reference Range Indicator
    derivation:
      case:
        - when: "AVAL IS NULL OR ANRLO IS NULL OR ANRHI IS NULL"
          then: {literal: null}
        - when: "AVAL < ANRLO"
          then: {literal: LOW}
        - when: "AVAL > ANRHI"
          then: {literal: HIGH}
        - otherwise: {literal: NORMAL}
    verifications:
      allowed_values:
        values: [LOW, NORMAL, HIGH]

  - name: ABLFL
    type: str
    label: Baseline Record Flag
    derivation: ADLB_RAW.ABLFL
    verifications:
      allowed_values:
        values: [Y]

  # The flagged baseline record's value and mark, repeated on every record of
  # the subject and parameter. With no flagged record both are empty; ONLY()
  # stops the run if more than one record is flagged.
  - name: BASE
    type: float
    label: Baseline Value
    derivation:
      aggregate:
        filter: "ABLFL = 'Y'"
        group_by: [STUDYID, USUBJID, PARAMCD]
        expr: "ONLY(AVAL)"

  - name: BNRIND
    type: str
    label: Baseline Reference Range Indicator
    derivation:
      aggregate:
        filter: "ABLFL = 'Y'"
        group_by: [STUDYID, USUBJID, PARAMCD]
        expr: "ONLY(ANRIND)"
    verifications:
      allowed_values:
        values: [LOW, NORMAL, HIGH]

  # Baseline mark first; empty when either mark is missing.
  - name: SHIFT1
    type: str
    label: Shift 1
    derivation:
      str_template:
        template: "{BNRIND} to {ANRIND}"
        missing: null

  # NULLIF leaves the ratio empty when the baseline value is zero.
  - name: R2BASE
    type: float
    label: Ratio to Baseline
    derivation:
      compute:
        expr: "AVAL / NULLIF(BASE, 0)"

  # Three times the upper limit of normal (ULN). A condition cannot hold
  # arithmetic, so the limit is its own column; it is not in the output.
  - name: CRITLIM
    type: float
    label: Criterion Limit
    derivation:
      compute:
        expr: "3 * ANRHI"

  - name: CRIT1
    type: str
    label: Analysis Criterion 1
    derivation:
      case:
        - when: "AVAL IS NOT NULL AND CRITLIM IS NOT NULL"
          then: {literal: Result greater than 3 x ULN}

  # Y above the limit and N at or below it. The first branch keeps a record
  # with no value or no limit empty rather than N.
  - name: CRIT1FL
    type: str
    label: Criterion 1 Evaluation Result Flag
    derivation:
      case:
        - when: "AVAL IS NULL OR CRITLIM IS NULL"
          then: {literal: null}
        - when: "AVAL > CRITLIM"
          then: {literal: Y}
        - otherwise: {literal: N}
    verifications:
      allowed_values:
        values: [Y, N]

verifications:
  - unique:
      columns: [STUDYID, USUBJID, PARAMCD, ASEQ]
  - row_count:
      min: 15
      max: 15
  - all_or_none:
      id: criterion-text-accompanies-its-flag
      columns: [CRIT1, CRIT1FL]
  - all_or_none:
      id: shift-needs-both-of-its-classifications
      columns: [ANRIND, SHIFT1]
  - implies:
      id: a-baseline-record-is-its-own-reference
      when: "ABLFL = 'Y' AND R2BASE IS NOT NULL"
      then: "R2BASE = 1"
  - implies:
      id: a-classification-rests-on-both-of-its-limits
      when: "ANRIND IS NOT NULL"
      then: "ANRLO IS NOT NULL AND ANRHI IS NOT NULL"
  - implies:
      id: criterion-is-met-only-above-its-limit
      when: "CRIT1FL = 'Y'"
      then: "AVAL > CRITLIM"
