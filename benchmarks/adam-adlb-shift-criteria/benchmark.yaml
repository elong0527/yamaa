lifecycle: draft
standard: ADaM
domain: ADLB
review:
  concerns:
    - Lab shift tables and liver-safety criteria, such as ALT above 3 times ULN,
      rest on each result's normal-range mark and its baseline.
    - Three subjects cover results crossing each limit, values exactly at a
      limit, a missing result, a zero baseline, and tests missing one or both
      normal limits.
    - A result exactly at a limit reads NORMAL and exactly 3 x ULN would not
      meet the criterion, a zero baseline leaves the ratio to baseline empty
      (subject 203's eosinophils), and a missing upper limit still allows the
      low criterion (GGT).
