schema_version: "1.0"
domain: LB
keys: [STUDYID, USUBJID, LBSEQ]
input:
  ODM: input/odm.csv

output:
  path: lb.csv
  columns: [DOMAIN, STUDYID, USUBJID, LBSEQ, LBTESTCD, LBTEST, LBCAT, LBORRES, LBDTC]

columns:
  - name: DOMAIN
    type: str
    label: Domain Abbreviation
    derivation: {literal: LB}

  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: ODM.StudyOID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: ODM.SubjectKey

  - name: LBTESTCD
    type: str
    label: Lab Test or Examination Short Name
    derivation:
      mapping:
        source: ODM.FormOID
        dict:
          FO.LB_CHEM: ALT
          FO.LB_HEM: HGB
          FO.LB_THY: TSH
          FO.LB_UA: URPROT
          FO.LB_EXTRA: OTHER

  - name: LBTEST
    type: str
    label: Lab Test or Examination Name
    derivation:
      mapping:
        source: ODM.FormOID
        dict:
          FO.LB_CHEM: Alanine Aminotransferase
          FO.LB_HEM: Hemoglobin
          FO.LB_THY: Thyrotropin
          FO.LB_UA: Urine Protein
          FO.LB_EXTRA: Other Laboratory Test

  - name: LBCAT
    type: str
    label: Category for Lab Test
    derivation:
      mapping:
        source: ODM.FormOID
        dict:
          FO.LB_CHEM: CHEMISTRY
          FO.LB_HEM: HEMATOLOGY
          FO.LB_THY: THYROID
          FO.LB_UA: URINALYSIS
          FO.LB_EXTRA: OTHER

  - name: LBORRES
    type: str
    label: Result or Finding in Original Units

  - name: LBDTC
    type: date
    label: Date/Time of Specimen Collection

  - name: FORMORD
    type: int
    label: Form Order
    derivation:
      mapping:
        source: ODM.FormOID
        dict:
          FO.LB_CHEM: 1
          FO.LB_HEM: 2
          FO.LB_THY: 3
          FO.LB_UA: 4
          FO.LB_EXTRA: 5

  - name: LBSEQ
    type: int
    label: Sequence Number
    derivation:
      row_number:
        window:
          group_by: [STUDYID, USUBJID]
          order_by: [FORMORD]

rows:
  - id: reported-result
    group_by: [ODM.StudyOID, ODM.SubjectKey, ODM.StudyEventOID, ODM.FormOID]
    filter: "LBORRES IS NOT NULL"
    derivations:
      LBORRES:
        aggregate:
          filter: "ODM.ItemOID = 'IT.LB.RESULT'"
          expr: "ONLY(ODM.Value)"
      LBDTC:
        aggregate:
          filter: "ODM.ItemOID = 'IT.LB.LBDTC'"
          expr: "ONLY(ODM.Value)"

verifications:
  - row_count:
      min: 5
      max: 5
