# Independently authored submission witness: the case runs its completed
# layer with these codelists, and the Define tests compose it at a fixed time.
yamaa: "1.0"
type: project
codelists:
  - codelists:
      - id: CL_LBORRESU
        name: Shared laboratory units
        items: [{value: mg/dL}, {value: mmol/L}]
      - id: CL_GLUCOSE
        name: Glucose units
        items: [{value: mg/dL}]
      - id: CL_CREATININE
        name: Creatinine units
        items: [{value: mg/dL}]
study:
  id: STUDY01
  name: Laboratory submission study
  description: Independently completed value-level metadata
  protocol_name: LB-PROTOCOL

sdtm:
  specs: [submission-spec.yaml]
  standards: [{name: SDTMIG, version: '3.4', status: Final}]
  define: define.xml
  transport: dataset_json
  context: Other
  source_system_version: '1.0'
