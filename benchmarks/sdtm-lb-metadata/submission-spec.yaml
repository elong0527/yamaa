# Independent submission completion over the unchanged executable LB fixture.
# The original loader accepts Assigned/Investigator without a study family;
# SDTM SUB-15 instead requires Vendor/Sponsor for Assigned. This positive
# witness explicitly selects Sponsor, while tests retain the original
# rejection.
yamaa: "1.0"
type: spec
model: SDTM
parent: spec.yaml

columns:
  - name: DOMAIN
    submission:
      core: Req
      length: 2
      origins: [{type: Assigned, source: Sponsor}]

  - name: STUDYID
    submission:
      core: Req
      length: 20
      origins: [{type: Collected, source: Vendor}]

  - name: USUBJID
    submission:
      core: Req
      length: 20
      origins: [{type: Collected, source: Vendor}]

  - name: LBSEQ
    submission:
      core: Req
      length: 8
      origins: [{type: Derived, source: Sponsor}]
      method: Sequence within each subject by collection date and test code

  - name: LBTESTCD
    submission:
      core: Req
      length: 8
      origins: [{type: Assigned, source: Sponsor}]

  - name: LBTEST
    submission:
      core: Req
      length: 40
      origins: [{type: Assigned, source: Sponsor}]

  - name: LBORRES
    submission:
      core: Exp
      length: 20
      origins: [{type: Collected, source: Vendor}]

  - name: LBORRESU
    submission:
      core: Exp
      length: 8
      origins: [{type: Assigned, source: Sponsor}]
      value_level:
        - id: GLUC
          where: {LBTESTCD: [GLUC]}
          origins: [{type: Assigned, source: Vendor}]
          codelist: CL_GLUCOSE
        - id: CREAT
          where: {LBTESTCD: [CREAT]}
          origins: [{type: Assigned, source: Sponsor}]
          codelist: CL_CREATININE

  - name: LBSTRESN
    submission:
      core: Exp
      length: 8
      significant_digits: 2
      origins: [{type: Derived, source: Sponsor}]
      method: Convert the original result to the declared numeric type

  - name: LBSTRESU
    submission:
      core: Exp
      length: 8
      origins: [{type: Assigned, source: Sponsor}]

  - name: LBDTC
    submission:
      core: Exp
      origins: [{type: Collected, source: Vendor}]

submission:
  label: Laboratory Tests
  class: FINDINGS
  structure: One record per subject and laboratory test
  repeating: true
  reference_data: false
