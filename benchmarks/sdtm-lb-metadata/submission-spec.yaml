# Independent submission completion over the unchanged executable LB fixture.
# The original loader accepts Assigned/Investigator without a study family;
# SDTM REQ-0889 instead requires Vendor/Sponsor for Assigned. This positive
# witness explicitly selects Sponsor, while tests retain the original
# rejection.
schema_version: '1.0'
parent: spec.yaml

columns:
  - name: DOMAIN
    submission:
      core: Req
      length: 2
      origin: {type: Assigned, source: Sponsor}

  - name: STUDYID
    submission:
      core: Req
      length: 20
      origin: {type: Collected, source: Vendor}

  - name: USUBJID
    submission:
      core: Req
      length: 20
      origin: {type: Collected, source: Vendor}

  - name: LBSEQ
    submission:
      core: Req
      length: 8
      origin: {type: Derived, source: Sponsor}
      method: Sequence within each subject by collection date and test code

  - name: LBTESTCD
    submission:
      core: Req
      length: 8
      origin: {type: Assigned, source: Sponsor}

  - name: LBTEST
    submission:
      core: Req
      length: 40
      origin: {type: Assigned, source: Sponsor}

  - name: LBORRES
    submission:
      core: Exp
      length: 20
      origin: {type: Collected, source: Vendor}

  - name: LBORRESU
    submission:
      core: Exp
      length: 8
      origin: {type: Assigned, source: Sponsor}

  - name: LBSTRESN
    submission:
      core: Exp
      length: 8
      significant_digits: 2
      origin: {type: Derived, source: Sponsor}
      method: Convert the original result to the declared numeric type

  - name: LBSTRESU
    submission:
      core: Exp
      length: 8
      origin: {type: Assigned, source: Sponsor}

  - name: LBDTC
    submission:
      core: Exp
      origin: {type: Collected, source: Vendor}

rows:
  - id: glucose
    submission:
      LBORRESU:
        origin: {type: Assigned, source: Vendor}
        codelist: CL_GLUCOSE

  - id: creatinine
    submission:
      LBORRESU:
        origin: {type: Assigned, source: Sponsor}
        codelist: CL_CREATININE

submission:
  label: Laboratory Tests
  class: FINDINGS
  structure: One record per subject and laboratory test
  repeating: true
  reference_data: false
