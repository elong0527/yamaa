yamaa: "1.0"
type: spec
domain: LB
keys: [STUDYID, USUBJID, LBSEQ]
input:
  ODM: input/odm.csv

output:
  path: lb.csv
  columns: [DOMAIN, STUDYID, USUBJID, LBSEQ, LBTESTCD, LBTEST, LBORRES,
            LBORRESU, LBSTRESN, LBSTRESU, LBDTC]

columns:
  - name: DOMAIN
    type: str
    label: Domain Abbreviation
    derivation: "'LB'"

  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: ODM.StudyOID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: ODM.SubjectKey

  - name: LBTESTCD
    type: str
    label: Lab Test or Examination Short Name

  - name: LBTEST
    type: str
    label: Lab Test or Examination Name

  - name: LBORRES
    type: str
    label: Result or Finding in Original Units

  # Column-wide submission metadata; each value-level entry overrides it on
  # the rows of its test code.
  - name: LBORRESU
    type: str
    label: Original Units
    derivation: "'mg/dL'"
    submission:
      origins:
        - type: Assigned
      codelist: CL_LBORRESU
      value_level:
        - id: GLUC
          where: {LBTESTCD: [GLUC]}
          origins:
            - type: Assigned
              source: Vendor
          codelist: CL_GLUCOSE
        - id: CREAT
          where: {LBTESTCD: [CREAT]}
          origins:
            - type: Assigned
              source: Investigator
          codelist: CL_CREATININE

  - name: LBSTRESN
    type: float
    label: Numeric Result/Finding in Standard Units
    derivation:
      value: LBORRES
      unconvertible: null

  - name: LBSTRESU
    type: str
    label: Standard Units
    derivation: "'mg/dL'"

  - name: LBDTC
    type: date
    label: Date/Time of Specimen Collection

  # Numbered within each subject by collection date, then test code.
  - name: LBSEQ
    type: int
    label: Sequence Number
    derivation:
      row_number:
        window:
          group_by: [STUDYID, USUBJID]
          order_by: [LBDTC, LBTESTCD]

rows:
  # One record per subject and visit with a glucose entry, dated by the
  # visit's collection date item; ONLY() fails if the visit carries either
  # item more than once. An entry that is not a number gives a missing
  # LBSTRESN.
  - id: glucose
    group_by: [ODM.StudyOID, ODM.SubjectKey, ODM.StudyEventOID]
    filter: "LBORRES IS NOT NULL"
    derivations:
      LBTESTCD: "'GLUC'"
      LBTEST: "'Glucose'"
      LBORRES:
        aggregate:
          filter: "ODM.ItemOID = 'IT.LB.GLUC'"
          expr: "ONLY(ODM.Value)"
      LBDTC:
        aggregate:
          filter: "ODM.ItemOID = 'IT.LB.LBDTC'"
          expr: "ONLY(ODM.Value)"

  # The same for the creatinine entry.
  - id: creatinine
    group_by: [ODM.StudyOID, ODM.SubjectKey, ODM.StudyEventOID]
    filter: "LBORRES IS NOT NULL"
    derivations:
      LBTESTCD: "'CREAT'"
      LBTEST: "'Creatinine'"
      LBORRES:
        aggregate:
          filter: "ODM.ItemOID = 'IT.LB.CREAT'"
          expr: "ONLY(ODM.Value)"
      LBDTC:
        aggregate:
          filter: "ODM.ItemOID = 'IT.LB.LBDTC'"
          expr: "ONLY(ODM.Value)"
