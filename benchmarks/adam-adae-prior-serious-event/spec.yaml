schema_version: "1.0"
domain: ADAE
keys: [STUDYID, USUBJID, AESEQ]
input:
  AE: {path: input/ae.csv, types: {AESEQ: int}}

output:
  path: adae.csv
  columns: [STUDYID, USUBJID, AESEQ, AEDECOD, AESER, PRIOR_SAEFL, PRIOR_SAEDECOD, PRIOR_SAESEQ, FIRST_SAEDECOD, FIRST_SAESEQ, PREV_AEDECOD]

# Named intermediates reading completed records (dataset SELF): during
# row construction, the records of earlier row templates; during column
# derivation, every record. Their donor fields are the columns every row
# template derives, including a column-level derivation each template
# inherits because a read through SELF names it; a column derived only
# later is not on the records.
intermediates:
  # The subject's serious events before the current record's event,
  # most recent first. The filter correlates with the current record's
  # sequence number, so each record selects among the donors on its
  # own terms.
  - id: PRIOR_SAE
    dataset: SELF
    key: [STUDYID, USUBJID]
    filter: "SELF.AESER = 'Y' AND SELF.AESEQ < AE.AESEQ"
    order_by:
      - {variable: SELF.AESEQ, direction: desc}
    keep: first

  # The subject's first serious event. The donor records are checked
  # for unique event sequences after each completed row template.
  - id: FIRST_SAE
    dataset: SELF
    key: [STUDYID, USUBJID]
    filter: "SELF.AESER = 'Y'"
    order_by:
      - SELF.AESEQ
    keep: first
    verification:
      unique: [STUDYID, USUBJID, AESEQ]

  # The subject's immediately preceding event, serious or not. Only a
  # column derivation reads it, after both row templates have completed,
  # so its donors hold the records of both. Bare donor fields name the
  # completed record, never the current one.
  - id: PREV_AE
    dataset: SELF
    key: [STUDYID, USUBJID]
    filter: "AESEQ < AE.AESEQ"
    order_by:
      - {variable: AESEQ, direction: desc}
    keep: first

columns:
  # Each is copied from the event record the same way in both row
  # templates, so it is written once here. The intermediates read these
  # through SELF, so each template derives them as it builds its records.
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: AE.STUDYID
  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: AE.USUBJID
  - name: AESEQ
    type: int
    label: Sequence Number
    derivation: AE.AESEQ
  - name: AEDECOD
    type: str
    label: Dictionary-Derived Term
    derivation: AE.AEDECOD
  - name: AESER
    type: str
    label: Serious Event
    derivation: AE.AESER
  - name: PRIOR_SAEFL
    type: str
    label: Prior Serious Event Flag
  - name: PRIOR_SAEDECOD
    type: str
    label: Prior Serious Event Dictionary-Derived Term
  - name: PRIOR_SAESEQ
    type: int
    label: Prior Serious Event Sequence Number
  - name: FIRST_SAEDECOD
    type: str
    label: First Serious Event Dictionary-Derived Term
  - name: FIRST_SAESEQ
    type: int
    label: First Serious Event Sequence Number
  - name: PREV_AEDECOD
    type: str
    label: Preceding Event Dictionary-Derived Term
    derivation: PREV_AE.AEDECOD

rows:
  # One record per serious event. The prior and first serious event
  # fields stay empty here: the first row template cannot read the
  # records it is still building.
  - id: serious
    filter: "AE.AESER = 'Y'"
    derivations:
      PRIOR_SAEFL: {literal: null}
      PRIOR_SAEDECOD: {literal: null}
      PRIOR_SAESEQ: {literal: null}
      FIRST_SAEDECOD: {literal: null}
      FIRST_SAESEQ: {literal: null}

  # One record per non-serious event, carrying the subject's most
  # recent earlier serious event and first serious event, read through
  # SELF from the records the first template completed. The flag tests
  # the donor's sequence number, not its term: a serious event with no
  # coded term still counts as a prior serious event.
  - id: nonserious
    filter: "AE.AESER = 'N'"
    derivations:
      PRIOR_SAEFL:
        case:
          - when: "PRIOR_SAE.AESEQ IS NOT NULL"
            then: {literal: "Y"}
          - otherwise: {literal: null}
      PRIOR_SAEDECOD: PRIOR_SAE.AEDECOD
      PRIOR_SAESEQ: PRIOR_SAE.AESEQ
      FIRST_SAEDECOD: FIRST_SAE.AEDECOD
      FIRST_SAESEQ: FIRST_SAE.AESEQ

verifications:
  - unique:
      columns: [STUDYID, USUBJID, AESEQ]
  - row_count:
      min: 14
      max: 14
  - implies:
      id: prior-serious-flag-names-a-sequence
      when: "PRIOR_SAEFL = 'Y'"
      then: "PRIOR_SAESEQ IS NOT NULL"
