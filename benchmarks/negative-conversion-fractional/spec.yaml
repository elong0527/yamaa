schema_version: "1.0"
domain: ADVS
keys: [STUDYID, USUBJID, VSSEQ]
input:
  VS: {path: input/vs.csv, types: {VSSTRESN: float}}

output:
  path: advs.csv
  columns: [STUDYID, USUBJID, VSSEQ, AVAL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: VS.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: VS.USUBJID

  - name: VSSEQ
    type: int
    label: Sequence Number
    derivation: VS.VSSEQ

  # No rounding rule is stated, so a fractional result has no int form.
  # With no missing handler declared, the failed conversion is fatal.
  - name: AVAL
    type: int
    label: Analysis Value
    derivation:
      value:
        source: VS.VSSTRESN
