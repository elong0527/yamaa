yamaa: "1.0"
type: spec
input:
  DS:
    path: input/ds.csv
    types:
      USUBJID: str
      DSREASCD: str
base: DS

columns:
  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DS.USUBJID

  # Every study inherits this reading of the collected reason code: four
  # entries, and a code without an entry is reported as OTHER.
  - name: DCSREAS
    type: str
    label: Reason for Discontinuation from Study
    derivation:
      mapping:
        source: DS.DSREASCD
        dict:
          AE: ADVERSE EVENT
          LTFU: LOST TO FOLLOW-UP
          WBS: WITHDRAWAL BY SUBJECT
          PD: PROGRESSIVE DISEASE
        unmapped: OTHER

metadata:
  scope: organization
