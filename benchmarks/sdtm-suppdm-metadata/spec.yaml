schema_version: "1.0"
domain: SUPPDM
keys: [STUDYID, USUBJID, QNAM]
input:
  DM_RAW: input/dm_raw.csv

output:
  path: suppdm.csv
  columns: [STUDYID, RDOMAIN, USUBJID, IDVAR, IDVARVAL, QNAM, QLABEL, QVAL,
            QORIG, QEVAL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM_RAW.STUDYID
    submission:
      core: Req
      length: 20
      origin:
        type: Protocol
        source: Sponsor

  - name: RDOMAIN
    type: str
    label: Related Domain Abbreviation
    derivation: {literal: DM}
    submission:
      core: Req
      length: 2
      origin:
        type: Assigned
        source: Sponsor

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM_RAW.USUBJID
    submission:
      core: Req
      length: 30
      origin:
        type: Assigned
        source: Sponsor

  - name: IDVAR
    type: str
    label: Identifying Variable
    derivation: {literal: null}
    submission:
      core: Exp
      length: 8
      origin:
        type: Assigned
        source: Sponsor

  - name: IDVARVAL
    type: str
    label: Identifying Variable Value
    derivation: {literal: null}
    submission:
      core: Exp
      length: 40
      origin:
        type: Assigned
        source: Sponsor

  - name: QNAM
    type: str
    label: Qualifier Variable Name
    submission:
      core: Req
      length: 8
      origin:
        type: Assigned
        source: Sponsor

  - name: QLABEL
    type: str
    label: Qualifier Variable Label
    submission:
      core: Req
      length: 40
      origin:
        type: Assigned
        source: Sponsor

  # Each qualifier is described by its own definition: the races from the
  # race codelist, the other-race text on its own page of the form.
  - name: QVAL
    type: str
    label: Data Value
    submission:
      core: Req
      length: 200
      origin:
        type: Collected
        source: Investigator
        documents:
          - document: acrf
            pages: {type: PhysicalRef, refs: "2"}
      value_level:
        - id: RACE
          where: {QNAM: [RACE1, RACE2]}
          label: Race
          codelist: RACE
        - id: RACEOTH
          where: {QNAM: [RACEOTH]}
          label: Race, Other
          origin:
            type: Collected
            source: Investigator
            documents:
              - document: acrf
                pages: {type: PhysicalRef, refs: "3"}

  - name: QORIG
    type: str
    label: Origin
    derivation: {literal: Collected}
    submission:
      core: Req
      length: 20
      origin:
        type: Assigned
        source: Sponsor

  - name: QEVAL
    type: str
    label: Evaluator
    derivation: {literal: null}
    submission:
      core: Exp
      length: 40
      origin:
        type: Assigned
        source: Sponsor

rows:
  # One qualifier record per subject and reported race or other-race text.
  - id: race1
    filter: "DM_RAW.RACE1 IS NOT NULL"
    derivations:
      QNAM: {literal: RACE1}
      QLABEL: {literal: Race 1}
      QVAL: DM_RAW.RACE1

  - id: race2
    filter: "DM_RAW.RACE2 IS NOT NULL"
    derivations:
      QNAM: {literal: RACE2}
      QLABEL: {literal: Race 2}
      QVAL: DM_RAW.RACE2

  - id: raceoth
    filter: "DM_RAW.RACEOTH IS NOT NULL"
    derivations:
      QNAM: {literal: RACEOTH}
      QLABEL: {literal: "Race, Other"}
      QVAL: DM_RAW.RACEOTH

submission:
  label: Supplemental Qualifiers for DM
  class: RELATIONSHIP
  structure: One record per supplemental qualifier per subject
  repeating: true
  domain: DM
