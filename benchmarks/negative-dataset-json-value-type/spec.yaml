yamaa: "1.0"
type: spec
model: ADaM
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  # Demographics received as a Dataset-JSON file. AGE is an integer column.
  DM: input/dm.json

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, SITEID, AGE]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  - name: SITEID
    type: str
    label: Study Site Identifier
    derivation: DM.SITEID

  - name: AGE
    type: int
    label: Age
    derivation: DM.AGE
