schema_version: "1.0"
domain: SE
keys: [STUDYID, USUBJID, ETCD]
input:
  DM: {path: input/dm.csv, types: {RFICDTC: date, RFSTDTC: date, RFXENDTC: date}}
  ODM: input/odm.csv
base: ODM

# One output row per key combination (REQ-0042): the ODM base has one record
# per subject, study event and item, so each subject's study events -- the
# elements they entered -- give the rows. The ODM extract carries each
# element's trial-design attributes (IT.TE.*/IT.TA.*) and the dosing dates
# (IT.EX.*) on every event, so each SE record derives from its own ODM
# context. DM is a subject-level table; a DM.* read joins implicitly on the
# keys DM shares with the output (REQ-0150: STUDYID, USUBJID).

output:
  path: se.csv
  columns: [DOMAIN, STUDYID, USUBJID, SESEQ, ETCD, ELEMENT, TAETORD, EPOCH, SESTDTC, SEENDTC, SESTDY, SEENDY, SEUPDES]
  order_by: [STUDYID, USUBJID, SESEQ]

columns:
  - name: DOMAIN
    type: str
    label: Domain Abbreviation
    derivation: {literal: SE}

  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: ODM.StudyOID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: ODM.SubjectKey

  - name: ETCD
    type: str
    label: Element Code
    derivation: ODM.StudyEventOID

  - name: ELEMENT
    type: str
    label: Description of Element
    derivation:
      source:
        filter: ODM.ItemOID = 'IT.TE.ELEMENT'
        variable: ODM.Value

  - name: TAETORD
    type: int
    label: Planned Order of Element within Arm
    derivation:
      source:
        filter: ODM.ItemOID = 'IT.TA.TAETORD'
        variable: ODM.Value

  # Elements are numbered in their planned order within the arm.
  - name: SESEQ
    type: int
    label: Sequence Number
    derivation: TAETORD

  - name: EPOCH
    type: str
    label: Epoch
    derivation:
      source:
        filter: ODM.ItemOID = 'IT.TA.EPOCH'
        variable: ODM.Value

  - name: FIRSTDTC
    type: date
    label: First Dosing Date
    derivation:
      source:
        filter: ODM.ItemOID = 'IT.EX.FIRSTDTC'
        variable: ODM.Value

  - name: LASTDTC
    type: date
    label: Last Dosing Date
    derivation:
      source:
        filter: ODM.ItemOID = 'IT.EX.LASTDTC'
        variable: ODM.Value

  # Elements run back to back: screening from informed consent to first dose,
  # treatment from first to last dose, follow-up from last dose to the end of
  # participation. Any other epoch, or a missing one, gets the follow-up
  # dates.
  - name: SESTDTC
    type: date
    label: Start Date/Time of Element
    derivation:
      case:
        - when: "EPOCH = 'SCREENING'"
          then: DM.RFICDTC
        - when: "EPOCH = 'TREATMENT'"
          then: FIRSTDTC
        - otherwise: LASTDTC

  - name: SEENDTC
    type: date
    label: End Date/Time of Element
    derivation:
      case:
        - when: "EPOCH = 'SCREENING'"
          then: FIRSTDTC
        - when: "EPOCH = 'TREATMENT'"
          then: LASTDTC
        - otherwise: DM.RFXENDTC

  # Study days count the DM reference start date as day 1, with no day 0.
  - name: SESTDY
    type: int
    label: Study Day of Start of Element
    derivation:
      study_day:
        date: SESTDTC
        reference: DM.RFSTDTC

  - name: SEENDY
    type: int
    label: Study Day of End of Element
    derivation:
      study_day:
        date: SEENDTC
        reference: DM.RFSTDTC

  - name: SEUPDES
    type: str
    label: Description of Unplanned Element
    derivation: {literal: null}

verifications:
  - unique:
      columns: [STUDYID, USUBJID, ETCD]
  - row_count:
      min: 6
      max: 6
  - assert:
      id: elements-have-ordered-bounds
      expr: "SESTDTC IS NOT NULL AND SEENDTC IS NOT NULL AND SESTDTC <= SEENDTC"
  - assert:
      id: every-element-carries-its-plan
      expr: "ETCD IS NOT NULL AND ELEMENT IS NOT NULL AND TAETORD IS NOT NULL"
