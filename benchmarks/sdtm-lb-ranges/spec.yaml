schema_version: "1.0"
domain: LB
keys: [STUDYID, USUBJID, LBSEQ]
input:
  LB_RAW: input/lb_raw.csv
  LBRANGE: input/lbrange.csv
  DM: input/dm.csv
base: LB_RAW

# Sex is not an LB variable: it is read from DM by subject and used only
# to pick the reference entry. The reference entry for the record's test
# code and DM sex; two entries for one combination stop the run; none
# leaves UNIT, NRLO and NRHI missing.
intermediates:
  - id: DMSEX
    dataset: DM
    key: [USUBJID]
  - id: REFRANGE
    dataset: LBRANGE
    key: [LBTESTCD, SEX]

output:
  path: lb.csv
  columns: [DOMAIN, STUDYID, USUBJID, LBSEQ, LBTESTCD, LBSTRESN, LBSTRESU, LBSTNRLO, LBSTNRHI, LBNRIND]

columns:
  - name: DOMAIN
    type: str
    label: Domain Abbreviation
    derivation: {literal: LB}

  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: LB_RAW.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: LB_RAW.USUBJID

  - name: LBSEQ
    type: int
    label: Sequence Number
    derivation: LB_RAW.LBSEQ

  - name: LBTESTCD
    type: str
    label: Lab Test or Examination Short Name
    derivation: LB_RAW.LBTESTCD

  # Read from DM by subject for the reference lookup; not an LB output
  # variable, so it stays out of output.columns.
  - name: SEX
    type: str
    label: Sex
    derivation: DMSEX.SEX

  - name: LBSTRESN
    type: float
    label: Numeric Result/Finding in Standard Units
    derivation: LB_RAW.LBSTRESN

  - name: LBSTRESU
    type: str
    label: Standard Units
    derivation: REFRANGE.UNIT

  - name: LBSTNRLO
    type: float
    label: Reference Range Lower Limit-Std Units
    derivation: REFRANGE.NRLO

  - name: LBSTNRHI
    type: float
    label: Reference Range Upper Limit-Std Units
    derivation: REFRANGE.NRHI

  # A result equal to a limit is NORMAL. A missing result or reference
  # limit has no supported range classification.
  - name: LBNRIND
    type: str
    label: Reference Range Indicator
    derivation:
      case:
        - when: "LBSTRESN IS NULL OR LBSTNRLO IS NULL OR LBSTNRHI IS NULL"
          then: {literal: null}
        - when: "LBSTRESN < LBSTNRLO"
          then: {literal: LOW}
        - when: "LBSTRESN > LBSTNRHI"
          then: {literal: HIGH}
        - otherwise: {literal: NORMAL}

verifications:
  - row_count:
      min: 8
      max: 8
  - all_or_none:
      id: reference-dictionary-entry-is-complete
      columns: [LBSTRESU, LBSTNRLO, LBSTNRHI]
