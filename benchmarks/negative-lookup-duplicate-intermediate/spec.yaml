schema_version: "1.0"
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  DM: input/dm.csv
  DS: input/ds.csv
base: DM

intermediates:
  # Each subject's end-of-study record: a disposition event other than a
  # screen failure, asserted unique per subject. P01 carries two of them,
  # so the run fails before any output row is built.
  - id: DS_EOS
    dataset: DS
    filter: "DS.DSCAT = 'DISPOSITION EVENT' AND DS.DSDECOD <> 'SCREEN FAILURE'"
    verification:
      unique: [STUDYID, USUBJID]

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, EOSDT]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  - name: EOSDT
    type: str
    label: End of Study Date
    derivation: DS_EOS.DSSTDTC
