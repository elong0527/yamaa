yamaa: "1.0"
type: spec
model: ADaM
domain: ADEX
keys: [STUDYID, USUBJID]
input:
  DM: input/dm.csv
  EX: {path: input/ex.csv, types: {EXDOSE: float}, key: [STUDYID, USUBJID]}
base: DM

output:
  path: adex.csv
  columns: [STUDYID, USUBJID, TRT01P, DOSECUM, NDOSREC, NDOSVAL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  - name: TRT01P
    type: str
    label: Planned Treatment for Period 01
    derivation: DM.ARM

  # Summed and counted over the subject's exposure records, matched on
  # STUDYID and USUBJID. With no records all three are empty; with records
  # but no recorded dose, DOSECUM is empty and NDOSVAL is 0.
  - name: DOSECUM
    type: float
    label: Cumulative Dose
    derivation:
      aggregate: "SUM(EX.EXDOSE)"

  - name: NDOSREC
    type: int
    label: Number of Dose Records
    derivation:
      aggregate: "COUNT(EX.*)"

  - name: NDOSVAL
    type: int
    label: Number of Nonmissing Doses
    derivation:
      aggregate: "COUNT(EX.EXDOSE)"

  # Check the full SDTM EX relation, including records outside the DM
  # population. Every EX record has DOMAIN=EX; this key deliberately avoids
  # the per-subject match used by the output measures above.
  - name: NDOSOTHER
    type: int
    label: Number of Recorded Doses Not in Milligrams
    derivation:
      aggregate:
        key: {DOMAIN: "'EX'"}
        filter: >-
          EX.EXDOSE IS NOT NULL AND
          (EX.EXDOSU IS NULL OR EX.EXDOSU <> 'mg')
        expr: "COUNT(EX.*)"
    verifications:
      - range:
          id: doses-standardized-to-mg
          max: 0

verifications:
  - assert:
      id: recorded-dose-implies-a-record
      when: "NDOSVAL > 0"
      require: "NDOSREC >= NDOSVAL"
