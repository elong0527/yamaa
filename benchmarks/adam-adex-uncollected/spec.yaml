schema_version: "1.0"
domain: ADEX
keys: [STUDYID, USUBJID, EXTRT]
input:
  TRT: input/subject_treatment.csv
  EX: {path: input/ex.csv, types: {EXDOSE: float}}
base: TRT

output:
  path: adex.csv
  columns: [STUDYID, USUBJID, EXTRT, DOSECUM, NDOSREC, NDOSVAL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: TRT.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: TRT.USUBJID

  - name: EXTRT
    type: str
    label: Name of Treatment
    derivation: TRT.EXTRT

  # Summed and counted over the treatment's exposure records, matched on
  # STUDYID, USUBJID, and EXTRT. With no records all three are empty; with
  # records but no recorded dose, DOSECUM is empty and NDOSVAL is 0.
  - name: DOSECUM
    type: float
    label: Cumulative Dose
    derivation:
      aggregate:
        expr: "SUM(EX.EXDOSE)"

  - name: NDOSREC
    type: int
    label: Number of Dose Records
    derivation:
      aggregate:
        expr: "COUNT(EX.EXSEQ)"

  - name: NDOSVAL
    type: int
    label: Number of Nonmissing Doses
    derivation:
      aggregate:
        expr: "COUNT(EX.EXDOSE)"

verifications:
  - row_count:
      min: 6
      max: 6
  - implies:
      id: recorded-dose-implies-a-record
      when: "NDOSVAL > 0"
      then: "NDOSREC >= NDOSVAL"
