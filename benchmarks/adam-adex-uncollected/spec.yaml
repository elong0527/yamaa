yamaa: "1.0"
type: spec
model: ADaM
domain: ADEX
keys: [STUDYID, USUBJID]
input:
  DM: input/dm.csv
  EX: {path: input/ex.csv, types: {EXDOSE: float}, key: [STUDYID, USUBJID]}
base: DM

output:
  path: adex.csv
  columns: [STUDYID, USUBJID, TRT01P, DOSECUM, NDOSREC, NDOSVAL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  - name: TRT01P
    type: str
    label: Planned Treatment for Period 01
    derivation: DM.ARM

  # Summed and counted over the subject's exposure records, matched on
  # STUDYID and USUBJID. With no records all three are empty; with records
  # but no recorded dose, DOSECUM is empty and NDOSVAL is 0.
  - name: DOSECUM
    type: float
    label: Cumulative Dose
    derivation:
      aggregate: "SUM(EX.EXDOSE)"

  - name: NDOSREC
    type: int
    label: Number of Dose Records
    derivation:
      aggregate: "COUNT(EX.*)"

  - name: NDOSVAL
    type: int
    label: Number of Nonmissing Doses
    derivation:
      aggregate: "COUNT(EX.EXDOSE)"

  # The exposure-units template derives this count over the full EX domain,
  # including records outside DM. It retains an invalid validation candidate
  # for this range check even when DM has no subject. Subjects do not derive
  # this private column; the unit policy lives in that one aggregate.
  - name: NDOSOTHER
    type: int
    label: Number of Recorded Doses Not in Milligrams
    derivation: null
    verifications:
      - range:
          id: doses-standardized-to-mg
          max: 0

rows:
  # One validation candidate per EX domain, independent of DM. Grouped
  # filters read their row aggregates. A valid group is dropped; an invalid
  # one reaches the existing NDOSOTHER range check and refuses the run.
  - id: exposure-units
    dataset: EX
    group_by: [EX.DOMAIN]
    filter: "NDOSOTHER > 0"
    derivations:
      STUDYID: "'(validation)'"
      USUBJID: "'(validation)'"
      TRT01P: null
      NDOSOTHER:
        aggregate:
          filter: >-
            EX.EXDOSE IS NOT NULL AND
            (EX.EXDOSU IS NULL OR EX.EXDOSU <> 'mg')
          expr: "COUNT(EX.*)"

  # One ADEX row per DM subject.
  - id: subjects
    dataset: DM

verifications:
  - assert:
      id: recorded-dose-implies-a-record
      when: "NDOSVAL > 0"
      require: "NDOSREC >= NDOSVAL"
