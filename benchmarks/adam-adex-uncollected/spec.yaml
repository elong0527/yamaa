yamaa: "1.0"
type: spec
model: ADaM
domain: ADEX
keys: [STUDYID, USUBJID]
input:
  DM: input/dm.csv
  EX: {path: input/ex.csv, types: {EXDOSE: float}, key: [STUDYID, USUBJID]}
base: DM

output:
  path: adex.csv
  columns: [STUDYID, USUBJID, TRT01P, DOSECUM, NDOSREC, NDOSVAL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  - name: TRT01P
    type: str
    label: Planned Treatment for Period 01
    derivation: DM.ARM

  # Summed and counted over the subject's exposure records, matched on
  # STUDYID and USUBJID. With no records all three are empty; with records
  # but no recorded dose, DOSECUM is empty and NDOSVAL is 0.
  - name: DOSECUM
    type: float
    label: Cumulative Dose
    derivation:
      aggregate: "SUM(EX.EXDOSE)"

  - name: NDOSREC
    type: int
    label: Number of Dose Records
    derivation:
      aggregate: "COUNT(EX.*)"

  - name: NDOSVAL
    type: int
    label: Number of Nonmissing Doses
    derivation:
      aggregate: "COUNT(EX.EXDOSE)"

  # Check the full SDTM EX relation, including records outside the DM
  # population. Every EX record has DOMAIN=EX; this key deliberately avoids
  # the per-subject match used by the output measures above. Its range check
  # runs only on output rows, so it cannot see EX when DM has no subject;
  # the exposure-units rows below check every EX record before it.
  - name: NDOSOTHER
    type: int
    label: Number of Recorded Doses Not in Milligrams
    derivation:
      aggregate:
        key: {DOMAIN: "'EX'"}
        filter: >-
          EX.EXDOSE IS NOT NULL AND
          (EX.EXDOSU IS NULL OR EX.EXDOSU <> 'mg')
        expr: "COUNT(EX.*)"
    verifications:
      - range:
          id: doses-standardized-to-mg
          max: 0

  # The unit of each EX record's recorded dose, and its check, derived only
  # by the exposure-units rows below. A blank dose needs no unit; a recorded
  # dose without one reads as "(missing)". Any unit but mg has no mapping,
  # which stops the run.
  - name: DOSEUNIT
    type: str
    label: Unit of the Recorded Dose
    derivation: null

  - name: DOSUSTD
    type: str
    label: Recorded Dose Standardized to Milligrams
    derivation: null

rows:
  # Validation section: one candidate per EX record, matched to a DM subject
  # or not, so the unit check covers the full EX relation even when DM has
  # no subject. A record that passes keeps a check value and is dropped, so
  # these candidates never reach the output.
  - id: exposure-units
    dataset: EX
    filter: "DOSUSTD IS NULL"
    derivations:
      STUDYID: EX.STUDYID
      USUBJID: EX.USUBJID
      TRT01P: null
      DOSEUNIT:
        case:
          - when: "EX.EXDOSE IS NULL"
            then: "'mg'"
          - when: "EX.EXDOSU IS NULL"
            then: "'(missing)'"
          - otherwise: EX.EXDOSU
      DOSUSTD:
        mapping:
          source: DOSEUNIT
          dict: {mg: "Y"}

  # One ADEX row per DM subject.
  - id: subjects
    dataset: DM

verifications:
  - assert:
      id: recorded-dose-implies-a-record
      when: "NDOSVAL > 0"
      require: "NDOSREC >= NDOSVAL"
