schema_version: "1.0"
domain: RELREC
keys: [STUDYID, RDOMAIN, USUBJID, IDVAR, IDVARVAL, RELID]
input:
  AE: input/ae.csv
  CM: input/cm.csv

output:
  path: relrec.csv
  columns: [STUDYID, RDOMAIN, USUBJID, IDVAR, IDVARVAL, RELTYPE, RELID]
  order_by: [STUDYID, USUBJID, RELID, RDOMAIN]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier

  - name: RDOMAIN
    type: str
    label: Related Domain Abbreviation

  - name: USUBJID
    type: str
    label: Unique Subject Identifier

  - name: IDVAR
    type: str
    label: Identifying Variable

  - name: AEREF
    type: str
    label: Collected Adverse Event Number

  - name: IDVARVAL
    type: str
    label: Identifying Variable Value

  - name: RELTYPE
    type: str
    label: Relationship Type
    derivation: {literal: null}

  - name: RELID
    type: str
    label: Relationship Identifier

# Each catalog record names one collected reference field. The two templates
# build the CM and AE sides of every present reference without new YAML rows.
# Grouping by CM identity lets the filter run after AEREF is selected.
rows:
  - id: cm_reference
    dataset: CM
    group_by: [CM.STUDYID, CM.USUBJID, CM.CMSEQ]
    catalog:
      path: input/ae_reference_fields.csv
      id_column: ID
      unique_columns: [REFERENCE_EXPR]
    filter: "AEREF IS NOT NULL"
    derivations:
      STUDYID: CM.STUDYID
      RDOMAIN: {literal: CM}
      USUBJID: CM.USUBJID
      IDVAR: {literal: CMSEQ}
      AEREF:
        aggregate:
          expr: "${REFERENCE_EXPR}"
      IDVARVAL: CM.CMSEQ
      RELID:
        case:
          - when: "AEREF IS NULL"
            then: {literal: null}
          - otherwise:
              str_template: "{CM.USUBJID}-CM{CM.CMSEQ}-AE{AEREF}"

  - id: ae_reference
    dataset: CM
    group_by: [CM.STUDYID, CM.USUBJID, CM.CMSEQ]
    catalog:
      path: input/ae_reference_fields.csv
      id_column: ID
      unique_columns: [REFERENCE_EXPR]
    filter: "AEREF IS NOT NULL"
    derivations:
      STUDYID: CM.STUDYID
      RDOMAIN: {literal: AE}
      USUBJID: CM.USUBJID
      IDVAR: {literal: AESEQ}
      AEREF:
        aggregate:
          expr: "${REFERENCE_EXPR}"
      IDVARVAL:
        case:
          - when: "AEREF IS NULL"
            then: {literal: null}
          - otherwise:
              lookup:
                dataset: AE
                key_base: [CM.STUDYID, CM.USUBJID, AEREF]
                key: [STUDYID, USUBJID, AESPID]
                value: AESEQ
                strict: true
      RELID:
        case:
          - when: "AEREF IS NULL"
            then: {literal: null}
          - otherwise:
              str_template: "{CM.USUBJID}-CM{CM.CMSEQ}-AE{AEREF}"

verifications:
  - unique:
      columns: [STUDYID, RDOMAIN, USUBJID, IDVAR, IDVARVAL, RELID]
  - implies:
      id: relationship-row-identifies-a-record
      when: "RELID IS NOT NULL"
      then: "RDOMAIN IS NOT NULL AND IDVAR IS NOT NULL AND IDVARVAL IS NOT NULL"
