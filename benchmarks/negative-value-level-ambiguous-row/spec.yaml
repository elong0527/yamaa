schema_version: "1.0"
domain: ADVS
keys: [USUBJID, PARAMCD, ATPT]
input:
  VS:
    path: input/vs.csv
    types: {VSSTRESN: float}

output:
  path: advs.csv
  columns: [USUBJID, PARAMCD, ATPT, AVAL]

columns:
  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: VS.USUBJID

  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation: VS.VSTESTCD

  - name: ATPT
    type: str
    label: Analysis Timepoint
    derivation: VS.VSTPT

  # One description is chosen by parameter and another by timepoint, so a
  # standing systolic pressure is described twice.
  - name: AVAL
    type: float
    label: Analysis Value
    derivation: VS.VSSTRESN
    submission:
      length: 8
      significant_digits: 0
      origin:
        type: Predecessor
        description: VS.VSSTRESN
      value_level:
        - id: SYSBP
          where: {PARAMCD: [SYSBP]}
          label: Systolic Blood Pressure (mmHg)
        - id: STANDING
          where: {ATPT: [AFTER 3 MIN STANDING]}
          label: Blood Pressure after Standing (mmHg)
