schema_version: "1.0"
domain: LB
keys: [STUDYID, USUBJID, LBSEQ]
input:
  ODM: input/odm.csv

output:
  path: lb.csv
  columns: [DOMAIN, STUDYID, USUBJID, LBSEQ, LBTESTCD, LBTEST, LBORRES, LBORRESU, LBSTRESN, LBSTRESU, LBSTAT, LBDTC]

columns:
  - name: DOMAIN
    type: str
    label: Domain Abbreviation
    derivation: {literal: LB}

  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: ODM.StudyOID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: ODM.SubjectKey

  # The collected entry, exactly as reported; the text 'NOT DONE' marks a
  # test that was not done. The result columns below read this raw value so
  # the sentinel never lands in the delivered result or units.
  - name: RAWORRES
    type: str
    label: Collected entry (raw)

  # A test not done has no result: LBORRES, LBORRESU, LBSTRESN and LBSTRESU
  # stay empty and LBSTAT carries 'NOT DONE'.
  - name: LBORRES
    type: str
    label: Result or Finding in Original Units
    derivation:
      case:
        - when: "RAWORRES = 'NOT DONE'"
          then: {literal: null}
        - otherwise: RAWORRES

  # Every record carries the same units in both the original and the
  # standard column, so the two literals live here, not in the rows below;
  # a test not done has no units either.
  - name: LBORRESU
    type: str
    label: Original Units
    derivation:
      case:
        - when: "RAWORRES = 'NOT DONE'"
          then: {literal: null}
        - otherwise: {literal: mg/dL}

  - name: LBSTRESU
    type: str
    label: Standard Units
    derivation:
      case:
        - when: "RAWORRES = 'NOT DONE'"
          then: {literal: null}
        - otherwise: {literal: mg/dL}

  - name: LBSTAT
    type: str
    label: Completion Status
    derivation:
      case:
        - when: "RAWORRES = 'NOT DONE'"
          then: {literal: NOT DONE}
    verifications:
      allowed_values:
        values: [NOT DONE]

  - name: LBTESTCD
    type: str
    label: Lab Test or Examination Short Name

  - name: LBTEST
    type: str
    label: Lab Test or Examination Name

  - name: LBSTRESN
    type: float
    label: Numeric Result/Finding in Standard Units
    derivation:
      value: {source: LBORRES}
      missing: null

  - name: LBDTC
    type: date
    label: Date/Time of Specimen Collection

  # Numbered within each subject by collection date, then test code.
  - name: LBSEQ
    type: int
    label: Sequence Number
    derivation:
      row_number:
        window:
          group_by: [STUDYID, USUBJID]
          order_by: [LBDTC, LBTESTCD]

rows:
  # One record per subject and visit with a calcium entry, dated by the
  # visit's collection date item; ONLY() fails if the visit carries either
  # item more than once. An entry of 'NOT DONE' gives a record with empty
  # result columns and LBSTAT 'NOT DONE'.
  - id: calcium
    group_by: [ODM.StudyOID, ODM.SubjectKey, ODM.StudyEventOID]
    filter: "RAWORRES IS NOT NULL"
    derivations:
      LBTESTCD: {literal: CA}
      LBTEST: {literal: Calcium}
      RAWORRES:
        aggregate:
          filter: "ODM.ItemOID = 'IT.LB.CALCIUM'"
          expr: "ONLY(ODM.Value)"
      LBDTC:
        aggregate:
          filter: "ODM.ItemOID = 'IT.LB.LBDTC'"
          expr: "ONLY(ODM.Value)"

  # The same for the creatinine entry.
  - id: creatinine
    group_by: [ODM.StudyOID, ODM.SubjectKey, ODM.StudyEventOID]
    filter: "RAWORRES IS NOT NULL"
    derivations:
      LBTESTCD: {literal: CREAT}
      LBTEST: {literal: Creatinine}
      RAWORRES:
        aggregate:
          filter: "ODM.ItemOID = 'IT.LB.CREAT'"
          expr: "ONLY(ODM.Value)"
      LBDTC:
        aggregate:
          filter: "ODM.ItemOID = 'IT.LB.LBDTC'"
          expr: "ONLY(ODM.Value)"

verifications:
  - implies:
      id: not-done-record-has-no-result
      when: "LBSTAT = 'NOT DONE'"
      then: "LBORRES IS NULL AND LBORRESU IS NULL AND LBSTRESN IS NULL AND LBSTRESU IS NULL"
  - implies:
      id: completed-result-is-not-flagged
      when: "LBSTAT IS NULL"
      then: "LBORRES IS NOT NULL"
