schema_version: "1.0"
domain: ADTTE
keys: [STUDYID, USUBJID, PARAMCD]
input:
  ADSL: input/adsl.csv
  ADRS:
    path: input/adrs.csv
    types:
      ASEQ: int
base: ADSL
intermediates:
  # The subject's earliest dated qualifying death. A death record only
  # qualifies when it carries a date; on a tied date the lower sequence
  # number wins, whatever the input order.
  - id: DEATH_REC
    dataset: ADRS
    filter: "ADRS.PARAMCD = 'DEATH' AND ADRS.AVALC = 'Y' AND ADRS.ANL01FL = 'Y' AND ADRS.ADT IS NOT NULL"
    key: [STUDYID, USUBJID]
    order_by: [ADRS.ADT, ADRS.ASEQ]
    keep: first

output:
  path: adtte.csv
  columns: [STUDYID, USUBJID, PARAMCD, PARAM, STARTDT, ADT, AVAL, CNSR, EVNTDESC, CNSDTDSC, SRCDOM, SRCVAR, SRCSEQ]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: ADSL.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: ADSL.USUBJID

  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation: {literal: OS}

  - name: PARAM
    type: str
    label: Parameter
    derivation: {literal: Overall Survival}

  - name: STARTDT
    type: date
    label: Time-to-Event Origin Date
    derivation: ADSL.RANDDT

  - name: DEATHDT
    type: date
    label: Death Date
    derivation: DEATH_REC.ADT

  # The last-alive date as a date: ADSL is read as text, and the
  # comparisons below need a date.
  - name: CENSORDT1
    type: date
    label: Last Known Alive Date
    derivation: ADSL.LSTALVDT

  # A death before randomization is moved up to it. With no death, the
  # last-alive date when it is after randomization, else randomization.
  - name: ADT
    type: date
    label: Analysis Date
    derivation:
      case:
        - when: "DEATHDT >= STARTDT"
          then: DEATHDT
        - when: "DEATHDT IS NOT NULL"
          then: STARTDT
        - when: "CENSORDT1 > STARTDT"
          then: CENSORDT1
        - otherwise: STARTDT

  - name: AVAL
    type: int
    label: Analysis Value
    derivation:
      date_diff:
        start: STARTDT
        end: ADT
        unit: day
        bounds: inclusive

  - name: CNSR
    type: int
    label: Censor
    derivation:
      case:
        - when: "DEATHDT IS NOT NULL"
          then: {literal: 0}
        - otherwise: {literal: 1}

  - name: EVNTDESC
    type: str
    label: Event or Censoring Description
    derivation:
      case:
        - when: "DEATHDT IS NOT NULL"
          then: {literal: Death}
        - when: "CENSORDT1 > STARTDT"
          then: {literal: Alive}
        - otherwise: {literal: Randomization}

  - name: CNSDTDSC
    type: str
    label: Censoring Date Description
    derivation:
      case:
        - when: "DEATHDT IS NULL AND CENSORDT1 > STARTDT"
          then: {literal: Alive During Study}
        - when: "DEATHDT IS NULL"
          then: {literal: Randomization}

  - name: SRCDOM
    type: str
    label: Source Data
    derivation:
      case:
        - when: "DEATHDT IS NOT NULL"
          then: {literal: ADRS}
        - otherwise: {literal: ADSL}

  - name: SRCVAR
    type: str
    label: Source Variable
    derivation:
      case:
        - when: "DEATHDT IS NOT NULL"
          then: {literal: ADT}
        - when: "CENSORDT1 > STARTDT"
          then: {literal: LSTALVDT}
        - otherwise: {literal: RANDDT}

  - name: SRCSEQ
    type: int
    label: Source Sequence Number
    derivation:
      case:
        - when: "DEATHDT IS NOT NULL"
          then: DEATH_REC.ASEQ
