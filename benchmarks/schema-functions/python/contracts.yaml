project_ratio:
  contract_version: "1.0.0"
  description: Divide one measure by another, scale the quotient to a
    percentage when asked, round it, and add an adjustment.
  params:
    - name: numerator
      type: float
    - name: denominator
      type: float
    - name: decimals
      type: int
      required: false
      default: 2
    - name: adjust
      type: float
      accepts_missing: true
    - name: as_percent
      type: bool
  returns: float
