yamaa: "1.0"
type: spec
model: ADaM
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  ADSL_RAW: {path: input/adsl_raw.csv, types: {HEIGHTBL: float}}

# One displayed decimal is written into the artifact itself, which the
# transport file would then carry as the submitted height.
output:
  path: adsl.csv
  decimals: 1
  columns: [STUDYID, USUBJID, HEIGHTBL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: ADSL_RAW.STUDYID
    submission:
      core: Req
      mandatory: true
      length: 20
      origins:
        - type: Predecessor
          description: ADSL_RAW.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: ADSL_RAW.USUBJID
    submission:
      core: Req
      mandatory: true
      length: 30
      origins:
        - type: Predecessor
          description: ADSL_RAW.USUBJID

  - name: HEIGHTBL
    type: float
    label: Baseline Height (cm)
    derivation: ADSL_RAW.HEIGHTBL
    submission:
      core: Perm
      mandatory: false
      length: 6
      significant_digits: 2
      display_format: "6.1"
      origins:
        - type: Predecessor
          description: ADSL_RAW.HEIGHTBL

submission:
  label: Subject-Level Analysis Dataset
  class: SUBJECT LEVEL ANALYSIS DATASET
  structure: One record per subject
  repeating: false
