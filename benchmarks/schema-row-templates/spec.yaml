schema_version: "1.0"
domain: ADLB
keys: [USUBJID, VISIT, PARAMCD]
input:
  LB: {path: input/lb.csv, types: {LBSTRESN: float}}
base: LB

output:
  path: adlb.csv
  columns: [STUDYID, USUBJID, VISIT, PARAMCD, PARAM, AVAL, DTYPE]

columns:
  # Uniform derivations shared by every row template live at column
  # level. USUBJID and VISIT are group keys of the grouped template, so
  # the qualified source reads resolve from the group; on the
  # record-driven templates they read the retained input record.
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: {literal: YAMAA-01}

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: LB.USUBJID

  - name: VISIT
    type: int
    label: Visit Number
    derivation: LB.VISIT

  - name: PARAMCD
    type: str
    label: Parameter Code

  - name: PARAM
    type: str
    label: Parameter

  - name: AVAL
    type: float
    label: Analysis Value

  - name: DTYPE
    type: str
    label: Derivation Type

rows:
  # Case split, first section: every collected ALT record becomes one
  # row. The filter reads the input record before any row derivation,
  # so the record with a missing result is dropped here, never derived.
  - id: alt
    filter: "LB.LBTESTCD = 'ALT' AND LB.LBSTRESN IS NOT NULL"
    derivations:
      PARAMCD: {literal: ALT}
      PARAM: {literal: Alanine Aminotransferase}
      AVAL: LB.LBSTRESN
      DTYPE: {literal: null}

  # Case split, second section: the AST records follow all ALT rows in
  # the output, even though the input interleaves the two tests. Row
  # templates concatenate in specification order.
  - id: ast
    filter: "LB.LBTESTCD = 'AST' AND LB.LBSTRESN IS NOT NULL"
    derivations:
      PARAMCD: {literal: AST}
      PARAM: {literal: Aspartate Aminotransferase}
      AVAL: LB.LBSTRESN
      DTYPE: {literal: null}

  # Grouped template: one candidate row per subject-visit in first
  # appearance order. The filter reads the completed candidate's
  # unqualified columns after the group reduction: a total failing the
  # comparison is FALSE and suppressed, while the visit whose results
  # are all missing reduces to missing, which is UNKNOWN and suppressed.
  - id: visit_total
    group_by: [LB.USUBJID, LB.VISIT]
    derivations:
      PARAMCD: {literal: TOTAL}
      PARAM: {literal: Total of Components}
      AVAL:
        aggregate:
          expr: "SUM(LB.LBSTRESN)"
      DTYPE: {literal: CALCULATION}
    filter: "AVAL > 100"
