schema_version: "1.0"
domain: ADTTE
keys: [STUDYID, USUBJID, PARAMCD]
input:
  ADSL: input/adsl.csv
  ADAE:
    path: input/adae.csv
    types:
      AESEQ: int
base: ADSL
intermediates:
  # The subject's first AE by onset date, ties to the lower AESEQ; an AE with
  # no onset date sorts last.
  - id: AE_REC
    dataset: ADAE
    order_by: [ADAE.ASTDT, ADAE.AESEQ]
    keep: first

output:
  path: adtte.csv
  columns: [STUDYID, USUBJID, PARAMCD, PARAM, STARTDT, ADT, AVAL, CNSR, EVNTDESC, SRCDOM, SRCVAR, SRCSEQ]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: ADSL.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: ADSL.USUBJID

  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation: {literal: TTAE}

  - name: PARAM
    type: str
    label: Parameter
    derivation: {literal: Time to First Adverse Event}

  - name: STARTDT
    type: date
    label: Time-to-Event Origin Date
    derivation: ADSL.TRTSDT

  - name: AEDT
    type: date
    label: Adverse Event Date
    derivation: AE_REC.ASTDT

  # The first AE's onset, or the end of study when no AE has an onset date.
  - name: RAWDT
    type: date
    label: Selected Date Before Clamping
    derivation:
      case:
        - when: "AEDT IS NOT NULL"
          then: AEDT
        - otherwise: ADSL.EOSDT

  # A date before treatment start is moved up to it; with no treatment start
  # the date is kept as it is.
  - name: ADT
    type: date
    label: Analysis Date
    derivation:
      case:
        - when: "STARTDT > RAWDT"
          then: STARTDT
        - otherwise: RAWDT

  - name: AVAL
    type: int
    label: Analysis Value
    derivation:
      date_diff:
        start: STARTDT
        end: ADT
        unit: day
        bounds: inclusive

  - name: CNSR
    type: int
    label: Censor
    derivation:
      case:
        - when: "AEDT IS NOT NULL"
          then: {literal: 0}
        - otherwise: {literal: 1}

  - name: EVNTDESC
    type: str
    label: Event or Censoring Description
    derivation:
      case:
        - when: "AEDT IS NOT NULL"
          then: {literal: AE}
        - otherwise: {literal: END OF STUDY}

  - name: SRCDOM
    type: str
    label: Source Data
    derivation:
      case:
        - when: "AEDT IS NOT NULL"
          then: {literal: ADAE}
        - otherwise: {literal: ADSL}

  - name: SRCVAR
    type: str
    label: Source Variable
    derivation:
      case:
        - when: "AEDT IS NOT NULL"
          then: {literal: ASTDT}
        - otherwise: {literal: EOSDT}

  - name: SRCSEQ
    type: int
    label: Source Sequence Number
    derivation:
      case:
        - when: "AEDT IS NOT NULL"
          then: AE_REC.AESEQ
