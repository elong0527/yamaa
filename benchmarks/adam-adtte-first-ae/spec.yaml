yamaa: "1.0"
type: spec
model: ADaM
domain: ADTTE
keys: [STUDYID, USUBJID, PARAMCD]
input:
  ADSL: {path: input/adsl.csv, types: {TRTSDT: date}}
  ADAE:
    path: input/adae.csv
    types:
      AESEQ: int
base: ADSL

output:
  path: adtte.csv
  columns: [STUDYID, USUBJID, PARAMCD, PARAM, STARTDT, ADT, AVAL, CNSR,
            EVNTDESC, SRCDOM, SRCVAR, SRCSEQ]

intermediates:
  # The subject's first AE by onset date, ties to the lower AESEQ; an AE with
  # no onset date sorts last.
  - id: AE_REC
    dataset: ADAE
    key: [STUDYID, USUBJID]
    order_by: [{variable: ADAE.ASTDT, nulls: last}, ADAE.AESEQ]
    keep: first

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: ADSL.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: ADSL.USUBJID

  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation: "'TTAE'"

  - name: PARAM
    type: str
    label: Parameter
    derivation: "'Time to First Adverse Event'"

  - name: STARTDT
    type: date
    label: Time-to-Event Origin Date
    derivation: ADSL.TRTSDT

  - name: AEDT
    type: date
    label: Adverse Event Date
    derivation: AE_REC.ASTDT

  # The first AE's onset, or the end of study when no AE has an onset date.
  - name: RAWDT
    type: date
    label: Selected Date Before Clamping
    derivation:
      case:
        - when: "AEDT IS NOT NULL"
          then: AEDT
        - otherwise: ADSL.EOSDT

  # A date before treatment start is moved up to it; with no treatment start
  # the date is kept as it is.
  - name: ADT
    type: date
    label: Analysis Date
    derivation:
      case:
        - when: "STARTDT > RAWDT"
          then: STARTDT
        - otherwise: RAWDT

  - name: AVAL
    type: int
    label: Analysis Value
    derivation:
      diff:
        type: date
        start: STARTDT
        end: ADT
        unit: day
        closed: both

  - name: CNSR
    type: int
    label: Censor
    derivation:
      case:
        - when: "AEDT IS NOT NULL"
          then: 0
        - otherwise: 1

  - name: EVNTDESC
    type: str
    label: Event or Censoring Description
    derivation:
      case:
        - when: "AEDT IS NOT NULL"
          then: "'AE'"
        - otherwise: "'END OF STUDY'"

  - name: SRCDOM
    type: str
    label: Source Data
    derivation:
      case:
        - when: "AEDT IS NOT NULL"
          then: "'ADAE'"
        - otherwise: "'ADSL'"

  - name: SRCVAR
    type: str
    label: Source Variable
    derivation:
      case:
        - when: "AEDT IS NOT NULL"
          then: "'ASTDT'"
        - otherwise: "'EOSDT'"

  - name: SRCSEQ
    type: int
    label: Source Sequence Number
    derivation:
      case:
        - when: "AEDT IS NOT NULL"
          then: AE_REC.AESEQ
