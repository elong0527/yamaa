schema_version: "1.0"
domain: ADAE
keys: [STUDYID, USUBJID, AESEQ]
input:
  AE: input/ae.csv

output:
  path: adae.csv
  columns: [STUDYID, USUBJID, AESEQ, ASEV, ASEVN]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: AE.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: AE.USUBJID

  - name: AESEQ
    type: int
    label: Sequence Number
    derivation: AE.AESEQ

  # The approved correction reassigns event 2 of subject CATH-01-001 to
  # SEVERE. Every other event keeps its reported severity in upper case; a
  # missing severity stays empty.
  - name: ASEV
    type: str
    label: Analysis Severity/Intensity
    derivation:
      case:
        - when: "USUBJID = 'CATH-01-001' AND AESEQ = 2"
          then: {literal: SEVERE}
        - otherwise:
            str_upper:
              source: AE.AESEV
              missing: null
    verifications:
      - allowed_values:
          values: [MILD, MODERATE, SEVERE, LIFE-THREATENING]

  - name: ASEVN
    type: int
    label: Analysis Severity/Intensity (N)
    derivation:
      mapping:
        source: ASEV
        missing: null
        dict:
          MILD: 1
          MODERATE: 2
          SEVERE: 3
          LIFE-THREATENING: 4
    verifications:
      - range:
          min: 1
          max: 4

verifications:
  - unique:
      columns: [STUDYID, USUBJID, AESEQ]
  - row_count:
      min: 5
      max: 5
  - implies:
      id: approved-correction-is-applied
      when: "USUBJID = 'CATH-01-001' AND AESEQ = 2"
      then: "ASEV = 'SEVERE' AND ASEVN = 3"
