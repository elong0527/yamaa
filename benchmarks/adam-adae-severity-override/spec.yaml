schema_version: "1.0"
domain: ADAE
keys: [STUDYID, USUBJID, AESEQ]
input:
  AE: input/ae.csv

output:
  path: adae.csv
  columns: [STUDYID, USUBJID, AESEQ, ASEV, ASEVN]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: AE.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: AE.USUBJID

  - name: AESEQ
    type: int
    label: Sequence Number
    derivation: AE.AESEQ

  # Two approved corrections reassign events to SEVERE: event 2 of
  # subject CATH-01-001 (reported MODERATE), and event 1 of subject
  # CATH-01-003 (severity unreported). Every other event keeps its
  # reported severity in upper case; a missing severity with no
  # applicable correction stays empty.
  - name: ASEV
    type: str
    label: Analysis Severity/Intensity
    derivation:
      case:
        - when: "USUBJID = 'CATH-01-001' AND AESEQ = 2"
          then: {literal: SEVERE}
        - when: "USUBJID = 'CATH-01-003' AND AESEQ = 1"
          then: {literal: SEVERE}
        - otherwise:
            str_case:
              source: AE.AESEV
              to: upper
              missing: null
    verifications:
      - allowed_values:
          values: [MILD, MODERATE, SEVERE, LIFE-THREATENING]

  - name: ASEVN
    type: int
    label: Analysis Severity/Intensity (N)
    derivation:
      mapping:
        source: ASEV
        missing: null
        dict:
          MILD: 1
          MODERATE: 2
          SEVERE: 3
          LIFE-THREATENING: 4
    verifications:
      - range:
          min: 1
          max: 4

verifications:
  - unique:
      columns: [STUDYID, USUBJID, AESEQ]
  - row_count:
      min: 6
      max: 6
  - assert:
      id: approved-correction-is-applied
      when: "USUBJID = 'CATH-01-001' AND AESEQ = 2"
      require: "ASEV = 'SEVERE' AND ASEVN = 3"
  - assert:
      id: approved-correction-on-missing-is-applied
      when: "USUBJID = 'CATH-01-003' AND AESEQ = 1"
      require: "ASEV = 'SEVERE' AND ASEVN = 3"
