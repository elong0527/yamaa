schema_version: "1.0"
domain: ADRS
keys: [STUDYID, USUBJID, RSSEQ]
input:
  RS: input/rs.csv

output:
  path: adrs.csv
  columns: [STUDYID, USUBJID, RSSEQ, PARAMCD, ADT, AVALC]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: RS.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: RS.USUBJID

  - name: RSSEQ
    type: int
    label: Sequence Number
    derivation: RS.RSSEQ

  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation: {literal: OVR}

  - name: ADT
    type: date
    label: Analysis Date
    derivation: RS.RSDTC

  - name: AVALC
    type: str
    label: Analysis Value (C)
    derivation: RS.RSSTRESC
    verifications:
      allowed_values:
        values: [CR, PR, SD, NON-CR/NON-PD, PD, NE]

  - name: PREVAVALC
    type: str
    label: Previous Analysis Value (C)
    derivation:
      row_value:
        source: AVALC
        offset: -1
        window:
          group_by: [STUDYID, USUBJID]
          order_by: [ADT, RSSEQ]

verifications:
  - unique:
      columns: [STUDYID, USUBJID, RSSEQ]
  - row_count:
      min: 6
      max: 6
  - assert:
      id: response-does-not-fall-back-after-a-complete-response
      expr: "NOT (AVALC = 'PR' AND PREVAVALC IS NOT NULL AND PREVAVALC = 'CR')"
