yamaa: "1.0"
type: spec
model: ADaM
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  SOURCE: input/adsl.csv

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, HEIGHTBL, WEIGHTBL, BMIBL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: SOURCE.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: SOURCE.USUBJID

  - name: HEIGHTBL
    type: float
    label: Baseline Height (cm)
    derivation: SOURCE.HEIGHTBL

  - name: WEIGHTBL
    type: float
    label: Baseline Weight (kg)
    derivation: SOURCE.WEIGHTBL

  # The baseline index from the project's own bmi routine; the runner picks
  # the project root that implements it. A missing height or weight skips
  # the call, so BMIBL is empty there.
  - name: BMIBL
    type: float
    label: Baseline BMI (kg/m2)
    derivation:
      function:
        name: bmi
        args:
          weight_kg: WEIGHTBL
          height_cm: HEIGHTBL
          cm_per_m: 100

  # A check, not in the output: the same index as an inline formula, which
  # the routine must agree with. NULLIF turns a zero height into missing, so
  # the check is empty instead of dividing by zero.
  - name: BMICHK
    type: float
    label: Baseline BMI by Formula (kg/m2)
    derivation: "WEIGHTBL / POWER(NULLIF(HEIGHTBL, 0) / 100, 2)"

verifications:
  - row_count:
      min: 7
      max: 7
  - assert:
      id: bmi-missing-only-without-usable-inputs
      when: "BMIBL IS NULL"
      require: "HEIGHTBL IS NULL OR HEIGHTBL = 0 OR WEIGHTBL IS NULL"
  - assert:
      id: routine-agrees-with-the-formula
      when: "BMICHK IS NOT NULL"
      require: "BMIBL = BMICHK"
  - assert:
      id: routine-is-empty-where-the-formula-is
      when: "BMICHK IS NULL"
      require: "BMIBL IS NULL"
