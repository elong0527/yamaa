schema_version: "1.0"
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  SOURCE: input/adsl.csv

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, HEIGHTCM, WEIGHTKG, BMI, BMI_FN]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: SOURCE.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: SOURCE.USUBJID

  - name: HEIGHTCM
    type: float
    label: Height (cm)
    derivation: SOURCE.HEIGHTCM

  - name: WEIGHTKG
    type: float
    label: Weight (kg)
    derivation: SOURCE.WEIGHTKG

  # NULLIF turns a zero height into missing, so BMI is empty instead of
  # dividing by zero; a missing height or weight also leaves it empty.
  - name: BMI
    type: float
    label: Body Mass Index (kg/m2)
    derivation:
      compute:
        expr: "WEIGHTKG / POWER(NULLIF(HEIGHTCM, 0) / 100, 2)"

  # The same index from the project's own bmi routine; the runner picks the
  # project root that implements it. A missing height or weight skips the
  # call, so BMI_FN is empty there.
  - name: BMI_FN
    type: float
    label: Body Mass Index via Project Routine (kg/m2)
    derivation:
      function:
        name: bmi
        contract_version: "1.0.0"
        args:
          weight_kg: WEIGHTKG
          height_cm: HEIGHTCM
          cm_per_m: 100

verifications:
  - unique:
      columns: [STUDYID, USUBJID]
  - row_count:
      min: 7
      max: 7
  - implies:
      id: bmi-missing-only-without-usable-inputs
      when: "BMI IS NULL"
      then: "HEIGHTCM IS NULL OR HEIGHTCM = 0 OR WEIGHTKG IS NULL"
