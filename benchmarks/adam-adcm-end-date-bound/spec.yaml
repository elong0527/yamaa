schema_version: "1.0"
domain: ADCM
keys: [STUDYID, USUBJID, CMSEQ]
input:
  CM: input/cm.csv
  ADSL: {path: input/adsl.csv, types: {DTHDT: date}}
base: CM

output:
  path: adcm.csv
  columns: [STUDYID, USUBJID, CMSEQ, CMTRT, CMENDTC, AENDT, AENDTF, DTHDT]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: CM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: CM.USUBJID

  - name: CMSEQ
    type: int
    label: Sequence Number
    derivation: CM.CMSEQ

  - name: CMTRT
    type: str
    label: Reported Name of Drug, Medication, or Therapy
    derivation: CM.CMTRT

  - name: CMENDTC
    type: str
    label: End Date/Time of Medication
    derivation: CM.CMENDTC

  - name: DTHDT
    type: date
    label: Date of Death
    derivation: ADSL.DTHDT

  # Complete a partial end to the last day of its month, or of the year when
  # only a year was collected, moved back to death when that falls inside
  # the collected month or year. The bound moves only the supplied
  # components, so a death before the collected month moves nothing.
  - name: AENDT
    type: date
    label: Analysis End Date
    derivation:
      impute:
        type: date
        source: CMENDTC
        month: 12
        day: last
        not_after: DTHDT
        invalid: null   # handlers are explicit: an omitted one is fatal

  # The first day the collected end allows; a supplied end can follow
  # death only when this does too.
  - name: AENDTE
    type: date
    label: Earliest Analysis End Date Allowed
    derivation:
      impute:
        type: date
        source: CMENDTC
        month: 1
        day: first
        invalid: null

  # D: a year and month were collected, so the day was supplied; M: only
  # the year was, so the month and day were supplied.
  - name: AENDTF
    type: str
    label: Analysis End Date Imputation Flag
    derivation:
      imputation_flag:
        source: AENDT
        part: date
    verifications:
      allowed_values:
        values: ["D", "M"]

verifications:
  - row_count:
      min: 11
      max: 11
  - assert:
      id: imputation-flag-requires-an-analysis-date
      when: "AENDTF IS NOT NULL"
      require: "AENDT IS NOT NULL"
  - assert:
      id: supplied-end-never-follows-death-in-its-period
      when: "AENDTF IS NOT NULL AND AENDTE <= DTHDT"
      require: "AENDT <= DTHDT"
