lifecycle: draft
standard: ADaM
domain: ADCM
review:
  concerns:
    - Medication end dates decide whether a drug was taken during treatment, and
      an imputed end must never fall after the subject's death.
    - Five subjects cover full, year-month and year-only ends, a leap-year
      February, a missing end, a subject who did not die, and deaths inside and
      before the collected month.
    - Subject 201's paracetamol ending 2024-03 is cut back to the 2024-03-12
      death date, but subject 204's simvastatin ending 2024-05, a month after
      death, stays on 2024-05-31 rather than moving into a month nobody
      recorded.
