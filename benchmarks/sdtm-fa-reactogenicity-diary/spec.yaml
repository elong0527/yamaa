schema_version: "1.0"
domain: FA
keys: [STUDYID, USUBJID, FASEQ]
input:
  DIARY:
    path: input/diary.csv
    types:
      DIARYDAY: int
      DTC: date
      DIAMETER: float

output:
  path: fa.csv
  columns: [DOMAIN, STUDYID, USUBJID, FASEQ, FATESTCD, FATEST, FAOBJ, FACAT, FASCAT, FAORRES, FAORRESU, FASTRESC, FASTRESN, FASTRESU, FASTAT, FATPT, FADTC]
  order_by: [FASEQ]

columns:
  - name: DOMAIN
    type: str
    label: Domain Abbreviation
    derivation: {literal: FA}

  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DIARY.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DIARY.USUBJID

  - name: FATESTCD
    type: str
    label: Findings About Test Short Name

  - name: FATEST
    type: str
    label: Findings About Test Name

  # Orders the tests of one reaction on one day: occurrence, severity, then
  # diameter.
  - name: TESTORD
    type: int
    label: Test order within a diary record
    derivation:
      case:
        - when: "FATESTCD = 'OCCUR'"
          then: {literal: 1}
        - when: "FATESTCD = 'SEV'"
          then: {literal: 2}
        - when: "FATESTCD = 'LDIAM'"
          then: {literal: 3}

  - name: FASEQ
    type: int
    label: Sequence Number
    derivation:
      row_number:
        window:
          group_by: [STUDYID, USUBJID]
          order_by: [DIARY.DIARYDAY, DIARY.REACTION, TESTORD]

  - name: FAOBJ
    type: str
    label: Object of the Observation
    derivation: DIARY.REACTION

  - name: FACAT
    type: str
    label: Category for Findings About
    derivation: {literal: REACTOGENICITY}

  - name: FASCAT
    type: str
    label: Subcategory for Findings About
    derivation:
      case:
        - when: "DIARY.CATSRC = 'LOCAL'"
          then: {literal: ADMINISTRATION SITE}
        - otherwise: {literal: SYSTEMIC}

  - name: FAORRES
    type: str
    label: Result or Finding in Original Units

  - name: FAORRESU
    type: str
    label: Original Units
    derivation:
      case:
        - when: "FATESTCD = 'LDIAM'"
          then: DIARY.DIAMUNIT

  - name: FASTRESC
    type: str
    label: Character Result/Finding in Std Format
    derivation: FAORRES

  - name: FASTRESN
    type: float
    label: Numeric Result/Finding in Standard Units
    derivation:
      case:
        - when: "FATESTCD = 'LDIAM'"
          then: DIARY.DIAMETER

  - name: FASTRESU
    type: str
    label: Standard Units
    derivation: FAORRESU

  - name: FASTAT
    type: str
    label: Completion Status
    derivation:
      case:
        - when: "DIARY.COMPLETED = 'N'"
          then: {literal: NOT DONE}

  - name: FATPT
    type: str
    label: Planned Time Point Name
    derivation: DIARY.TPT

  - name: FADTC
    type: date
    label: Date/Time of Collection
    derivation: DIARY.DTC

rows:
  # Every diary row (one reaction on one day) gives an occurrence record; on
  # a missed day its result is blank.
  - id: occurrence
    derivations:
      FATESTCD: {literal: OCCUR}
      FATEST: {literal: Occurrence Indicator}
      FAORRES:
        case:
          - when: "DIARY.COMPLETED = 'Y'"
            then: DIARY.OCCUR

  # Completed days only; the severity is NONE unless the reaction occurred.
  - id: severity
    filter: "DIARY.COMPLETED = 'Y'"
    derivations:
      FATESTCD: {literal: SEV}
      FATEST: {literal: Severity/Intensity}
      FAORRES:
        case:
          - when: "DIARY.OCCUR = 'Y'"
            then: DIARY.SEV
          - otherwise: {literal: NONE}

  # Only redness or swelling that occurred on a completed day.
  - id: longest-diameter
    filter: "DIARY.COMPLETED = 'Y' AND DIARY.OCCUR = 'Y' AND DIARY.REACTION IN ('REDNESS', 'SWELLING')"
    derivations:
      FATESTCD: {literal: LDIAM}
      FATEST: {literal: Longest Diameter}
      FAORRES: DIARY.DIAMETER
