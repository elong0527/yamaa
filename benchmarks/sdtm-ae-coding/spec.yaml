schema_version: "1.0"
domain: AE
keys: [STUDYID, USUBJID, AESEQ]
input:
  AE_RAW: input/ae_raw.csv
  MEDDRA: input/meddra_26_1.csv
base: AE_RAW

output:
  path: ae.csv
  columns: [DOMAIN, STUDYID, USUBJID, AESEQ, AETERM, AEDECOD, AEBODSYS]

intermediates:
  - id: MEDDRA_CODING
    dataset: MEDDRA
    key: {LLTNAME: AE_RAW.AETERM}
    no_match: NOT CODED

columns:
  - name: DOMAIN
    type: str
    label: Domain Abbreviation
    derivation: {literal: AE}
    submission:
      core: Req
      role: Identifier
      length: 2
      origin:
        type: Assigned
        source: Sponsor

  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: AE_RAW.STUDYID
    submission:
      core: Req
      role: Identifier
      length: 20
      origin:
        type: Protocol
        source: Sponsor

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: AE_RAW.USUBJID
    submission:
      core: Req
      role: Identifier
      length: 30
      origin:
        type: Assigned
        source: Sponsor

  - name: AESEQ
    type: int
    label: Sequence Number
    derivation: AE_RAW.AESEQ
    submission:
      core: Req
      role: Identifier
      length: 8
      origin:
        type: Assigned
        source: Sponsor

  # SDTMIG designates AETERM Req. This coding fixture keeps one blank reported
  # term to show the NOT CODED fallback, which a required term would refuse,
  # so it declares Exp; a study submitting AE declares Req.
  - name: AETERM
    type: str
    label: Reported Term for the Adverse Event
    derivation: AE_RAW.AETERM
    submission:
      core: Exp
      role: Topic
      length: 200
      origin:
        type: Collected
        source: Investigator
        documents:
          - document: acrf
            pages: {type: PhysicalRef, refs: "1"}

  # Both coded terms come from the dictionary row whose lowest-level term
  # equals the reported term exactly, letter case included. No such row, or
  # a missing reported term, gives NOT CODED.
  - name: AEDECOD
    type: str
    label: Dictionary-Derived Term
    derivation: MEDDRA_CODING.PTNAME
    submission:
      core: Req
      role: Synonym Qualifier
      length: 200
      codelist: MEDDRA
      origin:
        type: Assigned
        source: Sponsor
      method: Take PTNAME from the MEDDRA record whose LLTNAME equals
        AE_RAW.AETERM, and no match yields "NOT CODED".

  - name: AEBODSYS
    type: str
    label: Body System or Organ Class
    derivation: MEDDRA_CODING.SOCNAME
    submission:
      core: Exp
      role: Record Qualifier
      length: 200
      codelist: MEDDRA
      origin:
        type: Assigned
        source: Sponsor
      method: Take SOCNAME from the MEDDRA record whose LLTNAME equals
        AE_RAW.AETERM, and no match yields "NOT CODED".

verifications:
  - row_count:
      min: 8
      max: 8

submission:
  label: Adverse Events
  class: EVENTS
  structure: One record per adverse event
  repeating: true
