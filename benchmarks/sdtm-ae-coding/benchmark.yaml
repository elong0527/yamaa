lifecycle: reviewed
standard: SDTM
domain: AE
review:
  concerns:
    - Safety tables summarize adverse events by preferred term and body system,
      so every reported term needs its MedDRA coding before analysis.
    - Seven events cover exact matches, synonyms that code to another preferred
      term (Cephalgia to Headache, Queasy to Nausea), free text with no
      dictionary entry, and a term reported in lower case.
    - The reported term is stored in upper case and matched whatever its letter
      case, so subject 107's 'headache' codes to Headache; free text with no
      entry (subject 105) is NOT CODED in both coded variables, marking an event
      a coder must resolve.
