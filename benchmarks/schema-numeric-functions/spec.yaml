schema_version: "1.0"
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  SOURCE: input/adsl.csv

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, AVAL, BVAL, CVAL, CEILVAL, FLOORVAL,
    TRUNCVAL, EXPVAL, MODVAL, GREATESTVAL, LEASTVAL, COALESCEVAL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: SOURCE.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: SOURCE.USUBJID

  - name: AVAL
    type: float
    label: Analysis Value
    derivation: SOURCE.AVAL

  - name: BVAL
    type: int
    label: Secondary Analysis Value
    derivation: SOURCE.BVAL

  - name: CVAL
    type: int
    label: Tertiary Analysis Value
    derivation: SOURCE.CVAL

  # Zero joins the largest and smallest choices below as a column, because
  # their sources are variables rather than literals. It stays out of the
  # output.
  - name: ZERO
    type: int
    label: Zero
    derivation: {literal: 0}

  - name: CEILVAL
    type: int
    label: Ceiling of Analysis Value
    derivation:
      compute:
        expr: "CEIL(AVAL)"

  - name: FLOORVAL
    type: int
    label: Floor of Analysis Value
    derivation:
      compute:
        expr: "FLOOR(AVAL)"

  # Toward zero: -2.7 gives -2, where FLOOR gives -3.
  - name: TRUNCVAL
    type: int
    label: Truncation of Analysis Value
    derivation:
      compute:
        expr: "TRUNC(AVAL)"

  - name: EXPVAL
    type: float
    label: Exponential of Analysis Value
    derivation:
      compute:
        expr: "EXP(AVAL)"

  # The remainder takes the sign of BVAL, so -7 gives -1 rather than 2.
  - name: MODVAL
    type: int
    label: Remainder of Secondary Value Divided by Three
    derivation:
      compute:
        expr: "MOD(BVAL, 3)"

  # Greatest and least skip missing sources, so with ZERO among them
  # neither result is ever missing.
  - name: GREATESTVAL
    type: int
    label: Largest of Secondary, Tertiary, and Zero
    derivation:
      greatest:
        sources: [BVAL, CVAL, ZERO]

  - name: LEASTVAL
    type: int
    label: Smallest of Secondary, Tertiary, and Zero
    derivation:
      least:
        sources: [BVAL, CVAL, ZERO]

  # First_available returns the first present source, or missing when
  # every source is missing.
  - name: COALESCEVAL
    type: int
    label: First Present Value Among Tertiary and Secondary
    derivation:
      first_available:
        sources: [CVAL, BVAL]

verifications:
  - unique:
      columns: [STUDYID, USUBJID]
  - row_count:
      min: 5
      max: 5
