schema_version: "1.0"
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  DM: input/dm.csv
  EX: input/ex.csv
base: DM
intermediates:
  # The subject's earliest exposure record. Its id repeats the input
  # dataset name EX, so a later EX.EXTRT could mean either one.
  - id: EX
    dataset: EX
    order_by: [EX.EXSTDTC, EX.EXSEQ]
    keep: first

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, TRT01A]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  - name: TRT01A
    type: str
    label: Actual Treatment for Period 01
    derivation: EX.EXTRT
