schema_version: "1.0"
domain: DM
keys: [STUDYID, USUBJID]
input:
  DM_RAW: input/dm_raw.csv

output:
  path: dm.csv
  columns: [STUDYID, USUBJID, SUBJID, SITEID]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM_RAW.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    # STUDYID-SITEID-SUBJID. With no missing: value, a record missing any
    # part stops the run.
    derivation:
      str_concat:
        sources:
          - source: DM_RAW.STUDYID
          - literal: '-'
          - source: DM_RAW.SITEID
          - literal: '-'
          - source: DM_RAW.SUBJID
    # A long site identifier pushes the joined value past 20 characters,
    # which fails once the dataset is complete.
    verifications:
      - max_length:
          max: 20

  - name: SUBJID
    type: str
    label: Subject Identifier for the Study
    derivation: DM_RAW.SUBJID

  - name: SITEID
    type: str
    label: Study Site Identifier
    derivation: DM_RAW.SITEID
