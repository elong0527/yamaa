yamaa: "1.0"

type: spec

model: ADaM
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  DM:
    path: input/dm.parquet
    byte_order_mark: true

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, SITEID]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  - name: SITEID
    type: str
    label: Study Site Identifier
    derivation: DM.SITEID
