schema_version: "1.0"
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  DM: input/dm.csv

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, SITE]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  # The site number read as an integer (DM holds it as text).
  - name: SITENUM
    type: int
    label: Site Number
    derivation: DM.SITENUM

  # The defect: title case needs text, and SITENUM is an integer, so the
  # spec is rejected before any data is read.
  - name: SITE
    type: str
    label: Site Name
    derivation:
      str_title:
        source: SITENUM
