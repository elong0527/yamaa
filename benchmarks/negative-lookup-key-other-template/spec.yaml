schema_version: "1.0"
domain: VS
keys: [USUBJID, VSDY, VSCAT]
input:
  CLINIC: {path: input/clinic.csv, types: {VSDY: int, SYSBP: int}}
  HOME: {path: input/home.csv, types: {VSDY: int, SYSBP: int}}
  DEVICES: input/devices.csv

output:
  path: vs.csv
  columns: [USUBJID, VSDY, VSCAT, VSSTRESN, VSMETHOD]

intermediates:
  # The device a measurement was taken with, matched on the clinic record's
  # device number.
  - id: DEVICE
    dataset: DEVICES
    key: {DEVICEID: CLINIC.DEVICEID}
    no_match: null

columns:
  - {name: USUBJID, type: str, label: Unique Subject Identifier}
  - {name: VSDY, type: int, label: Study Day of Vital Signs}
  - {name: VSCAT, type: str, label: Category for Vital Signs}

  - name: VSSTRESN
    type: int
    label: Numeric Result/Finding in Standard Units

  # Every record's method comes from its device, but home records build
  # some of the rows and have no clinic record, so the specification is
  # rejected before any data is read.
  - name: VSMETHOD
    type: str
    label: Method of Test or Examination
    derivation: DEVICE.METHOD

rows:
  - id: clinic
    dataset: CLINIC
    derivations:
      USUBJID: CLINIC.USUBJID
      VSDY: CLINIC.VSDY
      VSCAT: {literal: CLINIC}
      VSSTRESN: CLINIC.SYSBP

  - id: home
    dataset: HOME
    derivations:
      USUBJID: HOME.USUBJID
      VSDY: HOME.VSDY
      VSCAT: {literal: HOME}
      VSSTRESN: HOME.SYSBP
