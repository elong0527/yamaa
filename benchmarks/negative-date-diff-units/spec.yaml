schema_version: "1.0"
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  DM: input/dm.csv

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, STDT, ENDT, DURM]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  - name: STDT
    type: date
    label: Start Date
    derivation: DM.STDT

  - name: ENDT
    type: date
    label: End Date
    derivation: DM.ENDT

  # Counting both end dates is defined only for a day count, so inclusive
  # beside unit: month is rejected before any data is read.
  - name: DURM
    type: int
    label: Duration in Whole Months
    derivation:
      date_diff:
        start: STDT
        end: ENDT
        unit: month
        bounds: inclusive
