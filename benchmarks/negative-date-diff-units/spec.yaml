schema_version: "1.0"
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  DM: input/dm.csv

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, TRTSDT, TRTEDT, TRTDURM]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  - name: TRTSDT
    type: date
    label: Date/Time of First Exposure to Treatment
    derivation: DM.TRTSDT

  - name: TRTEDT
    type: date
    label: Date/Time of Last Exposure to Treatment
    derivation: DM.TRTEDT

  # Counting both end dates is defined only for a day count, so inclusive
  # beside unit: month is rejected before any data is read.
  - name: TRTDURM
    type: int
    label: Total Duration of Treatment (Months)
    derivation:
      date_diff:
        start: TRTSDT
        end: TRTEDT
        unit: month
        bounds: inclusive
