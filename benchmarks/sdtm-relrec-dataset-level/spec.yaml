yamaa: "1.0"
type: spec
model: SDTM
domain: RELREC
# One row per domain per relationship. IDVARVAL is null on dataset-level
# rows, so the keys cannot name it.
keys: [STUDYID, RDOMAIN, IDVAR, RELID]
input:
  TU: input/tu.csv
  TR: input/tr.csv
  AE: input/ae.csv
  CM: input/cm.csv

output:
  path: relrec.csv
  columns: [STUDYID, USUBJID, RDOMAIN, IDVAR, IDVARVAL, RELTYPE, RELID]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier

  - name: USUBJID
    type: str
    label: Unique Subject Identifier

  - name: RDOMAIN
    type: str
    label: Related Domain Abbreviation

  - name: IDVAR
    type: str
    label: Identifying Variable

  - name: IDVARVAL
    type: str
    label: Identifying Variable Value

  - name: RELTYPE
    type: str
    label: Relationship Type

  - name: RELID
    type: str
    label: Relationship Identifier

rows:
  # One dataset-level row per study for each of TU and TR: the whole TU
  # dataset relates to the whole TR dataset through their link variables.
  - id: tu_dataset
    dataset: TU
    group_by: [TU.STUDYID]
    derivations:
      STUDYID: TU.STUDYID
      USUBJID: null
      RDOMAIN: "'TU'"
      IDVAR: "'TULNKID'"
      IDVARVAL: null
      RELTYPE: "'ONE'"
      RELID: "'1'"

  - id: tr_dataset
    dataset: TR
    group_by: [TR.STUDYID]
    derivations:
      STUDYID: TR.STUDYID
      USUBJID: null
      RDOMAIN: "'TR'"
      IDVAR: "'TRLNKID'"
      IDVARVAL: null
      RELTYPE: "'MANY'"
      RELID: "'1'"

  # One record-level row per AE and CM record with a link identifier, which
  # becomes RELID: records sharing it are related. A record without one gets
  # no row.
  - id: ae_link
    dataset: AE
    filter: "AE.AELNKID IS NOT NULL"
    derivations:
      STUDYID: AE.STUDYID
      USUBJID: AE.USUBJID
      RDOMAIN: "'AE'"
      IDVAR: "'AESEQ'"
      IDVARVAL: AE.AESEQ
      RELTYPE: null
      RELID: AE.AELNKID

  - id: cm_link
    dataset: CM
    filter: "CM.CMLNKID IS NOT NULL"
    derivations:
      STUDYID: CM.STUDYID
      USUBJID: CM.USUBJID
      RDOMAIN: "'CM'"
      IDVAR: "'CMSEQ'"
      IDVARVAL: CM.CMSEQ
      RELTYPE: null
      RELID: CM.CMLNKID

verifications:
  - row_count:
      min: 6
      max: 6
  - assert:
      id: dataset-row-carries-no-record-pointer
      when: "IDVARVAL IS NULL"
      require: "USUBJID IS NULL"
  - assert:
      id: record-row-carries-subject-and-record-pointer
      when: "IDVARVAL IS NOT NULL"
      require: "USUBJID IS NOT NULL"
  - assert:
      id: dataset-row-carries-relationship-type
      when: "IDVARVAL IS NULL"
      require: "RELTYPE IN ('ONE', 'MANY')"
  - assert:
      id: record-row-carries-no-relationship-type
      when: "IDVARVAL IS NOT NULL"
      require: "RELTYPE IS NULL"
