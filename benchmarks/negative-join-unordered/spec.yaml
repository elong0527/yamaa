yamaa: "1.0"
type: spec
model: ADaM
domain: ADSL
keys: [STUDYID, USUBJID]

input:
  DM: input/dm.csv
  AE:
    path: input/ae.csv
    types:
      AESEQ: int
base: DM

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, AETERMS]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  # The subject's terms in one text, with no order stated: the run is
  # rejected before any data is read.
  - name: AETERMS
    type: str
    label: Adverse Event Terms
    derivation:
      aggregate:
        key: [STUDYID, USUBJID]
        separator: ", "
        expr: "STR_JOIN(AE.AETERM)"
