lifecycle: draft
standard: ADaM
domain: ADVS
review:
  concerns:
    - LOCF analyses carry the whole source observation, with its date and
      sequence, so a carried value can be traced.
    - Five subjects cover gaps, an observation not selected for analysis, two
      observations at one visit, a zero result, a missing date, visits before
      any result, and a subject with no observations.
    - Only observations selected for analysis count (subject 101's 142 at visit
      2 is ignored), a tie within a visit goes to the higher sequence (subject
      102's 128), and a carried observation keeps its own missing date rather
      than borrowing an earlier one.
