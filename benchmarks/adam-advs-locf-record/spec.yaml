schema_version: "1.0"
domain: ADVS
keys: [USUBJID, PARAMCD, AVISITN]
input:
  PLAN:
    path: input/plan.csv
    types: {AVISITN: int}
  OBS:
    path: input/vs.csv
    types: {AVISITN: int, AVAL: float, ADT: date, QSSEQ: int}
base: PLAN

# For each planned visit, the latest analysis-flagged observation with a
# result at or before it: highest visit number, then highest QSSEQ. The
# match is on subject and parameter only (not visit); with no such
# observation AVAL, ADT, and QSSEQ stay missing.
intermediates:
  - id: DONOR
    dataset: OBS
    key: [USUBJID, PARAMCD]
    filter: >-
      OBS.ANL01FL = 'Y' AND OBS.AVAL IS NOT NULL
      AND OBS.AVISITN <= PLAN.AVISITN
    order_by: [OBS.AVISITN, OBS.QSSEQ]
    keep: last

output:
  path: advs.csv
  columns: [USUBJID, PARAMCD, AVISITN, AVAL, ADT, QSSEQ]

columns:
  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: PLAN.USUBJID

  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation: PLAN.PARAMCD

  - name: AVISITN
    type: int
    label: Analysis Visit Number
    derivation: PLAN.AVISITN

  # All three read the one chosen observation, so a missing ADT on it
  # stays missing rather than coming from an earlier observation.
  - name: AVAL
    type: float
    label: Analysis Value
    derivation: DONOR.AVAL

  - name: ADT
    type: date
    label: Analysis Date
    derivation: DONOR.ADT

  - name: QSSEQ
    type: int
    label: Source Sequence Number
    derivation: DONOR.QSSEQ

verifications:
  # One output row per planned visit: the driver table is not filtered.
  - row_count:
      min: 15
      max: 15
  # With no donor observation all three carried fields stay missing
  # together (the donor filter only matches observations with a result).
  - implies:
      id: no-donor-leaves-carried-fields-missing
      when: "AVAL IS NULL"
      then: "ADT IS NULL AND QSSEQ IS NULL"
