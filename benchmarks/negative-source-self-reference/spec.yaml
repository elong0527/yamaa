schema_version: "1.0"
domain: ADLB
keys: [STUDYID, USUBJID, ADT, PARAMCD]
input:
  LB: {path: input/lb.csv, types: {LBSTRESN: float}}
  ADLB: {path: input/adlb.csv, types: {AVAL: float, ADT: date}}

output:
  path: adlb.csv
  columns: [STUDYID, USUBJID, ADT, PARAMCD, PARAM, AVAL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: LB.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: LB.USUBJID

  - name: ADT
    type: date
    label: Analysis Date
    derivation: LB.LBDTC

  - name: PARAMCD
    type: str
    label: Parameter Code
    verifications:
      allowed_values:
        values: [ALT, AST, ASTALT]

  - name: PARAM
    type: str
    label: Parameter

  - name: LBRESN
    type: float
    label: Numeric Laboratory Result

  - name: ALTDEN
    type: float
    label: Alanine Aminotransferase Value as Denominator

  - name: ASTCODE
    type: str
    label: Aspartate Aminotransferase Parameter Code
    derivation: {literal: AST}

  # The AST value for the same subject and date, read from input ADLB --
  # a name this specification also gives the dataset it builds.
  - name: ASTVAL
    type: float
    label: Aspartate Aminotransferase Analysis Value
    derivation:
      lookup:
        dataset: ADLB
        key_base: [USUBJID, ADT, ASTCODE]
        key: [USUBJID, ADT, PARAMCD]
        value: AVAL

  - name: AVAL
    type: float
    label: Analysis Value
    derivation:
      case:
        - when: "PARAMCD = 'ASTALT'"
          then:
            compute:
              expr: "ASTVAL / NULLIF(ALTDEN, 0)"
        - otherwise: {source: LBRESN}

rows:
  - id: alt
    dataset: LB
    filter: "LB.LBTESTCD = 'ALT'"
    derivations:
      PARAMCD: {literal: ALT}
      PARAM: {literal: Alanine Aminotransferase}
      LBRESN: {source: LB.LBSTRESN}
      ALTDEN: {literal: null}

  - id: ast
    dataset: LB
    filter: "LB.LBTESTCD = 'AST'"
    derivations:
      PARAMCD: {literal: AST}
      PARAM: {literal: Aspartate Aminotransferase}
      LBRESN: {source: LB.LBSTRESN}
      ALTDEN: {literal: null}

  # One ratio record per ALT record, carrying the ALT result as the
  # denominator.
  - id: ast_alt_ratio
    dataset: LB
    filter: "LB.LBTESTCD = 'ALT'"
    derivations:
      PARAMCD: {literal: ASTALT}
      PARAM: {literal: Aspartate to Alanine Aminotransferase Ratio}
      LBRESN: {literal: null}
      ALTDEN: {source: LB.LBSTRESN}

verifications:
  - unique:
      columns: [STUDYID, USUBJID, ADT, PARAMCD]
  - row_count:
      min: 6
      max: 6
