yamaa: "1.0"
type: spec
model: ADaM
domain: ADLB
keys: [STUDYID, USUBJID, ADT, PARAMCD]
input:
  LB: {path: input/lb.csv, types: {LBSTRESN: float, LBDTC: date}}
  ADLB: {path: input/adlb.csv, types: {AVAL: float, ADT: date}}

output:
  path: adlb.csv
  columns: [STUDYID, USUBJID, ADT, PARAMCD, PARAM, AVAL]

intermediates:
  - id: ADLB_LOOKUP
    dataset: ADLB
    key: {USUBJID: USUBJID, ADT: ADT, PARAMCD: ASTCODE}
    require_match: true

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: LB.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: LB.USUBJID

  - name: ADT
    type: date
    label: Analysis Date
    derivation: LB.LBDTC

  - name: PARAMCD
    type: str
    label: Parameter Code
    verifications:
      - allowed_values:
          values: [ALT, AST, ASTALT]

  - name: PARAM
    type: str
    label: Parameter

  - name: LBRESN
    type: float
    label: Numeric Laboratory Result

  - name: ALTDEN
    type: float
    label: Alanine Aminotransferase Value as Denominator

  - name: ASTCODE
    type: str
    label: Aspartate Aminotransferase Parameter Code
    derivation: "'AST'"

  # The AST value for the same subject and date, read from input ADLB --
  # a name this specification also gives the dataset it builds.
  - name: ASTVAL
    type: float
    label: Aspartate Aminotransferase Analysis Value
    derivation: ADLB_LOOKUP.AVAL

  - name: AVAL
    type: float
    label: Analysis Value
    derivation:
      case:
        - when: "PARAMCD = 'ASTALT'"
          then: "ASTVAL / NULLIF(ALTDEN, 0)"
        - otherwise: LBRESN

rows:
  - id: alt
    dataset: LB
    filter: "LB.LBTESTCD = 'ALT'"
    derivations:
      PARAMCD: "'ALT'"
      PARAM: "'Alanine Aminotransferase'"
      LBRESN: LB.LBSTRESN
      ALTDEN: null

  - id: ast
    dataset: LB
    filter: "LB.LBTESTCD = 'AST'"
    derivations:
      PARAMCD: "'AST'"
      PARAM: "'Aspartate Aminotransferase'"
      LBRESN: LB.LBSTRESN
      ALTDEN: null

  # One ratio record per ALT record, carrying the ALT result as the
  # denominator.
  - id: ast_alt_ratio
    dataset: LB
    filter: "LB.LBTESTCD = 'ALT'"
    derivations:
      PARAMCD: "'ASTALT'"
      PARAM: "'Aspartate to Alanine Aminotransferase Ratio'"
      LBRESN: null
      ALTDEN: LB.LBSTRESN

verifications:
  - row_count:
      min: 6
      max: 6
