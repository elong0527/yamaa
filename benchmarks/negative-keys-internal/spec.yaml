schema_version: "1.0"
domain: ADSL
# SITEID is part of the record identity but not an output column, so a
# reader of the output could not check the identity: the specification is
# rejected before any data is read.
keys: [STUDYID, USUBJID, SITEID]
input:
  DM: input/dm.csv

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, INVID]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  - name: SITEID
    type: str
    label: Study Site Identifier
    derivation: DM.SITEID

  - name: INVID
    type: str
    label: Investigator Identifier
    derivation: DM.INVID
