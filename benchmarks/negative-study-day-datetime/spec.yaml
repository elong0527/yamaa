schema_version: "1.0"
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  DM: input/dm.csv

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, RFSTD, DTHDTM, DTHDY]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  - name: RFSTD
    type: date
    label: Reference Start Date
    derivation: DM.RFSTDT

  - name: DTHDTM
    type: datetime
    label: Moment of Death
    derivation: DM.DTHDTC

  # The defect: a study day counts calendar dates, and DTHDTM is a
  # datetime, so the spec is rejected before any data is read.
  - name: DTHDY
    type: int
    label: Study Day of Death
    derivation:
      study_day:
        date: DTHDTM
        reference: RFSTD
