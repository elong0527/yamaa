schema_version: "1.0"
domain: DS
keys: [STUDYID, USUBJID, DSSEQ]

input:
  ODM: input/odm.csv

output:
  path: ds.csv
  columns: [DOMAIN, STUDYID, USUBJID, DSSEQ, DSCAT, DSSCAT, DSTERM, DSDECOD, DSSTDTC]
  order_by: [USUBJID, DSSEQ]

columns:
  - name: DOMAIN
    type: str
    label: Domain Abbreviation
    derivation: {literal: DS}
    verifications:
      allowed_values:
        id: domain_allowed_values
        values: [DS]

  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: ODM.StudyOID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: ODM.SubjectKey

  - name: DSSEQ
    type: int
    label: Sequence Number
    derivation:
      mapping:
        source: ODM.StudyEventOID
        dict:
          EOT: 1
          EOS: 2
    verifications:
      - not_missing:
          id: dsseq_not_missing
      - allowed_values:
          id: dsseq_allowed_values
          values: [1, 2]

  - name: DSCAT
    type: str
    label: Category for Disposition Event
    derivation: {literal: DISPOSITION EVENT}
    verifications:
      allowed_values:
        id: dscat_allowed_values
        values: [DISPOSITION EVENT]

  - name: DSSCAT
    type: str
    label: Subcategory for Disposition Event
    derivation:
      mapping:
        source: ODM.StudyEventOID
        dict:
          EOT: STUDY TREATMENT
          EOS: STUDY
    verifications:
      - not_missing:
          id: dsscat_not_missing
      - allowed_values:
          id: dsscat_allowed_values
          values: [STUDY TREATMENT, STUDY]

  # The completion flag, which decides DSTERM and DSDECOD. Like the reason,
  # code and date below, it is read from this milestone's own item rows;
  # an item the milestone lacks reads as missing.
  - name: COMPSTAT
    type: str
    label: Completion Status as Collected
    derivation:
      source:
        filter: ODM.ItemOID = 'IT.DS.COMP'
        variable: ODM.Value
    verifications:
      - not_missing:
          id: compstat_not_missing
      - allowed_values:
          id: compstat_allowed_values
          values: [COMPLETED, DISCONTINUED]

  - name: DSTERM
    type: str
    label: Reported Term for the Disposition Event
    derivation:
      case:
        - when: "COMPSTAT = 'COMPLETED'"
          then: {literal: COMPLETED}
        - otherwise:
            source:
              filter: ODM.ItemOID = 'IT.DS.REASON'
              variable: ODM.Value
    verifications:
      - not_missing:
          id: dsterm_not_missing

  - name: DSDECOD
    type: str
    label: Standardized Disposition Term
    derivation:
      case:
        - when: "COMPSTAT = 'COMPLETED'"
          then: {literal: COMPLETED}
        - otherwise:
            source:
              filter: ODM.ItemOID = 'IT.DS.REASONCD'
              variable: ODM.Value
    verifications:
      - not_missing:
          id: dsdecod_not_missing
      - allowed_values:
          id: dsdecod_allowed_values
          values: [COMPLETED, ADVERSE EVENT, OTHER]

  - name: DSSTDTC
    type: date
    label: Start Date/Time of Disposition Event
    derivation:
      source:
        filter: ODM.ItemOID = 'IT.DS.DTC'
        variable: ODM.Value
    verifications:
      - not_missing:
          id: dsstdtc_not_missing

verifications:
  - unique:
      id: unique_studyid_usubjid_dsseq
      columns: [STUDYID, USUBJID, DSSEQ]
  - row_count:
      id: row_count
      min: 6
      max: 6
  - implies:
      id: treatment-milestone-is-numbered-first
      when: "DSSCAT = 'STUDY TREATMENT'"
      then: "DSSEQ = 1"
