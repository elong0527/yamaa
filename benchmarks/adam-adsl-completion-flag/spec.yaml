schema_version: "1.0"
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  ADSL_RAW: input/adsl_raw.csv
  DS: input/ds.csv
base: ADSL_RAW
# The subject's COMPLETED disposition record, if any. A subject with two
# COMPLETED records stops the run: nothing here chooses between them.
intermediates:
  - id: COMPLT
    dataset: DS
    filter: "DS.DSDECOD = 'COMPLETED'"

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, TRTSDT, COMPFL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: ADSL_RAW.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: ADSL_RAW.USUBJID

  - name: TRTSDT
    type: date
    label: Date of First Exposure to Treatment
    derivation: ADSL_RAW.TRTSDT

  - name: COMPREC
    type: str
    label: Completion Disposition Term
    derivation: COMPLT.DSDECOD

  # COMPREC is the matched record's outcome, always COMPLETED, so it is empty
  # only when the subject has no completion record; such a subject is N.
  - name: COMPFL
    type: str
    label: Completion Flag
    derivation:
      flag:
        condition: "COMPREC IS NOT NULL"
        false_value: "N"
    verifications:
      allowed_values:
        values: [Y, N]

verifications:
  - unique:
      columns: [STUDYID, USUBJID]
  - row_count:
      min: 4
      max: 4
  - implies:
      id: completer-received-treatment
      when: "COMPFL = 'Y'"
      then: "TRTSDT IS NOT NULL"
