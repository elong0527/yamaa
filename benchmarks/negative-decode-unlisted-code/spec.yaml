yamaa: "1.0"
type: spec
model: ADaM
domain: ADLB
keys: [STUDYID, USUBJID, PARAMCD]
input:
  LB: input/lb.csv

output:
  path: adlb.csv
  columns: [STUDYID, USUBJID, PARAMCD, PARAM]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: LB.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: LB.USUBJID

  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation: LB.LBTESTCD

  # The defect: GGT is a code the study's PARAMCD codelist does not list, and
  # no answer is declared for such a code, so the run stops at its record.
  - name: PARAM
    type: str
    label: Parameter
    derivation:
      decode:
        source: PARAMCD
        codelist: PARAMCD
