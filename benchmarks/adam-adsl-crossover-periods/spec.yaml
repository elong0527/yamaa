schema_version: "1.0"
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  DM: input/dm.csv
  EX: {path: input/ex.csv, types: {EXSEQ: int, APERIOD: int}}
base: DM

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, TR01SDT, TR01EDT, TR02SDT, TR02EDT, TRT01A, TRT02A, WASHDUR]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  # Each period's first start and last end date, read from that period's
  # exposure records only. MIN and MAX skip a missing date, so a subject
  # with no dated record in the period gets an empty date.
  - name: TR01SDT
    type: date
    label: Date of First Exposure in Period 01
    derivation:
      aggregate:
        filter: "EX.APERIOD = 1"
        expr: "MIN(EX.EXSTDTC)"

  - name: TR01EDT
    type: date
    label: Date of Last Exposure in Period 01
    derivation:
      aggregate:
        filter: "EX.APERIOD = 1"
        expr: "MAX(EX.EXENDTC)"

  - name: TR02SDT
    type: date
    label: Date of First Exposure in Period 02
    derivation:
      aggregate:
        filter: "EX.APERIOD = 2"
        expr: "MIN(EX.EXSTDTC)"

  - name: TR02EDT
    type: date
    label: Date of Last Exposure in Period 02
    derivation:
      aggregate:
        filter: "EX.APERIOD = 2"
        expr: "MAX(EX.EXENDTC)"

  # Each period's treatment is that of its first administration: earliest
  # start date, then lower EXSEQ; a record with no start date sorts last.
  - name: TRT01A
    type: str
    label: Actual Treatment for Period 01
    derivation:
      source:
        variable: EX.EXTRT
        filter: "EX.APERIOD = 1"
        multiple_matches:
          order_by: [EX.EXSTDTC, EX.EXSEQ]
          keep: first
    verifications:
      allowed_values:
        values: [VITAMIN D3, PLACEBO]

  - name: TRT02A
    type: str
    label: Actual Treatment for Period 02
    derivation:
      source:
        variable: EX.EXTRT
        filter: "EX.APERIOD = 2"
        multiple_matches:
          order_by: [EX.EXSTDTC, EX.EXSEQ]
          keep: first
    verifications:
      allowed_values:
        values: [VITAMIN D3, PLACEBO]

  # Days strictly between the end of period 1 and the start of period 2, so
  # back-to-back periods give 0; empty when either date is.
  - name: WASHDUR
    type: int
    label: Washout Duration (Days)
    derivation:
      date_diff:
        start: TR01EDT
        end: TR02SDT
        unit: day
        bounds: between
    verifications:
      range:
        min: 0

verifications:
  - unique:
      columns: [STUDYID, USUBJID]
  - row_count:
      min: 3
      max: 3
  - all_or_none:
      id: period-two-completeness
      columns: [TR02SDT, TR02EDT, TRT02A, WASHDUR]
  - implies:
      id: period-two-follows-period-one
      when: "TR02SDT IS NOT NULL"
      then: "TR02SDT > TR01EDT"
  - implies:
      id: crossover-changes-treatment
      when: "TRT02A IS NOT NULL"
      then: "TRT02A <> TRT01A"
