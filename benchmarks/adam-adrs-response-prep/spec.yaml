schema_version: "1.0"
domain: ADRS
keys: [STUDYID, USUBJID, ASEQ]
input:
  ADRS_RAW: input/adrs_raw.csv

output:
  path: adrs.csv
  columns: [STUDYID, USUBJID, ASEQ, ADT, RANDDY, AVALC, BORCAT, BORPRI, BORSEQ]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: ADRS_RAW.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: ADRS_RAW.USUBJID

  - name: ASEQ
    type: int
    label: Sequence Number
    derivation: ADRS_RAW.ASEQ

  - name: ADT
    type: date
    label: Analysis Date
    derivation: ADRS_RAW.ADT

  - name: RANDDY
    type: int
    label: Analysis Day Relative to Randomization
    derivation: ADRS_RAW.RANDDY

  - name: AVALC
    type: str
    label: Analysis Value (C)
    derivation: ADRS_RAW.AVALC

  # Stable disease and NON-CR/NON-PD count only from day 42 after
  # randomization; earlier, or with no day, they fall back to NE, as does
  # a collected NE. Any other value, or none, supports no category.
  - name: BORCAT
    type: str
    label: Best Overall Response Category
    derivation:
      case:
        - when: "AVALC = 'CR'"
          then: {literal: CR}
        - when: "AVALC = 'PR'"
          then: {literal: PR}
        - when: "AVALC = 'SD' AND RANDDY >= 42"
          then: {literal: SD}
        - when: "AVALC = 'NON-CR/NON-PD' AND RANDDY >= 42"
          then: {literal: NON-CR/NON-PD}
        - when: "AVALC = 'PD'"
          then: {literal: PD}
        - when: "AVALC IN ('SD', 'NON-CR/NON-PD', 'NE')"
          then: {literal: NE}
        - otherwise: {literal: null}
    verifications:
      allowed_values:
        values: [CR, PR, SD, NON-CR/NON-PD, PD, NE]

  - name: BORPRI
    type: int
    label: Best Overall Response Priority
    derivation:
      mapping:
        source: BORCAT
        dict:
          CR: 1
          PR: 2
          SD: 3
          NON-CR/NON-PD: 4
          PD: 5
          NE: 6
        missing: null
    verifications:
      range: {min: 1, max: 6}

  # Best first: category priority, then the earlier date, then the lower
  # sequence number. A record with no category gets no number.
  - name: BORSEQ
    type: int
    label: Best Overall Response Sequence
    derivation:
      row_number:
        window:
          group_by: [STUDYID, USUBJID]
          order_by: [BORPRI, ADT, ASEQ]
          filter: "BORPRI IS NOT NULL"

verifications:
  - unique:
      columns: [STUDYID, USUBJID, ASEQ]
  - row_count: {min: 15, max: 15}
