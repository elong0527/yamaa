schema_version: "1.0"
domain: LB
keys: [STUDYID, USUBJID, LBSEQ]
input:
  ODM:
    path: input/odm.csv
    types: {ItemGroupRepeatKey: int}

output:
  path: lb.csv
  columns: [DOMAIN, STUDYID, USUBJID, LBSEQ, VISIT, VISITNUM, LBTESTCD, LBTEST,
            LBCAT, LBSPEC, LBLOC, LBORRES, LBORRESU, LBSTRESC, LBSTRESN,
            LBSTRESU, LBSTAT, LBDTC]

columns:
  - name: DOMAIN
    type: str
    label: Domain Abbreviation
    derivation: {literal: LB}
    verifications:
      allowed_values:
        values: [LB]

  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: ODM.StudyOID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: ODM.SubjectKey

  - name: VISIT
    type: str
    label: Visit Name
    derivation:
      mapping:
        source: ODM.StudyEventOID
        dict:
          SE.NCT00789880.SCRN: SCREENING
          SE.NCT00789880.BL: BASELINE
          SE.NCT00789880.D21: DAY 21
          SE.NCT00789880.UNSCH: UNSCHEDULED
    verifications:
      allowed_values:
        values: [SCREENING, BASELINE, DAY 21, UNSCHEDULED]

  # The form occurrence number inside the study event. Unscheduled visits
  # have no planned number, so this feeds VISITNUM's per-occurrence
  # numbering below; it is not part of the delivered dataset.
  - name: FORMREPEAT
    type: int
    label: Form occurrence number within the visit
    derivation: ODM.ItemGroupRepeatKey

  # Planned visits keep their fixed numbers. Each unscheduled visit is
  # numbered after the baseline visit it follows, with the form occurrence
  # as the decimal part, so two unscheduled visits of one subject stay
  # distinct (2.01, 2.02) and join to the subject visits dataset.
  - name: VISITNUM
    type: float
    label: Visit Number
    derivation:
      case:
        - when: "ODM.StudyEventOID = 'SE.NCT00789880.SCRN'"
          then: {literal: 1}
        - when: "ODM.StudyEventOID = 'SE.NCT00789880.BL'"
          then: {literal: 2}
        - when: "ODM.StudyEventOID = 'SE.NCT00789880.D21'"
          then: {literal: 3}
        - when: "ODM.StudyEventOID = 'SE.NCT00789880.UNSCH'"
          then:
            compute:
              expr: "2 + FORMREPEAT / 100"
    verifications:
      allowed_values:
        values: [1, 2, 3, 2.01, 2.02]

  - name: LBTESTCD
    type: str
    label: Lab Test or Examination Short Name
    verifications:
      allowed_values:
        values: [VITD25OH, IL13, CAMPPRO]

  - name: LBTEST
    type: str
    label: Lab Test or Examination Name

  - name: LBCAT
    type: str
    label: Category for Lab Test

  - name: LBSPEC
    type: str
    label: Specimen Material Type
    verifications:
      allowed_values:
        values: [SERUM, SKIN BIOPSY, SALIVA, TAPE STRIP]

  - name: LBLOC
    type: str
    label: Location Used for Measurement
    verifications:
      allowed_values:
        values: [LESIONAL, NON-LESIONAL]

  # The collected entry, exactly as reported; the text 'NOT DONE' marks a
  # test that was not done. The result columns below read this raw value so
  # the sentinel never lands in the delivered result or units. It is not
  # part of the delivered dataset.
  - name: RAWORRES
    type: str
    label: Collected entry (raw)

  # A test not done has no result: LBORRES, LBSTRESC, LBORRESU and LBSTRESU
  # stay empty and LBSTAT carries 'NOT DONE'.
  - name: LBORRES
    type: str
    label: Result or Finding in Original Units
    derivation:
      case:
        - when: "RAWORRES = 'NOT DONE'"
          then: {literal: null}
        - otherwise: RAWORRES

  - name: LBORRESU
    type: str
    label: Original Units

  - name: LBSTRESC
    type: str
    label: Character Result/Finding in Std Format
    derivation: LBORRES

  - name: LBSTRESN
    type: float
    label: Numeric Result/Finding in Standard Units
    derivation:
      value: {source: LBORRES}
      missing: null
    verifications:
      range:
        min: 0

  - name: LBSTRESU
    type: str
    label: Standard Units

  - name: LBSTAT
    type: str
    label: Completion Status
    derivation:
      case:
        - when: "RAWORRES = 'NOT DONE'"
          then: {literal: NOT DONE}
    verifications:
      allowed_values:
        values: [NOT DONE]

  - name: LBDTC
    type: date
    label: Date/Time of Specimen Collection

  # Numbered within each subject by collection date, test code, then
  # specimen. The lesional and non-lesional results of one form tie on all
  # three and keep row template order, lesional first.
  - name: LBSEQ
    type: int
    label: Sequence Number
    derivation:
      row_number:
        window:
          group_by: [STUDYID, USUBJID]
          order_by: [LBDTC, LBTESTCD, LBSPEC]

# Each row template builds one record per subject, visit and form
# occurrence (item group and repeat key) whose result item for that test
# and site is present. The record takes the date item of the same
# occurrence; ONLY() fails if the occurrence carries either item twice.
# An entry of 'NOT DONE' still builds a record: the result and unit
# columns stay empty and LBSTAT carries 'NOT DONE'.
rows:
  - id: serum_vitamin_d
    group_by: [ODM.StudyOID, ODM.SubjectKey, ODM.StudyEventOID,
               ODM.ItemGroupOID, ODM.ItemGroupRepeatKey]
    filter: "RAWORRES IS NOT NULL"
    derivations:
      LBTESTCD: {literal: VITD25OH}
      LBTEST: {literal: 25-Hydroxyvitamin D}
      LBCAT: {literal: CHEMISTRY}
      LBSPEC: {literal: SERUM}
      LBLOC: {literal: null}
      RAWORRES:
        aggregate:
          filter: "ODM.ItemOID = 'IT.NCT00789880.LB.VITD'"
          expr: "ONLY(ODM.Value)"
      LBORRESU:
        case:
          - when: "RAWORRES = 'NOT DONE'"
            then: {literal: null}
          - otherwise: {literal: ng/mL}
      LBSTRESU:
        case:
          - when: "RAWORRES = 'NOT DONE'"
            then: {literal: null}
          - otherwise: {literal: ng/mL}
      LBDTC:
        aggregate:
          filter: "ODM.ItemOID = 'IT.NCT00789880.LB.LBDTC'"
          expr: "ONLY(ODM.Value)"

  - id: biopsy_il13_lesional
    group_by: [ODM.StudyOID, ODM.SubjectKey, ODM.StudyEventOID,
               ODM.ItemGroupOID, ODM.ItemGroupRepeatKey]
    filter: "RAWORRES IS NOT NULL"
    derivations:
      LBTESTCD: {literal: IL13}
      LBTEST: {literal: Interleukin 13 mRNA}
      LBCAT: {literal: GENE EXPRESSION}
      LBSPEC: {literal: SKIN BIOPSY}
      LBLOC: {literal: LESIONAL}
      RAWORRES:
        aggregate:
          filter: "ODM.ItemOID = 'IT.NCT00789880.BX.IL13_LES'"
          expr: "ONLY(ODM.Value)"
      LBORRESU:
        case:
          - when: "RAWORRES = 'NOT DONE'"
            then: {literal: null}
          - otherwise: {literal: CYCLE}
      LBSTRESU:
        case:
          - when: "RAWORRES = 'NOT DONE'"
            then: {literal: null}
          - otherwise: {literal: CYCLE}
      LBDTC:
        aggregate:
          filter: "ODM.ItemOID = 'IT.NCT00789880.BX.BXDTC'"
          expr: "ONLY(ODM.Value)"

  - id: biopsy_il13_nonlesional
    group_by: [ODM.StudyOID, ODM.SubjectKey, ODM.StudyEventOID,
               ODM.ItemGroupOID, ODM.ItemGroupRepeatKey]
    filter: "RAWORRES IS NOT NULL"
    derivations:
      LBTESTCD: {literal: IL13}
      LBTEST: {literal: Interleukin 13 mRNA}
      LBCAT: {literal: GENE EXPRESSION}
      LBSPEC: {literal: SKIN BIOPSY}
      LBLOC: {literal: NON-LESIONAL}
      RAWORRES:
        aggregate:
          filter: "ODM.ItemOID = 'IT.NCT00789880.BX.IL13_NONLES'"
          expr: "ONLY(ODM.Value)"
      LBORRESU:
        case:
          - when: "RAWORRES = 'NOT DONE'"
            then: {literal: null}
          - otherwise: {literal: CYCLE}
      LBSTRESU:
        case:
          - when: "RAWORRES = 'NOT DONE'"
            then: {literal: null}
          - otherwise: {literal: CYCLE}
      LBDTC:
        aggregate:
          filter: "ODM.ItemOID = 'IT.NCT00789880.BX.BXDTC'"
          expr: "ONLY(ODM.Value)"

  - id: saliva_cathelicidin
    group_by: [ODM.StudyOID, ODM.SubjectKey, ODM.StudyEventOID,
               ODM.ItemGroupOID, ODM.ItemGroupRepeatKey]
    filter: "RAWORRES IS NOT NULL"
    derivations:
      LBTESTCD: {literal: CAMPPRO}
      LBTEST: {literal: Cathelicidin Protein}
      LBCAT: {literal: ANTIMICROBIAL PEPTIDE}
      LBSPEC: {literal: SALIVA}
      LBLOC: {literal: null}
      RAWORRES:
        aggregate:
          filter: "ODM.ItemOID = 'IT.NCT00789880.SAL.SAL_CAMP'"
          expr: "ONLY(ODM.Value)"
      LBORRESU:
        case:
          - when: "RAWORRES = 'NOT DONE'"
            then: {literal: null}
          - otherwise: {literal: ng/mL}
      LBSTRESU:
        case:
          - when: "RAWORRES = 'NOT DONE'"
            then: {literal: null}
          - otherwise: {literal: ng/mL}
      LBDTC:
        aggregate:
          filter: "ODM.ItemOID = 'IT.NCT00789880.SAL.SALDTC'"
          expr: "ONLY(ODM.Value)"

  - id: tape_cathelicidin_lesional
    group_by: [ODM.StudyOID, ODM.SubjectKey, ODM.StudyEventOID,
               ODM.ItemGroupOID, ODM.ItemGroupRepeatKey]
    filter: "RAWORRES IS NOT NULL"
    derivations:
      LBTESTCD: {literal: CAMPPRO}
      LBTEST: {literal: Cathelicidin Protein}
      LBCAT: {literal: ANTIMICROBIAL PEPTIDE}
      LBSPEC: {literal: TAPE STRIP}
      LBLOC: {literal: LESIONAL}
      RAWORRES:
        aggregate:
          filter: "ODM.ItemOID = 'IT.NCT00789880.TS.TS_CAMP_LES'"
          expr: "ONLY(ODM.Value)"
      LBORRESU:
        case:
          - when: "RAWORRES = 'NOT DONE'"
            then: {literal: null}
          - otherwise: {literal: ng/mL}
      LBSTRESU:
        case:
          - when: "RAWORRES = 'NOT DONE'"
            then: {literal: null}
          - otherwise: {literal: ng/mL}
      LBDTC:
        aggregate:
          filter: "ODM.ItemOID = 'IT.NCT00789880.TS.TSDTC'"
          expr: "ONLY(ODM.Value)"

  - id: tape_cathelicidin_nonlesional
    group_by: [ODM.StudyOID, ODM.SubjectKey, ODM.StudyEventOID,
               ODM.ItemGroupOID, ODM.ItemGroupRepeatKey]
    filter: "RAWORRES IS NOT NULL"
    derivations:
      LBTESTCD: {literal: CAMPPRO}
      LBTEST: {literal: Cathelicidin Protein}
      LBCAT: {literal: ANTIMICROBIAL PEPTIDE}
      LBSPEC: {literal: TAPE STRIP}
      LBLOC: {literal: NON-LESIONAL}
      RAWORRES:
        aggregate:
          filter: "ODM.ItemOID = 'IT.NCT00789880.TS.TS_CAMP_NONLES'"
          expr: "ONLY(ODM.Value)"
      LBORRESU:
        case:
          - when: "RAWORRES = 'NOT DONE'"
            then: {literal: null}
          - otherwise: {literal: ng/mL}
      LBSTRESU:
        case:
          - when: "RAWORRES = 'NOT DONE'"
            then: {literal: null}
          - otherwise: {literal: ng/mL}
      LBDTC:
        aggregate:
          filter: "ODM.ItemOID = 'IT.NCT00789880.TS.TSDTC'"
          expr: "ONLY(ODM.Value)"

verifications:
  - unique:
      columns: [STUDYID, USUBJID, LBSEQ]
  - row_count:
      min: 18
      max: 18
  - implies:
      id: not-done-record-has-no-result
      when: "LBSTAT = 'NOT DONE'"
      then: "LBORRES IS NULL AND LBSTRESC IS NULL AND LBORRESU IS NULL AND LBSTRESN IS NULL AND LBSTRESU IS NULL"
  - implies:
      id: completed-record-is-not-flagged
      when: "LBSTAT IS NULL"
      then: "LBORRES IS NOT NULL"
