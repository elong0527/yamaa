schema_version: "1.0"
domain: DM
keys: [STUDYID, USUBJID]
input:
  DM_RAW: input/dm_raw.csv
  EX: {path: input/ex.csv, types: {EXSEQ: int}}
  DS: input/ds.csv
  AE: input/ae.csv
base: DM_RAW
intermediates:
  # Each subject's last exposure record with an end date: latest end date,
  # ties to the higher sequence number. The filter matters: a record with
  # no end date would otherwise sort last and be the one kept.
  - id: LASTEX
    dataset: EX
    filter: "EX.EXENDTC IS NOT NULL"
    order_by: [EX.EXENDTC, EX.EXSEQ]
    keep: last

output:
  path: dm.csv
  columns: [DOMAIN, STUDYID, USUBJID, RFICDTC, RFXSTDTC, RFXENDTC, RFSTDTC,
            RFENDTC]

columns:
  - name: DOMAIN
    type: str
    label: Domain Abbreviation
    derivation: {literal: DM}

  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM_RAW.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM_RAW.USUBJID

  - name: RFICDTC
    type: date
    label: Date/Time of Informed Consent
    derivation: DM_RAW.RFICDTC
    verifications:
      not_missing: {}

  # MIN and MAX skip missing dates; a subject with none gets no date.
  - name: RFXSTDTC
    type: date
    label: Date/Time of First Study Treatment
    derivation:
      aggregate:
        expr: "MIN(EX.EXSTDTC)"

  - name: RFXENDTC
    type: date
    label: Date/Time of Last Study Treatment
    derivation: LASTEX.EXENDTC

  - name: RFSTDTC
    type: date
    label: Subject Reference Start Date/Time
    derivation: RFXSTDTC

  # Not in the output: read only by the exposure completeness check.
  - name: EXDOSE0
    type: float
    label: Last Exposure Dose
    derivation: LASTEX.EXDOSE

  - name: DSDT0
    type: date
    label: Latest Disposition Date
    derivation:
      aggregate:
        filter: "DS.DSCAT = 'DISPOSITION EVENT'"
        expr: "MAX(DS.DSSTDTC)"

  - name: AEDT0
    type: date
    label: Latest Adverse Event End Date
    derivation:
      aggregate:
        expr: "MAX(AE.AEENDTC)"

  # The latest of the three dates; a missing one is skipped, and all three
  # missing gives no date.
  - name: RFENDTC
    type: date
    label: Subject Reference End Date/Time
    derivation:
      greatest:
        sources: [RFXENDTC, DSDT0, AEDT0]

verifications:
  - unique:
      columns: [STUDYID, USUBJID]
  - row_count:
      min: 5
      max: 5
  - all_or_none:
      id: exposure-reference-completeness
      columns: [RFXSTDTC, RFXENDTC, RFSTDTC, EXDOSE0]
  - implies:
      id: exposure-window-is-ordered
      when: "RFXSTDTC IS NOT NULL AND RFXENDTC IS NOT NULL"
      then: "RFXENDTC >= RFXSTDTC"
  - implies:
      id: consent-precedes-first-exposure
      when: "RFXSTDTC IS NOT NULL"
      then: "RFICDTC <= RFXSTDTC"
  - implies:
      id: participation-ends-no-earlier-than-last-exposure
      when: "RFXENDTC IS NOT NULL"
      then: "RFENDTC >= RFXENDTC"
