schema_version: "1.0"
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  DM: input/dm.csv

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, AGE, SEX]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  - name: AGE
    type: int
    label: Age
    derivation: DM.AGE

  - name: SEX
    type: str
    label: Sex
    derivation: DM.SEX

# One output row per DM record, so a subject entered twice reaches the
# output twice and fails the key check. Without rows the output would hold
# one row per subject, and the two ages would clash earlier instead.
rows:
  - id: record
    derivations: {}
