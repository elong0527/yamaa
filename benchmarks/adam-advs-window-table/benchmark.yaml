lifecycle: reviewed
standard: ADaM
domain: ADVS
review:
  concerns:
    - Visit windowing assigns unscheduled and off-schedule measurements to
      analysis visits using the study's own window table.
    - Two subjects cover measurements in every window, on the edges of Week 2
      and Week 4, a missing study day, and a window with no stated upper bound,
      and the table also holds another study's windows.
    - Edges are inclusive, so day 21 closes Week 2 and day 22 opens Week 4
      (subject 101), and a window whose last day was never stated is not
      open-ended, so a record past its first day gets no window.
