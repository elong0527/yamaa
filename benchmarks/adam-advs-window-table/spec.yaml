schema_version: "1.0"
domain: ADVS
keys: [STUDYID, USUBJID, PARAMCD, VSSEQ]
input:
  ADVS_RAW: input/advs_raw.csv
  AWINDOW:
    path: input/awindow.csv
    types: {AVISITN: int, AWLO: int, AWHI: int, AWTARGET: int}
base: ADVS_RAW

# The window whose first-to-last study day range, both ends inclusive,
# holds the record's study day, matched on STUDYID (the one output key the
# window table carries). A record with no study day, or a window with no
# last day, gives no match.
intermediates:
  - id: AWIN
    dataset: AWINDOW
    between:
      value: ADY
      lower: AWLO
      upper: AWHI

output:
  path: advs.csv
  columns: [STUDYID, USUBJID, PARAMCD, VSSEQ, VISIT, ADT, ADY, AVAL, AVISIT, AVISITN, AWTARGET, AWTDIFF, ANL01FL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: ADVS_RAW.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: ADVS_RAW.USUBJID

  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation: ADVS_RAW.PARAMCD

  - name: VSSEQ
    type: int
    label: Sequence Number
    derivation: ADVS_RAW.VSSEQ

  - name: VISIT
    type: str
    label: Visit Name
    derivation: ADVS_RAW.VISIT

  - name: ADT
    type: date
    label: Analysis Date
    derivation: ADVS_RAW.ADT

  - name: ADY
    type: int
    label: Analysis Relative Day
    derivation: ADVS_RAW.ADY

  - name: AVAL
    type: float
    label: Analysis Value
    derivation: ADVS_RAW.AVAL

  - name: AVISIT
    type: str
    label: Analysis Visit
    derivation: AWIN.AVISIT

  - name: AVISITN
    type: int
    label: Analysis Visit (N)
    derivation: AWIN.AVISITN

  - name: AWTARGET
    type: int
    label: Analysis Window Target
    derivation: AWIN.AWTARGET

  - name: AWTDIFF
    type: int
    label: Analysis Window Difference
    derivation:
      compute:
        expr: "ADY - AWTARGET"

  - name: AWTABS
    type: int
    label: Absolute Analysis Window Distance
    derivation:
      compute:
        expr: "ABS(AWTDIFF)"

  # Within each subject, parameter, and window: closest to the target day
  # first, then the lower sequence number. ANL01FL marks rank 1; a record
  # with no window is left out, so it is never flagged.
  - name: AWRANK
    type: int
    label: Analysis Window Rank
    derivation:
      row_number:
        window:
          group_by: [STUDYID, USUBJID, PARAMCD, AVISIT]
          order_by: [AWTABS, VSSEQ]
          filter: "AVISIT IS NOT NULL"

  - name: ANL01FL
    type: str
    label: Analysis Record Flag 01
    derivation:
      case:
        - when: "AWRANK = 1"
          then: {literal: Y}
    verifications:
      allowed_values:
        values: [Y]

verifications:
  - unique:
      columns: [STUDYID, USUBJID, PARAMCD, VSSEQ]
  - row_count:
      min: 14
      max: 14
  - all_or_none:
      id: an-assigned-window-carries-its-order-and-target
      columns: [AVISIT, AVISITN, AWTARGET]
  - implies:
      id: analysis-record-has-an-analysis-window
      when: "ANL01FL = 'Y'"
      then: "AVISIT IS NOT NULL AND ADY IS NOT NULL"
