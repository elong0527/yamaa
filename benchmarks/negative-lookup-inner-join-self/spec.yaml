yamaa: "1.0"
type: spec
domain: AECM
keys: [USUBJID, AESEQ, CMSEQ]
input:
  RELREC: input/relrec.csv

output:
  path: aecm.csv
  columns: [USUBJID, AESEQ, CMSEQ, RELID]

intermediates:
  # The adverse event members of each relationship, one record each.
  - id: AEMEM
    dataset: RELREC
    filter: "RELREC.RDOMAIN = 'AE' AND RELREC.IDVAR = 'AESEQ'"
    derivations:
      SEQ: {type: int, derivation: IDVARVAL}

  # Each adverse event member paired with the specification's completed
  # rows, which do not exist yet when the pairs are built, before any row.
  - id: PAIRS
    dataset: AEMEM
    inner_join: SELF
    key: [USUBJID, RELID]
    derivations:
      USUBJID: {type: str, derivation: AEMEM.USUBJID}
      RELID: {type: str, derivation: AEMEM.RELID}
      AESEQ: {type: int, derivation: AEMEM.SEQ}
      CMSEQ: {type: int, derivation: SELF.CMSEQ}

columns:
  - name: USUBJID
    type: str
    label: Unique Subject Identifier

  - name: AESEQ
    type: int
    label: Sequence Number of the Adverse Event

  - name: CMSEQ
    type: int
    label: Sequence Number of the Medication

  - name: RELID
    type: str
    label: Relationship Identifier

rows:
  - id: pairs
    dataset: PAIRS
    derivations:
      USUBJID: PAIRS.USUBJID
      AESEQ: PAIRS.AESEQ
      CMSEQ: PAIRS.CMSEQ
      RELID: PAIRS.RELID
