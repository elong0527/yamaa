schema_version: "1.0"
domain: ADVS
keys: [STUDYID, USUBJID, VSSEQ]
input:
  VS: input/vs.csv

output:
  path: advs.csv
  columns: [STUDYID, USUBJID, VSSEQ, ADT, AVAL, PREVAL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: VS.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: VS.USUBJID

  - name: VSSEQ
    type: int
    label: Sequence Number
    derivation: VS.VSSEQ

  - name: ADT
    type: date
    label: Analysis Date
    derivation: VS.VSDTC

  - name: AVAL
    type: float
    label: Analysis Value
    derivation: VS.VSSTRESN

  - name: PREVAL
    type: float
    label: Previous Analysis Value
    derivation:
      row_value:
        source: AVAL
        offset: 0
        window:
          group_by: [STUDYID, USUBJID]
          order_by: [ADT, VSSEQ]
