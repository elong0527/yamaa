schema_version: "1.0"
domain: ADQS
keys: [STUDYID, USUBJID, VISIT, PARAMCD]
input:
  QS: {path: input/qs.csv}

output:
  path: adqs.csv
  columns: [STUDYID, USUBJID, VISIT, PARAMCD, PARAM, AVAL]

columns:
  - name: STUDYID
    type: str
    derivation: QS.STUDYID

  - name: USUBJID
    type: str
    derivation: QS.USUBJID

  - name: VISIT
    type: str
    derivation: QS.VISIT

  - name: PARAMCD
    type: str

  - name: PARAM
    type: str

  - name: AVAL
    type: float
    derivation:
      aggregate:
        filter: "QS.QSCAT = 'PHYSICAL FUNCTIONING SCALE'"
        key: [STUDYID, USUBJID, VISIT]
        derive:
          - name: QSNUM
            type: float
            derivation: QS.QSORRES
        expr: "SUM(QSNUM)"

rows:
  - id: subscale
    filter: "QS.QSCAT = 'PHYSICAL FUNCTIONING SCALE' AND QS.QSTESTCD = 'PF01'"
    derivations:
      PARAMCD:
        literal: PFSCORE
      PARAM:
        literal: Physical Functioning Subscale Score
