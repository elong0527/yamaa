schema_version: "1.0"
domain: ADVS
keys: [STUDYID, USUBJID, ASEQ]
input:
  PLAN:
    path: input/plan.csv
    types: {ASEQ: int}
  VS:
    path: input/vs.csv
    types: {VSDTC: date}
  ADSL: input/adsl.csv

base: PLAN
intermediates:
  # The vital-signs record collected for a planned measurement: same subject,
  # test code as the parameter, and date as ADT. A planned measurement with
  # no such record leaves VSSEQ and AVALCOL missing.
  - id: COLLECTED
    dataset: VS
    key_base: [STUDYID, USUBJID, PARAMCD, ADT]
    key: [STUDYID, USUBJID, VSTESTCD, VSDTC]

output:
  path: advs.csv
  columns: [STUDYID, USUBJID, ASEQ, VSSEQ, PARAMCD, ADT, AVAL, TRTSDT, HEIGHTBL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: PLAN.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: PLAN.USUBJID

  - name: ASEQ
    type: int
    label: Analysis Sequence Number
    derivation: PLAN.ASEQ

  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation: PLAN.PARAMCD

  - name: ADT
    type: date
    label: Analysis Date
    derivation: PLAN.ADT

  - name: VSSEQ
    type: int
    label: Sequence Number
    derivation: COLLECTED.VSSEQ

  - name: AVALCOL
    type: float
    label: Collected Analysis Value
    derivation: COLLECTED.VSSTRESN

  # The closest earlier collected value for the same subject and parameter,
  # in date then planned order; the current row is never a candidate.
  - name: AVALPREV
    type: float
    label: Previous Non-Missing Analysis Value
    derivation:
      previous_non_missing:
        source: AVALCOL
        window:
          group_by: [STUDYID, USUBJID, PARAMCD]
          order_by: [ADT, ASEQ]

  # The collected value when there is one, otherwise the carried value.
  - name: AVAL
    type: float
    label: Analysis Value
    derivation:
      first_available:
        sources: [AVALCOL, AVALPREV]

  - name: TRTSDT
    type: date
    label: Date of First Exposure to Treatment
    derivation: ADSL.TRTSDT

  # Date of a collected height only, so weight rows and an uncollected height
  # can never be the baseline height.
  - name: HGTDT
    type: date
    label: Height Assessment Date
    derivation:
      case:
        - when: "PARAMCD = 'HEIGHT' AND AVALCOL IS NOT NULL"
          then: ADT

  # Y on the subject's latest collected height dated on or before TRTSDT.
  - name: HGTBLFL
    type: str
    label: Baseline Height Record Flag
    derivation:
      baseline_flag:
        window:
          group_by: [STUDYID, USUBJID]
        date: HGTDT
        reference_date: TRTSDT

  # The flagged height, repeated on every row of the subject; missing when
  # no height is flagged.
  - name: HEIGHTBL
    type: float
    label: Baseline Height
    derivation:
      aggregate:
        filter: "HGTBLFL = 'Y'"
        group_by: [STUDYID, USUBJID]
        expr: "ONLY(AVALCOL)"

verifications:
  - unique:
      columns: [STUDYID, USUBJID, ASEQ]
  - row_count:
      min: 12
      max: 12
  - all_or_none:
      id: collected-record-carries-sequence-and-value
      columns: [VSSEQ, AVALCOL]
  - implies:
      id: height-record-supplies-subject-height
      when: "PARAMCD = 'HEIGHT' AND HGTBLFL = 'Y'"
      then: "AVALCOL = HEIGHTBL"
  - implies:
      id: uncollected-filled-value-comes-from-predecessor
      when: "VSSEQ IS NULL AND AVAL IS NOT NULL"
      then: "AVAL = AVALPREV"
  - implies:
      id: no-predecessor-leaves-uncollected-value-missing
      when: "VSSEQ IS NULL AND AVALPREV IS NULL"
      then: "AVAL IS NULL"
