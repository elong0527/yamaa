yamaa: "1.0"
type: spec
model: ADaM
domain: ADQS
keys: [STUDYID, USUBJID, PARAMCD, VISITNUM]
input:
  QS:
    path: input/qs.csv
    types: {QSSTRESN: float, VISITNUM: int, QSDTC: date}
  ADSL: {path: input/adsl.csv, types: {TRTSDT: date}, key: [STUDYID, USUBJID]}
base: QS

output:
  path: adqs.csv
  columns: [STUDYID, USUBJID, PARAMCD, PARAM, VISITNUM, VISIT, ADT, TRTSDT,
            AVAL, ABLFL, SCBLFL, BASE, CHG]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: QS.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: QS.USUBJID

  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation: QS.QSTESTCD

  - name: PARAM
    type: str
    label: Parameter
    derivation: QS.QSTEST

  - name: VISITNUM
    type: int
    label: Visit Number
    derivation: QS.VISITNUM

  - name: VISIT
    type: str
    label: Visit Name
    derivation: QS.VISIT

  - name: ADT
    type: date
    label: Analysis Date
    derivation: QS.QSDTC

  - name: TRTSDT
    type: date
    label: Date of First Exposure to Treatment
    derivation: ADSL.TRTSDT

  # A questionnaire that was not done has no rating.
  - name: AVAL
    type: float
    label: Analysis Value
    derivation: QS.QSSTRESN

  # The protocol's baseline is the Cycle 1 Day 1 questionnaire, completed
  # before the first dose; screening stands in when that one has no rating or
  # was completed after the first dose. Only these two visits compete, and
  # screening always comes first, so the last rated one on or before the
  # treatment start date is the baseline.
  - name: ABLFL
    type: str
    label: Baseline Record Flag
    derivation:
      baseline_flag:
        date: ADT
        reference: TRTSDT
        source: AVAL
        window:
          group_by: [STUDYID, USUBJID, PARAMCD]
          filter: "VISIT IN ('SCREENING', 'CYCLE 1 DAY 1')"

  # Screening used as baseline: on the baseline record only.
  - name: SCBLFL
    type: str
    label: Screening Used as Baseline Flag
    derivation:
      flag: "ABLFL = 'Y' AND VISIT = 'SCREENING'"

  - name: BASE
    type: float
    label: Baseline Value
    derivation:
      aggregate:
        filter: "ABLFL = 'Y'"
        group_by: [STUDYID, USUBJID, PARAMCD]
        expr: "ONLY(AVAL)"

  # Change is reported after the first dose only, so the baseline record and
  # every other pre-dose record have none.
  - name: CHG
    type: float
    label: Change from Baseline
    derivation:
      case:
        - when: "ADT > TRTSDT"
          then: "AVAL - BASE"
        - otherwise: null

verifications:
  - row_count:
      id: at-most-one-baseline-per-subject-and-parameter
      group_by: [STUDYID, USUBJID, PARAMCD]
      filter: "ABLFL = 'Y'"
      max: 1
  - assert:
      id: baseline-is-a-rated-pre-dose-record
      when: "ABLFL = 'Y'"
      require: "AVAL IS NOT NULL AND ADT <= TRTSDT"
  - assert:
      id: screening-flag-marks-a-screening-baseline
      when: "SCBLFL = 'Y'"
      require: "ABLFL = 'Y' AND VISIT = 'SCREENING'"
