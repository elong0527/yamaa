yamaa: "1.0"
type: spec
model: ADaM
domain: ADAE
keys: [STUDYID, USUBJID, AESEQ]
input:
  AE: input/ae.csv

output:
  path: adae.csv
  columns: [STUDYID, USUBJID, AESEQ, AESPDIG]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: AE.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: AE.USUBJID

  - name: AESEQ
    type: int
    label: Sequence Number
    derivation: AE.AESEQ

  # The defect: '[' opens a character class that never closes, so the
  # pattern is not a valid regex and the spec is rejected before any data
  # is read.
  - name: AESPDIG
    type: str
    label: Digits of the Sponsor-Defined Identifier
    derivation:
      str_replace:
        source: AE.AESPID
        pattern: '[^0-9'
        replacement: ""
