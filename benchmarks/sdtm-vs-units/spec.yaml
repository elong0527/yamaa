schema_version: "1.0"
domain: VS
keys: [STUDYID, USUBJID, VSSEQ]
input:
  VS_RAW: {path: input/vs_raw.csv, types: {VSORRES: float}}

output:
  path: vs.csv
  columns: [DOMAIN, STUDYID, USUBJID, VSSEQ, VISIT, VSTESTCD, VSTEST, VSORRES, VSORRESU, VSSTRESN, VSSTRESC, VSSTRESU, VSSTAT]

columns:
  - name: DOMAIN
    type: str
    label: Domain Abbreviation
    derivation: {literal: VS}

  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: VS_RAW.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: VS_RAW.USUBJID

  - name: VSSEQ
    type: int
    label: Sequence Number
    derivation: VS_RAW.VSSEQ
    verifications:
      not_missing: {}

  - name: VISIT
    type: str
    label: Visit Name
    derivation: VS_RAW.VISIT

  - name: VSTESTCD
    type: str
    label: Vital Signs Test Short Name
    derivation: VS_RAW.VSTESTCD
    verifications:
      allowed_values:
        values: [HEIGHT, WEIGHT, TEMP]

  - name: VSTEST
    type: str
    label: Vital Signs Test Name
    derivation: VS_RAW.VSTEST

  - name: VSORRES
    type: str
    label: Result or Finding in Original Units
    derivation: VS_RAW.VSORRES

  - name: VSORRESU
    type: str
    label: Original Units
    # Blank when no result was collected; a unit without a result fails
    # conformance checks.
    derivation:
      case:
        - when: "VS_RAW.VSORRES IS NOT NULL"
          then: VS_RAW.VSORRESU
    verifications:
      allowed_values:
        values: [cm, kg, C, LB, F]

  - name: VSSTRESN
    type: float
    label: Numeric Result/Finding in Standard Units

  - name: VSSTRESC
    type: str
    label: Character Result/Finding in Std Format
    derivation: VSSTRESN

  - name: VSSTRESU
    type: str
    label: Standard Units
    verifications:
      allowed_values:
        values: [cm, kg, C]

  - name: VSSTAT
    type: str
    label: Completion Status
    # NOT DONE when no result was collected.
    derivation:
      case:
        - when: "VS_RAW.VSORRES IS NULL"
          then: {literal: 'NOT DONE'}

# One row template per test, so the output holds all HEIGHT records, then
# WEIGHT, then TEMP, each in input order. Each template sets its test's
# standard unit only when a result was collected; a missing result stays
# missing through the conversion.
rows:
  - id: height
    filter: "VS_RAW.VSTESTCD = 'HEIGHT'"
    derivations:
      # Centimeters pass through; any other height unit fails the unit
      # check below.
      VSSTRESN:
        case:
          - when: "VS_RAW.VSORRESU = 'cm'"
            then: VS_RAW.VSORRES
      VSSTRESU:
        case:
          - when: "VS_RAW.VSORRES IS NOT NULL AND VS_RAW.VSORRESU = 'cm'"
            then: {literal: cm}

  - id: weight
    filter: "VS_RAW.VSTESTCD = 'WEIGHT'"
    derivations:
      # Pounds become kilograms; kilograms pass through; any other weight
      # unit fails the unit check below.
      VSSTRESN:
        case:
          - when: "VS_RAW.VSORRESU = 'LB'"
            then:
              compute:
                expr: "VS_RAW.VSORRES * 0.45359237"
          - when: "VS_RAW.VSORRESU = 'kg'"
            then: VS_RAW.VSORRES
      VSSTRESU:
        case:
          - when: "VS_RAW.VSORRES IS NOT NULL AND (VS_RAW.VSORRESU = 'kg' OR VS_RAW.VSORRESU = 'LB')"
            then: {literal: kg}

  - id: temp
    filter: "VS_RAW.VSTESTCD = 'TEMP'"
    derivations:
      # Fahrenheit becomes Celsius; Celsius passes through; any other
      # temperature unit fails the unit check below.
      VSSTRESN:
        case:
          - when: "VS_RAW.VSORRESU = 'F'"
            then:
              compute:
                expr: "(VS_RAW.VSORRES - 32) * 5 / 9"
          - when: "VS_RAW.VSORRESU = 'C'"
            then: VS_RAW.VSORRES
      VSSTRESU:
        case:
          - when: "VS_RAW.VSORRES IS NOT NULL AND (VS_RAW.VSORRESU = 'C' OR VS_RAW.VSORRESU = 'F')"
            then: {literal: C}

verifications:
  - unique:
      columns: [STUDYID, USUBJID, VSSEQ]
  - row_count:
      min: 6
      max: 6
  - all_or_none:
      id: standardized-result-completeness
      columns: [VSSTRESN, VSSTRESC, VSSTRESU]
  - implies:
      id: unconverted-result-is-unchanged
      when: "VSORRESU = VSSTRESU"
      then: "VSSTRESC = VSORRES"
  - implies:
      id: unit-checked-against-test
      when: "VSORRES IS NOT NULL"
      then: "(VSTESTCD = 'HEIGHT' AND VSORRESU = 'cm') OR (VSTESTCD = 'WEIGHT' AND (VSORRESU = 'kg' OR VSORRESU = 'LB')) OR (VSTESTCD = 'TEMP' AND (VSORRESU = 'C' OR VSORRESU = 'F'))"
