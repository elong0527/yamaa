yamaa: "1.0"
type: spec
model: ADaM
domain: ADVS
keys: [STUDYID, USUBJID, VSSEQ]
input:
  VS: {path: input/vs.csv, types: {VSSEQ: int, VSSTRESN: float}}
  ADSL:
    path: input/adsl.csv
    types: {AP01SDT: date, AP01SDTM: datetime, AP01EDT: date,
            AP01EDTM: datetime, AP02SDT: date, AP02SDTM: datetime,
            AP02EDT: date, AP02EDTM: datetime}
    key: [STUDYID, USUBJID]
base: VS

output:
  path: advs.csv
  columns: [STUDYID, USUBJID, VSSEQ, PARAMCD, AVAL, ADT, ADTM, APERIOD, TRTA]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: VS.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: VS.USUBJID

  - name: VSSEQ
    type: int
    label: Sequence Number
    derivation: VS.VSSEQ

  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation: VS.VSTESTCD

  - name: AVAL
    type: float
    label: Analysis Value
    derivation: VS.VSSTRESN

  # The collection date, whether or not a time was collected.
  - name: ADT
    type: date
    label: Analysis Date
    derivation:
      to_date:
        source: VS.VSDTC

  # The collection moment, only when a time was collected: no time is
  # supplied for a date-only collection.
  - name: ADTM
    type: datetime
    label: Analysis Datetime
    derivation:
      case:
        - when: "str_contains(VS.VSDTC, 'T')"
          then: VS.VSDTC

  # A record is in a period when it lies within the period's start and
  # end, both included. Each limit is compared by time when both the
  # record and that limit have one, and by date otherwise. Records between
  # periods, before the first and after the last are in no period. A
  # comparison with a missing date is unknown, so a record with no date,
  # or a period with no start or end, gives no period. Testing the later
  # period first places a date-only record on a day that ends one period
  # and starts the next in the later one.
  - name: APERIOD
    type: int
    label: Period
    derivation:
      case:
        - when: >-
            ((ADTM IS NOT NULL AND ADSL.AP02SDTM IS NOT NULL
              AND ADTM >= ADSL.AP02SDTM)
             OR ((ADTM IS NULL OR ADSL.AP02SDTM IS NULL)
              AND ADT >= ADSL.AP02SDT))
            AND ((ADTM IS NOT NULL AND ADSL.AP02EDTM IS NOT NULL
              AND ADTM <= ADSL.AP02EDTM)
             OR ((ADTM IS NULL OR ADSL.AP02EDTM IS NULL)
              AND ADT <= ADSL.AP02EDT))
          then: 2
        - when: >-
            ((ADTM IS NOT NULL AND ADSL.AP01SDTM IS NOT NULL
              AND ADTM >= ADSL.AP01SDTM)
             OR ((ADTM IS NULL OR ADSL.AP01SDTM IS NULL)
              AND ADT >= ADSL.AP01SDT))
            AND ((ADTM IS NOT NULL AND ADSL.AP01EDTM IS NOT NULL
              AND ADTM <= ADSL.AP01EDTM)
             OR ((ADTM IS NULL OR ADSL.AP01EDTM IS NULL)
              AND ADT <= ADSL.AP01EDT))
          then: 1
    verifications:
      - allowed_values:
          values: [1, 2]

  # The actual treatment of the record's period.
  - name: TRTA
    type: str
    label: Actual Treatment
    derivation:
      case:
        - when: "APERIOD = 1"
          then: ADSL.TRT01A
        - when: "APERIOD = 2"
          then: ADSL.TRT02A
    verifications:
      - allowed_values:
          values: [DRUG A, PLACEBO]

verifications:
  - row_count:
      min: 12
      max: 12
  - all_or_none:
      id: period-and-treatment-together
      columns: [APERIOD, TRTA]
  - assert:
      id: no-period-without-a-date
      when: "ADT IS NULL"
      require: "APERIOD IS NULL"
  - assert:
      id: a-moment-has-its-date
      when: "ADTM IS NOT NULL"
      require: "ADT IS NOT NULL"
