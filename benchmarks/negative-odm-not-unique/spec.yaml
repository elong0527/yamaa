schema_version: "1.0"
domain: DM
keys: [STUDYID, USUBJID]
input:
  ODM: input/odm.csv

output:
  path: dm.csv
  columns: [STUDYID, USUBJID, SEX]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: ODM.StudyOID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: ODM.SubjectKey

  - name: SEX
    type: str
    label: Sex
    derivation: {odm: ODM.IT.DM.SEX}
