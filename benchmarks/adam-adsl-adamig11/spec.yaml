yamaa: "1.0"
type: spec
model: ADaM
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  ADSL_RAW: input/adsl_raw.csv

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, TRT01A, AGE, HEIGHTBL, TRTSDT, TRTSDTM,
            TRTSTMF]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: ADSL_RAW.STUDYID
    submission:
      core: Req
      mandatory: true
      length: 20
      origins:
        - type: Predecessor
          description: ADSL_RAW.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: ADSL_RAW.USUBJID
    submission:
      core: Req
      mandatory: true
      length: 30
      origins:
        - type: Predecessor
          description: ADSL_RAW.USUBJID

  - name: TRT01A
    type: str
    label: Actual Treatment for Period 01
    derivation: ADSL_RAW.TRT01A
    submission:
      core: Cond
      mandatory: true
      length: 20
      origins:
        - type: Predecessor
          description: ADSL_RAW.TRT01A

  - name: AGE
    type: int
    label: Age
    derivation: ADSL_RAW.AGE
    submission:
      core: Req
      mandatory: true
      length: 3
      display_format: "3."
      origins:
        - type: Predecessor
          description: ADSL_RAW.AGE

  - name: HEIGHTBL
    type: float
    label: Baseline Height (cm)
    derivation: ADSL_RAW.HEIGHTBL
    submission:
      core: Perm
      mandatory: false
      length: 5
      significant_digits: 1
      display_format: "5.1"
      origins:
        - type: Predecessor
          description: ADSL_RAW.HEIGHTBL

  # Seconds are collected for some subjects, so a time collected to the
  # minute takes 00 seconds, and the flag below says so.
  - name: TRTSDTM
    type: datetime
    label: Datetime of First Exposure to Treatment
    derivation:
      impute:
        type: datetime
        source: ADSL_RAW.TRTSDTC
        time: first
    submission:
      core: Perm
      mandatory: false
      origins:
        - type: Derived
      method: TRTSDTC, with seconds 00 when the time was collected to the
        minute.

  - name: TRTSTMF
    type: str
    label: Time of First Exposure Imput. Flag
    derivation:
      imputation_flag:
        source: TRTSDTM
        part: time
    verifications:
      - allowed_values:
          values: [H, M, S]
    submission:
      core: Cond
      mandatory: false
      length: 1
      origins:
        - type: Derived
      method: S when the time of first exposure was collected to the minute,
        so its seconds are imputed as 00.

  - name: TRTSDT
    type: date
    label: Date of First Exposure to Treatment
    derivation:
      to_date:
        source: TRTSDTM
    submission:
      core: Cond
      mandatory: false
      origins:
        - type: Derived
      method: Date part of TRTSDTM.

submission:
  label: Subject-Level Analysis Dataset
  class: SUBJECT LEVEL ANALYSIS DATASET
  structure: One record per subject
  repeating: false
