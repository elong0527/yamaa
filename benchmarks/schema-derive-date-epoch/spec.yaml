schema_version: "1.0"
domain: ADEX
keys: [STUDYID, USUBJID, EXSEQ]
input:
  EX: {path: input/ex.csv, types: {EXSEQ: int, EXSTDT: date}}

output:
  path: adex.csv
  columns: [STUDYID, USUBJID, EXSEQ, EXSTDY]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: EX.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: EX.USUBJID

  - name: EXSEQ
    type: int
    label: Sequence Number
    derivation: EX.EXSEQ

  # Reads the EX records with this row's STUDYID, USUBJID and EXSEQ. The
  # derive step turns each record's start date into days since 1970-01-01
  # before reduction; ONLY takes that one value and fails on a second match.
  # The value is an epoch day, not a study day.
  - name: EXSTDY
    type: int
    label: Epoch Day of Exposure Start
    derivation:
      aggregate:
        key: [STUDYID, USUBJID, EXSEQ]
        derive:
          - name: EPOCHDAY
            type: int
            derivation:
              to_epoch_day:
                source: EX.EXSTDT
        expr: "ONLY(EPOCHDAY)"

rows:
  # One output row per EX record with sequence number 1; every column above
  # is derived for it, so the row template sets nothing itself.
  - id: exposure
    filter: "EX.EXSEQ = 1"
    derivations: {}
