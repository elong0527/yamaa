yamaa: "1.0"
type: spec
model: ADaM
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  DM: input/dm.csv

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, AGE, AGEU, AGEGR1, AGEGR1N]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  - name: AGE
    type: int
    label: Age
    derivation: DM.AGE

  - name: AGEU
    type: str
    label: Age Units
    derivation: DM.AGEU

  - name: AGEGR1
    type: str
    label: Pooled Age Group 1
    derivation:
      case:
        - when: "AGE < 18"
          then: "'<18'"
        - when: "AGE >= 18 AND AGE <= 64"
          then: "'18-64'"
        - when: "AGE > 64"
          then: "'>64'"
        - otherwise: "'Missing'"

  - name: AGEGR1N
    type: int
    label: Pooled Age Group 1 (N)
    derivation:
      case:
        - when: "AGEGR1 = '<18'"
          then: 1
        - when: "AGEGR1 = '18-64'"
          then: 2
        - when: "AGEGR1 = '>64'"
          then: 3
        - otherwise: null

verifications:
  - row_count:
      min: 10
      max: 10
