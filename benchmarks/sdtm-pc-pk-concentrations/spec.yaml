yamaa: "1.0"
type: spec
model: SDTM
domain: PC
keys: [STUDYID, USUBJID, PCSEQ]
input:
  LAB:
    path: input/lab_transfer.csv
    types: {Collected: datetime}

output:
  path: pc.csv
  columns: [DOMAIN, STUDYID, USUBJID, PCSEQ, PCREFID, PCTESTCD, PCTEST,
            PCORRES, PCORRESU, PCSTRESC, PCSTRESN, PCSTRESU, PCSPEC, PCDTC,
            PCTPT, PCTPTNUM]
  order_by: [STUDYID, USUBJID, PCSEQ]

columns:
  - name: DOMAIN
    type: str
    label: Domain Abbreviation
    derivation: "'PC'"

  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: LAB.Protocol

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: LAB.Subject

  - name: PCREFID
    type: str
    label: Reference ID
    derivation: LAB.Sample

  - name: PCTESTCD
    type: str
    label: PK Concentration Test Short Name
    derivation:
      mapping:
        source: LAB.Analyte
        dict: {ZX-201: ZX201}

  - name: PCTEST
    type: str
    label: PK Concentration Test Name
    derivation: LAB.Analyte

  - name: PCORRES
    type: str
    label: Result or Finding in Original Units
    derivation: LAB.Result

  - name: PCORRESU
    type: str
    label: Original Units
    derivation: LAB.Unit

  - name: PCSTRESC
    type: str
    label: Character Result/Finding in Std Format
    derivation: PCORRES

  - name: PCSTRESN
    type: float
    label: Numeric Result/Finding in Standard Units
    derivation:
      case:
        - when: "PCORRES = 'BLQ'"
          then: null
        - otherwise: PCORRES

  - name: PCSTRESU
    type: str
    label: Standard Units
    derivation: PCORRESU

  - name: PCSPEC
    type: str
    label: Specimen Material Type
    derivation: "'PLASMA'"

  - name: PCDTC
    type: datetime
    label: Date/Time of Specimen Collection
    derivation: LAB.Collected

  - name: PCTPT
    type: str
    label: Planned Time Point Name
    derivation: LAB.Nominal

  - name: PCTPTNUM
    type: float
    label: Planned Time Point Number
    derivation:
      case:
        - when: "PCTPT = 'PRE'"
          then: 0
        - when: "PCTPT = 'UNSCHED'"
          then: null
        - otherwise:
            str_extract:
              source: PCTPT
              pattern: '^([0-9]+(?:\.[0-9]+)?)H$'
              group: 1

  - name: PCSEQ
    type: int
    label: Sequence Number
    derivation:
      row_number:
        window:
          group_by: [LAB.Protocol, LAB.Subject]
          order_by: [LAB.Collected, LAB.Sample]

verifications:
  - unique: [STUDYID, USUBJID, PCREFID]
  - assert:
      id: scheduled-samples-have-planned-hours
      when: "PCTPT <> 'UNSCHED'"
      require: "PCTPTNUM IS NOT NULL"
