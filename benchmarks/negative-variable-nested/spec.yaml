schema_version: "1.0"
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  DM: input/dm.csv

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, COUNTRY]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  - name: COUNTRY
    type: str
    label: Country
    # str_upper reads one named variable; a nested first_available in its
    # place is rejected before any data is read.
    derivation:
      str_upper:
        source:
          first_available:
            sources: [DM.COUNTRY, DM.SITECNTY]
