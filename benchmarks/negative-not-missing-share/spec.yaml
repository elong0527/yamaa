yamaa: "1.0"
type: spec
model: ADaM
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  DM: input/dm.csv

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, WEIGHTBL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  # At most a quarter of the subjects may lack a baseline weight. Two of the
  # four do, so the check fails.
  - name: WEIGHTBL
    type: float
    label: Weight (kg) at Baseline
    derivation: DM.WEIGHT
    verifications:
      - not_missing: {max_fraction: 0.25}
