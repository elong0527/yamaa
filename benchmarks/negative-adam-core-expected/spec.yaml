yamaa: "1.0"
type: spec
model: ADaM
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  DM: {path: input/dm.csv, types: {AGE: int}}

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, AGE]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID
    submission:
      core: Req
      mandatory: true
      length: 8
      origins:
        - type: Predecessor
          description: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID
    submission:
      core: Req
      mandatory: true
      length: 12
      origins:
        - type: Predecessor
          description: DM.USUBJID

  # Expected (Exp) is a designation the tabulation model publishes; the
  # analysis model has none.
  - name: AGE
    type: int
    label: Age
    derivation: DM.AGE
    submission:
      core: Exp
      mandatory: false
      length: 3
      origins:
        - type: Predecessor
          description: DM.AGE

submission:
  label: Subject-Level Analysis Dataset
  class: SUBJECT LEVEL ANALYSIS DATASET
  structure: One record per subject
  repeating: false
