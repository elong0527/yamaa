schema_version: "1.0"
domain: ADTTE
keys: [STUDYID, USUBJID, PARAMCD]
input:
  ADSL: input/adsl.csv
  RS: {path: input/rs.csv, types: {RSSEQ: int}}
  DS: {path: input/ds.csv, types: {DSSEQ: int}}
base: ADSL
intermediates:
  # Per subject: the first adequate progression (PD), the first death, and
  # the last adequate assessment, which sets the censoring date. Records
  # sharing a date are ordered by sequence number.
  - id: PROGRESSION
    dataset: RS
    filter: "RS.RSTESTCD = 'OVRLRESP' AND RS.RSSTRESC = 'PD' AND RS.ADEQFL = 'Y'"
    order_by: [RS.RSDTC, RS.RSSEQ]
    keep: first
  - id: DEATH
    dataset: DS
    filter: "DS.DSDECOD = 'DEATH'"
    order_by: [DS.DSDTC, DS.DSSEQ]
    keep: first
  - id: LASTASSESS
    dataset: RS
    filter: "RS.RSTESTCD = 'OVRLRESP' AND RS.ADEQFL = 'Y'"
    order_by: [RS.RSDTC, RS.RSSEQ]
    keep: last

output:
  path: adtte.csv
  columns: [STUDYID, USUBJID, PARAMCD, PARAM, STARTDT, ADT, AVAL, CNSR, EVNTDESC, SRCDOM, SRCVAR, SRCSEQ]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: ADSL.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: ADSL.USUBJID

  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation: {literal: PFS}

  - name: PARAM
    type: str
    label: Parameter
    derivation: {literal: Progression-Free Survival}

  - name: STARTDT
    type: date
    label: Time-to-Event Origin Date
    derivation: ADSL.RANDDT

  # The chosen records' dates as dates: RS and DS hold them as text.
  - name: PDDT
    type: date
    label: Disease Progression Date
    derivation: PROGRESSION.RSDTC

  - name: DEATHDT
    type: date
    label: Death Date
    derivation: DEATH.DSDTC

  - name: CENSORDT
    type: date
    label: Censoring Date
    derivation: LASTASSESS.RSDTC

  - name: EVENTDT
    type: date
    label: Event Date
    derivation:
      least:
        sources: [PDDT, DEATHDT]

  # An event (progression or death) always wins over censoring, even when
  # it comes after the last adequate assessment.
  - name: CNSR
    type: int
    label: Censor
    derivation:
      case:
        - when: "EVENTDT IS NOT NULL"
          then: {literal: 0}
        - otherwise: {literal: 1}

  # The event date for an event (CNSR 0), else the censoring date.
  - name: ADT
    type: date
    label: Analysis Date
    derivation:
      first_available:
        sources: [EVENTDT, CENSORDT]

  - name: AVAL
    type: int
    label: Analysis Value
    derivation:
      date_diff:
        start: STARTDT
        end: ADT
        unit: day
        bounds: inclusive

  # A progression and a death on the same day count as progression.
  - name: EVNTDESC
    type: str
    label: Event or Censoring Description
    derivation:
      case:
        - when: "EVENTDT IS NULL"
          then: {literal: CENSORED}
        - when: "PDDT IS NOT NULL AND (DEATHDT IS NULL OR PDDT <= DEATHDT)"
          then: {literal: DISEASE PROGRESSION}
        - otherwise: {literal: DEATH}

  - name: SRCDOM
    type: str
    label: Source Data
    derivation:
      case:
        - when: "EVNTDESC = 'DEATH'"
          then: {literal: DS}
        - otherwise: {literal: RS}

  - name: SRCVAR
    type: str
    label: Source Variable
    derivation:
      case:
        - when: "EVNTDESC = 'DEATH'"
          then: {literal: DSDTC}
        - otherwise: {literal: RSDTC}

  - name: SRCSEQ
    type: int
    label: Source Sequence Number
    derivation:
      case:
        - when: "EVNTDESC = 'DISEASE PROGRESSION'"
          then: PROGRESSION.RSSEQ
        - when: "EVNTDESC = 'DEATH'"
          then: DEATH.DSSEQ
        - otherwise: LASTASSESS.RSSEQ

verifications:
  - row_count:
      min: 5
      max: 5
  - all_or_none:
      id: traceability-triplet-is-complete
      columns: [SRCDOM, SRCVAR, SRCSEQ]
  - assert:
      id: endpoint-is-not-before-randomization
      expr: "ADT >= STARTDT"
