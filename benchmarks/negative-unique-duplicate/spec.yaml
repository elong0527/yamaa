schema_version: "1.0"
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  DM: input/dm.csv

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, SITEID]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  - name: SITEID
    type: str
    label: Site Identifier
    derivation: DM.SITEID

# Each SITEID must appear on one row only. A site that enrolled more than
# one subject repeats its SITEID, so this fails on the completed dataset.
verifications:
  - unique:
      columns: [SITEID]
