yamaa: "1.0"
type: spec
model: ADaM
domain: ADVS
keys: [STUDYID, USUBJID, AVISIT, PARAMCD]
input:
  VS:
    path: input/vs.csv
    types: {VSSTRESN: float}
  ADSL:
    path: input/adsl.csv
    types: {HEIGHTBL: float}
    key: [STUDYID, USUBJID]

output:
  path: advs.csv
  columns: [STUDYID, USUBJID, AVISIT, PARAMCD, PARAM, AVAL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: VS.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: VS.USUBJID

  - name: AVISIT
    type: str
    label: Analysis Visit Name
    derivation: VS.VISIT

  - name: PARAMCD
    type: str
    label: Parameter Code

  - name: PARAM
    type: str
    label: Parameter

  - name: HEIGHTBL
    type: float
    label: Baseline Height (cm)

  # The column default: every row template inherits this unless it names
  # AVAL itself (SPEC-6).
  - name: AVAL
    type: float
    label: Analysis Value
    derivation: VS.VSSTRESN

rows:
  # This template does not name AVAL, so its rows inherit the column
  # default: the standardized result passes through unchanged, including
  # the weight records.
  - id: collected
    dataset: VS
    derivations:
      PARAMCD: VS.VSTESTCD
      PARAM: VS.VSTEST
      HEIGHTBL: null

  # This template names AVAL, overriding the default for its rows only
  # (SPEC-6). The override reads HEIGHTBL in this template's scope
  # (SPEC-6): each weight record divides by its own subject's baseline
  # height, and a missing height leaves the index blank.
  - id: derived_bmi
    dataset: VS
    filter: "VS.VSTESTCD = 'WEIGHT'"
    derivations:
      PARAMCD: "'BMI'"
      PARAM: "'Body Mass Index (kg/m^2)'"
      HEIGHTBL: ADSL.HEIGHTBL
      AVAL: "VS.VSSTRESN / NULLIF(HEIGHTBL * HEIGHTBL / 10000, 0)"

verifications:
  - row_count:
      min: 11
      max: 11
  - assert:
      id: bmi-blank-without-usable-height
      when: "PARAMCD = 'BMI' AND (HEIGHTBL IS NULL OR HEIGHTBL = 0)"
      require: "AVAL IS NULL"
