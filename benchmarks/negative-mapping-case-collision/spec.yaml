schema_version: "1.0"
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  DM: input/dm.csv

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, SMOKEFL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  # Case is ignored, so the keys Y and y both fold to Y: the dictionary
  # has two entries for one key.
  - name: SMOKEFL
    type: str
    label: Smoker Flag
    derivation:
      mapping:
        source: DM.SMOKSTAT
        case_sensitive: false
        dict:
          Y: "Y"
          y: "Y"
          N: "N"
