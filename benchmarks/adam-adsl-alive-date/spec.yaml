yamaa: "1.0"
type: spec
model: ADaM
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  ADSL_RAW:
    path: input/adsl.csv
    types:
      TRTEDT: date
  ADAE:
    path: input/adae.csv
    types:
      AENDT: date
    key: [STUDYID, USUBJID]
  ADVS:
    path: input/advs.csv
    types:
      ADATE: date
    key: [STUDYID, USUBJID]
base: ADSL_RAW

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, TRTEDT, LSTCNTDC, LSTCNTDT, LSTALVDT]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: ADSL_RAW.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: ADSL_RAW.USUBJID

  - name: TRTEDT
    type: date
    label: Date of Last Exposure to Treatment
    derivation: ADSL_RAW.TRTEDT

  - name: LSTCNTDC
    type: str
    label: Date of Last Contact
    derivation: ADSL_RAW.LSTCNTDC

  # A year and month take the month's first day, a year alone 1 January;
  # blank or non-date text leaves the date empty.
  - name: LSTCNTDT
    type: date
    label: Analysis Date of Last Contact
    derivation:
      impute:
        type: date
        source: LSTCNTDC
        month: 1
        day: first
        invalid: null

  # The subject's latest adverse event end and vital signs date, matched on
  # STUDYID and USUBJID; empty with no records or only missing dates.
  - name: ADAE_LST
    type: date
    label: Latest Adverse Event Date
    derivation:
      aggregate: "MAX(ADAE.AENDT)"

  - name: ADVS_LST
    type: date
    label: Latest Vital Signs Date
    derivation:
      aggregate: "MAX(ADVS.ADATE)"

  # The latest of the four, passing over missing ones; empty only when all
  # four are missing.
  - name: LSTALVDT
    type: date
    label: Date Last Known Alive
    derivation:
      greatest:
        sources: [TRTEDT, LSTCNTDT, ADAE_LST, ADVS_LST]
