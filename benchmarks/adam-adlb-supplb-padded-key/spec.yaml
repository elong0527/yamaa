schema_version: "1.0"
domain: ADLB
keys: [STUDYID, USUBJID, LBSEQ]
input:
  LB: {path: input/lb.csv, types: {LBSEQ: int}}
  SUPPLB: input/supplb.csv

output:
  path: adlb.csv
  columns: [STUDYID, USUBJID, LBSEQ, QVAL, QVAL_NAMED]

intermediates:
  - id: SUP_EP
    dataset: SUPPLB
    key:
      STUDYID: LB.STUDYID
      USUBJID: LB.USUBJID
      IDVARVAL: {str_pad: {source: LBSEQ, width: 8}}
    no_match: {literal: null}

columns:
  - {name: STUDYID, type: str, label: Study Identifier, derivation: LB.STUDYID}

  - name: USUBJID
    type: str
    label: Subject Identifier
    derivation: LB.USUBJID

  - {name: LBSEQ, type: int, label: Sequence Number, derivation: LB.LBSEQ}
  - {name: QVAL, type: str, label: Supplemental Value}

  - name: QVAL_NAMED
    type: str
    label: Supplemental Value by Named Intermediate
    derivation: SUP_EP.QVAL

rows:
  # yamaa-lint: allow repeated_row_derivation -- the row phase reads are tested
  # QVAL reads the lookup in each template, against QVAL_NAMED, which reads
  # it in the column phase.
  - id: low_sequence
    dataset: LB
    filter: "LB.LBSEQ < 200"
    derivations: {QVAL: SUP_EP.QVAL}

  - id: high_sequence
    dataset: LB
    filter: "LB.LBSEQ >= 200"
    derivations: {QVAL: SUP_EP.QVAL}

verifications:
  - row_count:
      min: 6
      max: 6
