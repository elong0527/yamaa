schema_version: "1.0"
domain: ADEX
keys: [STUDYID, USUBJID, ASEQ]
input:
  EX:
    path: input/ex.csv
    types: {EXSEQ: int, EXDOSE: float, EXSTDT: date}
  PERIODS:
    path: input/periods.csv
    types: {APERIOD: int, APERSDT: date, APEREDT: date}

output:
  path: adex.csv
  columns: [STUDYID, USUBJID, ASEQ, ASTDT, APERIOD]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier

  - name: USUBJID
    type: str
    label: Unique Subject Identifier

  - name: ASEQ
    type: int
    label: Analysis Sequence Number

  # The column default, stated once for every row template. The dose
  # template below never names ASTDT, but its period lookup reads it, so the
  # template completes ASTDT from its own exposure record before the period
  # is matched (SPEC-6).
  - name: ASTDT
    type: date
    label: Analysis Start Date
    derivation: EX.EXSTDT

  - name: APERIOD
    type: int
    label: Period

rows:
  # One row per exposure record that gave a dose. The period is the
  # subject's period whose first and last days, both inclusive, hold the
  # row's ASTDT, the same date the output carries. A dose outside every
  # period finds no record; with no `absent` declared, the period is missing
  # and the row is counted under `absent`.
  - id: dosed
    dataset: EX
    filter: "EX.EXDOSE > 0"
    derivations:
      STUDYID: EX.STUDYID
      USUBJID: EX.USUBJID
      ASEQ: EX.EXSEQ
      APERIOD:
        source:
          variable: PERIODS.APERIOD
          between: {value: ASTDT, lower: APERSDT, upper: APEREDT}
