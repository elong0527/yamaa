schema_version: "1.0"
domain: ADSL
keys: [USUBJID]
input:
  DM:
    path: input/dm.csv
    # Declared float, so the stored text .inf, -.Inf, and .NAN is read as
    # non-finite numbers, and each is stored as missing on the way in.
    types:
      POSITIVE_INFINITY: float
      NEGATIVE_INFINITY: float
      NOT_A_NUMBER: float

output:
  path: adsl.csv
  columns:
    - USUBJID
    - YAML_PINF
    - YAML_NINF
    - YAML_NAN
    - SOURCE_PINF
    - SOURCE_NINF
    - SOURCE_NAN
    - FUNCTION_PINF
    - FUNCTION_NINF
    - FUNCTION_NAN

columns:
  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  # Unquoted YAML spellings, one in each accepted letter case, resolve to
  # non-finite floats and are stored as missing.
  - name: YAML_PINF
    type: float
    label: Positive Infinity YAML Literal
    derivation: {literal: .inf}

  - name: YAML_NINF
    type: float
    label: Negative Infinity YAML Literal
    derivation: {literal: -.Inf}

  - name: YAML_NAN
    type: float
    label: Not-a-Number YAML Literal
    derivation: {literal: .NAN}

  - name: SOURCE_PINF
    type: float
    label: Positive Infinity Source Value
    derivation: DM.POSITIVE_INFINITY

  - name: SOURCE_NINF
    type: float
    label: Negative Infinity Source Value
    derivation: DM.NEGATIVE_INFINITY

  - name: SOURCE_NAN
    type: float
    label: Not-a-Number Source Value
    derivation: DM.NOT_A_NUMBER

  # The project calculation returns a real infinity or NaN. Its contract
  # allows a missing result, so each is stored as missing; without that
  # allowance the returned value fails the run.
  - name: FUNCTION_PINF
    type: float
    label: Positive Infinity Function Result
    derivation:
      function:
        name: numeric_constant
        contract_version: "1.0.0"
        args:
          kind: {literal: positive-infinity}

  - name: FUNCTION_NINF
    type: float
    label: Negative Infinity Function Result
    derivation:
      function:
        name: numeric_constant
        contract_version: "1.0.0"
        args:
          kind: {literal: negative-infinity}

  - name: FUNCTION_NAN
    type: float
    label: Not-a-Number Function Result
    derivation:
      function:
        name: numeric_constant
        contract_version: "1.0.0"
        args:
          kind: {literal: nan}
