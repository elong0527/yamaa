yamaa: "1.0"
type: spec
model: SDTM
domain: LB
keys: [STUDYID, USUBJID, LBSEQ]
input:
  LB_RAW: {path: input/lb_raw.csv, types: {LBSEQ: int, LBSTRESN: float}}
  DM: input/dm.csv
  LBRANGE: {path: input/lbrange.csv, types: {NRLO: float, NRHI: float}}
base: LB_RAW

output:
  path: lb.csv
  columns: [STUDYID, USUBJID, LBSEQ, LBTESTCD, LBSTRESN, LBSTNRLO, LBSTNRHI]

intermediates:
  # Each subject's sex, from the demographics record.
  - id: SUBJECT
    dataset: DM
    key: [STUDYID, USUBJID]
    columns: [SEX]

  # The reference range for the result's test and the subject's sex. The
  # sex is read through SUBJECT inside the key, and a key never reads
  # another lookup, so the specification is rejected before any data is
  # read.
  - id: RANGE
    dataset: LBRANGE
    key: {LBTESTCD: LBTESTCD, SEX: SUBJECT.SEX}
    require_match: true

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: LB_RAW.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: LB_RAW.USUBJID

  - name: LBSEQ
    type: int
    label: Sequence Number
    derivation: LB_RAW.LBSEQ

  - name: LBTESTCD
    type: str
    label: Lab Test or Examination Short Name
    derivation: LB_RAW.LBTESTCD

  - name: LBSTRESN
    type: float
    label: Numeric Result/Finding in Standard Units
    derivation: LB_RAW.LBSTRESN

  - name: LBSTNRLO
    type: float
    label: Reference Range Lower Limit-Std Units
    derivation: RANGE.NRLO

  - name: LBSTNRHI
    type: float
    label: Reference Range Upper Limit-Std Units
    derivation: RANGE.NRHI
