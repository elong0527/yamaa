yamaa: "1.0"
type: spec
model: ADaM
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  DM: {path: input/dm.csv, types: {AGE: int}}

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, AGE, AGEGR1N]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID
    submission:
      core: Req
      mandatory: true
      length: 8
      origins:
        - type: Predecessor
          description: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID
    submission:
      core: Req
      mandatory: true
      length: 12
      origins:
        - type: Predecessor
          description: DM.USUBJID

  - name: AGE
    type: int
    label: Age
    derivation: DM.AGE
    submission:
      core: Req
      mandatory: false
      length: 3
      origins:
        - type: Predecessor
          description: DM.AGE

  # The numeric age group is bound to the text list of the age group, not
  # to its own numeric list.
  - name: AGEGR1N
    type: int
    label: Pooled Age Group 1 (N)
    derivation:
      case:
        - when: "AGE < 65"
          then: 1
        - when: "AGE >= 65"
          then: 2
    submission:
      core: Perm
      mandatory: false
      length: 1
      codelist: AGEGR1
      origins:
        - type: Derived
      method: 1 for an age below 65 years, 2 for 65 years or above

submission:
  label: Subject-Level Analysis Dataset
  class: SUBJECT LEVEL ANALYSIS DATASET
  structure: One record per subject
  repeating: false
