yamaa: "1.0"

type: spec

# DM as it stood when it was last built and saved: it wrote the dataset as
# dm_v1.csv, before spec_dm.yaml renamed the output and added the submission
# metadata. The run report it saved, dm-report.csv, records that run.
model: SDTM
domain: DM
keys: [STUDYID, USUBJID]
input:
  DM_RAW: input/dm_raw.csv

output:
  path: dm_v1.csv
  columns: [DOMAIN, STUDYID, USUBJID]
  report: dm-report.csv

columns:
  - name: DOMAIN
    type: str
    label: Domain Abbreviation
    derivation: "'DM'"

  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM_RAW.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM_RAW.USUBJID
