schema_version: "1.0"
domain: VS
keys: [STUDYID, USUBJID, VSSEQ]
input:
  VS_RAW: input/vs_raw.csv
  DM: input/dm.csv
  TV: input/tv.csv
  SE:
    path: input/se.csv
    types: {SESTDTC: date, SEENDTC: date}
base: VS_RAW
intermediates:
  # The planned visit for the collected visit label; an unplanned label such
  # as UNSCHEDULED matches none, leaving the planned number missing.
  - id: PLANNEDVISIT
    dataset: TV
    key: VISIT
  # The subject's element whose dates SESTDTC..SEENDTC (both ends included)
  # hold the collection date; a day shared by two elements keeps the later
  # one, so the kept row is the element with the latest start.
  - id: SEHIT
    dataset: SE
    key: USUBJID
    between:
      value: VSDTC
      lower: SESTDTC
      upper: SEENDTC
    order_by: [SE.SESTDTC]
    keep: last

output:
  path: vs.csv
  columns: [DOMAIN, STUDYID, USUBJID, VSSEQ, VSTESTCD, VSORRES, VSDTC, VISIT, VISITNUM, EPOCH, VSDY]

columns:
  - name: DOMAIN
    type: str
    label: Domain Abbreviation
    derivation: {literal: VS}

  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: VS_RAW.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: VS_RAW.USUBJID

  - name: VSSEQ
    type: int
    label: Sequence Number
    derivation: VS_RAW.VSSEQ
    verifications:
      not_missing: {}

  - name: VSTESTCD
    type: str
    label: Vital Signs Test Short Name
    derivation: VS_RAW.VSTESTCD

  - name: VSORRES
    type: str
    label: Result or Finding in Original Units
    derivation: VS_RAW.VSORRES

  - name: VSDTC
    type: date
    label: Date/Time of Measurements
    derivation: VS_RAW.VSDTC

  - name: VISIT
    type: str
    label: Visit Name
    derivation: VS_RAW.VISIT

  # The planned number for the collected visit label; missing for an
  # unplanned label such as UNSCHEDULED, which names no planned visit.
  - name: PLANNEDNUM
    type: float
    label: Planned Visit Number
    derivation: PLANNEDVISIT.VISITNUM

  # The latest planned number collected for the subject before this row's
  # date, in collection-date order; the current row is never a candidate.
  - name: PREVPLANNED
    type: float
    label: Latest Earlier Planned Visit Number
    derivation:
      previous_non_missing:
        source: PLANNEDNUM
        window:
          group_by: [USUBJID]
          order_by: [VSDTC]

  # The sponsor-assigned number for an unplanned visit: the latest planned
  # number before the collection date plus 0.01, so an unscheduled visit
  # after visit 2 reads 2.01.
  - name: SPONSORNUM
    type: float
    label: Sponsor-Assigned Visit Number
    derivation:
      compute:
        expr: "PREVPLANNED + 0.01"

  # The planned number when the label names a planned visit, otherwise the
  # sponsor-assigned number for the unplanned visit.
  - name: VISITNUM
    type: float
    label: Visit Number
    derivation:
      first_available:
        sources: [PLANNEDNUM, SPONSORNUM]

  # DM is read as text; this typed copy is the date study_day needs. A
  # subject with no DM record has none, so VSDY stays missing for its rows.
  - name: RFSTDTC
    type: date
    label: Subject Reference Start Date/Time
    derivation: DM.RFSTDTC

  - name: VSDY
    type: int
    label: Study Day of Vital Signs
    derivation:
      study_day:
        date: VSDTC
        reference: RFSTDTC

  - name: EPOCH
    type: str
    label: Epoch
    derivation: SEHIT.EPOCH
    verifications:
      allowed_values:
        values: [SCREENING, TREATMENT, FOLLOW-UP]

verifications:
  - unique:
      columns: [STUDYID, USUBJID, VSSEQ]
  - row_count:
      min: 7
      max: 7
  - implies:
      id: study-day-requires-both-dates
      when: "VSDTC IS NOT NULL AND RFSTDTC IS NOT NULL"
      then: "VSDY IS NOT NULL"
  - implies:
      id: study-day-has-no-day-zero
      when: "VSDY IS NOT NULL"
      then: "VSDY <> 0"
  - implies:
      id: reference-start-date-is-study-day-one
      when: "VSDTC IS NOT NULL AND RFSTDTC IS NOT NULL AND VSDTC = RFSTDTC"
      then: "VSDY = 1"
