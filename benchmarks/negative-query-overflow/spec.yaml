schema_version: "1.0"
domain: ADAE
keys: [STUDYID, USUBJID, AESEQ]
input:
  AE: input/ae.csv
  QUERY: {path: input/queries.csv, types: {GRPID: int}}
base: AE
intermediates:
  # One lookup per place: the dictionary entry in place SMQ01 (or SMQ02)
  # whose term is the event's coded term; no entry gives missing values.
  # Two entries for one term in the same place stop the run.
  - id: SMQ1
    dataset: QUERY
    key_base: [AEDECOD]
    key: [TERM]
    filter: "QUERY.PREFIX = 'SMQ01'"
  - id: SMQ2
    dataset: QUERY
    key_base: [AEDECOD]
    key: [TERM]
    filter: "QUERY.PREFIX = 'SMQ02'"

output:
  path: adae.csv
  columns: [STUDYID, USUBJID, AESEQ, AETERM, AEDECOD, SMQ01NAM, SMQ01CD, SMQ02NAM, SMQ02CD]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: AE.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: AE.USUBJID

  - name: AESEQ
    type: int
    label: Sequence Number
    derivation: AE.AESEQ

  - name: AETERM
    type: str
    label: Reported Term for the Adverse Event
    derivation: AE.AETERM

  - name: AEDECOD
    type: str
    label: Dictionary-Derived Term
    derivation: AE.AEDECOD

  - name: SMQ01NAM
    type: str
    label: Standardized MedDRA Query 01 Name
    derivation: SMQ1.GRPNAME

  - name: SMQ01CD
    type: int
    label: Standardized MedDRA Query 01 Code
    derivation: SMQ1.GRPID

  - name: SMQ02NAM
    type: str
    label: Standardized MedDRA Query 02 Name
    derivation: SMQ2.GRPNAME

  - name: SMQ02CD
    type: int
    label: Standardized MedDRA Query 02 Code
    derivation: SMQ2.GRPID

verifications:
  - unique:
      columns: [STUDYID, USUBJID, AESEQ]
  - row_count:
      min: 3
      max: 3
