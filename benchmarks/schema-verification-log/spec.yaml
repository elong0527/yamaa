schema_version: "1.0"
domain: ADSL
keys: [USUBJID]
input:
  DM: input/dm.csv

output:
  path: adsl.csv
  columns: [USUBJID, AGE]
  warning_log: adsl-warnings.csv
  verification_log: adsl-checks.csv

columns:
  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  - name: AGE
    type: int
    label: Age
    derivation: DM.AGE
    verifications:
      - not_missing: {}
      - range:
          min: 18
          max: 100
          severity: warning

verifications:
  - unique:
      columns: [USUBJID]
  - row_count:
      min: 1
