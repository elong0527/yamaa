schema_version: "1.0"
domain: ADSL
keys: [USUBJID]
input:
  DM: input/dm.csv

output:
  path: adsl.csv
  columns: [USUBJID, AGE]
  # Violated warnings, with their offending keys, go to the warning log;
  # every declared check, held or violated, gets one line in the check log.
  warning_log: adsl-warnings.csv
  verification_log: adsl-checks.csv

columns:
  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  - name: AGE
    type: int
    label: Age
    derivation: DM.AGE
    verifications:
      - not_missing: {}
      # A warning, not an error: an age outside 18-100 is logged and the
      # run still succeeds with every row kept.
      - range:
          min: 18
          max: 100
          severity: warning

verifications:
  - unique:
      columns: [USUBJID]
  - row_count:
      min: 1
