schema_version: "1.0"
domain: LB
keys: [STUDYID, USUBJID, LBSEQ]
input:
  LB_RAW:
    path: input/lb_raw.csv
    types: {LBORRES: float, LBORNRLO: float, LBORNRHI: float}
  CONV:
    path: input/conversion.csv
    types: {FACTOR: float}
base: LB_RAW

output:
  path: lb.csv
  columns: [DOMAIN, STUDYID, USUBJID, LBSEQ, LBTESTCD, LBORRES, LBORRESU, LBORNRLO, LBORNRHI, LBSTRESN, LBSTRESC, LBSTRESU, LBSTNRLO, LBSTNRHI]

columns:
  - name: DOMAIN
    type: str
    label: Domain Abbreviation
    derivation: {literal: LB}

  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: LB_RAW.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: LB_RAW.USUBJID

  - name: LBSEQ
    type: int
    label: Sequence Number
    derivation: LB_RAW.LBSEQ

  - name: LBTESTCD
    type: str
    label: Lab Test or Examination Short Name
    derivation: LB_RAW.LBTESTCD

  - name: LBORRES
    type: str
    label: Result or Finding in Original Units
    derivation: LB_RAW.LBORRES

  - name: LBORRESU
    type: str
    label: Original Units
    derivation: LB_RAW.LBORRESU

  - name: LBORNRLO
    type: str
    label: Reference Range Lower Limit in Orig Unit
    derivation: LB_RAW.LBORNRLO

  - name: LBORNRHI
    type: str
    label: Reference Range Upper Limit in Orig Unit
    derivation: LB_RAW.LBORNRHI

  # RESN, LO_RESN and HI_RESN hold the reported result and limits as
  # numbers for the arithmetic below; the columns above keep them as text.
  - name: RESN
    type: float
    label: Numeric Result as Reported
    derivation: LB_RAW.LBORRES

  # The factor for the record's test and reported unit; missing when the
  # conversion table has no such row, which leaves every standardized value
  # except the unit missing.
  - name: FACTOR
    type: float
    label: Conversion Factor to the Standard Unit
    derivation:
      lookup:
        key_base: [LBTESTCD, LBORRESU]
        dataset: CONV
        key: [TESTCD, UNIT]
        value: FACTOR
        missing: null

  - name: LO_RESN
    type: float
    label: Numeric Reference Lower Limit as Reported
    derivation: LB_RAW.LBORNRLO

  - name: HI_RESN
    type: float
    label: Numeric Reference Upper Limit as Reported
    derivation: LB_RAW.LBORNRHI

  - name: LBSTRESN
    type: float
    label: Numeric Result/Finding in Standard Units
    derivation:
      compute:
        expr: "RESN * FACTOR"

  - name: LBSTRESC
    type: str
    label: Character Result/Finding in Std Format
    derivation: LBSTRESN

  - name: LBSTRESU
    type: str
    label: Standard Units
    derivation: {literal: g/dL}

  - name: LBSTNRLO
    type: float
    label: Reference Range Lower Limit in Standard Units
    derivation:
      compute:
        expr: "LO_RESN * FACTOR"

  - name: LBSTNRHI
    type: float
    label: Reference Range Upper Limit in Standard Units
    derivation:
      compute:
        expr: "HI_RESN * FACTOR"

verifications:
  # A result with no factor keeps its standard unit while its standardized
  # result and limits are missing, so this check fails for that record.
  - all_or_none:
      id: standardized-result-completeness
      columns: [LBSTRESN, LBSTRESC, LBSTRESU, LBSTNRLO, LBSTNRHI]
