lifecycle: reviewed
standard: ADaM
domain: ADEX
review:
  concerns:
    - Dose reduction flags feed dose-modification tables and are read in time
      order across a subject's administrations.
    - Four subjects cover a steady dose, reductions, a pause at zero, a missing
      dose, two administrations at the same time, and a first administration at
      zero.
    - Only the administration just before counts, so the 150 after a pause at
      zero is not flagged and neither is the 100 after a missing dose (subject
      101), while ties at the same time follow the sequence number (subject
      103).
