lifecycle: reviewed
standard: ADaM
domain: ADEX
review:
  concerns:
    - Dose reduction flags feed dose-modification tables and are read in time
      order across a subject's administrations.
    - Four subjects cover a steady dose, reductions, a dose interruption, a
      missing dose, two administrations at the same time, and a first
      administration at zero.
    - A dose interruption is a record with dose 0, so no drug was given. A
      missing dose is a record with no dose value, so the dose is unknown. Only
      the administration just before counts, so the 150 after the interruption
      is not flagged and neither is the 100 after the missing dose (subject
      101), while ties at the same time follow the sequence number (subject
      103).
