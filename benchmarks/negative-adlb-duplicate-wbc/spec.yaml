schema_version: "1.0"
domain: ADLB
keys: [USUBJID, VISIT, PARAMCD]
input:
  ADLB_RAW: {path: input/adlb.csv, types: {AVAL: float}}

output:
  path: adlb.csv
  columns: [USUBJID, PARAMCD, AVAL, PARAM, VISIT, DTYPE]

columns:
  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: ADLB_RAW.USUBJID

  - name: VISIT
    type: str
    label: Visit Name
    derivation: ADLB_RAW.VISIT

  - name: PARAMCD
    type: str
    label: Parameter Code

  - name: PARAM
    type: str
    label: Parameter

  - name: WBCVAL
    type: float
    label: White Blood Cell Count

  - name: LYMLEVAL
    type: float
    label: Lymphocyte Fraction

  - name: EXISTING_ABS_COUNT
    type: int
    label: Existing Absolute Lymphocyte Record Count

  - name: AVAL
    type: float
    label: Analysis Value

  - name: DTYPE
    type: str
    label: Derivation Type

rows:
  - id: collected
    derivations:
      PARAMCD: ADLB_RAW.PARAMCD
      PARAM: ADLB_RAW.PARAM
      WBCVAL: {literal: null}
      LYMLEVAL: {literal: null}
      EXISTING_ABS_COUNT: {literal: null}
      AVAL: ADLB_RAW.AVAL
      DTYPE: {literal: null}

  # One new LYMPH record per subject and visit, kept only when both a WBC
  # count and a LYMLE fraction are present and no LYMPH record was collected.
  - id: derived_lymph
    group_by: [ADLB_RAW.USUBJID, ADLB_RAW.VISIT]
    filter: >-
      WBCVAL IS NOT NULL
      AND LYMLEVAL IS NOT NULL
      AND EXISTING_ABS_COUNT IS NULL
    derivations:
      PARAMCD: {literal: LYMPH}
      PARAM: {literal: Lymphocytes Abs (10^9/L)}
      # ONLY takes the one WBC (or LYMLE) result at the visit; a second
      # record stops the run instead of one being picked.
      WBCVAL:
        aggregate:
          filter: "ADLB_RAW.PARAMCD = 'WBC'"
          expr: "ONLY(ADLB_RAW.AVAL)"
      LYMLEVAL:
        aggregate:
          filter: "ADLB_RAW.PARAMCD = 'LYMLE'"
          expr: "ONLY(ADLB_RAW.AVAL)"
      # A count over no records is missing rather than 0, so the filter's
      # EXISTING_ABS_COUNT IS NULL means no LYMPH record was collected.
      EXISTING_ABS_COUNT:
        aggregate:
          filter: "ADLB_RAW.PARAMCD = 'LYMPH'"
          expr: "COUNT(ADLB_RAW.*)"
      AVAL:
        compute:
          expr: "WBCVAL * LYMLEVAL"
      DTYPE: {literal: CALCULATION}

verifications:
  - unique:
      columns: [USUBJID, VISIT, PARAMCD]
