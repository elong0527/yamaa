schema_version: "1.0"
domain: ADEG
keys: [STUDYID, USUBJID, PARAMCD, AVISIT]
input:
  ADEG_RAW: {path: input/adeg.csv, types: {AVAL: float}}

output:
  path: adeg.csv
  columns: [STUDYID, USUBJID, PARAMCD, PARAM, AVISIT, AVAL, AVALU]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: ADEG_RAW.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: ADEG_RAW.USUBJID

  - name: PARAMCD
    type: str
    label: Parameter Code

  - name: PARAM
    type: str
    label: Parameter

  - name: AVISIT
    type: str
    label: Analysis Visit
    derivation: ADEG_RAW.AVISIT

  # The visit's QT and RR results, gathered for the QTc formulas. Every row
  # template must set them, so the others set them empty; neither is in the
  # output.
  - name: QTVAL
    type: float
    label: QT Interval

  - name: RRVAL
    type: float
    label: RR Interval

  - name: AVAL
    type: float
    label: Analysis Value

  - name: AVALU
    type: str
    label: Analysis Value Unit

rows:
  # Every collected record, unchanged.
  - id: collected
    derivations:
      PARAMCD: ADEG_RAW.PARAMCD
      PARAM: ADEG_RAW.PARAM
      QTVAL: {literal: null}
      RRVAL: {literal: null}
      AVAL: ADEG_RAW.AVAL
      AVALU: ADEG_RAW.AVALU

  # One QTc record per subject and visit that has both a QT and an RR
  # result; ONLY() fails if the visit has more than one of either.
  - id: qtc_bazett
    group_by: [ADEG_RAW.STUDYID, ADEG_RAW.USUBJID, ADEG_RAW.AVISIT]
    filter: "QTVAL IS NOT NULL AND RRVAL IS NOT NULL"
    derivations:
      PARAMCD: {literal: QTCBR}
      PARAM: {literal: "QTcB - Bazett's Correction Formula Rederived (ms)"}
      QTVAL:
        aggregate:
          filter: "ADEG_RAW.PARAMCD = 'QT'"
          expr: "ONLY(ADEG_RAW.AVAL)"
      RRVAL:
        aggregate:
          filter: "ADEG_RAW.PARAMCD = 'RR'"
          expr: "ONLY(ADEG_RAW.AVAL)"
      AVAL:
        compute:
          expr: "QTVAL / SQRT(RRVAL / 1000)"
      AVALU: {literal: ms}

  # The same visits, with the Fridericia formula.
  - id: qtc_fridericia
    group_by: [ADEG_RAW.STUDYID, ADEG_RAW.USUBJID, ADEG_RAW.AVISIT]
    filter: "QTVAL IS NOT NULL AND RRVAL IS NOT NULL"
    derivations:
      PARAMCD: {literal: QTCFR}
      PARAM: {literal: "QTcF - Fridericia's Correction Formula Rederived (ms)"}
      QTVAL:
        aggregate:
          filter: "ADEG_RAW.PARAMCD = 'QT'"
          expr: "ONLY(ADEG_RAW.AVAL)"
      RRVAL:
        aggregate:
          filter: "ADEG_RAW.PARAMCD = 'RR'"
          expr: "ONLY(ADEG_RAW.AVAL)"
      AVAL:
        compute:
          expr: "QTVAL / POWER(RRVAL / 1000, 1 / 3)"
      AVALU: {literal: ms}

  # One RR record per heart-rate record that can be inverted:
  # 60000 ms per minute divided by beats per minute.
  - id: rr_rederived
    filter: >-
      ADEG_RAW.PARAMCD = 'HR'
      AND ADEG_RAW.AVAL IS NOT NULL
      AND ADEG_RAW.AVAL <> 0
    derivations:
      PARAMCD: {literal: RRR}
      PARAM: {literal: "RR Duration Rederived (ms)"}
      QTVAL: {literal: null}
      RRVAL: {literal: null}
      AVAL:
        compute:
          expr: "60000 / NULLIF(ADEG_RAW.AVAL, 0)"
      AVALU: {literal: ms}

verifications:
  - unique:
      columns: [STUDYID, USUBJID, PARAMCD, AVISIT]
  - row_count:
      min: 51
      max: 51
  - implies:
      id: collected-qt-rr-unit-is-ms-or-msec
      when: "PARAMCD = 'QT' OR PARAMCD = 'RR'"
      then: "AVALU = 'ms' OR AVALU = 'msec'"
  - implies:
      id: contributing-hr-uses-beats-per-minute
      when: "PARAMCD = 'HR' AND AVAL IS NOT NULL AND AVAL <> 0"
      then: "AVALU = 'beats/min'"
  - implies:
      id: new-records-carry-ms
      when: "PARAMCD = 'QTCBR' OR PARAMCD = 'QTCFR' OR PARAMCD = 'RRR'"
      then: "AVALU = 'ms'"
