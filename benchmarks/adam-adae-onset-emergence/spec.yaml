yamaa: "1.0"
type: spec
model: ADaM
domain: ADAE
keys: [STUDYID, USUBJID, AESEQ]
input:
  AE: {path: input/ae.csv, types: {AESTDTC: datetime}}
  ADSL:
    path: input/adsl.csv
    types: {TRTSDTM: datetime, TRTEDTM: datetime}
    key: [STUDYID, USUBJID]
base: AE

output:
  path: adae.csv
  columns: [STUDYID, USUBJID, AESEQ, AETERM, AESER, ASTDTM, TRTSDTM, TRTEDTM,
            EOTSTT, TEENDDTM, TRTEMFL, AOCCFL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: AE.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: AE.USUBJID

  - name: AESEQ
    type: int
    label: Sequence Number
    derivation: AE.AESEQ

  - name: AETERM
    type: str
    label: Reported Term for the Adverse Event
    derivation: AE.AETERM

  - name: AESER
    type: str
    label: Serious Event
    derivation: AE.AESER

  - name: ASTDTM
    type: datetime
    label: Analysis Start Date/Time
    derivation: AE.AESTDTC

  - name: TRTSDTM
    type: datetime
    label: Datetime of First Exposure to Treatment
    derivation: ADSL.TRTSDTM

  - name: TRTEDTM
    type: datetime
    label: Datetime of Last Exposure to Treatment
    derivation: ADSL.TRTEDTM

  - name: EOTSTT
    type: str
    label: End of Treatment Status
    derivation: ADSL.EOTSTT

  # The study's treatment-emergent window ends 30 days after last exposure
  # for an event recorded as non-serious and 90 days after for any other:
  # a serious event, or one whose seriousness was not recorded. While
  # treatment is ongoing the window has no end yet.
  - name: TEENDDTM
    type: datetime
    label: End of Treatment-Emergent Window
    derivation:
      case:
        - when: "EOTSTT = 'ONGOING'"
          then: null
        - when: "AESER = 'N'"
          then:
            shift: {type: datetime, source: TRTEDTM, amount: 30, unit: day}
        - otherwise:
            shift: {type: datetime, source: TRTEDTM, amount: 90, unit: day}

  # The window rule: onset at or after first exposure and, unless treatment
  # is ongoing, at or before the window end is treatment-emergent. A missing
  # onset cannot be ruled pre-treatment, so the conservative convention
  # flags it Y; an untreated subject (no first exposure at all) can never be
  # treatment-emergent.
  - name: TRTEMFL
    type: str
    label: Treatment Emergent Analysis Flag
    derivation:
      case:
        - when: "TRTSDTM IS NULL"
          then: null
        - when: "ASTDTM IS NULL"
          then: "'Y'"
        - when: >-
            ASTDTM >= TRTSDTM
            AND (EOTSTT = 'ONGOING' OR ASTDTM <= TEENDDTM)
          then: "'Y'"
        - otherwise: null
    verifications:
      - allowed_values:
          values: [Y]

  # Occurrence sequencing needs an orderable onset; a treatment-emergent
  # event with a missing onset is flagged but cannot be sequenced.
  - name: AOCCSEQ
    type: int
    label: Subject Occurrence Sequence Number
    derivation:
      row_number:
        window:
          group_by: [STUDYID, USUBJID]
          order_by: [ASTDTM, AESEQ]
          filter: "TRTEMFL = 'Y' AND ASTDTM IS NOT NULL"

  - name: AOCCFL
    type: str
    label: First Occurrence Within Subject Flag
    derivation:
      flag: "AOCCSEQ = 1"
    verifications:
      - allowed_values:
          values: [Y]

verifications:
  - row_count:
      min: 15
      max: 15
  - assert:
      id: treatment-emergent-onset-is-not-before-first-dose
      when: "TRTEMFL = 'Y' AND ASTDTM IS NOT NULL"
      require: "ASTDTM >= TRTSDTM"
  - assert:
      id: treatment-emergent-onset-is-within-window
      when: "TRTEMFL = 'Y' AND ASTDTM IS NOT NULL AND TEENDDTM IS NOT NULL"
      require: "ASTDTM <= TEENDDTM"
  - assert:
      id: finished-treatment-has-a-window-end
      when: "TRTSDTM IS NOT NULL AND EOTSTT <> 'ONGOING'"
      require: "TEENDDTM IS NOT NULL"
  - assert:
      id: missing-onset-is-treatment-emergent
      when: "ASTDTM IS NULL AND TRTSDTM IS NOT NULL"
      require: "TRTEMFL = 'Y'"
  - assert:
      id: untreated-subject-has-no-flag
      when: "TRTSDTM IS NULL"
      require: "TRTEMFL IS NULL"
  - assert:
      id: occurrence-flag-requires-treatment-emergence
      when: "AOCCFL = 'Y'"
      require: "TRTEMFL = 'Y'"
