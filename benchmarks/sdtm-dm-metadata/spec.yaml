schema_version: "1.0"
domain: DM
keys: [STUDYID, USUBJID]
input:
  DM_RAW: input/dm_raw.csv

output:
  path: dm.csv
  columns: [DOMAIN, STUDYID, USUBJID, SUBJID, SITEID, AGE, AGEU, SEX, COUNTRY]

columns:
  - name: DOMAIN
    type: str
    label: Domain Abbreviation
    derivation: {literal: DM}
    verifications:
      not_missing: {}
    submission:
      core: Req
      role: Identifier
      length: 2
      codelist: DOMAIN
      origin:
        type: Assigned
        source: Sponsor

  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM_RAW.STUDYID
    verifications:
      not_missing: {}
    submission:
      core: Req
      role: Identifier
      length: 20
      origin:
        type: Protocol
        source: Sponsor

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      str_concat:
        sources:
          - source: DM_RAW.STUDYID
          - literal: '-'
          - source: DM_RAW.SITEID
          - literal: '-'
          - source: DM_RAW.SUBJID
    verifications:
      - not_missing: {}
      - max_length:
          max: 30
    submission:
      core: Req
      role: Identifier
      origin:
        type: Derived
        source: Sponsor
      method: Study identifier, site identifier, and subject identifier joined
        by hyphens.

  - name: SUBJID
    type: str
    label: Subject Identifier for the Study
    derivation: DM_RAW.SUBJID
    verifications:
      not_missing: {}
    submission:
      core: Req
      role: Topic
      length: 10
      origin:
        type: Collected
        source: Investigator
        documents:
          - document: acrf
            pages: {type: PhysicalRef, refs: "1"}

  - name: SITEID
    type: str
    label: Study Site Identifier
    derivation: DM_RAW.SITEID
    verifications:
      not_missing: {}
    submission:
      core: Req
      role: Record Qualifier
      length: 10
      origin:
        type: Collected
        source: Investigator

  - name: AGE
    type: int
    label: Age
    derivation: DM_RAW.AGE
    verifications:
      range:
        min: 0
        max: 120
    submission:
      core: Exp
      role: Record Qualifier
      length: 3
      origin:
        type: Collected
        source: Investigator
        documents:
          - document: acrf
            pages: {type: PhysicalRef, refs: "1"}

  - name: AGEU
    type: str
    label: Age Units
    derivation: {literal: YEARS}
    submission:
      core: Exp
      role: Variable Qualifier
      length: 5
      codelist: AGEU
      origin:
        type: Assigned
        source: Sponsor
      comment: Defaulted to YEARS because age is collected in whole years.

  - name: SEX
    type: str
    label: Sex
    derivation: DM_RAW.SEX
    verifications:
      - not_missing: {}
      - allowed_values:
          values: [F, M, U]
    submission:
      core: Req
      role: Record Qualifier
      length: 1
      codelist: SEX
      origin:
        type: Collected
        source: Investigator
        documents:
          - document: acrf
            pages: {type: PhysicalRef, refs: "1"}

  - name: COUNTRY
    type: str
    label: Country
    derivation: DM_RAW.COUNTRY
    verifications:
      not_missing: {}
    submission:
      core: Req
      role: Record Qualifier
      length: 3
      codelist: COUNTRY
      origin:
        type: Collected
        source: Investigator
        documents:
          - document: acrf
            pages: {type: PhysicalRef, refs: "1"}

verifications:
  - unique:
      columns: [STUDYID, USUBJID]
  - row_count:
      min: 3
      max: 3

submission:
  label: Demographics
  class: SPECIAL PURPOSE
  structure: One record per subject
  repeating: false
  comment:
    text: Demographics are described in section 2.1 of the reviewer's guide.
    documents: [csdrg]
