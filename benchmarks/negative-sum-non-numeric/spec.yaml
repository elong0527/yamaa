schema_version: "1.0"
domain: ADAE
keys: [STUDYID, USUBJID, AESEQ]
input:
  AE: input/ae.csv

output:
  path: adae.csv
  columns: [STUDYID, USUBJID, AESEQ, ASEV, SEVTOT]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: AE.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: AE.USUBJID

  - name: AESEQ
    type: int
    label: Sequence Number
    derivation: AE.AESEQ

  - name: ASEV
    type: str
    label: Analysis Severity/Intensity
    derivation: AE.AESEV

  # One total per subject, repeated on each of their event rows. ASEV
  # holds severity words (MILD, SEVERE), and SUM needs numbers, so the
  # run is rejected before any data is read.
  - name: SEVTOT
    type: float
    label: Total Severity Score
    derivation:
      aggregate:
        group_by: [STUDYID, USUBJID]
        expr: "SUM(ASEV)"
