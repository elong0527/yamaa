# Fixed creation time is supplied by the Define call in benchmark.yaml.
schema_version: '1.0'
study:
  id: STUDY02
  name: STUDY02
  description: Example study submitting a sponsor-extended epoch
  protocol_name: STUDY-02
codelists:
- standard:
    name: CDISC/NCI
    publishing_set: SDTM
    version: '2023-12-15'
  codelists:
  # The published list admits sponsor additions; the extension epoch is one,
  # so it carries no NCI code.
  - id: EPOCH
    name: Epoch
    extensible: true
    alias: C99079
    items:
    - value: SCREENING
      alias: C48262
    - value: TREATMENT
      alias: C101526
    - value: EXTENSION
      extended: true
    data_type: text
sdtm:
  standard:
    name: SDTMIG
    version: '3.4'
    status: Final
  specs:
  - spec.yaml
  define: define.xml
  context: Submission
  source_system_version: '1.0'
