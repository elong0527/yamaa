yamaa: "1.0"
type: spec
model: SDTM
domain: DM
keys: [STUDYID, USUBJID]

input:
  ODM: input/odm.csv

output:
  path: dm.csv
  columns: [DOMAIN, STUDYID, USUBJID, SUBJID, SITEID, AGE, AGEU, SEX, ARM,
            ACTARM, ARMNRS, COUNTRY]

columns:
  - name: DOMAIN
    type: str
    label: Domain Abbreviation
    derivation: "'DM'"

  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: ODM.StudyOID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: ODM.SubjectKey

  - name: SUBJID
    type: str
    label: Subject Identifier for the Study
    derivation: USUBJID

  - name: SITEID
    type: str
    label: Study Site Identifier
    derivation:
      source:
        filter: ODM.ItemOID = 'IT.DM.SITEID'
        variable: ODM.Value

  - name: AGE
    type: int
    label: Age
    derivation:
      source:
        filter: ODM.ItemOID = 'IT.DM.AGE'
        variable: ODM.Value

  - name: AGEU
    type: str
    label: Age Units
    derivation:
      case:
        - when: "AGE IS NOT NULL"
          then: "'YEARS'"

  - name: SEX
    type: str
    label: Sex
    derivation:
      mapping:
        source:
          filter: ODM.ItemOID = 'IT.DM.SEX'
          variable: ODM.Value
        dict:
          Male: M
          Female: F
        missing: U
        unmapped: U

  - name: ARM
    type: str
    label: Description of Planned Arm
    derivation:
      source:
        filter: ODM.ItemOID = 'IT.DM.ARM'
        variable: ODM.Value

  - name: ACTARM
    type: str
    label: Description of Actual Arm
    derivation: ARM

  - name: ARMNRS
    type: str
    label: Reason Subject Not Assigned to Treatment
    derivation:
      case:
        - when: "ARM IS NULL"
          then: "'NOT ASSIGNED'"

  - name: COUNTRY
    type: str
    label: Country
    derivation:
      source:
        filter: ODM.ItemOID = 'IT.DM.COUNTRY'
        variable: ODM.Value
