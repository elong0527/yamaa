schema_version: "1.0"
domain: ADCM
keys: [STUDYID, USUBJID, CMSEQ]
input:
  CM: input/cm.csv
  FACM: input/facm.csv
  ATCDICT: input/atc_dict.csv
base: CM

output:
  path: adcm.csv
  columns: [STUDYID, USUBJID, CMSEQ, CMTRT, CMDECOD, ATC1, ATC2, ATC3, ATC4,
            ATC1CD, ATC2CD, ATC3CD, ATC4CD]

intermediates:
  - id: FACM_ATC1
    dataset: FACM
    key: {STUDYID: CM.STUDYID, USUBJID: CM.USUBJID, CMSEQ: CM.CMSEQ}
    filter: "FACM.FATESTCD = 'ATC1'"
    no_match: null

  - id: FACM_ATC2
    dataset: FACM
    key: {STUDYID: CM.STUDYID, USUBJID: CM.USUBJID, CMSEQ: CM.CMSEQ}
    filter: "FACM.FATESTCD = 'ATC2'"
    no_match: null

  - id: FACM_ATC3
    dataset: FACM
    key: {STUDYID: CM.STUDYID, USUBJID: CM.USUBJID, CMSEQ: CM.CMSEQ}
    filter: "FACM.FATESTCD = 'ATC3'"
    no_match: null

  - id: FACM_ATC4
    dataset: FACM
    key: {STUDYID: CM.STUDYID, USUBJID: CM.USUBJID, CMSEQ: CM.CMSEQ}
    filter: "FACM.FATESTCD = 'ATC4'"
    no_match: null

  - id: ATC1_DICT
    dataset: ATCDICT
    key: {ATCCODE: ATC1CD}
    no_match: null

  - id: ATC2_DICT
    dataset: ATCDICT
    key: {ATCCODE: ATC2CD}
    no_match: null

  - id: ATC3_DICT
    dataset: ATCDICT
    key: {ATCCODE: ATC3CD}
    no_match: null

  - id: ATC4_DICT
    dataset: ATCDICT
    key: {ATCCODE: ATC4CD}
    no_match: null

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: CM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: CM.USUBJID

  - name: CMSEQ
    type: int
    label: Sequence Number
    derivation: CM.CMSEQ

  - name: CMTRT
    type: str
    label: Reported Name of Drug, Medication, or Therapy
    derivation: CM.CMTRT

  - name: CMDECOD
    type: str
    label: Standardized Medication Name
    derivation: CM.CMDECOD

  # The ATC code at each level, read off the medication's FACM path
  # records: one FACM row per ATC level, linked to the CM record. The keys
  # are spelled out because they compare CM's collected text with FACM's;
  # the output CMSEQ is an int and would not match FACM's text CMSEQ.
  - name: ATC1CD
    type: str
    label: ATC Level 1 Code
    derivation: FACM_ATC1.FAORRES

  - name: ATC2CD
    type: str
    label: ATC Level 2 Code
    derivation: FACM_ATC2.FAORRES

  - name: ATC3CD
    type: str
    label: ATC Level 3 Code
    derivation: FACM_ATC3.FAORRES

  - name: ATC4CD
    type: str
    label: ATC Level 4 Code
    derivation: FACM_ATC4.FAORRES

  # The ATC class names, decoded from the codes through the small
  # ATC dictionary. A medication with no ATC assignment (no FACM
  # path records) keeps all eight ATC columns empty.
  - name: ATC1
    type: str
    label: ATC Level 1 Text
    derivation: ATC1_DICT.ATCNAME

  - name: ATC2
    type: str
    label: ATC Level 2 Text
    derivation: ATC2_DICT.ATCNAME

  - name: ATC3
    type: str
    label: ATC Level 3 Text
    derivation: ATC3_DICT.ATCNAME

  - name: ATC4
    type: str
    label: ATC Level 4 Text
    derivation: ATC4_DICT.ATCNAME

verifications:
  - unique:
      columns: [STUDYID, USUBJID, CMSEQ]
  - row_count:
      min: 6
      max: 6
  - assert:
      id: coded-medication-has-full-atc-path
      when: "CMDECOD IS NOT NULL"
      require: "ATC1CD IS NOT NULL AND ATC2CD IS NOT NULL
        AND ATC3CD IS NOT NULL AND ATC4CD IS NOT NULL"
  - assert:
      id: atc-codes-imply-atc-names
      when: "ATC1CD IS NOT NULL"
      require: "ATC1 IS NOT NULL AND ATC2 IS NOT NULL
        AND ATC3 IS NOT NULL AND ATC4 IS NOT NULL"
