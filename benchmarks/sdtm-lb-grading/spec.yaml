schema_version: "1.0"
domain: LB
keys: [STUDYID, USUBJID, LBSEQ]
input:
  LB_RAW: {path: input/lb_raw.csv, types: {LBSTRESN: float}}

output:
  path: lb.csv
  columns: [DOMAIN, STUDYID, USUBJID, LBSEQ, LBTESTCD, SEX, LBSTRESN, ATOXGR]

columns:
  - name: DOMAIN
    type: str
    label: Domain Abbreviation
    derivation: {literal: LB}

  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: LB_RAW.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: LB_RAW.USUBJID

  - name: LBSEQ
    type: int
    label: Sequence Number
    derivation: LB_RAW.LBSEQ

  - name: LBTESTCD
    type: str
    label: Lab Test or Examination Short Name
    derivation: LB_RAW.LBTESTCD

  - name: SEX
    type: str
    label: Sex
    derivation: LB_RAW.SEX

  - name: LBSTRESN
    type: float
    label: Numeric Result/Finding in Standard Units
    derivation: LB_RAW.LBSTRESN

  - name: ATOXGR
    type: str
    label: Analysis Toxicity Grade

  # The independently recorded grade, read only by the agreement check
  # below; not in the output.
  - name: REPROGRADE
    type: str
    label: Reproduced Toxicity Grade
    derivation: LB_RAW.REPROGRADE

# A result for any other test, or a hemoglobin result whose sex is not M
# or F, matches no row template and gets no record. Each band includes its
# lower break; a missing result stops the run.
rows:
  # One band set for both sexes: below 0.1 grade 4, below 0.5 grade 3,
  # below 1.0 grade 2, below 1.5 grade 1, 1.5 and above grade 0.
  - id: neutrophils
    filter: "LB_RAW.LBTESTCD = 'ANC'"
    derivations:
      ATOXGR:
        cut:
          source: LB_RAW.LBSTRESN
          breaks: [0.1, 0.5, 1.0, 1.5]
          labels: ['4', '3', '2', '1', '0']
          right: false

  # Below 8.0 grade 3, below 10.0 grade 2, below 13.5 grade 1, 13.5 and
  # above grade 0.
  - id: haemoglobin-male
    filter: "LB_RAW.LBTESTCD = 'HGB' AND LB_RAW.SEX = 'M'"
    derivations:
      ATOXGR:
        cut:
          source: LB_RAW.LBSTRESN
          breaks: [8.0, 10.0, 13.5]
          labels: ['3', '2', '1', '0']
          right: false

  # As for males, except that grade 0 starts at 12.0.
  - id: haemoglobin-female
    filter: "LB_RAW.LBTESTCD = 'HGB' AND LB_RAW.SEX = 'F'"
    derivations:
      ATOXGR:
        cut:
          source: LB_RAW.LBSTRESN
          breaks: [8.0, 10.0, 12.0]
          labels: ['3', '2', '1', '0']
          right: false

verifications:
  - row_count:
      min: 6
      max: 6
  # A grade that differs from the recorded one stops the run.
  - assert:
      id: reproduced-grade-agrees
      expr: "ATOXGR = REPROGRADE"
