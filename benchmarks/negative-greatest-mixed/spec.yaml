schema_version: "1.0"
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  DM: input/dm.csv

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, DTHDT, LSTVSDY, LSTALVDT]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  - name: DTHDT
    type: date
    label: Date of Death
    derivation: DM.DTHDTC

  - name: LSTVSDY
    type: int
    label: Last Visit Study Day
    derivation: DM.LSTVSDY

  # Intentionally mixes scales: DTHDT is a calendar date and LSTVSDY a
  # study-day number, which share no order, so the specification is rejected
  # before any data is read.
  - name: LSTALVDT
    type: date
    label: Last Known Alive Date
    derivation:
      greatest:
        sources: [DTHDT, LSTVSDY]
