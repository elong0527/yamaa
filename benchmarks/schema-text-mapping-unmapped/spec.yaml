schema_version: "1.0"
domain: ADSL
keys: [USUBJID]
input:
  DM: input/dm.csv
base: DM

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, SEXC, SEXC_SINGLE]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: {literal: YAMAA-01}

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  # Two named results, one per event: the missing code stays missing
  # ("not collected"), the collected code outside the dictionary reads as
  # outside the codelist.
  - name: SEXC
    type: str
    label: Sex Decoded
    derivation:
      mapping:
        source: DM.SEX
        dict:
          M: Male
          F: Female
        missing: null
        unmapped: Outside codelist

  # One named result for both events: with no separate result for unlisted
  # codes (and no strict check), the missing code and the unlisted code both
  # read as the declared missing value.
  - name: SEXC_SINGLE
    type: str
    label: Sex Decoded With One Result
    derivation:
      mapping:
        source: DM.SEX
        dict:
          M: Male
          F: Female
        missing: Unknown
