schema_version: "1.0"
domain: ADLB
keys: [STUDYID, USUBJID, PARAMCD]
input:
  LB: input/lb.csv

output:
  path: adlb.csv
  columns: [STUDYID, USUBJID, PARAMCD, AVAL, ANRHI, HIFL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: LB.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: LB.USUBJID

  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation: LB.LBTESTCD

  - name: AVAL
    type: float
    label: Analysis Value
    derivation: LB.LBSTRESN

  - name: ANRHI
    type: float
    label: Analysis Normal Range Upper Limit
    derivation: LB.LBSTNRHI

  # A formula admits no comparison: a yes-or-no question belongs in a case,
  # which states how the answer becomes 1 or 0. The specification is
  # rejected before any data is read.
  - name: HIFL
    type: int
    label: High Result Flag
    derivation:
      compute:
        expr: "AVAL > ANRHI"
