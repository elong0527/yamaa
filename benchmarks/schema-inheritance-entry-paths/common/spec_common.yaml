schema_version: "1.0"
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  DM:
    path: input/dm.csv
    relative_to: entry
    types:
      AGE: int
base: DM
columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID
  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID
  - name: AGE
    type: int
    label: Age
    derivation: DM.AGE
metadata:
  scope: common
