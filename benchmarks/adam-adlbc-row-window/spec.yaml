schema_version: "1.0"
domain: ADLBC
keys: [STUDYID, USUBJID, PARAMCD, AVISITN]
input:
  LB: input/lb.csv

output:
  path: adlbc.csv
  columns: [STUDYID, USUBJID, PARAMCD, AVISITN, AVAL, PREV_AVAL, CHG]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: LB.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier

  - name: PARAMCD
    type: str
    label: Parameter Code

  - name: AVISITN
    type: int
    label: Analysis Visit Number

  - name: AVAL
    type: float
    label: Analysis Value

  - name: PREV_AVAL
    type: float
    label: Previous Analysis Value

  - name: CHG
    type: float
    label: Change from Previous Value

rows:
  - id: change_alb
    dataset: LB
    filter: "LB.LBTESTCD = 'ALB' AND LB.LBSTRESN IS NOT NULL"
    derivations:
      USUBJID: LB.USUBJID
      PARAMCD:
        literal: "_ALB"
      AVISITN: LB.VISITNUM
      AVAL: LB.LBSTRESN
      PREV_AVAL:
        row_value:
          source: AVAL
          offset: -1
          window:
            group_by: [USUBJID, PARAMCD]
            order_by: [AVISITN]
      CHG:
        compute:
          expr: "AVAL - PREV_AVAL"

  - id: change_bili
    dataset: LB
    filter: "LB.LBTESTCD = 'BILI' AND LB.LBSTRESN IS NOT NULL"
    derivations:
      USUBJID: LB.USUBJID
      PARAMCD:
        literal: "_BILI"
      AVISITN: LB.VISITNUM
      AVAL: LB.LBSTRESN
      PREV_AVAL:
        row_value:
          source: AVAL
          offset: -1
          window:
            group_by: [USUBJID, PARAMCD]
            order_by: [AVISITN]
      CHG:
        compute:
          expr: "AVAL - PREV_AVAL"
