schema_version: "1.0"
domain: ADLBC
keys: [STUDYID, USUBJID, PARAMCD, AVISITN]
input:
  LB: input/lb.csv

output:
  path: adlbc.csv
  columns: [STUDYID, USUBJID, PARAMCD, AVISITN, AVAL, PREV_AVAL, CHG]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: LB.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: LB.USUBJID

  - name: PARAMCD
    type: str
    label: Parameter Code

  - name: AVISITN
    type: int
    label: Analysis Visit Number
    derivation: LB.VISITNUM

  - name: AVAL
    type: float
    label: Analysis Value
    derivation: LB.LBSTRESN

  - name: PREV_AVAL
    type: float
    label: Previous Analysis Value
    derivation:
      row_value:
        source: AVAL
        offset: -1
        window:
          group_by: [USUBJID, PARAMCD]
          order_by: [AVISITN]

  - name: CHG
    type: float
    label: Change from Previous Value
    derivation:
      compute:
        expr: "AVAL - PREV_AVAL"

rows:
  # One row per albumin or bilirubin record with a numeric result. The
  # test code becomes the change parameter (_ALB, _BILI). PREV_AVAL
  # reads the row just before in visit order for the same subject and
  # parameter, so an _ALB row never reads a _BILI value; the first
  # visit for a subject and parameter has no previous value, and CHG
  # is empty there too.
  - id: change_params
    dataset: LB
    filter: "LB.LBTESTCD IN ('ALB', 'BILI') AND LB.LBSTRESN IS NOT NULL"
    derivations:
      PARAMCD:
        mapping:
          source: LB.LBTESTCD
          dict: {ALB: "_ALB", BILI: "_BILI"}
