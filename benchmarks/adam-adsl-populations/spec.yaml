schema_version: "1.0"
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  ADSL_RAW: input/adsl_raw.csv

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, ARMCD, TRTSDT, SAFFL, ITTFL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: ADSL_RAW.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: ADSL_RAW.USUBJID

  - name: ARMCD
    type: str
    label: Planned Arm Code
    derivation: ADSL_RAW.ARMCD

  - name: TRTSDT
    type: date
    label: Date of First Exposure to Treatment
    derivation: ADSL_RAW.TRTSDT

  - name: SAFFL
    type: str
    label: Safety Population Flag
    derivation:
      case:
        - when: "TRTSDT IS NOT NULL"
          then:
            literal: Y
        - otherwise:
            literal: N
    verifications:
      - not_missing: {}
      - allowed_values:
          values: [Y, N]

  - name: ITTFL
    type: str
    label: Intent-to-Treat Population Flag
    derivation:
      case:
        - when: "ARMCD IS NOT NULL"
          then:
            literal: Y
        - otherwise:
            literal: N
    verifications:
      - not_missing: {}
      - allowed_values:
          values: [Y, N]

verifications:
  - unique:
      columns: [STUDYID, USUBJID]
  - row_count:
      min: 4
      max: 4
  - implies:
      id: safety-flag-requires-treatment-start
      when: "SAFFL = 'Y'"
      then: "TRTSDT IS NOT NULL"
  - implies:
      id: intent-to-treat-flag-requires-arm
      when: "ITTFL = 'Y'"
      then: "ARMCD IS NOT NULL"
