yamaa: "1.0"
type: spec
model: SDTM
domain: DM
keys: [STUDYID, USUBJID]
input:
  RAW: {path: input/dm_raw.csv, types: {BRTHYR: int, RFYEAR: int}}

output:
  path: dm.csv
  columns: [DOMAIN, STUDYID, USUBJID, AGE]

columns:
  - name: DOMAIN
    type: str
    label: Domain Abbreviation
    derivation: "'DM'"
    submission:
      core: Req
      role: Identifier
      length: 2
      origins:
        - type: Assigned
          source: Sponsor

  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: RAW.STUDYID
    submission:
      core: Req
      role: Identifier
      length: 8
      origins:
        - type: Protocol
          source: Sponsor

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: RAW.USUBJID
    submission:
      core: Req
      role: Identifier
      length: 12
      origins:
        - type: Assigned
          source: Sponsor

  # The age is computed from two years, yet described as collected by the
  # investigator.
  - name: AGE
    type: int
    label: Age
    derivation: "RAW.RFYEAR - RAW.BRTHYR"
    submission:
      core: Exp
      role: Record Qualifier
      length: 3
      origins:
        - type: Collected
          source: Investigator

submission:
  label: Demographics
  class: SPECIAL PURPOSE
  structure: One record per subject
  repeating: false
