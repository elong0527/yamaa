schema_version: "1.0"
domain: ADAE
keys: [STUDYID, USUBJID, AESEQ]
input:
  AE: input/ae.csv
  ADSL: {path: input/adsl.csv, types: {TRTSDT: date}}
base: AE

output:
  path: adae.csv
  columns: [STUDYID, USUBJID, AESEQ, AETERM, AESTDTC, ASTDT, ASTDTC, ASTDTF,
            TRTSDT, TRTEMFL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: AE.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: AE.USUBJID

  - name: AESEQ
    type: int
    label: Sequence Number
    derivation: AE.AESEQ

  - name: AETERM
    type: str
    label: Reported Term for the Adverse Event
    derivation: AE.AETERM

  - name: AESTDTC
    type: str
    label: Start Date/Time of Adverse Event
    derivation: AE.AESTDTC

  - name: TRTSDT
    type: date
    label: Date of First Exposure to Treatment
    derivation: ADSL.TRTSDT

  # Complete a year-and-month start to the 15th, moved up to first exposure
  # when that falls later in the collected month; an exposure date outside
  # the collected month moves nothing. A year alone, non-date text, or
  # nothing gives no date. (Month precision is the minimum accepted, so no
  # month is ever supplied, and none is written.)
  - name: ASTDT
    type: date
    label: Analysis Start Date
    derivation:
      impute:
        type: date
        source: AESTDTC
        day: 15
        minimum_source_precision: month
        not_before: TRTSDT
        # handlers are explicit: an omitted one is fatal
        invalid: {literal: null}

  - name: ASTDTC
    type: str
    label: Analysis Start Date (C)
    derivation: ASTDT

  # The last day the collected start allows; a supplied day can precede
  # first exposure only when this does too.
  - name: ASTDTL
    type: date
    label: Latest Analysis Start Date Allowed
    derivation:
      impute:
        type: date
        source: AESTDTC
        day: last
        minimum_source_precision: month
        invalid: {literal: null}

  # D: the collected start carried a year and month, so the day was
  # supplied, whether or not first exposure then moved it.
  - name: ASTDTF
    type: str
    label: Analysis Start Date Imputation Flag
    derivation:
      imputation_flag:
        source: ASTDT
        part: date
    verifications:
      - allowed_values:
          values: ["D"]

  - name: TRTEMFL
    type: str
    label: Treatment Emergent Analysis Flag
    derivation:
      flag: "ASTDT >= TRTSDT"
    verifications:
      - allowed_values:
          values: [Y]

verifications:
  - row_count:
      min: 13
      max: 13
  - all_or_none:
      id: analysis-date-completeness
      columns: [ASTDTC, ASTDT]
  - assert:
      id: imputation-flag-requires-an-analysis-date
      when: "ASTDTF IS NOT NULL"
      require: "ASTDT IS NOT NULL"
  - assert:
      id: supplied-day-never-precedes-treatment-start-in-its-month
      when: "ASTDTF = 'D' AND ASTDTL >= TRTSDT"
      require: "ASTDT >= TRTSDT"
  - assert:
      id: treatment-emergent-event-has-an-analysis-date
      when: "TRTEMFL = 'Y'"
      require: "ASTDT IS NOT NULL AND ASTDT >= TRTSDT"
