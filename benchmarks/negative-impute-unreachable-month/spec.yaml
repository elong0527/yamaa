schema_version: "1.0"
domain: ADAE
keys: [STUDYID, USUBJID, AESEQ]
input:
  AE: input/ae.csv
base: AE

output:
  path: adae.csv
  columns: [STUDYID, USUBJID, AESEQ, AETERM, AESTDTC, ASTDT]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: AE.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: AE.USUBJID

  - name: AESEQ
    type: int
    label: Sequence Number
    derivation: AE.AESEQ

  - name: AETERM
    type: str
    label: Reported Term for the Adverse Event
    derivation: AE.AETERM

  - name: AESTDTC
    type: str
    label: Start Date/Time of Adverse Event
    derivation: AE.AESTDTC

  # Complete a year-and-month start to the 15th. Month precision is the
  # minimum accepted, so no source can ever need a month: writing one
  # here is rejected because it is unreachable, before any range is
  # considered.
  - name: ASTDT
    type: date
    label: Analysis Start Date
    derivation:
      date_impute:
        source: AESTDTC
        month: 6
        day: 15
        minimum_source_precision: month
