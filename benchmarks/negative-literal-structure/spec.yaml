yamaa: "1.0"
type: spec
model: ADaM
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  DM: input/dm.csv

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, AGE, AGEGRP]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  - name: AGE
    type: int
    label: Age
    derivation: DM.AGE

  - name: AGEGRP
    type: str
    label: Age Group
    derivation:
      # The first branch's fixed value is written as a mapping, not as one
      # literal value. A mapping in a case result names an operation, and no
      # operation is called group, so the specification is rejected before
      # any data is read. A missing AGE would reach otherwise and get younger.
      case:
        - when: "AGE >= 65"
          then: {group: elderly}
        - otherwise: "'younger'"
