schema_version: "1.0"
domain: VS
keys: [USUBJID, VSDY, VSCAT]
input:
  CLINIC: {path: input/clinic.csv, types: {VSDY: int, SYSBP: int}}
  HOME: {path: input/home.csv, types: {VSDY: int, SYSBP: int}}

output:
  path: vs.csv
  columns: [USUBJID, VSDY, VSCAT, VSSTRESN]

columns:
  - {name: USUBJID, type: str, label: Unique Subject Identifier}
  - {name: VSDY, type: int, label: Study Day of Vital Signs}
  - {name: VSCAT, type: str, label: Category for Vital Signs}

  - name: VSSTRESN
    type: float
    label: Numeric Result/Finding in Standard Units

rows:
  # Each blood pressure measured at a clinic visit.
  - id: clinic
    dataset: CLINIC
    derivations:
      USUBJID: CLINIC.USUBJID
      VSDY: CLINIC.VSDY
      VSCAT: {literal: CLINIC}
      VSSTRESN: CLINIC.SYSBP

  # One record per subject and day from the readings taken at home. Its
  # value is taken from a single reading, which differs between the day's
  # readings, so the specification is rejected before any data is read.
  - id: home
    dataset: HOME
    group_by: [HOME.USUBJID, HOME.VSDY]
    derivations:
      USUBJID: HOME.USUBJID
      VSDY: HOME.VSDY
      VSCAT: {literal: HOME}
      VSSTRESN: HOME.SYSBP
