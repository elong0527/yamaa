lifecycle: reviewed
standard: ADaM
domain: ADSL
review:
  concerns:
    - Analysis population flags depend on dates that must be settled first,
      and the full analysis set flag depends on both the safety and the
      intent-to-treat populations.
    - Seven subjects cover treated and randomized, treated only, randomized
      only, neither, an exposure record with no date, and ages at and around 65.
    - Subject 105, treated but never randomized, is in the safety population but
      not intent-to-treat or the full analysis set, and an exposure record with
      no date does not make a subject treated (subject 107).
