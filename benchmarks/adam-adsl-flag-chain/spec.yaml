schema_version: "1.0"
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  DM: input/dm.csv
  EX: input/ex.csv
base: DM

output:
  path: adsl.csv
  columns: [POPFL, SAFFL, ITTFL, TRTSDT, RANDDT, AGEGR1, AGERNK, STUDYID, USUBJID, AGE]

columns:
  # The earliest exposure start date. MIN skips a missing date, so a subject
  # with no dated exposure record has no TRTSDT.
  - name: TRTSDT
    type: date
    label: Date of First Exposure to Treatment
    derivation:
      aggregate:
        expr: "MIN(EX.EXSTDTC)"

  - name: SAFFL
    type: str
    label: Safety Population Flag
    derivation:
      flag:
        condition: "TRTSDT IS NOT NULL"
        false_value: "N"

  - name: RANDDT
    type: date
    label: Randomization Date
    derivation: DM.RANDDT

  # A working flag, not in the output: ITTFL reads it, so the chain runs
  # RANDDT -> RANDFL -> ITTFL -> POPFL.
  - name: RANDFL
    type: str
    label: Randomized Population Flag
    derivation:
      flag:
        condition: "RANDDT IS NOT NULL"
        false_value: "N"

  - name: ITTFL
    type: str
    label: Intent-to-Treat Population Flag
    derivation:
      flag:
        condition: "RANDFL = 'Y'"
        false_value: "N"

  - name: POPFL
    type: str
    label: Analysis Population Flag
    derivation:
      flag:
        condition: "SAFFL = 'Y' AND ITTFL = 'Y'"
        false_value: "N"

  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  - name: AGE
    type: int
    label: Age
    derivation: DM.AGE

  # 65 itself falls in >=65. With no fallback for a missing AGE, a subject
  # with no age stops the run.
  - name: AGEGR1
    type: str
    label: Pooled Age Group 1
    derivation:
      cut:
        source: AGE
        breaks: [65]
        labels: ["<65", ">=65"]
        right: false

  # 1 for the youngest subject in the study; USUBJID breaks ties.
  - name: AGERNK
    type: int
    label: Pooled Age Group 1 Rank
    derivation:
      row_number:
        window:
          group_by: [STUDYID]
          order_by: [AGE, USUBJID]

verifications:
  - unique:
      columns: [STUDYID, USUBJID]
  - row_count:
      min: 3
      max: 3
  - implies:
      id: analysis-population-requires-both-flags
      when: "POPFL = 'Y'"
      then: "SAFFL = 'Y' AND ITTFL = 'Y'"
