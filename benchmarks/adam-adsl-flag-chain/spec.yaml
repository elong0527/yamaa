yamaa: "1.0"
type: spec
model: ADaM
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  DM: {path: input/dm.csv, types: {RANDDT: date}}
  EX: {path: input/ex.csv, key: [STUDYID, USUBJID]}
base: DM

output:
  path: adsl.csv
  columns: [FASFL, SAFFL, ITTFL, TRTSDT, RANDDT, AGEGR1, STUDYID, USUBJID,
            AGE]

columns:
  # The earliest exposure start date. MIN skips a missing date, so a subject
  # with no dated exposure record has no TRTSDT.
  - name: TRTSDT
    type: date
    label: Date of First Exposure to Treatment
    derivation:
      aggregate: "MIN(EX.EXSTDTC)"

  - name: SAFFL
    type: str
    label: Safety Population Flag
    derivation:
      flag:
        condition: "TRTSDT IS NOT NULL"
        false_value: "N"
        missing: "N"

  - name: RANDDT
    type: date
    label: Randomization Date
    derivation: DM.RANDDT

  # A working flag, not in the output: ITTFL reads it, so the chain runs
  # RANDDT -> RANDFL -> ITTFL -> FASFL.
  - name: RANDFL
    type: str
    label: Randomized Population Flag
    derivation:
      flag:
        condition: "RANDDT IS NOT NULL"
        false_value: "N"
        missing: "N"

  - name: ITTFL
    type: str
    label: Intent-to-Treat Population Flag
    derivation:
      flag:
        condition: "RANDFL = 'Y'"
        false_value: "N"
        missing: "N"

  # The full analysis set: subjects randomized and treated.
  - name: FASFL
    type: str
    label: Full Analysis Set Population Flag
    derivation:
      flag:
        condition: "SAFFL = 'Y' AND ITTFL = 'Y'"
        false_value: "N"
        missing: "N"

  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  - name: AGE
    type: int
    label: Age
    derivation: DM.AGE

  # 65 itself falls in >=65. With no fallback for a missing AGE, a subject
  # with no age stops the run.
  - name: AGEGR1
    type: str
    label: Pooled Age Group 1
    derivation:
      cut:
        source: AGE
        breaks: [65]
        labels: ["<65", ">=65"]

verifications:
  - row_count:
      min: 7
      max: 7
  - assert:
      id: full-analysis-set-requires-both-flags
      when: "FASFL = 'Y'"
      require: "SAFFL = 'Y' AND ITTFL = 'Y'"
