yamaa: "1.0"
type: spec
model: ADaM
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  DM: input/dm.csv

# The run report was meant to sit beside the dataset, but it names the
# dataset's own file, so one save would write both files to one place.
output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, AGE]
  report: adsl.csv

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  - name: AGE
    type: int
    label: Age
    derivation: DM.AGE
