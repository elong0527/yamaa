schema_version: "1.0"
domain: EX
keys: [STUDYID, USUBJID, EXSEQ]

input:
  ODM:
    path: input/odm.csv
    types: {StudyEventRepeatKey: int, FormRepeatKey: int, ItemGroupRepeatKey: int}
  KITLIST: input/kit_list.csv

base: ODM

intermediates:
  # The kit list comes from the IRT system, not the EDC, so it stays a
  # lookup input rather than ODM items.
  - id: KITMAP
    dataset: KITLIST
    key: [KIT]
  # Body weight is collected on the VS form at the same visit. The lookup
  # is keyed at the visit level; the weight item filter is what makes the
  # long-form ODM key unique (the HEIGHT item on the same form is ignored).
  - id: VISITWT
    dataset: ODM
    key_base: [ODM.StudyOID, ODM.SubjectKey, ODM.StudyEventOID]
    key: [StudyOID, SubjectKey, StudyEventOID]
    filter: "ODM.ItemOID = 'IT.VS.WEIGHT'"

rows:
  # One output row per collected EC form. A skipped dose (ECOCCUR = 'N')
  # is filtered before any derivation, so it leaves no exposure record.
  # VS forms group separately and are filtered out the same way.
  - id: administered
    dataset: ODM
    group_by: [ODM.StudyOID, ODM.SubjectKey, ODM.StudyEventOID, ODM.FormOID, ODM.FormRepeatKey]
    filter: "ECOCCUR = 'Y'"
    derivations:
      ECOCCUR:
        aggregate:
          filter: "ODM.FormOID = 'FO.EC' AND ODM.ItemOID = 'IT.EC.ECOCCUR'"
          expr: "ONLY(ODM.Value)"
      FORM:
        aggregate:
          filter: "ODM.FormOID = 'FO.EC' AND ODM.ItemOID = 'IT.EC.FORM'"
          expr: "ONLY(ODM.Value)"
      ECTRT:
        aggregate:
          filter: "ODM.FormOID = 'FO.EC' AND ODM.ItemOID = 'IT.EC.ECTRT'"
          expr: "ONLY(ODM.Value)"
      TABLETS:
        aggregate:
          filter: "ODM.FormOID = 'FO.EC' AND ODM.ItemOID = 'IT.EC.TABLETS'"
          expr: "ONLY(ODM.Value)"
      STRENGTHMG:
        aggregate:
          filter: "ODM.FormOID = 'FO.EC' AND ODM.ItemOID = 'IT.EC.STRENGTHMG'"
          expr: "ONLY(ODM.Value)"
      DOSEMKG:
        aggregate:
          filter: "ODM.FormOID = 'FO.EC' AND ODM.ItemOID = 'IT.EC.DOSEMKG'"
          expr: "ONLY(ODM.Value)"
      AUCTARGET:
        aggregate:
          filter: "ODM.FormOID = 'FO.EC' AND ODM.ItemOID = 'IT.EC.AUCTARGET'"
          expr: "ONLY(ODM.Value)"
      KIT:
        aggregate:
          filter: "ODM.FormOID = 'FO.EC' AND ODM.ItemOID = 'IT.EC.KIT'"
          expr: "ONLY(ODM.Value)"
      ECSTDTC:
        aggregate:
          filter: "ODM.FormOID = 'FO.EC' AND ODM.ItemOID = 'IT.EC.ECSTDTC'"
          expr: "ONLY(ODM.Value)"
      ECENDTC:
        aggregate:
          filter: "ODM.FormOID = 'FO.EC' AND ODM.ItemOID = 'IT.EC.ECENDTC'"
          expr: "ONLY(ODM.Value)"

output:
  path: ex.csv
  columns: [DOMAIN, STUDYID, USUBJID, EXSEQ, EXTRT, EXDOSE, EXDOSU, EXSTDTC, EXENDTC]
  order_by: [STUDYID, USUBJID, EXSEQ]

columns:
  - name: DOMAIN
    type: str
    label: Domain Abbreviation
    derivation: {literal: EX}

  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: ODM.StudyOID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: ODM.SubjectKey

  # Internal working columns are omitted from the output artifact.
  - name: ECOCCUR
    type: str
    label: Occurrence as collected

  - name: FORM
    type: str
    label: Dose form as collected

  - name: ECTRT
    type: str
    label: Treatment as collected

  - name: TABLETS
    type: float
    label: Tablets taken as collected

  - name: STRENGTHMG
    type: float
    label: Tablet strength in mg as collected

  - name: DOSEMKG
    type: float
    label: Dose in mg per kg as collected

  - name: AUCTARGET
    type: float
    label: AUC target as collected

  - name: KIT
    type: str
    label: Kit number as collected

  - name: ECSTDTC
    type: str
    label: Administration start as collected

  - name: ECENDTC
    type: str
    label: Administration end as collected

  - name: FRMREP
    type: int
    label: EC form repeat within the visit
    derivation: ODM.FormRepeatKey

  - name: KIT_TRT
    type: str
    label: Treatment from the kit list
    derivation: KITMAP.TREATMENT

  - name: KIT_DOSE
    type: float
    label: Dose from the kit list
    derivation: KITMAP.DOSE_MG

  - name: WT_KG
    type: float
    label: Visit body weight in kg
    derivation: VISITWT.Value

  - name: EXTRT
    type: str
    label: Name of Treatment
    derivation:
      case:
        - when: "FORM = 'KITDOSE'"
          then: KIT_TRT
        - otherwise: ECTRT
    verifications:
      - not_missing: {}

  - name: EXDOSE
    type: float
    label: Dose
    derivation:
      case:
        - when: "FORM = 'TABLET'"
          then:
            compute:
              expr: "TABLETS * STRENGTHMG"
        - when: "FORM = 'INFUSION'"
          then:
            compute:
              expr: "DOSEMKG * WT_KG"
        - when: "FORM = 'AUCDOSE'"
          then: AUCTARGET
        - otherwise: KIT_DOSE
    verifications:
      - not_missing: {}

  - name: EXDOSU
    type: str
    label: Dose Units
    derivation:
      case:
        - when: "FORM = 'AUCDOSE'"
          then: {literal: AUC}
        - otherwise: {literal: mg}
    verifications:
      allowed_values:
        values: [mg, AUC]

  - name: EXSTDTC
    type: date
    label: Start Date/Time of Treatment
    derivation: ECSTDTC

  - name: EXENDTC
    type: date
    label: End Date/Time of Treatment
    derivation: ECENDTC

  - name: EXSEQ
    type: int
    label: Sequence Number
    derivation:
      row_number:
        window:
          group_by: [STUDYID, USUBJID]
          order_by: [EXSTDTC, FRMREP]

verifications:
  - unique:
      columns: [STUDYID, USUBJID, EXSEQ]
  - row_count:
      min: 6
      max: 6
  - assert:
      id: every-administration-has-dose-and-unit
      expr: "EXDOSE IS NOT NULL AND EXDOSU IS NOT NULL"
  - implies:
      id: placebo-kit-carries-zero-dose
      when: "EXTRT = 'PLACEBO'"
      then: "EXDOSE = 0"
