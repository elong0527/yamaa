schema_version: "1.0"
domain: ADAE
keys: [STUDYID, USUBJID, AESEQ]
input:
  AE: input/ae.csv
  ADSL: {path: input/adsl.csv, types: {TRTSDTM: datetime}}
base: AE

output:
  path: adae.csv
  columns: [STUDYID, USUBJID, AESEQ, AETERM, AESTDTC, TRTSDTM, ASTDTM,
            ASTDTF, ASTTMF]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: AE.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: AE.USUBJID

  - name: AESEQ
    type: int
    label: Sequence Number
    derivation: AE.AESEQ

  - name: AETERM
    type: str
    label: Reported Term for the Adverse Event
    derivation: AE.AETERM

  - name: AESTDTC
    type: str
    label: Start Date/Time of Adverse Event
    derivation: AE.AESTDTC

  - name: TRTSDTM
    type: datetime
    label: Datetime of First Exposure to Treatment
    derivation: ADSL.TRTSDTM

  # Every part the start did not collect takes its earliest value. A start
  # never collected takes first exposure instead, none of which was collected.
  - name: ASTDTM
    type: datetime
    label: Analysis Start Date/Time
    derivation:
      impute:
        type: datetime
        source: AESTDTC
        month: 1
        day: first
        time: first
        fallback: TRTSDTM

  - name: ASTDTF
    type: str
    label: Analysis Start Date Imputation Flag
    derivation:
      imputation_flag:
        source: ASTDTM
        part: date
    verifications:
      allowed_values:
        values: [Y, M, D]

  - name: ASTTMF
    type: str
    label: Analysis Start Time Imputation Flag
    derivation:
      imputation_flag:
        source: ASTDTM
        part: time
    verifications:
      allowed_values:
        values: [H, M, S]

verifications:
  - row_count:
      min: 6
      max: 6
  - assert:
      id: uncollected-start-is-first-exposure
      when: "AESTDTC IS NULL AND TRTSDTM IS NOT NULL"
      require: "ASTDTM = TRTSDTM AND ASTDTF = 'Y' AND ASTTMF = 'H'"
  - assert:
      id: date-flag-y-only-for-an-uncollected-start
      when: "ASTDTF = 'Y'"
      require: "AESTDTC IS NULL"
