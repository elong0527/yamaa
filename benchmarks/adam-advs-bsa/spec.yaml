schema_version: "1.0"
domain: ADVS
keys: [STUDYID, USUBJID, VISIT, PARAMCD]
input:
  ADVS_RAW: {path: input/advs.csv, types: {AVAL: float}}

output:
  path: advs.csv
  columns: [STUDYID, USUBJID, PARAMCD, PARAM, AVAL, VISIT, DTYPE]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: ADVS_RAW.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: ADVS_RAW.USUBJID

  - name: PARAMCD
    type: str
    label: Parameter Code

  - name: PARAM
    type: str
    label: Parameter

  # The visit's height and weight, gathered for the formula. Every row
  # template must set them, so the collected one sets them empty; neither
  # is in the output.
  - name: HEIGHT_VAL
    type: float
    label: Height Value

  - name: WEIGHT_VAL
    type: float
    label: Weight Value

  - name: AVAL
    type: float
    label: Analysis Value

  - name: VISIT
    type: str
    label: Visit Name
    derivation: ADVS_RAW.VISIT

  - name: DTYPE
    type: str
    label: Derivation Type

rows:
  # Every collected record, unchanged.
  - id: collected
    derivations:
      PARAMCD: ADVS_RAW.PARAMCD
      PARAM: ADVS_RAW.PARAM
      HEIGHT_VAL: {literal: null}
      WEIGHT_VAL: {literal: null}
      AVAL: ADVS_RAW.AVAL
      DTYPE: {literal: null}

  # One BSA record per subject and visit that has both a height and a
  # weight result; ONLY() fails if the visit has more than one of either.
  - id: derived_bsa
    group_by: [ADVS_RAW.STUDYID, ADVS_RAW.USUBJID, ADVS_RAW.VISIT]
    filter: "HEIGHT_VAL IS NOT NULL AND WEIGHT_VAL IS NOT NULL"
    derivations:
      PARAMCD: {literal: BSA}
      PARAM: {literal: Body Surface Area (m^2)}
      HEIGHT_VAL:
        aggregate:
          filter: "ADVS_RAW.PARAMCD = 'HEIGHT'"
          expr: "ONLY(ADVS_RAW.AVAL)"
      WEIGHT_VAL:
        aggregate:
          filter: "ADVS_RAW.PARAMCD = 'WEIGHT'"
          expr: "ONLY(ADVS_RAW.AVAL)"
      # Mosteller formula: square root of cm times kg over 3600.
      AVAL:
        compute:
          expr: "SQRT(WEIGHT_VAL * HEIGHT_VAL / 3600)"
      DTYPE: {literal: CALCULATION}

verifications:
  - unique:
      columns: [STUDYID, USUBJID, VISIT, PARAMCD]
  # A collected record never has a DTYPE, so this fails when the input
  # already carries a BSA record.
  - assert:
      id: no-pre-existing-target
      expr: "NOT (PARAMCD = 'BSA' AND DTYPE IS NULL)"
  # The formula assumes centimeters and kilograms, so each height and
  # weight record's parameter label must name that unit.
  - assert:
      id: verify-height-unit
      expr: "PARAMCD <> 'HEIGHT' OR PARAM LIKE '%(cm)%'"
  - assert:
      id: verify-weight-unit
      expr: "PARAMCD <> 'WEIGHT' OR PARAM LIKE '%(kg)%'"
