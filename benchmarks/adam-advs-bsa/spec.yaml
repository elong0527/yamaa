yamaa: "1.0"
type: spec
model: ADaM
domain: ADVS
keys: [STUDYID, USUBJID, VISIT, PARAMCD]
input:
  ADVS_RAW: {path: input/advs.csv, types: {AVAL: float}}

output:
  path: advs.csv
  columns: [STUDYID, USUBJID, PARAMCD, PARAM, AVAL, VISIT]

intermediates:
  # The subject's height result. Height is collected once, so every weight
  # reads it, whatever visit collected it; a subject with more than one
  # height result stops the run rather than choosing one.
  - id: HEIGHT
    dataset: ADVS_RAW
    key: [STUDYID, USUBJID]
    filter: "ADVS_RAW.PARAMCD = 'HEIGHT' AND ADVS_RAW.AVAL IS NOT NULL"

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: ADVS_RAW.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: ADVS_RAW.USUBJID

  - name: PARAMCD
    type: str
    label: Parameter Code

  - name: PARAM
    type: str
    label: Parameter

  # The subject's height, gathered for the formula. Every row template must
  # set it, so the collected one sets it empty; it is not in the output.
  - name: HEIGHT_VAL
    type: float
    label: Height Value

  - name: AVAL
    type: float
    label: Analysis Value

  - name: VISIT
    type: str
    label: Visit Name
    derivation: ADVS_RAW.VISIT

rows:
  # Every collected record, unchanged.
  - id: collected
    derivations:
      PARAMCD: ADVS_RAW.PARAMCD
      PARAM: ADVS_RAW.PARAM
      HEIGHT_VAL: null
      AVAL: ADVS_RAW.AVAL

  # One BSA record per weight result, at the weight's visit, from the
  # subject's height result; a subject with no height result gets none.
  # BSA is a parameter of its own, so it has no derivation type (DTYPE).
  - id: derived_bsa
    filter: "ADVS_RAW.PARAMCD = 'WEIGHT' AND ADVS_RAW.AVAL IS NOT NULL
      AND HEIGHT_VAL IS NOT NULL"
    derivations:
      PARAMCD: "'BSA'"
      PARAM: "'Body Surface Area (m^2)'"
      HEIGHT_VAL: HEIGHT.AVAL
      # Mosteller formula: square root of kg times cm over 3600.
      AVAL: "SQRT(ADVS_RAW.AVAL * HEIGHT_VAL / 3600)"

verifications:
  # 16 collected records plus one BSA record for each of the 7 weight
  # results whose subject has a height result.
  - row_count:
      min: 23
      max: 23
  # A collected record never has the gathered height, so this fails when the
  # input already carries a BSA record.
  - assert:
      id: no-pre-existing-target
      require: "NOT (PARAMCD = 'BSA' AND HEIGHT_VAL IS NULL)"
  # The formula assumes centimeters and kilograms, so each height and
  # weight record's parameter label must name that unit.
  - assert:
      id: verify-height-unit
      require: "PARAMCD <> 'HEIGHT' OR PARAM LIKE '%(cm)%'"
  - assert:
      id: verify-weight-unit
      require: "PARAMCD <> 'WEIGHT' OR PARAM LIKE '%(kg)%'"
