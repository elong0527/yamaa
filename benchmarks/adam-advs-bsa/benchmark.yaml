lifecycle: reviewed
standard: ADaM
domain: ADVS
review:
  concerns:
    - Body surface area by the Mosteller formula is used for dosing and
      normalization, at each visit with a weight, from the height collected
      once per subject.
    - Seven subjects cover weights at three visits, a height from the screening
      visit, weight alone, height alone, a missing weight result, a height with
      no result, and a weight of zero.
    - Every weight uses the subject's one height, so subject 101's week 2 and
      week 4 weights, with no height at those visits, still get a BSA; a
      subject whose height has no result gets none (subject 107), and a zero
      weight gives a BSA of 0 (subject 106).
