yamaa: "1.0"
type: spec
model: SDTM
domain: RELREC
keys: [STUDYID, USUBJID, RDOMAIN, IDVAR, IDVARVAL, RELID]
input:
  AE:
    path: input/ae.csv
    types:
      AESEQ: int
  CM:
    path: input/cm.csv
    types:
      CMSEQ: int

output:
  path: relrec.csv
  columns: [STUDYID, USUBJID, RDOMAIN, IDVAR, IDVARVAL, RELTYPE, RELID]
  order_by: [STUDYID, USUBJID, RELNUM, RDOMAIN]

# The adverse event a medication's first or second event number names: the
# same subject's AE record whose collected AESPID equals it. A number that
# names no event of that subject fails the run.
intermediates:
  - id: AE_REF1
    dataset: AE
    key:
      STUDYID: CM.STUDYID
      USUBJID: CM.USUBJID
      AESPID: CM.CMAENO1
    require_match: true

  - id: AE_REF2
    dataset: AE
    key:
      STUDYID: CM.STUDYID
      USUBJID: CM.USUBJID
      AESPID: CM.CMAENO2
    require_match: true

windows:
  PAIR_ORDER:
    group_by: [STUDYID, USUBJID]
    order_by: [PAIRAE, PAIRCM]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier

  - name: USUBJID
    type: str
    label: Unique Subject Identifier

  - name: RDOMAIN
    type: str
    label: Related Domain Abbreviation

  - name: IDVAR
    type: str
    label: Identifying Variable

  - name: IDVARVAL
    type: str
    label: Identifying Variable Value

  - name: RELTYPE
    type: str
    label: Relationship Type
    derivation: null

  # Internal working columns: the AESEQ and CMSEQ of the pair a row belongs
  # to, carried on both of its rows. Not in output.columns, so they never
  # reach the artifact (SPEC-7).
  - name: PAIRAE
    type: int
    label: Paired Adverse Event Sequence Number

  - name: PAIRCM
    type: int
    label: Paired Medication Sequence Number

  # Pairs numbered within the subject in event, then medication, order; the
  # two rows of one pair tie and share a number.
  - name: RELNUM
    type: int
    label: Relationship Number
    derivation:
      rank:
        method: dense
        window: PAIR_ORDER

  - name: RELID
    type: str
    label: Relationship Identifier
    derivation: RELNUM

# Each populated event number gives one pair: a medication row and an event
# row.
rows:
  - id: cm_reference_1
    dataset: CM
    filter: "CM.CMAENO1 IS NOT NULL"
    derivations:
      STUDYID: CM.STUDYID
      USUBJID: CM.USUBJID
      RDOMAIN: "'CM'"
      IDVAR: "'CMSEQ'"
      IDVARVAL: CM.CMSEQ
      PAIRAE: AE_REF1.AESEQ
      PAIRCM: CM.CMSEQ

  - id: ae_reference_1
    dataset: CM
    filter: "CM.CMAENO1 IS NOT NULL"
    derivations:
      STUDYID: CM.STUDYID
      USUBJID: CM.USUBJID
      RDOMAIN: "'AE'"
      IDVAR: "'AESEQ'"
      IDVARVAL: AE_REF1.AESEQ
      PAIRAE: AE_REF1.AESEQ
      PAIRCM: CM.CMSEQ

  - id: cm_reference_2
    dataset: CM
    filter: "CM.CMAENO2 IS NOT NULL"
    derivations:
      STUDYID: CM.STUDYID
      USUBJID: CM.USUBJID
      RDOMAIN: "'CM'"
      IDVAR: "'CMSEQ'"
      IDVARVAL: CM.CMSEQ
      PAIRAE: AE_REF2.AESEQ
      PAIRCM: CM.CMSEQ

  - id: ae_reference_2
    dataset: CM
    filter: "CM.CMAENO2 IS NOT NULL"
    derivations:
      STUDYID: CM.STUDYID
      USUBJID: CM.USUBJID
      RDOMAIN: "'AE'"
      IDVAR: "'AESEQ'"
      IDVARVAL: AE_REF2.AESEQ
      PAIRAE: AE_REF2.AESEQ
      PAIRCM: CM.CMSEQ

verifications:
  - row_count:
      min: 10
      max: 10
  # Every relationship pairs one medication with one event.
  - row_count:
      id: each-relationship-has-two-rows
      group_by: [STUDYID, USUBJID, RELID]
      min: 2
      max: 2
