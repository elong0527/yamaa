schema_version: "1.0"
domain: RELREC
keys: [STUDYID, USUBJID, RDOMAIN, IDVAR, IDVARVAL, RELID]
input:
  AE:
    path: input/ae.csv
    types:
      AESEQ: int
  CM:
    path: input/cm.csv
    types:
      CMSEQ: int

output:
  path: relrec.csv
  columns: [STUDYID, USUBJID, RDOMAIN, IDVAR, IDVARVAL, RELTYPE, RELID]
  order_by: [STUDYID, USUBJID, RELID, RDOMAIN, SEQNUM]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier

  - name: USUBJID
    type: str
    label: Unique Subject Identifier

  - name: RDOMAIN
    type: str
    label: Related Domain Abbreviation

  - name: IDVAR
    type: str
    label: Identifying Variable

  - name: IDVARVAL
    type: str
    label: Identifying Variable Value

  - name: RELTYPE
    type: str
    label: Relationship Type
    derivation: {literal: null}

  - name: RELID
    type: str
    label: Relationship Identifier

  # Internal working column: the sequence number as a number, so the
  # output order puts sequence 10 after 2 instead of before it. Not in
  # output.columns, so it never reaches the artifact (REQ-0205).
  - name: SEQNUM
    type: int
    label: Numeric Sequence Number

rows:
  - id: ae_link_1
    dataset: AE
    filter: "AE.AELNKID1 IS NOT NULL"
    derivations:
      STUDYID: AE.STUDYID
      USUBJID: AE.USUBJID
      RDOMAIN: {literal: AE}
      IDVAR: {literal: AESEQ}
      IDVARVAL: AE.AESEQ
      RELID: AE.AELNKID1
      SEQNUM: AE.AESEQ

  - id: ae_link_2
    dataset: AE
    filter: "AE.AELNKID2 IS NOT NULL"
    derivations:
      STUDYID: AE.STUDYID
      USUBJID: AE.USUBJID
      RDOMAIN: {literal: AE}
      IDVAR: {literal: AESEQ}
      IDVARVAL: AE.AESEQ
      RELID: AE.AELNKID2
      SEQNUM: AE.AESEQ

  - id: cm_link_1
    dataset: CM
    filter: "CM.CMLNKID1 IS NOT NULL"
    derivations:
      STUDYID: CM.STUDYID
      USUBJID: CM.USUBJID
      RDOMAIN: {literal: CM}
      IDVAR: {literal: CMSEQ}
      IDVARVAL: CM.CMSEQ
      RELID: CM.CMLNKID1
      SEQNUM: CM.CMSEQ

  - id: cm_link_2
    dataset: CM
    filter: "CM.CMLNKID2 IS NOT NULL"
    derivations:
      STUDYID: CM.STUDYID
      USUBJID: CM.USUBJID
      RDOMAIN: {literal: CM}
      IDVAR: {literal: CMSEQ}
      IDVARVAL: CM.CMSEQ
      RELID: CM.CMLNKID2
      SEQNUM: CM.CMSEQ

verifications:
  - unique:
      columns: [STUDYID, USUBJID, RDOMAIN, IDVAR, IDVARVAL, RELID]
  - row_count:
      min: 8
      max: 8
  # A relationship with only one member is a dangling link number: the
  # implies check this replaces could never fail (RDOMAIN/IDVAR are
  # literals, IDVARVAL/RELID are non-missing keys), while this check
  # fails the run when a link number is carried by only one record.
  - row_count:
      id: each-relationship-has-two-or-more-rows
      group_by: [STUDYID, USUBJID, RELID]
      min: 2
