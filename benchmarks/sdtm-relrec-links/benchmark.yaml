lifecycle: reviewed
standard: SDTM
domain: RELREC
review:
  concerns:
    - RELREC records which medications were given for which adverse events,
      so a reviewer can see the treatment behind each event.
    - The link is entered on the medication form only, as event numbers that
      name the same subject's AESPID; two subjects cover one medication for
      two events, two medications for one event, unlinked records, and event
      number 1 reused by a second subject.
    - An event row carries the matched record's AESEQ, not the collected
      event number (subject 0001's AESPID 2 is AESEQ 1), and RELID numbers
      the pairs in event, then medication, order.
