schema_version: "1.0"
domain: ADVS
keys: [STUDYID, USUBJID, PARAMCD, VSSEQ]
input:
  ADVS_RAW: {path: input/advs_raw.csv, types: {ADT: date}}

output:
  path: advs.csv
  columns: [STUDYID, USUBJID, PARAMCD, VSSEQ, VISIT, VISITNUM, ADT, ADY, AVAL,
            AVISIT, AVISITN, ANL01FL]

intermediates:
  # Collected coverage of a planned window: the collected record with the
  # highest sequence number whose study day falls in the window, resolved
  # over the completed collected rows. A record with no study day belongs
  # to no window, so it never counts as coverage. The open-ended
  # POST-TREATMENT window never gets an expected record, so it has no
  # coverage intermediate.
  - id: SCREENING_COVER
    dataset: SELF
    key: {STUDYID: ADVS_RAW.STUDYID, USUBJID: ADVS_RAW.USUBJID,
          PARAMCD: ADVS_RAW.PARAMCD}
    filter: "SELF.AVISIT = 'SCREENING'"
    order_by: [SELF.VSSEQ]
    keep: last
    no_match: null

  - id: BASELINE_COVER
    dataset: SELF
    key: {STUDYID: ADVS_RAW.STUDYID, USUBJID: ADVS_RAW.USUBJID,
          PARAMCD: ADVS_RAW.PARAMCD}
    filter: "SELF.AVISIT = 'BASELINE'"
    order_by: [SELF.VSSEQ]
    keep: last
    no_match: null

  - id: WEEK2_COVER
    dataset: SELF
    key: {STUDYID: ADVS_RAW.STUDYID, USUBJID: ADVS_RAW.USUBJID,
          PARAMCD: ADVS_RAW.PARAMCD}
    filter: "SELF.AVISIT = 'WEEK 2'"
    order_by: [SELF.VSSEQ]
    keep: last
    no_match: null

  - id: WEEK4_COVER
    dataset: SELF
    key: {STUDYID: ADVS_RAW.STUDYID, USUBJID: ADVS_RAW.USUBJID,
          PARAMCD: ADVS_RAW.PARAMCD}
    filter: "SELF.AVISIT = 'WEEK 4'"
    order_by: [SELF.VSSEQ]
    keep: last
    no_match: null

  # The completed record with the highest sequence number for the study,
  # subject, and parameter, so each expected record continues the
  # numbering past the records already built.
  - id: PRIOR_MAX
    dataset: SELF
    key: {STUDYID: ADVS_RAW.STUDYID, USUBJID: ADVS_RAW.USUBJID,
          PARAMCD: ADVS_RAW.PARAMCD}
    order_by: [SELF.VSSEQ]
    keep: last
    no_match: null

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: ADVS_RAW.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: ADVS_RAW.USUBJID

  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation: ADVS_RAW.PARAMCD

  - name: VSSEQ
    type: int
    label: Sequence Number
    derivation: ADVS_RAW.VSSEQ

  - name: VISIT
    type: str
    label: Visit Name
    derivation: ADVS_RAW.VISIT

  - name: VISITNUM
    type: float
    label: Visit Number
    derivation: ADVS_RAW.VISITNUM

  - name: ADT
    type: date
    label: Analysis Date
    derivation: ADVS_RAW.ADT

  - name: ADY
    type: int
    label: Analysis Relative Day
    derivation: ADVS_RAW.ADY

  - name: AVAL
    type: float
    label: Analysis Value
    derivation: ADVS_RAW.AVAL

  # Windows on study day, each including its lower break and excluding its
  # upper one: before 0 SCREENING, 0-1 BASELINE (there is no day 0), 2-21
  # WEEK 2, 22-42 WEEK 4, 43 onward POST-TREATMENT. No study day, no window.
  - name: AVISIT
    type: str
    label: Analysis Visit
    derivation:
      cut:
        source: ADY
        breaks: [0, 2, 22, 43]
        labels: [SCREENING, BASELINE, WEEK 2, WEEK 4, POST-TREATMENT]
        right: false
        missing: null
    verifications:
      allowed_values:
        values: [SCREENING, BASELINE, WEEK 2, WEEK 4, POST-TREATMENT]

  - name: AVISITN
    type: int
    label: Analysis Visit (N)
    derivation:
      mapping:
        source: AVISIT
        dict:
          SCREENING: -1
          BASELINE: 0
          WEEK 2: 2
          WEEK 4: 4
          POST-TREATMENT: 99
        missing: null

  # The covering collected record's sequence number for the planned
  # window a row template is building; missing when no collected
  # record's study day covers the window. Internal: it gates emission of
  # expected records and never reaches the artifact.
  - name: WINDOW_COVERED
    type: int
    label: Covering Collected Sequence Number

  # Within each subject, parameter, and window: earliest study day first,
  # then the lower sequence number. ANL01FL marks rank 1; a record with no
  # window is left out, so it is never flagged.
  - name: AWRANK
    type: int
    label: Analysis Window Rank
    derivation:
      row_number:
        window:
          group_by: [STUDYID, USUBJID, PARAMCD, AVISIT]
          order_by: [ADY, VSSEQ]
          filter: "AVISIT IS NOT NULL"

  # Expected records have no study day, so the flag additionally requires
  # one: an expected record never takes ANL01FL, even when it is the only
  # record in its window.
  - name: ANL01FL
    type: str
    label: Analysis Record Flag 01
    derivation:
      flag: "AWRANK = 1 AND ADY IS NOT NULL"

rows:
  # Every collected record, unchanged. The internal coverage column is
  # meaningless here, so it stays missing.
  - id: collected
    dataset: ADVS_RAW
    derivations:
      WINDOW_COVERED: {literal: null}

  # One template per planned visit. Each builds at most one record per
  # study, subject, and parameter: the expected record for a window no
  # collected record's study day covers. The record carries the planned
  # visit name and number and the window, continues the sequence
  # numbering, and has no date, day, or value.
  - id: expected_screening
    dataset: ADVS_RAW
    group_by: [ADVS_RAW.STUDYID, ADVS_RAW.USUBJID, ADVS_RAW.PARAMCD]
    filter: "WINDOW_COVERED IS NULL"
    derivations:
      STUDYID: ADVS_RAW.STUDYID
      USUBJID: ADVS_RAW.USUBJID
      PARAMCD: ADVS_RAW.PARAMCD
      VSSEQ:
        compute:
          expr: "PRIOR_MAX.VSSEQ + 1"
      VISIT: {literal: SCREENING}
      VISITNUM: {literal: 1}
      ADT: {literal: null}
      ADY: {literal: null}
      AVAL: {literal: null}
      AVISIT: {literal: SCREENING}
      AVISITN: {literal: -1}
      WINDOW_COVERED: SCREENING_COVER.VSSEQ

  - id: expected_baseline
    dataset: ADVS_RAW
    group_by: [ADVS_RAW.STUDYID, ADVS_RAW.USUBJID, ADVS_RAW.PARAMCD]
    filter: "WINDOW_COVERED IS NULL"
    derivations:
      STUDYID: ADVS_RAW.STUDYID
      USUBJID: ADVS_RAW.USUBJID
      PARAMCD: ADVS_RAW.PARAMCD
      VSSEQ:
        compute:
          expr: "PRIOR_MAX.VSSEQ + 1"
      VISIT: {literal: BASELINE}
      VISITNUM: {literal: 2}
      ADT: {literal: null}
      ADY: {literal: null}
      AVAL: {literal: null}
      AVISIT: {literal: BASELINE}
      AVISITN: {literal: 0}
      WINDOW_COVERED: BASELINE_COVER.VSSEQ

  - id: expected_week2
    dataset: ADVS_RAW
    group_by: [ADVS_RAW.STUDYID, ADVS_RAW.USUBJID, ADVS_RAW.PARAMCD]
    filter: "WINDOW_COVERED IS NULL"
    derivations:
      STUDYID: ADVS_RAW.STUDYID
      USUBJID: ADVS_RAW.USUBJID
      PARAMCD: ADVS_RAW.PARAMCD
      VSSEQ:
        compute:
          expr: "PRIOR_MAX.VSSEQ + 1"
      VISIT: {literal: WEEK 2}
      VISITNUM: {literal: 3}
      ADT: {literal: null}
      ADY: {literal: null}
      AVAL: {literal: null}
      AVISIT: {literal: WEEK 2}
      AVISITN: {literal: 2}
      WINDOW_COVERED: WEEK2_COVER.VSSEQ

  - id: expected_week4
    dataset: ADVS_RAW
    group_by: [ADVS_RAW.STUDYID, ADVS_RAW.USUBJID, ADVS_RAW.PARAMCD]
    filter: "WINDOW_COVERED IS NULL"
    derivations:
      STUDYID: ADVS_RAW.STUDYID
      USUBJID: ADVS_RAW.USUBJID
      PARAMCD: ADVS_RAW.PARAMCD
      VSSEQ:
        compute:
          expr: "PRIOR_MAX.VSSEQ + 1"
      VISIT: {literal: WEEK 4}
      VISITNUM: {literal: 4}
      ADT: {literal: null}
      ADY: {literal: null}
      AVAL: {literal: null}
      AVISIT: {literal: WEEK 4}
      AVISITN: {literal: 4}
      WINDOW_COVERED: WEEK4_COVER.VSSEQ

verifications:
  - unique:
      columns: [STUDYID, USUBJID, PARAMCD, VSSEQ]
  # Pins the 19-row fixture: the 14 original collected rows, the new
  # subject's collected baseline record, and the four expected records
  # (one uncovered screening window and one subject missing screening,
  # week 2, and week 4).
  - row_count:
      min: 19
      max: 19
  - all_or_none:
      id: analysis-visit-completeness
      columns: [AVISIT, AVISITN]
  - implies:
      id: analysis-record-has-analysis-visit
      when: "ANL01FL = 'Y'"
      then: "AVISIT IS NOT NULL AND ADY IS NOT NULL"
  - implies:
      id: baseline-window-is-study-day-one
      when: "AVISIT = 'BASELINE'"
      then: "ADY = 1 OR (ADY IS NULL AND ADT IS NULL AND AVAL IS NULL)"
  # A record with no date, day, or value is an expected record: it carries
  # a planned window (never the open-ended post-treatment one) and never
  # takes the analysis flag.
  - implies:
      id: expected-record-has-planned-window
      when: "ADT IS NULL AND ADY IS NULL AND AVAL IS NULL"
      then: "AVISIT IN ('SCREENING', 'BASELINE', 'WEEK 2', 'WEEK 4')"
  - implies:
      id: expected-record-never-flagged
      when: "ADT IS NULL AND ADY IS NULL AND AVAL IS NULL"
      then: "ANL01FL IS NULL"
  # Every collected measurement has a value; expected records carry none.
  - implies:
      id: collected-record-has-value
      when: "ADT IS NOT NULL OR ADY IS NOT NULL OR AVAL IS NOT NULL"
      then: "AVAL IS NOT NULL"
