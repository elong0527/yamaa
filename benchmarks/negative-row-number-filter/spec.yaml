schema_version: "1.0"
domain: ADLB
keys: [STUDYID, USUBJID, LBSEQ]
input:
  LB: input/lb.csv

output:
  path: adlb.csv
  columns: [STUDYID, USUBJID, LBSEQ, LBSTRESN, VISITSEQ]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: LB.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: LB.USUBJID

  - name: LBSEQ
    type: int
    label: Sequence Number
    derivation: LB.LBSEQ

  - name: LBSTRESN
    type: float
    label: Numeric Result
    derivation: LB.LBSTRESN

  # The defect: the window filter is the number 7 rather than a condition,
  # so the specification is rejected before any data is read.
  - name: VISITSEQ
    type: int
    label: Visit Sequence
    derivation:
      row_number:
        window:
          group_by: [STUDYID, USUBJID]
          order_by: [LBSEQ]
          filter: 7
