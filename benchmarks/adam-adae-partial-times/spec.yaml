schema_version: "1.0"
domain: ADAE
keys: [STUDYID, USUBJID, AESEQ]
input:
  AE: input/ae.csv
base: AE

output:
  path: adae.csv
  columns: [STUDYID, USUBJID, AESEQ, AETERM, AESTDTC, ASTDTM, ASTTMF,
            AEENDTC, AENDTM, AENTMF]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: AE.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: AE.USUBJID

  - name: AESEQ
    type: int
    label: Sequence Number
    derivation: AE.AESEQ

  - name: AETERM
    type: str
    label: Reported Term for the Adverse Event
    derivation: AE.AETERM

  - name: AESTDTC
    type: str
    label: Start Date/Time of Adverse Event
    derivation: AE.AESTDTC

  - name: AEENDTC
    type: str
    label: End Date/Time of Adverse Event
    derivation: AE.AEENDTC

  # Time parts the start did not collect take their earliest value. A start
  # cut off before its day, or never collected, gives no analysis start.
  - name: ASTDTM
    type: datetime
    label: Analysis Start Date/Time
    derivation:
      impute:
        type: datetime
        source: AESTDTC
        minimum_source_precision: day
        time: first
        # handlers are explicit: an omitted one is fatal
        invalid: {literal: null}

  # The flag names the first imputed part: a date alone imputes the hour
  # first (H), a time collected to the hour imputes the minutes first
  # (M), a time collected to the minute imputes only the seconds (S).
  - name: ASTTMF
    type: str
    label: Analysis Start Time Imputation Flag
    derivation:
      imputation_flag:
        source: ASTDTM
        part: time
    verifications:
      allowed_values:
        values: [H, M, S]

  # The end is completed the same way with the latest value of each part.
  - name: AENDTM
    type: datetime
    label: Analysis End Date/Time
    derivation:
      impute:
        type: datetime
        source: AEENDTC
        minimum_source_precision: day
        time: last
        invalid: {literal: null}

  - name: AENTMF
    type: str
    label: Analysis End Time Imputation Flag
    derivation:
      imputation_flag:
        source: AENDTM
        part: time
    verifications:
      allowed_values:
        values: [H, M, S]

verifications:
  - row_count:
      min: 9
      max: 9
  - assert:
      id: start-flag-requires-an-analysis-start
      when: "ASTTMF IS NOT NULL"
      require: "ASTDTM IS NOT NULL"
  - assert:
      id: end-flag-requires-an-analysis-end
      when: "AENTMF IS NOT NULL"
      require: "AENDTM IS NOT NULL"
