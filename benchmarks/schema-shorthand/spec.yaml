schema_version: "1.0"
domain: ADSL
keys: [USUBJID]
# A bare path names an input read as stored. The weight file is written
# out in full because it also types two of its fields.
input:
  DM: input/dm.csv
  WT: {path: input/wt.csv, types: {WTSEQ: int, WT: float}}
base: DM

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, SEX, AGE, AGE65FL, SUBJLBL, WTMAX, LASTWT]

intermediates:
  # The subject's latest dated weight record. A bare ordering value sorts
  # earliest-first, so the last record kept is the latest one. A key of
  # one column is still written as a list.
  - id: LAST_WT
    dataset: WT
    key: [USUBJID]
    order_by: [WT.WTDTC]
    keep: last
    require_match: true

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: {literal: YAMAA-01}

  # A bare string reads the named column.
  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  # One check is still written as a one-check list.
  - name: SEX
    type: str
    label: Sex
    derivation: DM.SEX
    verifications:
      - not_missing: {}

  # The collected text converts once, to the column's integer type.
  - name: AGE
    type: int
    label: Age
    derivation: DM.AGE

  # A lone condition is the common yes-answer flag: Y when true, blank
  # when false or unknown, with no explicit answers written.
  - name: AGE65FL
    type: str
    label: Age 65 or Older Flag
    derivation:
      flag: "AGE >= 65"

  # A lone template string fills its placeholders from the current row.
  - name: SUBJLBL
    type: str
    label: Subject Label
    derivation:
      str_template: "Subject {USUBJID} ({SEX})"

  # A lone summary formula reduces the subject's weight records, matched
  # on the output key the weight file also carries.
  - name: WTMAX
    type: float
    label: Maximum Collected Weight
    derivation:
      aggregate: "MAX(WT.WT)"

  # Read off the selected latest weight record.
  - name: LASTWT
    type: float
    label: Latest Collected Weight
    derivation: LAST_WT.WT

# A plain list names the columns a uniqueness check covers.
verifications:
  - unique: [SUBJLBL]
