yamaa: "1.0"
type: spec
model: SDTM
domain: VS
keys: [STUDYID, USUBJID, VSSEQ]
input:
  VS_RAW: input/vs_raw.csv
  SE: {path: input/se.csv, types: {SESTDTC: datetime, SEENDTC: datetime}}
base: VS_RAW

output:
  path: vs.csv
  columns: [DOMAIN, STUDYID, USUBJID, VSSEQ, VSTESTCD, VSORRES, VSDTC, EPOCH]

# EPOCH comes from the subject's own elements: the element in progress at
# the collection date-time, i.e. the SE record whose start is on or before
# it and whose end is on or after it. The between narrows the subject's
# elements to the ones containing the moment; on a boundary shared by two
# elements (both endpoints are inclusive) order_by/keep: last picks the
# later element, so a reading exactly at an element's start belongs to
# that element. A reading outside every element, or one with no usable
# collection date, matches no element and EPOCH stays missing.
intermediates:
  - id: ELEM
    dataset: SE
    key: [STUDYID, USUBJID]
    between:
      value: VSDTM
      lower: SESTDTC
      upper: SEENDTC
    order_by: [SE.SESTDTC]
    keep: last

  # A reading collected as a date alone is compared by date: the element
  # whose start date is on or before that date and whose end date is on or
  # after it. On a date shared by two elements, the later element wins, as
  # it does on a shared boundary moment.
  - id: SE_DAY
    dataset: SE
    key: [STUDYID, USUBJID]
    between:
      value: VSDAY
      lower: SESTDT
      upper: SEENDT
    order_by: [SE.SESTDTC]
    keep: last
    derivations:
      SESTDT: {to_date: {source: SESTDTC}}
      SEENDT: {to_date: {source: SEENDTC}}

columns:
  - name: DOMAIN
    type: str
    label: Domain Abbreviation
    derivation: "'VS'"
    submission:
      core: Req
      role: Identifier
      length: 2
      origins:
        - type: Assigned
          source: Sponsor

  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: VS_RAW.STUDYID
    submission:
      core: Req
      role: Identifier
      length: 20
      origins:
        - type: Protocol
          source: Sponsor

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: VS_RAW.USUBJID
    submission:
      core: Req
      role: Identifier
      length: 30
      origins:
        - type: Assigned
          source: Sponsor

  - name: VSSEQ
    type: int
    label: Sequence Number
    derivation: VS_RAW.VSSEQ
    submission:
      core: Req
      role: Identifier
      length: 8
      origins:
        - type: Assigned
          source: Sponsor

  - name: VSTESTCD
    type: str
    label: Vital Signs Test Short Name
    derivation: VS_RAW.VSTESTCD
    submission:
      core: Req
      role: Topic
      length: 8
      origins:
        - type: Assigned
          source: Sponsor

  # The result and its date-time are recorded on the case report form. Under
  # the project's Other context, their reference to the annotated form is
  # derived and names no page.
  - name: VSORRES
    type: str
    label: Result or Finding in Original Units
    derivation: VS_RAW.VSORRES
    submission:
      core: Exp
      role: Result Qualifier
      length: 20
      origins:
        - type: Collected
          source: Investigator

  # Collected to the minute, the day or the month, so a partial date-time.
  - name: VSDTC
    type: str
    label: Date/Time of Measurements
    derivation: VS_RAW.VSDTC
    submission:
      core: Exp
      role: Timing
      data_type: partialDatetime
      origins:
        - type: Collected
          source: Investigator

  # The element lookup compares moments, so a collected date-time becomes a
  # datetime. A date alone names a day, not a moment, so it converts to no
  # value rather than taking an invented time of day, as a missing or
  # partial date does.
  - name: VSDTM
    type: datetime
    label: Date/Time of Measurements as a Moment
    derivation:
      value: VSDTC
      unconvertible: null

  # The collection date of a reading that has no time, for the comparison
  # by date; a reading with a time, or a partial or missing date, has none.
  - name: VSDAY
    type: date
    label: Date of Measurements Collected Without a Time
    derivation:
      case:
        - when: "VSDTM IS NULL"
          then:
            to_date: {source: VSDTC}

  - name: EPOCH
    type: str
    label: Epoch
    derivation:
      first_available:
        sources: [ELEM.EPOCH, SE_DAY.EPOCH]
    submission:
      core: Perm
      role: Timing
      length: 10
      codelist: EPOCH
      origins:
        - type: Derived
          source: Sponsor
      method: Take EPOCH from the last SE record matching on STUDYID and
        USUBJID, where VSDTM falls within SESTDTC to SEENDTC, ordered by
        SE.SESTDTC. A reading collected as a date without a time is matched
        by date instead, where the date falls within the start and end dates
        of SESTDTC and SEENDTC. No match yields blank.

verifications:
  - row_count:
      min: 10
      max: 10
  - assert:
      id: missing-date-means-missing-epoch
      when: "VSDTC IS NULL"
      require: "EPOCH IS NULL"

submission:
  label: Vital Signs
  class: FINDINGS
  structure: One record per vital signs measurement
  repeating: true
