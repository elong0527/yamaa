schema_version: "1.0"
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  DM: input/dm.csv

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, AGE]
  warning_log: adsl-violations.csv

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  # A warning, not an error: an age outside 18 to 100 stays in the output
  # and its subject is listed in the review log instead of stopping the run.
  - name: AGE
    type: int
    label: Age
    derivation: DM.AGE
    verifications:
      - range:
          min: 18
          max: 100
          severity: warning
