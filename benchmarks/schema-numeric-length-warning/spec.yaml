yamaa: "1.0"
type: spec
model: SDTM
domain: DM
keys: [STUDYID, USUBJID]
input:
  DM_RAW: input/dm_raw.csv

output:
  path: dm.csv
  columns: [STUDYID, USUBJID, AGE]
  # The warning's line in the run report names the ages wider than the
  # declared length, which needs a report file.
  report: dm-checks.csv

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM_RAW.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM_RAW.USUBJID

  # Described as one digit wide, though the study collects ages of two
  # digits. The run still succeeds, and reports the ages the declared
  # length understates.
  - name: AGE
    type: int
    label: Age
    derivation: DM_RAW.AGE
    submission:
      core: Exp
      length: 1
      origins:
        - type: Collected
          source: Investigator

submission:
  label: Demographics
  class: SPECIAL PURPOSE
  structure: One record per subject
  repeating: false
