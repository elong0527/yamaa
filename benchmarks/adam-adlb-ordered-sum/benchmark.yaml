lifecycle: reviewed
standard: ADaM
domain: ADLB
review:
  concerns:
    - Totals built from components must be reproducible to the last digit, and
      floating-point addition depends on the order of the terms.
    - Five subjects cover components stored in ascending and descending order, a
      single component, a missing component, and all components missing.
    - The same values total 0.6000000000000001 in one stored order and 0.6 in
      the other (subjects 101 and 102), which a reviewer may question, and a
      visit with no results gets an empty total rather than zero.
