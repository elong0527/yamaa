schema_version: "1.0"
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  DM: input/dm.csv

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, DTHDT, LSTVSDY, FSTALVDT]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  - name: DTHDT
    type: date
    label: Date of Death
    derivation: DM.DTHDTC

  - name: LSTVSDY
    type: int
    label: Last Visit Study Day
    derivation: DM.LSTVSDY

  # DTHDT is a date and LSTVSDY a count of days, which have no common
  # order, so the specification is rejected before any data is read.
  - name: FSTALVDT
    type: date
    label: First Known Alive Date
    derivation:
      least:
        sources: [DTHDT, LSTVSDY]
