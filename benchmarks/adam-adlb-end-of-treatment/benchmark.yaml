lifecycle: draft
standard: ADaM
domain: ADLB
review:
  concerns:
    - End-of-treatment lab summaries use the protocol's endpoint record where
      one is marked, and otherwise the last visit.
    - Five subjects cover an endpoint qualifier before the last visit, other
      qualifiers, an endpoint qualifier for a record that does not exist, an
      endpoint record with no result, and single-record groups.
    - The endpoint qualifier wins even when a later visit exists (subject 101's
      albumin at visit 2) and even when its result is missing (subject 104),
      matched through the space-padded sequence text in SUPPLB.
