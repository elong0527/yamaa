schema_version: "1.0"
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  SOURCE: input/adsl.csv

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, DOBTC, DTM, REFDT, DOB_FIRST,
    DOB_LAST, DOB_PREC_TX, DOB_PREC_DT, DTMDT, DOBDY]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: SOURCE.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: SOURCE.USUBJID

  - name: DOBTC
    type: str
    label: Date of Birth (Collected Text)
    derivation: SOURCE.DOBTC

  # The input has no declared types, so the assessment moment and the
  # reference date arrive as text; the column types convert them.
  - name: DTM
    type: datetime
    label: Datetime of Assessment
    derivation: SOURCE.DTMSTR

  - name: REFDT
    type: date
    label: Reference Start Date
    derivation: SOURCE.REFDTSTR

  # Year-only text gets June and the first day; year-month text gets the
  # first day; a full date is returned unchanged. Blank text or text that
  # is not a date gives a missing date. `year` is the default minimum and
  # is what lets a year alone receive both a month and a day.
  - name: DOB_FIRST
    type: date
    label: Date of Birth Completed to First Day
    derivation:
      date_impute:
        source: DOBTC
        month: 6
        day: first
        minimum_source_precision: year
        missing: null
        invalid: null

  # The same completion, to the last day of the month the date lands in
  # (28 or 29 in a February, by year).
  - name: DOB_LAST
    type: date
    label: Date of Birth Completed to Last Day
    derivation:
      date_impute:
        source: DOBTC
        month: 6
        day: last
        minimum_source_precision: year
        missing: null
        invalid: null

  # Y, M or D: how much of a date the collected text carries.
  - name: DOB_PREC_TX
    type: str
    label: Date of Birth Precision From Text
    derivation:
      date_precision:
        source: DOBTC
        missing: null
        invalid: null

  # The completed date keeps the precision of the text it came from, so
  # this reads the same code as DOB_PREC_TX. A date value is never invalid
  # text, so only the missing case needs an answer.
  - name: DOB_PREC_DT
    type: str
    label: Date of Birth Precision From Date
    derivation:
      date_precision:
        source: DOB_FIRST
        missing: null

  - name: DTMDT
    type: date
    label: Date of Assessment
    derivation:
      to_date:
        source: DTM

  # CDISC study day: REFDT is day 1, the day before it is -1 (no day 0).
  # Missing when either date is missing.
  - name: DOBDY
    type: int
    label: Study Day of Birth Completion
    derivation:
      study_day:
        date: DOB_FIRST
        reference: REFDT

verifications:
  - unique:
      columns: [STUDYID, USUBJID]
  - row_count:
      min: 5
      max: 5
