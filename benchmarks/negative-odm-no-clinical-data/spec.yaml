yamaa: "1.0"
type: spec
model: SDTM
domain: DM
keys: [STUDYID, USUBJID]
input:
  # A study-design export, which holds no collected data.
  ODM: input/odm.xml

output:
  path: dm.csv
  columns: [STUDYID, DOMAIN, USUBJID, SEX]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: ODM.StudyOID

  - name: DOMAIN
    type: str
    label: Domain Abbreviation
    derivation: "'DM'"

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: {str_template: "{ODM.StudyOID}-{ODM.SubjectKey}"}

  - name: SEX
    type: str
    label: Sex
    derivation: {odm: ODM.IT.DM.SEX}
