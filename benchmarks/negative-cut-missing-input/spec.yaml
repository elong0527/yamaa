schema_version: "1.0"
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  DM: input/dm.csv

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, AGEGRP]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  # The age read as a number, which the banding below needs.
  - name: AGE
    type: int
    label: Age
    derivation: DM.AGE

  # Below 65 is younger, 65 and over elderly. No band is stated for a missing
  # AGE, so a subject with no recorded age stops the run.
  - name: AGEGRP
    type: str
    label: Age Group
    derivation:
      cut:
        source: AGE
        breaks: [65]
        labels: [younger, elderly]
