yamaa: "1.0"
type: spec
model: ADaM
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  DM: {path: input/dm.csv, types: {RFXSTDTC: date}}
  DS: {path: input/ds.csv, types: {DSSEQ: int}, key: [STUDYID, USUBJID]}
base: DM

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, EOSDT, EOSREAS, EOSSTT, DCSREAS, EOTDT, EOTSTT,
            DCTREAS, DCTREASP]

# The subject's last study and last treatment disposition records: latest
# DSSTDTC, then higher DSSEQ on the same day. An undated record sorts first,
# so it is the last record only when the subject has no dated one. Treatment
# records carry EPOCH = 'TREATMENT'; study disposition lives on the other
# epochs and never counts for treatment.
intermediates:
  - id: LASTSTUDY
    dataset: DS
    key: [STUDYID, USUBJID]
    filter: "DS.DSCAT = 'DISPOSITION EVENT' AND DS.EPOCH <> 'TREATMENT'"
    order_by: [DS.DSSTDTC, DS.DSSEQ]
    keep: last

  - id: LASTTRT
    dataset: DS
    key: [STUDYID, USUBJID]
    filter: "DS.DSCAT = 'DISPOSITION EVENT' AND DS.EPOCH = 'TREATMENT'"
    order_by: [DS.DSSTDTC, DS.DSSEQ]
    keep: last

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  # Every end-of-study column reads the subject's last study disposition
  # record. Its coded term is not in the output, as EOSSTT and DCSREAS
  # carry it. An undated last record leaves the end-of-study date empty.
  - name: EOSDECOD
    type: str
    label: End of Study Decoded Term
    derivation: LASTSTUDY.DSDECOD

  # A screen failure never entered the study, so it has no end of study:
  # its date and reason stay empty, as its status and coded reason do.
  - name: EOSDT
    type: date
    label: End of Study Date
    derivation:
      case:
        - when: "EOSDECOD = 'SCREEN FAILURE'"
          then: null
        - otherwise: LASTSTUDY.DSSTDTC

  - name: EOSREAS
    type: str
    label: End of Study Reason
    derivation:
      case:
        - when: "EOSDECOD = 'SCREEN FAILURE'"
          then: null
        - otherwise: LASTSTUDY.DSTERM

  # A screen failure never entered the study, so it has no status. Any
  # other coded term but COMPLETED is a discontinuation; no coded term, as
  # with no disposition event, is ONGOING.
  - name: EOSSTT
    type: str
    label: End of Study Status
    derivation:
      case:
        - when: "EOSDECOD = 'SCREEN FAILURE'"
          then: null
        - when: "EOSDECOD = 'COMPLETED'"
          then: "'COMPLETED'"
        - when: "EOSDECOD IS NOT NULL"
          then: "'DISCONTINUED'"
        - otherwise: "'ONGOING'"
    verifications:
      - allowed_values:
          values: [COMPLETED, DISCONTINUED, ONGOING]

  # The coded reason; the reported term stays in EOSREAS.
  - name: DCSREAS
    type: str
    label: Reason for Discontinuation from Study
    derivation:
      case:
        - when: "EOSSTT = 'DISCONTINUED'"
          then: EOSDECOD

  # End-of-treatment track, mirroring the study track above. A subject who
  # stops treatment but completes the study (YAMAA-01-107) is DISCONTINUED
  # here and COMPLETED above: the two tracks are independent. A subject who
  # never received study treatment (no RFXSTDTC) has no treatment status.
  - name: EOTDT
    type: date
    label: End of Treatment Date
    derivation:
      aggregate:
        filter: "DS.DSCAT = 'DISPOSITION EVENT' AND DS.EPOCH = 'TREATMENT'
          AND DS.DSSTDTC IS NOT NULL"
        expr: "MAX(DS.DSSTDTC)"

  - name: EOTSTT
    type: str
    label: End of Treatment Status
    derivation:
      case:
        - when: "DM.RFXSTDTC IS NULL"
          then: null
        - when: "LASTTRT.DSDECOD = 'COMPLETED'"
          then: "'COMPLETED'"
        - when: "LASTTRT.DSDECOD IS NOT NULL"
          then: "'DISCONTINUED'"
        - otherwise: "'ONGOING'"
    verifications:
      - allowed_values:
          values: [COMPLETED, DISCONTINUED, ONGOING]

  - name: DCTREAS
    type: str
    label: Reason for Discontinuation of Treatment
    derivation:
      case:
        - when: "EOTSTT = 'DISCONTINUED'"
          then: LASTTRT.DSDECOD

  # Specify text: only when the coded treatment term is OTHER does the
  # reported term carry extra meaning beyond the code.
  - name: DCTREASP
    type: str
    label: Reason Spec for Discont of Treatment
    derivation:
      case:
        - when: "EOTSTT = 'DISCONTINUED' AND LASTTRT.DSDECOD = 'OTHER'"
          then: LASTTRT.DSTERM

verifications:
  - row_count:
      min: 7
      max: 7
  - assert:
      id: discontinuation-has-reason
      when: "EOSSTT = 'DISCONTINUED'"
      require: "DCSREAS IS NOT NULL"
  - assert:
      id: treatment-discontinuation-has-reason
      when: "EOTSTT = 'DISCONTINUED'"
      require: "DCTREAS IS NOT NULL"
  - assert:
      id: specify-only-for-other
      when: "DCTREASP IS NOT NULL"
      require: "EOTSTT = 'DISCONTINUED'"
