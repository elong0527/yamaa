schema_version: "1.0"
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  DM: input/dm.csv
  DS: {path: input/ds.csv, types: {DSSEQ: int}}
base: DM

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, EOSDT, EOSDECOD, EOSREAS, EOSSTT, DCSREAS]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  # All three read the subject's last dated DISPOSITION EVENT record: latest
  # DSSTDTC, then higher DSSEQ on the same day. The date guard matters for
  # the term and reason: an undated record would sort last and be kept.
  - name: EOSDT
    type: date
    label: End of Study Date
    derivation:
      aggregate:
        filter: "DS.DSCAT = 'DISPOSITION EVENT' AND DS.DSSTDTC IS NOT NULL"
        expr: "MAX(DS.DSSTDTC)"

  - name: EOSDECOD
    type: str
    label: End of Study Decoded Term
    derivation:
      source:
        variable: DS.DSDECOD
        filter: "DS.DSCAT = 'DISPOSITION EVENT' AND DS.DSSTDTC IS NOT NULL"
        multiple_matches:
          order_by: [DS.DSSTDTC, DS.DSSEQ]
          keep: last

  - name: EOSREAS
    type: str
    label: End of Study Reason
    derivation:
      source:
        variable: DS.DSTERM
        filter: "DS.DSCAT = 'DISPOSITION EVENT' AND DS.DSSTDTC IS NOT NULL"
        multiple_matches:
          order_by: [DS.DSSTDTC, DS.DSSEQ]
          keep: last

  # Any coded term but COMPLETED is a discontinuation; no coded term, as
  # with no dated disposition event, is ONGOING.
  - name: EOSSTT
    type: str
    label: End of Study Status
    derivation:
      case:
        - when: "EOSDECOD = 'COMPLETED'"
          then: {literal: COMPLETED}
        - when: "EOSDECOD IS NOT NULL"
          then: {literal: DISCONTINUED}
        - otherwise: {literal: ONGOING}
    verifications:
      allowed_values:
        values: [COMPLETED, DISCONTINUED, ONGOING]

  - name: DCSREAS
    type: str
    label: Reason for Discontinuation
    derivation:
      case:
        - when: "EOSSTT = 'DISCONTINUED'"
          then: EOSREAS

verifications:
  - unique:
      columns: [STUDYID, USUBJID]
  - row_count:
      min: 6
      max: 6
  - implies:
      id: discontinuation-has-reason
      when: "EOSSTT = 'DISCONTINUED'"
      then: "DCSREAS IS NOT NULL"
