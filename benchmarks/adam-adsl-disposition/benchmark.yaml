lifecycle: reviewed
standard: ADaM
domain: ADSL
review:
  concerns:
    - Disposition tables summarize end-of-study and end-of-treatment status and
      coded reasons, which must describe one and the same last event.
    - Seven subjects cover completion, a discontinuation with several events on
      one date, an undated withdrawal, no records, a screen failure who was
      never treated, a death, and treatment stopped while the study was
      completed.
    - When events share the latest date the higher sequence wins (subject 102's
      adverse event over withdrawal on 2024-08-30), an undated withdrawal still
      discontinues the subject with no end date (subject 106), a screen failure
      has no study or treatment status and no reason (subject 104), and the two
      tracks are independent (subject 107 discontinued treatment but completed
      the study). The coded term is not repeated in its own column, as EOSSTT
      and DCSREAS carry it.
