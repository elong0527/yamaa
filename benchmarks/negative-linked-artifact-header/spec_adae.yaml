yamaa: "1.0"
type: spec
model: ADaM
domain: ADAE
keys: [STUDYID, USUBJID, AESEQ]
input:
  AE: {path: input/ae.csv, types: {AESEQ: int}}
  # The subject-level dataset as it was last saved, typed by the
  # specification that produces it. It was saved before that specification
  # added the first dose date.
  ADSL:
    path: input/adsl.csv
    schema: spec_adsl.yaml
    key: [STUDYID, USUBJID]
base: AE

output:
  path: adae.csv
  columns: [STUDYID, USUBJID, AESEQ, AEDECOD, TRTSDT]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: AE.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: AE.USUBJID

  - name: AESEQ
    type: int
    label: Sequence Number
    derivation: AE.AESEQ

  - name: AEDECOD
    type: str
    label: Dictionary-Derived Term
    derivation: AE.AEDECOD

  - name: TRTSDT
    type: date
    label: Date of First Exposure to Treatment
    derivation: ADSL.TRTSDT
