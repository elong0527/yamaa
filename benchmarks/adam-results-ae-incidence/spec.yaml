yamaa: "1.0"
type: spec
model: ADaM
domain: RESULTS
keys:
- STUDYID
- ANALYSISID
- GROUPORDER
- OPERATIONID
input:
  SUBJECT:
    path: input/subjects.csv
    schema: input/subjects.schema.yaml

output:
  path: results.csv
  columns:
  - STUDYID
  - ANALYSISID
  - ANALYSISSETID
  - DATASET
  - VARIABLE
  - ANALYSISSET
  - DATASUBSET
  - GROUPINGID
  - GROUPORDER
  - GROUPLEVEL
  - METHODID
  - OPERATIONID
  - RESULT
  order_by:
  - STUDYID
  - GROUPORDER
  - OPERATIONID

columns:
- name: STUDYID
  type: str
  label: Study Identifier
  derivation: SUBJECT.STUDYID

- name: ANALYSISID
  type: str
  label: Analysis Identifier
  derivation: "'AEINC'"

- name: ANALYSISSETID
  type: str
  label: Analysis Set Identifier
  derivation: "'SAFETY'"

- name: DATASET
  type: str
  label: Analysis Dataset
  derivation: "'ADAE'"

- name: VARIABLE
  type: str
  label: Analysis Variable
  derivation: "'USUBJID'"

- name: ANALYSISSET
  type: str
  label: Analysis Set Condition
  derivation: "'SAFFL = ''Y'''"

- name: DATASUBSET
  type: str
  label: Data Subset Condition
  derivation: "'TRTEMFL = ''Y'''"

- name: GROUPINGID
  type: str
  label: Grouping Factor Identifier
  derivation: "'TRT01P'"

- name: METHODID
  type: str
  label: Analysis Method Identifier
  derivation: "'AEINCIDENCE'"

- name: GROUPORDER
  type: int
  label: Grouping Level Order
  derivation: SUBJECT.TRT01PN

- name: GROUPLEVEL
  type: str
  label: Grouping Level
  derivation: SUBJECT.TRT01P

- name: OPERATIONID
  type: str
  label: Analysis Operation Identifier

- name: NSUBJ
  type: int
  label: Subjects with a Qualifying Event

- name: DENOM
  type: int
  label: Subjects in the Analysis Set

- name: RESULT
  type: float
  label: Analysis Operation Result
  derivation:
    case:
    - when: OPERATIONID = 'COUNT'
      then: NSUBJ
    - otherwise: 100 * NSUBJ / DENOM

rows:
- id: count
  dataset: SUBJECT
  group_by:
  - SUBJECT.STUDYID
  - SUBJECT.TRT01P
  - SUBJECT.TRT01PN
  derivations:
    OPERATIONID: "'COUNT'"
    NSUBJ:
      aggregate: SUM(SUBJECT.EVENTN)
    DENOM:
      aggregate: COUNT(SUBJECT.USUBJID)

- id: percent
  dataset: SUBJECT
  group_by:
  - SUBJECT.STUDYID
  - SUBJECT.TRT01P
  - SUBJECT.TRT01PN
  derivations:
    OPERATIONID: "'PERCENT'"
    NSUBJ:
      aggregate: SUM(SUBJECT.EVENTN)
    DENOM:
      aggregate: COUNT(SUBJECT.USUBJID)

verifications:
- assert:
    id: incidence-count-and-denominator
    require: DENOM > 0 AND NSUBJ >= 0 AND NSUBJ <= DENOM
