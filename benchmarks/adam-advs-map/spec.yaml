schema_version: "1.0"
domain: ADVS
keys: [STUDYID, USUBJID, VISIT, PARAMCD]
input:
  ADVS_RAW: {path: input/advs.csv, types: {AVAL: float}}

output:
  path: advs.csv
  columns: [STUDYID, USUBJID, PARAMCD, PARAM, AVAL, VISIT, DTYPE]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: ADVS_RAW.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: ADVS_RAW.USUBJID

  - name: PARAMCD
    type: str
    label: Parameter Code

  - name: PARAM
    type: str
    label: Parameter

  - name: SYSBP_VAL
    type: float
    label: Systolic Blood Pressure Value

  - name: DIABP_VAL
    type: float
    label: Diastolic Blood Pressure Value

  - name: AVAL
    type: float
    label: Analysis Value

  - name: VISIT
    type: str
    label: Visit Name
    derivation: ADVS_RAW.VISIT

  - name: DTYPE
    type: str
    label: Derivation Type

rows:
  - id: collected
    derivations:
      PARAMCD: {source: ADVS_RAW.PARAMCD}
      PARAM: {source: ADVS_RAW.PARAM}
      SYSBP_VAL: {literal: null}
      DIABP_VAL: {literal: null}
      AVAL: {source: ADVS_RAW.AVAL}
      DTYPE: {literal: null}

  - id: derived_map
    group_by: [ADVS_RAW.STUDYID, ADVS_RAW.USUBJID, ADVS_RAW.VISIT]
    filter: "SYSBP_VAL IS NOT NULL AND DIABP_VAL IS NOT NULL"
    derivations:
      PARAMCD: {literal: MAP}
      PARAM: {literal: Mean Arterial Pressure (mmHg)}
      SYSBP_VAL:
        aggregate:
          filter: "ADVS_RAW.PARAMCD = 'SYSBP'"
          expr: "ONLY(ADVS_RAW.AVAL)"
      DIABP_VAL:
        aggregate:
          filter: "ADVS_RAW.PARAMCD = 'DIABP'"
          expr: "ONLY(ADVS_RAW.AVAL)"
      AVAL:
        compute:
          expr: "(2 * DIABP_VAL + SYSBP_VAL) / 3"
      DTYPE: {literal: CALCULATION}

verifications:
  - unique:
      columns: [STUDYID, USUBJID, VISIT, PARAMCD]
  - row_count:
      min: 10
      max: 10
  - assert:
      id: no-pre-existing-target
      expr: "NOT (PARAMCD = 'MAP' AND DTYPE IS NULL)"
