schema_version: "1.0"
domain: ADVS
keys: [STUDYID, USUBJID, VISIT, PARAMCD]
input:
  ADVS_RAW: {path: input/advs.csv, types: {AVAL: float}}

output:
  path: advs.csv
  columns: [STUDYID, USUBJID, PARAMCD, PARAM, AVAL, VISIT, DTYPE]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: ADVS_RAW.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: ADVS_RAW.USUBJID

  - name: PARAMCD
    type: str
    label: Parameter Code

  - name: PARAM
    type: str
    label: Parameter

  # The visit's systolic and diastolic pressures, gathered for the formula.
  # Every row template must set them, so the collected one sets them empty;
  # neither is in the output.
  - name: SYSBP_VAL
    type: float
    label: Systolic Blood Pressure Value

  - name: DIABP_VAL
    type: float
    label: Diastolic Blood Pressure Value

  - name: AVAL
    type: float
    label: Analysis Value

  - name: VISIT
    type: str
    label: Visit Name
    derivation: ADVS_RAW.VISIT

  - name: DTYPE
    type: str
    label: Derivation Type

rows:
  # Every collected record, unchanged.
  - id: collected
    derivations:
      PARAMCD: ADVS_RAW.PARAMCD
      PARAM: ADVS_RAW.PARAM
      SYSBP_VAL: {literal: null}
      DIABP_VAL: {literal: null}
      AVAL: ADVS_RAW.AVAL
      DTYPE: {literal: null}

  # One MAP record per subject and visit that has both a systolic and a
  # diastolic result; ONLY() fails if the visit has more than one of either.
  - id: derived_map
    group_by: [ADVS_RAW.STUDYID, ADVS_RAW.USUBJID, ADVS_RAW.VISIT]
    filter: "SYSBP_VAL IS NOT NULL AND DIABP_VAL IS NOT NULL"
    derivations:
      PARAMCD: {literal: MAP}
      PARAM: {literal: Mean Arterial Pressure (mmHg)}
      SYSBP_VAL:
        aggregate:
          filter: "ADVS_RAW.PARAMCD = 'SYSBP'"
          expr: "ONLY(ADVS_RAW.AVAL)"
      DIABP_VAL:
        aggregate:
          filter: "ADVS_RAW.PARAMCD = 'DIABP'"
          expr: "ONLY(ADVS_RAW.AVAL)"
      # Two-thirds diastolic plus one-third systolic.
      AVAL:
        compute:
          expr: "(2 * DIABP_VAL + SYSBP_VAL) / 3"
      DTYPE: {literal: CALCULATION}

verifications:
  - unique:
      columns: [STUDYID, USUBJID, VISIT, PARAMCD]
  - row_count:
      min: 10
      max: 10
  # A collected record never has a DTYPE, so this fails when the input
  # already carries a MAP record.
  - assert:
      id: no-pre-existing-target
      expr: "NOT (PARAMCD = 'MAP' AND DTYPE IS NULL)"
