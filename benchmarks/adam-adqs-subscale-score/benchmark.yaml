lifecycle: reviewed
standard: ADaM
domain: ADQS
review:
  concerns:
    - Questionnaire subscale scores such as physical functioning are computed
      only when enough items were answered, with a reason when they are not.
    - Subjects at two visits cover all four items answered, one item not done,
      too few items answered, items not done with a recorded reason, and records
      of other scales.
    - A score needs at least three of four answered items (mean times 25), a
      visit below that keeps an empty score with a reason, and the items' reason
      is copied only when none were answered and they agree; otherwise NOT
      CALCULABLE.
