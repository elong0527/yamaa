yamaa: "1.0"
type: spec
model: ADaM
domain: ADQS
keys: [STUDYID, USUBJID, VISIT, PARAMCD]
input:
  QS: {path: input/qs.csv, types: {QSSTRESN: float}}

output:
  path: adqs.csv
  columns: [STUDYID, USUBJID, VISIT, PARAMCD, PARAM, AVAL, AREASND]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: QS.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: QS.USUBJID

  - name: VISIT
    type: str
    label: Visit Name
    derivation: QS.VISIT

  - name: PARAMCD
    type: str
    label: Parameter Code
    verifications:
      - allowed_values:
          values: [PF01, PF02, PF03, PF04, PFSCORE]

  - name: PARAM
    type: str
    label: Parameter

  # The item's numeric response, empty on the score row. It is not in the
  # output.
  - name: ITEMRESN
    type: float
    label: Numeric Item Response

  # The reason recorded for an unanswered item, empty on the score row. It is
  # not in the output.
  - name: ITEMRSND
    type: str
    label: Item Reason Not Done

  # Sum and count of the answered items at the subject's visit, repeated on
  # every row of it. The score row's empty ITEMRESN adds nothing to either.
  - name: ITEMSUM
    type: float
    label: Sum of Item Responses
    derivation:
      aggregate:
        expr: "SUM(ITEMRESN)"
        group_by: [STUDYID, USUBJID, VISIT]

  - name: ITEMANS
    type: int
    label: Number of Answered Items
    derivation:
      aggregate:
        expr: "COUNT(ITEMRESN)"
        group_by: [STUDYID, USUBJID, VISIT]

  # How many different reasons the visit's items record, and the greatest of
  # them, which is the only one when they record one.
  - name: ITEMRSNN
    type: int
    label: Number of Different Item Reasons
    derivation:
      aggregate:
        expr: "COUNT(ITEMRSND)"
        distinct: true
        group_by: [STUDYID, USUBJID, VISIT]

  - name: ITEMRSN
    type: str
    label: Item Reason Not Done for the Visit
    derivation:
      aggregate:
        expr: "MAX(ITEMRSND)"
        group_by: [STUDYID, USUBJID, VISIT]

  # The score is the mean answered response times 25 (a 0 to 100 scale),
  # empty with fewer than three items answered. An item row keeps its
  # response.
  - name: AVAL
    type: float
    label: Analysis Value
    derivation:
      case:
        - when: "PARAMCD = 'PFSCORE' AND ITEMANS >= 3"
          then: "100 * (ITEMSUM / ITEMANS) / 4"
        - when: "PARAMCD = 'PFSCORE'"
          then: null
        - otherwise: ITEMRESN
    verifications:
      - range:
          min: 0
          max: 100

  # Why the value is missing. An item row keeps its recorded reason. A score
  # with too few answers takes the one reason its items record when none was
  # answered, and reads NOT CALCULABLE otherwise.
  - name: AREASND
    type: str
    label: Analysis Reason Not Done
    derivation:
      case:
        - when: "PARAMCD = 'PFSCORE' AND ITEMANS >= 3"
          then: null
        - when: "PARAMCD = 'PFSCORE' AND ITEMANS = 0 AND ITEMRSNN = 1"
          then: ITEMRSN
        - when: "PARAMCD = 'PFSCORE'"
          then: "'NOT CALCULABLE'"
        - otherwise: ITEMRSND

rows:
  # Every physical functioning item record, answered or not.
  - id: item
    filter: "QS.QSCAT = 'PHYSICAL FUNCTIONING SCALE'"
    derivations:
      PARAMCD: QS.QSTESTCD
      PARAM: QS.QSTEST
      ITEMRESN: QS.QSSTRESN
      ITEMRSND: QS.QSREASND

  # One score row per subject and visit, built from the visit's PF01 record
  # whether or not it was answered; a visit with no PF01 record gets none.
  - id: subscale
    filter: "QS.QSCAT = 'PHYSICAL FUNCTIONING SCALE' AND QS.QSTESTCD = 'PF01'"
    derivations:
      PARAMCD: "'PFSCORE'"
      PARAM: "'Physical Functioning Subscale Score'"
      ITEMRESN: null
      ITEMRSND: null

verifications:
  - row_count:
      min: 25
      max: 25
  - assert:
      id: subscale-score-rests-on-three-answered-items
      when: "PARAMCD = 'PFSCORE' AND AVAL IS NOT NULL"
      require: "ITEMANS >= 3"
  - assert:
      id: an-item-response-stays-within-the-answer-range
      when: "PARAMCD IN ('PF01', 'PF02', 'PF03', 'PF04')"
      require: "AVAL IS NULL OR AVAL BETWEEN 0 AND 4"
  - assert:
      id: a-missing-score-says-why
      when: "PARAMCD = 'PFSCORE' AND AVAL IS NULL"
      require: "AREASND IS NOT NULL"
