yamaa: "1.0"
type: spec
model: ADaM
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  DM: input/dm.csv

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, COUNTRY, REGION1]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  # The ISO 3166 alpha-3 code SDTM collects, as it stands.
  - name: COUNTRY
    type: str
    label: Country
    derivation: DM.COUNTRY
    verifications:
      - not_missing

  # The study's regions; a country outside them is Rest of World.
  - name: REGION1
    type: str
    label: Geographic Region 1
    derivation:
      mapping:
        source: COUNTRY
        dict:
          USA: North America
          CAN: North America
          DEU: Europe
          ESP: Europe
          FRA: Europe
          GBR: Europe
        unmapped: Rest of World
    verifications:
      - allowed_values:
          values: [North America, Europe, Rest of World]

verifications:
  - row_count:
      min: 9
      max: 9
