schema_version: "1.0"
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  DM: input/dm.csv

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, COUNTRY, REGION1]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  # Upper case, so 'usa' and 'USA' are one country; an empty country is
  # UNKNOWN. Any country outside the list below stops the run.
  - name: COUNTRY
    type: str
    label: Country
    derivation:
      str_upper:
        source: DM.COUNTRY
        missing: UNKNOWN
    verifications:
      allowed_values:
        values: [USA, CAN, DEU, UNKNOWN]

  # The fallback answers both an empty and an unlisted country, but COUNTRY
  # is never empty and admits no other country, so only UNKNOWN reaches it.
  - name: REGION1
    type: str
    label: Geographic Region 1
    derivation:
      mapping:
        source: COUNTRY
        dict:
          USA: North America
          CAN: North America
          DEU: Europe
        missing: Rest of World
    verifications:
      allowed_values:
        values: [North America, Europe, Rest of World]

verifications:
  - unique:
      columns: [STUDYID, USUBJID]
  - row_count:
      min: 8
      max: 8
