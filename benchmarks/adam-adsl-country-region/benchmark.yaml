lifecycle: reviewed
standard: ADaM
domain: ADSL
review:
  concerns:
    - Subgroup analyses by region need a region for every subject, assigned
      from the country of the investigational site.
    - Nine subjects cover two North American countries, four European ones,
      and two countries outside the listed regions (JPN and BRA).
    - A country outside the listed regions, such as JPN, goes to Rest of World
      instead of stopping the run, and the country itself is the ISO 3166 code
      DM collects, carried as it stands.
