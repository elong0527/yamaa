schema_version: "1.0"
domain: ADLB
keys: [STUDYID, USUBJID, ADT, PARAMCD]
input:
  LB: {path: input/lb.csv, types: {LBSTRESN: float}}

output:
  path: adlb.csv
  columns: [STUDYID, USUBJID, ADT, PARAMCD, PARAM, AVAL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: LB.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: LB.USUBJID

  - name: ADT
    type: date
    label: Analysis Date
    derivation: LB.LBDTC

  - name: PARAMCD
    type: str
    label: Parameter Code
    verifications:
      allowed_values:
        values: [ALT, AST, ASTALT]

  - name: PARAM
    type: str
    label: Parameter

  - name: LBRESN
    type: float
    label: Numeric Laboratory Result

  # The day's ALT and AST results, read back from the rows being built:
  # the largest AVAL among the subject's rows of that parameter on that date.
  # AVAL below is computed from them, which closes the cycle this benchmark
  # shows.
  - name: ALTVAL
    type: float
    label: Alanine Aminotransferase Analysis Value
    derivation:
      aggregate:
        filter: "PARAMCD = 'ALT'"
        group_by: [STUDYID, USUBJID, ADT]
        expr: "MAX(AVAL)"

  - name: ASTVAL
    type: float
    label: Aspartate Aminotransferase Analysis Value
    derivation:
      aggregate:
        filter: "PARAMCD = 'AST'"
        group_by: [STUDYID, USUBJID, ADT]
        expr: "MAX(AVAL)"

  # NULLIF leaves the ratio empty instead of dividing by a zero ALT.
  - name: AVAL
    type: float
    label: Analysis Value
    derivation:
      case:
        - when: "PARAMCD = 'ASTALT'"
          then:
            compute:
              expr: "ASTVAL / NULLIF(ALTVAL, 0)"
        - otherwise: LBRESN

rows:
  - id: alt
    filter: "LB.LBTESTCD = 'ALT'"
    derivations:
      PARAMCD: {literal: ALT}
      PARAM: {literal: Alanine Aminotransferase}
      LBRESN: LB.LBSTRESN

  - id: ast
    filter: "LB.LBTESTCD = 'AST'"
    derivations:
      PARAMCD: {literal: AST}
      PARAM: {literal: Aspartate Aminotransferase}
      LBRESN: LB.LBSTRESN

  # One ratio row per ALT record; its value comes from AVAL above.
  - id: ast_alt_ratio
    filter: "LB.LBTESTCD = 'ALT'"
    derivations:
      PARAMCD: {literal: ASTALT}
      PARAM: {literal: Aspartate to Alanine Aminotransferase Ratio}
      LBRESN: {literal: null}

verifications:
  - unique:
      columns: [STUDYID, USUBJID, ADT, PARAMCD]
  - row_count:
      min: 11
      max: 11
