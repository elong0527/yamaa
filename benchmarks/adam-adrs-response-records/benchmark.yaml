lifecycle: reviewed
standard: ADaM
domain: ADRS
review:
  concerns:
    - Response analyses use the investigator's overall response at each
      assessment, with one record per date for best-response and duration
      derivations, under the rules the study's SAP sets.
    - Eight subjects cover improving and worsening responses, two results on one
      date, a year-month and a year-only date, an assessment on the treatment
      start, and target-lesion and independent-assessor records.
    - On a date with two results the SAP's worse one is flagged (subject
      102's PD over SD), and NE is used only when the date has no evaluable
      response (subject 108's PD over SD and NE). A partial date completes to
      the first of the month or year and is flagged (2025-03 becomes 2025-03-01
      with ADTF D), and target-lesion and independent assessments belong to
      other parameters, so they leave no record here.
