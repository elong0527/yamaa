schema_version: "1.0"
domain: ADAE
keys: [STUDYID, USUBJID, AESEQ]
input:
  AE: input/ae.csv
  QUERY: {path: input/queries.csv, types: {GRPID: int}}
base: AE
intermediates:
  - id: SMQ1
    dataset: QUERY
    key_base: [AEDECOD]
    key: [TERM]
    filter: "QUERY.PREFIX = 'SMQ01'"
  - id: SMQ2
    dataset: QUERY
    key_base: [AEDECOD]
    key: [TERM]
    filter: "QUERY.PREFIX = 'SMQ02'"
  - id: CQ1
    dataset: QUERY
    key_base: [AEDECOD]
    key: [TERM]
    filter: "QUERY.PREFIX = 'CQ01'"

output:
  path: adae.csv
  columns: [STUDYID, USUBJID, AESEQ, AETERM, AEDECOD, SMQ01NAM, SMQ01CD, SMQ01SC, SMQ02NAM, SMQ02CD, SMQ02SC, CQ01NAM]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: AE.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: AE.USUBJID

  - name: AESEQ
    type: int
    label: Sequence Number
    derivation: AE.AESEQ

  - name: AETERM
    type: str
    label: Reported Term for the Adverse Event
    derivation: AE.AETERM

  - name: AEDECOD
    type: str
    label: Dictionary-Derived Term
    derivation: AE.AEDECOD

  - name: SMQ01NAM
    type: str
    label: Standardized MedDRA Query 01 Name
    derivation: SMQ1.GRPNAME

  - name: SMQ01CD
    type: int
    label: Standardized MedDRA Query 01 Code
    derivation: SMQ1.GRPID

  - name: SMQ01SC
    type: str
    label: Standardized MedDRA Query 01 Scope
    derivation: SMQ1.SCOPE
    verifications:
      allowed_values:
        values: [BROAD, NARROW]

  - name: SMQ02NAM
    type: str
    label: Standardized MedDRA Query 02 Name
    derivation: SMQ2.GRPNAME

  - name: SMQ02CD
    type: int
    label: Standardized MedDRA Query 02 Code
    derivation: SMQ2.GRPID

  - name: SMQ02SC
    type: str
    label: Standardized MedDRA Query 02 Scope
    derivation: SMQ2.SCOPE
    verifications:
      allowed_values:
        values: [BROAD, NARROW]

  - name: CQ01NAM
    type: str
    label: Customized Query 01 Name
    derivation: CQ1.GRPNAME

verifications:
  - unique:
      columns: [STUDYID, USUBJID, AESEQ]
  - row_count:
      min: 7
      max: 7
  - all_or_none:
      id: first-standardized-query-slot-is-filled-completely
      columns: [SMQ01NAM, SMQ01CD, SMQ01SC]
  - all_or_none:
      id: second-standardized-query-slot-is-filled-completely
      columns: [SMQ02NAM, SMQ02CD, SMQ02SC]
  - implies:
      id: an-uncoded-event-joins-no-query
      when: "AEDECOD IS NULL"
      then: "SMQ01NAM IS NULL AND SMQ02NAM IS NULL AND CQ01NAM IS NULL"
