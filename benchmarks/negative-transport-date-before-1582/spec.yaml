yamaa: "1.0"
type: spec
model: ADaM
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  # One birth date was entered with the year 1498 instead of 1948.
  ADSL_RAW: {path: input/adsl_raw.csv, types: {BRTHDTC: date}}

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, BRTHDT]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: ADSL_RAW.STUDYID
    submission:
      core: Req
      mandatory: true
      length: 20
      origins:
        - type: Predecessor
          description: ADSL_RAW.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: ADSL_RAW.USUBJID
    submission:
      core: Req
      mandatory: true
      length: 30
      origins:
        - type: Predecessor
          description: ADSL_RAW.USUBJID

  # An ADaM date travels in the transport file as a SAS date, counted in days
  # from 1960-01-01; SAS dates begin on 1582-01-01.
  - name: BRTHDT
    type: date
    label: Date of Birth
    derivation: ADSL_RAW.BRTHDTC
    submission:
      core: Perm
      mandatory: false
      origins:
        - type: Predecessor
          description: ADSL_RAW.BRTHDTC

submission:
  label: Subject-Level Analysis Dataset
  class: SUBJECT LEVEL ANALYSIS DATASET
  structure: One record per subject
  repeating: false
