yamaa: "1.0"
type: spec
model: SDTM
domain: AE
keys: [STUDYID, USUBJID, AESEQ]
input:
  ODM: input/odm.csv
  DM: {path: input/dm.csv, types: {RFSTDTC: date}, key: [STUDYID, USUBJID]}
base: ODM

output:
  path: ae.csv
  columns: [DOMAIN, STUDYID, USUBJID, AESEQ, AETERM, AESTDTC, AEENDTC, AESTDY,
            AEENDY]
  order_by: [USUBJID, AESEQ]

columns:
  - name: DOMAIN
    type: str
    label: Domain Abbreviation
    derivation: "'AE'"

  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: ODM.StudyOID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: ODM.SubjectKey

  - name: AESEQ
    type: int
    label: Sequence Number
    derivation: ODM.FormRepeatKey

  - name: AETERM
    type: str
    label: Reported Term for the Adverse Event
    derivation:
      source:
        filter: ODM.ItemOID = 'IT.AE.AETERM'
        variable: ODM.Value

  # Each collected date part is its own ODM item; an uncollected part has
  # no record, so it reads as missing.
  - name: AEST_YR
    type: str
    label: Collected Start Year
    derivation:
      source:
        filter: ODM.ItemOID = 'IT.AE.AESTYR'
        variable: ODM.Value

  - name: AEST_MO
    type: str
    label: Collected Start Month
    derivation:
      source:
        filter: ODM.ItemOID = 'IT.AE.AESTMO'
        variable: ODM.Value

  - name: AEST_DY
    type: str
    label: Collected Start Day
    derivation:
      source:
        filter: ODM.ItemOID = 'IT.AE.AESTDY'
        variable: ODM.Value

  - name: AEEN_YR
    type: str
    label: Collected End Year
    derivation:
      source:
        filter: ODM.ItemOID = 'IT.AE.AEENYR'
        variable: ODM.Value

  - name: AEEN_MO
    type: str
    label: Collected End Month
    derivation:
      source:
        filter: ODM.ItemOID = 'IT.AE.AEENMO'
        variable: ODM.Value

  - name: AEEN_DY
    type: str
    label: Collected End Day
    derivation:
      source:
        filter: ODM.ItemOID = 'IT.AE.AEENDY'
        variable: ODM.Value

  - name: RFSTDTC
    type: date
    label: Subject Reference Start Date/Time
    derivation: DM.RFSTDTC

  # The collected parts in order, stopping before the first part that was
  # not collected: a day gives YYYY-MM-DD, a month YYYY-MM, a year alone
  # YYYY, and no year gives no date. A day without its month keeps the year
  # alone. A part that is not its field's digits stops the run.
  - name: AESTDTC
    type: str
    label: Start Date/Time of Adverse Event
    derivation:
      dtc:
        year: AEST_YR
        month: AEST_MO
        day: AEST_DY

  # Same assembly for the end date.
  - name: AEENDTC
    type: str
    label: End Date/Time of Adverse Event
    derivation:
      dtc:
        year: AEEN_YR
        month: AEEN_MO
        day: AEEN_DY

  # Collected precision: year, month or day; missing when nothing was
  # collected.
  - name: AESTPR
    type: str
    label: Collected Precision of Adverse Event Start
    derivation:
      precision:
        type: date
        source: AESTDTC

  - name: AEENPR
    type: str
    label: Collected Precision of Adverse Event End
    derivation:
      precision:
        type: date
        source: AEENDTC

  # Only a complete date (precision day) becomes a date, so a partial date
  # gets no study day.
  - name: AESTDT
    type: date
    label: Start Date of Adverse Event (Complete Dates Only)
    derivation:
      case:
        - when: "AESTPR = 'day'"
          then:
            to_date:
              source: AESTDTC

  - name: AEENDT
    type: date
    label: End Date of Adverse Event (Complete Dates Only)
    derivation:
      case:
        - when: "AEENPR = 'day'"
          then:
            to_date:
              source: AEENDTC

  # Day 1 is the reference start date and there is no day zero. A missing
  # date or reference start gives no study day.
  - name: AESTDY
    type: int
    label: Study Day of Start of Adverse Event
    derivation:
      study_day:
        source: AESTDT
        reference: RFSTDTC

  - name: AEENDY
    type: int
    label: Study Day of End of Adverse Event
    derivation:
      study_day:
        source: AEENDT
        reference: RFSTDTC

verifications:
  - row_count:
      min: 6
      max: 6
  - assert:
      id: partial-start-keeps-no-study-day
      when: "AESTDTC IS NOT NULL AND AESTPR <> 'day'"
      require: "AESTDY IS NULL"
  - assert:
      id: partial-end-keeps-no-study-day
      when: "AEENDTC IS NOT NULL AND AEENPR <> 'day'"
      require: "AEENDY IS NULL"
  - assert:
      id: complete-start-with-reference-has-study-day
      when: "AESTPR = 'day' AND RFSTDTC IS NOT NULL"
      require: "AESTDY IS NOT NULL"
  - assert:
      id: complete-end-with-reference-has-study-day
      when: "AEENPR = 'day' AND RFSTDTC IS NOT NULL"
      require: "AEENDY IS NOT NULL"
  - assert:
      id: study-day-has-no-day-zero
      when: "AESTDY IS NOT NULL"
      require: "AESTDY <> 0"
  - assert:
      id: end-study-day-has-no-day-zero
      when: "AEENDY IS NOT NULL"
      require: "AEENDY <> 0"
