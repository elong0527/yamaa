schema_version: "1.0"
domain: AE
keys: [STUDYID, USUBJID, AESEQ]
input:
  ODM: input/odm.csv
  DM: input/dm.csv
base: ODM

output:
  path: ae.csv
  columns: [DOMAIN, STUDYID, USUBJID, AESEQ, AETERM, AESTDTC, AEENDTC, AESTDY, AEENDY]
  order_by: [USUBJID, AESEQ]

columns:
  - name: DOMAIN
    type: str
    label: Domain Abbreviation
    derivation:
      literal: AE

  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: ODM.StudyOID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: ODM.SubjectKey

  - name: AESEQ
    type: int
    label: Sequence Number
    derivation: ODM.FormRepeatKey

  - name: AETERM
    type: str
    label: Reported Term for the Adverse Event
    derivation:
      source:
        filter: ODM.ItemOID = 'IT.AE.AETERM'
        variable: ODM.Value

  - name: AEST_YR
    type: str
    label: Collected Start Year
    derivation:
      source:
        filter: ODM.ItemOID = 'IT.AE.AESTYR'
        variable: ODM.Value

  - name: AEST_MO
    type: str
    label: Collected Start Month
    derivation:
      source:
        filter: ODM.ItemOID = 'IT.AE.AESTMO'
        variable: ODM.Value

  - name: AEST_DY
    type: str
    label: Collected Start Day
    derivation:
      source:
        filter: ODM.ItemOID = 'IT.AE.AESTDY'
        variable: ODM.Value

  - name: AEEN_YR
    type: str
    label: Collected End Year
    derivation:
      source:
        filter: ODM.ItemOID = 'IT.AE.AEENYR'
        variable: ODM.Value

  - name: AEEN_MO
    type: str
    label: Collected End Month
    derivation:
      source:
        filter: ODM.ItemOID = 'IT.AE.AEENMO'
        variable: ODM.Value

  - name: AEEN_DY
    type: str
    label: Collected End Day
    derivation:
      source:
        filter: ODM.ItemOID = 'IT.AE.AEENDY'
        variable: ODM.Value

  - name: RFSTDTC
    type: date
    label: Subject Reference Start Date/Time
    derivation: DM.RFSTDTC

  - name: AESTDTC
    type: str
    label: Start Date/Time of Adverse Event
    derivation:
      case:
        - when: "AEST_DY IS NOT NULL"
          then:
            str_template:
              template: "{AEST_YR}-{AEST_MO}-{AEST_DY}"
        - when: "AEST_MO IS NOT NULL"
          then:
            str_template:
              template: "{AEST_YR}-{AEST_MO}"
        - when: "AEST_YR IS NOT NULL"
          then: AEST_YR

  - name: AEENDTC
    type: str
    label: End Date/Time of Adverse Event
    derivation:
      case:
        - when: "AEEN_DY IS NOT NULL"
          then:
            str_template:
              template: "{AEEN_YR}-{AEEN_MO}-{AEEN_DY}"
        - when: "AEEN_MO IS NOT NULL"
          then:
            str_template:
              template: "{AEEN_YR}-{AEEN_MO}"
        - when: "AEEN_YR IS NOT NULL"
          then: AEEN_YR

  - name: AESTPR
    type: str
    label: Collected Precision of Adverse Event Start
    derivation:
      date_precision:
        source: AESTDTC
        missing: null
        invalid: null

  - name: AEENPR
    type: str
    label: Collected Precision of Adverse Event End
    derivation:
      date_precision:
        source: AEENDTC
        missing: null
        invalid: null

  - name: AESTDT
    type: date
    label: Start Date of Adverse Event (Complete Dates Only)
    derivation:
      case:
        - when: "AESTPR = 'D'"
          then:
            to_date:
              source: AESTDTC

  - name: AEENDT
    type: date
    label: End Date of Adverse Event (Complete Dates Only)
    derivation:
      case:
        - when: "AEENPR = 'D'"
          then:
            to_date:
              source: AEENDTC

  - name: AESTDY
    type: int
    label: Study Day of Start of Adverse Event
    derivation:
      study_day:
        date: AESTDT
        reference: RFSTDTC

  - name: AEENDY
    type: int
    label: Study Day of End of Adverse Event
    derivation:
      study_day:
        date: AEENDT
        reference: RFSTDTC

verifications:
  - unique:
      columns: [STUDYID, USUBJID, AESEQ]
  - row_count:
      min: 6
      max: 6
  - implies:
      id: partial-start-keeps-no-study-day
      when: "AESTDTC IS NOT NULL AND AESTPR <> 'D'"
      then: "AESTDY IS NULL"
  - implies:
      id: partial-end-keeps-no-study-day
      when: "AEENDTC IS NOT NULL AND AEENPR <> 'D'"
      then: "AEENDY IS NULL"
  - implies:
      id: complete-start-with-reference-has-study-day
      when: "AESTPR = 'D' AND RFSTDTC IS NOT NULL"
      then: "AESTDY IS NOT NULL"
  - implies:
      id: complete-end-with-reference-has-study-day
      when: "AEENPR = 'D' AND RFSTDTC IS NOT NULL"
      then: "AEENDY IS NOT NULL"
  - implies:
      id: study-day-has-no-day-zero
      when: "AESTDY IS NOT NULL"
      then: "AESTDY <> 0"
  - implies:
      id: end-study-day-has-no-day-zero
      when: "AEENDY IS NOT NULL"
      then: "AEENDY <> 0"
