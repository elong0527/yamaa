schema_version: "1.0"
domain: ADRS
keys: [STUDYID, USUBJID, RSSEQ]
input:
  RS: input/rs.csv

output:
  path: adrs.csv
  columns: [STUDYID, USUBJID, PARAMCD, RSSEQ, ADT, AVALC, CONFIRMED]

windows:
  RESPONSE_ORDER:
    group_by: [STUDYID, USUBJID]
    order_by: [ADT, RSSEQ]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: RS.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: RS.USUBJID

  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation: {literal: CONFRESP}

  - name: RSSEQ
    type: int
    label: Sequence Number
    derivation: RS.RSSEQ

  - name: ADT
    type: date
    label: Analysis Date
    derivation: RS.RSDTC

  - name: AVALC
    type: str
    label: Analysis Value (C)
    derivation: RS.RSSTRESC

  # NEXTDT and NEXTRESP read the subject's next assessment, in date order
  # with same-day ties broken by sequence number; both are empty at the
  # last assessment, and so is DAYS_TO_NEXT.
  - name: NEXTDT
    type: date
    label: Next Assessment Date
    derivation:
      row_value:
        source: ADT
        offset: 1
        window: RESPONSE_ORDER

  - name: NEXTRESP
    type: str
    label: Next Response
    derivation:
      row_value:
        source: AVALC
        offset: 1
        window: RESPONSE_ORDER

  - name: DAYS_TO_NEXT
    type: int
    label: Days to Next Assessment
    derivation:
      date_diff:
        start: ADT
        end: NEXTDT
        unit: day

  # Progressive disease needs no confirmation. A PR or CR is confirmed only
  # by a PR or CR at the very next assessment, 28 or more days later; with
  # no next assessment the test is unknown, so the record falls to N.
  - name: CONFIRMED
    type: str
    label: Confirmation Flag
    derivation:
      case:
        - when: "AVALC = 'PD'"
          then: {literal: Y}
        - when: "AVALC IN ('PR', 'CR') AND NEXTRESP IN ('PR', 'CR') AND DAYS_TO_NEXT >= 28"
          then: {literal: Y}
        - otherwise: {literal: N}

verifications:
  - row_count:
      min: 14
      max: 14
