schema_version: "1.0"
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  DM: input/dm.csv

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, RFSTDTM, DTHDT, SURVDD]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  - name: RFSTDTM
    type: datetime
    label: Reference Start Moment
    derivation: DM.RFSTDTC

  - name: DTHDT
    type: date
    label: Date of Death
    derivation: DM.DTHDT

  # Counts days from a date-time to a date; a day count needs two dates, so
  # this is rejected before any data is read.
  - name: SURVDD
    type: int
    label: Survival Duration in Days
    derivation:
      date_diff:
        start: RFSTDTM
        end: DTHDT
        unit: day
