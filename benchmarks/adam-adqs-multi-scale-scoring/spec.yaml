schema_version: "1.0"
domain: ADQS
keys: [STUDYID, USUBJID, VISIT, PARAMCD]
input:
  QS: {path: input/qs.csv, types: {QSSTRESN: float}}

output:
  path: adqs.csv
  columns: [STUDYID, USUBJID, VISIT, PARAMCD, PARAM, AVAL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: QS.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: QS.USUBJID

  - name: VISIT
    type: str
    label: Visit Name
    derivation: QS.VISIT

  - name: PARAMCD
    type: str
    label: Parameter Code
    verifications:
      allowed_values:
        values: [F101, F102, F103, F104, F201, F202, S01, S02, G01, G02,
                 F1SCORE, F2SCORE, SSCORE, GSCORE]

  - name: PARAM
    type: str
    label: Parameter

  # The item's numeric response, empty on the score rows. It is not in the
  # output.
  - name: ITEMRESN
    type: float
    label: Numeric Item Response

  # Per-scale aggregates, assigned within each score row id below: the
  # anchor record count (the row exists when the anchor record does,
  # answered or not), the sum of answered item responses, and the answered
  # item count. The item rows carry nulls. None of these columns are in
  # the output.
  - name: SCALE_ANCHOR
    type: int
    label: Scale Anchor Record Count

  - name: SCALE_SUM
    type: float
    label: Sum of Scale Item Responses

  - name: SCALE_ANS
    type: int
    label: Number of Answered Scale Items

  # The scale score is the mean answered response transformed to a 0 to 100
  # scale. The functional scales score higher for better functioning, the
  # symptom scale scores higher for worse symptoms, and the global scale
  # uses the seven-point range. A scale with too few answered items keeps
  # an empty score. An item row keeps its response. Each row id below derives
  # AVAL for its own rows.
  - name: AVAL
    type: float
    label: Analysis Value
    verifications:
      range:
        min: 0
        max: 100

rows:
  # Every questionnaire item record, answered or not.
  - id: item
    derivations:
      PARAMCD: QS.QSTESTCD
      PARAM: QS.QSTEST
      ITEMRESN: QS.QSSTRESN
      SCALE_ANCHOR: {literal: null}
      SCALE_SUM: {literal: null}
      SCALE_ANS: {literal: null}
      AVAL: ITEMRESN

  # One score row per scale for each visit that has the scale's anchor
  # item record, whether or not it was answered. A visit with no anchor
  # record for a scale gets no score row for that scale.
  - id: f1score
    group_by: [QS.STUDYID, QS.USUBJID, QS.VISIT]
    filter: "SCALE_ANCHOR >= 1"
    derivations:
      STUDYID: QS.STUDYID
      USUBJID: QS.USUBJID
      VISIT: QS.VISIT
      SCALE_ANCHOR:
        aggregate:
          filter: "QS.QSTESTCD = 'F101'"
          expr: "COUNT(QS.QSTESTCD)"
      SCALE_SUM:
        aggregate:
          filter: "QS.QSTESTCD IN ('F101', 'F102', 'F103', 'F104')"
          expr: "SUM(QS.QSSTRESN)"
      SCALE_ANS:
        aggregate:
          filter: "QS.QSTESTCD IN ('F101', 'F102', 'F103', 'F104')"
          expr: "COUNT(QS.QSSTRESN)"
      PARAMCD: {literal: F1SCORE}
      PARAM: {literal: Physical Functioning Scale Score}
      ITEMRESN: {literal: null}
      AVAL:
        case:
          - when: "SCALE_ANS >= 2"
            then:
              compute:
                expr: "100 * (1 - (SCALE_SUM / SCALE_ANS - 1) / 3)"
          - otherwise: {literal: null}

  - id: f2score
    group_by: [QS.STUDYID, QS.USUBJID, QS.VISIT]
    filter: "SCALE_ANCHOR >= 1"
    derivations:
      STUDYID: QS.STUDYID
      USUBJID: QS.USUBJID
      VISIT: QS.VISIT
      SCALE_ANCHOR:
        aggregate:
          filter: "QS.QSTESTCD = 'F201'"
          expr: "COUNT(QS.QSTESTCD)"
      SCALE_SUM:
        aggregate:
          filter: "QS.QSTESTCD IN ('F201', 'F202')"
          expr: "SUM(QS.QSSTRESN)"
      SCALE_ANS:
        aggregate:
          filter: "QS.QSTESTCD IN ('F201', 'F202')"
          expr: "COUNT(QS.QSSTRESN)"
      PARAMCD: {literal: F2SCORE}
      PARAM: {literal: Role Functioning Scale Score}
      ITEMRESN: {literal: null}
      AVAL:
        case:
          - when: "SCALE_ANS >= 1"
            then:
              compute:
                expr: "100 * (1 - (SCALE_SUM / SCALE_ANS - 1) / 3)"
          - otherwise: {literal: null}

  - id: sscore
    group_by: [QS.STUDYID, QS.USUBJID, QS.VISIT]
    filter: "SCALE_ANCHOR >= 1"
    derivations:
      STUDYID: QS.STUDYID
      USUBJID: QS.USUBJID
      VISIT: QS.VISIT
      SCALE_ANCHOR:
        aggregate:
          filter: "QS.QSTESTCD = 'S01'"
          expr: "COUNT(QS.QSTESTCD)"
      SCALE_SUM:
        aggregate:
          filter: "QS.QSTESTCD IN ('S01', 'S02', 'F104')"
          expr: "SUM(QS.QSSTRESN)"
      SCALE_ANS:
        aggregate:
          filter: "QS.QSTESTCD IN ('S01', 'S02', 'F104')"
          expr: "COUNT(QS.QSSTRESN)"
      PARAMCD: {literal: SSCORE}
      PARAM: {literal: Fatigue and Sleep Symptom Scale Score}
      ITEMRESN: {literal: null}
      AVAL:
        case:
          - when: "SCALE_ANS >= 2"
            then:
              compute:
                expr: "100 * (SCALE_SUM / SCALE_ANS - 1) / 3"
          - otherwise: {literal: null}

  - id: gscore
    group_by: [QS.STUDYID, QS.USUBJID, QS.VISIT]
    filter: "SCALE_ANCHOR >= 1"
    derivations:
      STUDYID: QS.STUDYID
      USUBJID: QS.USUBJID
      VISIT: QS.VISIT
      SCALE_ANCHOR:
        aggregate:
          filter: "QS.QSTESTCD = 'G01'"
          expr: "COUNT(QS.QSTESTCD)"
      SCALE_SUM:
        aggregate:
          filter: "QS.QSTESTCD IN ('G01', 'G02')"
          expr: "SUM(QS.QSSTRESN)"
      SCALE_ANS:
        aggregate:
          filter: "QS.QSTESTCD IN ('G01', 'G02')"
          expr: "COUNT(QS.QSSTRESN)"
      PARAMCD: {literal: GSCORE}
      PARAM: {literal: Global Health Scale Score}
      ITEMRESN: {literal: null}
      AVAL:
        case:
          - when: "SCALE_ANS >= 1"
            then:
              compute:
                expr: "100 * (SCALE_SUM / SCALE_ANS - 1) / 6"
          - otherwise: {literal: null}

verifications:
  - unique:
      columns: [STUDYID, USUBJID, VISIT, PARAMCD]
  - row_count:
      min: 22
      max: 22
  - assert:
      id: a-four-point-item-response-stays-within-the-answer-range
      when: "PARAMCD IN ('F101', 'F102', 'F103', 'F104', 'F201', 'F202',
        'S01', 'S02')"
      require: "AVAL IS NULL OR AVAL BETWEEN 1 AND 4"
  - assert:
      id: a-seven-point-item-response-stays-within-the-answer-range
      when: "PARAMCD IN ('G01', 'G02')"
      require: "AVAL IS NULL OR AVAL BETWEEN 1 AND 7"
