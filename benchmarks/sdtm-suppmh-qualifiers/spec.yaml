yamaa: "1.0"
type: spec
model: SDTM
domain: SUPPMH
keys: [STUDYID, RDOMAIN, USUBJID, IDVAR, IDVARVAL, QNAM]
input:
  MH_RAW: input/mh_raw.csv

output:
  path: suppmh.csv
  columns: [STUDYID, RDOMAIN, USUBJID, IDVAR, IDVARVAL, QNAM, QLABEL, QVAL,
            QORIG, QEVAL]
  # IDVARVAL is text, so parent sequences sort as text: 10 before 2.
  order_by: [STUDYID, RDOMAIN, USUBJID, IDVAR, IDVARVAL, QNAM]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: MH_RAW.STUDYID

  - name: RDOMAIN
    type: str
    label: Related Domain Abbreviation
    derivation: "'MH'"

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: MH_RAW.USUBJID

  - name: IDVAR
    type: str
    label: Identifying Variable
    derivation: "'MHSEQ'"

  - name: IDVARVAL
    type: str
    label: Identifying Variable Value
    derivation: MH_RAW.MHSEQ

  - name: QNAM
    type: str
    label: Qualifier Variable Name
    verifications:
      - allowed_values:
          values: [MHFAMHX, MHCONF]

  - name: QLABEL
    type: str
    label: Qualifier Label

  - name: QVAL
    type: str
    label: Data Value
    verifications:
      - not_missing
      - allowed_values:
          values: [Y, N]

  - name: QORIG
    type: str
    label: Origin
    derivation: "'Collected'"

  - name: QEVAL
    type: str
    label: Evaluator
    derivation: null

# One row template per qualifier. Each writes a row only for an MH record
# where that qualifier was collected; a blank answer writes none.
rows:
  - id: family_history
    filter: "MH_RAW.MHFAMHX IS NOT NULL"
    derivations:
      QNAM: "'MHFAMHX'"
      QLABEL: "'Family History'"
      QVAL: MH_RAW.MHFAMHX

  - id: medical_record_confirmation
    filter: "MH_RAW.MHCONF IS NOT NULL"
    derivations:
      QNAM: "'MHCONF'"
      QLABEL: "'Confirmed by Medical Records'"
      QVAL: MH_RAW.MHCONF

verifications:
  - row_count:
      min: 7
      max: 7
  - assert:
      id: qualifier-value-has-parent-identifier
      when: "QVAL IS NOT NULL"
      require: "RDOMAIN IS NOT NULL AND IDVAR IS NOT NULL
        AND IDVARVAL IS NOT NULL"
