<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="440" viewBox="0 0 1300 440" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
    <marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8e24aa"/></marker>
    <marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
  </defs>
  <rect width="1300" height="440" fill="#ffffff"/>
  <text x="40" y="42" font-weight="bold"><tspan font-size="24" fill="#6a1b9a">Harness</tspan><tspan font-size="24" fill="#222"> = the software around the </tspan><tspan font-size="24" fill="#e65100">LLM</tspan><tspan font-size="24" fill="#222"> that turns its predictions into actions</tspan></text>
  <rect x="20" y="205" width="110" height="70" rx="10" fill="#f5f5f5" stroke="#777" stroke-width="1.5"/>
  <text x="75" y="247" font-size="19" fill="#222" text-anchor="middle" font-weight="bold">User</text>
  <rect x="200" y="92" width="700" height="334" rx="14" fill="#faf5fc" stroke="#8e24aa" stroke-width="2.5" stroke-dasharray="8,6"/>
  <text x="220" y="118"><tspan font-size="17" fill="#6a1b9a">Harness</tspan><tspan font-size="14" fill="#6a1b9a">  e.g. OpenCode, Claude Code, Codex</tspan></text>
  <path d="M 132 240 L 218 240" fill="none" stroke="#222" stroke-width="2.5" marker-end="url(#a1)"/>
  <text x="164" y="231" font-size="14" fill="#222" text-anchor="middle" font-weight="bold" stroke="#ffffff" stroke-width="5" paint-order="stroke">prompt</text>
  <rect x="222" y="140" width="190" height="140" rx="10" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2"/>
  <text x="317" y="167" font-size="16" fill="#1565c0" text-anchor="middle" font-weight="bold">① Build the context</text>
  <text x="317" y="193" font-size="13" fill="#555" text-anchor="middle">system prompt · AGENTS.md</text>
  <text x="317" y="214" font-size="13" fill="#555" text-anchor="middle">skills · tool definitions</text>
  <text x="317" y="235" font-size="13" fill="#555" text-anchor="middle">history · results · memory</text>
  <text x="317" y="256" font-size="13" fill="#555" text-anchor="middle">compact it when it is full</text>
  <path d="M 414 210 L 454 210" fill="none" stroke="#444" stroke-width="2.5" marker-end="url(#a3)"/>
  <rect x="458" y="150" width="160" height="120" rx="10" fill="#fff3e0" stroke="#fb8c00" stroke-width="2.5"/>
  <text x="538" y="180" font-size="16" fill="#e65100" text-anchor="middle" font-weight="bold">② Call the LLM</text>
  <text x="538" y="210" text-anchor="middle"><tspan font-size="16" fill="#222">P</tspan><tspan font-size="12" fill="#222" dy="4">θ</tspan><tspan font-size="16" fill="#222" dy="-4">(x</tspan><tspan font-size="12" fill="#222" dy="4">t</tspan><tspan font-size="16" fill="#222" dy="-4"> | x</tspan><tspan font-size="12" fill="#222" dy="4">&lt;t</tspan><tspan font-size="16" fill="#222" dy="-4">)</tspan></text>
  <text x="538" y="244" font-size="13" fill="#555" text-anchor="middle">text or a tool call</text>
  <path d="M 620 210 L 660 210" fill="none" stroke="#444" stroke-width="2.5" marker-end="url(#a3)"/>
  <rect x="664" y="150" width="150" height="120" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="739" y="180" font-size="16" fill="#b71c1c" text-anchor="middle" font-weight="bold">③ Decide</text>
  <text x="739" y="206" font-size="13" fill="#555" text-anchor="middle">tool call → run it</text>
  <text x="739" y="226" font-size="13" fill="#555" text-anchor="middle">answer → stop</text>
  <text x="739" y="246" font-size="13" fill="#555" text-anchor="middle">limit or error → stop</text>
  <path d="M 739 272 L 739 300" fill="none" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#a2)"/>
  <text x="749" y="291" font-size="13" fill="#2e7d32" font-weight="bold" stroke="#ffffff" stroke-width="5" paint-order="stroke">tool call</text>
  <rect x="614" y="304" width="250" height="92" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="739" y="330" font-size="16" fill="#1b5e20" text-anchor="middle" font-weight="bold">④ Run the tool</text>
  <text x="739" y="354" font-size="13" fill="#555" text-anchor="middle">permission: allow · ask · deny</text>
  <text x="739" y="375" font-size="13" fill="#555" text-anchor="middle">run it, capture output or error</text>
  <path d="M 612 350 L 317 350 L 317 284" fill="none" stroke="#1565c0" stroke-width="2.5" marker-end="url(#a0)"/>
  <text x="465" y="342" font-size="13" fill="#1565c0" text-anchor="middle" font-weight="bold" stroke="#ffffff" stroke-width="5" paint-order="stroke">result added to the context</text>
  <rect x="1000" y="140" width="280" height="80" rx="10" fill="#fffde7" stroke="#f9a825" stroke-width="2.5"/>
  <text x="1140" y="172" font-size="17" fill="#b45309" text-anchor="middle" font-weight="bold">Memory</text>
  <text x="1140" y="198" font-size="13" fill="#555" text-anchor="middle">knowledge graph</text>
  <path d="M 998 180 L 904 180" fill="none" stroke="#8e24aa" stroke-width="2.5" marker-end="url(#a4)" stroke-dasharray="7,5"/>
  <text x="951" y="170" font-size="14" fill="#8e24aa" text-anchor="middle" font-weight="bold" stroke="#ffffff" stroke-width="5" paint-order="stroke">retrieve</text>
  <path d="M 1140 222 L 1140 266" fill="none" stroke="#444" stroke-width="2.5" marker-end="url(#a3)" marker-start="url(#a3)"/>
  <rect x="1000" y="270" width="280" height="150" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="1140" y="300" font-size="17" fill="#1b5e20" text-anchor="middle" font-weight="bold">Tools</text>
  <text x="1140" y="326" font-size="13" fill="#555" text-anchor="middle">search · code · APIs</text>
  <text x="1140" y="348" font-size="13" fill="#555" text-anchor="middle">e.g. read · edit · grep · bash</text>
  <text x="1140" y="370" font-size="13" fill="#555" text-anchor="middle">files · R · Python · opensas</text>
  <text x="1140" y="392" font-size="13" fill="#555" text-anchor="middle">only what the sandbox allows</text>
  <path d="M 866 330 L 996 330" fill="none" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#a2)"/>
  <text x="931" y="320" font-size="14" fill="#2e7d32" text-anchor="middle" font-weight="bold" stroke="#ffffff" stroke-width="5" paint-order="stroke">action</text>
  <path d="M 998 372 L 868 372" fill="none" stroke="#1565c0" stroke-width="2.5" marker-end="url(#a0)"/>
  <text x="931" y="392" font-size="14" fill="#1565c0" text-anchor="middle" font-weight="bold" stroke="#ffffff" stroke-width="5" paint-order="stroke">output</text>
  <path d="M 739 148 L 739 78 L 75 78 L 75 201" fill="none" stroke="#c62828" stroke-width="2.5" marker-end="url(#a5)"/>
  <text x="420" y="70" font-size="14" fill="#c62828" text-anchor="middle" font-weight="bold">final answer</text>
  <text x="550" y="412" font-size="13" fill="#6a1b9a" text-anchor="middle">guardrails and records: permissions · hooks (lint, tests) · a log of every action · saved state</text>
</svg>
