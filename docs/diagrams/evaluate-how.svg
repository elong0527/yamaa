<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="425" viewBox="0 0 1230 425" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
  </defs>
  <rect width="1230" height="425" fill="#ffffff"/>
  <text x="20" y="24" font-size="15" font-weight="bold" fill="#444">Rule-based, cheap, repeatable</text>
  <text x="1210" y="24" font-size="15" font-weight="bold" fill="#444" text-anchor="end">Judgment-based, costly, less repeatable</text>
  <line x1="20" y1="44" x2="1210" y2="44" stroke="#444" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="20" y="72" width="370" height="335" rx="14" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2.5"/>
  <text x="40" y="112" font-size="26" font-weight="bold" fill="#1565c0">Code-based</text>
  <line x1="40" y1="126" x2="370" y2="126" stroke="#1e88e5" stroke-width="1.5" opacity="0.5"/>
  <text x="40" y="154" font-size="12" font-weight="bold" fill="#999" letter-spacing="1">HOW</text>
  <text x="40" y="176" font-size="15" fill="#222">Multiple-choice and exact match,</text>
  <text x="40" y="196" font-size="15" fill="#222">schema checks, tests, cell compare</text>
  <text x="40" y="230" font-size="12" font-weight="bold" fill="#2e7d32" letter-spacing="1">PROS</text>
  <circle cx="48" cy="249" r="8" fill="#2e7d32"/>
  <text x="48" y="253.5" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">+</text>
  <text x="64" y="254" font-size="15" fill="#222">Deterministic and repeatable</text>
  <circle cx="48" cy="275" r="8" fill="#2e7d32"/>
  <text x="48" y="279.5" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">+</text>
  <text x="64" y="280" font-size="15" fill="#222">Cheap and fast</text>
  <text x="40" y="310" font-size="12" font-weight="bold" fill="#c62828" letter-spacing="1">CONS</text>
  <circle cx="48" cy="329" r="8" fill="#c62828"/>
  <text x="48" y="333.5" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">−</text>
  <text x="64" y="334" font-size="15" fill="#222">Rejects valid alternatives</text>
  <circle cx="48" cy="355" r="8" fill="#c62828"/>
  <text x="48" y="359.5" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">−</text>
  <text x="64" y="360" font-size="15" fill="#222">Cannot judge subjective quality</text>
  <rect x="430" y="72" width="370" height="335" rx="14" fill="#fff3e0" stroke="#fb8c00" stroke-width="2.5"/>
  <text x="450" y="112" font-size="26" font-weight="bold" fill="#e65100">LLM-as-a-judge</text>
  <line x1="450" y1="126" x2="780" y2="126" stroke="#fb8c00" stroke-width="1.5" opacity="0.5"/>
  <text x="450" y="154" font-size="12" font-weight="bold" fill="#999" letter-spacing="1">HOW</text>
  <text x="450" y="176" font-size="15" fill="#222">Rubric, pairwise, or</text>
  <text x="450" y="196" font-size="15" fill="#222">reference-based scoring</text>
  <text x="450" y="230" font-size="12" font-weight="bold" fill="#2e7d32" letter-spacing="1">PROS</text>
  <circle cx="458" cy="249" r="8" fill="#2e7d32"/>
  <text x="458" y="253.5" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">+</text>
  <text x="474" y="254" font-size="15" fill="#222">Scales to open-ended output</text>
  <circle cx="458" cy="275" r="8" fill="#2e7d32"/>
  <text x="458" y="279.5" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">+</text>
  <text x="474" y="280" font-size="15" fill="#222">Explains its verdict</text>
  <text x="450" y="310" font-size="12" font-weight="bold" fill="#c62828" letter-spacing="1">CONS</text>
  <circle cx="458" cy="329" r="8" fill="#c62828"/>
  <text x="458" y="333.5" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">−</text>
  <text x="474" y="334" font-size="15" fill="#222">Position, length, self-preference bias</text>
  <circle cx="458" cy="355" r="8" fill="#c62828"/>
  <text x="458" y="359.5" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">−</text>
  <text x="474" y="360" font-size="15" fill="#222">Non-deterministic</text>
  <circle cx="458" cy="381" r="8" fill="#c62828"/>
  <text x="458" y="385.5" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">−</text>
  <text x="474" y="386" font-size="15" fill="#222">Needs calibration against humans</text>
  <rect x="840" y="72" width="370" height="335" rx="14" fill="#f3e5f5" stroke="#ab47bc" stroke-width="2.5"/>
  <text x="860" y="112" font-size="26" font-weight="bold" fill="#6a1b9a">Human review</text>
  <line x1="860" y1="126" x2="1190" y2="126" stroke="#ab47bc" stroke-width="1.5" opacity="0.5"/>
  <text x="860" y="154" font-size="12" font-weight="bold" fill="#999" letter-spacing="1">HOW</text>
  <text x="860" y="176" font-size="15" fill="#222">Expert review, spot checks,</text>
  <text x="860" y="196" font-size="15" fill="#222">adjudication</text>
  <text x="860" y="230" font-size="12" font-weight="bold" fill="#2e7d32" letter-spacing="1">PROS</text>
  <circle cx="868" cy="249" r="8" fill="#2e7d32"/>
  <text x="868" y="253.5" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">+</text>
  <text x="884" y="254" font-size="15" fill="#222">Gold standard for quality</text>
  <circle cx="868" cy="275" r="8" fill="#2e7d32"/>
  <text x="868" y="279.5" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">+</text>
  <text x="884" y="280" font-size="15" fill="#222">Catches what rubrics miss</text>
  <text x="860" y="310" font-size="12" font-weight="bold" fill="#c62828" letter-spacing="1">CONS</text>
  <circle cx="868" cy="329" r="8" fill="#c62828"/>
  <text x="868" y="333.5" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">−</text>
  <text x="884" y="334" font-size="15" fill="#222">Slow and costly</text>
  <circle cx="868" cy="355" r="8" fill="#c62828"/>
  <text x="868" y="359.5" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">−</text>
  <text x="884" y="360" font-size="15" fill="#222">Reviewers can disagree</text>
</svg>
