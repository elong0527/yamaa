<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="400" viewBox="0 0 1050 400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
    <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8e24aa"/></marker>
  </defs>
  <rect width="1050" height="400" fill="#ffffff"/>

  <text x="30" y="42" font-size="26" font-weight="bold" fill="#222">AI agent  ≈  <tspan fill="#e65100">LLM</tspan>  +  <tspan fill="#6a1b9a">Harness</tspan>  +  <tspan fill="#2e7d32">Tools</tspan></text>

  <!-- User -->
  <rect x="15" y="200" width="110" height="70" rx="10" fill="#f5f5f5" stroke="#777" stroke-width="1.5"/>
  <text x="70" y="242" font-size="19" text-anchor="middle" font-weight="bold" fill="#222">User</text>
  

  <!-- Harness -->
  <rect x="200" y="110" width="530" height="270" rx="14" fill="#faf5fc" stroke="#8e24aa" stroke-width="2.5" stroke-dasharray="10,6"/>
  <text x="220" y="138" font-size="17" font-weight="bold" fill="#6a1b9a">Harness</text>
  <text x="465" y="365" font-size="14" text-anchor="middle" fill="#6a1b9a">runs the loop · decides when to stop · guardrails</text>

  <!-- Context -->
  <rect x="230" y="170" width="190" height="110" rx="10" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2"/>
  <text x="325" y="218" font-size="19" text-anchor="middle" font-weight="bold" fill="#1565c0">Context</text>
  <text x="325" y="246" font-size="15" text-anchor="middle" fill="#555">x&lt;t</text>

  <line x1="422" y1="225" x2="506" y2="225" stroke="#444" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- LLM -->
  <rect x="510" y="170" width="190" height="110" rx="10" fill="#fff3e0" stroke="#fb8c00" stroke-width="2.5"/>
  <text x="605" y="218" font-size="21" text-anchor="middle" font-weight="bold" fill="#e65100">LLM</text>
  <text x="605" y="248" font-size="16" text-anchor="middle" fill="#222">P<tspan font-size="12" dy="4">θ</tspan><tspan dy="-4">(x</tspan><tspan font-size="12" dy="4">t</tspan><tspan dy="-4"> | x</tspan><tspan font-size="12" dy="4">&lt;t</tspan><tspan dy="-4">)</tspan></text>

  <!-- Tools -->
  <rect x="850" y="150" width="170" height="80" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="935" y="185" font-size="19" text-anchor="middle" font-weight="bold" fill="#1b5e20">Tools</text>
  <text x="935" y="210" font-size="13" text-anchor="middle" fill="#555">search · code · APIs</text>

  <!-- Memory -->
  <rect x="850" y="300" width="170" height="80" rx="10" fill="#fffde7" stroke="#f9a825" stroke-width="2.5"/>
  <text x="935" y="335" font-size="19" text-anchor="middle" font-weight="bold" fill="#f57f17">Memory</text>
  <text x="935" y="360" font-size="13" text-anchor="middle" fill="#555">knowledge graph</text>

  <!-- action -->
  <line x1="702" y1="190" x2="846" y2="190" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#arg)"/>
  <text x="790" y="180" stroke="#ffffff" stroke-width="5" paint-order="stroke" font-size="14" text-anchor="middle" fill="#2e7d32" font-weight="bold">action</text>

  <!-- result -->
  <path d="M 848 215 H 765 V 310 H 325 V 284" fill="none" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arb)"/>
  <text x="545" y="303" font-size="14" text-anchor="middle" fill="#1565c0" font-weight="bold">result</text>

  <!-- memory links -->
  <line x1="975" y1="232" x2="975" y2="296" stroke="#444" stroke-width="2.5" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <path d="M 848 350 H 734" fill="none" stroke="#8e24aa" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arp)"/>
  <text x="790" y="340" stroke="#ffffff" stroke-width="5" paint-order="stroke" font-size="14" text-anchor="middle" fill="#8e24aa" font-weight="bold">retrieve</text>

  <!-- final answer -->
  <path d="M 605 168 V 78 H 70 V 196" fill="none" stroke="#c62828" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="350" y="70" font-size="14" text-anchor="middle" fill="#c62828" font-weight="bold">final answer</text>
  <!-- prompt arrow (drawn last so it sits on top) -->
  <line x1="127" y1="235" x2="226" y2="235" stroke="#222" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="162" y="226" font-size="14" text-anchor="middle" fill="#222" font-weight="bold">prompt</text>
</svg>
