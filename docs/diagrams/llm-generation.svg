<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="555" viewBox="0 0 1300 555" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/>
    </marker>
  </defs>
  <rect width="1300" height="555" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="38" font-size="24" font-weight="bold" fill="#222">How an LLM generates output:  P<tspan font-size="16" dy="5">θ</tspan><tspan dy="-5">(x</tspan><tspan font-size="16" dy="5">t</tspan><tspan dy="-5"> | x</tspan><tspan font-size="16" dy="5">&lt;t</tspan><tspan dy="-5">)</tspan></text>

  <!-- Step 1: raw prompt -->
  <text x="40" y="78" font-size="14" fill="#888">① Prompt (text)</text>
  <rect x="40" y="88" width="320" height="40" rx="6" fill="#f5f5f5" stroke="#999"/>
  <text x="200" y="114" font-size="18" text-anchor="middle" fill="#222">"Thanksgiving is celebrated in"</text>
  <line x1="200" y1="128" x2="200" y2="158" stroke="#444" stroke-width="2" marker-end="url(#ar)"/>
  <text x="212" y="148" font-size="13" fill="#666">tokenize</text>

  <!-- Step 2: tokens -->
  <text x="40" y="178" font-size="14" fill="#888">② Tokens = context x≤5  (4 words → 5 tokens)</text>
  <g font-size="16" text-anchor="middle">
    <rect x="40" y="188" width="100" height="64" rx="6" fill="#e3f2fd" stroke="#1e88e5"/>
    <text x="90" y="212" fill="#1565c0" font-weight="bold">x₁</text>
    <text x="90" y="232" fill="#222">"Thanks"</text>
    <text x="90" y="247" font-size="12" fill="#777">id 9690</text>

    <rect x="150" y="188" width="100" height="64" rx="6" fill="#e3f2fd" stroke="#1e88e5"/>
    <text x="200" y="212" fill="#1565c0" font-weight="bold">x₂</text>
    <text x="200" y="232" fill="#222">"giving"</text>
    <text x="200" y="247" font-size="12" fill="#777">id 13992</text>

    <rect x="260" y="188" width="100" height="64" rx="6" fill="#e3f2fd" stroke="#1e88e5"/>
    <text x="310" y="212" fill="#1565c0" font-weight="bold">x₃</text>
    <text x="310" y="232" fill="#222">" is"</text>
    <text x="310" y="247" font-size="12" fill="#777">id 318</text>

    <rect x="370" y="188" width="100" height="64" rx="6" fill="#e3f2fd" stroke="#1e88e5"/>
    <text x="420" y="212" fill="#1565c0" font-weight="bold">x₄</text>
    <text x="420" y="232" fill="#222" font-size="14">" celebrated"</text>
    <text x="420" y="247" font-size="12" fill="#777">id 13943</text>

    <rect x="480" y="188" width="100" height="64" rx="6" fill="#e3f2fd" stroke="#1e88e5"/>
    <text x="530" y="212" fill="#1565c0" font-weight="bold">x₅</text>
    <text x="530" y="232" fill="#222">" in"</text>
    <text x="530" y="247" font-size="12" fill="#777">id 287</text>
  </g>
  <path d="M 44 260 L 44 268 L 246 268 L 246 260" fill="none" stroke="#d81b60" stroke-width="2"/>
  <text x="145" y="288" font-size="13" text-anchor="middle" fill="#d81b60" font-weight="bold">1 word "Thanksgiving" = 2 tokens</text>

  <!-- Step 3: model -->
  <line x1="582" y1="220" x2="632" y2="220" stroke="#444" stroke-width="2" marker-end="url(#ar)"/>
  <text x="640" y="178" font-size="14" fill="#888">③ Trained model (given)</text>
  <rect x="636" y="188" width="200" height="64" rx="8" fill="#fff3e0" stroke="#fb8c00" stroke-width="2"/>
  <text x="736" y="216" font-size="20" text-anchor="middle" font-weight="bold" fill="#e65100">LLM</text>
  <text x="736" y="240" font-size="13" text-anchor="middle" fill="#777">θ fixed (~10⁹–10¹² params)</text>
  <line x1="838" y1="220" x2="888" y2="220" stroke="#444" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Step 4: distribution -->
  <text x="900" y="78" font-size="14" fill="#888">④ Probability of every token in vocab (~100K)</text>
  <text x="900" y="102" font-size="17" font-weight="bold" fill="#222">P<tspan font-size="12" dy="4">θ</tspan><tspan dy="-4">(x₆ | x≤5)</tspan></text>
  <g font-size="14">
    <text x="1012" y="137" text-anchor="end" fill="#222">" November"</text>
    <rect x="1020" y="123" width="203" height="20" fill="#2e7d32"/>
    <text x="1229" y="138" fill="#222">0.81</text>

    <text x="1012" y="167" text-anchor="end" fill="#222">" the"</text>
    <rect x="1020" y="153" width="18" height="20" fill="#90a4ae"/>
    <text x="1044" y="168" fill="#222">0.07</text>

    <text x="1012" y="197" text-anchor="end" fill="#222">" America"</text>
    <rect x="1020" y="183" width="10" height="20" fill="#90a4ae"/>
    <text x="1036" y="198" fill="#222">0.04</text>

    <text x="1012" y="227" text-anchor="end" fill="#222">" October"</text>
    <rect x="1020" y="213" width="8" height="20" fill="#90a4ae"/>
    <text x="1034" y="228" fill="#222">0.03</text>

    <text x="1012" y="257" text-anchor="end" fill="#777">~100K others (incl. ⟨EOS⟩)</text>
    <rect x="1020" y="243" width="13" height="20" fill="#cfd8dc"/>
    <text x="1039" y="258" fill="#777">0.05</text>
  </g>
  <line x1="1020" y1="115" x2="1020" y2="270" stroke="#999"/>

  <!-- Step 5: sample & loop -->
  <path d="M 1150 145 C 1150 350, 760 290, 645 365" fill="none" stroke="#2e7d32" stroke-width="2.5" stroke-dasharray="7,5" marker-end="url(#arg)"/>
  <text x="880" y="330" font-size="14" fill="#2e7d32" font-weight="bold">⑤ sample x₆, append to context</text>

  <text x="40" y="340" font-size="14" fill="#888">⑥ Repeat (append, predict next) until the end-of-sequence token</text>
  <g font-size="15" text-anchor="middle">
    <rect x="40" y="370" width="100" height="44" rx="6" fill="#e3f2fd" stroke="#1e88e5"/><text x="90" y="397">"Thanks"</text>
    <rect x="150" y="370" width="100" height="44" rx="6" fill="#e3f2fd" stroke="#1e88e5"/><text x="200" y="397">"giving"</text>
    <rect x="260" y="370" width="100" height="44" rx="6" fill="#e3f2fd" stroke="#1e88e5"/><text x="310" y="397">" is"</text>
    <rect x="370" y="370" width="100" height="44" rx="6" fill="#e3f2fd" stroke="#1e88e5"/><text x="420" y="397" font-size="13">" celebrated"</text>
    <rect x="480" y="370" width="100" height="44" rx="6" fill="#e3f2fd" stroke="#1e88e5"/><text x="530" y="397">" in"</text>
    <rect x="590" y="370" width="110" height="44" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/><text x="645" y="397" fill="#1b5e20" font-weight="bold">" November"</text>
    <rect x="710" y="370" width="70" height="44" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/><text x="745" y="397" fill="#1b5e20" font-weight="bold">"."</text>
    <rect x="790" y="370" width="100" height="44" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="2.5"/><text x="840" y="397" fill="#b71c1c" font-weight="bold">⟨EOS⟩</text>
  </g>
  <g font-size="13" text-anchor="middle" fill="#333" font-weight="bold">
    <text x="645" y="433">x₆  p=0.81</text>
    <text x="745" y="433">x₇  p=0.58</text>
    <text x="840" y="433">x₈  p=0.85</text>
  </g>
  <line x1="892" y1="392" x2="932" y2="392" stroke="#c62828" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="938" y="372" width="80" height="40" rx="20" fill="#c62828"/>
  <text x="978" y="398" font-size="16" text-anchor="middle" fill="#fff" font-weight="bold">STOP</text>
  <text x="1034" y="388" font-size="13" fill="#555">Output returned:</text>
  <text x="1034" y="406" font-size="14" fill="#222" font-weight="bold">"November."</text>

  <text x="40" y="468" font-size="14" fill="#222">Each step calls the same LLM on the growing context:  P<tspan font-size="11" dy="4">θ</tspan><tspan dy="-4">(x₆ | x≤5) → P</tspan><tspan font-size="11" dy="4">θ</tspan><tspan dy="-4">(x₇ | x≤6) → P</tspan><tspan font-size="11" dy="4">θ</tspan><tspan dy="-4">(x₈ | x≤7) → …</tspan></text>
  <text x="40" y="492" font-size="14" fill="#222"><tspan fill="#b71c1c" font-weight="bold">⟨EOS⟩</tspan> = special "end-of-sequence" token in the vocabulary; it gets a probability like any other token. Generation stops when it is sampled</text>
  <text x="40" y="512" font-size="13" fill="#777">(or when a max-token limit / user-defined stop sequence is reached).</text>
  <text x="1260" y="540" font-size="12" text-anchor="end" fill="#999">Token splits, IDs and probabilities are illustrative</text>
</svg>
