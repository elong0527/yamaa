schema_version: "1.0"
domain: ADLB
keys: [STUDYID, USUBJID, PARAMCD, ADT]
input:
  ADLBIN: {path: input/adlb_pre.csv, types: {AVAL: float, ADT: date}}

output:
  path: adlb.csv
  columns: [STUDYID, USUBJID, PARAMCD, ADT, AVAL, ABLFL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: ADLBIN.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: ADLBIN.USUBJID

  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation: ADLBIN.PARAMCD

  - name: ADT
    type: date
    label: Analysis Date
    derivation: ADLBIN.ADT

  - name: AVAL
    type: float
    label: Analysis Value
    derivation: ADLBIN.AVAL

  - name: ABLFL
    type: str
    label: Baseline Record Flag
    derivation: ADLBIN.ABLFL

verifications:
  - unique:
      columns: [STUDYID, USUBJID, PARAMCD, ADT]
  - row_count:
      group_by: [STUDYID, USUBJID, PARAMCD]
      filter: "ABLFL = 'Y'"
      min: 1
      max: 1
