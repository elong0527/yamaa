schema_version: "1.0"
domain: ADAE
keys: [STUDYID, USUBJID, AESEQ]
input:
  ADAEPRE: input/adae_pre.csv

output:
  path: adae.csv
  columns: [STUDYID, USUBJID, AESEQ, AEBODSYS, AEDECOD, ASTDT, AESEV, TRTEMFL, AESEVN, AWSEVFL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: ADAEPRE.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: ADAEPRE.USUBJID

  - name: AESEQ
    type: int
    label: Sequence Number
    derivation: ADAEPRE.AESEQ

  - name: AEBODSYS
    type: str
    label: Body System or Organ Class
    derivation: ADAEPRE.AEBODSYS

  - name: AEDECOD
    type: str
    label: Dictionary-Derived Term
    derivation: ADAEPRE.AEDECOD

  - name: ASTDT
    type: date
    label: Analysis Start Date
    derivation: ADAEPRE.ASTDT

  - name: AESEV
    type: str
    label: Severity/Intensity
    derivation: ADAEPRE.AESEV
    verifications:
      allowed_values:
        values: [MILD, MODERATE, SEVERE]

  - name: TRTEMFL
    type: str
    label: Treatment Emergent Analysis Flag
    derivation: ADAEPRE.TRTEMFL
    verifications:
      allowed_values:
        values: [Y]

  - name: AESEVN
    type: int
    label: Severity/Intensity (N)
    derivation:
      mapping:
        source: AESEV
        dict:
          MILD: 1
          MODERATE: 2
          SEVERE: 3
        missing: null
    verifications:
      range:
        min: 1
        max: 3

  - name: AWSRNK
    type: int
    label: Worst Severity Rank
    derivation:
      row_number:
        window:
          group_by: [STUDYID, USUBJID, AEDECOD]
          order_by:
            - {variable: AESEVN, direction: desc}
            - ASTDT
            - AESEQ
          filter: "TRTEMFL = 'Y' AND AESEVN IS NOT NULL"

  - name: AWSEVFL
    type: str
    label: Worst Severity Flag
    derivation:
      case:
        - when: "AWSRNK = 1"
          then:
            literal: Y

verifications:
  - unique:
      columns: [STUDYID, USUBJID, AESEQ]
  - row_count:
      min: 8
      max: 8
  - implies:
      id: worst-severity-flag-requires-graded-treatment-emergent-event
      when: "AWSEVFL = 'Y'"
      then: "TRTEMFL = 'Y' AND AESEVN IS NOT NULL"
