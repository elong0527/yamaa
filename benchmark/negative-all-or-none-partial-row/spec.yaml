schema_version: "1.0"
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  DM: input/dm.csv

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, RFSTD, DTHDT]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  - name: RFSTD
    type: date
    label: Reference Start Date
    derivation: DM.RFSTDT

  - name: DTHDT
    type: date
    label: Date of Death
    derivation: DM.DTHDTC

verifications:
  - all_or_none:
      id: paired-death-dates
      columns: [RFSTD, DTHDT]
