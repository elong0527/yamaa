schema_version: "1.0"
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  DM: input/dm.csv
  ADSL_RAW: input/adsl_raw.csv
base: DM

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, TRT01A]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  - name: TRT01A
    type: str
    label: Actual Treatment for Period 01
    derivation:
      lookup:
        dataset: ADSL_RAW
        value: TRT01A
