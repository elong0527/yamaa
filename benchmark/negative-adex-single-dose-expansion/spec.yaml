schema_version: "1.0"
domain: ADEX
keys: [STUDYID, USUBJID, EXSEQ, ADOSEN]
input:
  EX:
    path: input/ex.csv
    types: {EXSEQ: int, EXDOSE: float, EXDOSCNT: int}

output:
  path: adex.csv
  columns: [STUDYID, USUBJID, EXSEQ, EXTRT, EXDOSE, EXDOSU, ASTDT, AENDT, ADOSEN, NDOSE]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: EX.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: EX.USUBJID

  - name: EXSEQ
    type: int
    label: Sequence Number
    derivation: EX.EXSEQ

  - name: EXTRT
    type: str
    label: Name of Treatment
    derivation: EX.EXTRT

  - name: EXDOSE
    type: float
    label: Dose
    derivation: EX.EXDOSE

  - name: EXDOSU
    type: str
    label: Dose Units
    derivation: EX.EXDOSU

  - name: ASTDT
    type: date
    label: Analysis Start Date
    derivation: EX.EXSTDTC

  - name: AENDT
    type: date
    label: Analysis End Date
    derivation: EX.EXENDTC

  - name: ADOSEN
    type: int
    label: Administration Sequence Number

  - name: NDOSE
    type: int
    label: Number of Administrations
    derivation: EX.EXDOSCNT

  - name: NDOSMAX
    type: int
    label: Maximum Administration Sequence Number
    derivation:
      aggregate:
        group_by: [STUDYID, USUBJID, EXSEQ]
        expr: "MAX(ADOSEN)"

rows:
  - id: dose_1
    filter: "EX.EXDOSCNT >= 1"
    derivations:
      ADOSEN:
        literal: 1

  - id: dose_2
    filter: "EX.EXDOSCNT >= 2"
    derivations:
      ADOSEN:
        literal: 2

  - id: dose_3
    filter: "EX.EXDOSCNT >= 3"
    derivations:
      ADOSEN:
        literal: 3

verifications:
  - unique:
      columns: [STUDYID, USUBJID, EXSEQ, ADOSEN]
  - predicate:
      id: a-record-is-expanded-into-every-administration-it-holds
      assert: "NDOSMAX = NDOSE"
