schema_version: "1.0"
domain: SUPPDM
input:
  ODM: input/odm.csv
keys: [STUDYID, RDOMAIN, USUBJID, IDVAR, IDVARVAL, QNAM]

output:
  path: suppdm.csv
  columns: [STUDYID, RDOMAIN, USUBJID, IDVAR, IDVARVAL, QNAM, QLABEL, QVAL, QORIG, QEVAL]
  order_by: [STUDYID, RDOMAIN, USUBJID, IDVAR, IDVARVAL, QNAM]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier

  - name: USUBJID
    type: str
    label: Unique Subject Identifier

  - name: RACECOUNT
    type: int
    label: Number of Reported Races

  - name: RDOMAIN
    type: str
    label: Related Domain Abbreviation
    derivation:
      literal: DM

  - name: IDVAR
    type: str
    label: Identifying Variable
    derivation:
      literal: USUBJID

  - name: IDVARVAL
    type: str
    label: Identifying Variable Value
    derivation:
      source: USUBJID
    verifications:
      not_missing: {}

  - name: QNAM
    type: str
    label: Qualifier Variable Name
    verifications:
      allowed_values:
        values: [RACE1, RACE2]

  - name: QLABEL
    type: str
    label: Qualifier Label

  - name: QVALRAW
    type: str
    label: Collected Race

  - name: QVAL
    type: str
    label: Data Value
    derivation:
      mapping:
        source: QVALRAW
        dict:
          "American Indian or Alaska Native": AMERICAN INDIAN OR ALASKA NATIVE
          "Asian": ASIAN
          "Black or African American": BLACK OR AFRICAN AMERICAN
          "Native Hawaiian or Other Pacific Islander": NATIVE HAWAIIAN OR OTHER PACIFIC ISLANDER
          "White": WHITE
          "Other, specify: Fijian": OTHER
          "Not reported": NOT REPORTED
          "Subject refused": UNKNOWN
        missing: null
    verifications:
      - not_missing: {}
      - allowed_values:
          values: [AMERICAN INDIAN OR ALASKA NATIVE, ASIAN,
            BLACK OR AFRICAN AMERICAN,
            NATIVE HAWAIIAN OR OTHER PACIFIC ISLANDER, WHITE,
            OTHER, NOT REPORTED, UNKNOWN]

  - name: QORIG
    type: str
    label: Origin
    derivation:
      literal: CRF

  - name: QEVAL
    type: str
    label: Evaluator
    derivation:
      literal: null

rows:
  - id: first_reported_race
    group_by: [ODM.StudyOID, ODM.SubjectKey]
    filter: "RACECOUNT >= 2"
    derivations:
      STUDYID:
        source: ODM.StudyOID
      USUBJID:
        source: ODM.SubjectKey
      RACECOUNT:
        aggregate:
          filter: "ODM.ItemOID = 'IT.DM.RACE'"
          expr: "COUNT(ODM.Value)"
      QVALRAW:
        aggregate:
          filter: "ODM.ItemOID = 'IT.DM.RACE'"
          expr: "MIN(ODM.Value)"
      QNAM:
        literal: RACE1
      QLABEL:
        literal: Race 1

  - id: second_reported_race
    group_by: [ODM.StudyOID, ODM.SubjectKey]
    filter: "RACECOUNT >= 2"
    derivations:
      STUDYID:
        source: ODM.StudyOID
      USUBJID:
        source: ODM.SubjectKey
      RACECOUNT:
        aggregate:
          filter: "ODM.ItemOID = 'IT.DM.RACE'"
          expr: "COUNT(ODM.Value)"
      QVALRAW:
        aggregate:
          filter: "ODM.ItemOID = 'IT.DM.RACE'"
          expr: "MAX(ODM.Value)"
      QNAM:
        literal: RACE2
      QLABEL:
        literal: Race 2

verifications:
  - unique:
      columns: [STUDYID, RDOMAIN, USUBJID, IDVAR, IDVARVAL, QNAM]
  - row_count:
      min: 4
      max: 4
  - predicate:
      id: at-most-two-reported-races
      assert: "RACECOUNT <= 2"
  - implies:
      id: race-value-has-parent-identifier
      when: "QVAL IS NOT NULL"
      then: "RDOMAIN IS NOT NULL AND IDVAR IS NOT NULL AND IDVARVAL IS NOT NULL"
