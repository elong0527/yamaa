schema_version: "1.0"
domain: ADVS
keys: [STUDYID, USUBJID, VISIT, PARAMCD]
input:
  ADVS_RAW: {path: input/advs.csv, types: {AVAL: float}}

output:
  path: advs.csv
  columns: [STUDYID, USUBJID, PARAMCD, PARAM, AVAL, VISIT, DTYPE]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier

  - name: USUBJID
    type: str
    label: Unique Subject Identifier

  - name: PARAMCD
    type: str
    label: Parameter Code

  - name: PARAM
    type: str
    label: Parameter

  - name: HEIGHT_VAL
    type: float
    label: Height Value

  - name: WEIGHT_VAL
    type: float
    label: Weight Value

  - name: AVAL
    type: float
    label: Analysis Value

  - name: VISIT
    type: str
    label: Visit Name

  - name: DTYPE
    type: str
    label: Derivation Type

rows:
  - id: collected
    derivations:
      STUDYID: {source: ADVS_RAW.STUDYID}
      USUBJID: {source: ADVS_RAW.USUBJID}
      PARAMCD: {source: ADVS_RAW.PARAMCD}
      PARAM: {source: ADVS_RAW.PARAM}
      HEIGHT_VAL: {literal: null}
      WEIGHT_VAL: {literal: null}
      AVAL: {source: ADVS_RAW.AVAL}
      VISIT: {source: ADVS_RAW.VISIT}
      DTYPE: {literal: null}

  - id: derived_bsa
    group_by: [ADVS_RAW.STUDYID, ADVS_RAW.USUBJID, ADVS_RAW.VISIT]
    filter: "HEIGHT_VAL IS NOT NULL AND WEIGHT_VAL IS NOT NULL"
    derivations:
      STUDYID: {source: ADVS_RAW.STUDYID}
      USUBJID: {source: ADVS_RAW.USUBJID}
      PARAMCD: {literal: BSA}
      PARAM: {literal: Body Surface Area (m^2)}
      HEIGHT_VAL:
        aggregate:
          filter: "ADVS_RAW.PARAMCD = 'HEIGHT'"
          expr: "ONLY(ADVS_RAW.AVAL)"
      WEIGHT_VAL:
        aggregate:
          filter: "ADVS_RAW.PARAMCD = 'WEIGHT'"
          expr: "ONLY(ADVS_RAW.AVAL)"
      AVAL:
        compute:
          expr: "SQRT(WEIGHT_VAL * HEIGHT_VAL / 3600)"
      VISIT: {source: ADVS_RAW.VISIT}
      DTYPE: {literal: CALCULATION}

verifications:
  - unique:
      columns: [STUDYID, USUBJID, VISIT, PARAMCD]
  - assert:
      id: no-pre-existing-target
      expr: "NOT (PARAMCD = 'BSA' AND DTYPE IS NULL)"
  - assert:
      id: verify-height-unit
      expr: "PARAMCD <> 'HEIGHT' OR PARAM LIKE '%(cm)%'"
  - assert:
      id: verify-weight-unit
      expr: "PARAMCD <> 'WEIGHT' OR PARAM LIKE '%(kg)%'"
