schema_version: "1.0"
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  DM: input/dm.csv
  EX: {path: input/ex.csv, types: {EXSEQ: int}}
base: DM

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, TRT01A, TRTSDT, TRTEDT, TRTDURD, SAFFL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: DM.USUBJID

  - name: TRT01RAW
    type: str
    label: First Actual Treatment from Exposure
    derivation:
      lookup:
        dataset: EX
        source: [STUDYID, USUBJID]
        key: [STUDYID, USUBJID]
        value: EXTRT
        filter: "EX.EXTRT IN ('VITAMIN D3', 'PLACEBO') AND EX.EXSTDTC IS NOT NULL"
        order_by:
          - variable: EX.EXSTDTC
          - variable: EX.EXSEQ
        keep: first
  - name: TRT01SRC
    type: str
    label: Selected Actual Treatment for Period 01
    derivation:
      first_available:
        sources: [TRT01RAW, DM.ACTARM]
        default: NOT TREATED

  - name: TRT01A
    type: str
    label: Actual Treatment for Period 01
    derivation:
      str_upper:
        source: TRT01SRC
    verifications:
      allowed_values:
        values: [VITAMIN D3, PLACEBO, NOT TREATED]

  - name: TRTSDT
    type: date
    label: Date of First Exposure to Treatment
    derivation:
      aggregate:
        filter: "EX.EXTRT IN ('VITAMIN D3', 'PLACEBO') AND EX.EXSTDTC IS NOT NULL"
        expr: "MIN(EX.EXSTDTC)"

        source: [STUDYID, USUBJID]
        key: [STUDYID, USUBJID]
  - name: TRTEDT
    type: date
    label: Date of Last Exposure to Treatment
    derivation:
      aggregate:
        filter: "EX.EXTRT IN ('VITAMIN D3', 'PLACEBO') AND EX.EXENDTC IS NOT NULL"
        expr: "MAX(EX.EXENDTC)"

        source: [STUDYID, USUBJID]
        key: [STUDYID, USUBJID]
  - name: TRTDURD
    type: int
    label: Total Treatment Duration (Days)
    derivation:
      date_diff:
        start: TRTSDT
        end: TRTEDT
        unit: day
        bounds: inclusive
    verifications:
      range:
        min: 1

  - name: SAFFL
    type: str
    label: Safety Population Flag
    derivation:
      case:
        - when: "TRTSDT IS NOT NULL"
          then:
            literal: Y
        - otherwise:
            literal: N
    verifications:
      - not_missing: {}
      - allowed_values:
          values: [Y, N]

verifications:
  - unique:
      columns: [STUDYID, USUBJID]
  - row_count:
      min: 4
      max: 4
  - all_or_none:
      id: treatment-period-completeness
      columns: [TRTSDT, TRTEDT, TRTDURD]
  - implies:
      id: placebo-subject-is-in-safety-population
      when: "TRT01A = 'PLACEBO'"
      then: "SAFFL = 'Y'"
