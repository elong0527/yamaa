schema_version: "1.0"
domain: ADAE
keys: [STUDYID, USUBJID, AESEQ]
input:
  AE:
    path: input/ae.csv
    types: {AESEQ: int, AESTDTC: date}
intermediates:
  - id: FIRSTCOV
    dataset: AE
    key: [STUDYID, USUBJID]
    filter: "AE.AEDECOD = 'COVID-19'"
    order_by: [AE.AESTDTC, AE.AESEQ]
    keep: first
output:
  path: adae.csv
  columns: [STUDYID, USUBJID, AESEQ, AEDECOD, ASTDT, AFTCOVFL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: AE.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: AE.USUBJID

  - name: AESEQ
    type: int
    label: Sequence Number
    derivation:
      source: AE.AESEQ

  - name: AEDECOD
    type: str
    label: Dictionary-Derived Term
    derivation:
      source: AE.AEDECOD

  - name: ASTDT
    type: date
    label: Analysis Start Date
    derivation:
      source: AE.AESTDTC

  - name: AFTCOVFL
    type: str
    label: After First COVID-19 Flag
    derivation:
      case:
        - when: >-
            ASTDT > FIRSTCOV.AESTDTC OR
            (ASTDT = FIRSTCOV.AESTDTC AND AESEQ > FIRSTCOV.AESEQ)
          then:
            literal: Y

verifications:
  - unique:
      columns: [STUDYID, USUBJID, AESEQ]
  - row_count:
      min: 9
      max: 9
