schema_version: "1.0"
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  DM: input/dm.csv
  CM: {path: input/cm.csv, types: {CMSEQ: int}}
base: DM

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, RESCTRT]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: DM.USUBJID

  - name: RESCTRT
    type: str
    label: Rescue Medication
    derivation:
      lookup:
        dataset: CM
        source: [STUDYID, USUBJID]
        key: [STUDYID, USUBJID]
        value: CMTRT
        filter: "CM.CMCAT = 'RESCUE MEDICATION'"
        order_by:
          - variable: CM.CMSTDTC
          - variable: CM.CMSEQ
        keep: first
verifications:
  - row_count:
      min: 2
      max: 2
