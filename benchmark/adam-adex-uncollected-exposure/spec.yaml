schema_version: "1.0"
domain: ADEX
keys: [STUDYID, USUBJID, EXTRT]
input:
  TRT: input/subject_treatment.csv
  EX: {path: input/ex.csv, types: {EXDOSE: float}}
base: TRT

output:
  path: adex.csv
  columns: [STUDYID, USUBJID, EXTRT, DOSECUM, NDOSREC, NDOSVAL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: TRT.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: TRT.USUBJID

  - name: EXTRT
    type: str
    label: Name of Treatment
    derivation:
      source: TRT.EXTRT

  - name: DOSECUM
    type: float
    label: Cumulative Dose
    derivation:
      aggregate:

        expr: "SUM(EX.EXDOSE)"
        source: [STUDYID, USUBJID, EXTRT]
        key: [STUDYID, USUBJID, EXTRT]
  - name: NDOSREC
    type: int
    label: Number of Dose Records
    derivation:
      aggregate:

        expr: "COUNT(EX.EXSEQ)"
        source: [STUDYID, USUBJID, EXTRT]
        key: [STUDYID, USUBJID, EXTRT]
  - name: NDOSVAL
    type: int
    label: Number of Nonmissing Doses
    derivation:
      aggregate:

        expr: "COUNT(EX.EXDOSE)"
        source: [STUDYID, USUBJID, EXTRT]
        key: [STUDYID, USUBJID, EXTRT]
verifications:
  - row_count:
      min: 3
      max: 3
  - implies:
      id: recorded-dose-implies-a-record
      when: "NDOSVAL > 0"
      then: "NDOSREC >= NDOSVAL"
