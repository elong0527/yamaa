schema_version: "1.0"
domain: ADLB
keys: [STUDYID, USUBJID, VISIT]
input:
  LB: input/lb.csv

output:
  path: adlb.csv
  columns: [STUDYID, USUBJID, VISIT, LBSTRESN, BAVL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: LB.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: LB.USUBJID

  - name: VISIT
    type: str
    label: Visit Name
    derivation: LB.VISIT

  - name: LBSTRESN
    type: float
    label: Numeric Result
    derivation: LB.LBSTRESN

  - name: BAVL
    type: float
    label: Baseline Value
    derivation:
      baseline_value:
        window:
          group_by: [STUDYID, USUBJID]
        value: LBSTRESN
        flag: LB.LBBLFL
