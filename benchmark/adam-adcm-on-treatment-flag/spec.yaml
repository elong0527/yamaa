schema_version: "1.0"
domain: ADCM
keys: [STUDYID, USUBJID, CMSEQ]
input:
  CM: input/cm.csv
  ADSL: input/adsl.csv
base: CM

output:
  path: adcm.csv
  columns: [STUDYID, USUBJID, CMSEQ, CMTRT, ASTDT, AENDT, TRTSDT, TRTEDT, ONTRTFL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: CM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: CM.USUBJID

  - name: CMSEQ
    type: int
    label: Sequence Number
    derivation: CM.CMSEQ

  - name: CMTRT
    type: str
    label: Reported Name of Drug, Medication, or Therapy
    derivation: CM.CMTRT

  - name: ASTDT
    type: date
    label: Analysis Start Date
    derivation: CM.CMSTDTC

  - name: AENDT
    type: date
    label: Analysis End Date
    derivation: CM.CMENDTC

  - name: TRTSDT
    type: date
    label: Date of First Exposure to Treatment
    derivation: ADSL.TRTSDT
  - name: TRTEDT
    type: date
    label: Date of Last Exposure to Treatment
    derivation: ADSL.TRTEDT
  - name: ONTRTFL
    type: str
    label: On-Treatment Flag
    derivation:
      case:
        - when: >
            TRTSDT IS NOT NULL AND
            (TRTEDT IS NULL OR ASTDT IS NULL OR ASTDT <= TRTEDT) AND
            (AENDT IS NULL OR AENDT >= TRTSDT)
          then:
            literal: Y
    verifications:
      allowed_values:
        values: [Y]

verifications:
  - unique:
      columns: [STUDYID, USUBJID, CMSEQ]
  - row_count:
      min: 8
      max: 8
  - implies:
      id: on-treatment-medication-has-treatment-start
      when: "ONTRTFL = 'Y'"
      then: "TRTSDT IS NOT NULL"
