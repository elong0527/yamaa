schema_version: "1.0"
domain: DS
keys: [STUDYID, USUBJID, DSSEQ]

input:
  ODM: input/odm.csv
  RAND:
    path: input/randomization.csv
    types: {RANDDTC: date}

output:
  path: ds.csv
  columns: [DOMAIN, STUDYID, USUBJID, DSCAT, DSSCAT, DSTERM, DSDECOD, DSSTDTC, DSSEQ]

columns:
  - name: DOMAIN
    type: str
    label: Domain Abbreviation
    derivation:
      literal: DS
    verifications:
      allowed_values:
        values: [DS]

  - name: STUDYID
    type: str
    label: Study Identifier

  - name: USUBJID
    type: str
    label: Unique Subject Identifier

  - name: DSCAT
    type: str
    label: Category for Disposition Event
    verifications:
      allowed_values:
        values: [DISPOSITION EVENT, PROTOCOL MILESTONE]

  - name: DSSCAT
    type: str
    label: Subcategory for Disposition Event
    verifications:
      allowed_values:
        values: [STUDY TREATMENT, STUDY, SCREENING]

  - name: DSTERM
    type: str
    label: Reported Term for the Disposition Event
    verifications:
      not_missing: {}

  - name: DSDECOD
    type: str
    label: Standardized Disposition Term
    verifications:
      - not_missing: {}
      - allowed_values:
          values: [INFORMED CONSENT OBTAINED, RANDOMIZED, COMPLETED, ADVERSE EVENT, SCREEN FAILURE]

  - name: DSSTDTC
    type: date
    label: Start Date/Time of Disposition Event
    verifications:
      not_missing: {}

  - name: DSSEQ
    type: int
    label: Sequence Number
    derivation:
      row_number:
        group_by: [STUDYID, USUBJID]
        order_by: [DSSTDTC, DSCAT, DSDECOD]
    verifications:
      not_missing: {}

rows:
  - id: consent
    dataset: ODM
    filter: "ODM.StudyEventOID = 'IC' AND ODM.ItemOID = 'IT.DS.ICYN' AND ODM.Value = 'Y'"
    derivations:
      STUDYID:
        source: ODM.StudyOID
      USUBJID:
        source: ODM.SubjectKey
      DSCAT:
        literal: PROTOCOL MILESTONE
      DSSCAT:
        literal: null
      DSTERM:
        literal: INFORMED CONSENT OBTAINED
      DSDECOD:
        literal: INFORMED CONSENT OBTAINED
      DSSTDTC:
        source: ODM.IT.DS.ICDTC

  - id: randomization
    dataset: RAND
    filter: "RAND.USUBJID IS NOT NULL"
    derivations:
      STUDYID:
        source: RAND.StudyOID
      USUBJID:
        source: RAND.USUBJID
      DSCAT:
        literal: PROTOCOL MILESTONE
      DSSCAT:
        literal: null
      DSTERM:
        literal: RANDOMIZED
      DSDECOD:
        literal: RANDOMIZED
      DSSTDTC:
        source: RAND.RANDDTC

  - id: screen_failure
    dataset: ODM
    filter: "ODM.StudyEventOID = 'IC' AND ODM.ItemOID = 'IT.DS.SCRNSTAT' AND ODM.Value = 'NOT ELIGIBLE'"
    derivations:
      STUDYID:
        source: ODM.StudyOID
      USUBJID:
        source: ODM.SubjectKey
      DSCAT:
        literal: DISPOSITION EVENT
      DSSCAT:
        literal: SCREENING
      DSTERM:
        source: ODM.IT.DS.SCRNREAS
      DSDECOD:
        literal: SCREEN FAILURE
      DSSTDTC:
        source: ODM.IT.DS.SCRNDTC

  - id: eot
    dataset: ODM
    filter: "ODM.StudyEventOID = 'EOT' AND ODM.ItemOID = 'IT.DS.COMP'"
    derivations:
      STUDYID:
        source: ODM.StudyOID
      USUBJID:
        source: ODM.SubjectKey
      DSCAT:
        literal: DISPOSITION EVENT
      DSSCAT:
        literal: STUDY TREATMENT
      DSTERM:
        case:
          branches:
            - when: "ODM.Value = 'COMPLETED'"
              then:
                literal: COMPLETED
          otherwise:
            source: ODM.IT.DS.REASON
      DSDECOD:
        case:
          branches:
            - when: "ODM.Value = 'COMPLETED'"
              then:
                literal: COMPLETED
          otherwise:
            source: ODM.IT.DS.REASONCD
      DSSTDTC:
        source: ODM.IT.DS.DTC

  - id: eos
    dataset: ODM
    filter: "ODM.StudyEventOID = 'EOS' AND ODM.ItemOID = 'IT.DS.COMP'"
    derivations:
      STUDYID:
        source: ODM.StudyOID
      USUBJID:
        source: ODM.SubjectKey
      DSCAT:
        literal: DISPOSITION EVENT
      DSSCAT:
        literal: STUDY
      DSTERM:
        case:
          branches:
            - when: "ODM.Value = 'COMPLETED'"
              then:
                literal: COMPLETED
          otherwise:
            source: ODM.IT.DS.REASON
      DSDECOD:
        case:
          branches:
            - when: "ODM.Value = 'COMPLETED'"
              then:
                literal: COMPLETED
          otherwise:
            source: ODM.IT.DS.REASONCD
      DSSTDTC:
        source: ODM.IT.DS.DTC

verifications:
  - unique:
      columns: [STUDYID, USUBJID, DSSEQ]
  - unique:
      columns: [STUDYID, USUBJID, DSCAT, DSSCAT, DSDECOD]
  - row_count:
      min: 10
      max: 10
