schema_version: "1.0"
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  DM: input/dm.csv

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, CMNT]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  - name: CMNT
    type: str
    label: Investigator Comment
    derivation: DM.COMMENT
