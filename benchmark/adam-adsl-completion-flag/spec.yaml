schema_version: "1.0"
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  ADSLPRE: input/adsl_pre.csv
  DS: input/ds.csv
base: ADSLPRE
intermediates:
  - id: COMPLT
    dataset: DS
    filter: "DS.DSDECOD = 'COMPLETED'"

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, TRTSDT, COMPFL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: ADSLPRE.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: ADSLPRE.USUBJID

  - name: TRTSDT
    type: date
    label: Date of First Exposure to Treatment
    derivation: ADSLPRE.TRTSDT

  - name: COMPREC
    type: str
    label: Completion Disposition Term
    derivation: COMPLT.DSDECOD

  - name: COMPFL
    type: str
    label: Completion Flag
    derivation:
      case:
        - when: "COMPREC IS NOT NULL"
          then:
            literal: Y
        - otherwise:
            literal: N
    verifications:
      allowed_values:
        values: [Y, N]

verifications:
  - unique:
      columns: [STUDYID, USUBJID]
  - row_count:
      min: 4
      max: 4
  - implies:
      id: completer-received-treatment
      when: "COMPFL = 'Y'"
      then: "TRTSDT IS NOT NULL"
