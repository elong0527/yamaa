schema_version: "1.0"
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  DM: input/dm.csv

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, AGE, AGEGRP]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: DM.USUBJID

  - name: AGE
    type: int
    label: Age
    derivation:
      source: DM.AGE

  - name: AGEGRP
    type: str
    label: Age Group
    derivation:
      case:
        - when: "AGE >= 65"
          then: {literal: {group: elderly}}
        - otherwise: {literal: younger}
