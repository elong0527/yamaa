schema_version: "1.0"
input:
  LB: input/lb.csv
  UNUSED: input/not-used.csv
base: LB
intermediates:
  - id: unused_reference
    dataset: UNUSED
    key:
      - USUBJID
columns:
  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: LB.USUBJID
  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation: LB.LBTESTCD
  - name: AVAL
    type: float
    label: Standardized Numeric Result
    derivation: LB.LBSTRESN
    metadata:
      analysis_role: analysis-value
  - name: AVALU
    type: str
    label: Analysis Value Unit
    derivation: LB.LBSTRESU
  - name: TEMP
    type: str
    label: Unused Intermediate Value
    derivation:
      literal: unused
verifications:
  unique:
    columns: [USUBJID, PARAMCD]
metadata:
  scope: organization
