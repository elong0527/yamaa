schema_version: "1.0"
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  DM: input/dm.csv
  EX: input/ex.csv
intermediates:
  - id: DOSING
    dataset: EX

base: DM

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, TRT01A, TRT01DOSE]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: DM.USUBJID

  - name: TRT01A
    type: str
    label: Actual Treatment for Period 01
    derivation:
      source: DOSING.EXTRT

  - name: TRT01DOSE
    type: float
    label: Actual Dose for Period 01
    derivation:
      source: DOSING.EXDOSE
