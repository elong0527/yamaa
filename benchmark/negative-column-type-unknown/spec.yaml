schema_version: "1.0"
domain: ADLB
keys: [STUDYID, USUBJID, LBSEQ]
input:
  LB: {path: input/lb.csv, types: {LBSEQ: int, LBSTRESN: float}}

output:
  path: adlb.csv
  columns: [STUDYID, USUBJID, LBSEQ, AVAL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: LB.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: LB.USUBJID

  - name: LBSEQ
    type: int
    label: Sequence Number
    derivation:
      source: LB.LBSEQ

  - name: AVAL
    type: number
    label: Analysis Value
    derivation:
      source: LB.LBSTRESN
