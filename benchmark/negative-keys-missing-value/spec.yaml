schema_version: "1.0"
domain: ADVS
keys: [STUDYID, USUBJID, PARAMCD, AVISIT]
input:
  ADVSPRE: input/advs_pre.csv

output:
  path: advs.csv
  columns: [STUDYID, USUBJID, PARAMCD, VSSEQ, ADT, ADY, AVAL, AVISIT]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: ADVSPRE.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: ADVSPRE.USUBJID

  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation: ADVSPRE.PARAMCD

  - name: VSSEQ
    type: int
    label: Sequence Number
    derivation: ADVSPRE.VSSEQ

  - name: ADT
    type: date
    label: Analysis Date
    derivation: ADVSPRE.ADT

  - name: ADY
    type: int
    label: Analysis Relative Day
    derivation: ADVSPRE.ADY

  - name: AVAL
    type: float
    label: Analysis Value
    derivation: ADVSPRE.AVAL

  - name: AVISIT
    type: str
    label: Analysis Visit
    derivation:
      cut:
        source: ADY
        breaks: [0, 2, 22, 43]
        labels: [SCREENING, BASELINE, WEEK 2, WEEK 4, POST-TREATMENT]
        right: false
        missing: null
