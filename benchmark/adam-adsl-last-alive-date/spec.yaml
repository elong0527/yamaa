schema_version: "1.0"
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  ADSL_RAW:
    path: input/adsl.csv
    types:
      TRTEDT: date
  ADAE:
    path: input/adae.csv
    types:
      AENDT: date
  ADVS:
    path: input/advs.csv
    types:
      ADATE: date
base: ADSL_RAW

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, TRTEDT, LSTCNTDC, LSTCNTDT, LSTALVDT]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: ADSL_RAW.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: ADSL_RAW.USUBJID

  - name: TRTEDT
    type: date
    label: Date of Last Exposure to Treatment
    derivation: ADSL_RAW.TRTEDT

  - name: LSTCNTDC
    type: str
    label: Date of Last Contact
    derivation: ADSL_RAW.LSTCNTDC

  - name: LSTCNTDT
    type: date
    label: Analysis Date of Last Contact
    derivation:
      date_impute:
        source: LSTCNTDC
        month: 12
        day: last
        missing: null
        invalid: null

  - name: ADAE_LST
    type: date
    label: Latest Adverse Event Date
    derivation:
      aggregate:
        expr: "MAX(ADAE.AENDT)"

  - name: ADVS_LST
    type: date
    label: Latest Vital Signs Date
    derivation:
      aggregate:
        expr: "MAX(ADVS.ADATE)"

  - name: LSTALVDT
    type: date
    label: Last Known Alive Date
    derivation:
      greatest:
        sources: [TRTEDT, LSTCNTDT, ADAE_LST, ADVS_LST]
