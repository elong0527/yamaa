schema_version: "1.0"
domain: ADVS
keys: [STUDYID, USUBJID, AVISIT, PARAMCD]
input:
  ADVS_RAW:
    path: input/advs_raw.csv
    types: {AGE: int}
  LMS:
    path: input/lms_ref.csv
    types: {L: float, M: float, S: float, AGE: int}
base: ADVS_RAW
intermediates:
  - id: GROWTH
    dataset: LMS
    key_base: [ADVS_RAW.PARAMCD, ADVS_RAW.SEX, ADVS_RAW.AGE]
    key: [PARAMCD, SEX, AGE]

output:
  path: advs.csv
  columns: [STUDYID, USUBJID, AVISIT, PARAMCD, PARAM, AVAL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: ADVS_RAW.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: ADVS_RAW.USUBJID

  - name: AVISIT
    type: str
    label: Analysis Visit
    derivation: ADVS_RAW.AVISIT

  - name: AVALSRC
    type: float
    label: Source Analysis Value
    derivation: ADVS_RAW.AVAL

  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation:
      case:
        - when: "ADVS_RAW.PARAMCD = 'BMI'"
          then:
            literal: BMIPCTL
        - when: "ADVS_RAW.PARAMCD = 'WEIGHT'"
          then:
            literal: WGTPCTL
    verifications:
      allowed_values:
        values: [BMIPCTL, WGTPCTL]

  - name: PARAM
    type: str
    label: Parameter
    derivation:
      case:
        - when: "PARAMCD = 'BMIPCTL'"
          then:
            literal: BMI-for-Age Percentile
        - when: "PARAMCD = 'WGTPCTL'"
          then:
            literal: Weight-for-Age Percentile

  - name: ZNUM
    type: float
    label: LMS Standard Normal Score
    derivation:
      compute:
        expr: "(POWER(AVALSRC / GROWTH.M, GROWTH.L) - 1) / (GROWTH.L * GROWTH.S)"

  - name: NORMCDF
    type: float
    label: Standard Normal Cumulative Probability
    derivation:
      case:
        - when: "ZNUM IS NULL"
          then:
            literal: null
        - otherwise:
            function:
              name: normal_cdf
              contract_version: "1.0.0"
              args:
                q: ZNUM

  - name: AVAL
    type: float
    label: Analysis Value
    derivation:
      compute:
        expr: "100 * NORMCDF"

verifications:
  - unique:
      columns: [STUDYID, USUBJID, AVISIT, PARAMCD]
  - row_count:
      min: 5
      max: 5
  - implies:
      id: percentile-requires-a-growth-reference
      when: "AVAL IS NOT NULL"
      then: "ZNUM IS NOT NULL"
