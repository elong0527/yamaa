schema_version: "1.0"
domain: ADLB
keys: [STUDYID, USUBJID, PARAMCD, LBSEQ]
input:
  ADLB_RAW: input/adlb_raw.csv

output:
  path: adlb.csv
  columns: [STUDYID, USUBJID, PARAMCD, LBSEQ, ADT, ADY, AVAL, AVISIT, AWTARGET, ADIST, ANL01FL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: ADLB_RAW.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: ADLB_RAW.USUBJID

  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation: ADLB_RAW.PARAMCD

  - name: LBSEQ
    type: int
    label: Sequence Number
    derivation: ADLB_RAW.LBSEQ

  - name: ADT
    type: date
    label: Analysis Date
    derivation: ADLB_RAW.ADT

  - name: ADY
    type: int
    label: Analysis Relative Day
    derivation: ADLB_RAW.ADY

  - name: AVAL
    type: float
    label: Analysis Value
    derivation: ADLB_RAW.AVAL

  - name: AVISIT
    type: str
    label: Analysis Visit
    derivation:
      case:
        - when: "ADY >= 8 AND ADY <= 22"
          then:
            literal: WEEK 2
    verifications:
      allowed_values:
        values: [WEEK 2]

  - name: AWTARGET
    type: int
    label: Analysis Window Target
    derivation:
      case:
        - when: "AVISIT IS NOT NULL"
          then:
            literal: 15

  - name: ADIST
    type: float
    label: Analysis Day Distance from Target
    derivation:
      compute:
        expr: "ABS(ADY - AWTARGET)"
    verifications:
      range:
        min: 0

  - name: ARNK
    type: int
    label: Analysis Rank
    derivation:
      row_number:
        window:
          group_by: [STUDYID, USUBJID, PARAMCD, AVISIT]
          order_by:
            - ADIST
            - {variable: ADY, direction: desc}
            - LBSEQ
          filter: "AVISIT IS NOT NULL"

  - name: ANL01FL
    type: str
    label: Analysis Record Flag 01
    derivation:
      case:
        - when: "ARNK = 1"
          then:
            literal: Y

verifications:
  - unique:
      columns: [STUDYID, USUBJID, PARAMCD, LBSEQ]
  - row_count:
      min: 6
      max: 6
  - all_or_none:
      id: window-derivation-completeness
      columns: [AVISIT, AWTARGET, ADIST]
  - implies:
      id: analysis-record-is-inside-window
      when: "ANL01FL = 'Y'"
      then: "ADY >= 8 AND ADY <= 22"
