schema_version: "1.0"
domain: ADAE
keys: [STUDYID, USUBJID, AESEQ]
input:
  AE:
    path: input/ae.csv
    types: {AESEQ: int, AESTDTC: date}

output:
  path: adae.csv
  columns: [STUDYID, USUBJID, AESEQ, ASTDT, ASTDT2]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: AE.STUDYID
  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: AE.USUBJID
  - name: AESEQ
    type: int
    label: Sequence Number
    derivation: AE.AESEQ
  - name: ASTDT
    type: date
    label: Analysis Start Date
    derivation: AE.AESTDTC
  - name: ASTDT2
    type: date
    label: Analysis Start Date from Datetime
    derivation:
      to_date: {source: ASTDT}
