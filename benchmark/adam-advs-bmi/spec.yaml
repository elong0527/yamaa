schema_version: "1.0"
domain: ADVS
keys: [STUDYID, USUBJID, AVISIT, PARAMCD]
input:
  VS:
    path: input/vs.csv
    types: {VSSTRESN: float}
  ADSL:
    path: input/adsl.csv
    types: {HEIGHTBL: float}
output:
  path: advs.csv
  columns: [STUDYID, USUBJID, AVISIT, PARAMCD, PARAM, AVAL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: VS.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: VS.USUBJID

  - name: AVISIT
    type: str
    label: Analysis Visit Name
    derivation: VS.VISIT

  - name: PARAMCD
    type: str
    label: Parameter Code

  - name: PARAM
    type: str
    label: Parameter

  - name: HEIGHTBL
    type: float
    label: Baseline Height (cm)

  - name: AVAL
    type: float
    label: Analysis Value

rows:
  - id: collected
    dataset: VS
    derivations:
      PARAMCD: VS.VSTESTCD
      PARAM: VS.VSTEST
      HEIGHTBL: {literal: null}
      AVAL: VS.VSSTRESN

  - id: derived_bmi
    dataset: VS
    filter: "VS.VSTESTCD = 'WEIGHT' AND VS.VSSTRESN IS NOT NULL"
    derivations:
      PARAMCD: {literal: BMI}
      PARAM: {literal: Body Mass Index (kg/m^2)}
      HEIGHTBL: {source: ADSL.HEIGHTBL}
      AVAL:
        compute:
          expr: "VS.VSSTRESN / NULLIF(HEIGHTBL * HEIGHTBL / 10000, 0)"

verifications:
  - unique:
      columns: [STUDYID, USUBJID, AVISIT, PARAMCD]
  - predicate:
      id: check-height-unit
      assert: "PARAMCD <> 'HEIGHT' OR PARAM = 'Height (cm)'"
  - predicate:
      id: check-weight-unit
      assert: "PARAMCD <> 'WEIGHT' OR PARAM = 'Weight (kg)'"
