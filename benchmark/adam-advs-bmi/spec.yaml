schema_version: "1.0"
domain: ADVS
keys: [STUDYID, USUBJID, AVISIT, PARAMCD]
input:
  VS:
    path: input/vs.csv
    types: {VSSEQ: int, VSSTRESN: float}
  ADSL:
    path: input/adsl.csv
    types: {HEIGHTBL: float}
intermediates:
  - id: SUBJECT
    dataset: ADSL
output:
  path: advs.csv
  columns: [STUDYID, USUBJID, PARAMCD, PARAM, AVAL, AVISIT, DTYPE]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier

  - name: USUBJID
    type: str
    label: Unique Subject Identifier

  - name: PARAMCD
    type: str
    label: Parameter Code

  - name: PARAM
    type: str
    label: Parameter

  - name: BASE_HEIGHT_VAL
    type: float
    label: Baseline Height Value

  - name: AVAL
    type: float
    label: Analysis Value

  - name: AVISIT
    type: str
    label: Analysis Visit Name

  - name: DTYPE
    type: str
    label: Derivation Type

rows:
  - id: collected
    dataset: VS
    derivations:
      STUDYID: {source: VS.STUDYID}
      USUBJID: {source: VS.USUBJID}
      PARAMCD: {source: VS.VSTESTCD}
      PARAM: {source: VS.VSTEST}
      BASE_HEIGHT_VAL: {literal: null}
      AVAL: {source: VS.VSSTRESN}
      AVISIT: {source: VS.VISIT}
      DTYPE: {literal: null}

  - id: derived_bmi
    dataset: VS
    filter: "VS.VSTESTCD = 'WEIGHT' AND VS.VSSTRESN IS NOT NULL"
    derivations:
      STUDYID: {source: VS.STUDYID}
      USUBJID: {source: VS.USUBJID}
      PARAMCD: {literal: BMI}
      PARAM: {literal: Body Mass Index (kg/m^2)}
      BASE_HEIGHT_VAL: {source: SUBJECT.HEIGHTBL}
      AVAL:
        compute:
          expr: >-
            VS.VSSTRESN /
            NULLIF(BASE_HEIGHT_VAL * BASE_HEIGHT_VAL / 10000, 0)
      AVISIT: {source: VS.VISIT}
      DTYPE: {literal: CALCULATION}

verifications:
  - unique:
      columns: [STUDYID, USUBJID, AVISIT, PARAMCD]
  - predicate:
      id: no-pre-existing-target
      assert: "NOT (PARAMCD = 'BMI' AND DTYPE IS NULL)"
  - predicate:
      id: check-height-unit
      assert: "PARAMCD <> 'HEIGHT' OR PARAM = 'Height (cm)'"
  - predicate:
      id: check-weight-unit
      assert: "PARAMCD <> 'WEIGHT' OR PARAM = 'Weight (kg)'"
