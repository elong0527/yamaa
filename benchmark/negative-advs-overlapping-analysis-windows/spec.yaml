schema_version: "1.0"
domain: ADVS
keys: [STUDYID, USUBJID, PARAMCD, VSSEQ]
input:
  ADVSPRE:
    path: input/advs_pre.csv
    types: {VSSEQ: int, ADY: int}
  AWINDOW:
    path: input/awindow.csv
    types: {AWLO: int, AWHI: int}
base: ADVSPRE
intermediates:
  - id: AWIN
    dataset: AWINDOW
    key: STUDYID
    between: {value: ADY, lower: AWLO, upper: AWHI}

output:
  path: advs.csv
  columns: [STUDYID, USUBJID, PARAMCD, VSSEQ, ADY, AVISIT]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: ADVSPRE.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: ADVSPRE.USUBJID

  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation: ADVSPRE.PARAMCD

  - name: VSSEQ
    type: int
    label: Sequence Number
    derivation: ADVSPRE.VSSEQ

  - name: ADY
    type: int
    label: Analysis Relative Day
    derivation: ADVSPRE.ADY

  - name: AVISIT
    type: str
    label: Analysis Visit
    derivation: AWIN.AVISIT

verifications:
  - unique:
      columns: [STUDYID, USUBJID, PARAMCD, VSSEQ]
