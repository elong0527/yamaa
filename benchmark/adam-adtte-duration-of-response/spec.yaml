schema_version: "1.0"
domain: ADTTE
keys: [STUDYID, USUBJID, PARAMCD]
input:
  ADSL: input/adsl.csv
  ADRSPRE: input/adrs_pre.csv
  DS: input/ds.csv

output:
  path: adtte.csv
  columns: [STUDYID, USUBJID, PARAMCD, PARAM, STARTDT, ADT, AVAL, CNSR, EVNTDESC, CNSDTDSC, SRCDOM, SRCVAR, SRCSEQ]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: ADSL.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: ADSL.USUBJID

  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation:
      literal: DOR

  - name: PARAM
    type: str
    label: Parameter
    derivation:
      literal: Duration of Response

  - name: STARTDT
    type: date
    label: Time-to-Event Origin Date
    derivation:
      source: ADSL.RESPDT
    verifications:
      not_missing: {}

  - name: NACTDT
    type: date
    label: New Anti-Cancer Therapy Start Date
    derivation:
      source: ADSL.NACTDT

  - name: PDDT
    type: date
    label: Disease Progression Date
    derivation:
      aggregate:
        filter: "ADRSPRE.AVALC = 'PD'"
        expr: "MIN(ADRSPRE.ADT)"

        source: [STUDYID, USUBJID]
        key: [STUDYID, USUBJID]
  - name: PDSEQ
    type: int
    label: Disease Progression Source Sequence Number
    derivation:
      source:
        variable: ADRSPRE.ASEQ
        filter: "ADRSPRE.AVALC = 'PD'"
        multiple_matches:
          order_by: [ADRSPRE.ADT, ADRSPRE.ASEQ]
          keep: first
  - name: DEATHDT
    type: date
    label: Death Date
    derivation:
      aggregate:
        filter: "DS.DSDECOD = 'DEATH'"
        expr: "MIN(DS.DSSTDTC)"

        source: [STUDYID, USUBJID]
        key: [STUDYID, USUBJID]
  - name: DEATHSEQ
    type: int
    label: Death Source Sequence Number
    derivation:
      source:
        variable: DS.DSSEQ
        filter: "DS.DSDECOD = 'DEATH'"
        multiple_matches:
          order_by: [DS.DSSTDTC, DS.DSSEQ]
          keep: first
  - name: LASTVLDT
    type: date
    label: Last Valid Assessment Date
    derivation:
      aggregate:
        filter: "ADRSPRE.AVALC <> 'NE'"
        expr: "MAX(ADRSPRE.ADT)"

        source: [STUDYID, USUBJID]
        key: [STUDYID, USUBJID]
  - name: LASTVLSEQ
    type: int
    label: Last Valid Assessment Sequence Number
    derivation:
      source:
        variable: ADRSPRE.ASEQ
        filter: "ADRSPRE.AVALC <> 'NE'"
        multiple_matches:
          order_by: [ADRSPRE.ADT, ADRSPRE.ASEQ]
          keep: last
  - name: EVENTALLDT
    type: date
    label: Earliest Progression or Death Date
    derivation:
      least:
        sources: [PDDT, DEATHDT]

  - name: EVENTDT
    type: date
    label: Event Date
    derivation:
      case:
        - when: "EVENTALLDT IS NOT NULL AND (NACTDT IS NULL OR EVENTALLDT <= NACTDT)"
          then:
            source: EVENTALLDT

  - name: CNSR
    type: int
    label: Censor
    derivation:
      case:
        - when: "EVENTDT IS NOT NULL"
          then:
            literal: 0
        - otherwise:
            literal: 1

  - name: EVNTDESC
    type: str
    label: Event or Censoring Description
    derivation:
      case:
        - when: "EVENTDT IS NULL"
          then:
            literal: CENSORED
        - when: "EVENTDT = PDDT"
          then:
            literal: DISEASE PROGRESSION
        - otherwise:
            literal: DEATH

  - name: CENSORDT
    type: date
    label: Censoring Date
    derivation:
      least:
        sources: [LASTVLDT, NACTDT]

  - name: ADT
    type: date
    label: Analysis Date
    derivation:
      first_available:
        sources: [EVENTDT, CENSORDT]
    verifications:
      not_missing: {}

  - name: AVAL
    type: int
    label: Analysis Value
    derivation:
      date_diff:
        start: STARTDT
        end: ADT
        unit: day
        bounds: inclusive

  - name: CNSDTDSC
    type: str
    label: Censoring Date Description
    derivation:
      case:
        - when: "EVENTDT IS NOT NULL"
          then:
            literal: null
        - when: "CENSORDT = LASTVLDT"
          then:
            literal: LAST TUMOUR ASSESSMENT
        - otherwise:
            literal: START OF NEW ANTI-CANCER THERAPY

  - name: SRCDOM
    type: str
    label: Source Data
    derivation:
      case:
        - when: "EVNTDESC = 'DEATH'"
          then:
            literal: DS
        - when: "EVNTDESC = 'DISEASE PROGRESSION'"
          then:
            literal: ADRS
        - when: "CNSDTDSC = 'LAST TUMOUR ASSESSMENT'"
          then:
            literal: ADRS
        - otherwise:
            literal: ADSL

  - name: SRCVAR
    type: str
    label: Source Variable
    derivation:
      case:
        - when: "SRCDOM = 'DS'"
          then:
            literal: DSSTDTC
        - when: "SRCDOM = 'ADRS'"
          then:
            literal: ADT
        - otherwise:
            literal: NACTDT

  - name: SRCSEQ
    type: int
    label: Source Sequence Number
    derivation:
      case:
        - when: "EVNTDESC = 'DISEASE PROGRESSION'"
          then:
            source: PDSEQ
        - when: "EVNTDESC = 'DEATH'"
          then:
            source: DEATHSEQ
        - when: "CNSDTDSC = 'LAST TUMOUR ASSESSMENT'"
          then:
            source: LASTVLSEQ

rows:
  - id: responder
    dataset: ADSL
    filter: "ADSL.RESPDT IS NOT NULL"
    derivations: {}

verifications:
  - unique:
      columns: [STUDYID, USUBJID, PARAMCD]
  - row_count:
      min: 5
      max: 5
  - all_or_none:
      id: traceability-source-is-complete
      columns: [SRCDOM, SRCVAR]
  - implies:
      id: record-level-source-carries-a-sequence-number
      when: "SRCDOM <> 'ADSL'"
      then: "SRCSEQ IS NOT NULL"
  - implies:
      id: censored-record-states-why
      when: "CNSR = 1"
      then: "CNSDTDSC IS NOT NULL"
  - predicate:
      id: response-duration-is-at-least-one-day
      assert: "AVAL >= 1"
