schema_version: "1.0"
domain: ADLB
keys: [STUDYID, USUBJID, PARAMCD]
input:
  LB: input/lb.csv

output:
  path: adlb.csv
  columns: [STUDYID, USUBJID, PARAMCD, AVAL, BASE, PCHG]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: LB.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: LB.USUBJID

  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation: LB.LBTESTCD

  - name: AVAL
    type: float
    label: Analysis Value
    derivation: LB.LBSTRESN

  - name: BASE
    type: float
    label: Baseline Value
    derivation: LB.LBBLRESN

  - name: PCHG
    type: float
    label: Percent Change from Baseline
    derivation:
      compute:
        expr: "100 * (AVAL - BASE) / BASE"
