schema_version: "1.0"
domain: ADLB
keys: [STUDYID, USUBJID, LBSEQ]
input:
  LB: input/lb.csv

output:
  path: adlb.csv
  columns: [STUDYID, USUBJID, LBSEQ, LBSTRESN, VISITSEQ]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: LB.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: LB.USUBJID

  - name: LBSEQ
    type: int
    label: Sequence Number
    derivation:
      source: LB.LBSEQ

  - name: LBSTRESN
    type: float
    label: Numeric Result
    derivation:
      source: LB.LBSTRESN

  - name: VISITSEQ
    type: int
    label: Visit Sequence
    derivation:
      row_number:
        window:
          group_by: [STUDYID, USUBJID]
          order_by:
            - {variable: LBSEQ, direction: asc}
          filter: 7
