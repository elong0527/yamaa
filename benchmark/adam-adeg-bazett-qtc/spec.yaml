schema_version: "1.0"
domain: ADEG
keys: [STUDYID, USUBJID, PARAMCD, AVISIT]
input:
  ADEG_RAW: {path: input/adeg.csv, types: {AVAL: float}}

output:
  path: adeg.csv
  columns: [STUDYID, USUBJID, PARAMCD, PARAM, AVISIT, AVAL, AVALU]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: ADEG_RAW.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: ADEG_RAW.USUBJID

  - name: PARAMCD
    type: str
    label: Parameter Code

  - name: PARAM
    type: str
    label: Parameter

  - name: AVISIT
    type: str
    label: Analysis Visit
    derivation: ADEG_RAW.AVISIT

  - name: QTVAL
    type: float
    label: QT Interval

  - name: RRVAL
    type: float
    label: RR Interval

  - name: QTUNIT
    type: str
    label: QT Unit

  - name: RRUNIT
    type: str
    label: RR Unit

  - name: AVAL
    type: float
    label: Analysis Value

  - name: AVALU
    type: str
    label: Analysis Value Unit

  - name: ROW_PROVENANCE
    type: str
    label: Row Provenance

rows:
  - id: collected
    derivations:
      PARAMCD: {source: ADEG_RAW.PARAMCD}
      PARAM: {source: ADEG_RAW.PARAM}
      QTVAL: {literal: null}
      RRVAL: {literal: null}
      QTUNIT: {literal: null}
      RRUNIT: {literal: null}
      AVAL: {source: ADEG_RAW.AVAL}
      AVALU: {source: ADEG_RAW.AVALU}
      ROW_PROVENANCE: {literal: collected}

  - id: qtcbr
    group_by: [ADEG_RAW.STUDYID, ADEG_RAW.USUBJID, ADEG_RAW.AVISIT]
    filter: >-
      QTVAL IS NOT NULL
      AND RRVAL IS NOT NULL
    derivations:
      PARAMCD: {literal: QTCBR}
      PARAM: {literal: "QTcB - Bazett's Correction Formula Rederived (ms)"}
      QTVAL:
        aggregate:
          filter: "ADEG_RAW.PARAMCD = 'QT'"
          expr: "ONLY(ADEG_RAW.AVAL)"
      RRVAL:
        aggregate:
          filter: "ADEG_RAW.PARAMCD = 'RR'"
          expr: "ONLY(ADEG_RAW.AVAL)"
      QTUNIT:
        aggregate:
          filter: "ADEG_RAW.PARAMCD = 'QT'"
          expr: "ONLY(ADEG_RAW.AVALU)"
      RRUNIT:
        aggregate:
          filter: "ADEG_RAW.PARAMCD = 'RR'"
          expr: "ONLY(ADEG_RAW.AVALU)"
      AVAL:
        compute:
          expr: "QTVAL / SQRT(RRVAL / 1000)"
      AVALU: {literal: ms}
      ROW_PROVENANCE: {literal: generated}

verifications:
  - unique:
      columns: [STUDYID, USUBJID, PARAMCD, AVISIT]
  - implies:
      id: derived-parameter-has-expected-unit
      when: "PARAMCD = 'QTCBR'"
      then: "AVALU = 'ms'"
  - implies:
      id: assert_param_does_not_exist
      when: "PARAMCD = 'QTCBR'"
      then: "ROW_PROVENANCE = 'generated'"
  - implies:
      id: assert_unit_is_ms_or_msec
      when: >-
        ROW_PROVENANCE = 'collected'
        AND (PARAMCD = 'QT' OR PARAMCD = 'RR')
      then: "AVALU = 'ms' OR AVALU = 'msec'"
