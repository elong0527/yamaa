schema_version: "1.0"
domain: ADLB
keys: [STUDYID, USUBJID, LBSEQ]
input:
  LB: input/lb.csv

output:
  path: adlb.csv
  columns: [STUDYID, USUBJID, LBSEQ, PARAMCD, AVAL, AVALMEAN]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: LB.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: LB.USUBJID

  - name: LBSEQ
    type: int
    label: Sequence Number
    derivation: LB.LBSEQ

  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation: LB.LBTESTCD

  - name: AVAL
    type: float
    label: Analysis Value
    derivation: LB.LBSTRESN

  - name: AVALMEAN
    type: float
    label: Mean Analysis Value
    derivation:
      aggregate:
        group_by: [STUDYID, USUBJID, PARAMCD]
        expr: "MEAN(AVAL)"

verifications:
  - unique:
      columns: [STUDYID, USUBJID, LBSEQ]
  - row_count:
      min: 7
      max: 7
