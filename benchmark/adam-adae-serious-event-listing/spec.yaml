schema_version: "1.0"
domain: ADAE
keys: [STUDYID, USUBJID, AESEQ]
input:
  AE: {path: input/ae.csv, types: {AESEQ: int}}

output:
  path: adae.csv
  columns: [STUDYID, USUBJID, AESEQ, AETERM, AESER]
  order_by: [USUBJID, AESEQ]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: AE.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: AE.USUBJID

  - name: AESEQ
    type: int
    label: Sequence Number
    derivation: AE.AESEQ

  - name: AETERM
    type: str
    label: Reported Term for the Adverse Event
    derivation: AE.AETERM

  - name: AESER
    type: str
    label: Serious Event
    derivation:
      literal: "Y"

filter: "AE.AESER = 'Y'"

verifications:
  - unique:
      columns: [STUDYID, USUBJID, AESEQ]
  - row_count:
      min: 1
      max: 1
