schema_version: "1.0"
parents: [spec_organization.yaml, spec_compound.yaml]
domain: ADLB
keys: [USUBJID, PARAMCD]
output:
  path: adlb.csv
  columns: [USUBJID, PARAMCD, AVAL, ANRIND, PARCAT1]
columns:
  - name: AVAL
    derivation:
      case:
        - when: "USUBJID = '01' AND PARAMCD = 'AST'"
          then:
            literal: 31.0
        - otherwise:
            source: LB.LBSTRESN
    verifications:
      - not_missing: {}
    metadata:
      review_status: adjudicated
  - name: ANRIND
    derivation:
      mapping:
        unmapped: null
  - name: PARCAT1
    derivation:
      literal: CHEMISTRY
metadata:
  scope: study
