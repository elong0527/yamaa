schema_version: "1.0"
domain: ADAE
keys: [STUDYID, USUBJID, ASEQ]
input:
  AE: input/ae.csv

output:
  path: adae.csv
  columns: [STUDYID, USUBJID, ASEQ, AETERM, ASTDT, ASEV]
  order_by:
    - USUBJID
    - variable: SEVORD
      direction: desc
    - variable: ASTDT
      nulls: first

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: AE.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: AE.USUBJID

  - name: ASEQ
    type: int
    label: Analysis Sequence Number
    derivation: AE.AESEQ

  - name: AETERM
    type: str
    label: Reported Term for the Adverse Event
    derivation: AE.AETERM

  - name: ASTDT
    type: date
    label: Analysis Start Date
    derivation: AE.AESTDTC

  - name: ASEV
    type: str
    label: Analysis Severity/Intensity
    derivation: AE.AESEV
    verifications:
      allowed_values:
        values: [MILD, MODERATE, SEVERE]

  - name: SEVORD
    type: int
    label: Severity Review Order
    derivation:
      mapping:
        source: ASEV
        missing: null
        dict:
          MILD: 1
          MODERATE: 2
          SEVERE: 3

verifications:
  - unique:
      columns: [STUDYID, USUBJID, ASEQ]
  - row_count:
      min: 7
      max: 7
