schema_version: "1.0"
domain: DM
input:
  ODM: input/odm.csv
keys: [STUDYID, USUBJID]

output:
  path: dm.csv
  columns: [DOMAIN, STUDYID, USUBJID, SUBJID, RACE, ETHNIC]

columns:
  - name: DOMAIN
    type: str
    label: Domain Abbreviation
    derivation:
      literal: DM

  - name: STUDYID
    type: str
    label: Study Identifier

  - name: USUBJID
    type: str
    label: Unique Subject Identifier

  - name: SUBJID
    type: str
    label: Subject Identifier for the Study

  - name: RACECOUNT
    type: int
    label: Number of Reported Races

  - name: RACESINGLE
    type: str
    label: Reported Race When One Race Was Reported

  - name: ETHNICRAW
    type: str
    label: Collected Ethnicity

  - name: RACE
    type: str
    label: Race
    derivation:
      case:
        branches:
          - when: "RACECOUNT > 1"
            then:
              literal: MULTIPLE
        otherwise:
          mapping:
            source: RACESINGLE
            dict:
              "American Indian or Alaska Native": AMERICAN INDIAN OR ALASKA NATIVE
              "Asian": ASIAN
              "Black or African American": BLACK OR AFRICAN AMERICAN
              "Native Hawaiian or Other Pacific Islander": NATIVE HAWAIIAN OR OTHER PACIFIC ISLANDER
              "White": WHITE
              "Other, specify: Fijian": OTHER
              "Not reported": NOT REPORTED
              "Subject refused": UNKNOWN
            missing: null
    verifications:
      allowed_values:
        values: [AMERICAN INDIAN OR ALASKA NATIVE, ASIAN,
          BLACK OR AFRICAN AMERICAN,
          NATIVE HAWAIIAN OR OTHER PACIFIC ISLANDER, WHITE, MULTIPLE,
          OTHER, NOT REPORTED, UNKNOWN]

  - name: ETHNIC
    type: str
    label: Ethnicity
    derivation:
      mapping:
        source: ETHNICRAW
        dict:
          "Hispanic or Latino": HISPANIC OR LATINO
          "Not Hispanic or Latino": NOT HISPANIC OR LATINO
          "Not reported": NOT REPORTED
          "Unknown": UNKNOWN
        missing: null
    verifications:
      allowed_values:
        values: [HISPANIC OR LATINO, NOT HISPANIC OR LATINO,
          NOT REPORTED, UNKNOWN]

rows:
  - id: subject
    group_by: [ODM.StudyOID, ODM.SubjectKey]
    derivations:
      STUDYID:
        source: ODM.StudyOID
      USUBJID:
        source: ODM.SubjectKey
      SUBJID:
        source: ODM.SubjectKey
      RACECOUNT:
        aggregate:
          filter: "ODM.ItemOID = 'IT.DM.RACE'"
          expr: "COUNT(ODM.Value)"
      RACESINGLE:
        aggregate:
          filter: "ODM.ItemOID = 'IT.DM.RACE'"
          expr: "MAX(ODM.Value)"
      ETHNICRAW:
        aggregate:
          filter: "ODM.ItemOID = 'IT.DM.ETHNIC'"
          expr: "ONLY(ODM.Value)"

verifications:
  - unique:
      columns: [STUDYID, USUBJID]
  - row_count:
      min: 6
      max: 6
