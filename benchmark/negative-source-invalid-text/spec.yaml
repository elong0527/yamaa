schema_version: "1.0"
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  DM: {path: input/dm.csv}

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, SITENM]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  - name: SITENM
    type: str
    label: Study Site Name
    derivation: DM.SITENM
