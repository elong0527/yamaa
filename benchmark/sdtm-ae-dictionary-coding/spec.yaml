schema_version: "1.0"
domain: AE
keys: [STUDYID, USUBJID, AESEQ]
input:
  AE_RAW: input/ae_raw.csv
  MEDDRA: input/meddra_26_1.csv
base: AE_RAW
metadata:
  dictionary: MedDRA
  dictionary_version: "26.1"

output:
  path: ae.csv
  columns: [DOMAIN, STUDYID, USUBJID, AESEQ, AETERM, AEDECOD, AEBODSYS]

columns:
  - name: DOMAIN
    type: str
    label: Domain Abbreviation
    derivation:
      literal: AE

  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: AE_RAW.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: AE_RAW.USUBJID

  - name: AESEQ
    type: int
    label: Sequence Number
    derivation:
      source: AE_RAW.AESEQ

  - name: AETERM
    type: str
    label: Reported Term for the Adverse Event
    derivation:
      source: AE_RAW.AETERM

  - name: AEDECOD
    type: str
    label: Dictionary-Derived Term
    derivation:
      lookup:
        dataset: MEDDRA
        key_base: AE_RAW.AETERM
        key: LLTNAME
        value: PTNAME
        missing: NOT CODED
  - name: AEBODSYS
    type: str
    label: Body System or Organ Class
    derivation:
      lookup:
        dataset: MEDDRA
        key_base: AE_RAW.AETERM
        key: LLTNAME
        value: SOCNAME
        missing: NOT CODED
