schema_version: "1.0"
domain: ADTR
keys: [STUDYID, USUBJID, AVISIT]
input:
  ADTR_RAW:
    path: input/adtr_raw.csv
    types: {AVISITN: int, ADT: date, AVAL: float, NMEAS: int, NTARGET: int}

output:
  path: adtr.csv
  columns: [STUDYID, USUBJID, AVISIT, AVISITN, ADT, PARAMCD, PARAM, AVAL, NMEAS, NTARGET, ANL01FL, NADIR]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: ADTR_RAW.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: ADTR_RAW.USUBJID

  - name: AVISIT
    type: str
    label: Analysis Visit
    derivation: ADTR_RAW.AVISIT

  - name: AVISITN
    type: int
    label: Analysis Visit (N)
    derivation: ADTR_RAW.AVISITN

  - name: ADT
    type: date
    label: Analysis Date
    derivation: ADTR_RAW.ADT

  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation: ADTR_RAW.PARAMCD

  - name: PARAM
    type: str
    label: Parameter
    derivation: ADTR_RAW.PARAM

  - name: AVAL
    type: float
    label: Analysis Value
    derivation: ADTR_RAW.AVAL

  - name: NMEAS
    type: int
    label: Number of Measured Target Lesions
    derivation: ADTR_RAW.NMEAS

  - name: NTARGET
    type: int
    label: Number of Target Lesions
    derivation: ADTR_RAW.NTARGET

  - name: ANL01FL
    type: str
    label: Analysis Record Flag 01
    derivation: ADTR_RAW.ANL01FL
    verifications:
      allowed_values:
        values: [Y]

  - name: NADIR
    type: float
    label: Nadir Sum of Target Lesion Diameters
    derivation:
      aggregate:
        filter: "ADTR_RAW.ANL01FL = 'Y'"
        between:
          value: ADT
          lower: ADTR_RAW.ADT
        group_by: [ADTR_RAW.STUDYID, ADTR_RAW.USUBJID]
        expr: "MIN(ADTR_RAW.AVAL)"

        key: [STUDYID, USUBJID]
verifications:
  - unique:
      columns: [STUDYID, USUBJID, AVISIT]
  - row_count:
      min: 7
      max: 7
  - implies:
      id: dated-assessment-has-a-nadir
      when: "ADT IS NOT NULL"
      then: "NADIR IS NOT NULL"
