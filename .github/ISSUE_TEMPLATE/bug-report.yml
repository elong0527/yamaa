name: "Bug report"
description: "Wrong output, a crash, or rules and files that disagree. Show the smallest example that breaks."
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Everything here is public: use public fixtures or invented data only.
        Checking yamaa against a private study? Follow
        [Reporting findings from private studies](https://github.com/elong0527/yamaa/blob/main/CONTRIBUTING.md#reporting-findings-from-private-studies)
        first. Title it `<area>: <what breaks>`, where the area is rules,
        schema, engine, python, R, cli, benchmark, harbor or docs.

  - type: textarea
    id: what
    attributes:
      label: "In plain words, what's wrong?"
      description: "One or two sentences, no jargon."
      placeholder: "When I derive ADSL with two subjects sharing one USUBJID, the engine crashes instead of telling me my input is bad."
    validations:
      required: true

  - type: textarea
    id: mre
    attributes:
      label: "Show it failing"
      description: "The smallest spec, input and call that fail (10 lines beats 100), or the rule and file that disagree. Wrap code in a code block (```)."
      placeholder: |
        Crash example:
        ```yaml
        yamaa: "1.0"
        type: spec
        domain: ADSL
        keys: [USUBJID]
        input:
          DM: {path: dm.csv, types: {AGE: int}}

        output: {path: adsl.csv, columns: [USUBJID, AGE]}

        columns:
          - {name: USUBJID, type: str, label: Subject, derivation: DM.USUBJID}
          - {name: AGE, type: int, label: Age, derivation: DM.AGE}
        ```
        dm.csv: two rows with USUBJID "DUP". Run: yamaa.spec("spec.yaml").run(), or yamaa run spec.yaml

        Inconsistency example:
        rules/specification.md names the condition `foo_bar`,
        but yaml/conditions.yaml has no entry for it.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "What did you expect to happen?"
      description: "One or two sentences."
      placeholder: "I expected an error message saying USUBJID must be unique."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "What happened instead?"
      description: "Paste the error message or the wrong output."
      placeholder: "Traceback (most recent call last): ... ValueError: ..."
    validations:
      required: true

  - type: textarea
    id: version
    attributes:
      label: "Version, host and OS"
      description: 'Paste what `yamaa --version` prints, or what `yamaa.info()` (Python) or `yamaa_info()` (R) returns. 0.5.0 has neither: give `yamaa.__version__` or `packageVersion("yamaa")`, your host and your OS. Name the commit if you built from a checkout. Skip for a rules or docs issue.'
      render: text
      placeholder: |
        yamaa 0.6.0
        language versions: 1.0
        features: odm, parquet, readstat, yaml
        host: cli
        platform: linux-x86_64

  - type: textarea
    id: references
    attributes:
      label: "Links and references"
      description: "Rule IDs, rule files, benchmarks or URLs that pin down the relevant spec, plus the impact or a suspected cause if you know it."
      placeholder: "COLUMN-2, rules/columns.md, benchmarks/adam-adsl-demographics"
