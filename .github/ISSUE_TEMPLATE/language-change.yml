name: "Language change"
description: "Propose a change to the yamaa language. Show before vs. after."
title: "[language] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This issue and its attachments will be public. Follow the
        [reviewer feedback workflow](https://github.com/elong0527/yamaa/blob/main/docs/articles/reviewer-feedback.md):
        use public references and synthetic examples. Review logs, screenshots,
        filenames, paths, and links for participant data, confidential study
        information, and credentials. If evidence must remain private, use your
        organization's approved internal process; this repository has no
        designated private intake channel for confidential clinical or study data.

  - type: markdown
    attributes:
      value: |
        A language change touches every spec ever written, so be concrete:
        show exactly what changes, and where it matters today.

  - type: textarea
    id: what
    attributes:
      label: "In plain words, what should change?"
      description: "Explain it like I'm five. No jargon needed."
      placeholder: "Let a derivation read the closest visit date instead of only exact matches."
    validations:
      required: true

  - type: textarea
    id: before-after
    attributes:
      label: "Before -> after"
      description: "Use a public or synthetic spec snippet as it looks today, and as it would look with your change. Wrap each in a code block (```) and label them."
      placeholder: |
        Before (today):
        ```yaml
        derive VISITDY: lookup("VISIT", exact=true)
        ```
        After (proposed):
        ```yaml
        derive VISITDY: lookup("VISIT", closest=true)
        ```
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: "Where does this show up today?"
      description: "Link to the benchmark or example that has this pattern now, if there is one."
      placeholder: "benchmarks/adam-advs-windows - the windowing derivation works around this with an extra pre-processing step."

  - type: textarea
    id: why
    attributes:
      label: "Why is this better?"
      description: "Explain it like I'm five: who wins, and what gets simpler?"
      placeholder: "Study teams drop the pre-processing step; specs get shorter and harder to get wrong."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives considered"
      description: "Other ways to solve this, and why they are worse. Optional."
      placeholder: "Alternative: allow SELF references only in filter, not in key. Worse because every window still needs its own intermediate."

  - type: dropdown
    id: area
    attributes:
      label: "Area"
      description: "Which part of yamaa is this about?"
      options:
        - rules
        - benchmark
        - docs
        - python
        - schema
        - other
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: "Links and references"
      description: "REQ IDs (like REQ-1260), rule files, benchmarks, or URLs - anything that pins down the relevant spec."
      placeholder: "REQ-1260, rules/specification/structure.md, benchmarks/adam-advs-windows"

  - type: checkboxes
    id: confidentiality
    attributes:
      label: "Public disclosure check"
      description: "This acknowledgment does not automatically inspect or sanitize the report."
      options:
        - label: "I reviewed the complete report and attachments, used public or synthetic information, and confirmed that the content is authorized for public disclosure and contains no confidential data or credentials."
          required: true
