name: "Question"
description: "Something unclear in the rules or docs? Ask for a decision."
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Everything here is public: use public fixtures or invented data only.
        Checking yamaa against a private study? Follow
        [Reporting findings from private studies](https://github.com/elong0527/yamaa/blob/main/CONTRIBUTING.md#reporting-findings-from-private-studies)
        first. Use this when the rules or docs are silent or ambiguous; if
        they contradict each other or the engine, file a bug report instead.
        Title it `<area>: <the question>`, where the area is rules, schema,
        engine, python, R, benchmark, harbor or docs.

  - type: textarea
    id: question
    attributes:
      label: "The question"
      description: "One clear question in plain words. Add the answer you would propose, if you have one."
      placeholder: "Is an odm column derivation inside a row template row-local or dataset-level?"
    validations:
      required: true

  - type: textarea
    id: current-rule
    attributes:
      label: "What the rule says today"
      description: "Quote or link the rule, REQ ID or docs that bear on this, and say where they are silent or ambiguous."
      placeholder: "SPEC-6 makes a column-level derivation row-local unless it holds an aggregate or a window operation, reads a SELF intermediate, or reads a column that is not row-local, but does not mention odm bindings."

  - type: textarea
    id: why
    attributes:
      label: "Why it matters"
      description: "What decision does this unblock?"
      placeholder: "Study teams cannot tell whether a row template may read an odm column directly or needs an intermediate first."
    validations:
      required: true
