name: Set up repository checks
description: Install the pinned toolchains and the locked development environment
inputs:
  r:
    description: R setup mode (none, runtime, or check with package test dependencies)
    default: none
  python:
    description: Python version for the locked development environment
    default: '3.14'
  package:
    description: >-
      Build the development package and install repository tools (true), install
      the tools and their locked environment without the package (tools), or
      install neither (false)
    default: 'true'
runs:
  using: composite
  steps:
    - name: Validate setup inputs
      shell: bash
      env:
        R_SETUP_MODE: ${{ inputs.r }}
        PACKAGE_SETUP: ${{ inputs.package }}
      run: |
        case "$R_SETUP_MODE" in
          none|runtime|check) ;;
          *) echo "::error::r must be none, runtime, or check"; exit 1 ;;
        esac
        case "$PACKAGE_SETUP" in
          true|tools|false) ;;
          *) echo "::error::package must be true, tools, or false"; exit 1 ;;
        esac
    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      with:
        version: '0.13.0'
        # Without the environment no uv command runs, so there is nothing to
        # cache, and setup-uv's post step fails on a cache miss after a lock change.
        enable-cache: ${{ inputs.package != 'false' }}
        python-version: ${{ inputs.python }}
    - name: Read the workspace toolchain
      shell: bash
      run: python -m tools.ci.toolchain
    - name: Activate the workspace toolchain
      shell: bash
      run: python -m tools.ci.toolchain --install
    # Jobs build different profiles and features, and the action never
    # overwrites an existing key, so each workflow job keeps its own cache
    # (the action appends the job id to this key).
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      with:
        workspaces: rust
        key: ${{ github.workflow }}
        save-if: ${{ github.ref == 'refs/heads/main' }}
    - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
      if: inputs.r != 'none'
      with:
        r-version: '4.6.1'
        use-public-rspm: true
    - name: Install R package test dependencies
      if: inputs.r == 'check'
      shell: bash
      run: |
        Rscript --vanilla - <<'RS'
        repository <- Sys.getenv("RSPM")
        if (!nzchar(repository)) repository <- "https://cloud.r-project.org"
        options(repos = c(CRAN = repository))
        suggests <- strsplit(read.dcf("R/yamaa/DESCRIPTION")[1, "Suggests"], ",", fixed = TRUE)[[1]]
        packages <- trimws(sub("[[:space:]]*[(][^)]*[)]", "", suggests))
        install.packages(packages)
        stopifnot(all(vapply(packages, requireNamespace, logical(1), quietly = TRUE)))
        RS
    - name: Build the development package and install repository tools
      if: inputs.package == 'true'
      shell: bash
      run: make setup
    - name: Install repository tools without the development package
      if: inputs.package == 'tools'
      shell: bash
      run: python -m tools.commands.setup --without-package
