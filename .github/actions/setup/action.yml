name: Set up repository checks
description: Install the pinned toolchains and the locked development environment
inputs:
  r:
    description: Install R and package-check dependencies
    default: 'false'
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      with:
        version: '0.11.6'
        enable-cache: true
        python-version: '3.14'
    - name: Read the workspace toolchain
      shell: bash
      run: python -m tools.ci.toolchain
    - name: Activate the workspace toolchain
      shell: bash
      working-directory: rust
      run: rustup show active-toolchain
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      with:
        workspaces: rust
        shared-key: yamaa-${{ runner.os }}
        save-if: ${{ github.ref == 'refs/heads/main' }}
    - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
      if: inputs.r == 'true'
      with:
        r-version: '4.6.1'
        use-public-rspm: true
    - name: Install R package test dependencies
      if: inputs.r == 'true'
      shell: bash
      run: |
        Rscript --vanilla - <<'RS'
        repository <- Sys.getenv("RSPM")
        if (!nzchar(repository)) repository <- "https://cloud.r-project.org"
        options(repos = c(CRAN = repository))
        install.packages(c("arrow", "nanoarrow", "jsonlite"))
        RS
    - name: Build the development package and install repository tools
      shell: bash
      run: make setup
