name: Docs landing sync

# README.md is canonical; docs/index.md must be a byte-for-byte copy.
# Fail the run if the two files drift apart.

on:
  pull_request:
    paths:
      - 'README.md'
      - 'docs/index.md'
      - '.github/workflows/docs-landing-sync.yml'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/index.md'
      - '.github/workflows/docs-landing-sync.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: README.md and docs/index.md must match byte-for-byte
        run: |
          if ! cmp -s README.md docs/index.md; then
            echo "::error::README.md and docs/index.md differ. README.md is canonical: copy it over docs/index.md (cp README.md docs/index.md)."
            exit 1
          fi
