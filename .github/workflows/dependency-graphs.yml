name: Dependency graphs

on:
  # PRs into a release integration branch run only the CI workflow.
  pull_request:
    branches: [main]
  push:
    branches: [main, 'release/**']
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-graphs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  advisories:
    name: advisories (Cargo.lock, uv.lock)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the Rust lock against RustSec advisories
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1 (cargo-deny 0.20.2)
        with:
          manifest-path: rust/Cargo.toml
          command: check advisories
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.11.6'
      - name: Check the Python lock against advisories
        run: |
          uv export --project python --frozen --all-extras --all-groups \
            --no-emit-project --no-emit-local > "$RUNNER_TEMP/requirements.txt"
          uvx --from pip-audit==2.10.1 pip-audit --strict --disable-pip \
            --require-hashes -r "$RUNNER_TEMP/requirements.txt"

  graph:
    # Rust 1.90 is the workspace rust-version that both graphs resolve
    # against. They build with the pinned toolchain; the CI workflow checks
    # the minimum toolchain. Branch rulesets require these check names, so
    # moving the pin leaves them unchanged.
    name: ${{ matrix.graph }} (Python ${{ matrix.python }}, Rust 1.90, R 4.6.1)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        graph: [minimum, newest]
        python: ['3.12', '3.14', '3.15']
        exclude:
          # The declared minima of Polars, PyArrow, lxml and Pydantic do not
          # work on CPython 3.15 (docs/release.md).
          - graph: minimum
            python: '3.15'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          r: check
      # uv 0.11.6 can only download a 3.15 alpha; the graph's `uv venv` finds
      # this released interpreter on PATH instead.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: matrix.python == '3.15'
        with:
          python-version: '3.15'
      - name: Resolve and test an isolated graph
        env:
          GRAPH: ${{ matrix.graph }}
          GRAPH_PYTHON: ${{ matrix.python }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/dependency-target
        run: |
          uv run --project python --no-sync python -m tools.ci.dependency_graphs \
            --graph "$GRAPH" --python "$GRAPH_PYTHON" \
            --destination "$RUNNER_TEMP/dependency-graph"
      - name: Preserve the exact tested dependency selections
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: dependency-${{ matrix.graph }}-python-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/dependency-graph/rust/Cargo.lock
            ${{ runner.temp }}/dependency-graph/requirements.in
            ${{ runner.temp }}/dependency-graph/requirements.txt
            ${{ runner.temp }}/dependency-graph/cargo-metadata.json
            ${{ runner.temp }}/dependency-graph/python-installed.txt
            ${{ runner.temp }}/dependency-graph/r-session.txt
          if-no-files-found: warn
