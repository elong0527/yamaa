name: Dependency graphs

# Every graph is resolved and built from scratch. The declared ranges and the
# advisory policy in rust/deny.toml and osv-scanner.toml are release claims,
# so this release lane runs on dispatch before a release. It also runs weekly
# on main, because what it proves changes without a commit: a new advisory
# or a lapsed ignore fails the advisory checks, and a new release of a
# dependency changes the graphs that the same manifests resolve to, which
# Cargo's guide to continuous integration asks a project to keep testing.
# The Main health workflow reports a failing main run.
on:
  workflow_dispatch:
  schedule:
    - cron: '53 5 * * 3'

permissions:
  contents: read

# The event is part of the group, so the weekly run cancels no dispatched run
# on main, and a dispatch cancels no weekly run.
concurrency:
  group: dependency-graphs-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  advisories:
    name: advisories (Cargo.lock, uv.lock)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the Rust lock against RustSec advisories
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1 (cargo-deny 0.20.2)
        with:
          manifest-path: rust/Cargo.toml
          command: check advisories
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.13.0'
      # The Harbor evaluation's own lock ships in no release; the Harbor
      # workflow checks it, so its advisories never fail this lane.
      - name: Check the Python lock against advisories
        run: |
          uv export --project python --frozen --all-extras --all-groups \
            --no-emit-project --no-emit-local > "$RUNNER_TEMP/requirements.txt"
          uvx --from pip-audit==2.10.1 pip-audit --strict --disable-pip \
            --require-hashes -r "$RUNNER_TEMP/requirements.txt"
      # OSV also carries GitHub's reviewed advisories, which RustSec and the
      # PyPI database can lack. Its ignores live in osv-scanner.toml.
      - name: Check both locks against OSV advisories
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64 \
            --output "$RUNNER_TEMP/osv-scanner"
          chmod +x "$RUNNER_TEMP/osv-scanner"
          "$RUNNER_TEMP/osv-scanner" scan source --config osv-scanner.toml \
            --lockfile rust/Cargo.lock --lockfile python/uv.lock

  graph:
    # Rust 1.82 is the workspace rust-version that both graphs resolve
    # against. They build with the pinned toolchain; Release compatibility
    # checks the minimum toolchain. Branch rulesets require these names, so
    # moving the pin leaves them unchanged.
    name: ${{ matrix.graph }} (Python ${{ matrix.python }}, Rust 1.82, R 4.6.1)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        graph: [minimum, newest]
        python: ['3.12', '3.14', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Each graph regenerates its copy's third-party notices.
      - uses: ./.github/actions/setup
        with:
          r: check
          notices: 'true'
      - name: Resolve and test an isolated graph
        env:
          GRAPH: ${{ matrix.graph }}
          GRAPH_PYTHON: ${{ matrix.python }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/dependency-target
        run: |
          uv run --project python --no-sync python -m tools.ci.dependency_graphs \
            --graph "$GRAPH" --python "$GRAPH_PYTHON" \
            --destination "$RUNNER_TEMP/dependency-graph"
      - name: Preserve the exact tested dependency selections
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: dependency-${{ matrix.graph }}-python-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/dependency-graph/rust/Cargo.lock
            ${{ runner.temp }}/dependency-graph/requirements.in
            ${{ runner.temp }}/dependency-graph/requirements.txt
            ${{ runner.temp }}/dependency-graph/cargo-metadata.json
            ${{ runner.temp }}/dependency-graph/python-installed.txt
            ${{ runner.temp }}/dependency-graph/r-session.txt
          if-no-files-found: warn
