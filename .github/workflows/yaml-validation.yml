name: YAML Validation

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read

env:
  RUSTUP_TOOLCHAIN: 1.90.0

jobs:
  validate:
    name: repository-validation (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Select dashboard preview checks
        id: changes
        run: python .github/scripts/ci/dashboard_changes.py

      - name: README.md and docs/index.md must match byte-for-byte
        run: |
          if ! cmp -s README.md docs/index.md; then
            echo "::error::README.md and docs/index.md differ. README.md is canonical: copy it over docs/index.md (cp README.md docs/index.md)."
            exit 1
          fi

      - name: Install Rust for the bundled extension
        run: rustup toolchain install 1.90.0 --profile minimal

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust
          shared-key: repository-validation

      - name: Install dependencies
        run: |
          python -m pip install uv==0.11.6
          uv sync --project python --extra test --locked

      - name: Check formatting and lint once
        run: |
          uv run --project python --no-sync ruff format --check python/src/yamaa python/tests .github/scripts/ci
          uv run --project python --no-sync ruff check python/src/yamaa python/tests .github/scripts/ci

      - name: Check CI selection and dependencies
        run: python -m unittest discover -s .github/scripts/ci -p 'test_*.py'

      - name: Run unit tests
        run: |
          uv run --project python --no-sync python .github/scripts/yaml-validation/test_validate_repository.py

      - name: Run repository validation
        run: |
          uv run --project python --no-sync python .github/scripts/yaml-validation/validate_repository.py

      # REQ-1280: every benchmark specification follows the style contract.
      - name: Check specification style
        run: |
          uv run --project python --no-sync python -m yamaa.style benchmarks/*/spec*.yaml

      - name: Check execution manifest
        run: |
          uv run --project python --no-sync python .github/scripts/yaml-validation/check_execution_manifest.py

      - name: Check vocabulary coverage
        run: |
          uv run --project python --no-sync python .github/scripts/yaml-validation/check_vocabulary_coverage.py

      - name: Check rule metadata
        run: |
          uv run --project python --no-sync python .github/scripts/yaml-validation/check_rule_metadata.py

      - name: Check documentation
        run: |
          uv run --project python --no-sync python .github/scripts/yaml-validation/check_documentation.py

      - name: Check rule migration and generated references
        run: |
          uv run --project python --no-sync python .github/scripts/yaml-validation/test_rule_rewrite.py
          uv run --project python --no-sync python .github/scripts/yaml-validation/check_rule_rewrite.py
          uv run --project python --no-sync python .github/scripts/yaml-validation/generate_rule_reference.py --check

      - name: Check rules prose and requirement registry
        run: |
          uv run --project python --no-sync python .github/scripts/yaml-validation/test_rationale_phrases.py
          uv run --project python --no-sync python .github/scripts/yaml-validation/check_rationale_phrases.py
          uv run --project python --no-sync python .github/scripts/yaml-validation/test_requirement_registry.py
          uv run --project python --no-sync python .github/scripts/yaml-validation/check_requirement_registry.py

      - name: Check validation blocker issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run --project python --no-sync python .github/scripts/yaml-validation/check_validation_blockers.py

      - name: Install pinned dashboard dependencies
        if: steps.changes.outputs.dashboards == 'true'
        run: uv pip install --python python/.venv/bin/python -r .github/scripts/benchmark-docs/requirements.txt

      - name: Test fixture fidelity and deterministic generation
        if: steps.changes.outputs.dashboards == 'true'
        run: uv run --project python --no-sync python -m unittest discover -s .github/scripts/benchmark-docs -p 'test_*.py'

      - name: Generate every benchmark
        if: steps.changes.outputs.dashboards == 'true'
        env:
          LC_ALL: C.UTF-8
          PYTHONHASHSEED: '1'
          TZ: UTC
        run: uv run --project python --no-sync python .github/scripts/benchmark-docs/generate.py --all --quiet --output-dir "${RUNNER_TEMP}/yamaa-benchmark-docs-first"

      - name: Generate every benchmark again in a different environment
        if: steps.changes.outputs.dashboards == 'true'
        env:
          LC_ALL: C.UTF-8
          PYTHONHASHSEED: '8675309'
          TZ: Pacific/Honolulu
        run: uv run --project python --no-sync python .github/scripts/benchmark-docs/generate.py --all --quiet --output-dir "${RUNNER_TEMP}/yamaa-benchmark-docs-second"

      - name: Confirm byte-for-byte deterministic output
        if: steps.changes.outputs.dashboards == 'true'
        run: diff -rq "${RUNNER_TEMP}/yamaa-benchmark-docs-first" "${RUNNER_TEMP}/yamaa-benchmark-docs-second"

      - name: Upload all generated benchmark dashboards
        if: steps.changes.outputs.dashboards == 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: yamaa-benchmark-dashboards
          path: ${{ runner.temp }}/yamaa-benchmark-docs-first
          if-no-files-found: error
          retention-days: 7
