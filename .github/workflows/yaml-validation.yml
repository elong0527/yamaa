name: YAML Validation

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    # R020 fixes path resolution, so the same fixtures must decide the same
    # way on a case-sensitive and a case-insensitive filesystem.
    name: repository-validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install -r .github/workflows/requirements.txt

      - name: Run unit tests
        run: |
          python3 .github/workflows/test_validate_repository.py

      - name: Run repository validation
        run: |
          python3 .github/workflows/validate_repository.py
