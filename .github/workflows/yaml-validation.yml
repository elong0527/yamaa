name: YAML Validation

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  issues: read

jobs:
  validate:
    # R021 fixes path resolution, so the same fixtures must decide the same
    # way on a case-sensitive and a case-insensitive filesystem.
    name: repository-validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install -r .github/workflows/requirements.txt

      - name: Run unit tests
        run: |
          python3 .github/workflows/test_validate_repository.py
          python3 .github/workflows/test_check_schema_release.py

      - name: Check schema release policy
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            python3 .github/workflows/check_schema_release.py --base "origin/$BASE_REF"
          else
            python3 .github/workflows/check_schema_release.py
          fi

      - name: Run repository validation
        run: |
          python3 .github/workflows/validate_repository.py

      - name: Check validation blocker issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/workflows/check_validation_blockers.py
