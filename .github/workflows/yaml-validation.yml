name: YAML Validation

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  issues: read

jobs:
  validate:
    # R021 fixes path resolution, so the same fixtures must decide the same
    # way on a case-sensitive and a case-insensitive filesystem.
    name: repository-validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python3 -m pip install -r .github/scripts/yaml-validation/requirements.txt

      - name: Run unit tests
        run: |
          python3 .github/scripts/yaml-validation/test_validate_repository.py

      - name: Run repository validation
        run: |
          python3 .github/scripts/yaml-validation/validate_repository.py

      - name: Check execution manifest
        run: |
          python3 .github/scripts/yaml-validation/check_execution_manifest.py

      - name: Check validation blocker issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/yaml-validation/check_validation_blockers.py
