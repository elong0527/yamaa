name: YAML Validation

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  issues: read

jobs:
  validate:
    # R021 fixes path resolution, so the same fixtures must decide the same
    # way on a case-sensitive and a case-insensitive filesystem.
    name: repository-validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python3 -m pip install -r .github/scripts/yaml-validation/requirements.txt

      - name: Run unit tests
        run: |
          python3 .github/scripts/yaml-validation/test_validate_repository.py

      - name: Run repository validation
        run: |
          python3 .github/scripts/yaml-validation/validate_repository.py

      - name: Check execution manifest
        run: |
          python3 .github/scripts/yaml-validation/check_execution_manifest.py

      - name: Check validation blocker issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/yaml-validation/check_validation_blockers.py

  normative-change:
    # A rule ID is reserved on the base branch before the branch that writes
    # its file, and a normative change carries a changelog entry. Both are
    # measured against the base, so this job needs history the matrix job
    # does not.
    name: normative-change
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python3 -m pip install -r .github/scripts/yaml-validation/requirements.txt

      - name: Check normative change gates
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin \
            "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          python3 .github/scripts/yaml-validation/check_normative_change.py \
            --base "origin/${BASE_REF}"
