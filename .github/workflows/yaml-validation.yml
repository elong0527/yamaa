name: YAML Validation

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read

env:
  RUSTUP_TOOLCHAIN: 1.90.0

jobs:
  canonical-pages:
    name: canonical-site-pages (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install pinned docs dependencies
        run: python -m pip install -r docs/requirements.txt
      - name: Test canonical site pages
        run: python .github/scripts/commands/docs.py test

  validate:
    name: repository-validation-full (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Select full dashboard checks
        id: changes
        run: python .github/scripts/ci/dashboard_changes.py

      - name: Install Rust for the bundled extension
        run: rustup toolchain install 1.90.0 --profile minimal

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust
          shared-key: repository-validation

      - name: Install dependencies
        run: |
          python -m pip install uv==0.11.6
          uv sync --project python --extra test --locked

      - name: Check formatting and lint once
        run: python .github/scripts/commands/repository.py lint

      - name: Check CI selection and dependencies
        run: python .github/scripts/commands/repository.py ci-tests

      - name: Run unit tests
        run: python .github/scripts/commands/repository.py validator-tests

      - name: Run repository validation
        run: python .github/scripts/commands/repository.py validator

      # REQ-1280: every benchmark specification follows the style contract.
      - name: Check specification style
        run: python .github/scripts/commands/repository.py style

      - name: Check execution manifest
        run: python .github/scripts/commands/repository.py manifest

      - name: Check vocabulary coverage
        run: python .github/scripts/commands/repository.py vocabulary

      - name: Check rule metadata
        run: python .github/scripts/commands/repository.py metadata

      - name: Check documentation
        run: python .github/scripts/commands/repository.py documentation

      - name: Check current rule ownership and generated references
        run: python .github/scripts/commands/repository.py rule-references

      - name: Check rules prose and requirement registry
        run: python .github/scripts/commands/repository.py rules

      - name: Check validation blocker issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/commands/repository.py blockers

      - name: Install pinned dashboard dependencies
        if: steps.changes.outputs.dashboards == 'true'
        run: uv pip install --python python/.venv/bin/python -r .github/scripts/benchmark-docs/requirements.txt

      - name: Test fixture fidelity and deterministic generation
        if: steps.changes.outputs.dashboards == 'true'
        run: uv run --project python --no-sync python -m unittest discover -s .github/scripts/benchmark-docs -p 'test_*.py'

      - name: Generate every benchmark
        if: steps.changes.outputs.dashboards == 'true'
        env:
          LC_ALL: C.UTF-8
          PYTHONHASHSEED: '1'
          TZ: UTC
        run: uv run --project python --locked --no-sync python .github/scripts/commands/docs.py dashboards --output-dir "${RUNNER_TEMP}/yamaa-benchmark-docs-first"

      - name: Generate every benchmark again in a different environment
        if: steps.changes.outputs.dashboards == 'true'
        env:
          LC_ALL: C.UTF-8
          PYTHONHASHSEED: '8675309'
          TZ: Pacific/Honolulu
        run: uv run --project python --locked --no-sync python .github/scripts/commands/docs.py dashboards --output-dir "${RUNNER_TEMP}/yamaa-benchmark-docs-second"

      - name: Confirm byte-for-byte deterministic output
        if: steps.changes.outputs.dashboards == 'true'
        run: diff -rq "${RUNNER_TEMP}/yamaa-benchmark-docs-first" "${RUNNER_TEMP}/yamaa-benchmark-docs-second"

      - name: Upload all generated benchmark dashboards
        if: steps.changes.outputs.dashboards == 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: yamaa-benchmark-dashboards
          path: ${{ runner.temp }}/yamaa-benchmark-docs-first
          if-no-files-found: error
          retention-days: 7
