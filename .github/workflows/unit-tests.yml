name: Unit tests

on:
  push:
    branches: [main]
    # Prose-only pushes are checked by YAML Validation and Deploy docs. Keep
    # the prose files that unit tests install or read.
    paths:
      - '**'
      - '!docs/**'
      - 'docs/requirements.txt'
      - 'docs/assets/**'
      - '!rules/**/*.md'
      - 'rules/specification/style.md'
      - '!README.md'
      - '!rust/*.md'
      - '!mkdocs.yml'
  workflow_dispatch:

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  RUSTUP_TOOLCHAIN: '1.90.0'

jobs:
  rust:
    name: Rust unit and integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned coverage tools
        run: rustup toolchain install 1.90.0 --profile minimal --component llvm-tools-preview
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-llvm-cov@0.9.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust
          shared-key: unit-tests-rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run complete shared-crate suites with line coverage
        working-directory: rust
        run: |
          cargo llvm-cov --locked -p yamaa-core -p yamaa-engine -p yamaa-adapters \
            --features yamaa-engine/test-support,yamaa-adapters/arrow-c-data \
            --lcov --output-path "${RUNNER_TEMP}/rust.lcov"
      - name: Run the same suites with release code generation
        working-directory: rust
        run: |
          cargo test --locked -p yamaa-core -p yamaa-engine -p yamaa-adapters \
            --features yamaa-engine/test-support,yamaa-adapters/arrow-c-data --profile release-test
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: unit-coverage-rust
          path: ${{ runner.temp }}/rust.lcov
          if-no-files-found: error

  python:
    name: Python package and repository helper tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install locked build and test dependencies
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          python -m pip install uv==0.11.6
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust
          shared-key: unit-tests-python
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install the package and coverage tooling
        run: |
          uv sync --project python --locked --extra test --group benchmark --no-editable
          uv pip install --python python/.venv/bin/python coverage==7.16.2 \
            -r docs/requirements.txt -r .github/scripts/benchmark-docs/requirements.txt
      - name: Run every Python package test with coverage
        run: |
          uv run --project python --no-sync coverage run --parallel-mode -m pytest python/tests
          uv run --project python --no-sync coverage combine
          uv run --project python --no-sync coverage xml -o "${RUNNER_TEMP}/python.xml"
      - name: Run Rust tool unit tests
        working-directory: rust
        run: uv run --project ../python --no-sync python -m unittest discover -s tests -p 'test_*.py'
      - name: Run repository helper unit tests
        run: uv run --project python --no-sync python -m pytest .github/scripts
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: unit-coverage-python
          path: ${{ runner.temp }}/python.xml
          if-no-files-found: error

  r:
    name: R package tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Create the isolated R library
        run: |
          mkdir -p "${RUNNER_TEMP}/unit-r-library"
          echo "R_LIBS_USER=${RUNNER_TEMP}/unit-r-library" >> "${GITHUB_ENV}"
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true
      - name: Install fixture and coverage dependencies
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          python -m pip install py-yaml12==0.2.0
          mkdir -p "${R_LIBS_USER}"
          R CMD INSTALL --library="${R_LIBS_USER}" rust/tests/project-programs/r
          Rscript --vanilla - <<'RS'
          repository <- Sys.getenv("RSPM")
          if (!nzchar(repository)) repository <- "https://cloud.r-project.org"
          options(repos = c(CRAN = repository))
          description <- read.dcf("R/yamaa/DESCRIPTION")
          suggests <- strsplit(description[1, "Suggests"], ",", fixed = TRUE)[[1]]
          packages <- c("covr", "xml2", trimws(sub("[[:space:]]*[(][^)]*[)]", "", suggests)))
          install.packages(packages, lib = Sys.getenv("R_LIBS_USER"))
          stopifnot(all(vapply(packages, requireNamespace, logical(1), quietly = TRUE)))
          RS
      - name: Stage the standalone package and run every R package test
        run: |
          python rust/tools/stage_r_package.py "${RUNNER_TEMP}/unit-r-stage/yamaa"
          Rscript --vanilla - <<'RS'
          coverage <- covr::package_coverage(
            path = file.path(Sys.getenv("RUNNER_TEMP"), "unit-r-stage/yamaa"),
            type = "tests", quiet = FALSE)
          covr::to_cobertura(coverage, file.path(Sys.getenv("RUNNER_TEMP"), "r.xml"))
          RS
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: unit-coverage-r
          path: ${{ runner.temp }}/r.xml
          if-no-files-found: error

  results:
    name: All unit tests passed
    needs: [rust, python, r]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every suite to pass
        env:
          SUITE_RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          results = json.loads(os.environ["SUITE_RESULTS"])
          failed = [name for name, job in results.items() if job["result"] != "success"]
          if failed:
              raise SystemExit("Unit test suites did not pass: " + ", ".join(failed))
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: unit-coverage-*
          merge-multiple: true
          path: ${{ runner.temp }}/coverage-input
      - name: Calculate combined line coverage
        run: |
          python .github/scripts/ci/coverage_report.py --input "${RUNNER_TEMP}/coverage-input" \
            --output "${RUNNER_TEMP}/coverage-site" --commit "${GITHUB_SHA}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          cat "${RUNNER_TEMP}/coverage-site/index.md" >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: unit-test-coverage
          path: ${{ runner.temp }}/coverage-site
          if-no-files-found: error
