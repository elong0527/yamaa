name: Python

on:
  push:
    branches:
      - main
    paths:
      - 'python/**'
      - 'benchmarks/**'
      - 'rust/crates/yamaa-adapters/tests/fixtures/**'
      - 'yaml/**'
      - '.github/workflows/python.yml'
  pull_request:
    paths:
      - 'python/**'
      - 'benchmarks/**'
      - 'rust/crates/yamaa-adapters/tests/fixtures/**'
      - 'yaml/**'
      - '.github/workflows/python.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    # R021 and R023 fix path resolution and source reading, so the same bytes
    # must give the same records on a case-sensitive and a case-insensitive
    # filesystem.
    name: package-tests (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]
    steps:
      # The R020 byte fixtures and R021 link fixtures must survive checkout
      # with their committed line endings and actual symbolic links.
      - name: Preserve fixture bytes and symlinks on Windows
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install uv==0.11.6

      - name: Create locked environment
        run: uv sync --project python --extra test --locked --no-editable

      - name: Check formatting
        run: >-
          uv run --project python --no-sync ruff format --check
          python/src/yamaa python/tests

      - name: Lint
        run: uv run --project python --no-sync ruff check python/src/yamaa python/tests

      - name: Test
        run: uv run --project python --no-sync pytest python/tests

      # #101: every benchmark runs through one runner, on every platform,
      # and the reports it writes are the per-example parity artifact.
      - name: Run the conformance suite
        run: |
          uv run --project python --no-sync python - <<'PY'
          import os
          from pathlib import Path
          from yamaa.adapters.conformance import main

          examples = sorted(path.name for path in Path("benchmarks").iterdir() if path.is_dir())
          raise SystemExit(main([
              *examples,
              "--run-dir", str(Path(os.environ["RUNNER_TEMP"]) / "conformance"),
              "--examples-root", "benchmarks",
          ]))
          PY

      - name: Inventory backend qualification
        if: always()
        run: |
          uv run --project python --no-sync python - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          from yamaa import __version__
          from yamaa.adapters.qualification import Batch, main

          revision = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          directory = Path(os.environ["RUNNER_TEMP"]) / "qualification"
          directory.mkdir(parents=True, exist_ok=True)
          batch = Batch(
              runtime="python", backend="python", level="reference_run",
              source_revision=revision, host_package_version=__version__,
              artifact_reference=(
                  f"github-actions:{os.environ['GITHUB_RUN_ID']}/attempt-{os.environ['GITHUB_RUN_ATTEMPT']}/"
                  f"{os.environ['RUNNER_OS']}/installed-yamaa-{__version__}"
              ),
              evidence=(
                  f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
                  f"/actions/runs/{os.environ['GITHUB_RUN_ID']}"
              ),
              reports_dir=str(Path(os.environ["RUNNER_TEMP"]) / "conformance" / "reports"),
          )
          batch_path = directory / "reference-batch.json"
          batch_path.write_text(batch.model_dump_json(indent=2) + "\n", encoding="utf-8")
          raise SystemExit(main([
              "--source-revision", revision, "--batch", str(batch_path),
              "--output", str(directory / "coverage.json"),
          ]))
          PY

      - name: Upload qualification inventory
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: qualification-${{ matrix.os }}-${{ matrix.python-version }}
          path: ${{ runner.temp }}/qualification
          if-no-files-found: error

      - name: Upload conformance reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: conformance-${{ matrix.os }}-${{ matrix.python-version }}
          path: ${{ runner.temp }}/conformance/reports
          if-no-files-found: error

      - name: Import installed package outside the checkout
        working-directory: ${{ runner.temp }}
        run: >-
          uv run --project "${{ github.workspace }}/python" --no-sync python -c
          "import yamaa; from yamaa.odm import write_odm_parquet;
          from yamaa.specification import load_specification;
          print(yamaa.__version__, write_odm_parquet.__name__,
          load_specification.__name__)"
