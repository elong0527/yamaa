name: Python

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # R021 and R023 fix path resolution and source reading, so the same bytes
    # must give the same records on a case-sensitive and a case-insensitive
    # filesystem.
    name: package-tests (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install uv==0.11.6

      - name: Create locked environment
        run: uv sync --project python --extra test --locked --no-editable

      - name: Check formatting
        run: >-
          uv run --project python --no-sync ruff format --check
          python/src/yamaa python/tests

      - name: Lint
        run: uv run --project python --no-sync ruff check python/src/yamaa python/tests

      - name: Test
        run: >-
          uv run --project python --no-sync coverage run
          --source=yamaa --data-file=python/.coverage.pytest
          -m pytest python/tests

      # #101: every benchmark runs through one runner, on both platforms,
      # and the reports it writes are the per-example parity artifact.
      - name: Run the benchmark suite
        run: >-
          uv run --project python --no-sync coverage run
          --source=yamaa --data-file=python/.coverage.bench
          python/check_benchmarks.py
          --benchmarks-root benchmarks
          --run-dir "${{ runner.temp }}/benchmarks"

      - name: Enforce coverage above 80%
        working-directory: python
        run: >-
          uv run --project . --no-sync coverage combine
          --data-file=.coverage .coverage.pytest .coverage.bench &&
          uv run --project . --no-sync coverage report
          --data-file=.coverage --fail-under=80

      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmarks-${{ matrix.os }}-${{ matrix.python-version }}
          path: ${{ runner.temp }}/benchmarks/reports
          if-no-files-found: error

      - name: Import installed package outside the checkout
        working-directory: ${{ runner.temp }}
        run: >-
          ${{ github.workspace }}/python/.venv/bin/python -c
          "from yamaa import derive, YamaaError;
          from yamaa.engine import Engine;
          print(derive.__name__, YamaaError.__name__, Engine.__name__)"
