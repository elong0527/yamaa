name: Portable registry validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install YAML parser
        run: python -m pip install PyYAML==6.0.3
      - name: Validate registry, fixtures, and generated documentation
        run: >-
          python .github/workflows/check_portable_registry.py
          --check-doc yaml/registry/README.md

  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Install YAML parser
        run: Rscript -e 'install.packages("yaml", repos = "https://cloud.r-project.org")'
      - name: Validate registry and fixtures
        run: >-
          Rscript .github/workflows/check_portable_registry.R
          yaml/registry/portable-functions.yaml
          yaml/registry/conformance.yaml
