name: Portable registry conformance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install YAML parser
        run: python -m pip install -r python/requirements-test.txt
      - name: Run Python conformance tests
        env:
          PYTHONPATH: python
        run: python -m unittest discover -s python/tests -v
      - name: Check generated registry documentation
        env:
          PYTHONPATH: python
        run: python -m yamaa.portable_registry --check-doc yaml/registry/README.md

  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Install test dependencies
        run: Rscript -e 'install.packages(c("testthat", "yaml"), repos = "https://cloud.r-project.org")'
      - name: Run R conformance tests
        run: >-
          Rscript -e 'source("R/cdiscbuilder/R/portable_registry.R");
          testthat::test_file("R/cdiscbuilder/tests/testthat/test-portable-registry.R")'
