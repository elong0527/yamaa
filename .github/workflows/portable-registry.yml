name: Portable registry validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install YAML parser
        run: python -m pip install -r .github/workflows/requirements.txt
      - name: Validate registry, fixtures, and generated documentation
        run: >-
          python .github/workflows/check_portable_registry.py
          --check-doc yaml/registry/README.md
