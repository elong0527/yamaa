name: Benchmark dashboards

# PR preview: proves generation is deterministic and uploads the dashboards
# as an artifact. Nothing generated is committed; deploy-docs.yml builds
# and publishes the site on push to main.

on:
  pull_request:
    paths:
      - 'benchmarks/**'
      - 'docs/articles/benchmark.md'
      - '.github/scripts/benchmark-docs/**'
      - '.github/workflows/benchmark-docs.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install pinned rendering dependencies
        run: python -m pip install -r .github/scripts/benchmark-docs/requirements.txt
      - name: Test fixture fidelity and deterministic generation
        run: python -m unittest discover -s .github/scripts/benchmark-docs -p 'test_*.py'
      - name: Generate every benchmark
        env:
          LC_ALL: C.UTF-8
          PYTHONHASHSEED: '1'
          TZ: UTC
        run: python .github/scripts/benchmark-docs/generate.py --all --quiet --output-dir /tmp/yamaa-benchmark-docs-first
      - name: Generate every benchmark again in a different environment
        env:
          LC_ALL: C.UTF-8
          PYTHONHASHSEED: '8675309'
          TZ: Pacific/Honolulu
        run: python .github/scripts/benchmark-docs/generate.py --all --quiet --output-dir /tmp/yamaa-benchmark-docs-second
      - name: Confirm byte-for-byte deterministic output
        run: diff -rq /tmp/yamaa-benchmark-docs-first /tmp/yamaa-benchmark-docs-second
      - name: Upload all generated benchmark dashboards
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yamaa-benchmark-dashboards
          path: /tmp/yamaa-benchmark-docs-first
          if-no-files-found: error
          retention-days: 7
