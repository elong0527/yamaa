name: Release compatibility

# Compatibility claims are checked on release branches and on demand.
# This workflow does not add jobs to ordinary pull requests.
on:
  push:
    branches: ['release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-compatibility-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  rust-minimum:
    name: rust (minimum toolchain)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          r: runtime
          package: 'false'
      # The other jobs build with the pinned toolchain. Embedders build with
      # their own, so the workspace rust-version must keep building. CI's
      # Rust lane lints the workspace with it for Rust/build changes on a
      # pull request; this lane repeats that check on a release branch and
      # adds the embedder workspace and the minimal format builds below.
      - name: Activate the workspace rust-version toolchain
        run: python -m tools.ci.toolchain --minimum --install
      - name: Check and lint the workspace with the minimum toolchain
        env:
          RUSTFLAGS: -D warnings
        run: |
          cargo check --locked --manifest-path rust/Cargo.toml --workspace --all-targets --all-features
          cargo clippy --locked --manifest-path rust/Cargo.toml --workspace --all-targets --all-features -- -D warnings
      # An embedder builds the facade from its own workspace, where
      # rust/Cargo.toml is not the root (#2929). This outside workspace runs
      # the vendored YAML parser's compact-flow controls, directly and through
      # the facade. The copied lock keeps it on the reviewed versions.
      - name: Build the facade from an outside workspace
        env:
          RUSTFLAGS: -D warnings
        run: |
          cp rust/Cargo.lock rust/tests/embedder/Cargo.lock
          cargo test --manifest-path rust/tests/embedder/Cargo.toml --target-dir rust/target
      - name: Check minimal format builds
        run: python -m tools.ci.format_features
  # CRAN asks to test a package that uses Rust with a cargo at least two
  # years old, and the workspace rust-version is that minimum. The source
  # package is staged with the pinned toolchain, which vendors the crates,
  # then installed and checked with Cargo and rustc at the rust-version: it
  # carries no toolchain file, so its build uses the caller's toolchain.
  r-minimum:
    name: r (minimum toolchain)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      _R_CHECK_CRAN_INCOMING_REMOTE_: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          working-directory: R/yamaa
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install repository tools and the pinned Rust toolchain
        run: |
          python -m pip install --no-deps -e .
          python -m tools.ci.toolchain --install
      - name: Install the shared grammar fixture codec and PyYAML
        run: python -m pip install py-yaml12==0.2.0 pyyaml==6.0.3
      - name: Stage and build the standalone R package
        run: |
          python -m tools.staging.stage_r_package minimum-rust/yamaa
          (cd minimum-rust && R CMD build --no-manual yamaa)
      # Later steps run Cargo and rustc at the workspace rust-version.
      - name: Activate the workspace rust-version toolchain
        run: python -m tools.ci.toolchain --minimum --install
      # As every R package check, R CMD check --as-cran may report only the
      # notes that R/yamaa/cran-comments.md explains (tools/commands/check_r.py).
      - name: Check the source package as CRAN does
        env:
          R_LIBS: ${{ env.R_LIBS_USER }}
        run: |
          python -m tools.commands.check_r --archive minimum-rust/yamaa_*.tar.gz \
            --work-dir "${RUNNER_TEMP}/r-check"
      - name: Confirm that the build used the minimum toolchain
        run: |
          grep -F "using rustc ${RUSTUP_TOOLCHAIN} " "${RUNNER_TEMP}/r-check/yamaa.Rcheck/00install.out"
          grep -F "using cargo ${RUSTUP_TOOLCHAIN} " "${RUNNER_TEMP}/r-check/yamaa.Rcheck/00install.out"
      - name: Preserve the check results
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: r-check-minimum-rust
          path: |
            ${{ runner.temp }}/r-check/yamaa.Rcheck/00check.log
            ${{ runner.temp }}/r-check/yamaa.Rcheck/00install.out
            ${{ runner.temp }}/r-check/yamaa.Rcheck/tests/*.Rout*
          if-no-files-found: ignore
  python-minimum:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install the minimum supported Python saved artifact readers
        run: uv pip install --python python/.venv/bin/python 'polars==1.35.2' 'pyarrow==23.0.1' 'lxml==6.1.3'
      - run: make test-python
  python-newest:
    name: python (3.15)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python: '3.15'
      - run: make test-python
