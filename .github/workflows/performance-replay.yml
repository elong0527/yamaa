name: Replay retained public performance evidence

on:
  workflow_run:
    workflows: [Public performance evidence]
    types: [completed]
  push:
    branches: [evidence/issue-1998-replay]
    paths:
      - 'rust/qualification/performance-replay.json'
      - 'rust/qualification/performance-budgets.json'
      - 'rust/tools/orchestrate_public_performance_replay.py'
      - 'rust/tools/finalize_public_performance.py'
      - 'rust/tools/audit_public_performance.py'
      - 'rust/tools/aggregate_public_performance.py'
      - 'rust/tools/audit_public_performance.schema.json'
      - '.github/workflows/performance-replay.yml'

permissions: {}
concurrency:
  group: public-performance-replay-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.repository == 'elong0527/yamaa' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/evidence/issue-1998-replay') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'qualification/issue-1998'))
    name: Admit completed original collection and exact reader catalog
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      mode: ${{ steps.prepare.outputs.mode }}
      units: ${{ steps.prepare.outputs.units }}
      input-artifact-id: ${{ steps.pack.outputs.artifact-id }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install locked engine-free evidence readers
        run: |
          python -m pip install uv==0.11.6
          uv export --project python --locked --no-dev --no-emit-project --no-hashes --output-file "${RUNNER_TEMP}/audit-requirements.txt"
          python -m pip install --no-deps -r "${RUNNER_TEMP}/audit-requirements.txt"
      - name: Preserve source completion and derive exact immutable units
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          request_args=()
          if test "${GITHUB_EVENT_NAME}" = push; then
            request_args+=(--request rust/qualification/performance-replay.json)
          fi
          python rust/tools/orchestrate_public_performance_replay.py --mode prepare \
            "${request_args[@]}" --output "${RUNNER_TEMP}/performance-replay-input"
      - name: Preserve original input and authentic preparation identity
        id: pack
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: performance-replay-input
          retention-days: 90
          path: ${{ runner.temp }}/performance-replay-input
          if-no-files-found: error

  unit:
    needs: prepare
    if: needs.prepare.outputs.mode == 'units'
    name: performance-replay-unit (${{ matrix.key }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.units) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.input-artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/performance-replay-input
      - name: Install locked engine-free evidence readers
        run: |
          python -m pip install uv==0.11.6
          uv export --project python --locked --no-dev --no-emit-project --no-hashes --output-file "${RUNNER_TEMP}/audit-requirements.txt"
          python -m pip install --no-deps -r "${RUNNER_TEMP}/audit-requirements.txt"
      - name: Admit all original unit cases and roles with unchanged sampling
        env:
          GH_TOKEN: ${{ github.token }}
          PERFORMANCE_SELECTOR: ${{ toJSON(matrix.selector) }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          (Path(os.environ['RUNNER_TEMP'])/'unit-selector.json').write_text(json.dumps(json.loads(os.environ['PERFORMANCE_SELECTOR']))+'\n')
          PY
          python rust/tools/orchestrate_public_performance_replay.py --mode unit \
            --input "${RUNNER_TEMP}/performance-replay-input" --selector "${RUNNER_TEMP}/unit-selector.json" \
            --output "${RUNNER_TEMP}/performance-unit"
      - name: Preserve authentic unit fragment or refusal
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: performance-unit-${{ matrix.key }}
          retention-days: 90
          path: ${{ runner.temp }}/performance-unit
          if-no-files-found: error
      - name: Preserve refused retrieval bytes separately
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: performance-unit-retrieval-failure-${{ matrix.key }}
          retention-days: 90
          path: ${{ runner.temp }}/performance-replay-input/refused-artifact-*/**
          if-no-files-found: ignore

  aggregate:
    needs: [prepare, unit]
    if: always() && needs.prepare.result == 'success'
    name: Strict independent collection or numeric aggregate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.input-artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/performance-replay-input
      - name: Install locked engine-free evidence readers
        run: |
          python -m pip install uv==0.11.6
          uv export --project python --locked --no-dev --no-emit-project --no-hashes --output-file "${RUNNER_TEMP}/audit-requirements.txt"
          python -m pip install --no-deps -r "${RUNNER_TEMP}/audit-requirements.txt"
      - name: Bind actual reader jobs and retain verified fragments before strict aggregate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          budget_args=()
          if test "${{ needs.prepare.outputs.mode }}" = budgets; then
            budget_args+=(--budgets rust/qualification/performance-budgets.json)
          fi
          python rust/tools/orchestrate_public_performance_replay.py --mode aggregate \
            --input "${RUNNER_TEMP}/performance-replay-input" "${budget_args[@]}" \
            --output "${RUNNER_TEMP}/performance-replay"
      - name: Show evidence verdict and outstanding terminal completion gate
        if: always()
        run: |
          if test -f "${RUNNER_TEMP}/performance-replay/audit/performance-audit.md"; then
            cat "${RUNNER_TEMP}/performance-replay/audit/performance-audit.md" >> "${GITHUB_STEP_SUMMARY}"
          fi
      - name: Preserve compact original identities and separate completion receipts
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: performance-completion-record
          retention-days: 90
          path: |
            ${{ runner.temp }}/performance-replay/aggregate-execution.json
            ${{ runner.temp }}/performance-replay/replay-refusal.json
            ${{ runner.temp }}/performance-replay/*storage*.json
            ${{ runner.temp }}/performance-replay/reader-*.json
            ${{ runner.temp }}/performance-replay/aggregate-input.json
            ${{ runner.temp }}/performance-replay/performance-budgets.json
            ${{ runner.temp }}/performance-replay/original/*.json
            ${{ runner.temp }}/performance-replay/reader-original/*.json
            ${{ runner.temp }}/performance-replay/audit/*
          if-no-files-found: error
      - name: Preserve actual retrieval or storage refusal bytes
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: performance-aggregate-failure-${{ github.run_attempt }}
          retention-days: 90
          path: |
            ${{ runner.temp }}/performance-replay/*.zip*
            ${{ runner.temp }}/performance-replay/retrieved-*
            ${{ runner.temp }}/performance-replay/refused-artifact-*/**
          if-no-files-found: ignore
