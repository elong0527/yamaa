name: Deploy docs

# Sources live in git, HTML is built in CI and deployed via deploy-pages.
# Nothing generated is committed.

on:
  push:
    branches: [main]
    paths:
      - 'benchmarks/**'
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/scripts/benchmark-docs/**'
      - '.github/workflows/deploy-docs.yml'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install pinned docs dependencies
        run: python -m pip install -r docs/requirements.txt -r .github/scripts/benchmark-docs/requirements.txt
      - name: Generate every benchmark dashboard
        env:
          LC_ALL: C.UTF-8
          PYTHONHASHSEED: '1'
          TZ: UTC
        run: python .github/scripts/benchmark-docs/generate.py --all --quiet
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2
      - name: Render slide decks
        run: quarto render docs/slides/yamaa-pilot7-2026-09-25/index.qmd
      - name: Build the MkDocs site
        run: python -m mkdocs build --strict
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./site
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
