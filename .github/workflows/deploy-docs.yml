name: Deploy docs

# Mirrors the pharmaverse/rtflite principle: sources live in git, HTML is
# built in CI and deployed via deploy-pages. Nothing generated is committed.

on:
  push:
    branches: [main]
    paths:
      - 'yaml/examples/**'
      - 'docs/**'
      - '.github/scripts/example-docs/**'
      - '.github/workflows/deploy-docs.yml'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install pinned rendering dependencies
        run: python -m pip install -r .github/scripts/example-docs/requirements.txt
      - name: Generate every example dashboard
        env:
          LC_ALL: C.UTF-8
          PYTHONHASHSEED: '1'
          TZ: UTC
        run: python .github/scripts/example-docs/generate.py --all --quiet
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./docs
          destination: ./_site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./_site
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
