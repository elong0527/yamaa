name: CI

# Pull requests are the gate. Main is checked on a schedule rather than after
# every merge; the scheduled runs also save the Rust caches that pull requests
# restore. Odd hours at :37 keep clear of the start times of the nightly
# R CMD check (02:47) and native qualification (05:17) runs.
# Schedules only check main, so release branches are checked on each push.
on:
  pull_request:
  push:
    branches: ['release/**']
  schedule:
    - cron: '37 1-23/2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          r: runtime
      - id: lint
        run: make check-lint
      # Report repository findings even when lint fails.
      - if: success() || steps.lint.outcome == 'failure'
        run: make check-repository
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          r: runtime
      - run: make test-rust
      - name: Test adapters without the optional SAS reader
        run: cargo test --locked --manifest-path rust/Cargo.toml -p yamaa-adapters --no-default-features --features yaml,parquet
  rust-minimum:
    name: rust (minimum toolchain)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          r: runtime
          package: 'false'
      # The other jobs build with the pinned toolchain. Embedders build with
      # their own, so the workspace rust-version must keep building.
      - name: Activate the workspace rust-version toolchain
        run: python -m tools.ci.toolchain --minimum --install
      - name: Check and lint the workspace with the minimum toolchain
        env:
          RUSTFLAGS: -D warnings
        run: |
          cargo check --locked --manifest-path rust/Cargo.toml --workspace --all-targets --all-features
          cargo clippy --locked --manifest-path rust/Cargo.toml --workspace --all-targets --all-features -- -D warnings
      # An embedder builds the facade from its own workspace, where
      # rust/Cargo.toml is not the root (#2929). This outside workspace runs
      # the vendored YAML parser's compact-flow controls, directly and through
      # the facade. The copied lock keeps it on the reviewed versions.
      - name: Build the facade from an outside workspace
        env:
          RUSTFLAGS: -D warnings
        run: |
          cp rust/Cargo.lock rust/tests/embedder/Cargo.lock
          cargo test --manifest-path rust/tests/embedder/Cargo.toml --target-dir rust/target
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: make test-python
  python-minimum:
    # The minimum dependency graph also tests these floors, and neither
    # runs on PRs into a release integration branch.
    if: github.event_name != 'pull_request' || github.base_ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install the minimum supported Python saved artifact readers
        run: uv pip install --python python/.venv/bin/python 'polars==1.35.2' 'pyarrow==23.0.1' 'lxml==6.1.0'
      - run: make test-python
  python-newest:
    name: python (3.15)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python: '3.15'
      - run: make test-python
  r:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          r: check
      - name: Install the minimum supported R saved artifact readers
        run: Rscript --vanilla tools/ci/install_minimum_r_readers.R
      - name: Install the oldest supported R Arrow bridge
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/apache/arrow-nanoarrow/archive/refs/tags/apache-arrow-nanoarrow-0.8.0.tar.gz \
            --output "$RUNNER_TEMP/nanoarrow-bridge.tar.gz"
          tar -xzf "$RUNNER_TEMP/nanoarrow-bridge.tar.gz" -C "$RUNNER_TEMP"
          R CMD INSTALL "$RUNNER_TEMP/arrow-nanoarrow-apache-arrow-nanoarrow-0.8.0/r"
          Rscript --vanilla -e 'stopifnot(as.character(packageVersion("nanoarrow")) == "0.8.0")'
      - run: make test-r
