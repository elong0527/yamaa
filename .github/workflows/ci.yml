name: CI

# Pull requests are the gate. Main is checked on a schedule rather than after
# every merge; the scheduled runs also save the Rust caches that pull requests
# restore. Release branches are checked on each push. This workflow owns the
# four development checks; release-compatibility.yml owns compatibility builds.
on:
  pull_request:
  push:
    branches: ['release/**']
  schedule:
    - cron: '37 1-23/2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          r: runtime
      - id: lint
        run: make check-lint
      # Report repository findings even when lint fails.
      - if: success() || steps.lint.outcome == 'failure'
        run: make check-repository
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          r: runtime
      - run: make test-rust
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: make test-python
  r:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          r: check
      # `make test-r` runs R CMD check --as-cran; with checkbashisms and aspell
      # it also checks the configure scripts and DESCRIPTION's spelling, as
      # CRAN's checks do.
      - name: Install the programs that CRAN's checks use
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends devscripts aspell aspell-en
      - name: Install the minimum supported R saved artifact readers
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: Rscript --vanilla tools/ci/install_minimum_r_readers.R
      - name: Install the oldest supported R Arrow bridge
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/apache/arrow-nanoarrow/archive/refs/tags/apache-arrow-nanoarrow-0.8.0.tar.gz \
            --output "$RUNNER_TEMP/nanoarrow-bridge.tar.gz"
          tar -xzf "$RUNNER_TEMP/nanoarrow-bridge.tar.gz" -C "$RUNNER_TEMP"
          R CMD INSTALL "$RUNNER_TEMP/arrow-nanoarrow-apache-arrow-nanoarrow-0.8.0/r"
          Rscript --vanilla -e 'stopifnot(as.character(packageVersion("nanoarrow")) == "0.8.0")'
      - run: make test-r
