name: CI

# Four stable required checks. Each selects its work before installing tools,
# while engine/build changes retain both hosts' fresh-install equivalence.
# Main's scheduled runs save the Rust caches restored by pull requests. A
# fifth lane, not required, checks both hosts in the test-only loaded mode
# when an input of that mode changes.
on:
  pull_request:
  push:
    branches: ['release/**']
  schedule:
    - cron: '37 1-23/2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/select-checks
        id: paths
      - name: Check every workflow
        if: steps.paths.outputs.workflow_lint == 'true'
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color -shellcheck= -pyflakes=
      # Prose and site assets need neither a Rust toolchain nor a host build.
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        if: steps.paths.outputs.repository == 'docs'
        with:
          version: '0.13.0'
          python-version: '3.14'
          enable-cache: true
      - name: Check documentation without building the engine
        if: steps.paths.outputs.repository == 'docs'
        run: |
          uv sync --project python --locked --extra test --group tooling --no-install-package yamaa
          uv run --project python --no-sync python -m tools.commands.repository docs
          make docs-test docs
      - uses: ./.github/actions/setup
        if: steps.paths.outputs.repository == 'full'
        with:
          notices: 'true'
      - id: lint
        if: steps.paths.outputs.repository == 'full'
        run: uv run --project python --no-sync python -m tools.commands.repository lint-python
      # Report repository findings even when Python lint fails. Rust lint is
      # in the Rust lane, beside its tests, with the same restored build cache.
      - if: steps.paths.outputs.repository == 'full' && (success() || steps.lint.outcome == 'failure')
        run: make check-repository

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/select-checks
        id: paths
      - uses: ./.github/actions/setup
        id: setup
        if: steps.paths.outputs.rust == 'true'
        with:
          package: tools
      - id: lint
        if: steps.paths.outputs.rust == 'true'
        run: uv run --project python --no-sync python -m tools.commands.repository lint-rust
      - if: steps.paths.outputs.rust == 'true' && (success() || steps.lint.outcome == 'failure')
        run: make test-rust
      # Activate the minimum only after the pinned-toolchain lint and tests.
      # Still check it if an ordinary test failed, without masking that failure.
      - name: Activate the workspace rust-version toolchain
        id: minimum
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.paths.outputs.minimum == 'true' }}
        run: python -m tools.ci.toolchain --minimum --install
      - name: Lint the workspace, but the R binding, with the minimum toolchain
        if: ${{ !cancelled() && steps.minimum.outcome == 'success' }}
        env:
          RUSTFLAGS: -D warnings
        run: cargo clippy --locked --manifest-path rust/Cargo.toml --workspace --exclude yamaa-r --all-targets --all-features -- -D warnings
      - name: No Rust inputs changed
        if: steps.paths.outputs.rust == 'false'
        run: echo '::notice::No Rust inputs changed; the Rust checks did not run.'

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/select-checks
        id: paths
      # The host runner builds one wheel and uses it for pytest, the installed
      # suites and equivalence; setup does not build a development wheel too.
      - uses: ./.github/actions/setup
        if: steps.paths.outputs.python == 'true'
        with:
          package: tools
      - name: Check the freshly installed Python host
        if: steps.paths.outputs.python == 'true'
        env:
          EQUIVALENCE: ${{ steps.paths.outputs.equivalence_python }}
        run: |
          arguments=(--host python)
          if [ "$EQUIVALENCE" = true ]; then arguments+=(--equivalence); fi
          uv run --project python --no-sync python -m tools.commands.host_checks "${arguments[@]}"
      - name: No Python inputs changed
        if: steps.paths.outputs.python == 'false'
        run: echo '::notice::No Python inputs changed; the Python checks did not run.'

  r:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/select-checks
        id: paths
      - uses: ./.github/actions/setup
        if: steps.paths.outputs.r == 'true'
        with:
          r: check
          package: tools
      - name: Install the programs that CRAN's checks use
        if: steps.paths.outputs.r == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends devscripts aspell aspell-en
      - name: Install the minimum supported R saved artifact readers
        if: steps.paths.outputs.r == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: Rscript --vanilla tools/ci/install_minimum_r_readers.R
      - name: Install the oldest supported R Arrow bridge
        if: steps.paths.outputs.r == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/apache/arrow-nanoarrow/archive/refs/tags/apache-arrow-nanoarrow-0.8.0.tar.gz \
            --output "$RUNNER_TEMP/nanoarrow-bridge.tar.gz"
          tar -xzf "$RUNNER_TEMP/nanoarrow-bridge.tar.gz" -C "$RUNNER_TEMP"
          R CMD INSTALL "$RUNNER_TEMP/arrow-nanoarrow-apache-arrow-nanoarrow-0.8.0/r"
          Rscript --vanilla -e 'stopifnot(as.character(packageVersion("nanoarrow")) == "0.8.0")'
      - id: lint
        if: steps.paths.outputs.r == 'true'
        run: uv run --project python --no-sync python -m tools.commands.repository lint-r-binding
      - name: Check the freshly installed R host
        if: steps.paths.outputs.r == 'true' && (success() || steps.lint.outcome == 'failure')
        env:
          EQUIVALENCE: ${{ steps.paths.outputs.equivalence_r }}
          YAMAA_R_CARGO_TARGET_DIR: ${{ github.workspace }}/rust/target
        run: |
          arguments=(--host r)
          if [ "$EQUIVALENCE" = true ]; then arguments+=(--equivalence); fi
          uv run --project python --no-sync python -m tools.commands.host_checks "${arguments[@]}"
      - name: No R inputs changed
        if: steps.paths.outputs.r == 'false'
        run: echo '::notice::No R inputs changed; the R checks did not run.'

  # The test-only loaded mode (rust/interface/README.md): both hosts built
  # with their dynamic-engine feature load the engine library from beside
  # their module, and their suites run so, with each fixture engine of the
  # loading tests.
  loaded:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/select-checks
        id: paths
      - uses: ./.github/actions/setup
        if: steps.paths.outputs.loaded == 'true'
        with:
          r: check
          package: tools
      - name: Install the programs that CRAN's checks use
        if: steps.paths.outputs.loaded == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends devscripts aspell aspell-en
      - name: Check the freshly installed Python host with the engine loaded at runtime
        id: python
        if: steps.paths.outputs.loaded == 'true'
        env:
          YAMAA_ENGINE: loaded
        run: uv run --project python --no-sync python -m tools.commands.host_checks --host python
      - name: Check the freshly installed R host with the engine loaded at runtime
        if: steps.paths.outputs.loaded == 'true' && (success() || steps.python.outcome == 'failure')
        env:
          YAMAA_ENGINE: loaded
          YAMAA_R_CARGO_TARGET_DIR: ${{ github.workspace }}/rust/target
        run: uv run --project python --no-sync python -m tools.commands.host_checks --host r
      - name: No loaded-mode inputs changed
        if: steps.paths.outputs.loaded == 'false'
        run: echo '::notice::No loaded-mode inputs changed; the loaded-mode checks did not run.'
