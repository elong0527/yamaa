name: CI

# Pull requests are the gate. Main is checked on a schedule rather than after
# every merge; the scheduled runs also save the Rust caches that pull requests
# restore. Release branches are checked on each push. This workflow owns the
# development checks and equivalence gate; release-compatibility.yml owns
# compatibility builds.
on:
  pull_request:
  push:
    branches: ['release/**']
  schedule:
    - cron: '37 1-23/2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - id: lint
        run: make check-lint
      # Report repository findings even when lint fails.
      - if: success() || steps.lint.outcome == 'failure'
        run: make check-repository
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: make test-rust
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: make test-python
  equivalence:
    # The engine gate: fresh builds of both hosts must reproduce every
    # benchmark's expected bytes and every negative benchmark's first issue.
    # It runs when a pull request's diff reaches the engine, the schemas,
    # the hosts, the repository tools, the benchmarks or this gate's setup;
    # otherwise the job passes without running, so branch protection can
    # require it on every pull request. Scheduled runs leave it out: the gate
    # rebuilds both hosts.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Decide whether the diff reaches the gate's paths
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" != pull_request ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]; then
            echo "::error::The equivalence gate must run on the pull-request head."
            exit 1
          fi
          base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          changed=$(git diff --name-only "$base" "$HEAD_SHA" -- \
            rust yaml benchmarks python R/yamaa tools pyproject.toml \
            Makefile .github/workflows/ci.yml .github/actions/setup)
          if [ -n "$changed" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The diff reaches none of the gate's paths, so the equivalence gate did not run."
          fi
      # The gate builds both hosts from the checkout and ends with
      # R CMD check --as-cran, so it needs what the r job needs.
      - uses: ./.github/actions/setup
        if: steps.paths.outputs.run == 'true'
        with:
          r: check
          package: tools
      - name: Install the programs that CRAN's checks use
        if: steps.paths.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends devscripts aspell aspell-en
      - if: steps.paths.outputs.run == 'true'
        run: make check-equivalence
  r:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The R package builds its own engine and no step imports the Python
      # package, so the development package would go unused.
      - uses: ./.github/actions/setup
        with:
          r: check
          package: tools
      # `make test-r` runs R CMD check --as-cran; with checkbashisms and aspell
      # it also checks the configure scripts and DESCRIPTION's spelling, as
      # CRAN's checks do.
      - name: Install the programs that CRAN's checks use
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends devscripts aspell aspell-en
      - name: Install the minimum supported R saved artifact readers
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: Rscript --vanilla tools/ci/install_minimum_r_readers.R
      - name: Install the oldest supported R Arrow bridge
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/apache/arrow-nanoarrow/archive/refs/tags/apache-arrow-nanoarrow-0.8.0.tar.gz \
            --output "$RUNNER_TEMP/nanoarrow-bridge.tar.gz"
          tar -xzf "$RUNNER_TEMP/nanoarrow-bridge.tar.gz" -C "$RUNNER_TEMP"
          R CMD INSTALL "$RUNNER_TEMP/arrow-nanoarrow-apache-arrow-nanoarrow-0.8.0/r"
          Rscript --vanilla -e 'stopifnot(as.character(packageVersion("nanoarrow")) == "0.8.0")'
      # The package's two installations, R CMD INSTALL and the one in R CMD
      # check, build the engine in the directory that the Rust cache restores,
      # so the second reuses the first's build, and a scheduled run on main
      # saves the compiled crates for later runs. Unset, as on CRAN and in the
      # native R lanes, the build stays inside the package.
      - run: make test-r
        env:
          YAMAA_R_CARGO_TARGET_DIR: ${{ github.workspace }}/rust/target
