name: CI

# Pull requests are the gate. Main is checked on a schedule rather than after
# every merge; the scheduled runs also save the Rust caches that pull requests
# restore. Release branches are checked on each push. This workflow owns the
# development checks and the equivalence and conversion gates;
# release-compatibility.yml owns compatibility builds.
on:
  pull_request:
  push:
    branches: ['release/**']
  schedule:
    - cron: '37 1-23/2 * * *'
    # Weekly: the conversion gate on both hosts.
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The interface stability check reads each release tag's manifests, but
      # no history: one commit per yamaa-v* tag costs less than fetch-depth: 0,
      # which fetches every branch's history. Without the tags, the check fails
      # wherever it needs a baseline.
      - name: Fetch the release tags
        run: git fetch --no-tags --depth=1 origin '+refs/tags/yamaa-v*:refs/tags/yamaa-v*'
      # The repository check runs the third-party notices generator.
      - uses: ./.github/actions/setup
        with:
          notices: 'true'
      - id: lint
        run: make check-lint
      # Report repository findings even when lint fails.
      - if: success() || steps.lint.outcome == 'failure'
        run: make check-repository
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: make test-rust
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: make test-python
  equivalence-host:
    # The engine gate, one job per host so that the two halves run in
    # parallel: a fresh build of each host must reproduce every benchmark's
    # expected bytes and every negative benchmark's first issue. Run by
    # default, including new build/configuration inputs. Only changes
    # confined to the documentation paths below pass without running.
    # Scheduled runs leave it out: the gate rebuilds both hosts. Its two legs,
    # equivalence (python) and equivalence (r), are the gate's checks; no job
    # reports them as one (#3492). The name holds no matrix expression, so
    # GitHub appends each leg's host to it, and a run that skips the job
    # shows the plain name rather than an unexpanded expression.
    name: equivalence
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        host: [python, r]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # The conversion job repeats this step and must read the same diff
      # (D124); change the two together.
      - name: Decide whether the diff reaches the gate's paths
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" != pull_request ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]; then
            echo "::error::The equivalence gate must run on the pull-request head."
            exit 1
          fi
          base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          changed=$(git diff --no-renames --name-only "$base" "$HEAD_SHA" -- . \
            ':(top,exclude)README.md' \
            ':(top,exclude)CONTRIBUTING.md' \
            ':(top,exclude)AGENTS.md' \
            ':(top,exclude,glob)docs/**/*.md')
          if [ -n "$changed" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The diff changes only documentation, so the equivalence gate did not run."
          fi
      # Each half builds its host from the checkout. The Python half needs no
      # R; the R half ends with R CMD check --as-cran, so it needs what the r
      # job needs.
      - uses: ./.github/actions/setup
        if: steps.paths.outputs.run == 'true'
        with:
          r: ${{ matrix.host == 'r' && 'check' || 'none' }}
          package: tools
      - name: Install the programs that CRAN's checks use
        if: steps.paths.outputs.run == 'true' && matrix.host == 'r'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends devscripts aspell aspell-en
      - if: steps.paths.outputs.run == 'true'
        env:
          HOSTS: ${{ matrix.host }}
        run: make check-equivalence HOSTS="$HOSTS"
  conversion:
    # The 1.0 conversion gate (#3030 P1-9, D76): every benchmark, converted to
    # 1.0 by tools/migrate, must give its expected result on a fresh install.
    # A pull request runs it on Python unless its diff changes only
    # documentation, by the equivalence gate's rule (D124), and otherwise
    # passes with a notice; the weekly schedule and a dispatch run it on both
    # hosts.
    if: >-
      github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '23 4 * * 1'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # The equivalence host jobs' step, repeated so that both gates read the
      # same diff (D124); tools/tests/test_equivalence_workflow.py runs both. A
      # local action or script would be read from the pull-request head, and a
      # head that predates it would fail both gates.
      - name: Decide whether the diff reaches the gate's paths
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" != pull_request ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "hosts=python,r" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]; then
            echo "::error::The conversion gate must run on the pull-request head."
            exit 1
          fi
          base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          changed=$(git diff --no-renames --name-only "$base" "$HEAD_SHA" -- . \
            ':(top,exclude)README.md' \
            ':(top,exclude)CONTRIBUTING.md' \
            ':(top,exclude)AGENTS.md' \
            ':(top,exclude,glob)docs/**/*.md')
          echo "hosts=python" >> "$GITHUB_OUTPUT"
          if [ -n "$changed" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The diff changes only documentation, so the conversion gate did not run."
          fi
      # The gate builds each host from the checkout; R conformance reads the
      # package's test dependencies.
      - uses: ./.github/actions/setup
        if: steps.paths.outputs.run == 'true'
        with:
          r: ${{ steps.paths.outputs.hosts == 'python' && 'none' || 'check' }}
          package: tools
      - if: steps.paths.outputs.run == 'true'
        env:
          HOSTS: ${{ steps.paths.outputs.hosts }}
        run: make check-conversion HOSTS="$HOSTS"
  r:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The R package builds its own engine and no step imports the Python
      # package, so the development package would go unused.
      - uses: ./.github/actions/setup
        with:
          r: check
          package: tools
      # `make test-r` runs R CMD check --as-cran; with checkbashisms and aspell
      # it also checks the configure scripts and DESCRIPTION's spelling, as
      # CRAN's checks do.
      - name: Install the programs that CRAN's checks use
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends devscripts aspell aspell-en
      - name: Install the minimum supported R saved artifact readers
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: Rscript --vanilla tools/ci/install_minimum_r_readers.R
      - name: Install the oldest supported R Arrow bridge
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/apache/arrow-nanoarrow/archive/refs/tags/apache-arrow-nanoarrow-0.8.0.tar.gz \
            --output "$RUNNER_TEMP/nanoarrow-bridge.tar.gz"
          tar -xzf "$RUNNER_TEMP/nanoarrow-bridge.tar.gz" -C "$RUNNER_TEMP"
          R CMD INSTALL "$RUNNER_TEMP/arrow-nanoarrow-apache-arrow-nanoarrow-0.8.0/r"
          Rscript --vanilla -e 'stopifnot(as.character(packageVersion("nanoarrow")) == "0.8.0")'
      # The package's two installations, R CMD INSTALL and the one in R CMD
      # check, build the engine in the directory that the Rust cache restores,
      # so the second reuses the first's build, and a scheduled run on main
      # saves the compiled crates for later runs. Unset, as on CRAN and in the
      # native R lanes, the build stays inside the package.
      - run: make test-r
        env:
          YAMAA_R_CARGO_TARGET_DIR: ${{ github.workspace }}/rust/target
