name: Harbor Oracle

# Builds the evaluation image and runs Harbor's own oracle and nop agents
# through the separate Docker verifier (evaluations/harbor/smoke.py), offline:
# the oracle must score 1 with every required check run, nop must score 0.
# It also probes the verifier sandbox (probe.py): the agent's script cannot
# read the golden files, change the inputs or the grader's logs, or leave a
# process behind. Each run randomly samples ten tasks across both languages
# and all prompt tiers, using the same sample for oracle and nop. The saved
# seed and sample make failures reproducible. A test keeps the image tag here
# equal to build.py's IMAGE.

on:
  pull_request:
    paths:
      - evaluations/harbor/**
      - python/tests/test_harbor*.py
      - python/pyproject.toml
      - python/uv.lock
      - benchmarks/**
      - .github/workflows/harbor-oracle.yml
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install locked Harbor and test dependencies
        run: |
          python -m pip install uv==0.11.6
          uv sync --project python --extra test --group harbor --locked
      - name: Check harness and regression tests
        run: |
          uv run --project python --no-sync ruff check evaluations/harbor/*.py python/tests/test_harbor*.py
          uv run --project python --no-sync ruff format --check evaluations/harbor/*.py python/tests/test_harbor*.py
          uv run --project python --no-sync pytest python/tests/test_harbor*.py
      - name: Build evaluation image
        run: docker build -t yamaa-harbor-env:0.5 evaluations/harbor
      - name: Run both tracks through the separate Docker verifier
        run: |
          uv run --project python --no-sync python evaluations/harbor/smoke.py \
            --prompt full conventions brief \
            --n-concurrent 6 \
            --out "${{ runner.temp }}/harbor"
      - name: Upload verifier diagnostics
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: harbor-verification
          path: |
            ${{ runner.temp }}/harbor/jobs
            ${{ runner.temp }}/harbor/sample.json
          if-no-files-found: ignore
