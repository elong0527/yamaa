name: Review completion updater

# Every event here uses the trusted default/base branch. Review submissions and
# thread resolution have no equivalent trusted Actions trigger; refresh all open
# main PRs on the schedule, and recheck synchronously before every merge.
on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, edited]
  status:
  issue_comment:
    types: [created, edited, deleted]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: review-completion-${{ github.repository }}
  cancel-in-progress: false

jobs:
  update:
    if: >-
      github.repository == 'elong0527/yamaa' &&
      (github.event_name != 'status' ||
       (github.event.context == 'CodeRabbit' && github.actor == 'coderabbitai[bot]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Update the required commit status from trusted main code
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m tools.ci.review_gate --publish
