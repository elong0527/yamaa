name: R shared grammar

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'R/yamaa/**'
      - 'rust/**'
      - '!rust/**/*.md'
      - 'yaml/grammar/**'
      - '.github/workflows/r.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  installed-grammar:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: '1.90.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true
      - name: Install locked grammar and Rust build tools
        run: |
          python -m pip install py-yaml12==0.2.0
          rustup toolchain install 1.90.0 --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust
          shared-key: r-shared-grammar
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Replay exact shared shapes, dependencies and vocabulary in the typed core
        run: python rust/tools/check_shared_grammar.py
      - name: Stage standalone R source package
        run: python rust/tools/stage_r_package.py "${RUNNER_TEMP}/grammar-stage/yamaa"
      - name: Build and install outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          mkdir grammar-r-library
          R CMD build --no-build-vignettes --no-manual grammar-stage/yamaa
          python "${GITHUB_WORKSPACE}/rust/tools/check_cargo_lock.py" yamaa_0.3.0.tar.gz
          R CMD INSTALL --library="${RUNNER_TEMP}/grammar-r-library" yamaa_0.3.0.tar.gz
      - name: Replay shared decisions through the installed public R facade
        working-directory: ${{ runner.temp }}
        env:
          R_LIBS: ${{ runner.temp }}/grammar-r-library
        run: |
          Rscript --vanilla "${GITHUB_WORKSPACE}/R/yamaa/tests/public_grammar.R" 2>&1 | tee r-shared-grammar.log
          Rscript --vanilla "${GITHUB_WORKSPACE}/R/yamaa/tests/scalars.R" 2>&1 | tee -a r-shared-grammar.log
          Rscript --vanilla -e 'print(sessionInfo()); print(packageVersion("yamaa"))' >> r-shared-grammar.log
      - name: Preserve grammar evidence and standalone source artifact
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: r-shared-grammar
          path: |
            ${{ runner.temp }}/r-shared-grammar.log
            ${{ runner.temp }}/yamaa_0.3.0.tar.gz
          if-no-files-found: warn
