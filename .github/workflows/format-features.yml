name: Optional format features

# Scheduled on main with CI rather than after every merge.
on:
  # PRs into a release integration branch run only the CI workflow.
  pull_request:
    branches: [main]
  # Schedules only check main, so release branches are checked on each push.
  push:
    branches: ['release/**']
  schedule:
    - cron: '37 1-23/2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: format-features-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # One job runs every selection in turn: they share the Rust build, and each
  # needs only cargo and the standard-library check script.
  formats:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          package: 'false'
      - name: Check fixtures, dependency edges and linked native symbols
        run: |
          failed=()
          for selection in none yaml parquet readstat all; do
            echo "::group::$selection"
            python -m tools.ci.format_features "$selection" || failed+=("$selection")
            echo "::endgroup::"
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::Failed format selections: ${failed[*]}"
            exit 1
          fi
