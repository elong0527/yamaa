name: Optional format features

# Scheduled on main with CI rather than after every merge, and run on each
# release branch push as CI is. A pull request runs it only when it changes the
# adapters crate, whose code holds the format feature gates, or what decides
# the Cargo graph and these checks.
on:
  push:
    branches: ['release/**']
  pull_request:
    paths:
      - 'rust/crates/yamaa-adapters/**'
      - 'rust/**/Cargo.toml'
      - 'rust/Cargo.lock'
      - 'rust/rust-toolchain.toml'
      - 'rust/vendor/**'
      - 'tools/ci/format_features.py'
      - 'tools/ci/toolchain.py'
      - '.github/actions/setup/**'
      - '.github/workflows/format-features.yml'
  schedule:
    - cron: '37 1-23/2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: format-features-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # One job runs every selection in turn: they share the Rust build, and each
  # needs only cargo and the standard-library check script.
  formats:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          package: 'false'
      - name: Check fixtures, dependency edges and linked native symbols
        run: |
          failed=()
          for selection in none yaml parquet readstat yaml-parquet all; do
            echo "::group::$selection"
            python -m tools.ci.format_features "$selection" || failed+=("$selection")
            echo "::endgroup::"
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::Failed format selections: ${failed[*]}"
            exit 1
          fi
