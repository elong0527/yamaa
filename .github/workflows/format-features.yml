name: Optional format features

# A release lane, not a development check: embedders' format feature subsets
# are checked on each release branch push and on dispatch.
on:
  push:
    branches: ['release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: format-features-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # One job runs every selection in turn: they share the Rust build, and each
  # needs only cargo and the standard-library check script.
  formats:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          package: 'false'
      - name: Check fixtures, dependency edges and linked native symbols
        run: |
          failed=()
          for selection in none yaml parquet readstat yaml-parquet all; do
            echo "::group::$selection"
            python -m tools.ci.format_features "$selection" || failed+=("$selection")
            echo "::endgroup::"
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::Failed format selections: ${failed[*]}"
            exit 1
          fi
