name: Example dependency order

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-order:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test dependency checker
        run: ruby .github/scripts/examples/test_check_example_dependencies.rb
      - name: Check example dependency and output order
        run: ruby .github/scripts/examples/check_example_dependencies.rb
