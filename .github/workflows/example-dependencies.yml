name: Example dependency order

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-order:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test dependency checker
        run: ruby .github/workflows/test_check_example_dependencies.rb
      - name: Check example dependency and output order
        run: ruby .github/workflows/check_example_dependencies.rb
