name: Read retained Linux performance records

on:
  push:
    branches: ['evidence/performance-records-*']
  workflow_dispatch:
    inputs:
      run_id:
        description: Original performance workflow run
        required: true
        type: string
      native_run_id:
        description: Original successful native workflow run on the same source
        default: '38657181937'
        type: string
      source_revision:
        description: Exact original collector and auditor source
        default: '46ee4dcb0f7ffe5cd8a95b477d242cfadcf0c689'
        type: string
      run_attempt:
        description: Original performance run attempt
        default: '1'
        type: string

permissions:
  contents: read
  actions: read

jobs:
  read:
    runs-on: ubuntu-24.04
    # Finite producer wait (180m), full replay (120m), and download margin.
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      ORIGINAL_RUN: ${{ inputs.run_id }}
      ORIGINAL_NATIVE_RUN: ${{ inputs.native_run_id || '38657181937' }}
      ORIGINAL_REVISION: ${{ inputs.source_revision || '46ee4dcb0f7ffe5cd8a95b477d242cfadcf0c689' }}
      ORIGINAL_ATTEMPT: ${{ inputs.run_attempt || '1' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.ORIGINAL_REVISION }}
          path: frozen-source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Retain original metadata and unchanged owner ZIPs
        shell: bash
        run: |
          python .github/scripts/ci/export_performance_records.py \
            --run-id "${ORIGINAL_RUN}" --native-run-id "${ORIGINAL_NATIVE_RUN}" \
            --attempt "${ORIGINAL_ATTEMPT}" --revision "${ORIGINAL_REVISION}" \
            --source frozen-source --output "${RUNNER_TEMP}/performance-records"
      - name: Replay all 54 cells with the unchanged original auditor
        shell: bash
        run: |
          python frozen-source/rust/tools/audit_public_performance.py \
            --repository frozen-source \
            --input "${RUNNER_TEMP}/performance-records/records/input.json" \
            --collection-scope linux-installed --check-collection \
            --output "${RUNNER_TEMP}/performance-records/audit"
      - name: Preserve the actual report and source metadata, including failures
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: retained-linux-performance-report
          retention-days: 90
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/performance-records/records/*.json
            ${{ runner.temp }}/performance-records/records/*.log
            ${{ runner.temp }}/performance-records/audit
