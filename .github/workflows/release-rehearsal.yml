name: Release rehearsal

# release.yml runs only when a release tag is pushed. Rehearse its selection
# and downloads against the latest successful native run on main, with this
# workflow's read-only token, and stop before anything is published. Like the
# other release lanes it runs only on dispatch: dispatch it before pushing a
# release tag, after the native run that the tag will name.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  rehearse:
    if: github.repository == 'elong0527/yamaa'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Find the latest successful native run on main
        id: run
        run: |
          run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/native.yml/runs?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0] // empty | "\(.id) \(.head_sha) \(.html_url)"')"
          if [ -z "$run" ]; then
            echo "::error::No successful native run on main to rehearse"
            exit 1
          fi
          read -r id head url <<< "$run"
          echo "Rehearsing $url at $head"
          {
            echo "id=$id"
            echo "head=$head"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The run's commit, with main's history for the ancestry check.
          ref: ${{ steps.run.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Select and download the run's release assets without publishing
        env:
          RUN_ID: ${{ steps.run.outputs.id }}
        run: |
          python -m tools.ci.select_release_artifacts \
            --repository "${GITHUB_REPOSITORY}" --run-id "${RUN_ID}" \
            --destination "${RUNNER_TEMP}/rehearsed-release"
      # The assets and the body a release tag at this commit would publish,
      # for review before the tag is pushed.
      - name: Show the assets and release body
        run: |
          selected="${RUNNER_TEMP}/rehearsed-release"
          {
            echo "## Release assets"
            echo
            while read -r path; do
              echo "- \`$(basename "$path")\`"
            done < "${selected}/asset-paths.txt"
            echo
            echo "## Release body"
            echo
            cat "${selected}/release-notes.md"
          } >> "${GITHUB_STEP_SUMMARY}"
