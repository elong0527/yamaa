name: Main health

# Main is checked on schedules rather than after every merge, so a failing
# main run is the only sign that main is broken. Keep one open issue per
# workflow while its newest main run fails, and close it when one succeeds.
# tools/ci/main_health.py ignores a run that a newer main run has overtaken,
# such as a re-run of an older run that finishes after the newer one.
on:
  workflow_run:
    workflows:
      - CI
      - Optional format features
      - Native qualification
      - R-CMD-check
      - Harbor
      - Coverage
      - Dependency graphs
      - Docs
    types: [completed]
    branches: [main]

permissions:
  # Read the other main runs of the watched workflow.
  actions: read
  contents: read
  issues: write

concurrency:
  group: main-health-${{ github.event.workflow_run.name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  report:
    # Cancelled and skipped runs say nothing about main. The script ignores
    # the same conclusions among the newer runs it compares.
    if: >-
      github.event.workflow_run.event != 'pull_request'
      && contains(fromJSON('["success", "failure", "timed_out", "startup_failure"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # A workflow_run job checks out the default branch, not the commit of
      # the run it reports.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Open, update or close the workflow's issue
        run: python -m tools.ci.main_health --repository "$GITHUB_REPOSITORY" --event "$GITHUB_EVENT_PATH"
