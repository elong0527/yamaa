name: Example dashboards

on:
  push:
    branches: [main]
    paths:
      - 'yaml/examples/**'
      - 'docs/examples/**'
      - '.github/scripts/example-docs/**'
      - '.github/workflows/example-docs.yml'
  pull_request:
    paths:
      - 'yaml/examples/**'
      - 'docs/examples/**'
      - '.github/scripts/example-docs/**'
      - '.github/workflows/example-docs.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install pinned rendering dependencies
        run: python -m pip install -r .github/scripts/example-docs/requirements.txt
      - name: Test fixture fidelity and deterministic generation
        run: python -m unittest discover -s .github/scripts/example-docs -p 'test_*.py'
      - name: Generate every example
        env:
          LC_ALL: C.UTF-8
          PYTHONHASHSEED: '1'
          TZ: UTC
        run: python .github/scripts/example-docs/generate.py --all --quiet --output-dir /tmp/yamaa-example-docs-first
      - name: Generate every example again in a different environment
        env:
          LC_ALL: C.UTF-8
          PYTHONHASHSEED: '8675309'
          TZ: Pacific/Honolulu
        run: python .github/scripts/example-docs/generate.py --all --quiet --output-dir /tmp/yamaa-example-docs-second
      - name: Confirm byte-for-byte deterministic output
        run: diff -rq /tmp/yamaa-example-docs-first /tmp/yamaa-example-docs-second
      - name: Check the committed example is current
        run: python .github/scripts/example-docs/generate.py --check
      - name: Upload all generated example dashboards
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yamaa-example-dashboards
          path: /tmp/yamaa-example-docs-first
          if-no-files-found: error
          retention-days: 7
