      # library of the runner's target, the components of rustup's minimal
      # profile, into /opt/rust, which the build then mounts read-only.
      - name: Install Rust from its standalone installer without a network
        working-directory: ${{ runner.temp }}/offline
        env:
          http_proxy: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: ''
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp:rw,exec \
            --volume "${PWD}:/work" --volume "${PWD}/rust:/opt/rust" --workdir /work \
            --env HOME=/work/home --env TMPDIR=/work/tmp \
            --env STANDALONE_RUST_VERSION --env STANDALONE_RUST_TARGET \
            docker.io/rocker/r-ver:4.6.1 sh -c '
              set -e
              for state in /sys/class/net/*/operstate; do
                test "${state}" = /sys/class/net/lo/operstate || test "$(cat "${state}")" = down
              done
              "rust-${STANDALONE_RUST_VERSION}-${STANDALONE_RUST_TARGET}/install.sh" --prefix=/opt/rust \
                --components="rustc,cargo,rust-std-${STANDALONE_RUST_TARGET}" --disable-ldconfig
              /opt/rust/bin/rustc --version | grep -F "rustc ${STANDALONE_RUST_VERSION} "
              /opt/rust/bin/cargo --version | grep -F "cargo ${STANDALONE_RUST_VERSION} "'
      # tools/configure.R finds cargo and rustc on the PATH, where no rustup is
      # and the only cargo and rustc are the installed ones, and reports their
      # versions in the installation log.
      - name: Install the R source package without a network
        working-directory: ${{ runner.temp }}/offline
        env:
          http_proxy: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: ''
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp:rw,exec \
            --volume "${PWD}:/work" --volume "${PWD}/rust:/opt/rust:ro" \
            --env PATH=/opt/rust/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            --env HOME=/work/home --env TMPDIR=/work/tmp \
            docker.io/rocker/r-ver:4.6.1 sh -c '
              set -e
              for state in /sys/class/net/*/operstate; do
                test "${state}" = /sys/class/net/lo/operstate || test "$(cat "${state}")" = down
              done
              test -z "$(command -v rustup)"
              test "$(command -v cargo)" = /opt/rust/bin/cargo
              test "$(command -v rustc)" = /opt/rust/bin/rustc
              R CMD INSTALL --library=/work/library /work/yamaa_*.tar.gz
              test -z "$(ls -A /work/home)"'
      # Only the installed package is mounted; its own cases must pass
      # before it runs the external conformance corpus.
      - name: Run the installed package's selftest
        working-directory: ${{ runner.temp }}/offline
        env:
          http_proxy: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: ''
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp:rw,exec --user "$(id -u):$(id -g)" \
            --volume "${PWD}:/work" --workdir /work --env HOME=/work/home --env TMPDIR=/work/tmp \
            --env R_LIBS=/work/library \
            docker.io/rocker/r-ver:4.6.1 Rscript --vanilla -e \
            'r <- yamaa::yamaa_selftest(); print(r); quit(status = r$status != "succeeded")'
      # The installed package runs as the runner's user, which then compares
      # and uploads the files that it saves: the engine publishes each file
      # readable by its owner alone.
      - name: Report installed R public benchmark conformance
        working-directory: ${{ runner.temp }}/offline
        env:
          PUBLIC_CONFORMANCE_PACKAGE_FORM: source
          http_proxy: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: ''
        run: |
          revision=$(git -C "${GITHUB_WORKSPACE}" rev-parse HEAD)
          python -I -m tools.conformance.public_conformance plan \
            --fixtures "${GITHUB_WORKSPACE}/benchmarks" --output public-conformance-plan
          mkdir public-conformance
          docker run --rm --network none --read-only --tmpfs /tmp:rw,exec --user "$(id -u):$(id -g)" \
            --volume "${PWD}:/work" --volume "${GITHUB_WORKSPACE}:/checkout:ro" --workdir /work \
            --env HOME=/work/home --env TMPDIR=/work/tmp --env R_LIBS=/work/library \
            --env PUBLIC_CONFORMANCE_PACKAGE_FORM --env GITHUB_SERVER_URL --env GITHUB_REPOSITORY \
            --env GITHUB_RUN_ID --env REVISION="${revision}" \
            docker.io/rocker/r-ver:4.6.1 sh -c '
              set -e
              R CMD INSTALL --library=/work/library project-programs
              Rscript --vanilla /checkout/rust/tests/public_conformance.R \
                public-conformance-plan /checkout/benchmarks public-conformance/observed "${REVISION}"'
          python -I -m tools.conformance.public_conformance compare \
            --fixtures "${GITHUB_WORKSPACE}/benchmarks" --observed public-conformance/observed \
            --output public-conformance/inventory.json
      - name: Preserve R public benchmark inventory and saved artifacts
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: public-conformance-r-offline-toolchain-${{ matrix.os }}
          path: ${{ runner.temp }}/offline/public-conformance
          if-no-files-found: error

  offline-wheel:
    name: native-offline-wheel (${{ matrix.os }}, ${{ matrix.python }})
    needs: dist
    runs-on: ${{ matrix.os }}
    # Each wheel that a release publishes, installed as the restricted-
    # environment guide installs files carried in, with the oldest and the
    # newest supported CPython: the wheels are abi3, so these two bound the
    # supported interpreters that each wheel serves. While the network is up,
    # pip downloads the wheel's runtime dependencies, at the versions that
    # python/uv.lock pins and as wheels alone, into one directory with the
    # wheel. Then, with the network disabled, pip installs the wheel from that
    # directory alone into a new virtual environment, which builds nothing;
    # the installed package must import with the wheel's version, and it then
    # runs its selftest. On Linux both run in containers without a network and
    # with a read-only root, from the pinned manylinux_2_28 image of the
    # runner's architecture (tools/ci/manylinux.py), whose glibc 2.28 is the
    # oldest that the wheel's tag admits, with that image's CPython; on macOS
    # and Windows they run behind a proxy that refuses every connection, with
    # the CPython that setup-python installs. The selftest proves the offline
    # installation, and the lane ends with it: the conformance corpus runs on
    # the same wheel in native-qualify, with every supported CPython, and in
    # native-glibc, which install it while the network is up (D240 on #3673).
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025, ubuntu-24.04-arm]
        python: ['3.12', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.13.0'
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install repository tools
        run: python -m pip install --no-deps -e .
      - name: Download the wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-python-${{ matrix.os }}-${{ env.NATIVE_BUILD_PYTHON }}
          path: ${{ runner.temp }}/offline/native-dist
      # While the network is up. uv exports the runtime dependencies that
      # python/uv.lock pins, without the test extra, and pip downloads each one
      # as a wheel for the Python that installs the package, the image's on
      # Linux, so the directory holds no source archive that pip could build.
      - name: Collect the wheel and its dependencies
        working-directory: ${{ runner.temp }}/offline
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          uv export --project "${GITHUB_WORKSPACE}/python" --locked --no-dev --no-emit-project --no-hashes --output-file runtime-requirements.txt
          mkdir yamaa-files
          cp native-dist/yamaa-*.whl yamaa-files/
          if [ "${RUNNER_OS}" = Linux ]; then
            mkdir home tmp
            image=$(python -c 'import platform; from tools.ci.manylinux import IMAGES; print(IMAGES[platform.machine()])')
            interpreter="/opt/python/cp${PYTHON_VERSION/./}-cp${PYTHON_VERSION/./}/bin/python"
            {
              echo "OFFLINE_IMAGE=${image}"
              echo "OFFLINE_PYTHON=${interpreter}"
            } >> "${GITHUB_ENV}"
            docker run --rm --volume "${PWD}:/work" --workdir /work "${image}" \
              "${interpreter}" -m pip download --no-cache-dir --only-binary :all: --no-deps \
              --dest yamaa-files -r runtime-requirements.txt
          else
            python -m pip download --no-cache-dir --only-binary :all: --no-deps \
              --dest yamaa-files -r runtime-requirements.txt
          fi
          ls -l yamaa-files
      # pip installs from that directory alone, with the guide's command, and
      # finds only wheels there. The log then lists the installed packages,
      # and the installed package must import with the version that the
      # wheel's name gives. A connection that anything attempted would fail at
      # once. On Linux the container mounts no checkout.
      - name: Install the wheel without a network
        working-directory: ${{ runner.temp }}/offline
        env:
          http_proxy: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: ''
        run: |
          wheels=(yamaa-files/yamaa-*.whl)
          test "${#wheels[@]}" -eq 1
          version=$(basename "${wheels[0]}")
          version=${version#yamaa-}
          version=${version%%-*}
          if [ "${RUNNER_OS}" = Linux ]; then
            docker run --rm --network none --read-only --tmpfs /tmp:rw,exec \
              --volume "${PWD}:/work" --workdir /work --env HOME=/work/home --env TMPDIR=/work/tmp \
              --env PYTHON="${OFFLINE_PYTHON}" "${OFFLINE_IMAGE}" sh -c '
                set -e
                "${PYTHON}" -I -m venv venv
                venv/bin/python -I -m pip install --no-cache-dir --no-index --find-links yamaa-files yamaa
                venv/bin/python -I -m pip list --disable-pip-version-check'
            docker run --rm --network none --read-only --tmpfs /tmp:rw,exec --user "$(id -u):$(id -g)" \
              --volume "${PWD}:/work" --workdir /work --env HOME=/work/home --env TMPDIR=/work/tmp \
              "${OFFLINE_IMAGE}" /work/venv/bin/python -I -c \
              'import sys, yamaa; from importlib.metadata import version; v = version("yamaa"); print("yamaa", v, "imported from", yamaa.__file__); sys.exit(None if v == sys.argv[1] else f"pip installed yamaa {v}, not {sys.argv[1]}")' \
              "${version}"
          else
            interpreter=venv/bin/python
            if [ "${RUNNER_OS}" = Windows ]; then interpreter=venv/Scripts/python.exe; fi
            echo "VENV_PYTHON=${interpreter}" >> "${GITHUB_ENV}"
            python -I -m venv venv
            "${interpreter}" -I -m pip install --no-cache-dir --no-index --find-links yamaa-files yamaa
            "${interpreter}" -I -m pip list --disable-pip-version-check
            "${interpreter}" -I -c \
              'import sys, yamaa; from importlib.metadata import version; v = version("yamaa"); print("yamaa", v, "imported from", yamaa.__file__); sys.exit(None if v == sys.argv[1] else f"pip installed yamaa {v}, not {sys.argv[1]}")' \
              "${version}"
          fi
      # The installed package runs the selftest cases that it carries and
      # prints the report to the log, as installation qualification evidence;
      # the job fails unless the selftest reports succeeded. On Linux it runs
      # as the runner's user, in a container that mounts no checkout: the
      # cases are inside the package.
      - name: Run the installed package's selftest
        working-directory: ${{ runner.temp }}/offline
        env:
          http_proxy: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: ''
        run: |
          if [ "${RUNNER_OS}" = Linux ]; then
            docker run --rm --network none --read-only --tmpfs /tmp:rw,exec --user "$(id -u):$(id -g)" \
              --volume "${PWD}:/work" --workdir /work --env HOME=/work/home --env TMPDIR=/work/tmp \
              "${OFFLINE_IMAGE}" /work/venv/bin/python -I -c \
              'import sys, yamaa; r = yamaa.selftest(); print(r); sys.exit(r.status != "succeeded")'
          else
            "${VENV_PYTHON}" -I -c 'import sys, yamaa; r = yamaa.selftest(); print(r); sys.exit(r.status != "succeeded")'
          fi

  r-binary:
    name: native-r-binary (${{ matrix.os }}, R ${{ matrix.r }})
    needs: r-dist
    runs-on: ${{ matrix.os }}
    # The R binary packages that a release publishes, for R-release and
    # R-oldrel on Windows x64 and macOS arm64 (#3030 D48): R CMD INSTALL
    # --build of the published R source package with that R, and on Windows
    # with Rtools45 and the GNU Rust target. The build reads the vendored
    # crates behind a proxy that refuses every connection.
    timeout-minutes: ${{ matrix.os == 'windows-2025' && 45 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
        r: ['4.6.1', '4.5.3']
    env:
      # The oldest macOS that the macOS binaries run on, the arm64 floor that
      # R/yamaa/tools/configure.R gives Cargo when the caller sets none. R
      # compiles and links yamaa.so with clang, which takes its target from
      # this variable and otherwise targets the runner's own macOS. Windows
      # ignores it.
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      # The notice check compares the package's notices with the checkout's
      # byte for byte.
      - name: Preserve fixture bytes and symlinks on Windows
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install repository tools
        run: |
          python -m pip install --no-deps -e .
          python -m tools.ci.toolchain
      - name: Install Rust
        run: |
          python -m tools.ci.toolchain --install
          if [ "${RUNNER_OS}" = Windows ]; then
            rustup target add x86_64-pc-windows-gnu
          fi
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: ${{ matrix.r }}
          rtools-version: ${{ runner.os == 'Windows' && '45' || '' }}
          use-public-rspm: true
      - name: Download the published R source archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-r-ubuntu-24.04
          path: ${{ runner.temp }}/published
      # R CMD INSTALL --build writes yamaa_<version>.zip on Windows and
      # yamaa_<version>.tgz on macOS. Both R series' binaries go in one
      # release, so the asset name adds the series after a hyphen, which
      # install.packages() reads as part of the version: it takes the
      # package name from what comes before the underscore. Environment names
      # are case-insensitive on Windows; libcurl reads only the lowercase
      # http_proxy.
      - name: Build the R binary package
        working-directory: ${{ runner.temp }}
        env:
          R_VERSION: ${{ matrix.r }}
          http_proxy: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: ''
        run: |
          Rscript --vanilla -e 'stopifnot(identical(as.character(getRversion()), Sys.getenv("R_VERSION")))'
          archives=(published/yamaa_*.tar.gz)
          test "${#archives[@]}" -eq 1
          version=$(basename "${archives[0]}" .tar.gz)
          version=${version#yamaa_}
          extension=tgz
          if [ "${RUNNER_OS}" = Windows ]; then extension=zip; fi
          mkdir r-binary-library r-binary
          R CMD INSTALL --build --library="${RUNNER_TEMP}/r-binary-library" "${archives[0]}"
          mv "yamaa_${version}.${extension}" "r-binary/yamaa_${version}-${R_VERSION%.*}.${extension}"
          ls -l r-binary
      # macOS refuses to load a library whose minimum macOS is newer than the
      # running system, and no lane runs an older macOS, so on macOS the check
      # reads the minimum that the binary's yamaa.so declares, the minos of its
      # LC_BUILD_VERSION, which may not exceed the deployment target.
      - name: Check the R binary package
        working-directory: ${{ runner.temp }}
        env:
          R_LIBS: ${{ runner.temp }}/r-binary-library
        run: |
          binaries=(r-binary/*)
          test "${#binaries[@]}" -eq 1
          python -m tools.packaging.check_package_notices "${binaries[0]}"
          Rscript --vanilla -e 'built <- packageDescription("yamaa", lib.loc = Sys.getenv("R_LIBS"))$Built' \
            -e 'writeLines(built)' \
            -e 'stopifnot(startsWith(built, paste0("R ", getRversion(), "; ", R.version$platform, ";")))'
          if [ "${RUNNER_OS}" = macOS ]; then
            mkdir r-binary-check
            tar -xzf "${binaries[0]}" -C r-binary-check yamaa/libs/yamaa.so
            otool -l r-binary-check/yamaa/libs/yamaa.so | grep -A 4 LC_BUILD_VERSION
            minos=$(otool -l r-binary-check/yamaa/libs/yamaa.so | awk '$1 == "minos" { print $2 }')
            Rscript --vanilla -e 'minos <- commandArgs(TRUE)' \
              -e 'target <- Sys.getenv("MACOSX_DEPLOYMENT_TARGET")' \
              -e 'writeLines(paste0("yamaa.so needs macOS ", minos, " or later; the deployment target is ", target))' \
              -e 'stopifnot(package_version(minos) <= package_version(target))' \
              "${minos}"
          fi
      - name: Preserve the R binary package
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: native-r-binary-${{ matrix.os }}-${{ matrix.r }}
          path: ${{ runner.temp }}/r-binary
          if-no-files-found: error

  r-binary-install:
    name: native-r-binary-install (${{ matrix.os }}, R ${{ matrix.r }})
    needs: r-binary
    runs-on: ${{ matrix.os }}
    # Each R binary package, installed as a user installs it, with
    # install.packages(path, repos = NULL) and R of its series, on a runner
    # that has no Rust, no Rtools and no network: the image's Rust is
    # uninstalled, setup-r installs no Rtools, any Rtools that the image
    # carries is deleted, and the installation, the installed package's
    # selftest, the conformance corpus and the installed R suites run behind
    # a proxy that refuses every connection. Before that, while the network
    # is up, the suites' suggested packages are installed as CRAN binaries.
    # The cohort comparison reads the reports.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
        r: ['4.6.1', '4.5.3']
    steps:
      - name: Preserve fixture bytes and symlinks on Windows
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install repository tools
        run: |
          python -m pip install --no-deps -e .
          python -m pip install py-yaml12==0.2.0 pyyaml==6.0.3 pyarrow==25.0.1
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: ${{ matrix.r }}
          rtools-version: none
          windows-path-include-rtools: false
          use-public-rspm: true
      - name: Download the R binary package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-r-binary-${{ matrix.os }}-${{ matrix.r }}
          path: ${{ runner.temp }}/r-binary
      - name: Install the R suites' suggested packages
        working-directory: ${{ runner.temp }}
        env:
          R_LIBS: ${{ runner.temp }}/r-binary-library
        run: |
          mkdir r-binary-library
          Rscript --vanilla - <<'RS'
          repository <- Sys.getenv("RSPM")
          if (!nzchar(repository)) repository <- "https://cloud.r-project.org"
          options(repos = c(CRAN = repository))
          description <- read.dcf(file.path(Sys.getenv("GITHUB_WORKSPACE"), "R/yamaa/DESCRIPTION"))
          suggests <- strsplit(description[1, "Suggests"], ",", fixed = TRUE)[[1]]
          packages <- trimws(sub("[[:space:]]*[(][^)]*[)]", "", suggests))
          install.packages(packages, lib = Sys.getenv("R_LIBS"), type = "binary")
          stopifnot(all(vapply(packages, requireNamespace, logical(1), quietly = TRUE)))
          RS
      # GitHub's images ship Rust through rustup, which uninstalls itself on
      # Windows; the macOS image installs it with Homebrew, whose build of
      # rustup cannot, so there the step deletes rustup's toolchains and
      # Cargo's home and Homebrew removes rustup. Then the shell must find no
      # Rust tool on the runner's own PATH, which the steps that do not
      # replace it inherit. On Windows a helper process deletes rustup's
      # binaries after rustup exits, so the check allows it a minute. setup-r
      # says that its Windows runners may carry an Rtools. R for Windows looks
      # for Rtools in the directories that its PATH names, C:/rtools45 unless
      # RTOOLS45_HOME says otherwise. On Windows the image's own MinGW and
      # Git's also carry a compiler or the GNU runtime libraries that a DLL
      # built with Rtools could load from the PATH, so R runs the later steps
      # with a PATH that leaves out every directory holding one of them, which
      # this step writes and lists. The log shows that R finds no Rust tool
      # either, that no Rtools directory on R's PATH exists, and on Windows
      # that R finds no make or gcc.
      - name: Remove Rust and Rtools from the runner
        working-directory: ${{ runner.temp }}
        run: |
          if [ "${RUNNER_OS}" = macOS ]; then
            if command -v rustup; then rm -rf "$(rustup show home)"; fi
            if brew list --formula rustup > /dev/null 2>&1; then
              HOMEBREW_NO_AUTO_UPDATE=1 brew uninstall --force --ignore-dependencies rustup
            fi
            rm -rf "${CARGO_HOME:-${HOME}/.cargo}"
          elif command -v rustup; then
            rustup self uninstall -y
          fi
          # hash -r forgets where the shell last ran rustup.
          hash -r
          for attempt in {1..60}; do
            left=$(for tool in cargo rustc rustup; do command -v "${tool}" || true; done)
            if [ -z "${left}" ]; then break; fi
            sleep 1
          done
          if [ -n "${left}" ]; then printf 'Still on the PATH:\n%s\n' "${left}"; exit 1; fi
          echo "No cargo, rustc or rustup is left on the runner's PATH (check ${attempt} of 60)"
          tools=(cargo rustc rustup cargo.exe rustc.exe rustup.exe)
          if [ "${RUNNER_OS}" = Windows ]; then
            shopt -s nocaseglob nullglob
            for directory in /c/rtools*; do
              echo "Deleting ${directory}"
              rm -rf "${directory}"
            done
            remaining=(/c/rtools*)
            echo "Rtools directories left in C:/: ${#remaining[@]}"
            test "${#remaining[@]}" -eq 0
            env | grep -i '^rtools' || true
            tools+=(gcc.exe cc.exe make.exe libgcc_s_seh-1.dll libwinpthread-1.dll libstdc++-6.dll)
          fi
          kept=()
          IFS=: read -r -a entries <<< "${PATH}"
          for entry in "${entries[@]}"; do
            keep=yes
            for tool in "${tools[@]}"; do
              if [ -e "${entry}/${tool}" ]; then keep=no; fi
            done
            if [ "${keep}" = yes ]; then kept+=("${entry}"); else echo "Left off R's PATH: ${entry}"; fi
          done
          (IFS=:; printf '%s\n' "${kept[*]}") > toolchain-free-path
          export PATH="$(cat toolchain-free-path)"
          Rscript -e 'tools <- c("cargo", "rustc", "rustup", "make", "gcc")' \
            -e 'print(Sys.which(tools))' \
            -e 'absent <- if (.Platform$OS.type == "windows") tools else tools[1:3]' \
            -e 'stopifnot(!nzchar(Sys.which(absent)))' \
            -e 'path <- strsplit(Sys.getenv("PATH"), .Platform$path.sep, fixed = TRUE)[[1]]' \
            -e 'rtools <- path[grepl("rtools", path, ignore.case = TRUE)]' \
            -e 'print(data.frame(rtools = rtools, exists = dir.exists(rtools)))' \
            -e 'stopifnot(!any(dir.exists(rtools)))'
      # Loading the package proves that its shared object needs nothing that
      # the toolchain-free PATH leaves out. On macOS the dynamic loader reads
      # no PATH, so the log lists the libraries that it links, none of them
      # from Homebrew.
      - name: Install the R binary package without a network
        working-directory: ${{ runner.temp }}
        env:
          R_LIBS: ${{ runner.temp }}/r-binary-library
          http_proxy: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: ''
        run: |
          binaries=(r-binary/yamaa_*)
          test "${#binaries[@]}" -eq 1
          if [ "${RUNNER_OS}" = macOS ]; then linked=$(command -v otool); fi
          export PATH="$(cat toolchain-free-path)"
          Rscript -e 'install.packages(commandArgs(TRUE), repos = NULL, lib = Sys.getenv("R_LIBS"))' "${binaries[0]}"
          Rscript -e 'built <- packageDescription("yamaa", lib.loc = Sys.getenv("R_LIBS"))$Built' \
            -e 'writeLines(built)' \
            -e 'stopifnot(startsWith(built, paste0("R ", getRversion(), "; ", R.version$platform, ";")))' \
            -e 'library(yamaa)' \
            -e 'writeLines(paste("yamaa", packageVersion("yamaa"), "loaded from", find.package("yamaa")))'
          if [ "${RUNNER_OS}" = macOS ]; then
            "${linked}" -L "${R_LIBS}/yamaa/libs/yamaa.so"
            if "${linked}" -L "${R_LIBS}/yamaa/libs/yamaa.so" | grep -E '/opt/homebrew/|/usr/local/'; then exit 1; fi
          fi
      # The installed package runs the selftest cases that it carries and
      # prints the report to the log, as installation qualification evidence;
      # the job fails unless the selftest reports succeeded. R runs with the
      # toolchain-free PATH.
      - name: Run the installed package's selftest
        working-directory: ${{ runner.temp }}
        env:
          R_LIBS: ${{ runner.temp }}/r-binary-library
          http_proxy: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: ''
        run: |
          export PATH="$(cat toolchain-free-path)"
          Rscript --vanilla -e 'r <- yamaa::yamaa_selftest(); print(r); quit(status = r$status != "succeeded")'
      # The original benchmarks call the project programs package, plain R
      # that installs without a compiler. R runs with the toolchain-free PATH.
      - name: Report installed R public benchmark conformance
        working-directory: ${{ runner.temp }}
        env:
          R_LIBS: ${{ runner.temp }}/r-binary-library
          PUBLIC_CONFORMANCE_PACKAGE_FORM: binary
          http_proxy: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: ''
        run: |
          revision=$(git -C "${GITHUB_WORKSPACE}" rev-parse HEAD)
          python -I -m tools.conformance.public_conformance plan \
            --fixtures "${GITHUB_WORKSPACE}/benchmarks" --output public-conformance-plan
          (
            export PATH="$(cat toolchain-free-path)"
            R CMD INSTALL --library="${R_LIBS}" "${GITHUB_WORKSPACE}/rust/tests/project-programs/r"
            Rscript --vanilla "${GITHUB_WORKSPACE}/rust/tests/public_conformance.R" \
              public-conformance-plan "${GITHUB_WORKSPACE}/benchmarks" public-conformance/observed "${revision}"
          )
          python -I -m tools.conformance.public_conformance compare \
            --fixtures "${GITHUB_WORKSPACE}/benchmarks" --observed public-conformance/observed \
            --output public-conformance/inventory.json
      - name: Preserve R public benchmark inventory and saved artifacts
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: public-conformance-r-binary-${{ matrix.os }}-${{ matrix.r }}
          path: ${{ runner.temp }}/public-conformance
          if-no-files-found: error
      - name: Run installed R supplemental suites outside checkout
        working-directory: ${{ runner.temp }}
        env:
          http_proxy: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: ''
        run: |
          binaries=(r-binary/yamaa_*)
          python -m tools.commands.installed stage \
            --runtime r --staged-root "${RUNNER_TEMP}"
          YAMAA_PUBLIC_REPORT_DIR="${RUNNER_TEMP}/qualification/r-binary/public-reports" R_LIBS="${RUNNER_TEMP}/r-binary-library" python -I -m tools.commands.installed run \
            --output qualification/r-binary --runtime r --staged-root "${RUNNER_TEMP}" \
            --source-revision "$(git -C "${GITHUB_WORKSPACE}" rev-parse HEAD)" --package-form binary \
            --artifact-reference "github-actions:${GITHUB_RUN_ID}/attempt-${GITHUB_RUN_ATTEMPT}/native-r-binary-${{ matrix.os }}-${{ matrix.r }}/$(basename "${binaries[0]}")" \
            --evidence "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Preserve R binary qualification
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: native-r-binary-qualification-${{ matrix.os }}-${{ matrix.r }}
          path: ${{ runner.temp }}/qualification
          if-no-files-found: error

  cli:
    name: native-cli (${{ matrix.os }}, ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    # The command-line binaries that a release publishes (#3030 D12, D49): the
    # yamaa executable of rust/crates/yamaa-cli, built for each target on a
    # runner of its platform with the dist profile, release without the
    # symbol table, as the wheels are. The Linux binaries are static: they
    # link the musl C library that the Rust target bundles, and the runner's
    # musl-gcc compiles the bundled ReadStat and zstd C sources. The Windows
    # binary links the C runtime statically, and the macOS binary runs on
    # macOS 11 or later. Each is archived with the command line's notices.
    timeout-minutes: ${{ matrix.os == 'windows-2025' && 45 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    env:
      # The oldest macOS that the macOS binary runs on, the arm64 floor that
      # the wheels and the R binaries keep. rustc, and the C compiler that cc
      # runs, take the minimum macOS from it; the other targets ignore it.
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      # The binary embeds the selftest cases, and the archive check compares
      # the notices with the checkout, so their bytes stay exact.
      - name: Preserve fixture bytes and symlinks on Windows
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install repository tools
        run: |
          python -m pip install --no-deps -e .
          python -m tools.ci.toolchain
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust
          key: ${{ github.workflow }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Ubuntu's musl-tools gives the Linux targets their C compiler, musl-gcc.
      # The inventory check stages each host's engine bundle, which reads the
      # selftest list with PyYAML. The archive check runs the third-party
      # notices generator, hence --notices.
      - name: Install build tools
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python -m tools.ci.toolchain --install --notices
          rustup target add "${TARGET}"
          python -m pip install pyyaml==6.0.3
          if [ "${RUNNER_OS}" = Linux ]; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends musl-tools
            musl-gcc --version
          fi
      # cc compiles the C sources with the compiler and archiver that
      # CC_<target> and AR_<target> name, and on Windows with /MT once the
      # target's flags select the static C runtime. Because --target names
      # the target, those flags reach its crates but no build script or
      # procedural macro.
      - name: Build the command-line binary
        working-directory: rust
        env:
          TARGET: ${{ matrix.target }}
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
        run: |
          if [ "${RUNNER_OS}" = Linux ]; then
            export "CC_${TARGET//-/_}=musl-gcc" "AR_${TARGET//-/_}=ar"
          fi
          cargo build --locked --profile dist --package yamaa-cli --bin yamaa --target "${TARGET}"
      # A Linux binary is static when file says so and it names no program
      # interpreter and no shared library. macOS refuses a binary whose
      # minimum macOS is newer than the running system, and no lane runs an
      # older macOS, so the check reads the minimum that the binary declares,
      # the minos of its LC_BUILD_VERSION, which may not exceed the deployment
      # target, and requires every library that it loads to be the system's.
      # On Windows, dumpbin lists the DLLs that the binary loads, which may
      # not include the C runtime's.
      - name: Check the command-line binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          binary="rust/target/${TARGET}/dist/yamaa"
          if [ "${RUNNER_OS}" = Windows ]; then binary="${binary}.exe"; fi
          ls -l "${binary}"
          if [ "${RUNNER_OS}" = Linux ]; then
            file "${binary}"
            file --brief "${binary}" | grep -E 'static-pie linked|statically linked'
            if readelf --program-headers --wide "${binary}" | grep INTERP; then exit 1; fi
            if readelf --dynamic "${binary}" | grep NEEDED; then exit 1; fi
            ldd "${binary}" || true
          elif [ "${RUNNER_OS}" = macOS ]; then
            file "${binary}"
            otool -l "${binary}" | grep -A 4 LC_BUILD_VERSION
            minos=$(otool -l "${binary}" | awk '$1 == "minos" { print $2 }')
            echo "yamaa needs macOS ${minos} or later; the deployment target is ${MACOSX_DEPLOYMENT_TARGET}"
            python -c 'import sys; minos, target = (tuple(map(int, value.split("."))) for value in sys.argv[1:]); sys.exit(minos > target)' \
              "${minos}" "${MACOSX_DEPLOYMENT_TARGET}"
            otool -L "${binary}"
            if otool -L "${binary}" | tail -n +2 | grep -v -E '^[[:space:]]+(/usr/lib/|/System/Library/)'; then exit 1; fi
          else
            vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
            mapfile -t found < <("${vswhere}" -latest -products '*' -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | tr -d '\r')
            test "${#found[@]}" -gt 0
            dependents=$("$(cygpath -u "${found[-1]}")" -nologo -dependents "${binary}")
            printf '%s\n' "${dependents}"
            if grep -i -E 'vcruntime|msvcp|ucrtbase|api-ms-win-crt' <<< "${dependents}"; then exit 1; fi
          fi
      - name: Archive the command-line binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          binary="rust/target/${TARGET}/dist/yamaa"
          if [ "${RUNNER_OS}" = Windows ]; then binary="${binary}.exe"; fi
          python -m tools.packaging.cli_archive write "${TARGET}" "${binary}" "${RUNNER_TEMP}/cli"
      # The notice check compares the archive with the committed notices and
      # component inventories, so the generators first prove those copies
      # current.
      - name: Check the command-line archive
        run: |
          python -m tools.packaging.generate_third_party_notices
          python -m tools.packaging.generate_component_inventory
          python -m tools.packaging.cli_archive check "${RUNNER_TEMP}"/cli/*.zip
          python -m tools.packaging.check_package_notices "${RUNNER_TEMP}"/cli/*.zip
      - name: Preserve the command-line archive
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: native-cli-${{ matrix.target }}
          path: ${{ runner.temp }}/cli
          if-no-files-found: error

  cli-install:
    name: native-cli-install (${{ matrix.os }}, ${{ matrix.target }})
    needs: cli
    # Each archive that built is unpacked and run even when another target's
    # build failed; a target whose build failed has no archive to download.
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    # Each command-line archive, unpacked as a user unpacks it and run with
    # the network disabled, on a fresh runner of its platform. While the
    # network is up, the job downloads the archive, and a checkout and
    # Python, but no Rust, give the repository's tools, which write the
    # conformance corpus as 1.0 and plan it (#3060). Then the job unpacks the
    # archive, the binary prints its version and runs its selftest, and the
    # command line's runner runs the corpus through the binary: on Linux in
    # containers without a network and with a read-only root, from the pinned
    # manylinux_2_28 image of the runner's architecture (tools/ci/manylinux.py),
    # whose CPython runs the runner; on macOS and Windows behind a proxy that
    # refuses every connection. The cohort comparison reads the corpus's
    # records and saved files.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - name: Download the command-line archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-cli-${{ matrix.target }}
          path: ${{ runner.temp }}/offline/cli
      # The corpus's bytes and its one symbolic link stay exact on Windows,
      # as in every lane that runs it.
      - name: Preserve fixture bytes and symlinks on Windows
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install repository tools
        run: |
          python -m pip install --no-deps -e .
          python -m pip install py-yaml12==0.2.0 pyyaml==6.0.3 pyarrow==25.0.1
      # While the network is up. The binary reads only 1.x files (#3030 D122,
      # D125), as the corpus is written: the step copies every benchmark, and
      # the plan gives the command line its calls. On Linux the image of the
      # containers below is pulled now.
      - name: Prepare the command-line conformance corpus
        working-directory: ${{ runner.temp }}/offline
        run: |
          python -I -m tools.commands.cli_conformance --prepare-only --output public-conformance-cli
          if [ "${RUNNER_OS}" = Linux ]; then
            image=$(python -I -c 'import platform; from tools.ci.manylinux import IMAGES; print(IMAGES[platform.machine()])')
            {
              echo "OFFLINE_IMAGE=${image}"
              echo "OFFLINE_PYTHON=$(python -I -c 'from tools.ci.manylinux import PYTHON; print(PYTHON)')"
            } >> "${GITHUB_ENV}"
            docker pull "${image}"
          fi
      # From here the archive is unpacked and run with the network disabled:
      # on Linux in containers, as the runner's user, so that the files that
      # they write stay the runner's; on macOS and Windows behind the refusing
      # proxy. Environment names are case-insensitive on Windows; libcurl
      # reads only the lowercase http_proxy. unzip, the image's on Linux,
      # restores the executable's mode; on Windows PowerShell's Expand-Archive
      # unpacks the archive.
      - name: Unpack the command-line archive without a network
        working-directory: ${{ runner.temp }}/offline
        env:
          http_proxy: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: ''
        run: |
          archives=(cli/yamaa-*.zip)
          test "${#archives[@]}" -eq 1
          if [ "${RUNNER_OS}" = Linux ]; then
            docker run --rm --network none --read-only --tmpfs /tmp:rw,exec --user "$(id -u):$(id -g)" \
              --volume "${PWD}:/work" --workdir /work "${OFFLINE_IMAGE}" unzip "${archives[0]}" -d unpacked
          elif [ "${RUNNER_OS}" = Windows ]; then
            pwsh -NoProfile -Command "Expand-Archive -LiteralPath '${archives[0]}' -DestinationPath unpacked"
          else
            unzip "${archives[0]}" -d unpacked
          fi
          ls -lR unpacked
      # The binary prints its version, whose first line must name the
      # archive's version, and runs its selftest, which must succeed; the log
      # keeps both reports. On Linux the container mounts the unpacked archive
      # alone, read-only.
      - name: Run the command-line selftest
        working-directory: ${{ runner.temp }}/offline
        env:
          TARGET: ${{ matrix.target }}
          http_proxy: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: ''
        run: |
          archives=(cli/yamaa-*.zip)
          name=$(basename "${archives[0]}" .zip)
          version=${name#yamaa-}
          version=${version%"-${TARGET}"}
          binary="unpacked/${name}/yamaa"
          if [ "${RUNNER_OS}" = Windows ]; then binary="${binary}.exe"; fi
          yamaa=("${binary}")
          if [ "${RUNNER_OS}" = Linux ]; then
            yamaa=(docker run --rm --network none --read-only --tmpfs /tmp:rw,exec --user "$(id -u):$(id -g)" \
              --volume "${PWD}/unpacked:/work/unpacked:ro" --workdir /work "${OFFLINE_IMAGE}" "/work/${binary}")
          fi
          "${yamaa[@]}" --version | tee cli-version.txt
          first=$(head -n 1 cli-version.txt)
          if [ "${first}" != "yamaa ${version}" ]; then
            echo "yamaa --version prints '${first}', but the archive names ${version}"
            exit 1
          fi
          "${yamaa[@]}" selftest
      # The command line's runner makes each call that the plan gives the
      # command line through the unpacked binary, and the comparator judges
      # the records against the expected files: the step fails on any
      # difference. On Linux the runner, which needs Python's standard
      # library alone, runs with the image's CPython, and the runner's user
      # then compares and uploads the files that the binary saves: the engine
      # publishes each file readable by its owner alone.
      - name: Report command-line public benchmark conformance
        id: cli_conformance
        working-directory: ${{ runner.temp }}/offline
        env:
          http_proxy: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: ''
        run: |
          archives=(cli/yamaa-*.zip)
          binary="unpacked/$(basename "${archives[0]}" .zip)/yamaa"
          if [ "${RUNNER_OS}" = Windows ]; then binary="${binary}.exe"; fi
          revision=$(git -C "${GITHUB_WORKSPACE}" rev-parse HEAD)
          evidence="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          corpus=(--plan public-conformance-cli/plan --fixtures public-conformance-cli/benchmarks
            --binary "${binary}" --output public-conformance-cli/observed
            --source-revision "${revision}" --evidence "${evidence}")
          if [ "${RUNNER_OS}" = Linux ]; then
            docker run --rm --network none --read-only --tmpfs /tmp:rw,exec --user "$(id -u):$(id -g)" \
              --volume "${PWD}:/work" --volume "${GITHUB_WORKSPACE}:/checkout:ro" --workdir /work \
              "${OFFLINE_IMAGE}" "${OFFLINE_PYTHON}" -I /checkout/rust/tests/public_conformance_cli.py "${corpus[@]}"
          else
            python -I "${GITHUB_WORKSPACE}/rust/tests/public_conformance_cli.py" "${corpus[@]}"
          fi
          python -I -m tools.conformance.public_conformance compare \
            --fixtures public-conformance-cli/benchmarks --observed public-conformance-cli/observed \
            --output public-conformance-cli/inventory.json
      - name: Preserve command-line public benchmark inventory and saved artifacts
        if: ${{ always() && (steps.cli_conformance.outcome == 'success' || steps.cli_conformance.outcome == 'failure') }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: public-conformance-cli-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/offline/public-conformance-cli/inventory.json
            ${{ runner.temp }}/offline/public-conformance-cli/observed
          if-no-files-found: error

  share:
    name: native-share (${{ matrix.os }}, ${{ matrix.route }})
    needs: dist
    runs-on: ${{ matrix.os }}
    # Windows network shares (#3030 D15): the conformance corpus with every
    # specification, project, input and output on an SMB share. The runner
    # shares a directory of its own, and the wheel that a release publishes
    # for it, installed with the build Python, runs the corpus on that share
    # by the lane's route: its UNC path, \\localhost\yamaa-share, or a drive
    # mapped to it. The conformance runner stages each case in the shared
    # directory, as every lane stages it, and names it in every call through
    # the route's spelling alone, which the engine resolves itself. The
    # corpus's symbolic link reaches the engine as the file server reports
    # it, a reparse point, and stays refused (FILE-8).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025]
        route: [unc-path, mapped-drive]
    steps:
      - name: Preserve fixture bytes and symlinks on Windows
        run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.13.0'
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.NATIVE_BUILD_PYTHON }}
      - name: Install repository tools
        run: |
          python -m pip install --no-deps -e .
          python -m pip install py-yaml12==0.2.0 pyyaml==6.0.3
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-python-${{ matrix.os }}-${{ env.NATIVE_BUILD_PYTHON }}
          path: ${{ runner.temp }}/native-dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-project-${{ matrix.os }}-${{ env.NATIVE_BUILD_PYTHON }}
          path: ${{ runner.temp }}/project-dist
      - name: Record source revision and table requirements
        run: |
          echo "QUALIFICATION_SOURCE_REVISION=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"
          uv export --project python --locked --extra test --no-dev --no-emit-project --no-hashes --output-file "${RUNNER_TEMP}/table-requirements.txt"
      - name: Install the wheel
        working-directory: ${{ runner.temp }}
        run: python -m pip install --no-deps -r table-requirements.txt native-dist/*.whl project-dist/*.whl
      # The share's permissions name the runner's own account, which owns the
      # directory. Creating a share needs an administrator, as the runner is.
      - name: Share a directory over SMB
        shell: pwsh
        run: |
          $directory = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'share')
          $account = [System.Security.Principal.WindowsIdentity]::GetCurrent().Name
          New-SmbShare -Name yamaa-share -Path $directory.FullName -FullAccess $account |
            Format-List Name, Path, ShareState
          if (-not (Test-Path -LiteralPath '\\localhost\yamaa-share' -PathType Container)) {
            throw '\\localhost\yamaa-share is not reachable'
          }
      # A drive mapping belongs to the logon session that made it, so the step
      # that runs the corpus maps the drive itself. PowerShell stops on a
      # failed cmdlet but not on a failed program, so the step checks the exit
      # status of each program it runs. The runner stages and records the
      # cases in share\observed, inside the shared directory, and names them
      # in every call through the route's spelling of that directory; the
      # comparator then reads them there.
      - name: Report installed Python public benchmark conformance on the share
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          ROUTE: ${{ matrix.route }}
        run: |
          if ($env:ROUTE -eq 'unc-path') {
            $root = '\\localhost\yamaa-share\'
          } elseif ($env:ROUTE -eq 'mapped-drive') {
            net use Y: '\\localhost\yamaa-share' /persistent:no
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $drive = [System.IO.DriveInfo]::new('Y')
            if ($drive.DriveType -ne [System.IO.DriveType]::Network) {
              throw "Y: is a $($drive.DriveType) drive, not a network drive"
            }
            $root = 'Y:\'
          } else {
            throw "no share route $env:ROUTE"
          }
          $benchmarks = Join-Path $env:GITHUB_WORKSPACE 'benchmarks'
          python -I -m tools.conformance.public_conformance plan --fixtures $benchmarks --output public-conformance-plan
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $corpus = @(
            '--plan', 'public-conformance-plan', '--fixtures', $benchmarks,
            '--python-lock', (Join-Path $env:GITHUB_WORKSPACE 'python\uv.lock'),
            '--output', 'share\observed', '--output-as', "${root}observed",
            '--source-revision', $env:QUALIFICATION_SOURCE_REVISION, '--package-form', 'wheel',
            '--evidence', "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          )
          python -I (Join-Path $env:GITHUB_WORKSPACE 'python\tests\installed\public_conformance.py') @corpus
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -I -m tools.conformance.public_conformance compare --fixtures $benchmarks --observed 'share\observed' --output 'public-conformance\inventory.json'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Preserve Python public benchmark inventory and saved artifacts
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: public-conformance-python-share-${{ matrix.os }}-${{ matrix.route }}
          path: |
            ${{ runner.temp }}/public-conformance
            ${{ runner.temp }}/share/observed
          if-no-files-found: error

  public-cohort:
    name: public-cohort-complete-runs
    needs: [qualify, r, r-binary-install, cli-install]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Preserve fixture bytes and symlinks on Windows
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.13.0'
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install repository tools
        run: |
          python -m pip install --no-deps -e .
          python -m tools.ci.toolchain
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-qualification-*
          path: ${{ runner.temp }}/cohort-input
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1

        with:
          pattern: native-r-qualification-*
          path: ${{ runner.temp }}/cohort-input
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-r-binary-qualification-*
          path: ${{ runner.temp }}/cohort-input
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: public-conformance-cli-*
          path: ${{ runner.temp }}/cohort-input
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-reference-ubuntu-24.04-${{ env.NATIVE_BUILD_PYTHON }}
          path: ${{ runner.temp }}/cohort-reference
      - name: Install the qualified package for comparison only
        # The comparison reads the reports with the locked readers of the test
        # extra (PyYAML, py-yaml12, PyArrow, pydantic), as the qualify lanes do.
        run: |
          uv export --project python --locked --extra test --no-dev --no-emit-project --no-hashes --output-file "${RUNNER_TEMP}/cohort-requirements.txt"
          python -m pip install --no-deps -r "${RUNNER_TEMP}/cohort-requirements.txt" "${RUNNER_TEMP}"/cohort-reference/*.whl
      - name: Compare complete installed host reports
        working-directory: ${{ runner.temp }}
        run: python -I -m tools.ci.native
      - name: Preserve complete public cohort inventory
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: native-public-cohort
          path: ${{ runner.temp }}/public-cohort
          if-no-files-found: error
