name: Native qualification

# Release qualification, not a development check: dispatch it on main for a
# release candidate, or push a qualification/issue-* branch. It also runs
# weekly on main, so the README's Release checks badge, which shows the latest
# main run, stays current; a scheduled main run can qualify a release as a
# dispatched one can.
on:
  workflow_dispatch:
  push:
    branches: ['qualification/issue-*']
  schedule:
    - cron: '17 4 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel stale branch qualification feedback; active main runs finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # One abi3 wheel per OS is installed on every approved interpreter.
  NATIVE_BUILD_PYTHON: '3.14'

jobs:
  rust:
    name: native-rust (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # Cold optimized test builds on Windows can consume more than 20 minutes.
    # Leave time for the complete shared guard and assessment suites afterward.
    timeout-minutes: ${{ matrix.os == 'windows-2025' && 60 || matrix.os == 'macos-15' && 45 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        python: ['3.14']
    steps:
      - name: Preserve fixture bytes and symlinks on Windows
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.13.0'
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install repository tools
        run: |
          python -m pip install --no-deps -e .
          python -m tools.ci.toolchain
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # Without `workspaces` the action looks for Cargo.toml at the root,
          # fails, and saves an empty cache under a key that never refreshes.
          workspaces: rust
          key: ${{ github.workflow }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install build tools
        run: |
          python -m pip install pyyaml==6.0.3
          python -m tools.ci.toolchain --install
      # CI runs the development-profile workspace tests and Clippy on Linux, for
      # every pull request and on main's schedule; this lane runs the workspace
      # tests with the optimized release-test profile alone, on each platform.
      # Like `make test-rust`, they leave out the two host bindings, which have
      # no Rust tests, so this job needs no R and no R import library.
      - name: Test shared workspace
        id: shared_crates
        run: |
          (
            set -e
            python -m tools.packaging.check_benchmark_sdk_versions
            python -m tools.packaging.check_shared_release_versions
            cargo fmt --manifest-path rust/Cargo.toml --all --check
            python -m tools.packaging.check_cargo_lock --output-dir "${RUNNER_TEMP}/rust-dependencies"
            (cd rust && cargo test --locked --workspace --exclude yamaa-python --exclude yamaa-r --profile release-test)
            python -m tools.packaging.generate_schema_printable
            python -m tools.packaging.generate_shipped_schema
            python -m tools.packaging.generate_bindings
            python -m tools.numeric.check_float_text
            python -m tools.numeric.check_sqrt
            python -m tools.numeric.assess_math --output "${RUNNER_TEMP}/math-assessment.json"
            python -m tools.validation.check_diagnostics
          ) 2>&1 | tee "${RUNNER_TEMP}/shared-crates-check.log"
      - name: Preserve locked Rust dependency evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: rust-dependencies-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/rust-dependencies
          if-no-files-found: error
      - name: Preserve shared crate diagnostics before independent assessments
        if: ${{ always() && (steps.shared_crates.outcome == 'success' || steps.shared_crates.outcome == 'failure') }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: shared-crates-check-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/shared-crates-check.log
          if-no-files-found: error
      - name: Preserve Python 3.12 numerical assessment coverage
        # The native build matrix uses 3.14, but portable-math-exact still
        # requires independent observations from every supported interpreter.
        # Reuse the Rust probe; this stdlib-only assessment needs no wheel build.
        run: uv run --no-project --python 3.12 python -m tools.numeric.assess_math --output "${RUNNER_TEMP}/math-assessment-3.12/math-assessment.json"
      - name: Preserve Python 3.13 numerical assessment coverage
        run: uv run --no-project --python 3.13 python -m tools.numeric.assess_math --output "${RUNNER_TEMP}/math-assessment-3.13/math-assessment.json"
      - name: Preserve Python 3.15 numerical assessment coverage
        run: uv run --no-project --python 3.15 python -m tools.numeric.assess_math --output "${RUNNER_TEMP}/math-assessment-3.15/math-assessment.json"
      - name: Preserve candidate math assessment (not parity qualification)
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: math-assessment-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/math-assessment.json
          if-no-files-found: error
      - name: Preserve Python 3.12 candidate math assessment
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: math-assessment-${{ matrix.os }}-3.12
          path: ${{ runner.temp }}/math-assessment-3.12/math-assessment.json
          if-no-files-found: error
      - name: Preserve Python 3.13 candidate math assessment
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: math-assessment-${{ matrix.os }}-3.13
          path: ${{ runner.temp }}/math-assessment-3.13/math-assessment.json
          if-no-files-found: error
      - name: Preserve Python 3.15 candidate math assessment
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: math-assessment-${{ matrix.os }}-3.15
          path: ${{ runner.temp }}/math-assessment-3.15/math-assessment.json
          if-no-files-found: error
  dist:
    name: native-dist (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # A Linux wheel builds from scratch in its manylinux container.
    timeout-minutes: ${{ startsWith(matrix.os, 'ubuntu-') && 40 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025, ubuntu-24.04-arm]
        python: ['3.14']
    steps:
      # The source archive check compares the bundled crate sources with the
      # checkout byte for byte, so keep their bytes exact.
      - name: Preserve fixture bytes and symlinks on Windows
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.13.0'
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install repository tools
        run: |
          python -m pip install --no-deps -e .
          python -m tools.ci.toolchain
      # The Linux wheels build in a container, which this cache cannot reach.
      - name: Cache Rust build artifacts
        if: runner.os != 'Linux'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust
          key: ${{ github.workflow }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check benchmark SDK lock versions
        run: python -m tools.packaging.check_benchmark_sdk_versions
      # Staging the engine bundle, for the source archive and for the checks
      # that compare it and the component inventories with the bundle, reads
      # the selftest list, benchmarks/selftest.yaml, with PyYAML. The notices
      # check runs the third-party notices generator, hence --notices.
      - name: Install build tools
        run: |
          python -m tools.ci.toolchain --install --notices
          python -m pip install maturin==1.9.6 hatchling==1.27.0 pyyaml==6.0.3
      - name: Generate Python caches before packaging
        run: |
          python -m compileall -q -f -o 0 -o 1 python/src/yamaa
          python -m compileall -q -f -b python/src/yamaa
          python - <<'PYTHON'
          from pathlib import Path
          source = Path("python/src/yamaa")
          (source / "__pycache__" / "package-check.txt").write_text("generated cache\n", encoding="utf-8")
          (source / "package-check.pyo").write_bytes(b"generated legacy bytecode\n")
          PYTHON
      # A Linux wheel builds in the manylinux_2_28 container of the runner's
      # architecture, so it runs on glibc 2.28 and later (tools/ci/manylinux.py).
      # Every wheel builds with the dist profile that python/pyproject.toml
      # names, release without the symbol table.
      # The source archive is maturin's output over the Python engine bundle,
      # with its vendored crates (tools/staging/engine_bundle.py).
      - name: Build wheel and source archive
        run: |
          (
            cd python
            if [ "${RUNNER_OS}" = Linux ]; then
              python -m tools.ci.manylinux --out "${RUNNER_TEMP}/native-dist"
            else
              maturin build --profile dist --locked --out "${RUNNER_TEMP}/native-dist"
            fi
          )
          python -m tools.staging.engine_bundle sdist "${RUNNER_TEMP}/native-dist"
          python -m pip wheel --no-deps --no-build-isolation rust/tests/project-programs/python --wheel-dir "${RUNNER_TEMP}/project-dist"
          mkdir -p "${RUNNER_TEMP}/reference-dist"
          cp "${RUNNER_TEMP}"/native-dist/*.whl "${RUNNER_TEMP}/reference-dist/"
      # The package notice checks compare each archive with the committed
      # notices and component inventories, so the generators first prove those
      # copies current.
      - name: Check Python distribution contents
        run: |
          python -m tools.packaging.check_python_package_hygiene "${RUNNER_TEMP}/native-dist"
          python -m tools.packaging.check_cargo_lock --output-dir "${RUNNER_TEMP}/rust-dependencies" "${RUNNER_TEMP}"/native-dist/*.tar.gz
          python -m tools.packaging.generate_third_party_notices
          python -m tools.packaging.generate_component_inventory
          python -m tools.packaging.check_package_notices "${RUNNER_TEMP}"/native-dist/*.whl "${RUNNER_TEMP}"/native-dist/*.tar.gz
      - name: Preserve the reference host wheel
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: native-reference-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/reference-dist
          if-no-files-found: error
      - name: Preserve installed project program
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: native-project-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/project-dist
          if-no-files-found: error
      - name: Preserve locked Rust dependency evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: rust-dependencies-dist-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/rust-dependencies
          if-no-files-found: error
      # A release artifact holds exactly the assets that
      # tools/ci/release_assets.py declares in it. A release publishes the
      # source archive built on Linux, which every source lane installs; the
      # other hosts build theirs only to check it.
      - name: Keep only the release assets of this host
        if: matrix.os != 'ubuntu-24.04'
        run: rm "${RUNNER_TEMP}"/native-dist/*.tar.gz
      - name: Preserve distributions
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: native-python-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/native-dist
          if-no-files-found: error

  qualify:
    name: native-qualify (${{ matrix.os }}, ${{ matrix.python }}, ${{ matrix.form }})
    needs: dist
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025, ubuntu-24.04-arm]
        python: ['3.12', '3.13', '3.14', '3.15']
        form: [wheel, source]
    env:
      # A wheel lane installs its own host's wheel. Every source lane installs
      # the Linux-built source archive, the one a release publishes.
      ARCHIVE_HOST: ${{ matrix.form == 'source' && 'ubuntu-24.04' || matrix.os }}
    steps:
      - name: Preserve fixture bytes and symlinks on Windows
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.13.0'
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install repository tools
        run: |
          python -m pip install --no-deps -e .
          python -m tools.ci.toolchain
      - name: Install build tools
        run: |
          python -m pip install py-yaml12==0.2.0 pyyaml==6.0.3
          if [ "${{ matrix.form }}" = source ]; then
            python -m tools.ci.toolchain --install
          fi
      # Qualify the uploaded bytes, so the artifact names recorded in each
      # report identify exactly what was installed.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-python-${{ env.ARCHIVE_HOST }}-${{ env.NATIVE_BUILD_PYTHON }}
          path: ${{ runner.temp }}/native-dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-reference-${{ matrix.os }}-${{ env.NATIVE_BUILD_PYTHON }}
          path: ${{ runner.temp }}/reference-dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-project-${{ matrix.os }}-${{ env.NATIVE_BUILD_PYTHON }}
          path: ${{ runner.temp }}/project-dist
      - name: Record source revision and table requirements
        run: |
          echo "QUALIFICATION_SOURCE_REVISION=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"
          uv export --project python --locked --extra test --no-dev --no-emit-project --no-hashes --output-file "${RUNNER_TEMP}/table-requirements.txt"
      - name: Stage installed checks outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -m tools.commands.installed stage \
            --runtime python --staged-root "${RUNNER_TEMP}"
      - name: Install the wheel
        if: matrix.form == 'wheel'
        working-directory: ${{ runner.temp }}
        run: python -m pip install --no-deps -r table-requirements.txt native-dist/*.whl project-dist/*.whl
      - name: Rebuild and install from the source archive
        if: matrix.form == 'source'
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip install --no-deps -r table-requirements.txt
          python -m pip install --no-cache-dir --no-deps native-dist/*.tar.gz project-dist/*.whl
      - name: Install the minimum supported Python saved artifact readers
        working-directory: ${{ runner.temp }}
        # CPython 3.15 has its own floors in python/pyproject.toml, the oldest
        # releases that work there.
        run: |
          if [ "${{ matrix.python }}" = 3.15 ]; then
            python -m pip install polars==2.0.0 pyarrow==26.0.0 lxml==6.1.3
          else
            python -m pip install polars==1.35.2 pyarrow==23.0.1 lxml==6.1.3
          fi
      - name: Report installed Python public benchmark conformance
        working-directory: ${{ runner.temp }}
        run: |
          python -I -m tools.conformance.public_conformance plan \
            --fixtures "${GITHUB_WORKSPACE}/benchmarks" --output public-conformance-plan
          python -I "${GITHUB_WORKSPACE}/python/tests/installed/public_conformance.py" \
            --plan public-conformance-plan --fixtures "${GITHUB_WORKSPACE}/benchmarks" \
            --python-lock "${GITHUB_WORKSPACE}/python/uv.lock" \
            --output public-conformance/observed --source-revision "${QUALIFICATION_SOURCE_REVISION}" \
            --package-form "${{ matrix.form }}" \
            --evidence "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          python -I -m tools.conformance.public_conformance compare \
            --fixtures "${GITHUB_WORKSPACE}/benchmarks" --observed public-conformance/observed \
            --output public-conformance/inventory.json
      - name: Preserve Python public benchmark inventory and saved artifacts
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: public-conformance-python-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.form }}
          path: ${{ runner.temp }}/public-conformance
          if-no-files-found: error
      - name: Qualify the installed package outside checkout
        working-directory: ${{ runner.temp }}
        env:
          FORM: ${{ matrix.form }}
          ARCHIVE: ${{ matrix.form == 'wheel' && '*.whl' || '*.tar.gz' }}
        run: |
          archives=(native-dist/${ARCHIVE})
          YAMAA_PUBLIC_REPORT_DIR="${RUNNER_TEMP}/qualification/${FORM}/public-reports" python -I -m tools.commands.installed run \
            --output "qualification/${FORM}/supplemental" --runtime python --staged-root "${RUNNER_TEMP}" \
            --source-revision "${QUALIFICATION_SOURCE_REVISION}" --package-form "${FORM}" \
            --artifact-reference "github-actions:${GITHUB_RUN_ID}/attempt-${GITHUB_RUN_ATTEMPT}/native-python-${{ env.ARCHIVE_HOST }}-${{ env.NATIVE_BUILD_PYTHON }}/$(basename "${archives[0]}")" \
            --host-artifact-reference "github-actions:${GITHUB_RUN_ID}/attempt-${GITHUB_RUN_ATTEMPT}/native-reference-${{ matrix.os }}-${{ env.NATIVE_BUILD_PYTHON }}/$(basename reference-dist/*.whl)" \
            --evidence "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Preserve native qualification reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: native-qualification-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.form }}
          path: ${{ runner.temp }}/qualification
          if-no-files-found: error

  glibc:
    name: native-glibc (${{ matrix.os }})
    needs: dist
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # The oldest glibc that a manylinux_2_28 wheel admits, as RHEL 8 ships it,
    # with that system's own Python 3.12. The tag pins the image; the runner's
    # architecture selects its x86_64 or aarch64 build.
    container: almalinux:8.10-20261002
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - name: Install the system Python and the checkout tools
        run: |
          dnf install -y --setopt=install_weak_deps=False python3.12 python3.12-pip git-core tar gzip
          python3.12 -m venv /opt/qualification-python
          echo /opt/qualification-python/bin >> "${GITHUB_PATH}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.13.0'
          enable-cache: false
      - name: Install repository tools
        run: |
          # The steps run as root; the checkout belongs to the runner's user.
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          python -m pip install --no-deps -e .
          python -m pip install py-yaml12==0.2.0 pyyaml==6.0.3
      # Qualify the uploaded bytes of this architecture's Linux wheel.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-python-${{ matrix.os }}-${{ env.NATIVE_BUILD_PYTHON }}
          path: ${{ runner.temp }}/native-dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-reference-${{ matrix.os }}-${{ env.NATIVE_BUILD_PYTHON }}
          path: ${{ runner.temp }}/reference-dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-project-${{ matrix.os }}-${{ env.NATIVE_BUILD_PYTHON }}
          path: ${{ runner.temp }}/project-dist
      - name: Record source revision and table requirements
        run: |
          echo "QUALIFICATION_SOURCE_REVISION=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"
          uv export --project python --locked --extra test --no-dev --no-emit-project --no-hashes --output-file "${RUNNER_TEMP}/table-requirements.txt"
      - name: Stage installed checks outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -m tools.commands.installed stage \
            --runtime python --staged-root "${RUNNER_TEMP}"
      - name: Install the wheel
        working-directory: ${{ runner.temp }}
        run: |
          ldd --version | sed -n 1p
          python -m pip install --no-deps -r table-requirements.txt native-dist/*.whl project-dist/*.whl
      - name: Install the minimum supported Python saved artifact readers
        working-directory: ${{ runner.temp }}
        run: python -m pip install polars==1.35.2 pyarrow==23.0.1 lxml==6.1.3
      - name: Report installed Python public benchmark conformance
        working-directory: ${{ runner.temp }}
        run: |
          python -I -m tools.conformance.public_conformance plan \
            --fixtures "${GITHUB_WORKSPACE}/benchmarks" --output public-conformance-plan
          python -I "${GITHUB_WORKSPACE}/python/tests/installed/public_conformance.py" \
            --plan public-conformance-plan --fixtures "${GITHUB_WORKSPACE}/benchmarks" \
            --python-lock "${GITHUB_WORKSPACE}/python/uv.lock" \
            --output public-conformance/observed --source-revision "${QUALIFICATION_SOURCE_REVISION}" \
            --package-form wheel \
            --evidence "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          python -I -m tools.conformance.public_conformance compare \
            --fixtures "${GITHUB_WORKSPACE}/benchmarks" --observed public-conformance/observed \
            --output public-conformance/inventory.json
      - name: Preserve Python public benchmark inventory and saved artifacts
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: public-conformance-python-glibc-${{ matrix.os }}
          path: ${{ runner.temp }}/public-conformance
          if-no-files-found: error
      - name: Qualify the installed package outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          archives=(native-dist/*.whl)
          YAMAA_PUBLIC_REPORT_DIR="${RUNNER_TEMP}/qualification/wheel/public-reports" python -I -m tools.commands.installed run \
            --output qualification/wheel/supplemental --runtime python --staged-root "${RUNNER_TEMP}" \
            --source-revision "${QUALIFICATION_SOURCE_REVISION}" --package-form wheel \
            --artifact-reference "github-actions:${GITHUB_RUN_ID}/attempt-${GITHUB_RUN_ATTEMPT}/native-python-${{ matrix.os }}-${{ env.NATIVE_BUILD_PYTHON }}/$(basename "${archives[0]}")" \
            --host-artifact-reference "github-actions:${GITHUB_RUN_ID}/attempt-${GITHUB_RUN_ATTEMPT}/native-reference-${{ matrix.os }}-${{ env.NATIVE_BUILD_PYTHON }}/$(basename reference-dist/*.whl)" \
            --evidence "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Preserve native qualification reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: native-glibc-qualification-${{ matrix.os }}
          path: ${{ runner.temp }}/qualification
          if-no-files-found: error

  math-portability:
    name: portable-math-exact
    needs: rust

    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.13.0'
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install repository tools
        run: |
          python -m pip install --no-deps -e .
          python -m tools.ci.toolchain
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: math-assessment-*
          path: math-assessments
      - name: Compare every candidate bit across the native matrix
        run: python -m tools.numeric.check_math_portability math-assessments

  r-dist:
    name: native-r-dist (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        # A release publishes the R source archive built here, and every
        # native-r lane installs these same bytes.
        os: [ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install repository tools
        run: |
          python -m pip install --no-deps -e .
          python -m tools.ci.toolchain
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true
      - name: Install Rust
        run: python -m tools.ci.toolchain --install
      - name: Install the shared grammar and benchmark metadata codecs
        run: python -m pip install py-yaml12==0.2.0 pyyaml==6.0.3
      - name: Stage standalone R package
        run: python -m tools.staging.stage_r_package "${RUNNER_TEMP}/native-stage/yamaa"
      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          working-directory: R/yamaa
      - name: Build R source package
        working-directory: ${{ runner.temp }}
        run: |
          R CMD build --no-manual native-stage/yamaa
          python -m tools.packaging.check_cargo_lock yamaa_0.6.2.tar.gz
      - name: Preserve source archive
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: native-r-${{ matrix.os }}
          path: ${{ runner.temp }}/yamaa_0.6.2.tar.gz
          if-no-files-found: error

  conformance:
    name: native-conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        # The conformance archive that a release publishes (#3690): the
        # closed grammars and the evaluation set of the expression language,
        # as committed, with the project license. Its files are the same for
        # every platform, so the source platform builds it once.
        os: [ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install repository tools
        run: python -m pip install --no-deps -e .
      # The writer checks what it wrote: exactly the committed files, each
      # with the checkout's bytes and Unix mode 0644.
      - name: Build the conformance archive
        run: python -m tools.packaging.conformance_archive write "${RUNNER_TEMP}/conformance"
      - name: Preserve the conformance archive
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: native-conformance-${{ matrix.os }}
          path: ${{ runner.temp }}/conformance
          if-no-files-found: error

  r:

    name: native-r (${{ matrix.os }})
    needs: r-dist
    runs-on: ${{ matrix.os }}
    # The package installs twice, once on its own and once inside R CMD
    # check, and each build runs at most two Cargo jobs, as CRAN requires.
    timeout-minutes: ${{ matrix.os == 'windows-2025' && 75 || 40 }}
    strategy:
      fail-fast: false
      matrix:
        # Every platform that a wheel is built for, so that each Python lane's
        # reports are compared beside R reports of its own platform (D240 on
        # #3673). Linux aarch64 stays at R-release alone, with no native-cran
        # lane (#3030 D198).
        os: [ubuntu-24.04, macos-15, windows-2025, ubuntu-24.04-arm]
    steps:
      - name: Preserve fixture bytes and symlinks on Windows
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.13.0'
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install repository tools
        run: |
          python -m pip install --no-deps -e .
          python -m tools.ci.toolchain
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust
          key: ${{ github.workflow }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: '4.6.1'
          rtools-version: ${{ runner.os == 'Windows' && '45' || '' }}
          use-public-rspm: true
      - name: Check benchmark SDK lock versions
        run: python -m tools.packaging.check_benchmark_sdk_versions
      - name: Install Rust
        run: |
          python -m tools.ci.toolchain --install
          if [ "${{ runner.os }}" = Windows ]; then
            rustup target add x86_64-pc-windows-gnu
          fi
      - name: Record Windows R build toolchain
        if: runner.os == 'Windows'
        run: |
          mkdir -p "${RUNNER_TEMP}/windows-r-toolchain"
          Rscript --vanilla -e 'writeLines(c(R.version.string, R.version$platform, Sys.info(), Sys.getenv("RTOOLS45_HOME")))' > "${RUNNER_TEMP}/windows-r-toolchain/r-platform.txt"
          gcc --version > "${RUNNER_TEMP}/windows-r-toolchain/gcc-version.txt"
          make --version > "${RUNNER_TEMP}/windows-r-toolchain/make-version.txt"
          rustc -vV > "${RUNNER_TEMP}/windows-r-toolchain/rustc-version.txt"
          rustc --print cfg --target x86_64-pc-windows-gnu > "${RUNNER_TEMP}/windows-r-toolchain/rust-target.txt"
      - name: Check R binding
        if: runner.os != 'Windows'
        working-directory: rust
        run: cargo clippy --locked -p yamaa-r -- -D warnings
      - name: Check Windows R binding
        if: runner.os == 'Windows'
        working-directory: rust
        run: cargo clippy --locked --target x86_64-pc-windows-gnu -p yamaa-r -- -D warnings
      - name: Install the shared grammar and benchmark metadata codecs
        run: python -m pip install py-yaml12==0.2.0 pyyaml==6.0.3
      # The package check runs R CMD check --as-cran; with checkbashisms and
      # aspell it also checks the configure scripts and DESCRIPTION's
      # spelling, as CRAN's checks do.
      - name: Install the programs that CRAN's checks use
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends devscripts aspell aspell-en
      # Every lane installs the Linux-built archive that a release publishes,
      # not one built on its own host.
      - name: Download the published R source archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-r-ubuntu-24.04
          path: ${{ runner.temp }}
      - name: Install R outside checkout
        id: r_install
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p native-r-library
          python -m tools.packaging.check_cargo_lock --output-dir "${RUNNER_TEMP}/rust-dependencies" yamaa_0.6.2.tar.gz
          python -m tools.packaging.check_package_notices yamaa_0.6.2.tar.gz
          R CMD INSTALL --library="${RUNNER_TEMP}/native-r-library" yamaa_0.6.2.tar.gz
          if [ "${{ runner.os }}" = Windows ]; then
            python -c 'from pathlib import Path; import shutil; dlls = list(Path("native-r-library/yamaa/libs").rglob("yamaa.dll")); assert len(dlls) == 1, "installed R DLL is missing or ambiguous"; shutil.copy2(dlls[0], "windows-r-toolchain/yamaa.dll")'
          fi
      - name: Install R package test dependencies
        working-directory: ${{ runner.temp }}
        env:
          R_LIBS: ${{ runner.temp }}/native-r-library
        run: |
          Rscript --vanilla - <<'RS'
          repository <- Sys.getenv("RSPM")
          if (!nzchar(repository)) repository <- "https://cloud.r-project.org"
          options(repos = c(CRAN = repository))
          description <- read.dcf(file.path(Sys.getenv("GITHUB_WORKSPACE"), "R/yamaa/DESCRIPTION"))
          suggests <- strsplit(description[1, "Suggests"], ",", fixed = TRUE)[[1]]
          packages <- trimws(sub("[[:space:]]*[(][^)]*[)]", "", suggests))
          install.packages(packages, lib = Sys.getenv("R_LIBS"))
          stopifnot(all(vapply(packages, requireNamespace, logical(1), quietly = TRUE)))
          RS
      - name: Report installed R public benchmark conformance
        if: ${{ !cancelled() && steps.r_install.outcome == 'success' }}
        working-directory: ${{ runner.temp }}
        env:
          R_LIBS: ${{ runner.temp }}/native-r-library
          PUBLIC_CONFORMANCE_PACKAGE_FORM: source
        run: |
          # The original benchmarks use project programs; package checks do not.
          R CMD INSTALL --library="${RUNNER_TEMP}/native-r-library" "${GITHUB_WORKSPACE}/rust/tests/project-programs/r"
          python -m pip install py-yaml12==0.2.0 pyarrow==25.0.1
          python -I -m tools.conformance.public_conformance plan \
            --fixtures "${GITHUB_WORKSPACE}/benchmarks" --output public-conformance-plan
          Rscript --vanilla "${GITHUB_WORKSPACE}/rust/tests/test_public_conformance.R" \
            "${GITHUB_WORKSPACE}/rust/tests/public_conformance.R"
          Rscript --vanilla "${GITHUB_WORKSPACE}/rust/tests/public_conformance.R" \
            public-conformance-plan "${GITHUB_WORKSPACE}/benchmarks" public-conformance/observed \
            "$(git -C "${GITHUB_WORKSPACE}" rev-parse HEAD)"
          python -I -m tools.conformance.public_conformance compare \
            --fixtures "${GITHUB_WORKSPACE}/benchmarks" --observed public-conformance/observed \
            --output public-conformance/inventory.json
      - name: Preserve R public benchmark inventory and saved artifacts
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: public-conformance-r-${{ matrix.os }}
          path: ${{ runner.temp }}/public-conformance
          if-no-files-found: error
      - name: Install the minimum supported R saved artifact readers
        if: ${{ !cancelled() && steps.r_install.outcome == 'success' }}
        working-directory: ${{ runner.temp }}
        env:
          R_LIBS: ${{ runner.temp }}/native-r-library
        run: Rscript --vanilla "${GITHUB_WORKSPACE}/tools/ci/install_minimum_r_readers.R" "${GITHUB_WORKSPACE}/R/yamaa/DESCRIPTION"
      - name: Run installed R supplemental suites outside checkout
        if: ${{ !cancelled() && steps.r_install.outcome == 'success' }}
        working-directory: ${{ runner.temp }}
        run: |
          python -m tools.commands.installed stage \
            --runtime r --staged-root "${RUNNER_TEMP}"
          YAMAA_PUBLIC_REPORT_DIR="${RUNNER_TEMP}/qualification/r-source/public-reports" R_LIBS="${RUNNER_TEMP}/native-r-library" python -I -m tools.commands.installed run \
            --output qualification/r-source --runtime r --staged-root "${RUNNER_TEMP}" \
            --source-revision "$(git -C "${GITHUB_WORKSPACE}" rev-parse HEAD)" --package-form source \
            --artifact-reference "github-actions:${GITHUB_RUN_ID}/attempt-${GITHUB_RUN_ATTEMPT}/native-r-ubuntu-24.04/yamaa_0.6.2.tar.gz" \
            --evidence "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Check R source package outside checkout
        id: r_package_check
        working-directory: ${{ runner.temp }}
        env:
          _R_CHECK_CRAN_INCOMING_REMOTE_: 'false'
          R_LIBS: ${{ runner.temp }}/native-r-library
        run: |
          python -m tools.commands.check_r \
            --archive "${RUNNER_TEMP}/yamaa_0.6.2.tar.gz" --work-dir "${RUNNER_TEMP}/native-r-check"
      - name: Preserve R package check
        if: ${{ always() && (steps.r_package_check.outcome == 'success' || steps.r_package_check.outcome == 'failure') }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: native-r-check-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/native-r-check/source-revision.txt
            ${{ runner.temp }}/native-r-check/yamaa.Rcheck/00check.log
            ${{ runner.temp }}/native-r-check/yamaa.Rcheck/00install.out
            ${{ runner.temp }}/native-r-check/yamaa.Rcheck/tests/*.Rout*
          if-no-files-found: error
      - name: Preserve R supplemental qualification
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: native-r-qualification-${{ matrix.os }}
          path: ${{ runner.temp }}/qualification
          if-no-files-found: error
      - name: Preserve Windows R build toolchain
        if: ${{ always() && runner.os == 'Windows' }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: windows-r-toolchain-${{ matrix.os }}
          path: ${{ runner.temp }}/windows-r-toolchain
          if-no-files-found: error
      - name: Preserve locked Rust dependency evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: rust-dependencies-r-${{ matrix.os }}
          path: ${{ runner.temp }}/rust-dependencies
          if-no-files-found: error

  cran:
    name: native-cran (${{ matrix.os }}, R ${{ matrix.r }})
    needs: r-dist
    runs-on: ${{ matrix.os }}
    # CRAN's incoming checks of the R source archive that a release publishes:
    # R CMD check --as-cran through tools/commands/check_r.py, which fails on
    # any finding that R/yamaa/cran-comments.md does not explain and on a
    # tarball above the limit it requests. Cargo and rustc are the workspace's
    # rust-version, the two-year-old toolchain that CRAN's guidance asks a
    # package to be tested with; the build reads the vendored crates, runs two
    # jobs, and sits behind a proxy that refuses connections. On Windows the
    # toolchain is built for the GNU host, x86_64-pc-windows-gnu, as on CRAN's
    # Windows machines, so Cargo links the build scripts and procedural macros
    # with the linker that Makevars.win gives it (#4005).
    timeout-minutes: ${{ matrix.os == 'windows-2025' && 90 || 75 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        # Qualify the exact DESCRIPTION floor, including its oldest patch.
        r: [devel, release, '4.2.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install repository tools
        run: python -m pip install --no-deps -e .
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          working-directory: R/yamaa
      # With checkbashisms and aspell, the check also covers the configure
      # scripts and the spelling of DESCRIPTION, as CRAN's does.
      - name: Install the programs that CRAN's checks use
        if: runner.os != 'Windows'
        run: |
          if [ "${{ runner.os }}" = Linux ]; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends devscripts aspell aspell-en
          else
            HOMEBREW_NO_AUTO_UPDATE=1 brew install checkbashisms
          fi
      # Activation writes RUSTUP_TOOLCHAIN for the later steps. The GNU host's
      # toolchain has the GNU target.
      - name: Install the minimum Rust
        run: |
          if [ "${{ runner.os }}" = Windows ]; then
            python -m tools.ci.toolchain --minimum --host x86_64-pc-windows-gnu --install
          else
            python -m tools.ci.toolchain --minimum --install
          fi
      - name: Download the published R source archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-r-ubuntu-24.04
          path: ${{ runner.temp }}/published
      # Environment names are case-insensitive on Windows; libcurl reads only
      # the lowercase http_proxy.
      - name: Check the R source package as CRAN does
        env:
          R_LIBS: ${{ env.R_LIBS_USER }}
          R_CHECK_VERSION: ${{ matrix.r }}
          http_proxy: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: ''
        run: |
          Rscript --vanilla -e 'v <- Sys.getenv("R_CHECK_VERSION"); if (grepl("^[0-9]", v)) stopifnot(identical(as.character(getRversion()), v))'
          python -m tools.commands.check_r --archive "${RUNNER_TEMP}"/published/yamaa_*.tar.gz \
            --work-dir "${RUNNER_TEMP}/cran-check"
      # On Windows RUSTUP_TOOLCHAIN names the host too, which the build used.
      - name: Confirm that the build used the minimum Rust
        run: |
          version=$(python -c 'from tools.ci.toolchain import minimum; print(minimum())')
          grep -F "using rustc ${version} " "${RUNNER_TEMP}/cran-check/yamaa.Rcheck/00install.out"
          grep -F "using cargo ${version} " "${RUNNER_TEMP}/cran-check/yamaa.Rcheck/00install.out"
          if [ "${{ runner.os }}" = Windows ]; then
            rustc -vV | tr -d '\r' | grep -Fx "host: x86_64-pc-windows-gnu"
          fi
      - name: Preserve the CRAN check
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: native-cran-${{ matrix.os }}-${{ matrix.r }}
          path: |
            ${{ runner.temp }}/cran-check/yamaa.Rcheck/00check.log
            ${{ runner.temp }}/cran-check/yamaa.Rcheck/00install.out
            ${{ runner.temp }}/cran-check/yamaa.Rcheck/tests/*.Rout*
          if-no-files-found: ignore

  cran-rust:
    name: native-cran (${{ matrix.os }}, R ${{ matrix.r }}, Rust ${{ matrix.rust }})
    needs: r-dist
    runs-on: ${{ matrix.os }}
    # The Windows R-devel lane above with the Rust that CRAN's Windows check
    # builds with, for the GNU host, in place of the minimum. A Rust release
    # can break the build where neither the minimum nor the pinned Rust does:
    # 1.86 to 1.95 ship that host's standard library with empty split-DWARF
    # members, which objcopy refused in the static library (#4012).
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025]
        r: [devel]
        rust: ['1.92.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install repository tools
        run: python -m pip install --no-deps -e .
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          working-directory: R/yamaa
      # Activation writes RUSTUP_TOOLCHAIN for the later steps. The GNU host's
      # toolchain has the GNU target.
      - name: Install CRAN's Rust
        run: python -m tools.ci.toolchain --channel ${{ matrix.rust }} --host x86_64-pc-windows-gnu --install
      - name: Download the published R source archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-r-ubuntu-24.04
          path: ${{ runner.temp }}/published
      # Environment names are case-insensitive on Windows; libcurl reads only
      # the lowercase http_proxy.
      - name: Check the R source package as CRAN does
        env:
          R_LIBS: ${{ env.R_LIBS_USER }}
          http_proxy: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: ''
        run: |
          python -m tools.commands.check_r --archive "${RUNNER_TEMP}"/published/yamaa_*.tar.gz \
            --work-dir "${RUNNER_TEMP}/cran-check"
      - name: Confirm that the build used CRAN's Rust
        run: |
          grep -F "using rustc ${{ matrix.rust }} " "${RUNNER_TEMP}/cran-check/yamaa.Rcheck/00install.out"
          grep -F "using cargo ${{ matrix.rust }} " "${RUNNER_TEMP}/cran-check/yamaa.Rcheck/00install.out"
          rustc -vV | tr -d '\r' | grep -Fx "host: x86_64-pc-windows-gnu"
      - name: Preserve the CRAN check
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: native-cran-${{ matrix.os }}-${{ matrix.r }}-rust-${{ matrix.rust }}
          path: |
            ${{ runner.temp }}/cran-check/yamaa.Rcheck/00check.log
            ${{ runner.temp }}/cran-check/yamaa.Rcheck/00install.out
            ${{ runner.temp }}/cran-check/yamaa.Rcheck/tests/*.Rout*
          if-no-files-found: ignore

  cran-no-suggests:
    name: native-cran (${{ matrix.os }}, R ${{ matrix.r }}, no Suggests)
    needs: r-dist
    runs-on: ${{ matrix.os }}
    # CRAN's check without the suggested packages, its noSuggests check:
    # R-devel on Linux with _R_CHECK_DEPENDS_ONLY_=true, which Writing R
    # Extensions recommends too. This is the Linux R-devel lane above with
    # none of the Suggests installed: the tests run with only the Depends and
    # Imports and skip what needs arrow or jsonlite. With
    # _R_CHECK_FORCE_SUGGESTS_ false, R reports the missing Suggests instead
    # of stopping. Vignette checks require builders from Suggests, so this
    # lane ignores vignettes; the other CRAN lanes validate and rebuild them.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        r: [devel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install repository tools
        run: python -m pip install --no-deps -e .
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      # With checkbashisms and aspell, the check also covers the configure
      # scripts and the spelling of DESCRIPTION, as CRAN's does.
      - name: Install the programs that CRAN's checks use
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends devscripts aspell aspell-en
      # Activation writes RUSTUP_TOOLCHAIN for the later steps.
      - name: Install the minimum Rust
        run: python -m tools.ci.toolchain --minimum --install
      - name: Confirm that no suggested package is installed
        run: |
          Rscript -e 'suggests <- strsplit(read.dcf("R/yamaa/DESCRIPTION")[1, "Suggests"], ",", fixed = TRUE)[[1]]' \
            -e 'packages <- trimws(sub("[[:space:]]*[(][^)]*[)]", "", suggests))' \
            -e 'stopifnot(!any(vapply(packages, requireNamespace, logical(1), quietly = TRUE)))'
      - name: Download the published R source archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-r-ubuntu-24.04
          path: ${{ runner.temp }}/published
      - name: Check the R source package as CRAN does
        env:
          R_LIBS: ${{ env.R_LIBS_USER }}
          _R_CHECK_DEPENDS_ONLY_: 'true'
          _R_CHECK_FORCE_SUGGESTS_: 'false'
          http_proxy: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: ''
        run: |
          python -m tools.commands.check_r --archive "${RUNNER_TEMP}"/published/yamaa_*.tar.gz \
            --ignore-vignettes --work-dir "${RUNNER_TEMP}/cran-check"
      - name: Confirm that the build used the minimum Rust
        run: |
          grep -F "using rustc ${RUSTUP_TOOLCHAIN} " "${RUNNER_TEMP}/cran-check/yamaa.Rcheck/00install.out"
          grep -F "using cargo ${RUSTUP_TOOLCHAIN} " "${RUNNER_TEMP}/cran-check/yamaa.Rcheck/00install.out"
      - name: Preserve the CRAN check
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: native-cran-${{ matrix.os }}-${{ matrix.r }}-no-suggests
          path: |
            ${{ runner.temp }}/cran-check/yamaa.Rcheck/00check.log
            ${{ runner.temp }}/cran-check/yamaa.Rcheck/00install.out
            ${{ runner.temp }}/cran-check/yamaa.Rcheck/tests/*.Rout*
          if-no-files-found: ignore

  cran-manual:
    name: native-cran (${{ matrix.os }}, R ${{ matrix.r }}, manual)
    needs: r-dist
    runs-on: ${{ matrix.os }}
    # The check with the PDF and HTML manuals, which CRAN's incoming checks
    # build and validate. Every other CRAN lane runs without LaTeX and HTML
    # Tidy and leaves both out with --no-manual. This is the Linux R-devel
    # lane above with both installed: check_r.py --manual drops --no-manual
    # and fails unless R reports both manual checks OK.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        r: [devel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install repository tools
        run: python -m pip install --no-deps -e .
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          working-directory: R/yamaa
      # With checkbashisms and aspell, the check also covers the configure
      # scripts and the spelling of DESCRIPTION, as CRAN's does. pdflatex
      # builds the PDF manual with the LaTeX packages and fonts that R's
      # Rd.sty loads: Times from texlive-fonts-recommended, and Inconsolata,
      # which R's default manual fonts require, from texlive-fonts-extra.
      # HTML Tidy, 5.0.0 or later, validates the HTML manual.
      - name: Install the programs that CRAN's checks use
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends devscripts aspell aspell-en \
            texlive-latex-base texlive-latex-recommended texlive-fonts-recommended \
            texlive-fonts-extra tidy
      # Activation writes RUSTUP_TOOLCHAIN for the later steps.
      - name: Install the minimum Rust
        run: python -m tools.ci.toolchain --minimum --install
      - name: Download the published R source archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-r-ubuntu-24.04
          path: ${{ runner.temp }}/published
      - name: Check the R source package as CRAN does
        env:
          R_LIBS: ${{ env.R_LIBS_USER }}
          http_proxy: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: ''
        run: |
          python -m tools.commands.check_r --archive "${RUNNER_TEMP}"/published/yamaa_*.tar.gz \
            --work-dir "${RUNNER_TEMP}/cran-check" --manual
      - name: Confirm that the build used the minimum Rust
        run: |
          grep -F "using rustc ${RUSTUP_TOOLCHAIN} " "${RUNNER_TEMP}/cran-check/yamaa.Rcheck/00install.out"
          grep -F "using cargo ${RUSTUP_TOOLCHAIN} " "${RUNNER_TEMP}/cran-check/yamaa.Rcheck/00install.out"
      - name: Preserve the CRAN check
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: native-cran-${{ matrix.os }}-${{ matrix.r }}-manual
          path: |
            ${{ runner.temp }}/cran-check/yamaa.Rcheck/00check.log
            ${{ runner.temp }}/cran-check/yamaa.Rcheck/00install.out
            ${{ runner.temp }}/cran-check/yamaa.Rcheck/tests/*.Rout*
          if-no-files-found: ignore

  cran-container:
    name: native-cran (${{ matrix.platform }})
    needs: r-dist
    runs-on: ubuntu-24.04
    # CRAN's check configurations as R-hub v2's containers build them, with
    # CRAN's check settings, checkbashisms and HTML Tidy, and R-hub's binaries
    # of the Suggests.
    # - gcc16: CRAN's r-devel-linux-x86_64-fedora-gcc flavor, R-devel built
    #   with GCC 16 on Fedora 44. The build uses the Cargo and rustc that
    #   Fedora packages, as CRAN's Linux check servers use their
    #   distribution's, as do the other Fedora images, gcc-asan and valgrind.
    # - gcc-asan: the gcc-ASAN configuration of CRAN's additional checks,
    #   R-devel on Fedora 44, whose GCC instruments packages with
    #   AddressSanitizer and UndefinedBehaviorSanitizer and whose R preloads
    #   both runtimes. As on clang-asan, the Makevars give that compiler to
    #   Cargo, and check_r.py fails on a sanitizer report.
    # - clang-asan: the clang-ASAN configuration of CRAN's additional checks,
    #   R-devel built with clang 23 and libc++ on Ubuntu 26.04, whose C
    #   compiler instruments packages with AddressSanitizer and
    #   UndefinedBehaviorSanitizer. The Makevars give that compiler to Cargo,
    #   so it instruments the ReadStat and zstd C sources too; the Rust code
    #   is not instrumented. The image carries no Rust, so the build uses the
    #   minimum Rust from its standalone installer, as
    #   native-offline-toolchain does. UndefinedBehaviorSanitizer reports and
    #   carries on, so check_r.py also fails on a sanitizer report in the
    #   installation, example or test output.
    # - valgrind: CRAN's valgrind check, R-devel on Fedora 44 built for
    #   valgrind. check_r.py --valgrind runs the installation, examples and
    #   tests alone, as R-hub's image does, the examples and each test under
    #   valgrind's memcheck with the image's options, --track-origins=yes
    #   --leak-check=full, and fails where memcheck counted an error, a leak
    #   that option reports included, or did not run. tools/commands/
    #   memcheck.supp hides only the possibly lost blocks of three roots that
    #   live as long as the process, and memcheck_control.c proves before the
    #   check that every other leak still counts. Under memcheck the tests
    #   run many times slower than natively.
    container: ghcr.io/r-hub/containers/${{ matrix.platform }}:latest
    timeout-minutes: ${{ matrix.platform == 'valgrind' && 240 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        platform: [gcc16, gcc-asan, clang-asan, valgrind]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The checkout's temporary git configuration is gone, and the container
      # runs as another user than the workspace's owner. dnf retries a mirror
      # that it cannot reach without waiting, so a failed install runs again
      # after growing pauses, five attempts over up to 7.5 minutes. The
      # refusing proxy applies to the check step alone.
      - name: Install Fedora's Cargo and rustc, and Python
        if: matrix.platform != 'clang-asan'
        run: |
          for pause in 30 60 120 240 stop; do
            dnf install -y cargo rust python3 pandoc && break
            if [ "${pause}" = stop ]; then exit 1; fi
            echo "dnf failed; trying again in ${pause} seconds"
            sleep "${pause}"
          done
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
      # As on Fedora, with apt-get. xz unpacks the Rust installer. The image's
      # newest llvm-symbolizer, when it has one, gives each sanitizer report
      # the functions, files and lines of its stack.
      - name: Install Python and xz, and name the symbolizer
        if: matrix.platform == 'clang-asan'
        run: |
          for pause in 30 60 120 240 stop; do
            apt-get update && apt-get install --yes --no-install-recommends python3 xz-utils pandoc && break
            if [ "${pause}" = stop ]; then exit 1; fi
            echo "apt-get failed; trying again in ${pause} seconds"
            sleep "${pause}"
          done
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          symbolizer=$(find /usr/lib -maxdepth 3 -path '/usr/lib/llvm-*/bin/llvm-symbolizer' | sort -V | tail -n 1)
          if [ -n "${symbolizer}" ]; then
            echo "ASAN_SYMBOLIZER_PATH=${symbolizer}" >> "${GITHUB_ENV}"
          fi
      # The Rust project signs each standalone installer with the Rust signing
      # key committed in tools/ci/keys/rust-key.gpg.ascii. gpg checks the .asc
      # signature before unpacking, with a fresh keyring holding only that
      # key; neither the download host nor a keyserver supplies a key. Then
      # install.sh installs rustc, Cargo and the standard library of the
      # target, the components of rustup's minimal profile, into /opt/rust,
      # where configure finds them on the PATH, with no rustup.
      - name: Install the minimum Rust from its standalone installer
        if: matrix.platform == 'clang-asan'
        run: |
          version=$(python3 -c 'from tools.ci.toolchain import minimum; print(minimum())')
          target="$(uname -m)-unknown-linux-gnu"
          installer="rust-${version}-${target}.tar.xz"
          mkdir "${RUNNER_TEMP}/rust-installer"
          cd "${RUNNER_TEMP}/rust-installer"
          for file in "dist/${installer}" "dist/${installer}.asc"; do
            curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
              --retry 3 --remote-name "https://static.rust-lang.org/${file}"
          done
          export GNUPGHOME="${PWD}/gnupg"
          mkdir -m 700 "${GNUPGHOME}"
          gpg --batch --import "${GITHUB_WORKSPACE}/tools/ci/keys/rust-key.gpg.ascii"
          gpg --batch --no-auto-key-retrieve --verify "${installer}.asc" "${installer}"
          tar -xJf "${installer}"
          "rust-${version}-${target}/install.sh" --prefix=/opt/rust \
            --components="rustc,cargo,rust-std-${target}" --disable-ldconfig
          /opt/rust/bin/rustc --version | grep -F "rustc ${version} "
          /opt/rust/bin/cargo --version | grep -F "cargo ${version} "
          echo /opt/rust/bin >> "${GITHUB_PATH}"
          echo "STANDALONE_RUST_VERSION=${version}" >> "${GITHUB_ENV}"
      # pak reads R-hub's binary repository, which the image configures, and
      # retries as the dnf step does.
      - name: Install the package's Suggests
        env:
          R_LIBS: ${{ runner.temp }}/library
        run: |
          mkdir -p "${R_LIBS}"
          for pause in 30 60 120 240 stop; do
            Rscript -e 'suggests <- strsplit(read.dcf("R/yamaa/DESCRIPTION")[1, "Suggests"], ",", fixed = TRUE)[[1]]' \
              -e 'packages <- trimws(sub("[[:space:]]*[(][^)]*[)]", "", suggests))' \
              -e 'pak::pkg_install(packages, lib = Sys.getenv("R_LIBS"))' \
              -e 'stopifnot(all(vapply(packages, requireNamespace, logical(1), quietly = TRUE, lib.loc = Sys.getenv("R_LIBS"))))' && break
            if [ "${pause}" = stop ]; then exit 1; fi
            echo "pak failed; trying again in ${pause} seconds"
            sleep "${pause}"
          done
      - name: Download the published R source archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-r-ubuntu-24.04
          path: ${{ runner.temp }}/published
      - name: Check the R source package as CRAN does
        id: check
        env:
          R_LIBS: ${{ runner.temp }}/library
          http_proxy: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: ''
        run: |
          echo "directory=${RUNNER_TEMP}/cran-check" >> "${GITHUB_OUTPUT}"
          python3 -m tools.commands.check_r --archive "${RUNNER_TEMP}"/published/yamaa_*.tar.gz \
            --work-dir "${RUNNER_TEMP}/cran-check" ${{ matrix.platform == 'valgrind' && '--valgrind' || '' }}
      - name: Confirm that the build used the minimum Rust
        if: matrix.platform == 'clang-asan'
        run: |
          grep -F "using rustc ${STANDALONE_RUST_VERSION} " "${RUNNER_TEMP}/cran-check/yamaa.Rcheck/00install.out"
          grep -F "using cargo ${STANDALONE_RUST_VERSION} " "${RUNNER_TEMP}/cran-check/yamaa.Rcheck/00install.out"
      # entrypoint.c, the package's own C, only passes R's call on, with no
      # memory access or arithmetic for a sanitizer to check, and the Rust
      # code is not instrumented, so the installed shared object calls
      # AddressSanitizer and UndefinedBehaviorSanitizer only from the C that
      # Cargo compiled with R's compiler.
      - name: Confirm that the sanitizers instrumented the crates' C
        if: matrix.platform == 'gcc-asan' || matrix.platform == 'clang-asan'
        run: |
          nm -D --undefined-only "${RUNNER_TEMP}/cran-check/yamaa.Rcheck/yamaa/libs/yamaa.so" \
            > "${RUNNER_TEMP}/undefined-symbols.txt"
          grep -E -m 3 ' __asan_(report_)?(load|store)' "${RUNNER_TEMP}/undefined-symbols.txt"
          grep -F -m 3 ' __ubsan_handle_' "${RUNNER_TEMP}/undefined-symbols.txt"
      # In a container job, ${{ runner.temp }} names the runner's directory,
      # which the runner maps to the container's only at the start of an
      # input, so it would map the first of these paths alone. The check step
      # names its directory as the container sees it.
      - name: Preserve the CRAN check
        if: ${{ always() && steps.check.outputs.directory != '' }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: native-cran-${{ matrix.platform }}
          path: |
            ${{ steps.check.outputs.directory }}/yamaa.Rcheck/00check.log
            ${{ steps.check.outputs.directory }}/yamaa.Rcheck/00install.out
            ${{ steps.check.outputs.directory }}/yamaa.Rcheck/tests/*.Rout*
          if-no-files-found: ignore

  offline-python:
    name: native-offline-source (${{ matrix.os }}, python)
    needs: dist
    runs-on: ${{ matrix.os }}
    # The Python source archive that a release publishes, built and installed
    # with the network disabled from its vendored crates (#3030 D55): pip
    # builds it with --no-build-isolation --no-index into a Python that got
    # maturin and the package's dependencies while the network was up. On
    # Linux the installation runs in a container without a network and with a
    # read-only root, from the pinned manylinux_2_28 image of the runner's
    # architecture (tools/ci/manylinux.py), whose glibc 2.28 is RHEL 8's, with
    # the runner's Rust mounted read-only; on macOS and Windows it runs behind
    # a proxy that refuses every connection. The installed package then runs
    # its selftest and the conformance corpus the same way.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025, ubuntu-24.04-arm]
    steps:
      - name: Preserve fixture bytes and symlinks on Windows
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.13.0'
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install repository tools
        run: |
          python -m pip install --no-deps -e .
          python -m tools.ci.toolchain
      - name: Install Rust
        run: python -m tools.ci.toolchain --install
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-python-ubuntu-24.04-${{ env.NATIVE_BUILD_PYTHON }}
          path: ${{ runner.temp }}/offline/native-dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-project-${{ matrix.os }}-${{ env.NATIVE_BUILD_PYTHON }}
          path: ${{ runner.temp }}/offline/project-dist
      - name: Record source revision and table requirements
        run: |
          echo "QUALIFICATION_SOURCE_REVISION=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"
          uv export --project python --locked --extra test --no-dev --no-emit-project --no-hashes --output-file "${RUNNER_TEMP}/offline/table-requirements.txt"
      # While the network is up. The runner's Python gets the readers of the
      # conformance plan and comparison; on macOS and Windows it is also the
      # Python that installs the archive, so it gets maturin and the project
      # programs that the benchmarks call. On Linux a virtual environment in
      # the image gets the same requirements, maturin and the project programs.
      - name: Prepare the Python that installs the archive
        working-directory: ${{ runner.temp }}/offline
        run: |
          maturin=$(python -c 'from tools.ci.manylinux import maturin; print(maturin())')
          python -m pip install --no-deps -r table-requirements.txt
          mkdir cargo-home
          if [ "${RUNNER_OS}" = Linux ]; then
            mkdir home tmp
            image=$(python -c 'import platform; from tools.ci.manylinux import IMAGES; print(IMAGES[platform.machine()])')
            interpreter=$(python -c 'from tools.ci.manylinux import PYTHON; print(PYTHON)')
            {
              echo "OFFLINE_IMAGE=${image}"
              echo "OFFLINE_RUST=$(rustc --print sysroot)"
            } >> "${GITHUB_ENV}"
            docker run --rm --volume "${PWD}:/work" --workdir /work \
              --env PYTHON="${interpreter}" --env MATURIN="${maturin}" "${image}" sh -c '
                set -e
                "${PYTHON}" -m venv venv
                venv/bin/python -m pip install --no-cache-dir --no-deps -r table-requirements.txt \
                  "${MATURIN}" project-dist/*.whl'
          else
            python -m pip install --no-deps "${maturin}" project-dist/*.whl
          fi
      # A download that the build attempts fails at once. Cargo's home starts
      # empty, as on a machine where Cargo never ran, so nothing that Cargo
      # cached on the runner can stand in for the vendored crates. Environment
      # names are case-insensitive on Windows; libcurl reads only the
      # lowercase http_proxy.
      - name: Install the Python source archive without a network
        working-directory: ${{ runner.temp }}/offline
        env:
          CARGO_HOME: ${{ runner.temp }}/offline/cargo-home
          http_proxy: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: ''
        run: |
          if [ "${RUNNER_OS}" = Linux ]; then
            docker run --rm --network none --read-only --tmpfs /tmp:rw,exec \
              --volume "${PWD}:/work" --volume "${OFFLINE_RUST}:/opt/rust:ro" --workdir /work \
              --env HOME=/work/home --env TMPDIR=/work/tmp --env CARGO_HOME=/work/cargo-home \
              "${OFFLINE_IMAGE}" sh -c '
                PATH="/work/venv/bin:/opt/rust/bin:${PATH}"
                exec python -m pip install --no-build-isolation --no-index --no-cache-dir native-dist/yamaa-*.tar.gz'
          else
            python -m pip install --no-build-isolation --no-index --no-cache-dir native-dist/yamaa-*.tar.gz
          fi
      # The installed package runs the selftest cases that it carries and
      # prints the report to the log, as installation qualification evidence;
      # the job fails unless the selftest reports succeeded. On Linux the
      # container mounts no checkout: the cases are inside the package.
      - name: Run the installed package's selftest
        working-directory: ${{ runner.temp }}/offline
        env:
          http_proxy: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: ''
        run: |
          if [ "${RUNNER_OS}" = Linux ]; then
            docker run --rm --network none --read-only --tmpfs /tmp:rw,exec --user "$(id -u):$(id -g)" \
              --volume "${PWD}:/work" --workdir /work --env HOME=/work/home --env TMPDIR=/work/tmp \
              "${OFFLINE_IMAGE}" /work/venv/bin/python -I -c \
              'import sys, yamaa; r = yamaa.selftest(); print(r); sys.exit(r.status != "succeeded")'
          else
            python -I -c 'import sys, yamaa; r = yamaa.selftest(); print(r); sys.exit(r.status != "succeeded")'
          fi
      # On Linux the installed package runs as the runner's user, which then
      # compares and uploads the files that it saves: the engine publishes
      # each file readable by its owner alone.
      - name: Report installed Python public benchmark conformance
        working-directory: ${{ runner.temp }}/offline
        env:
          http_proxy: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: ''
        run: |
          evidence="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          python -I -m tools.conformance.public_conformance plan \
            --fixtures "${GITHUB_WORKSPACE}/benchmarks" --output public-conformance-plan
          mkdir public-conformance
          if [ "${RUNNER_OS}" = Linux ]; then
            docker run --rm --network none --read-only --tmpfs /tmp:rw,exec --user "$(id -u):$(id -g)" \
              --volume "${PWD}:/work" --volume "${GITHUB_WORKSPACE}:/checkout:ro" --workdir /work \
              --env HOME=/work/home --env TMPDIR=/work/tmp \
              "${OFFLINE_IMAGE}" /work/venv/bin/python -I /checkout/python/tests/installed/public_conformance.py \
              --plan public-conformance-plan --fixtures /checkout/benchmarks \
              --python-lock /checkout/python/uv.lock --output public-conformance/observed \
              --source-revision "${QUALIFICATION_SOURCE_REVISION}" --package-form source --evidence "${evidence}"
          else
            python -I "${GITHUB_WORKSPACE}/python/tests/installed/public_conformance.py" \
              --plan public-conformance-plan --fixtures "${GITHUB_WORKSPACE}/benchmarks" \
              --python-lock "${GITHUB_WORKSPACE}/python/uv.lock" --output public-conformance/observed \
              --source-revision "${QUALIFICATION_SOURCE_REVISION}" --package-form source --evidence "${evidence}"
          fi
          python -I -m tools.conformance.public_conformance compare \
            --fixtures "${GITHUB_WORKSPACE}/benchmarks" --observed public-conformance/observed \
            --output public-conformance/inventory.json
      - name: Preserve Python public benchmark inventory and saved artifacts
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: public-conformance-python-offline-${{ matrix.os }}
          path: ${{ runner.temp }}/offline/public-conformance
          if-no-files-found: error

  offline-r:
    name: native-offline-source (${{ matrix.os }}, r)
    needs: r-dist
    runs-on: ${{ matrix.os }}
    # The R source package that a release publishes, built and installed with
    # the network disabled from its vendored crates (#3030 D55): R CMD INSTALL
    # runs its Makevars, which build them offline with two Cargo jobs. On
    # Linux the installation runs in a container without a network and with a
    # read-only root, from the rocker/r-ver image of R 4.6.1, with the runner's
    # Rust mounted read-only, and leaves HOME empty; on macOS and Windows it
    # runs behind a proxy that refuses every connection. The installed package
    # then runs its selftest and the conformance corpus the same way.
    timeout-minutes: ${{ matrix.os == 'windows-2025' && 60 || 40 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025, ubuntu-24.04-arm]
    steps:
      - name: Preserve fixture bytes and symlinks on Windows
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install repository tools
        run: |
          python -m pip install --no-deps -e .
          python -m tools.ci.toolchain
          python -m pip install py-yaml12==0.2.0 pyyaml==6.0.3 pyarrow==25.0.1
      - name: Install Rust
        run: |
          python -m tools.ci.toolchain --install
          if [ "${RUNNER_OS}" = Windows ]; then
            rustup target add x86_64-pc-windows-gnu
          fi
      # On Linux, R is the image's.
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        if: runner.os != 'Linux'
        with:
          r-version: '4.6.1'
          rtools-version: ${{ runner.os == 'Windows' && '45' || '' }}
          use-public-rspm: true
      - name: Download the published R source archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-r-ubuntu-24.04
          path: ${{ runner.temp }}/offline
      # The original benchmarks call the project programs package, which the
      # conformance step installs from this copy.
      - name: Prepare the installation
        working-directory: ${{ runner.temp }}/offline
        run: |
          mkdir library
          cp -R "${GITHUB_WORKSPACE}/rust/tests/project-programs/r" project-programs
          if [ "${RUNNER_OS}" = Linux ]; then
            mkdir home tmp
            echo "OFFLINE_RUST=$(rustc --print sysroot)" >> "${GITHUB_ENV}"
            docker pull docker.io/rocker/r-ver:4.6.1
          fi
      # Environment names are case-insensitive on Windows; libcurl reads only
      # the lowercase http_proxy.
      - name: Install the R source package without a network
        working-directory: ${{ runner.temp }}/offline
        env:
          http_proxy: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: ''
        run: |
          if [ "${RUNNER_OS}" = Linux ]; then
            docker run --rm --network none --read-only --tmpfs /tmp:rw,exec \
              --volume "${PWD}:/work" --volume "${OFFLINE_RUST}:/opt/rust:ro" \
              --env PATH=/opt/rust/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
              --env HOME=/work/home --env TMPDIR=/work/tmp \
              docker.io/rocker/r-ver:4.6.1 sh -c '
                set -e
                R CMD INSTALL --library=/work/library /work/yamaa_*.tar.gz
                test -z "$(ls -A /work/home)"'
          else
            R CMD INSTALL --library="${RUNNER_TEMP}/offline/library" yamaa_*.tar.gz
          fi
      # The installed package runs the selftest cases that it carries and
      # prints the report to the log, as installation qualification evidence;
      # the job fails unless the selftest reports succeeded. On Linux the
      # container mounts no checkout: the cases are inside the package.
      - name: Run the installed package's selftest
        working-directory: ${{ runner.temp }}/offline
        env:
          http_proxy: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: ''
        run: |
          if [ "${RUNNER_OS}" = Linux ]; then
            docker run --rm --network none --read-only --tmpfs /tmp:rw,exec --user "$(id -u):$(id -g)" \
              --volume "${PWD}:/work" --workdir /work \
              --env HOME=/work/home --env TMPDIR=/work/tmp --env R_LIBS=/work/library \
              docker.io/rocker/r-ver:4.6.1 Rscript --vanilla -e \
              'r <- yamaa::yamaa_selftest(); print(r); quit(status = r$status != "succeeded")'
          else
            R_LIBS="${RUNNER_TEMP}/offline/library" Rscript --vanilla -e \
              'r <- yamaa::yamaa_selftest(); print(r); quit(status = r$status != "succeeded")'
          fi
      # On Linux the installed package runs as the runner's user, which then
      # compares and uploads the files that it saves: the engine publishes
      # each file readable by its owner alone.
      - name: Report installed R public benchmark conformance
        working-directory: ${{ runner.temp }}/offline
        env:
          PUBLIC_CONFORMANCE_PACKAGE_FORM: source
          http_proxy: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: ''
        run: |
          revision=$(git -C "${GITHUB_WORKSPACE}" rev-parse HEAD)
          python -I -m tools.conformance.public_conformance plan \
            --fixtures "${GITHUB_WORKSPACE}/benchmarks" --output public-conformance-plan
          mkdir public-conformance
          if [ "${RUNNER_OS}" = Linux ]; then
            docker run --rm --network none --read-only --tmpfs /tmp:rw,exec --user "$(id -u):$(id -g)" \
              --volume "${PWD}:/work" --volume "${GITHUB_WORKSPACE}:/checkout:ro" --workdir /work \
              --env HOME=/work/home --env TMPDIR=/work/tmp --env R_LIBS=/work/library \
              --env PUBLIC_CONFORMANCE_PACKAGE_FORM --env GITHUB_SERVER_URL --env GITHUB_REPOSITORY \
              --env GITHUB_RUN_ID --env REVISION="${revision}" \
              docker.io/rocker/r-ver:4.6.1 sh -c '
                set -e
                R CMD INSTALL --library=/work/library project-programs
                Rscript --vanilla /checkout/rust/tests/public_conformance.R \
                  public-conformance-plan /checkout/benchmarks public-conformance/observed "${REVISION}"'
          else
            export R_LIBS="${RUNNER_TEMP}/offline/library"
            R CMD INSTALL --library="${R_LIBS}" project-programs
            Rscript --vanilla "${GITHUB_WORKSPACE}/rust/tests/public_conformance.R" \
              public-conformance-plan "${GITHUB_WORKSPACE}/benchmarks" public-conformance/observed "${revision}"
          fi
          python -I -m tools.conformance.public_conformance compare \
            --fixtures "${GITHUB_WORKSPACE}/benchmarks" --observed public-conformance/observed \
            --output public-conformance/inventory.json
      - name: Preserve R public benchmark inventory and saved artifacts
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: public-conformance-r-offline-${{ matrix.os }}
          path: ${{ runner.temp }}/offline/public-conformance
          if-no-files-found: error

  offline-toolchain-python:
    name: native-offline-toolchain (${{ matrix.os }}, python)
    needs: dist
    runs-on: ${{ matrix.os }}
    # The offline toolchain route (#3030 D54), which the restricted-environment
    # guide documents for a Linux machine whose packaged Rust is older than the
    # workspace's rust-version. While the network is up, the job downloads the
    # standalone installer archive of that minimum Rust for the runner's target
    # from static.rust-lang.org and verifies its signature. Then, in containers
    # without a network and with a read-only root, from the pinned
    # manylinux_2_28 image of the runner's architecture, the archive's own
    # install.sh installs Rust with no rustup, and pip builds and installs the
    # Python source archive that a release publishes with that toolchain alone,
    # as native-offline-source does with the pinned one. The installed package
    # then runs the conformance corpus the same way. The runner's Rust is never
    # activated.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.13.0'
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install repository tools
        run: python -m pip install --no-deps -e .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-python-ubuntu-24.04-${{ env.NATIVE_BUILD_PYTHON }}
          path: ${{ runner.temp }}/offline/native-dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-project-${{ matrix.os }}-${{ env.NATIVE_BUILD_PYTHON }}
          path: ${{ runner.temp }}/offline/project-dist
      # The Rust project signs each standalone installer with the Rust signing
      # key committed in tools/ci/keys/rust-key.gpg.ascii. gpg checks the .asc
      # signature before unpacking, with a fresh keyring holding only that
      # key; neither the download host nor a keyserver supplies a key.
      - name: Download and verify the standalone Rust installer
        working-directory: ${{ runner.temp }}/offline
        run: |
          version=$(python -c 'from tools.ci.toolchain import minimum; print(minimum())')
          target="$(uname -m)-unknown-linux-gnu"
          installer="rust-${version}-${target}.tar.xz"
          for file in "dist/${installer}" "dist/${installer}.asc"; do
            curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
              --retry 3 --remote-name "https://static.rust-lang.org/${file}"
          done
          export GNUPGHOME="${PWD}/gnupg"
          mkdir -m 700 "${GNUPGHOME}"
          gpg --batch --import "${GITHUB_WORKSPACE}/tools/ci/keys/rust-key.gpg.ascii"
          gpg --batch --no-auto-key-retrieve --verify "${installer}.asc" "${installer}"
          tar -xJf "${installer}"
          {
            echo "STANDALONE_RUST_VERSION=${version}"
            echo "STANDALONE_RUST_TARGET=${target}"
          } >> "${GITHUB_ENV}"
      - name: Record source revision and table requirements
        run: |
          echo "QUALIFICATION_SOURCE_REVISION=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"
          uv export --project python --locked --extra test --no-dev --no-emit-project --no-hashes --output-file "${RUNNER_TEMP}/offline/table-requirements.txt"
      # While the network is up. The runner's Python gets the readers of the
      # conformance plan and comparison, and a virtual environment in the image
      # gets the same requirements, maturin and the project programs that the
      # benchmarks call.
      - name: Prepare the Python that installs the archive
        working-directory: ${{ runner.temp }}/offline
        run: |
          maturin=$(python -c 'from tools.ci.manylinux import maturin; print(maturin())')
          image=$(python -c 'import platform; from tools.ci.manylinux import IMAGES; print(IMAGES[platform.machine()])')
          interpreter=$(python -c 'from tools.ci.manylinux import PYTHON; print(PYTHON)')
          python -m pip install --no-deps -r table-requirements.txt
          mkdir cargo-home home tmp rust
          echo "OFFLINE_IMAGE=${image}" >> "${GITHUB_ENV}"
          docker run --rm --volume "${PWD}:/work" --workdir /work \
            --env PYTHON="${interpreter}" --env MATURIN="${maturin}" "${image}" sh -c '
              set -e
              "${PYTHON}" -m venv venv
              venv/bin/python -m pip install --no-cache-dir --no-deps -r table-requirements.txt \
                "${MATURIN}" project-dist/*.whl'
      # Each offline container first checks that no network interface but the
      # loopback is up. install.sh installs rustc, Cargo and the standard
      # library of the runner's target, the components of rustup's minimal
      # profile, into /opt/rust, which the build then mounts read-only.
      - name: Install Rust from its standalone installer without a network
        working-directory: ${{ runner.temp }}/offline
        env:
          http_proxy: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: ''
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp:rw,exec \
            --volume "${PWD}:/work" --volume "${PWD}/rust:/opt/rust" --workdir /work \
            --env HOME=/work/home --env TMPDIR=/work/tmp \
            --env STANDALONE_RUST_VERSION --env STANDALONE_RUST_TARGET \
            "${OFFLINE_IMAGE}" sh -c '
              set -e
              for state in /sys/class/net/*/operstate; do
                test "${state}" = /sys/class/net/lo/operstate || test "$(cat "${state}")" = down
              done
              "rust-${STANDALONE_RUST_VERSION}-${STANDALONE_RUST_TARGET}/install.sh" --prefix=/opt/rust \
                --components="rustc,cargo,rust-std-${STANDALONE_RUST_TARGET}" --disable-ldconfig
              /opt/rust/bin/rustc --version | grep -F "rustc ${STANDALONE_RUST_VERSION} "
              /opt/rust/bin/cargo --version | grep -F "cargo ${STANDALONE_RUST_VERSION} "'
      # As in native-offline-source, a download that the build attempts fails
      # at once, and Cargo's home starts empty. No rustup is on the PATH, and
      # the only cargo and rustc are the installed ones.
      - name: Install the Python source archive without a network
        working-directory: ${{ runner.temp }}/offline
        env:
          http_proxy: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: ''
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp:rw,exec \
            --volume "${PWD}:/work" --volume "${PWD}/rust:/opt/rust:ro" --workdir /work \
            --env HOME=/work/home --env TMPDIR=/work/tmp --env CARGO_HOME=/work/cargo-home \
            "${OFFLINE_IMAGE}" sh -c '
              set -e
              for state in /sys/class/net/*/operstate; do
                test "${state}" = /sys/class/net/lo/operstate || test "$(cat "${state}")" = down
              done
              PATH="/work/venv/bin:/opt/rust/bin:${PATH}"
              test -z "$(command -v rustup)"
              test "$(command -v cargo)" = /opt/rust/bin/cargo
              test "$(command -v rustc)" = /opt/rust/bin/rustc
              exec python -m pip install --no-build-isolation --no-index --no-cache-dir native-dist/yamaa-*.tar.gz'
      # Only the installed package is mounted; its own cases must pass
      # before it runs the external conformance corpus.
      - name: Run the installed package's selftest
        working-directory: ${{ runner.temp }}/offline
        env:
          http_proxy: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: ''
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp:rw,exec --user "$(id -u):$(id -g)" \
            --volume "${PWD}:/work" --workdir /work --env HOME=/work/home --env TMPDIR=/work/tmp \
            "${OFFLINE_IMAGE}" /work/venv/bin/python -I -c \
            'import sys, yamaa; r = yamaa.selftest(); print(r); sys.exit(r.status != "succeeded")'
      # The installed package runs as the runner's user, which then compares
      # and uploads the files that it saves: the engine publishes each file
      # readable by its owner alone.
      - name: Report installed Python public benchmark conformance
        working-directory: ${{ runner.temp }}/offline
        env:
          http_proxy: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: ''
        run: |
          evidence="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          python -I -m tools.conformance.public_conformance plan \
            --fixtures "${GITHUB_WORKSPACE}/benchmarks" --output public-conformance-plan
          mkdir public-conformance
          docker run --rm --network none --read-only --tmpfs /tmp:rw,exec --user "$(id -u):$(id -g)" \
            --volume "${PWD}:/work" --volume "${GITHUB_WORKSPACE}:/checkout:ro" --workdir /work \
            --env HOME=/work/home --env TMPDIR=/work/tmp \
            "${OFFLINE_IMAGE}" /work/venv/bin/python -I /checkout/python/tests/installed/public_conformance.py \
            --plan public-conformance-plan --fixtures /checkout/benchmarks \
            --python-lock /checkout/python/uv.lock --output public-conformance/observed \
            --source-revision "${QUALIFICATION_SOURCE_REVISION}" --package-form source --evidence "${evidence}"
          python -I -m tools.conformance.public_conformance compare \
            --fixtures "${GITHUB_WORKSPACE}/benchmarks" --observed public-conformance/observed \
            --output public-conformance/inventory.json
      - name: Preserve Python public benchmark inventory and saved artifacts
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: public-conformance-python-offline-toolchain-${{ matrix.os }}
          path: ${{ runner.temp }}/offline/public-conformance
          if-no-files-found: error

