name: Native installation prototype

on:
  push:
    branches: [main]
    paths:
      - 'rust/**'
      - 'R/yamaa/**'
      - 'python/**'
      - 'benchmarks/**'
      - 'yaml/**'
      - '.github/workflows/native.yml'
  pull_request:
    paths:
      - 'rust/**'
      - 'R/yamaa/**'
      - 'python/**'
      - 'benchmarks/**'
      - 'yaml/**'
      - '.github/workflows/native.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  RUSTUP_TOOLCHAIN: 1.90.0

jobs:
  python:
    name: native-python (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # Windows run 37574252721 reached the source-installed specification suite
    # at the 30-minute limit after passing wheel qualification. Keep every check
    # and allow headroom for cold compilation and both installed package forms.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
        python: ['3.14']
    steps:
      - name: Preserve fixture bytes and symlinks on Windows
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # Rust artifacts are OS-specific only.
          shared-key: native-python-${{ matrix.os }}
      - name: Install build tools
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy
          python -m pip install maturin==1.9.6 uv==0.11.6
      - name: Check shared crates and dependency direction
        working-directory: rust
        run: |
          cargo fmt --all --check
          cargo clippy -p yamaa-core -p yamaa-engine -p yamaa-adapters -p yamaa-python --all-targets -- -D warnings
          cargo test
          cargo test -p yamaa-core -p yamaa-engine -p yamaa-adapters --release
          python tools/generate_regex_identifiers.py
          python tools/generate_schema_printable.py
          python tools/generate_shipped_schema.py
          python tools/check_float_text.py
          python tools/check_sqrt.py
          python tools/check_rounding.py
          python tools/assess_math.py --output "${RUNNER_TEMP}/math-assessment.json"
          uv run --project ../python --locked --no-editable python tools/check_numeric_grammar.py
          uv run --project ../python --locked --no-editable python tools/check_aggregate_grammar.py
          uv run --project ../python --locked --no-editable python tools/check_numeric_syntax.py
          uv run --project ../python --locked --no-editable python tools/check_predicate_syntax.py
          uv run --project ../python --locked --no-editable python tools/check_regex.py
          uv run --project ../python --locked --no-editable python tools/assess_regex_reference.py > "${RUNNER_TEMP}/regex-reference-assessment.json"
          python tools/check_dependencies.py
          python tools/check_diagnostics.py
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Preserve Python 3.12 numerical assessment coverage
        working-directory: rust
        # The native build matrix uses 3.14, but portable-math-exact still
        # requires independent observations from both supported interpreters.
        # Reuse the Rust probe; this stdlib-only assessment needs no wheel build.
        run: uv run --no-project --python 3.12 python tools/assess_math.py --output "${RUNNER_TEMP}/math-assessment-3.12/math-assessment.json"
      - name: Assess decimal rounding independently
        if: always()
        working-directory: rust
        run: uv run --project ../python --locked --no-editable python tools/assess_rounding.py --output "${RUNNER_TEMP}/rounding-assessment.json"
      - name: Preserve candidate math assessment (not parity qualification)
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: math-assessment-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/math-assessment.json
          if-no-files-found: error
      - name: Preserve Python 3.12 candidate math assessment
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: math-assessment-${{ matrix.os }}-3.12
          path: ${{ runner.temp }}/math-assessment-3.12/math-assessment.json
          if-no-files-found: error
      - name: Preserve rounding assessment (not parity qualification)
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: rounding-assessment-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/rounding-assessment.json
          if-no-files-found: error
      - name: Build wheel and source archive
        run: |
          echo "QUALIFICATION_SOURCE_REVISION=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"
          (cd python && maturin build --release --sdist --out "${RUNNER_TEMP}/native-dist")
          mkdir -p "${RUNNER_TEMP}/reference-dist"
          cp "${RUNNER_TEMP}"/native-dist/*.whl "${RUNNER_TEMP}/reference-dist/"
          uv export --project python --locked --no-dev --no-emit-project --no-hashes --output-file "${RUNNER_TEMP}/table-requirements.txt"
      - name: Install and test wheel outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip install --no-deps -r table-requirements.txt native-dist/*.whl
          cp "${GITHUB_WORKSPACE}/rust/tests/installed_python.py" installed_python.py
          cp "${GITHUB_WORKSPACE}/rust/crates/yamaa-adapters/tests/fixtures/scalar_transport.tsv" scalar_transport.tsv
          cp "${GITHUB_WORKSPACE}/rust/crates/yamaa-adapters/tests/fixtures/numeric_transport.tsv" numeric_transport.tsv
          cp -R "${GITHUB_WORKSPACE}/rust/crates/yamaa-adapters/tests/fixtures/tables" tables
          cp "${GITHUB_WORKSPACE}/rust/tests/installed_tables.py" installed_tables.py
          cp "${GITHUB_WORKSPACE}/rust/tests/installed_functions.py" installed_functions.py
          cp "${GITHUB_WORKSPACE}/rust/tests/installed_temporal_results.py" installed_temporal_results.py
          cp "${GITHUB_WORKSPACE}/rust/tests/installed_datasets.py" installed_datasets.py
          cp "${GITHUB_WORKSPACE}/rust/tests/installed_specification.py" installed_specification.py
          cp "${GITHUB_WORKSPACE}/rust/tests/installed_project_functions.py" installed_project_functions.py
          cp "${GITHUB_WORKSPACE}/rust/tests/installed_profile.py" installed_profile.py
          cp "${GITHUB_WORKSPACE}/rust/tests/installed_dependencies.py" installed_dependencies.py
          cp "${GITHUB_WORKSPACE}/rust/tests/installed_references.py" installed_references.py
          cp "${GITHUB_WORKSPACE}/rust/tests/installed_aggregate_planning.py" installed_aggregate_planning.py
          cp "${GITHUB_WORKSPACE}/rust/tests/installed_aggregate_syntax.py" installed_aggregate_syntax.py
          cp "${GITHUB_WORKSPACE}/rust/tests/installed_numeric_syntax.py" installed_numeric_syntax.py
          cp "${GITHUB_WORKSPACE}/rust/tests/installed_regex.py" installed_regex.py
          cp "${GITHUB_WORKSPACE}/rust/tests/installed_predicate_syntax.py" installed_predicate_syntax.py
          cp "${GITHUB_WORKSPACE}/rust/tests/installed_predicate_execution.py" installed_predicate_execution.py
          cp "${GITHUB_WORKSPACE}/rust/tests/installed_schema.py" installed_schema.py
          cp "${GITHUB_WORKSPACE}/rust/tests/installed_original_specifications.py" installed_original_specifications.py
          cp "${GITHUB_WORKSPACE}/rust/tests/installed_file_resources.py" installed_file_resources.py
          python "${GITHUB_WORKSPACE}/rust/tools/stage_specification_inputs.py" specification-original
          cp "${GITHUB_WORKSPACE}/rust/tests/installed_yaml.py" installed_yaml.py
          cp "${GITHUB_WORKSPACE}/rust/crates/yamaa-adapters/tests/fixtures/yaml_transport.tsv" yaml_transport.tsv
          cp "${GITHUB_WORKSPACE}/rust/tests/installed_schema_loading.py" installed_schema_loading.py
          cp "${GITHUB_WORKSPACE}/rust/tests/installed_inheritance.py" installed_inheritance.py
          cp "${GITHUB_WORKSPACE}/rust/crates/yamaa-adapters/tests/fixtures/inheritance_traversal.tsv" inheritance_traversal.tsv
          cp "${GITHUB_WORKSPACE}/rust/crates/yamaa-adapters/tests/fixtures/inheritance_sources.tsv" inheritance_sources.tsv
          cp "${GITHUB_WORKSPACE}/rust/crates/yamaa-adapters/tests/fixtures/schema_transport.tsv" schema_transport.tsv
          cp "${GITHUB_WORKSPACE}/rust/crates/yamaa-adapters/tests/fixtures/schema_model.tsv" schema_model.tsv
          cp "${GITHUB_WORKSPACE}/rust/crates/yamaa-adapters/tests/fixtures/schema_windows.tsv" schema_windows.tsv
          cp "${GITHUB_WORKSPACE}/rust/crates/yamaa-adapters/tests/fixtures/schema_composition.tsv" schema_composition.tsv
          cp "${GITHUB_WORKSPACE}/rust/crates/yamaa-adapters/tests/fixtures/schema_layer_admission.tsv" schema_layer_admission.tsv
          cp "${GITHUB_WORKSPACE}/rust/crates/yamaa-adapters/tests/fixtures/schema_inheritance_dependencies.tsv" schema_inheritance_dependencies.tsv
          cp "${GITHUB_WORKSPACE}/rust/crates/yamaa-adapters/tests/fixtures/predicate_syntax.tsv" predicate_syntax.tsv
          cp "${GITHUB_WORKSPACE}/rust/crates/yamaa-adapters/tests/fixtures/regex_transport.tsv" regex_transport.tsv
          cp "${GITHUB_WORKSPACE}/rust/crates/yamaa-adapters/tests/fixtures/aggregate_syntax.tsv" aggregate_syntax.tsv
          cp "${GITHUB_WORKSPACE}/rust/crates/yamaa-adapters/tests/fixtures/numeric_syntax.tsv" numeric_syntax.tsv
          cp "${GITHUB_WORKSPACE}/rust/crates/yamaa-core/tests/fixtures/dependency_analysis.tsv" dependency_analysis.tsv
          cp "${GITHUB_WORKSPACE}/rust/crates/yamaa-core/tests/fixtures/column_dependencies.tsv" column_dependencies.tsv
          cp "${GITHUB_WORKSPACE}/rust/crates/yamaa-adapters/tests/fixtures/reference_binding.tsv" reference_binding.tsv
          cp "${GITHUB_WORKSPACE}/rust/crates/yamaa-adapters/tests/fixtures/reference_scope.tsv" reference_scope.tsv
          cp "${GITHUB_WORKSPACE}/rust/crates/yamaa-adapters/tests/fixtures/reference_intermediate.tsv" reference_intermediate.tsv
          cp "${GITHUB_WORKSPACE}/rust/crates/yamaa-adapters/tests/fixtures/reference_keys.tsv" reference_keys.tsv
          cp "${GITHUB_WORKSPACE}/rust/crates/yamaa-adapters/tests/fixtures/reference_match_values.tsv" reference_match_values.tsv
          cp "${GITHUB_WORKSPACE}/rust/crates/yamaa-adapters/tests/fixtures/reference_relations.tsv" reference_relations.tsv
          cp -R "${GITHUB_WORKSPACE}/benchmarks/schema-functions" specification-functions
          cp -R "${GITHUB_WORKSPACE}/benchmarks/adam-adlb-ordered-sum" specification-adlb
          cp -R "${GITHUB_WORKSPACE}/benchmarks/schema-window-functions" specification-windows
          cp -R "${GITHUB_WORKSPACE}/benchmarks/schema-lookup" specification-lookup
          cp -R "${GITHUB_WORKSPACE}/benchmarks/adam-advs-bmi" specification-advs-bmi
          cp -R "${GITHUB_WORKSPACE}/yaml" specification-yaml
          cp -R "${GITHUB_WORKSPACE}/benchmarks/schema-inheritance" specification-inheritance
          cp -R "${GITHUB_WORKSPACE}/benchmarks/schema-column-composition" specification-column-composition
          cp -R "${GITHUB_WORKSPACE}/benchmarks/schema-inherited-output" specification-inherited-output
          cp -R "${GITHUB_WORKSPACE}/rust/crates/yamaa-adapters/tests/fixtures/datasets" datasets
          cp "${GITHUB_WORKSPACE}/rust/crates/yamaa-engine/tests/fixtures/function_invocation.tsv" function_invocation.tsv
          mkdir -p conformance-suite
          # Use native symlink creation: MSYS cp failed on the path-validation
          # fixture on Windows. Preserve link text instead of dereferencing it.
          python - <<'PY'
          import os
          import shutil
          from pathlib import Path
          shutil.copytree(
              Path(os.environ["GITHUB_WORKSPACE"]) / "benchmarks",
              Path("conformance-suite/benchmarks"),
              symlinks=True,
          )
          PY
          cp -R "${GITHUB_WORKSPACE}/yaml" conformance-suite/yaml
          cp -R "${GITHUB_WORKSPACE}/rust/qualification" conformance-suite/gates
          cp "${GITHUB_WORKSPACE}/rust/tests/installed_conformance.py" conformance-suite/installed_conformance.py
          cp "${GITHUB_WORKSPACE}/rust/tools/qualify_native.py" conformance-suite/qualify_native.py
          python -I conformance-suite/qualify_native.py \
            --fixtures conformance-suite/benchmarks --schema conformance-suite/yaml \
            --gates conformance-suite/gates --output qualification/wheel \
            --source-revision "${QUALIFICATION_SOURCE_REVISION}" --package-form wheel \
            --reference-artifacts reference-dist --native-artifacts native-dist \
            --reference-artifact-prefix "github-actions:${GITHUB_RUN_ID}/attempt-${GITHUB_RUN_ATTEMPT}/native-reference-${{ matrix.os }}-${{ matrix.python }}" \
            --native-artifact-prefix "github-actions:${GITHUB_RUN_ID}/attempt-${GITHUB_RUN_ATTEMPT}/native-python-${{ matrix.os }}-${{ matrix.python }}" \
            --evidence "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          python -I "${GITHUB_WORKSPACE}/rust/tools/supplemental_inventory.py" \
            --root "${GITHUB_WORKSPACE}" --catalog "${GITHUB_WORKSPACE}/rust/qualification/supplemental.json" \
            --output qualification/wheel/supplemental --runtime python --staged-root "${RUNNER_TEMP}" \
            --source-revision "${QUALIFICATION_SOURCE_REVISION}" --package-form wheel \
            --artifact-reference "github-actions:${GITHUB_RUN_ID}/attempt-${GITHUB_RUN_ATTEMPT}/native-python-${{ matrix.os }}-${{ matrix.python }}/$(basename native-dist/*.whl)" \
            --host-artifact-reference "github-actions:${GITHUB_RUN_ID}/attempt-${GITHUB_RUN_ATTEMPT}/native-reference-${{ matrix.os }}-${{ matrix.python }}/$(basename reference-dist/*.whl)" \
            --evidence "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          python -I "${GITHUB_WORKSPACE}/rust/tools/measure_dataset_phases.py" --root "${GITHUB_WORKSPACE}" --repeats 1 --output dataset-phases.json
      - name: Check regex and predicate services on the oldest advertised Python ABI
        working-directory: ${{ runner.temp }}
        run: |
          uv run --no-project --python 3.12 --with native-dist/*.whl python -E -s installed_regex.py
          uv run --no-project --python 3.12 --with native-dist/*.whl python -E -s installed_predicate_syntax.py
          # Keep independent schema probes usable with only the native wheel.
          uv run --no-project --python 3.12 --with native-dist/*.whl python -E -s installed_schema.py SchemaService.test_independent_truth_without_python_interpreter SchemaService.test_prepared_snapshot_owns_metadata_and_uses_the_same_results SchemaService.test_host_types_and_closed_transport
          # The separate reference comparison needs the actual Python facade.
          uv run --no-project --python 3.12 --with-requirements table-requirements.txt --with native-dist/*.whl python -E -s installed_schema.py
          uv run --no-project --python 3.12 --with native-dist/*.whl python -E -s installed_yaml.py
          uv run --no-project --python 3.12 --with-requirements table-requirements.txt --with native-dist/*.whl python -E -s installed_schema_loading.py
          uv run --no-project --python 3.12 --with-requirements table-requirements.txt --with native-dist/*.whl python -E -s installed_inheritance.py
      - name: Rebuild and test from source archive outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip uninstall -y yamaa
          python -m pip install --no-cache-dir --no-deps native-dist/*.tar.gz
          python -I conformance-suite/qualify_native.py \
            --fixtures conformance-suite/benchmarks --schema conformance-suite/yaml \
            --gates conformance-suite/gates --output qualification/source \
            --source-revision "${QUALIFICATION_SOURCE_REVISION}" --package-form source \
            --reference-artifacts reference-dist --native-artifacts native-dist \
            --reference-artifact-prefix "github-actions:${GITHUB_RUN_ID}/attempt-${GITHUB_RUN_ATTEMPT}/native-reference-${{ matrix.os }}-${{ matrix.python }}" \
            --native-artifact-prefix "github-actions:${GITHUB_RUN_ID}/attempt-${GITHUB_RUN_ATTEMPT}/native-python-${{ matrix.os }}-${{ matrix.python }}" \
            --evidence "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          python -I "${GITHUB_WORKSPACE}/rust/tools/supplemental_inventory.py" \
            --root "${GITHUB_WORKSPACE}" --catalog "${GITHUB_WORKSPACE}/rust/qualification/supplemental.json" \
            --output qualification/source/supplemental --runtime python --staged-root "${RUNNER_TEMP}" \
            --source-revision "${QUALIFICATION_SOURCE_REVISION}" --package-form source \
            --artifact-reference "github-actions:${GITHUB_RUN_ID}/attempt-${GITHUB_RUN_ATTEMPT}/native-python-${{ matrix.os }}-${{ matrix.python }}/$(basename native-dist/*.tar.gz)" \
            --host-artifact-reference "github-actions:${GITHUB_RUN_ID}/attempt-${GITHUB_RUN_ATTEMPT}/native-reference-${{ matrix.os }}-${{ matrix.python }}/$(basename reference-dist/*.whl)" \
            --evidence "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Preserve native qualification reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: native-qualification-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/qualification
          if-no-files-found: error
      - name: Preserve the reference host wheel
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: native-reference-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/reference-dist
          if-no-files-found: error
      - name: Preserve distributions
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: native-python-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/native-dist
      - name: Preserve measurement smoke samples
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: dataset-phases-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/dataset-phases.json
          if-no-files-found: error
      - name: Preserve regex reference discrepancies
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: regex-reference-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/regex-reference-assessment.json
          if-no-files-found: error

  math-portability:
    name: portable-math-exact
    needs: python
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: math-assessment-*
          path: math-assessments
      - name: Compare every candidate bit across the native matrix
        run: python rust/tools/check_math_portability.py math-assessments

  r:
    name: native-r (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: native-r-${{ matrix.os }}
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true
      - name: Install Rust
        run: rustup toolchain install 1.90.0 --profile minimal --component clippy
      - name: Check R binding
        working-directory: rust
        run: cargo clippy -p yamaa-r -- -D warnings
      - name: Stage standalone R package
        run: python rust/tools/stage_r_package.py "${RUNNER_TEMP}/native-stage/yamaa"
      - name: Build, install, and test outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p native-r-library
          R CMD build --no-build-vignettes --no-manual native-stage/yamaa
          R CMD INSTALL --library="${RUNNER_TEMP}/native-r-library" yamaa_0.2.0.tar.gz
          cp "${GITHUB_WORKSPACE}/R/yamaa/tests/installation.R" installation.R
          cp "${GITHUB_WORKSPACE}/R/yamaa/tests/scalars.R" scalars.R
          cp "${GITHUB_WORKSPACE}/R/yamaa/tests/functions.R" functions.R
          cp "${GITHUB_WORKSPACE}/R/yamaa/tests/datasets.R" datasets.R
          cp "${GITHUB_WORKSPACE}/R/yamaa/tests/dataset_callbacks.R" dataset_callbacks.R
          cp "${GITHUB_WORKSPACE}/R/yamaa/tests/dependencies.R" dependencies.R
          cp "${GITHUB_WORKSPACE}/R/yamaa/tests/column_dependencies.R" column_dependencies.R
          cp "${GITHUB_WORKSPACE}/R/yamaa/tests/references.R" references.R
          cp "${GITHUB_WORKSPACE}/R/yamaa/tests/aggregate_syntax.R" aggregate_syntax.R
          cp "${GITHUB_WORKSPACE}/R/yamaa/tests/numeric_syntax.R" numeric_syntax.R
          cp "${GITHUB_WORKSPACE}/R/yamaa/tests/regex.R" regex.R
          cp "${GITHUB_WORKSPACE}/R/yamaa/tests/predicate_syntax.R" predicate_syntax.R
          cp "${GITHUB_WORKSPACE}/R/yamaa/tests/predicate_execution.R" predicate_execution.R
          cp "${GITHUB_WORKSPACE}/R/yamaa/tests/schema.R" schema.R
          cp "${GITHUB_WORKSPACE}/R/yamaa/tests/original_specifications.R" original_specifications.R
          cp "${GITHUB_WORKSPACE}/R/yamaa/tests/inheritance.R" inheritance.R
          cp "${GITHUB_WORKSPACE}/R/yamaa/tests/yaml.R" yaml.R
          R_LIBS="${RUNNER_TEMP}/native-r-library" python -I "${GITHUB_WORKSPACE}/rust/tools/supplemental_inventory.py" \
            --root "${GITHUB_WORKSPACE}" --catalog "${GITHUB_WORKSPACE}/rust/qualification/supplemental.json" \
            --output qualification/r-source --runtime r --staged-root "${RUNNER_TEMP}" \
            --source-revision "$(git -C "${GITHUB_WORKSPACE}" rev-parse HEAD)" --package-form source \
            --artifact-reference "github-actions:${GITHUB_RUN_ID}/attempt-${GITHUB_RUN_ATTEMPT}/native-r-${{ matrix.os }}/yamaa_0.2.0.tar.gz" \
            --evidence "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Check R source package outside checkout
        working-directory: ${{ runner.temp }}
        env:
          _R_CHECK_CRAN_INCOMING_REMOTE_: 'false'
        run: |
          mkdir native-r-check
          cd native-r-check
          git -C "${GITHUB_WORKSPACE}" rev-parse HEAD > source-revision.txt
          R CMD check --no-manual ../yamaa_0.2.0.tar.gz
          python -c 'from pathlib import Path; lines = Path("yamaa.Rcheck/00check.log").read_text().splitlines(); assert "Status: OK" in lines, "R package check has unresolved findings"'
      - name: Preserve R package check
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: native-r-check-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/native-r-check/source-revision.txt
            ${{ runner.temp }}/native-r-check/yamaa.Rcheck/00check.log
            ${{ runner.temp }}/native-r-check/yamaa.Rcheck/00install.out
            ${{ runner.temp }}/native-r-check/yamaa.Rcheck/tests/*.Rout*
          if-no-files-found: error
      - name: Preserve R supplemental qualification
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: native-r-qualification-${{ matrix.os }}
          path: ${{ runner.temp }}/qualification
          if-no-files-found: error
      - name: Preserve source archive
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: native-r-${{ matrix.os }}
          path: ${{ runner.temp }}/yamaa_0.2.0.tar.gz
