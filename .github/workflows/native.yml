name: Native installation prototype

on:
  # Qualify a reviewed branch's complete installed matrix before issue closure.
  workflow_dispatch:
  push:
    # Explicit issue qualification branches exercise the same full checks before
    # review; ordinary PR feedback uses pr.yml smoke checks.
    branches: [main, 'qualification/issue-*']
    paths:
      - 'rust/**'
      # Prose is checked by repository validation; Markdown fixtures still run.
      - '!rust/*.md'
      - 'R/yamaa/**'
      - 'python/**'
      - 'benchmarks/**'
      - '!benchmarks/**/*.md'
      - 'yaml/**'
      - '.github/workflows/native.yml'
      - '.github/scripts/ci/native_matrix.py'
      - '.github/scripts/ci/test_native_matrix.py'
      - '.github/scripts/commands/**'
      - 'Makefile'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel stale branch qualification feedback; active main runs finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  RUSTUP_TOOLCHAIN: 1.90.0
  # One abi3 wheel per OS is installed on every approved interpreter.
  NATIVE_BUILD_PYTHON: '3.14'

jobs:
  plan:
    name: native-coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.coverage.outputs.build }}
      qualify: ${{ steps.coverage.outputs.qualify }}
      r: ${{ steps.coverage.outputs.r }}
      run-r: ${{ steps.coverage.outputs.run-r }}
      run-rust: ${{ steps.coverage.outputs.run-rust }}
      full: ${{ steps.coverage.outputs.full }}
      compare-os: ${{ steps.coverage.outputs.compare-os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Select the full installed matrix
        id: coverage
        run: python .github/scripts/ci/native_matrix.py plan

  # Main and explicitly selected qualification pushes run all shared checks.
  # Dispatches qualify the installed R/Python packages.
  rust:
    needs: plan
    if: needs.plan.outputs.run-rust == 'true'
    name: native-rust (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # Cold optimized test builds on Windows can consume more than 20 minutes.
    # Leave time for the complete shared guard and assessment suites afterward.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 30 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.build) }}
    steps:
      - name: Preserve fixture bytes and symlinks on Windows
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Compare the diagnostic literal allowlist with the prior revision.
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # Without `workspaces` the action looks for Cargo.toml at the root,
          # fails, and saves an empty cache under a key that never refreshes.
          workspaces: rust
          # Keep the main-only shared-crates cache separate from package builds.
          shared-key: native-rust-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install build tools
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy
          python -m pip install uv==0.11.6
      - name: Check shared crates and dependency direction
        id: shared_crates
        working-directory: rust
        run: |
          (
            set -e
            python tools/check_benchmark_sdk_versions.py
            python tools/check_shared_release_versions.py
            cargo fmt --all --check
            python tools/check_cargo_lock.py --output-dir "${RUNNER_TEMP}/rust-dependencies"
            cargo clippy --locked -p yamaa-core -p yamaa-engine -p yamaa-adapters -p yamaa-python --all-targets -- -D warnings
            python ../.github/scripts/commands/rust_tests.py
            python tools/generate_regex_identifiers.py
            python tools/generate_schema_printable.py
            python tools/generate_shipped_schema.py
            uv run --project ../python --locked --no-editable python tools/check_shared_grammar.py
            python tools/check_float_text.py
            python tools/check_sqrt.py
            python tools/check_rounding.py
            python tools/assess_math.py --output "${RUNNER_TEMP}/math-assessment.json"
            uv run --project ../python --locked --no-editable python tools/check_numeric_grammar.py
            uv run --project ../python --locked --no-editable python tools/check_aggregate_grammar.py
            uv run --project ../python --locked --no-editable python tools/check_numeric_syntax.py
            uv run --project ../python --locked --no-editable python tools/check_predicate_syntax.py
            uv run --project ../python --locked --no-editable python tools/check_regex.py
            uv run --project ../python --locked --no-editable python tools/assess_regex_reference.py > "${RUNNER_TEMP}/regex-native-assessment.json"
            python tools/check_dependencies.py
            python tools/check_diagnostics.py --baseline-ref HEAD^
            uv run --project ../python --locked --no-editable --extra test --group benchmark python -m unittest discover -s tests -p 'test_*.py'
          ) 2>&1 | tee "${RUNNER_TEMP}/shared-crates-check.log"
      - name: Preserve locked Rust dependency evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: rust-dependencies-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/rust-dependencies
          if-no-files-found: error
      - name: Preserve shared crate diagnostics before independent assessments
        if: ${{ always() && (steps.shared_crates.outcome == 'success' || steps.shared_crates.outcome == 'failure') }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: shared-crates-check-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/shared-crates-check.log
          if-no-files-found: error
      - name: Preserve Python 3.12 numerical assessment coverage
        if: needs.plan.outputs.full == 'true'
        working-directory: rust
        # The native build matrix uses 3.14, but portable-math-exact still
        # requires independent observations from all three supported interpreters.
        # Reuse the Rust probe; this stdlib-only assessment needs no wheel build.
        run: uv run --no-project --python 3.12 python tools/assess_math.py --output "${RUNNER_TEMP}/math-assessment-3.12/math-assessment.json"
      - name: Preserve Python 3.13 numerical assessment coverage
        if: needs.plan.outputs.full == 'true'
        working-directory: rust
        run: uv run --no-project --python 3.13 python tools/assess_math.py --output "${RUNNER_TEMP}/math-assessment-3.13/math-assessment.json"
      - name: Assess decimal rounding independently
        if: always()
        working-directory: rust
        run: uv run --project ../python --locked --no-editable python tools/assess_rounding.py --output "${RUNNER_TEMP}/rounding-assessment.json"
      - name: Preserve candidate math assessment (not parity qualification)
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: math-assessment-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/math-assessment.json
          if-no-files-found: error
      - name: Preserve Python 3.12 candidate math assessment
        if: ${{ always() && needs.plan.outputs.full == 'true' }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: math-assessment-${{ matrix.os }}-3.12
          path: ${{ runner.temp }}/math-assessment-3.12/math-assessment.json
          if-no-files-found: error
      - name: Preserve Python 3.13 candidate math assessment
        if: ${{ always() && needs.plan.outputs.full == 'true' }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: math-assessment-${{ matrix.os }}-3.13
          path: ${{ runner.temp }}/math-assessment-3.13/math-assessment.json
          if-no-files-found: error
      - name: Preserve rounding assessment (not parity qualification)
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: rounding-assessment-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/rounding-assessment.json
          if-no-files-found: error
      - name: Preserve native regex assessment and historical disposition
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: regex-native-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/regex-native-assessment.json
          if-no-files-found: error

  dist:
    needs: plan
    name: native-dist (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.build) }}
    steps:
      # The source archive carries crate fixtures, so keep their bytes exact.
      - name: Preserve fixture bytes and symlinks on Windows
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust
          shared-key: native-dist-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check benchmark SDK lock versions
        run: python rust/tools/check_benchmark_sdk_versions.py
      - name: Install build tools
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          python -m pip install maturin==1.9.6 hatchling==1.27.0
      - name: Generate Python caches before packaging
        run: |
          python -m compileall -q -f -o 0 -o 1 python/src/yamaa
          python -m compileall -q -f -b python/src/yamaa
          python - <<'PYTHON'
          from pathlib import Path
          source = Path("python/src/yamaa")
          (source / "__pycache__" / "package-check.txt").write_text("generated cache\n", encoding="utf-8")
          (source / "package-check.pyo").write_bytes(b"generated legacy bytecode\n")
          PYTHON
      - name: Build wheel and source archive
        run: |
          (
            cd python
            maturin build --release --locked --out "${RUNNER_TEMP}/native-dist"
            python yamaa_build_backend.py "${RUNNER_TEMP}/native-dist"
          )
          python -m pip wheel --no-deps --no-build-isolation rust/tests/project-programs/python --wheel-dir "${RUNNER_TEMP}/project-dist"
          mkdir -p "${RUNNER_TEMP}/reference-dist"
          cp "${RUNNER_TEMP}"/native-dist/*.whl "${RUNNER_TEMP}/reference-dist/"
      - name: Check Python distribution contents
        run: |
          python rust/tools/check_python_package_hygiene.py "${RUNNER_TEMP}/native-dist"
          python rust/tools/check_cargo_lock.py --output-dir "${RUNNER_TEMP}/rust-dependencies" "${RUNNER_TEMP}"/native-dist/*.tar.gz
      - name: Preserve the reference host wheel
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: native-reference-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/reference-dist
          if-no-files-found: error
      - name: Preserve installed project program
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: native-project-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/project-dist
          if-no-files-found: error
      - name: Preserve locked Rust dependency evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: rust-dependencies-dist-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/rust-dependencies
          if-no-files-found: error
      - name: Preserve distributions
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: native-python-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/native-dist
          if-no-files-found: error

  qualify:
    name: native-qualify (${{ matrix.os }}, ${{ matrix.python }}, ${{ matrix.form }})
    needs: [plan, dist]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.qualify) }}
    steps:
      - name: Preserve fixture bytes and symlinks on Windows
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install build tools
        run: |
          python -m pip install uv==0.11.6 py-yaml12==0.2.0
          if [ "${{ matrix.form }}" = source ]; then
            rustup toolchain install 1.90.0 --profile minimal
          fi
      # Qualify the uploaded bytes, so the artifact names recorded in each
      # report identify exactly what was installed.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-python-${{ matrix.os }}-${{ env.NATIVE_BUILD_PYTHON }}
          path: ${{ runner.temp }}/native-dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-reference-${{ matrix.os }}-${{ env.NATIVE_BUILD_PYTHON }}
          path: ${{ runner.temp }}/reference-dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-project-${{ matrix.os }}-${{ env.NATIVE_BUILD_PYTHON }}
          path: ${{ runner.temp }}/project-dist
      - name: Record source revision and table requirements
        run: |
          echo "QUALIFICATION_SOURCE_REVISION=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"
          uv export --project python --locked --extra test --no-dev --no-emit-project --no-hashes --output-file "${RUNNER_TEMP}/table-requirements.txt"
      - name: Stage installed checks outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          python "${GITHUB_WORKSPACE}/.github/scripts/commands/installed.py" stage \
            --runtime python --staged-root "${RUNNER_TEMP}"
      - name: Install the wheel
        if: matrix.form == 'wheel'
        working-directory: ${{ runner.temp }}
        run: python -m pip install --no-deps -r table-requirements.txt native-dist/*.whl project-dist/*.whl
      - name: Rebuild and install from the source archive
        if: matrix.form == 'source'
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip install --no-deps -r table-requirements.txt
          python -m pip install --no-cache-dir --no-deps native-dist/*.tar.gz project-dist/*.whl
      - name: Report installed Python public benchmark conformance
        working-directory: ${{ runner.temp }}
        run: |
          python -I "${GITHUB_WORKSPACE}/rust/tools/public_conformance.py" plan \
            --fixtures "${GITHUB_WORKSPACE}/benchmarks" --output public-conformance-plan
          python -I "${GITHUB_WORKSPACE}/rust/tests/public_conformance.py" \
            --plan public-conformance-plan --fixtures "${GITHUB_WORKSPACE}/benchmarks" \
            --python-lock "${GITHUB_WORKSPACE}/python/uv.lock" \
            --output public-conformance/observed --source-revision "${QUALIFICATION_SOURCE_REVISION}" \
            --package-form "${{ matrix.form }}" \
            --evidence "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          python -I "${GITHUB_WORKSPACE}/rust/tools/public_conformance.py" compare \
            --fixtures "${GITHUB_WORKSPACE}/benchmarks" --observed public-conformance/observed \
            --output public-conformance/inventory.json \
            --ratchet "${GITHUB_WORKSPACE}/rust/qualification/public-conformance.json"
      - name: Preserve Python public benchmark inventory and saved artifacts
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: public-conformance-python-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.form }}
          path: ${{ runner.temp }}/public-conformance
          if-no-files-found: error
      - name: Qualify the installed package outside checkout
        working-directory: ${{ runner.temp }}
        env:
          FORM: ${{ matrix.form }}
          ARCHIVE: ${{ matrix.form == 'wheel' && '*.whl' || '*.tar.gz' }}
        run: |
          archives=(native-dist/${ARCHIVE})
          YAMAA_PUBLIC_REPORT_DIR="${RUNNER_TEMP}/qualification/${FORM}/public-reports" python -I "${GITHUB_WORKSPACE}/.github/scripts/commands/installed.py" run \
            --output "qualification/${FORM}/supplemental" --runtime python --staged-root "${RUNNER_TEMP}" \
            --source-revision "${QUALIFICATION_SOURCE_REVISION}" --package-form "${FORM}" \
            --artifact-reference "github-actions:${GITHUB_RUN_ID}/attempt-${GITHUB_RUN_ATTEMPT}/native-python-${{ matrix.os }}-${{ env.NATIVE_BUILD_PYTHON }}/$(basename "${archives[0]}")" \
            --host-artifact-reference "github-actions:${GITHUB_RUN_ID}/attempt-${GITHUB_RUN_ATTEMPT}/native-reference-${{ matrix.os }}-${{ env.NATIVE_BUILD_PYTHON }}/$(basename reference-dist/*.whl)" \
            --evidence "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Preserve native qualification reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: native-qualification-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.form }}
          path: ${{ runner.temp }}/qualification
          if-no-files-found: error

  math-portability:
    name: portable-math-exact
    needs: [plan, rust]
    if: needs.plan.outputs.run-rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: math-assessment-*
          path: math-assessments
      - name: Compare every candidate bit across the native matrix
        run: python rust/tools/check_math_portability.py math-assessments

  r:
    needs: plan
    if: needs.plan.outputs.run-r == 'true'
    name: native-r (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 40 || 20 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.r) }}
    steps:
      - name: Preserve fixture bytes and symlinks on Windows
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust
          shared-key: native-r-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: '4.6.1'
          rtools-version: ${{ runner.os == 'Windows' && '45' || '' }}
          use-public-rspm: true
      - name: Check benchmark SDK lock versions
        run: python rust/tools/check_benchmark_sdk_versions.py
      - name: Install Rust
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component clippy
          if [ "${{ runner.os }}" = Windows ]; then
            rustup target add --toolchain 1.90.0 x86_64-pc-windows-gnu
          fi
      - name: Record Windows R build toolchain
        if: runner.os == 'Windows'
        run: |
          mkdir -p "${RUNNER_TEMP}/windows-r-toolchain"
          Rscript --vanilla -e 'writeLines(c(R.version.string, R.version$platform, Sys.info(), Sys.getenv("RTOOLS45_HOME")))' > "${RUNNER_TEMP}/windows-r-toolchain/r-platform.txt"
          gcc --version > "${RUNNER_TEMP}/windows-r-toolchain/gcc-version.txt"
          make --version > "${RUNNER_TEMP}/windows-r-toolchain/make-version.txt"
          rustc -vV > "${RUNNER_TEMP}/windows-r-toolchain/rustc-version.txt"
          rustc --print cfg --target x86_64-pc-windows-gnu > "${RUNNER_TEMP}/windows-r-toolchain/rust-target.txt"
      - name: Check R binding
        if: runner.os != 'Windows'
        working-directory: rust
        run: cargo clippy --locked -p yamaa-r -- -D warnings
      - name: Check Windows R binding
        if: runner.os == 'Windows'
        working-directory: rust
        run: cargo clippy --locked --target x86_64-pc-windows-gnu -p yamaa-r -- -D warnings
      - name: Install the shared grammar fixture codec
        run: python -m pip install py-yaml12==0.2.0
      - name: Stage standalone R package
        run: python rust/tools/stage_r_package.py "${RUNNER_TEMP}/native-stage/yamaa"
      - name: Build and install R outside checkout
        id: r_install
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p native-r-library
          R CMD build --no-build-vignettes --no-manual native-stage/yamaa
          python "${GITHUB_WORKSPACE}/rust/tools/check_cargo_lock.py" --output-dir "${RUNNER_TEMP}/rust-dependencies" yamaa_0.4.0.tar.gz
          R CMD INSTALL --library="${RUNNER_TEMP}/native-r-library" "${GITHUB_WORKSPACE}/rust/tests/project-programs/r"
          R CMD INSTALL --library="${RUNNER_TEMP}/native-r-library" yamaa_0.4.0.tar.gz
          if [ "${{ runner.os }}" = Windows ]; then
            python -c 'from pathlib import Path; import shutil; dlls = list(Path("native-r-library/yamaa/libs").rglob("yamaa.dll")); assert len(dlls) == 1, "installed R DLL is missing or ambiguous"; shutil.copy2(dlls[0], "windows-r-toolchain/yamaa.dll")'
          fi
      - name: Install R package test dependencies
        working-directory: ${{ runner.temp }}
        env:
          R_LIBS: ${{ runner.temp }}/native-r-library
        run: |
          Rscript --vanilla - <<'RS'
          repository <- Sys.getenv("RSPM")
          if (!nzchar(repository)) repository <- "https://cloud.r-project.org"
          options(repos = c(CRAN = repository))
          description <- read.dcf(file.path(Sys.getenv("GITHUB_WORKSPACE"), "R/yamaa/DESCRIPTION"))
          suggests <- strsplit(description[1, "Suggests"], ",", fixed = TRUE)[[1]]
          packages <- trimws(sub("[[:space:]]*[(][^)]*[)]", "", suggests))
          install.packages(packages, lib = Sys.getenv("R_LIBS"))
          stopifnot(all(vapply(packages, requireNamespace, logical(1), quietly = TRUE)))
          RS
      - name: Report installed R public benchmark conformance
        if: ${{ always() && steps.r_install.outcome == 'success' }}
        working-directory: ${{ runner.temp }}
        env:
          R_LIBS: ${{ runner.temp }}/native-r-library
          PUBLIC_CONFORMANCE_PACKAGE_FORM: source
        run: |
          python -m pip install py-yaml12==0.2.0 pyarrow==25.0.1
          python -I "${GITHUB_WORKSPACE}/rust/tools/public_conformance.py" plan \
            --fixtures "${GITHUB_WORKSPACE}/benchmarks" --output public-conformance-plan
          Rscript --vanilla "${GITHUB_WORKSPACE}/rust/tests/test_public_conformance.R" \
            "${GITHUB_WORKSPACE}/rust/tests/public_conformance.R"
          Rscript --vanilla "${GITHUB_WORKSPACE}/rust/tests/public_conformance.R" \
            public-conformance-plan "${GITHUB_WORKSPACE}/benchmarks" public-conformance/observed \
            "$(git -C "${GITHUB_WORKSPACE}" rev-parse HEAD)"
          python -I "${GITHUB_WORKSPACE}/rust/tools/public_conformance.py" compare \
            --fixtures "${GITHUB_WORKSPACE}/benchmarks" --observed public-conformance/observed \
            --output public-conformance/inventory.json \
            --ratchet "${GITHUB_WORKSPACE}/rust/qualification/public-conformance.json"
      - name: Preserve R public benchmark inventory and saved artifacts
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: public-conformance-r-${{ matrix.os }}
          path: ${{ runner.temp }}/public-conformance
          if-no-files-found: error
      - name: Run installed R supplemental suites outside checkout
        if: ${{ always() && steps.r_install.outcome == 'success' }}
        working-directory: ${{ runner.temp }}
        run: |
          python "${GITHUB_WORKSPACE}/.github/scripts/commands/installed.py" stage \
            --runtime r --staged-root "${RUNNER_TEMP}"
          YAMAA_PUBLIC_REPORT_DIR="${RUNNER_TEMP}/qualification/r-source/public-reports" R_LIBS="${RUNNER_TEMP}/native-r-library" python -I "${GITHUB_WORKSPACE}/.github/scripts/commands/installed.py" run \
            --output qualification/r-source --runtime r --staged-root "${RUNNER_TEMP}" \
            --source-revision "$(git -C "${GITHUB_WORKSPACE}" rev-parse HEAD)" --package-form source \
            --artifact-reference "github-actions:${GITHUB_RUN_ID}/attempt-${GITHUB_RUN_ATTEMPT}/native-r-${{ matrix.os }}/yamaa_0.4.0.tar.gz" \
            --evidence "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Require repository validator real-R public Check transport
        if: ${{ always() && steps.r_install.outcome == 'success' }}
        working-directory: ${{ runner.temp }}
        env:
          R_LIBS: ${{ runner.temp }}/native-r-library
        run: |
          Rscript --vanilla - <<'RS'
          version <- "2.0.0"
          archive <- paste0("jsonlite_", version, ".tar.gz")
          urls <- c(paste0("https://cran.r-project.org/src/contrib/", archive),
                    paste0("https://cran.r-project.org/src/contrib/Archive/jsonlite/", archive))
          target <- tempfile(fileext = ".tar.gz")
          downloaded <- FALSE
          for (url in urls) {
            downloaded <- tryCatch({
              download.file(url, target, mode = "wb", quiet = TRUE) == 0L
            }, error = function(error) FALSE)
            if (downloaded) break
          }
          stopifnot(downloaded)
          install.packages(target, repos = NULL, type = "source", lib = Sys.getenv("R_LIBS"))
          stopifnot(as.character(utils::packageVersion("jsonlite")) == version)
          RS
          cp "${GITHUB_WORKSPACE}/.github/scripts/yaml-validation/_r_check_transport.py" _r_check_transport.py
          cp "${GITHUB_WORKSPACE}/rust/tests/check_repository_r_transport.py" check_repository_r_transport.py
          python -I check_repository_r_transport.py
      - name: Check R source package outside checkout
        id: r_package_check
        working-directory: ${{ runner.temp }}
        env:
          _R_CHECK_CRAN_INCOMING_REMOTE_: 'false'
          R_LIBS: ${{ runner.temp }}/native-r-library
        run: |
          python "${GITHUB_WORKSPACE}/.github/scripts/commands/check_r.py" \
            --archive "${RUNNER_TEMP}/yamaa_0.4.0.tar.gz" --work-dir "${RUNNER_TEMP}/native-r-check"
      - name: Preserve R package check
        if: ${{ always() && (steps.r_package_check.outcome == 'success' || steps.r_package_check.outcome == 'failure') }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: native-r-check-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/native-r-check/source-revision.txt
            ${{ runner.temp }}/native-r-check/yamaa.Rcheck/00check.log
            ${{ runner.temp }}/native-r-check/yamaa.Rcheck/00install.out
            ${{ runner.temp }}/native-r-check/yamaa.Rcheck/tests/*.Rout*
          if-no-files-found: error
      - name: Preserve R supplemental qualification
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: native-r-qualification-${{ matrix.os }}
          path: ${{ runner.temp }}/qualification
          if-no-files-found: error
      - name: Preserve Windows R build toolchain
        if: ${{ always() && runner.os == 'Windows' }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: windows-r-toolchain-${{ matrix.os }}
          path: ${{ runner.temp }}/windows-r-toolchain
          if-no-files-found: error
      - name: Preserve locked Rust dependency evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: rust-dependencies-r-${{ matrix.os }}
          path: ${{ runner.temp }}/rust-dependencies
          if-no-files-found: error
      - name: Preserve source archive
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: native-r-${{ matrix.os }}
          path: ${{ runner.temp }}/yamaa_0.4.0.tar.gz

  public-cohort:
    name: public-cohort-complete-runs
    needs: [plan, qualify, r]
    # Complete cohort comparisons run with the full installed matrix.
    if: >-
      ${{ !cancelled() && needs.plan.outputs.full == 'true'
          && needs.qualify.result == 'success' && needs.r.result == 'success' }}
    runs-on: ${{ needs.plan.outputs.compare-os }}
    timeout-minutes: 10
    steps:
      - name: Preserve fixture bytes and symlinks on Windows
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-qualification-*
          path: ${{ runner.temp }}/cohort-input
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.plan.outputs.run-r == 'true'
        with:
          pattern: native-r-qualification-*
          path: ${{ runner.temp }}/cohort-input
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-reference-${{ needs.plan.outputs.compare-os }}-${{ env.NATIVE_BUILD_PYTHON }}
          path: ${{ runner.temp }}/cohort-reference
      - name: Install the qualified package for comparison only
        run: |
          python -m pip install uv==0.11.6
          uv export --project python --locked --no-dev --no-emit-project --no-hashes --output-file "${RUNNER_TEMP}/cohort-requirements.txt"
          python -m pip install --no-deps -r "${RUNNER_TEMP}/cohort-requirements.txt" "${RUNNER_TEMP}"/cohort-reference/*.whl
      - name: Require complete public runs through the M1 comparator
        working-directory: ${{ runner.temp }}
        env:
          QUALIFICATION_MATRIX: ${{ needs.plan.outputs.qualify }}
        run: python -I "${GITHUB_WORKSPACE}/.github/scripts/ci/native_matrix.py" compare
      - name: Preserve complete public cohort inventory
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: native-public-cohort
          path: ${{ runner.temp }}/public-cohort
          if-no-files-found: error

  audit:
    name: native-run-evidence-audit
    needs: [plan, rust, dist, qualify, r, math-portability, public-cohort]
    # Retain failed-run evidence, but let superseded cancelled runs release refs.
    if: ${{ !cancelled() && github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Main retains its observational audit; qualification branches require it.
    continue-on-error: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install locked independent evidence readers
        run: |
          python -m pip install uv==0.11.6
          uv export --project python --locked --no-dev --no-emit-project --no-hashes --output-file "${RUNNER_TEMP}/audit-requirements.txt"
          python -m pip install --no-deps -r "${RUNNER_TEMP}/audit-requirements.txt"
      - name: Audit the exact source run and retained installed evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python rust/tools/audit_native_run.py --run-id "${GITHUB_RUN_ID}" \
            --repository "${GITHUB_REPOSITORY}" --output "${RUNNER_TEMP}/native-run-audit" --check
      - name: Show the evidence record
        if: always()
        run: |
          if test -f "${RUNNER_TEMP}/native-run-audit/qualification.md"; then
            cat "${RUNNER_TEMP}/native-run-audit/qualification.md" >> "${GITHUB_STEP_SUMMARY}"
          fi
      - name: Preserve independent native run audit
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: native-run-audit
          path: ${{ runner.temp }}/native-run-audit
          if-no-files-found: error
      - name: Preserve independently readable audit record
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: native-run-audit-record
          path: |
            ${{ runner.temp }}/native-run-audit/qualification.json
            ${{ runner.temp }}/native-run-audit/qualification.md
            ${{ runner.temp }}/native-run-audit/input/run.json
            ${{ runner.temp }}/native-run-audit/input/source.json
            ${{ runner.temp }}/native-run-audit/input/jobs.json
            ${{ runner.temp }}/native-run-audit/input/artifacts.json
          if-no-files-found: error

  # Branch dispatches check changed components independently of installed qualification.
  numeric_tool_obligations:
    needs: plan
    if: needs.plan.outputs.full == 'true' && needs.plan.outputs.run-rust != 'true'
    name: native-numeric-tools (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 35 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    steps:
      - name: Preserve fixture bytes and symlinks on Windows
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust
          shared-key: native-numeric-tools-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install locked toolchain and package tools
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          python -m pip install uv==0.11.6
      - name: Preserve original spans, parser precedence and numerical policy truth
        working-directory: rust
        run: cargo test --locked -p yamaa-core --test numeric_parser --test aggregate_parser --test predicate_parser --test rounding --test regex --test math_policy --test portable_math_golden
      - name: Replay independent syntax and numeric checks
        working-directory: rust
        run: |
          set -e
          uv run --project ../python --locked --no-editable python tools/check_numeric_grammar.py
          uv run --project ../python --locked --no-editable python tools/check_aggregate_grammar.py
          uv run --project ../python --locked --no-editable python tools/check_numeric_syntax.py
          uv run --project ../python --locked --no-editable python tools/check_predicate_syntax.py
          uv run --project ../python --locked --no-editable python tools/check_regex.py
          uv run --project ../python --locked --no-editable python tools/check_rounding.py
          uv run --project ../python --locked --no-editable python tools/assess_regex_reference.py > "${RUNNER_TEMP}/regex-native-assessment.json"
          uv run --project ../python --locked --no-editable python tools/assess_rounding.py --output "${RUNNER_TEMP}/rounding-assessment.json"
          uv run --project ../python --locked --no-editable python -m unittest discover -s tests -p test_native_numeric_tools.py -v
          uv run --project ../python --locked --no-editable python -m unittest discover -s tests -p test_predicate_syntax_encoding.py -v
          uv run --project ../python --locked --no-editable python -m unittest discover -s tests -p test_portable_math.py -v
          uv run --project ../python --locked --no-editable python -m unittest discover -s tests -p test_rounding_assessment.py -v
          uv run --project ../python --locked --no-editable python -m unittest discover -s tests -p test_rounding_check.py -v
      - name: Retain component evidence without claiming installed matrix qualification
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: native-numeric-tools-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/regex-native-assessment.json
            ${{ runner.temp }}/rounding-assessment.json
          if-no-files-found: error
