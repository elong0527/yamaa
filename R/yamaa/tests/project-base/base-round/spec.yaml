schema_version: '1.0'
domain: TEST
keys: [ID]
input: {SOURCE: {path: input/source.csv, types: {ID: str, VALUE: float}}}
columns:
  - {name: ID, type: str, derivation: SOURCE.ID}
  - name: RESULT
    type: float
    derivation: {function: {name: rounded_value, args: {x: SOURCE.VALUE}}}
output: {path: test.csv, columns: [ID, RESULT]}
