- id: new.spec.copy
  file_type: spec
  path: columns[].copy
  today: null
  kind: new
  proposed: 'copy: {dataset: INPUT, columns: [NAME, ...], submission: {core, mandatory, role}}'
  decision: decided (D58)
  ref: P-COPY-1
  reason: 'D19 decides the copy entry; the spelling is this RFC''s. `dataset` already names the relation
    a construct reads (intermediates, row templates); #3030''s sketch writes `from`. Same-name copies
    of an input linked through `schema` only; type, label and content metadata come from the producer,
    origin is Predecessor, and the optional `submission` holds only core, mandatory and role. It expands
    to ordinary columns in the resolved specification.'
  field_kind: structure
  convert: {action: transform, transform: write_new_field}
- id: new.spec.input.key
  file_type: spec
  path: input.*.key
  today: null
  kind: new
  proposed: 'key: [COLUMN, ...]'
  decision: decided (D58)
  ref: P-JOIN-1
  reason: 'D23 decides that an implicit join takes its keys from a declaration on the input; the spelling
    is this RFC''s: `key`, a list of the input''s columns, each paired with the current row''s same-named
    value (LOOKUP-5''s list form). Required on every input an implicit join or a keyless qualified aggregate
    reads; LOOKUP-1 changes. The converter writes 86 benchmark declarations (59 join pairs, 8 of them
    on rows another template''s driver built, and 32 inputs of keyless qualified aggregates, 5 overlapping)
    in 76 specifications; no input infers two keys.'
  field_kind: identifier
  convert: {action: transform, transform: declare_input_key}
- id: new.spec.input.byte_order_mark
  file_type: spec
  path: input.*.byte_order_mark
  today: null
  kind: new
  proposed: 'byte_order_mark: true'
  decision: decided (D79)
  reason: 'An addition to the approved table under D27, whose spelling the owner confirmed on 2026-10-20
    (D79). D15 admits a leading UTF-8 byte-order mark on a CSV input only where the input declares it.
    Optional and additive (I5): when true, the csv source must begin with one mark, which is skipped, and
    a source without one fails as source_byte_order_mark; absent, a mark fails as it does in 0.5.0; on
    an input that another profile reads, the field fails as value_not_permitted (CSV-10). A CSV `encoding`
    value was not taken, because `encoding` stays SAS-only (P-UNU-1, SAS-2). No 0.5 file declares a
    mark, so the converter writes none.'
  field_kind: value
  convert: {action: none}
