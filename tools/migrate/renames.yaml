- id: new.spec.column_verifications.not_missing.when
  file_type: spec
  path: columns[].verifications[].not_missing.when
  today: null
  kind: new
  proposed: 'not_missing: {when: PREDICATE}'
  decision: decided (D208)
  reason: 'An addition to the approved table under D27 (D206, D208). Optional, with no default (I5): the
    check reads only the output rows whose `when` is TRUE, as an assert''s `when` selects rows, and a row
    whose `when` is FALSE or UNKNOWN passes; an unknown column fails as unknown_field (CHECK-5, CHECK-4).
    No 0.5 file declares it, so the converter wrote none.'
  field_kind: expression
  convert: {action: none}
- id: new.spec.column_verifications.not_missing.max_fraction
  file_type: spec
  path: columns[].verifications[].not_missing.max_fraction
  today: null
  kind: new
  proposed: 'not_missing: {max_fraction: 0.05}'
  decision: decided (D208)
  reason: 'An addition to the approved table under D27 (D206, D208). Optional, with no default (I5): the
    check passes while the checked rows whose value is missing are at most this share of the checked rows,
    compared as a row_count share is, and a share outside 0 through 1 fails as invalid_declaration (CHECK-5,
    CHECK-4). No 0.5 file declares it, so the converter wrote none.'
  field_kind: value
  convert: {action: none}
- id: new.spec.intermediate_unique_arguments.severity
  file_type: spec
  path: intermediates[].verifications[].unique.severity
  today: null
  kind: new
  proposed: 'unique: {columns: [COLUMN, ...], severity: warning}'
  decision: decided (D210)
  reason: 'An addition to the approved table under D27 (D206, D210). Optional, `error` by default, as on a
    dataset unique (CHECK-2); `warning` is permitted only on an intermediate that declares keep and order_by,
    or nearest (#3693), and fails as value_not_permitted elsewhere (LOOKUP-17). No 0.5 file declares it, so
    the converter wrote none.'
  field_kind: value
  convert: {action: none}
- id: new.spec.intermediate.nearest
  file_type: spec
  path: intermediates[].nearest
  today: null
  kind: new
  proposed: 'nearest: {source: FIELD, to: VALUE, unit: UNIT}'
  decision: decided (D206)
  reason: 'An addition to the approved table under D27 (D206), spelled under D241. Optional, with no default
    (I5): a named intermediate selects the candidate whose date or datetime `source` lies nearest `to`, a
    value of the current row read as a key match value is, counted in `unit` as diff counts it, a tie going
    to the earlier source and then to stored order; beside order_by or keep it fails as prohibited_construct
    (LOOKUP-26). No 0.5 file declares it, so the converter wrote none.'
  field_kind: structure
  convert: {action: none}
- id: new.spec.intermediate.inner_join
  file_type: spec
  path: intermediates[].inner_join
  today: null
  kind: new
  proposed: 'inner_join: RELATION'
  decision: decided (D263)
  reason: 'An owner addition to the approved table (D263). Optional, with no default (I5): a named
    intermediate writing it is the pair relation, one record per matching pair of its `dataset`, the left
    side, and this relation, the right side, on its required `key`, in left then right stored order; beside
    between, order_by, keep, nearest, absent or require_match, or with SELF as a side, it fails as
    prohibited_construct (LOOKUP-27). No 0.5 file declares it, so the converter wrote none.'
  field_kind: identifier
  convert: {action: none}
- id: new.spec.include
  file_type: spec
  path: include
  today: null
  kind: new
  proposed: 'include: [FRAGMENT, ...]'
  decision: decided (D206)
  reason: 'An addition to the approved table under D27 (D206). Optional: the local spec fragments a layer
    composes after its parent chain and before its own fields, in list order. A fragment declares neither
    parent nor include, and a file reaches one composition at most once (LAYER-3, LAYER-4). No 0.5 file
    declares it, so the converter wrote none.'
  field_kind: path
  convert: {action: none}
- id: new.spec.str_case.to=proper
  file_type: spec
  path: columns[].derivation.str_case.to
  today: null
  kind: new
  proposed: proper
  decision: decided (D264)
  reason: 'An addition to the approved table under D27 (D264), spelled under D241: proper case as SAS PROPCASE
    writes it, every ASCII letter lowered, then the first character and each character directly after a
    delimiter raised; `title` keeps its meaning (TEXT-5). No 0.5 file declares it, so the converter wrote
    none.'
  field_kind: value
  convert: {action: none}
- id: new.spec.str_case.delimiters
  file_type: spec
  path: columns[].derivation.str_case.delimiters
  today: null
  kind: new
  proposed: 'str_case: {to: proper, delimiters: " /-(.,["}'
  decision: decided (D264)
  reason: 'An addition to the approved table under D27 (D264), spelled under D241. Optional, with no schema
    default (I5): the ASCII characters, each listed once, after which `to: proper` raises the next character;
    without it `proper` takes SAS PROPCASE''s six, the blank, slash, hyphen, open parenthesis, period and
    tab. Beside another mode it fails as unknown_field, and an empty list, a repeated character or one outside
    ASCII as invalid_field_type (TEXT-5). No 0.5 file declares it, so the converter wrote none.'
  field_kind: value
  convert: {action: none}
- id: new.spec.expressions.duration_text
  file_type: spec
  path: columns[].derivation.duration_text
  today: null
  kind: new
  proposed: 'duration_text: {source: VARIABLE, unit: second | minute | hour | day}'
  decision: decided (D264)
  reason: 'An addition to the approved table under D27 (D264), spelled under D241. The inverse of
    duration_value: an int or float amount of the declared elapsed unit is written as one canonical ISO 8601
    fixed-length duration text, days the largest unit, every zero component omitted and a fraction on the
    seconds alone (TIME-21). No 0.5 file declares it, so the converter wrote none.'
  convert: {action: none}
- id: new.spec.expressions.str_substr
  file_type: spec
  path: columns[].derivation.str_substr
  today: null
  kind: new
  proposed: 'str_substr: {source: VARIABLE, start: INT, length: INT, missing: VALUE}'
  decision: decided (D264)
  reason: 'An addition to the approved table under D27: the owner put the batch 14 language additions in
    1.0.0 (D263, D264), spelled under D241. At most `length` Unicode scalar values of a text source from
    position `start`, counted from 1, or every one to the end without `length`; a start past the end gives
    missing, and a start or length below one fails as invalid_field_type (TEXT-13). `start` is required
    unless `piece` is declared (new.spec.expressions.str_substr.piece). No 0.5 file declares it, so the
    converter wrote none.'
  convert: {action: none}
- id: new.spec.expressions.str_substr.piece
  file_type: spec
  path: columns[].derivation.str_substr.piece
  today: null
  kind: new
  proposed: 'str_substr: {source: VARIABLE, length: INT, piece: INT}'
  decision: decided (owner on #3959)
  reason: 'An addition to the approved table under D27: the owner chose a field of str_substr over a new verb
    on #3959. Optional, with no default (I5): which piece, counted from 1, of a text broken between words
    into pieces of at most `length` scalars, as SDTM splits a long value; declared instead of `start`, which
    is then refused as unknown_field, and with `length` required (TEXT-16). No 0.5 file declares it, so the
    converter wrote none.'
  field_kind: value
  convert: {action: none}
- id: new.spec.expressions.str_length
  file_type: spec
  path: columns[].derivation.str_length
  today: null
  kind: new
  proposed: 'str_length: {source: VARIABLE, missing: VALUE}'
  decision: decided (D264)
  reason: 'An addition to the approved table under D27: the owner put the batch 14 language additions in
    1.0.0 (D263, D264), spelled under D241. The number of Unicode scalar values in a text source, as int,
    the count a declared length bounds (TEXT-14). No 0.5 file declares it, so the converter wrote none.'
  convert: {action: none}
- id: new.spec.expressions.str_decimal
  file_type: spec
  path: columns[].derivation.str_decimal
  today: null
  kind: new
  proposed: 'str_decimal: {source: VARIABLE, decimals: INT, width: INT, missing: VALUE}'
  decision: decided (D264)
  reason: 'An addition to the approved table under D27: the owner put the batch 14 language additions in
    1.0.0 (D263, D264), spelled under D241. A number written as text with exactly `decimals` digits after
    the point, rounded by the one rounding as CSV display precision is, then left-padded with spaces to at
    least `width` and never truncated, as SAS put(x, w.d) writes a value that fits; a source that is not a
    number fails as incompatible_input_type, and decimals below zero or a width below one as
    invalid_field_type (TEXT-15, FORMULA-16, CSV-9). No 0.5 file declares it, so the converter wrote none.'
  convert: {action: none}
- id: new.spec.aggregate_class.order_by
  file_type: spec
  path: columns[].derivation.aggregate.order_by
  today: null
  kind: new
  proposed: 'aggregate: {order_by: [TERM, ...], separator: TEXT, expr: "STR_JOIN(x)"}'
  decision: decided (D264)
  reason: 'An addition to the approved table under D27 (D264): the owner decided on 2026-10-24 that STR_JOIN
    ships in 1.0.0 with order_by, separator and distinct as fields of the aggregate (#3774). Optional, with
    no default (I5): the order STR_JOIN joins a group''s values in, VALUE-22 terms over the relation''s fields
    and the derivations'' variables, ties in stored order; required beside STR_JOIN and refused beside any
    other expression as unpaired_fields (FORMULA-18, LOOKUP-10). No 0.5 file declares it, so the converter
    wrote none.'
  field_kind: name
  convert: {action: none}
- id: new.spec.aggregate_class.separator
  file_type: spec
  path: columns[].derivation.aggregate.separator
  today: null
  kind: new
  proposed: 'aggregate: {separator: ", "}'
  decision: decided (D264)
  reason: 'An addition to the approved table under D27 (D264), as new.spec.aggregate_class.order_by (#3774).
    Optional, with no default (I5): the text STR_JOIN writes between two joined values, the empty string
    included; required beside STR_JOIN and refused beside any other expression as unpaired_fields
    (FORMULA-18). No 0.5 file declares it, so the converter wrote none.'
  field_kind: value
  convert: {action: none}
- id: new.spec.aggregate_class.distinct
  file_type: spec
  path: columns[].derivation.aggregate.distinct
  today: null
  kind: new
  proposed: 'aggregate: {distinct: true}'
  decision: decided (D264)
  reason: 'An addition to the approved table under D27 (D264), as new.spec.aggregate_class.order_by (#3774).
    Optional, with no default (I5): STR_JOIN writes each text once and COUNT(x) counts each different value
    once; omitted, every value counts. Beside anything but a bare STR_JOIN(x) or COUNT(x) it is refused as
    unpaired_fields (FORMULA-18). No 0.5 file declares it, so the converter wrote none.'
  field_kind: value
  convert: {action: none}
- id: new.spec.expressions.date_text
  file_type: spec
  path: columns[].derivation.date_text
  today: null
  kind: new
  proposed: 'date_text: {source: VARIABLE, forms: [FORM, ...], invalid: VALUE}'
  decision: decided (D264)
  reason: 'An addition to the approved table under D27 (D264, from #3731), spelled under D241. A new verb:
    `source`, the text read; `forms`, a required list of the closed date forms iso, ddmonyyyy, mdy_slash,
    dmy_slash, yyyymmdd and monyyyy, at least one, each named once and with at most one of the two slash
    orders; and the optional `invalid` handler. It returns the collected date text that the form reading
    the whole source denotes, which impute then reads (TIME-22). No 0.5 file declares it, so the converter
    wrote none.'
  convert: {action: none}
- id: new.spec.aggregate_class.quantile
  file_type: spec
  path: columns[].derivation.aggregate.quantile
  today: null
  kind: new
  proposed: 'aggregate: {quantile: 0.9, expr: "QUANTILE(x)"}'
  decision: decided (D264)
  reason: 'An addition to the approved table under D27 (D264): the owner decided on 2026-10-24 that the
    statistical reducers ship in 1.0.0, a quantile following R''s default, type 7 of Hyndman and Fan (#3779).
    Optional, with no default (I5): the probability, from 0 through 1, at which QUANTILE reads its quantile;
    required beside QUANTILE and refused beside any other expression as unpaired_fields, and a value outside
    0 through 1 fails as invalid_field_type (FORMULA-18). No 0.5 file declares it, so the converter wrote
    none.'
  field_kind: value
  convert: {action: none}
