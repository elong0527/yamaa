# yamaa 1.0 rename table (approved; historical since #3443)
#
# Phase 0 of #3030, item 2. Status: approved. The owner approved the table
# as a whole on #3030 (D58, 2026-10-19), with the answers to the design
# document's questions (D59 to D70). The design document
# docs/design/interface-1.0.md gives the reasons, the measurements and the
# options not taken; the item ids below (P-...) are its RFC items.
#
# What this file is. It maps every field, registry keyword and enumerated
# value of the 0.5.0 schemas (yaml/schema*.yaml at the yamaa-v0.5.0 tag),
# which it calls today's, to its 1.0 spelling, or to "removed" with the
# reason, and lists the fields 1.0 adds. Phase 2's internal converter (D35)
# was driven by it and wrote the repository's 0.5 files in 1.0; once none
# was left, #3443 deleted the converter. The table stays as the record of
# the rename, which the 1.0.0 release notes link, and changes only to
# correct that record. tools/tests/test_schema_v1.py compares each entry's
# 1.0 spelling, type, requirement, default and kind with the 1.0 schema.
#
# Measured at main 1758ad145. Counts are occurrences in parsed documents.
#
# Format (format_version 1). Top-level keys:
#
#   format, format_version, status, measured_at, design
#                     identify the file and the commit it was measured at.
#   summary           entry counts by kind and decision.
#   transforms        the named transforms that `convert` refers to, each a
#                     one-line description of what the converter wrote.
#   entries           one entry per field, registry keyword and enumerated
#                     value of today's schemas, then the fields 1.0 adds.
#   conditions        registered conditions that 1.0 renames, retires or
#                     restates, and the new conditions the RFC proposes.
#   paths             diagnostic spec-path segments that change; the only
#                     change #3030 section 1 permits in an expected file is
#                     such a path in a negative expected/error.yaml.
#   issues_columns    the issues-table columns D28 renames and adds.
#   reserved          spellings documented now and admitted by no 1.0 file
#                     (I5); the version rule admits each one later.
#
# Entry fields:
#
#   id            stable id: <file type>.<owner>.<field>[=<value>], or
#                 new.<file type>.<path> for a field 1.0 adds.
#   file_type     the 1.0 file type that owns the item: spec, project,
#                 codelists or function; `environment` entries describe the
#                 file type D8 removes.
#   schema        today's location, yaml/<file>#<owner>.<field>; an owner is
#                 a named class or a registry payload such as
#                 expressions.diff.
#   path          today's shortest path from the file root; [] is a list
#                 entry and * a map key. Function entries give the path in
#                 today's environment file; in 1.0 the function file's root
#                 is the definition itself.
#   today         the 0.5.0 field name, keyword or value.
#   type, required, default
#                 today's schema descriptor (required only when true).
#   kind          keep | rename | removed | new | reshape | value. `value` is
#                 an enumerated value that changes; unchanged values are
#                 `keep`.
#   proposed      the 1.0 spelling, when it differs from `today`.
#   decision      `decided (Dn)`: the owner decision on #3030 that fixes the
#                 entry. D58 decided every entry the RFC proposed, including
#                 each proposal to keep today's spelling (kind keep).
#   ref           the RFC item id in the design document.
#   reason        why, citing rule cards by id.
#   field_kind    the D31 kind of the 1.0 field: expression (grammar text),
#                 name (one variable, bare or qualified), identifier (a
#                 declared name), value (a constant; bare text is text),
#                 path, or structure. Expression and name are D31's
#                 expression fields; value, identifier and path are its
#                 value fields.
#   convert       what the converter did: {action: none | rename_key |
#                 rename_value | delete_key | transform}, with the new name,
#                 value or the transform's name.
#   measurement   occurrences by area: bench (benchmarks/ files and README
#                 blocks), rust (rust/ tests, sources and host fixtures),
#                 hosts (python/, R/), docs (docs/, rules/, yaml/), tools
#                 (tools/, evaluations/), and total.
#
# How it was approved. The owner approved the table as a whole on #3030
# (D58), so every entry the RFC proposed is decided. A later change to this
# file needs the owner's approval on #3030 in the same way (D27); an entry
# added so names the decision that approved it, as
# new.spec.input.byte_order_mark names D79.

format: yamaa.rename-table
format_version: 1
status: approved
measured_at: 1758ad145
design: docs/design/interface-1.0.md
summary:
  entries: 658
  changes: 89
  by_kind_and_decision:
    keep, decided: 569
    new, decided: 43
    removed, decided: 13
    rename, decided: 9
    reshape, decided: 19
    value, decided: 5
  conditions: 20
  paths: 13
  reserved: 22
transforms:
  header: replace schema_version with yamaa (same version text, quoted) and type
  environment_to_function_files: 'merge each function''s python and r definitions into one type: function
    file at functions/<name>.yaml beside the project file (name from the map key, implementations from
    each host''s function); move each declared lock to project environments.<host>.lock, rewritten relative
    to the project file, and write no environments entry for a host that declared no lock; list the files
    in project functions; delete the environment files'
  literal_to_expression: '{literal: text} -> "''text''" (quotes doubled); {literal: number|bool} -> the
    YAML scalar; {literal: null} -> null'
  compute_to_text: '{compute: {expr: E}} -> E'
  source_wrapper_to_text: '{source: X} with a string X (handled wrapper value, key match value) -> X'
  null_handler: '{literal: null} in a value field -> null; in a single-layer spec a handler whose default
    is missing is deleted instead (P-HND-3); in a child layer it stays as null'
  tagged_literal_to_text: 'function argument {literal: t} -> "''t''", {date: d} -> "DATE ''d''", {datetime:
    t} -> "DATETIME ''t''"'
  untag_function_value: 'function-file {date: d} / {datetime: t} -> d / t (optional, P-FN-1)'
  unwrap_value: 'intermediate untyped {value: E} -> E'
  clear_from_null: a YAML null in a child layer -> an entry of root clear (P-CLR-1), never a null; an
    emptied column entry is dropped; YAML null elsewhere in a value field stays (now missing) or is deleted
    where it restates a default
  write_inferred_intermediate_key: 'write today''s applicable keys as key: [..] on a lookup intermediate
    that omits it; skip an intermediate that drives a row template (D23-R1); list an intermediate with
    no applicable key for manual repair'
  declare_input_key: for each input read through an implicit join or a keyless qualified aggregate, write
    input.<name>.key with today's applicable keys, read from the input's CSV header, Parquet schema or
    schema producer (P-JOIN-1, P-KEY-1)
  wrap_in_list: 'standard: {...} -> standards: [{...}]'
  origin_to_list: 'origin: {...} -> origins: [{...}] (P-ORIGIN-1); several origins are written as list
    entries'
  derive_to_derivations: 'derive: [{name: N, type: T, derivation: E}] -> derivations: {N: {type: T, derivation:
    E}}'
  drop_empty_row_derivations: 'rows[].derivations: {} -> omitted (P-HND-4)'
  bare_empty_verification: '- not_missing: {} -> - not_missing (P-HND-4)'
  tie_break_to_window_order_by: 'baseline_flag {date: D, tie_break: [T..]} -> window.order_by: [D, T..]'
  cut_right_to_closed: 'cut right: true -> closed: right; right: false (or absent) -> nothing (closed:
    left is the default)'
  write_new_field: 'a new field the converter writes where the old surface implied it: model from the
    project section or benchmark.yaml `standard` (P-MODEL-1), clear from child-layer nulls (P-CLR-1)'
  rename_condition: rename a condition name in code, tests and negative expected files (condition entries)
  rewrite_path: rewrite a diagnostic spec-path segment (paths entries)
  suppression_comment: '# yamaa-style: allow ... -> # yamaa-lint: allow ... (P-LINT-1)'
