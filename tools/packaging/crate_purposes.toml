num-traits = "transitive dependency of num, num-bigint, chrono and half: numeric traits"
once_cell = "transitive dependency of ahash, of pyo3 in the Python binding and of extendr-api in the R binding: lazily initialized values"
paste = "procedural macro: identifier pasting in extendr-api in the R binding"
pin-project-lite = "not compiled: transitive dependency of futures-util (wasm32 only)"
pkg-config = "build script: lets zstd-sys use a system zstd when asked; the bundled one is the default"
portable-atomic = "not compiled: pyo3's atomics on targets without 64-bit atomics"
proc-macro2 = "procedural macro: the token streams of every procedural macro"
pyo3 = "the Python binding's interface to CPython through its stable ABI (yamaa-python)"
