# Why yamaa ships each crate of its Rust graph: one purpose per crate name,
# covering every locked release of that name.
#
# A host's source archive ships the crates of its trimmed lock, which
# tools/staging/engine_bundle.py stages (#3030 D55): the engine crates, the
# boundary crates, that host's binding crate, the vendored YAML parser and
# every crates.io crate
# that they reach on any platform with any feature, all vendored. The crates
# that only build scripts and procedural macros use are shipped and compiled
# with the rest. The crates that Cargo locks for a platform or a feature that
# no yamaa build selects are shipped as their manifests alone, never compiled
# (tools/staging/vendor_crates.py). Each of them has a purpose too. The
# command line has no source archive; its trimmed lock, with yamaa-cli in
# place of the boundary and binding crates, is the graph that its binaries
# build from, and
# its inventory lists it too.
#
# A purpose is a short phrase written from the crate's place in yamaa's
# graph. From rust/, `cargo tree --locked --offline --workspace --target all
# -i <crate>` shows what pulls a crate in.
#   - yamaa's own crates and their direct dependencies say what yamaa uses
#     them for, naming the Cargo feature that selects an optional one.
#   - Other crates that the native libraries link start "transitive
#     dependency of", naming the crates that need them.
#   - Crates that run only while compiling start "build script:" or
#     "procedural macro:".
#   - Crates that no supported target compiles (TARGETS in
#     tools/packaging/check_minimum_rust.py) start "not compiled:" and say
#     what locks them.
#   - The inventory of every host that ships a crate shows the crate's one
#     purpose, so the purpose holds for each of those hosts: a crate that
#     only one binding pulls in is named with that binding, as in "of pyo3
#     in the Python binding".
#
# tools/packaging/check_crate_purposes.py, which `make check-repository`
# runs, fails while a crate of any host's trimmed lock has no purpose, a
# purpose names a crate that no host ships, or a purpose is empty. It also
# holds the [unconditional] tables at the end of this file to the engine
# crates' manifests.
#
# Every package ships these purposes in its component inventory,
# COMPONENTS.tsv; after changing one, regenerate the inventories with
# `python -m tools.packaging.generate_component_inventory --write`. The
# inventories do not carry the reasons of the [unconditional] tables.
#
# A purpose that starts "build script:", "procedural macro:" or "not
# compiled:" marks a crate that the native code does not link; any other
# purpose marks a linked one. Each host's LICENSE-THIRD-PARTY.txt lists the
# crates that its binding links, as its release build's features select
# them, and the inventory check fails while a notice lists a crate that its
# host's inventory does not mark as linked, or no release of a name that the
# inventory marks as linked. One purpose covers every release of a name: a
# name with a linked release keeps a linked purpose, whose text says which
# other release is not compiled.

[crates]
adler2 = "transitive dependency of miniz_oxide: Adler-32 checksums of zlib streams"
ahash = "transitive dependency of arrow-array: the hasher of its hash tables"
aho-corasick = "not compiled: locked because the std features of regex and regex-automata name it; yamaa-core leaves regex's perf-literal feature off"
alloc-no-stdlib = "transitive dependency of brotli: its allocator interface"
alloc-stdlib = "transitive dependency of brotli: the standard library allocator behind that interface"
android_system_properties = "not compiled: iana-time-zone's time zone lookup on Android"
arraydeque = "transitive dependency of yamaa-saphyr-parser: the fixed-capacity buffer of its scanner"
arrow-array = "Arrow arrays: the Arrow form of tables at the hosts' edge (the arrow feature of yamaa-adapters and the Rust facade), which the facade hands to both bindings through Arrow C streams"
arrow-buffer = "Arrow buffers that the Arrow form of a table is built from (the arrow feature of yamaa-adapters); arrow-array uses it too"
arrow-data = "transitive dependency of arrow-array: the data layout of every Arrow array"
arrow-ipc = "reads the Arrow schema embedded in Parquet files (the parquet feature of yamaa-adapters); transports pickled Python result tables (yamaa-python)"
arrow-schema = "Arrow schemas and data types: the Arrow form of tables (the arrow feature of yamaa-adapters and the Rust facade), the streams read by both bindings, and the schema embedded in Parquet files (the parquet feature)"
autocfg = "build script: compiler feature probes of num-traits, and of memoffset in the Python binding"
base64 = "decodes the base64 Arrow schema in Parquet metadata (the parquet feature)"
bitflags = "transitive dependency of arrow-schema, flatbuffers and rustix: typed flag sets"
brotli = "Brotli codec for Parquet pages (the parquet feature)"
brotli-decompressor = "transitive dependency of brotli: the Brotli decoder"
bumpalo = "not compiled: wasm-bindgen's macro support (wasm32 only)"
bytes = "byte buffers of admitted Parquet pages (the parquet feature); arrow-buffer uses it too"
cc = "build script: compiles the bundled ReadStat C sources (the readstat feature) and, for zstd-sys, the bundled zstd library"
cfg-if = "transitive dependency of ahash, crc32fast, getrandom and half: platform-conditional code"
chrono = "transitive dependency of arrow-array: the date and time types of temporal arrays"
const-random = "not compiled: ahash's compile-time random seed, which arrow-array selects only for wasm32"
const-random-macro = "not compiled: the procedural macro of const-random (wasm32 only)"
core-foundation-sys = "transitive dependency of iana-time-zone on macOS: the system time zone through Core Foundation"
crc32fast = "transitive dependency of flate2: CRC-32 checksums of gzip streams"
crunchy = "not compiled: loop unrolling for tiny-keccak (wasm32 only) and for half on SPIR-V"
equivalent = "not compiled: transitive dependency of indexmap, which no build compiles"
errno = "transitive dependency of rustix on macOS: errno access where rustix calls the C library"
extendr-api = "the R binding's interface to R (yamaa-r)"
extendr-ffi = "transitive dependency of extendr-api: raw bindings to R's C API"
extendr-macros = "procedural macro: the #[extendr] attributes of the R binding"
find-msvc-tools = "build script: finds the MSVC tools for cc on Windows"
flatbuffers = "bounds the FlatBuffers-encoded Arrow schema in Parquet metadata before it is converted (the parquet feature of yamaa-adapters); arrow-ipc depends on it too"
flate2 = "gzip codec for Parquet pages (the parquet feature) and gzip TAR input (the odm feature)"
futures-core = "not compiled: transitive dependency of futures-util (wasm32 only)"
futures-task = "not compiled: transitive dependency of futures-util (wasm32 only)"
futures-util = "not compiled: js-sys's futures support (wasm32 only)"
getrandom = "transitive dependency of ahash: random hash seeds at run time; the older release, through const-random-macro, is not compiled"
half = "transitive dependency of the Arrow crates: the 16-bit float type"
hashbrown = "transitive dependency of arrow-array: hash tables; the newer release comes with indexmap and is not compiled"
heck = "procedural macro: case conversion in pyo3-macros-backend"
iana-time-zone = "transitive dependency of chrono on Linux and macOS: the local time zone lookup of chrono's clock feature, which arrow-array enables"
iana-time-zone-haiku = "not compiled: iana-time-zone's time zone lookup on Haiku"
indexmap = "not compiled: locked because toml's std feature names it; yamaa-adapters leaves toml's preserve_order feature off"
indoc = "procedural macro: indented string literals in pyo3"
itoa = "transitive dependency of serde_json: integer formatting"
jobserver = "build script: shares Cargo's job slots with cc's parallel C compilation, which zstd-sys enables"
js-sys = "not compiled: iana-time-zone's time zone lookup in JavaScript environments (wasm32 only)"
lazy_static = "procedural macro: lazily initialized statics in extendr-macros"
libc = "POSIX Ctrl+C handling in the command line; transitive dependency of rustix, getrandom and errno, and of pyo3 in the Python binding: C library bindings"
libm = "portable mathematics, pinned exactly so that results agree on every platform (yamaa-core); num-traits uses it too, through a feature that half enables"
linux-raw-sys = "transitive dependency of rustix on Linux: raw Linux system call bindings"
log = "not compiled: iana-time-zone's logging on wasm32"
lz4_flex = "LZ4 codec for Parquet pages (the parquet feature)"
