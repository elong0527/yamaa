windows-implement = "not compiled: a procedural macro of windows-core"
windows-interface = "not compiled: a procedural macro of windows-core"
windows-link = "transitive dependency of windows-sys and chrono on Windows: links the Windows system libraries"
windows-result = "not compiled: transitive dependency of windows-core"
