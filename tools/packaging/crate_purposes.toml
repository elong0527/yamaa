pyo3-macros = "procedural macro: the #[pymodule], #[pyfunction] and #[pyclass] attributes of the Python binding"
pyo3-macros-backend = "procedural macro: the code generation behind pyo3-macros"
quick-xml = "XML tokenizer of the ODM reader (the odm feature)"
quote = "procedural macro: quasi-quoting of the code that every procedural macro generates"
r-efi = "not compiled: getrandom on UEFI"
readonly = "procedural macro: read-only struct fields in extendr-api"
regex = "linear-time matching for the portable regex subset (yamaa-core)"
