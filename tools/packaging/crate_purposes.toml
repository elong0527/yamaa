zerocopy-derive = "procedural macro: zerocopy's derives, which half enables"
zlib-rs = "transitive dependency of flate2: the DEFLATE backend that yamaa-adapters names (the parquet and odm features), which flate2 prefers"
zmij = "transitive dependency of serde_json: floating-point formatting"
zstd = "Zstandard codec for Parquet pages (the parquet feature)"
zstd-safe = "transitive dependency of zstd: safe bindings to the zstd C library"
zstd-sys = "transitive dependency of zstd-safe: builds and links the zstd C library that it bundles"

# Why an engine crate depends unconditionally on a crate that #3030 section
# 2.9 scopes: Arrow leaves the core and the always-on adapters, staying for
# the Python hand-off, Parquet and the Rust facade; serde_json and toml go to
# the adapters that use them; and flatbuffers goes with arrow-ipc (#3106).
# Every host builds the engine crates (ENGINE in
# tools/staging/engine_bundle.py), so their unconditional dependencies are in
# every host's graph whatever features it selects.
#
# Each [unconditional.<engine crate>] table has one reason for each scoped
# crate that the engine crate's manifest declares as a normal dependency
# without `optional = true`, citing the code that needs it whatever the
# features: files under rust/crates/<engine crate>/src. The crates that those
# crates pull in, such as arrow-data, follow from them and need no reason of
# their own. The check fails while such a dependency has no reason, and while
# a reason names a crate that its engine crate does not depend on
# unconditionally, so the change that moves a crate behind a feature, or into
# the adapters that use it, removes its reason.

[unconditional.yamaa-adapters]
serde_json = """\
  JSON on the always-on path: the wire form of the core's JSON values \
  (json_wire.rs), through which R renv.lock files are read (project_lock.rs), \
  report rows and views (report_storage.rs) and Dataset-JSON output \
  (submission_json.rs)"""
toml = """\
  projects need no feature, and capturing a project's lock file classifies it \
  (file_metadata.rs), reading a uv.lock as TOML (project_lock.rs)"""

[unconditional.yamaa-application]
serde_json = """\
  JSON on the always-on path: the measurements of one application \
  (application_measurements.rs) and a preparation's resolved artifact facts \
  (resolved_artifact/model.rs)"""
