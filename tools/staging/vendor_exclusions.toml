# Audited development directories of the pinned crates. Only these exact
# published versions are pruned; a new or upgraded crate keeps its development
# files until reviewed. Paths are relative to the crate root. Runtime/build inputs
# and license files stay; Cargo checksum entries for omitted files are removed.
# winnow examples are included by Rust doc attributes during compilation.
# zerocopy benches feed documentation macros; PyO3 test_utils includes tests.
# Those directories are intentionally absent from this allowlist.

