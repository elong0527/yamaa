# Advisory check for rust/Cargo.lock and python/uv.lock against OSV, run by
# the dependency-graphs workflow as
#   osv-scanner scan source --config osv-scanner.toml \
#     --lockfile rust/Cargo.lock --lockfile python/uv.lock
# OSV also carries GitHub's reviewed advisories, which RustSec (cargo deny,
# configured in rust/deny.toml) and the PyPI database (pip-audit) can lack.
#
# Any advisory against a locked package fails the check. An ignored advisory
# carries its id, a reason and a review date in `ignoreUntil`; after that date
# it fails the check again until it is reviewed. An advisory that cargo deny
# also reports is ignored in rust/deny.toml too, with the same reason and
# review date.

[[IgnoredVulns]]
id = "GHSA-2f9f-gq7v-9h6m"
ignoreUntil = 2027-01-31
reason = "thrift 0.17.0 (CVE-2026-43868, fixed in 0.23.0) arrives only through parquet 55.2.0, which requires thrift 0.17 and is a dev-dependency of yamaa-adapters and yamaa-application alone: the differential oracle of their tests, which decodes only the Parquet bytes those tests write or save (#3878). No package, host binding, facade or command-line build compiles parquet or thrift (#3954), so cargo tree --workspace --all-features --target all -e normal,build -i thrift lists nothing. RustSec has no entry for this advisory, so rust/deny.toml does not list it."

[[IgnoredVulns]]
id = "RUSTSEC-2024-0436"
ignoreUntil = 2027-04-30
reason = "paste is unmaintained, not vulnerable, and a procedural macro that runs only at compile time. It arrives through extendr-api 0.9.0, the latest release, which the R binding builds, and through parquet 55.2.0, which only the adapters' and the application's tests compile, as their differential oracle (#3954)."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0176"
ignoreUntil = 2027-01-31
reason = "PyO3 0.27.2 is the newest release that builds with the workspace's minimum Rust 1.82 (#3111), which stays the minimum through 1.0.0 for CRAN's two-year-old cargo rule (#3154). The fix arrived in 0.29.0, which needs Rust 1.83, and no 0.27 or 0.28 release carries it. The Python binding iterates a PyList or PyTuple only with next, through for loops and collect, and never calls Iterator::nth or nth_back on one, directly or through an adapter such as skip or step_by."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0177"
ignoreUntil = 2027-01-31
reason = "PyO3 0.27.2 is the newest release that builds with the workspace's minimum Rust 1.82 (#3111), which stays the minimum through 1.0.0 for CRAN's two-year-old cargo rule (#3154). The fix arrived in 0.29.0, which needs Rust 1.83, and no 0.27 or 0.28 release carries it. The Python binding never calls PyCFunction::new_closure, and no other locked crate depends on PyO3."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0391"
ignoreUntil = 2027-01-31
reason = "zstd 0.13.3 (fixed in 0.14.3) arrives only through parquet 55.2.0, which requires zstd 0.13 and is a dev-dependency of yamaa-adapters and yamaa-application alone: the differential oracle of their tests, which compresses and decompresses only the Parquet pages those tests write or save (#3878). Every package builds zstd 0.14.3 (#4066), so from rust/, cargo tree --workspace --all-features --target all -e normal,build -i zstd@0.13.3 lists nothing."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0395"
ignoreUntil = 2027-01-31
reason = "zstd-safe 7.3.0 (fixed in 8.2.0) arrives only through zstd 0.13.3 and parquet 55.2.0, which requires zstd 0.13 and is a dev-dependency of yamaa-adapters and yamaa-application alone: the differential oracle of their tests, which compresses and decompresses only the Parquet pages those tests write or save (#3878). Every package builds zstd-safe 8.2.0, through zstd 0.14.3 (#4066), so from rust/, cargo tree --workspace --all-features --target all -e normal,build -i zstd-safe@7.3.0 lists nothing. RustSec marks it informational (unsound), and cargo deny reports an unsound advisory only for a crate that a workspace member depends on directly, which zstd-safe is not, so rust/deny.toml does not list it."

