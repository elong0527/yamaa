# Advisory check for rust/Cargo.lock and python/uv.lock against OSV, run by
# the dependency-graphs workflow as
#   osv-scanner scan source --config osv-scanner.toml \
#     --lockfile rust/Cargo.lock --lockfile python/uv.lock
# OSV also carries GitHub's reviewed advisories, which RustSec (cargo deny,
# configured in rust/deny.toml) and the PyPI database (pip-audit) can lack.
#
# Any advisory against a locked package fails the check. An ignored advisory
# carries its id, a reason and a review date in `ignoreUntil`; after that date
# it fails the check again until it is reviewed. An advisory that cargo deny
# also reports is ignored in rust/deny.toml too, with the same reason and
# review date.

[[IgnoredVulns]]
id = "GHSA-2f9f-gq7v-9h6m"
ignoreUntil = 2027-01-31
reason = "thrift 0.17.0 (CVE-2026-43868, fixed in 0.23.0) arrives only through parquet 55.2.0, which the engine pins exactly as the newest release that builds with Rust 1.82 (#3111), and which requires thrift 0.17. Parquet 55 decodes a footer with the Thrift-generated readers over its own slice-bounded compact protocol, and a page header with thrift's compact protocol. Admission walks every footer and page header before Parquet decodes it, and bounds what thrift 0.23.0 adds limits for: each binary, list, set and map length by the bytes that hold it, field ids to i16, and nesting to 128 levels (thrift's own skip stops at 64). It also refuses a mistyped or repeated known field. RustSec has no entry for this advisory, so rust/deny.toml does not list it."

[[IgnoredVulns]]
id = "RUSTSEC-2024-0436"
ignoreUntil = 2027-04-30
reason = "paste is unmaintained, not vulnerable, and a procedural macro that runs only at compile time. It arrives through extendr-api 0.9.0, the latest release, and through parquet 55.2.0, which the engine pins exactly as the newest release that builds with Rust 1.82."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0176"
ignoreUntil = 2026-11-28
reason = "PyO3 0.27.2 is the newest release that builds with the workspace's minimum Rust 1.82 (#3111); the fix, 0.29.0, needs Rust 1.83, which CRAN's two-year-old cargo rule allows from 2026-11-28. The Python binding iterates a PyList or PyTuple only with next, through for loops and collect, and never calls Iterator::nth or nth_back on one."

