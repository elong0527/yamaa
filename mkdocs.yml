# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json
site_name: yamaa
site_description: A domain-specific language for clinical trial data standardization, from ODM XML to SDTM and ADaM
site_url: https://elong0527.github.io/yamaa/
repo_url: https://github.com/elong0527/yamaa
repo_name: elong0527/yamaa
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 yamaa contributors

docs_dir: docs
site_dir: site
# requirements.txt is not a page. articles/benchmark.md is the source the
# benchmark dashboard generator substitutes into docs/benchmark/index.md, so
# it holds placeholders and is not a page either.
exclude_docs: |
  requirements.txt
  articles/benchmark.md
  # The rendered slide decks (docs/slides/<deck>/index.html, built by Quarto in
  # CI) already occupy slides/<deck>/index.html; building each folder README
  # as a page would conflict with it and fail --strict.
  slides/yamaa-pilot7-2026-09-25/README.md
  slides/yamaa-njsug-2026-10-09/README.md
  slides/yamaa-asa-boston-2026-11-12/README.md

theme:
  name: material
  logo: assets/logo.jpeg
  favicon: assets/logo.jpeg
  language: en
  custom_dir: docs/overrides
  # System fonts, so the Material pages and the self-contained benchmark
  # dashboards render in the same typeface without a network request.
  font: false
  features:
    - content.action.edit
    - content.action.view
    - content.code.copy
    # Choosing R or Python in one tab group switches every group with the
    # same labels, so a reader picks a language once.
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - toc.follow
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  # Content tabs (`=== "R"`) need superfences, which nests code blocks in a
  # tab, and the alternate tab markup, the only one Material styles.
  # Highlight fenced code at build time; Material supplies token colors for
  # both the light and dark palettes, including code nested inside tabs.
  - pymdownx.highlight:
      use_pygments: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search

hooks:
  - tools/docs/canonical_pages.py

watch:
  - README.md
  - rules/README.md

nav:
  - Home: index.md
  - Start:
      - Introduction: articles/intro.md
      - R, Python and command-line API: articles/api.md
      - Restricted environments: articles/restricted-environments.md
      - Principles: articles/principles.md
      - Derivation: articles/derive.md
      - Excel to yamaa: articles/excel.md
      - SDTM to ADaM: articles/sdtm-to-adam.md
      - Style guide: articles/style.md
  - Reference:
      - Schema introduction: articles/schema-intro.md
      - Schema files and JSON Schemas: articles/schema.md
      - Rules: articles/rules.md
      - Rules at a glance: reference/rules-summary.md
      - Rule index: reference/rule-index.md
      - Schema fields: reference/schema-fields.md
      - Codelists and terminology: articles/terminology.md
      - Supported standards: articles/supported-standards.md
  - Benchmark: benchmark/index.md
  - Engine:
      - Contributing: https://github.com/elong0527/yamaa/blob/main/CONTRIBUTING.md
      - Partitioned execution design: partition-execution.md
      - 1.0 interface design record (2026-10-19):
          - Decisions: design/interface-1.0.md
          - Spelling review: design/interface-1.0/spelling.md
          - Field kinds: design/interface-1.0/field-kinds.md
          - CDISC alignment: design/interface-1.0/cdisc.md
          - Rules: design/interface-1.0/rules.md
          - Card text beyond D71: design/interface-1.0/card-text.md
          - Card text beyond D78: design/interface-1.0/card-text-2.md
          - API and command line: design/interface-1.0/api.md
          - Stability contract: design/interface-1.0/stability.md
          - Converted examples: design/interface-1.0/examples.md
          - Method and footprint: design/interface-1.0/method.md
      - Release and migration: release.md
      - Python package: https://github.com/elong0527/yamaa/tree/main/python
      - R package: https://github.com/elong0527/yamaa/tree/main/R/yamaa
