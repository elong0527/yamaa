# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json
site_name: YAMAA
site_description: A language-neutral YAML specification for reproducible clinical trial data pipelines
site_url: https://elong0527.github.io/yamaa/
repo_url: https://github.com/elong0527/yamaa
repo_name: elong0527/yamaa
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 YAMAA authors

docs_dir: docs
site_dir: site
exclude_docs: requirements.txt

theme:
  name: material
  logo: assets/logo.jpeg
  favicon: assets/logo.jpeg
  language: en
  custom_dir: docs/overrides
  # System fonts, so the Material pages and the self-contained benchmark
  # dashboards render in the same typeface without a network request.
  font: false
  features:
    - content.action.edit
    - content.action.view
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - toc.follow
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Home: index.md
  - Guides:
      - Principles: articles/principles.md
      - Why YAMAA: articles/why-yamaa.md
      - Excel to YAMAA: articles/excel-to-yamaa.md
      - Schema concepts: articles/schema-concepts.md
      - Examples walkthrough: articles/yaml-examples-walkthrough.md
  - Benchmark:
      - benchmark/index.md
  - Reference:
      - Rules: reference/rules.md
      - Schema: reference/schema.md
  - Changelog: changelog.md
  - Contributing: contributing.md
