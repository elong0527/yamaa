  - {"source": "schema_expression_date.yaml:expressions.study_day.reference.description", "text": "Reference start date, which is study day 1.", "owner": "operations/temporal", "group": "expressions.study_day", "target": "REQ-1108"}
  - {"source": "schema_expression_date.yaml:day_rule.description", "text": "Day resolved against the month the completed date lands in.", "owner": "operations/temporal", "group": "day_rule", "target": "REQ-1109"}
  - {"source": "schema_expression_date.yaml:comment:4", "text": "Counts whole calendar units between two dates. Which endpoints the count includes is declared by bounds. A missing start or end yields a missing result, so no guarding predicate is needed.", "owner": "operations/temporal", "group": "expressions.date_diff", "target": "REQ-1104"}
  - {"source": "schema_expression_date.yaml:comment:32", "text": "Completes a truncated ISO 8601 date and returns a date. A complete source date is returned unchanged; a source carrying only a year, or a year and month, is completed from month and day unless minimum_source_precision forbids supplying that much information. A day token is resolved after month is fixed, so it names a day in the month the completed date lands in. not_before is applied last, to the completed date alone: a date already on or after the bound stands, and otherwise the result is the earliest day the collected text still admits that satisfies the bound. When the collected text admits no such day the result is missing, invoking no handler. A source that is not an ISO 8601 date or an ISO 8601 date prefix is an invalid value, distinct from a missing one; both yield no date unless a handler is declared. R016 governs the resulting date.", "owner": "operations/temporal", "group": "expressions.date_impute", "target": "REQ-1105"}
  - {"source": "schema_expression_date.yaml:comment:78", "text": "Returns how much of a date its source carries. D for a complete date, M for a year and month, and Y for a year alone. Collected text reports what the text carries and a date reports the collected precision that value carries, so a specification records what date_impute supplied by reading either the same source or the completed date itself. Invalid text and a missing source behave as they do there; a date source is never invalid. A datetime is an error here as in every date operation. R016 governs both source kinds.", "owner": "operations/temporal", "group": "expressions.date_precision", "target": "REQ-1106"}
  - {"source": "schema_expression_date.yaml:comment:98", "text": "Extracts the calendar date from a datetime. A missing datetime yields a missing date. Other source types are an incompatible input error under R016.", "owner": "operations/temporal", "group": "expressions.to_date", "target": "REQ-1107"}
  - {"source": "schema_expression_date.yaml:comment:105", "text": "Returns the CDISC study day of a date against a reference date. The reference date is day 1 and there is no day zero: a date on or after the reference counts forward from 1, and an earlier date counts back from -1. A missing date or reference yields a missing result.", "owner": "operations/temporal", "group": "expressions.study_day", "target": "REQ-1108"}
