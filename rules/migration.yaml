  - {"source": "schema_metadata.yaml:comment:3", "text": "Governed submission metadata. R024 defines what each field means, which combinations a standard admits, and what the derivation graph refutes. R025 owns the codelist a binding names, and R026 composes these declarations with a study document into one Define-XML 2.1 document.  Every identifier here names an object the study document declares. A specification validates on its own with the names unresolved; R026 resolves them when the specification joins a document.", "owner": "submission/metadata", "group": "module", "target": "REQ-1148"}
  - {"source": "schema_shared.yaml:literal_value.description", "text": "Scalar literal after R011 normalizes any non-finite float to missing.", "owner": "values/types", "group": "literal_value", "target": "REQ-1149"}
  - {"source": "schema_shared.yaml:project_path.description", "text": "Stored resource a run reads; R021 fixes its written form and confines it to a root the runner approved.", "owner": "storage/resources", "group": "project_path", "target": "REQ-1151"}
  - {"source": "schema_shared.yaml:identifier.description", "text": "Single-token identifier; the field's own description states which namespace it names (a declared dataset, a declared column, a standard, a document, a function, or similar).", "owner": "specification/structure", "group": "identifier", "target": "REQ-1046"}
  - {"source": "schema_shared.yaml:function_contract_version.description", "text": "Exact logical contract version required by a function call.", "owner": "operations/functions", "group": "function_contract_version", "target": "REQ-1087"}
  - {"source": "schema_shared.yaml:comment:3", "text": "Types shared by specification and project-environment schema entry points.", "owner": "values/types", "group": "module", "target": "REQ-1150"}
  - {"source": "schema_verification.yaml:comment:43", "text": "Bounds how many rows a group holds, or the whole output. group_by partitions the artifact's rows and applies both bounds to every group; a group's count is how many of its rows filter admits, and a row is admitted only when the predicate is TRUE. A grouped count requires id, which an ungrouped count does not.", "owner": "execution/verification", "group": "dataset_verifications.row_count", "target": "REQ-1152"}
