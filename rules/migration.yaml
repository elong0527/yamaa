  - {"source": "yamaa:issue-494:dataset-json-submission-required", "text": "Issue #494: a composed specification already declares root.submission and every output column's label and submission, so a specification without them produces no file.", "owner": "submission/dataset-json", "group": "dataset-json", "target": "REQ-1202"}
