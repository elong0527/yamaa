  - {"source": "schema_expression_date.yaml:expressions.date_diff.unit.description", "text": "Calendar unit counted between the dates.", "owner": "operations/temporal", "group": "expressions.date_diff", "target": "REQ-1104"}
  - {"source": "schema_expression_date.yaml:expressions.date_diff.bounds.description", "text": "Endpoints counted. exclusive counts from start to end excluding start; inclusive counts both endpoints and is one greater; between counts neither and is one smaller. The three values are defined only with unit day; with unit week, month, or year bounds must be absent or exclusive, and any other value fails validation under R016.", "owner": "operations/temporal", "group": "expressions.date_diff", "target": "REQ-1104"}
  - {"source": "schema_expression_date.yaml:expressions.date_impute.source.description", "text": "ISO 8601 date text, complete or truncated to year or month.", "owner": "operations/temporal", "group": "expressions.date_impute", "target": "REQ-1105"}
  - {"source": "schema_expression_date.yaml:expressions.date_impute.month.description", "text": "Month used when the source carries only a year, 1 to 12.", "owner": "operations/temporal", "group": "expressions.date_impute", "target": "REQ-1105"}
  - {"source": "schema_expression_date.yaml:expressions.date_impute.day.description", "text": "Day used when the source carries no day: an integer from 1 to 31, or first or last resolved against the month the date lands in.", "owner": "operations/temporal", "group": "expressions.date_impute", "target": "REQ-1105"}
  - {"source": "schema_expression_date.yaml:expressions.date_impute.minimum_source_precision.description", "text": "Least precision the collected source must carry before imputation; month leaves a year-only source missing instead of supplying both month and day.", "owner": "operations/temporal", "group": "expressions.date_impute", "target": "REQ-1105"}
