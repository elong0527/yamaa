  - {"source": "yamaa:issue-494:dataset-json-declaration", "text": "Issue #494: a datasets entry's dataset_json names the Dataset-JSON file the study document produces for that dataset, relative to the generated document.", "owner": "submission/dataset-json", "group": "dataset-json", "target": "REQ-1193"}
  - {"source": "yamaa:issue-494:dataset-json-study-document", "text": "Issue #494: the study document declares the file because its identifiers and creation timestamp are study-document facts, and R020's artifact mapping stays closed at .csv and .parquet.", "owner": "submission/dataset-json", "group": "dataset-json", "target": "REQ-1194"}
  - {"source": "yamaa:issue-494:dataset-json-path-distinctness", "text": "Issue #494: a dataset_json path must differ from the document's output path, from every other entry's dataset_json, and from every composed specification's output path.", "owner": "submission/dataset-json", "group": "dataset-json", "target": "REQ-1195"}
  - {"source": "yamaa:issue-494:dataset-json-has-no-data", "text": "Issue #494: an entry declaring has_no_data must not declare dataset_json.", "owner": "submission/dataset-json", "group": "dataset-json", "target": "REQ-1196"}
  - {"source": "yamaa:issue-494:dataset-json-version", "text": "Issue #494: the profile writes Dataset-JSON 1.1 and pins datasetJSONVersion to 1.1.0; a later release is a new profile.", "owner": "submission/dataset-json", "group": "dataset-json", "target": "REQ-1197"}
  - {"source": "yamaa:issue-494:dataset-json-ndjson", "text": "Issue #494: the newline-delimited form the standard also defines is not this profile.", "owner": "submission/dataset-json", "group": "dataset-json", "target": "REQ-1198"}
  - {"source": "yamaa:issue-494:dataset-json-rows-source", "text": "Issue #494: the rows come from the artifact the entry's specification published, read under the producing-specification link.", "owner": "submission/dataset-json", "group": "dataset-json", "target": "REQ-1199"}
