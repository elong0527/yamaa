  - {"source": "schema_expression_window.yaml:comment:3", "text": "R007 defines the partitioning, ordering, and filtering one window_spec declares; each window expression below nests it as `window:` and adds only its own specific fields.", "owner": "operations/windows", "group": "module", "target": "REQ-1129"}
  - {"source": "schema_expression_window.yaml:comment:19", "text": "Numbers eligible rows from 1 within each partition. Filtering happens before partitioning; excluded rows receive missing. Ordering ties preserve row-template order, then base-record order.", "owner": "operations/windows", "group": "expressions.row_number", "target": "REQ-1123"}
  - {"source": "schema_expression_window.yaml:comment:25", "text": "Numbers eligible rows from 1 within each partition, sharing a number across ties. Rows equal on every order term take one number. With competition, they take the lowest position they occupy and the next distinct value takes its own position, so intervening numbers are skipped. With dense, the next distinct value takes the following number and no number is skipped. Two missing values are equal for this purpose, whatever nulls places them among. Filtering happens before partitioning; excluded rows receive missing.", "owner": "operations/windows", "group": "expressions.rank", "target": "REQ-1124"}
  - {"source": "schema_expression_window.yaml:comment:41", "text": "Returns the source value from another row of the ordered partition. offset counts along the declared order: positive moves toward later rows and negative toward earlier ones, so reversing every order_by direction and negating offset gives the same result. A row with fewer than |offset| rows on that side of it within its partition yields missing, which does not distinguish an absent row from a present row whose value is missing.", "owner": "operations/windows", "group": "expressions.row_value", "target": "REQ-1125"}
  - {"source": "schema_expression_window.yaml:comment:59", "text": "Returns the source from the closest strictly earlier non-missing row. The current row is never a candidate. Missing source values are skipped, so one result can cross any number of consecutive gaps. A row with no earlier non-missing source in its partition yields missing.", "owner": "operations/windows", "group": "expressions.previous_non_missing", "target": "REQ-1126"}
  - {"source": "schema_expression_window.yaml:comment:71", "text": "Returns Y for the unique latest eligible row, missing elsewhere. An eligible row has a non-missing date at or before reference_date. A tie for the latest eligible date is an error.", "owner": "operations/windows", "group": "expressions.baseline_flag", "target": "REQ-1127"}
