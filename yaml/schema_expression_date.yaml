version: "1.0"

expressions:
    date_diff: # Counts whole calendar units between two dates.
        # Which endpoints the count includes is declared by bounds. A missing
        # start or end yields a missing result, so no guarding predicate is
        # needed.
        - start:
            type: variable
            required: true
            description: Starting date.
        - end:
            type: variable
            required: true
            description: Ending date; an earlier date produces a negative result.
        - unit:
            type: str
            required: true
            values: [day, week, month, year]
            description: Calendar unit counted between the dates.
        - bounds:
            type: str
            default: exclusive
            values: [exclusive, inclusive, between]
            description: >-
              Endpoints counted. exclusive counts from start to end excluding
              start; inclusive counts both endpoints and is one greater;
              between counts neither and is one smaller.
    date_impute: # Completes a truncated ISO 8601 date and returns a date.
        # A complete source date is returned unchanged; a source carrying only a
        # year, or a year and month, is completed from month and day unless
        # minimum_source_precision forbids supplying that much information.
        # A source that is not an ISO 8601 date or an ISO 8601 date prefix is an
        # invalid value, distinct from a missing one; both yield no date unless
        # a handler is declared. R016 governs the resulting date.
        - source:
            type: variable
            required: true
            description: ISO 8601 date text, complete or truncated to year or month.
        - month:
            type: int
            required: true
            description: Month used when the source carries only a year, 1 to 12.
        - day:
            type: int
            required: true
            description: Day used when the source carries no day, 1 to 31.
        - minimum_source_precision:
            type: str
            default: year
            values: [year, month]
            description: >-
              Least precision the collected source must carry before imputation;
              month leaves a year-only source missing instead of supplying both
              month and day.
        - missing:
            type: literal_value
            description: Result when the source value is missing.
        - invalid:
            type: literal_value
            description: Result when the source is not an ISO 8601 date or date prefix.
    date_precision: # Returns how much of a date the collected text carries.
        # D for a complete date, M for a year and month, and Y for a year alone.
        # It describes the collected text rather than a completed date, so a
        # specification records what date_impute supplied by reading the same
        # source. Invalid text and a missing source behave as they do there.
        - source:
            type: variable
            required: true
            description: ISO 8601 date text, complete or truncated to year or month.
        - missing:
            type: literal_value
            description: Result when the source value is missing.
        - invalid:
            type: literal_value
            description: Result when the source is not an ISO 8601 date or date prefix.
    study_day: # Returns the CDISC study day of a date against a reference date.
        # The reference date is day 1 and there is no day zero: a date on or
        # after the reference counts forward from 1, and an earlier date counts
        # back from -1. A missing date or reference yields a missing result.
        - date:
            type: variable
            required: true
            description: Date whose study day is returned.
        - reference:
            type: variable
            required: true
            description: Reference start date, which is study day 1.
