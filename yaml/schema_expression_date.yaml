version: "1.0"

expressions:
    date_diff: # See REQ-1104 in rules/operations/temporal.md.
        - start:
            type: variable
            required: true
            description: See REQ-1104 in rules/operations/temporal.md.
        - end:
            type: variable
            required: true
            description: See REQ-1104 in rules/operations/temporal.md.
        - unit:
            type: str
            required: true
            values: [day, week, month, year]
            description: See REQ-1104 in rules/operations/temporal.md.
        - bounds:
            type: str
            default: exclusive
            values: [exclusive, inclusive, between]
            description: See REQ-1104 in rules/operations/temporal.md.
    date_impute: # See REQ-1105 in rules/operations/temporal.md.
        - source:
            type: variable
            required: true
            description: See REQ-1105 in rules/operations/temporal.md.
        - month:
            type: int
            required: true
            description: See REQ-1105 in rules/operations/temporal.md.
        - day:
            type: [int, day_rule]
            required: true
            description: See REQ-1105 in rules/operations/temporal.md.
        - minimum_source_precision:
            type: str
            default: year
            values: [year, month]
            description: See REQ-1105 in rules/operations/temporal.md.
        - not_before:
            type: variable
            description: See REQ-1105 in rules/operations/temporal.md.
        - missing:
            type: literal_value
            description: See REQ-1105 in rules/operations/temporal.md.
        - invalid:
            type: literal_value
            description: See REQ-1105 in rules/operations/temporal.md.
    date_precision: # See REQ-1106 in rules/operations/temporal.md.
        - source:
            type: variable
            required: true
            description: See REQ-1106 in rules/operations/temporal.md.
        - missing:
            type: literal_value
            description: See REQ-1106 in rules/operations/temporal.md.
        - invalid:
            type: literal_value
            description: See REQ-1106 in rules/operations/temporal.md.
    to_date: # See REQ-1107 in rules/operations/temporal.md.
        - source:
            type: variable
            required: true
            description: See REQ-1107 in rules/operations/temporal.md.
    study_day: # See REQ-1108 in rules/operations/temporal.md.
        - date:
            type: variable
            required: true
            description: See REQ-1108 in rules/operations/temporal.md.
        - reference:
            type: variable
            required: true
            description: See REQ-1108 in rules/operations/temporal.md.

day_rule:
    type: str
    values: [first, last]
    description: See REQ-1109 in rules/operations/temporal.md.
