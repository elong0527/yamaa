version: "1.0"

column_verification:
    registry: column_verifications

column_verifications:
    not_missing:
        - severity: {type: verification_severity, required: false, default: error}
    allowed_values:
        - values: {type: "list[literal_value]", required: true}
        - severity: {type: verification_severity, required: false, default: error}
    range:
        - min: {type: float, required: false}
        - max: {type: float, required: false}
        - severity: {type: verification_severity, required: false, default: error}
    max_length:
        - max: {type: int, required: true}
        - severity: {type: verification_severity, required: false, default: error}
    matches:
        - pattern: {type: regex, required: true}
        - severity: {type: verification_severity, required: false, default: error}

dataset_verification:
    registry: dataset_verifications

dataset_verifications:
    unique:
        - columns: {type: "list[variable]", required: true}
        - severity: {type: verification_severity, required: false, default: error}
    all_or_none:
        - id: {type: verification_id, required: true}
        - columns: {type: "list[variable]", required: true}
        - severity: {type: verification_severity, required: false, default: error}
    implies:
        - id: {type: verification_id, required: true}
        - when: {type: predicate, required: true}
        - then: {type: predicate, required: true}
        - severity: {type: verification_severity, required: false, default: error}
    assert:
        - id: {type: verification_id, required: true}
        - expr: {type: predicate, required: true}
        - severity: {type: verification_severity, required: false, default: error}
    row_count: # Bounds how many rows a group holds, or the whole output.
        # group_by partitions the artifact's rows and applies both bounds to
        # every group; a group's count is how many of its rows filter admits,
        # and a row is admitted only when the predicate is TRUE. A grouped
        # count requires id, which an ungrouped count does not.
        - id: {type: verification_id, required: false}
        - group_by: {type: "list[variable]", required: false}
        - filter: {type: predicate, required: false}
        - min: {type: int, required: false}
        - max: {type: int, required: false}
        - severity: {type: verification_severity, required: false, default: error}

verification_id:
    type: str
    min_length: 1

verification_severity:
    type: str
    values: [error, warning]
