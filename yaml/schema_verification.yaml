version: "1.0"

column_verification:
    registry: column_verifications

column_verifications:
    not_missing: {type: empty_class}
    allowed_values:
        - values: {type: "list[literal_value]", required: true}
    range:
        - min: {type: float, required: false}
        - max: {type: float, required: false}
    max_length:
        - max: {type: int, required: true}
    matches:
        - pattern: {type: regex, required: true}

dataset_verification:
    registry: dataset_verifications

dataset_verifications:
    unique:
        - columns: {type: "list[variable]", required: true}
    all_or_none:
        - id: {type: verification_id, required: true}
        - columns: {type: "list[variable]", required: true}
    implies:
        - id: {type: verification_id, required: true}
        - when: {type: sql, required: true}
        - then: {type: sql, required: true}
    predicate:
        - id: {type: verification_id, required: true}
        - assert: {type: sql, required: true}
    row_count: # Bounds how many output rows a group contains, or the whole output.
        # A row counts only when filter is TRUE. group_by partitions the counted
        # rows and applies both bounds to every group; it requires id, which an
        # ungrouped count does not take.
        - id: {type: verification_id, required: false}
        - group_by: {type: "list[variable]", required: false}
        - filter: {type: sql, required: false}
        - min: {type: int, required: false}
        - max: {type: int, required: false}

empty_class:
    type: "dict[str, literal_value]"
    size: 0

verification_id:
    type: str
    min_length: 1
