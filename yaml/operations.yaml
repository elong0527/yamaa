version: "1.0"

operations:

    mapping:
        kind: scalar
        seed: required
        result: any
        raises: [unmapped]
        semantics: >
            Return `dict[value]`. A value absent from `dict` raises `unmapped`.
            `case_sensitive` true compares exactly. When `false`, the input
            and each `dict` key are folded by mapping `A`-`Z`
            to `a`-`z` and leaving every other code point unchanged, then
            compared. Folding is ASCII-only on purpose: `tolower` in R and
            `str.lower` in Python disagree on characters such as `U+0130`, and
            `str.lower` and `str.casefold` disagree on `U+00DF`, so any wider
            rule would not be reproducible across implementations. Two `dict`
            keys that fold to the same value are an error.
        arguments:
            - dict: {type: "dict[str, argument]", required: true}
            - case_sensitive: {type: bool, required: false, default: true}

    mapping_from:
        kind: scalar
        seed: required
        result: any
        raises: [unmapped]
        semantics: >
            Translate the pipeline value using an external table. Match it
            against column `key` of the declared dataset `dataset` and return
            column `value`. `dataset` must be a dataset identifier declared in
            root `datasets`, and the table must be unique on `key`. A value with
            no matching row raises `unmapped`. This is `mapping` with the
            dictionary held in a file rather than inline, and it is not the
            key-based join of R003.
        arguments:
            - dataset: {type: dataset_id, required: true}
            - key: {type: str, required: true}
            - value: {type: str, required: true}

    call:
        kind: scalar
        seed: ignored
        result: any
        semantics: >
            Escape hatch. Invoke the host-language function named by `function`
            with the named arguments in `args`, once per row, and return its
            result. Registering every operation a real study needs is not
            practical, so this exists for the long tail: study-day arithmetic,
            partial-date imputation, sponsor-specific coding rules. Arguments
            are named rather than positional, so a call reads the same way a
            registered operation does. The named function must exist in every
            implementation and must be a pure function of its arguments and
            return one value per row. This is the one operation whose behavior
            the registry cannot describe, so a specification that uses it is
            portable only as far as its function library is, and R and Python
            can silently disagree. Prefer a registered operation whenever one
            fits, and reach for `call` only when none does.
        arguments:
            - function: {type: str, required: true}
            - args: {type: "dict[str, argument]", required: false}

    cut:
        kind: scalar
        seed: required
        result: str
        raises: [unmapped]
        semantics: >
            Assign a band label. `breaks` is ascending and yields
            `len(breaks) + 1` bands, so `labels` must have exactly that length.
            When `right` is false each band is left-closed and right-open. A
            missing input raises `unmapped`.
        arguments:
            - breaks: {type: "list[float]", required: true}
            - labels: {type: "list[str]", required: true}
            - right: {type: bool, required: false, default: false}

    str_extract:
        kind: scalar
        seed: required
        result: str
        raises: [unmapped]
        semantics: >
            Match `pattern` as an ECMAScript regular expression. Return capture
            group `group`, where 0 is the whole match. No match raises
            `unmapped`.
        arguments:
            - pattern: {type: str, required: true}
            - group: {type: int, required: false, default: 0}

    multiply:
        kind: scalar
        seed: required
        result: float
        semantics: >
            Return `value * factor`.
        arguments:
            - factor: {type: float, required: true}

    add:
        kind: scalar
        seed: required
        result: float
        semantics: >
            Return `value + addend`.
        arguments:
            - addend: {type: float, required: true}

    coalesce:
        kind: scalar
        seed: ignored
        result: any
        semantics: >
            Return the first non-missing member of `values`, or missing when
            all are missing.
        arguments:
            - values: {type: "list[argument]", required: true}

    case:
        kind: scalar
        seed: ignored
        result: any
        semantics: >
            Evaluate `branches` in listed order and return the `then` of the
            first branch whose `when` is `TRUE` under the three-valued logic of
            R004. Return `else` when no branch matches, or missing when `else`
            is absent.
        arguments:
            - branches: {type: "list[branch]", required: true}
            - else: {type: argument, required: false}

    subtract:
        kind: scalar
        seed: ignored
        result: float
        semantics: >
            Return `minuend - subtrahend`.
        arguments:
            - minuend: {type: argument, required: true}
            - subtrahend: {type: argument, required: true}

    percent_change:
        kind: scalar
        seed: ignored
        result: float
        semantics: >
            Return `100 * (value - base) / base`. A zero or missing `base`
            returns missing.
        arguments:
            - value: {type: argument, required: true}
            - base: {type: argument, required: true}

    date_diff:
        kind: scalar
        seed: ignored
        result: int
        semantics: >
            Return the count of whole `unit` intervals from `start` to `end`,
            negative when `end` precedes `start`. The result excludes the start
            point, so an inclusive day count adds 1.
        arguments:
            - start: {type: argument, required: true}
            - end: {type: argument, required: true}
            - unit:
                {type: str, required: true, values: [day, week, month, year]}

    row_number:
        kind: window
        seed: ignored
        result: int
        semantics: >
            Number rows from 1 within each partition, sorted ascending by
            `order_by`. Ties preserve row-template order and then base-record
            order.
        arguments:
            - order_by: {type: "list[argument]", required: true}

    baseline_flag:
        kind: window
        seed: ignored
        result: str
        semantics: >
            Within each partition, flag `Y` on the record with the latest
            non-missing `date` at or before `reference_date`, and missing
            elsewhere. Ties are errors.
        arguments:
            - date: {type: argument, required: true}
            - reference_date: {type: argument, required: true}

    baseline_value:
        kind: window
        seed: ignored
        result: any
        semantics: >
            Within each partition, copy the `value` of the record whose `flag`
            is `Y` to every record.
        arguments:
            - value: {type: argument, required: true}
            - flag: {type: argument, required: true}

    min:
        kind: aggregate
        seed: required
        result: same
        semantics: >
            Return the smallest non-missing value, or missing when all are
            missing.

    max:
        kind: aggregate
        seed: required
        result: same
        semantics: >
            Return the largest non-missing value, or missing when all are
            missing.

argument_classes:

    branch:
        - when: {type: sql, required: true}
        - then: {type: argument, required: true}
