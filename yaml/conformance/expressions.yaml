  # LOG10 is the base-10 logarithm, one operation of the pinned libm rather
  # than a quotient of natural logarithms; NORM_CDF is 0.5 * erfc(-x /
  # SQRT(2)) and NORM_INV is AS 241. Each is a float; LOG10 of zero or a
  # negative number fails as LN does, and NORM_INV outside the open interval
  # from 0 to 1 fails, 0 and 1 included (FORMULA-13, FORMULA-14, FORMULA-15,
  # VALUE-10). Exact values are pinned where the pinned computation is the
  # correctly rounded value of its formula. In the far tail NORM_CDF(-8) is
  # pinned within the formula's bound, 1E-29 of the standard normal
  # probability: SQRT(2) is rounded, and erfc multiplies that relative error
  # by about 64 there. NORM_INV(NORM_CDF(1)) is 1 within 1E-15: AS 241's
  # accuracy of about 1 part in 10^16, plus NORM_CDF(1)'s own error of at
  # most about 1.6E-16, which the quantile's slope of 4.13 at 1 enlarges,
  # stays below it.
  - id: log10-is-the-base-10-logarithm
    context: derivation
    covers: [LOG10, typing, missing, exactness]
    text: "LOG10(F)"
    columns: {F: float}
    rows:
      - {F: 1000.0}
      - {F: 0.001}
      - {F: 0.5}
      - {F: null}
    type: float
    values: [3.0, -3.0, -0.3010299956639812, null]
  - id: log10-of-an-int-is-a-float
    context: derivation
    covers: [LOG10, typing]
    text: "LOG10(X)"
    columns: {X: int}
    rows:
      - {X: 1}
      - {X: 100}
    type: float
    values: [0.0, 2.0]
  - id: log10-of-zero-fails
    context: derivation
    covers: [LOG10]
    text: "LOG10(X)"
    columns: {X: int}
    rows:
      - {X: 0}
    type: float
    phase: derivation
    condition: ln_of_nonpositive
    rule: FORMULA-15
  - id: log10-of-a-negative-number-fails
    context: derivation
    covers: [LOG10]
    text: "LOG10(F)"
    columns: {F: float}
    rows:
      - {F: -0.5}
    type: float
    phase: derivation
    condition: ln_of_nonpositive
    rule: FORMULA-15
  - id: log10-takes-one-argument
