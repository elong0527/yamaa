    condition: prohibited_construct
    rule: FORMULA-27
  - id: list-membership-is-refused-in-an-expression-field
    context: derivation
    covers: [IN, context]
    text: "X IN (1, 2)"
    columns: {X: int}
    rows:
      - {X: 2}
    phase: validation
    condition: prohibited_construct
    rule: FORMULA-27
  - id: a-range-is-refused-in-an-expression-field
    context: derivation
    covers: [BETWEEN, context]
    text: "X BETWEEN 1 AND 2"
    columns: {X: int}
    rows:
      - {X: 2}
    phase: validation
    condition: prohibited_construct
    rule: FORMULA-27
  - id: a-pattern-match-is-refused-in-an-expression-field
    context: derivation
    covers: [LIKE, context]
    text: "S LIKE 'a%'"
    columns: {S: str}
    rows:
      - {S: "ab"}
    phase: validation
    condition: prohibited_construct
    rule: FORMULA-27
  - id: a-truth-literal-is-refused-in-an-expression-field
    context: derivation
    covers: ["TRUE", context]
    text: "TRUE"
    columns: {X: int}
    rows:
      - {X: 1}
    phase: validation
    condition: prohibited_construct
    rule: FORMULA-27
  - id: negation-is-refused-in-an-expression-field
    context: derivation
    covers: [NOT, context]
    text: "NOT X"
    columns: {X: int}
    rows:
      - {X: 1}
    phase: validation
    condition: prohibited_construct
    rule: FORMULA-27
  - id: a-conjunction-is-refused-in-an-expression-field
    context: derivation
    covers: [AND, context]
    text: "X = 1 AND Z = 1"
    columns: {X: int, Z: int}
    rows:
      - {X: 1, Z: 1}
    phase: validation
    condition: prohibited_construct
    rule: FORMULA-27
  - id: str-contains-is-refused-in-an-expression-field
    context: derivation
    covers: [STR_CONTAINS, context]
    text: "str_contains(S, 'a')"
    columns: {S: str}
    rows:
      - {S: "a"}
    phase: validation
    condition: prohibited_function
    rule: FORMULA-13
  - id: a-reduction-is-refused-in-an-expression-field
    context: derivation
    covers: [SUM, context]
    text: "SUM(X)"
    columns: {X: int}
    rows:
      - {X: 1}
    phase: validation
    condition: prohibited_function
    rule: FORMULA-13
  - id: a-count-is-refused-in-an-expression-field
    context: derivation
    covers: [COUNT, context]
    text: "COUNT(X)"
    columns: {X: int}
    rows:
      - {X: 1}
    phase: validation
    condition: prohibited_function
    rule: FORMULA-13

  # SUM adds the present values in relation record order with the numeric +,
  # keeps its argument's numeric type, and gives missing for a group with no
  # record or no present value; an int total outside the int range fails, and
  # a non-finite float total is missing (FORMULA-15, FORMULA-19, FORMULA-23,
  # FORMULA-24, VALUE-4).
  - id: sum-adds-the-present-values
    context: aggregate
    covers: [SUM, typing, missing]
    text: "SUM(R.X)"
    columns: {X: int}
    groups:
      - [{X: 1}, {X: 2}, {X: 3}]
      - [{X: 5}, {X: null}]
      - [{X: null}]
      - []
    type: int
    values: [6, 5, null, null]
  - id: sum-of-floats-is-a-float
    context: aggregate
    covers: [SUM, typing]
    text: "SUM(R.F)"
    columns: {F: float}
    groups:
      - [{F: 0.5}, {F: 0.25}]
      - [{F: 1.5}]
    type: float
    values: [0.75, 1.5]
  - id: sum-adds-in-record-order
    context: aggregate
    covers: [SUM, record-order, precision]
    text: "SUM(R.F)"
    columns: {F: float}
    groups:
      - [{F: 1.0e+16}, {F: 1.0}, {F: -1.0e+16}]
      - [{F: 1.0e+16}, {F: -1.0e+16}, {F: 1.0}]
    type: float
    values: [0.0, 1.0]
  - id: an-int-sum-outside-the-int-range-fails
    context: aggregate
    covers: [SUM, overflow]
    text: "SUM(R.X)"
    columns: {X: int}
    groups:
      - [{X: 9223372036854775807}, {X: 1}]
    type: int
    phase: derivation
    condition: integer_overflow
    rule: VALUE-5
  - id: a-float-sum-beyond-binary64-is-missing
    context: aggregate
    covers: [SUM, non-finite]
    text: "SUM(R.F)"
    columns: {F: float}
    groups:
      - [{F: 1.0e+308}, {F: 1.0e+308}]
      - [{F: 1.0e+308}]
    type: float
    values: [null, 1.0e+308]
  - id: sum-takes-a-number
    context: aggregate
    covers: [SUM]
    text: "SUM(R.S)"
    columns: {S: str}
    groups:
      - [{S: "1"}]
    phase: validation
    condition: incompatible_input_type
    rule: FORMULA-23
  - id: a-reducer-is-case-insensitive
    context: aggregate
    covers: [SUM, keyword-case]
    text: "sum(R.X)"
    columns: {X: int}
    groups:
      - [{X: 1}, {X: 2}]
    type: int
    values: [3]

  # COUNT(x) counts the present values and COUNT(R.*) the records; each is an
  # int, 0 for a group whose values are all missing, and missing for a group
  # with no record (FORMULA-18, FORMULA-23, FORMULA-24).
  - id: count-counts-present-values
    context: aggregate
    covers: [COUNT, typing, missing]
    text: "COUNT(R.X)"
    columns: {X: int}
    groups:
      - [{X: 1}, {X: null}, {X: 3}]
      - [{X: null}]
      - []
    type: int
    values: [2, 0, null]
  - id: count-of-the-record-star-counts-records
    context: aggregate
    covers: [COUNT, missing]
    text: "COUNT(R.*)"
    columns: {X: int}
    groups:
      - [{X: 1}, {X: null}, {X: 3}]
      - [{X: null}]
      - []
    type: int
    values: [3, 1, null]
  - id: count-takes-any-type
    context: aggregate
    covers: [COUNT]
    text: "COUNT(R.S)"
    columns: {S: str}
    groups:
      - [{S: "a"}, {S: "b"}]
      - [{S: null}]
    type: int
    values: [2, 0]
  - id: counting-values-and-records-differ-by-the-missing-values
    context: aggregate
    covers: [COUNT, "-", missing]
    text: "COUNT(R.X) - COUNT(R.*)"
    columns: {X: int}
    groups:
      - [{X: 1}, {X: null}]
      - [{X: 2}]
    type: int
    values: [-1, 0]

  # MIN and MAX give the least and greatest present value and keep its type:
  # numbers by value, text by scalar value and dates chronologically
  # (FORMULA-18, FORMULA-23, FORMULA-24, VALUE-20, VALUE-21).
  - id: min-is-the-least-present-value
    context: aggregate
    covers: [MIN, missing]
    text: "MIN(R.X)"
    columns: {X: int}
    groups:
      - [{X: 3}, {X: 1}, {X: 2}]
      - [{X: null}, {X: 5}]
      - [{X: null}]
      - []
    type: int
    values: [1, 5, null, null]
  - id: max-is-the-greatest-present-value
    context: aggregate
    covers: [MAX, missing]
    text: "MAX(R.X)"
    columns: {X: int}
    groups:
      - [{X: 3}, {X: 1}, {X: 2}]
      - [{X: null}, {X: 5}]
      - [{X: null}]
      - []
    type: int
    values: [3, 5, null, null]
  - id: min-of-text-orders-by-scalar-value
    context: aggregate
    covers: [MIN, text-order]
    text: "MIN(R.S)"
    columns: {S: str}
    groups:
      - [{S: "b"}, {S: "a"}, {S: "B"}]
      - [{S: "abc"}, {S: "ab"}]
    type: str
    values: ["B", "ab"]
  - id: max-of-text-orders-by-scalar-value
    context: aggregate
    covers: [MAX, text-order]
    text: "MAX(R.S)"
    columns: {S: str}
    groups:
      - [{S: "b"}, {S: "a"}, {S: "B"}]
      - [{S: "abc"}, {S: "ab"}]
    type: str
    values: ["b", "abc"]
  - id: min-of-dates-is-the-earliest
    context: aggregate
    covers: [MIN, temporal]
    text: "MIN(R.D)"
    columns: {D: date}
    groups:
      - [{D: "2025-03-01"}, {D: "2024-12-31"}]
    type: date
    values: ["2024-12-31"]
  - id: max-of-datetimes-is-the-latest
    context: aggregate
    covers: [MAX, temporal]
    text: "MAX(R.DT)"
    columns: {DT: datetime}
    groups:
      - [{DT: "2025-03-01T08:00:00"}, {DT: "2025-03-01T07:59:59"}]
    type: datetime
    values: ["2025-03-01T08:00:00"]

  # MEAN divides the ordered SUM by COUNT, is a float, and gives missing
  # before dividing when no value is present; its SUM fails on int overflow
  # even when the mean would fit (FORMULA-15, FORMULA-19, FORMULA-23,
  # FORMULA-24).
  - id: mean-of-ints-is-a-float
    context: aggregate
    covers: [MEAN, typing, missing]
    text: "MEAN(R.X)"
    columns: {X: int}
    groups:
      - [{X: 1}, {X: 2}]
      - [{X: 1}, {X: 2}, {X: null}]
      - [{X: null}]
      - []
    type: float
    values: [1.5, 1.5, null, null]
  - id: mean-divides-the-ordered-sum
    context: aggregate
    covers: [MEAN, precision]
    text: "MEAN(R.F)"
    columns: {F: float}
    groups:
      - [{F: 0.1}, {F: 0.2}]
    type: float
    values: [0.15000000000000002]
  - id: mean-fails-when-its-int-sum-overflows
    context: aggregate
    covers: [MEAN, overflow]
    text: "MEAN(R.X)"
    columns: {X: int}
    groups:
      - [{X: 9223372036854775807}, {X: 1}]
    type: float
    phase: derivation
    condition: integer_overflow
    rule: VALUE-5
  - id: mean-takes-a-number
    context: aggregate
    covers: [MEAN]
    text: "MEAN(R.S)"
    columns: {S: str}
    groups:
      - [{S: "1"}]
    phase: validation
    condition: incompatible_input_type
    rule: FORMULA-23

  # ONLY gives the value of a group's one record, even a missing one, gives
  # missing for a group with no record, and fails for a group of more than
  # one record, counting records rather than values (FORMULA-20, FORMULA-23,
  # FORMULA-24).
  - id: only-gives-the-value-of-the-one-record
    context: aggregate
    covers: [ONLY, missing]
    text: "ONLY(R.X)"
    columns: {X: int}
    groups:
      - [{X: 7}]
      - [{X: null}]
      - []
    type: int
    values: [7, null, null]
  - id: only-keeps-the-type-it-reduces
    context: aggregate
    covers: [ONLY]
    text: "ONLY(R.S)"
    columns: {S: str}
    groups:
      - [{S: "a"}]
    type: str
    values: ["a"]
  - id: only-of-two-records-fails
    context: aggregate
    covers: [ONLY]
    text: "ONLY(R.X)"
    columns: {X: int}
    groups:
      - [{X: 1}, {X: 2}]
    type: int
    phase: derivation
    condition: aggregate_multiple_records
    rule: FORMULA-20
  - id: only-counts-records-not-values
    context: aggregate
    covers: [ONLY, missing]
    text: "ONLY(R.X)"
    columns: {X: int}
    groups:
      - [{X: 5}, {X: null}]
    type: int
    phase: derivation
    condition: aggregate_multiple_records
    rule: FORMULA-20

  # STR_JOIN writes each present value as the text a str column converts it
  # to, in the aggregate's order_by order, records tied on every term keeping
  # relation record order, with its separator between two values; distinct
  # writes each text once, where it first occurs; no present value gives
  # missing, never empty text. COUNT(x) with distinct counts the different
  # present values, 0 when every value is missing and missing for no record.
  # A field beside a reducer that does not read it, a field STR_JOIN lacks
  # and arithmetic over STR_JOIN are refused before any record is read
  # (FORMULA-18, FORMULA-19, FORMULA-23, FORMULA-24, LOOKUP-10, VALUE-3,
  # VALUE-8, VALUE-17, VALUE-19, VALUE-22, VALUE-23).
  - id: str-join-joins-numbers-in-declared-order-not-stored-order
    context: aggregate
    covers: [STR_JOIN, declared-order, missing]
    text: "STR_JOIN(R.X)"
    columns: {X: int}
    order_by: [R.X]
    separator: ", "
    groups:
      - [{X: 10}, {X: 2}, {X: null}]
      - [{X: 3}]
      - [{X: null}]
      - []
    type: str
    values: ["2, 10", "3", null, null]
  - id: str-join-keeps-record-order-between-tied-records
    context: aggregate
    covers: [STR_JOIN, declared-order, record-order]
    text: "STR_JOIN(R.S)"
    columns: {N: int, S: str}
    order_by: [R.N]
    separator: "|"
    groups:
      - [{N: 2, S: "b"}, {N: 1, S: "z"}, {N: 2, S: "a"}]
    type: str
    values: ["z|b|a"]
  - id: str-join-orders-descending-with-a-missing-term-last
    context: aggregate
    covers: [STR_JOIN, declared-order, missing]
    text: "STR_JOIN(R.S)"
    columns: {N: int, S: str}
    order_by: [{variable: R.N, direction: desc}]
    separator: "-"
    groups:
      - [{N: 1, S: "a"}, {N: null, S: "m"}, {N: 3, S: "c"}]
    type: str
    values: ["c-a-m"]
  - id: str-join-writes-a-float-as-its-shortest-text
    context: aggregate
    covers: [STR_JOIN, typing]
    text: "STR_JOIN(R.F)"
    columns: {F: float}
    order_by: [R.F]
    separator: ", "
    groups:
      - [{F: 2.5}, {F: 0.1}, {F: 2.0}]
    type: str
    values: ["0.1, 2, 2.5"]
  - id: str-join-writes-a-date-as-its-canonical-text
    context: aggregate
    covers: [STR_JOIN, temporal]
    text: "STR_JOIN(R.D)"
    columns: {D: date}
    order_by: [{variable: R.D, direction: desc}]
    separator: " / "
    groups:
      - [{D: "2024-12-31"}, {D: "2025-03-01"}]
    type: str
    values: ["2025-03-01 / 2024-12-31"]
  - id: str-join-writes-a-datetime-as-its-canonical-text
    context: aggregate
    covers: [STR_JOIN, temporal]
    text: "STR_JOIN(R.DT)"
    columns: {DT: datetime}
    order_by: [R.DT]
    separator: "; "
    groups:
      - [{DT: "2025-03-01T08:00:00"}, {DT: "2025-03-01T07:59:59"}]
    type: str
    values: ["2025-03-01T07:59:59; 2025-03-01T08:00:00"]
  - id: str-join-with-distinct-writes-each-text-once
    context: aggregate
    covers: [STR_JOIN, distinct, text-order]
    text: "STR_JOIN(R.S)"
    columns: {S: str}
    order_by: [R.S]
    separator: ", "
    distinct: true
    groups:
      - [{S: "HEADACHE"}, {S: "FEVER"}, {S: "HEADACHE"}]
      - [{S: "a"}, {S: "A"}, {S: "a"}]
    type: str
    values: ["FEVER, HEADACHE", "A, a"]
  - id: str-join-with-distinct-keeps-the-first-occurrence-in-order
    context: aggregate
    covers: [STR_JOIN, distinct, declared-order]
    text: "STR_JOIN(R.S)"
    columns: {N: int, S: str}
    order_by: [R.N]
    separator: ", "
    distinct: true
    groups:
      - [{N: 3, S: "b"}, {N: 1, S: "b"}, {N: 2, S: "a"}]
    type: str
    values: ["b, a"]
  - id: str-join-takes-an-empty-separator
    context: aggregate
    covers: [STR_JOIN]
    text: "STR_JOIN(R.S)"
    columns: {S: str}
    order_by: [R.S]
    separator: ""
    groups:
      - [{S: "b"}, {S: "a"}]
    type: str
    values: ["ab"]
  - id: str-join-joins-a-grouped-rows-records-in-declared-order
    context: aggregate
    covers: [STR_JOIN, declared-order]
    text: "STR_JOIN(R.S)"
    columns: {G: int, N: int, S: str}
    group_by: [G]
    order_by: [R.N]
    separator: ", "
    groups:
      - [{G: 1, N: 2, S: "b"}, {G: 1, N: 1, S: "a"}]
    type: str
    values: ["a, b"]
  - id: count-with-distinct-counts-each-different-value-once
    context: aggregate
    covers: [COUNT, distinct, missing]
    text: "COUNT(R.S)"
    columns: {S: str}
    distinct: true
    groups:
      - [{S: "a"}, {S: "b"}, {S: "a"}, {S: null}]
      - [{S: null}]
      - []
    type: int
    values: [2, 0, null]
  - id: count-with-distinct-compares-numbers-by-value
    context: aggregate
    covers: [COUNT, distinct, exactness]
    text: "COUNT(R.F)"
    columns: {F: float}
    distinct: true
    groups:
      - [{F: 0.0}, {F: -0.0}, {F: 1.5}, {F: 1.5}]
    type: int
    values: [2]
  - id: arithmetic-over-a-join-is-refused
    context: aggregate
    covers: [STR_JOIN, "+", typing]
    text: "STR_JOIN(R.X) + 1"
    columns: {X: int}
    order_by: [R.X]
    separator: ", "
    groups:
      - [{X: 1}]
    phase: validation
    condition: incompatible_input_type
    rule: FORMULA-23
  - id: a-join-without-its-order-is-refused
    context: aggregate
    covers: [STR_JOIN, declared-order]
    text: "STR_JOIN(R.X)"
    columns: {X: int}
    separator: ", "
    groups:
      - [{X: 1}]
    phase: validation
    condition: unpaired_fields
    rule: LOOKUP-10
  - id: a-join-without-its-separator-is-refused
    context: aggregate
    covers: [STR_JOIN]
    text: "STR_JOIN(R.X)"
    columns: {X: int}
    order_by: [R.X]
    groups:
      - [{X: 1}]
    phase: validation
    condition: unpaired_fields
    rule: LOOKUP-10
  - id: an-order-beside-sum-is-refused
    context: aggregate
    covers: [SUM, declared-order]
    text: "SUM(R.X)"
    columns: {X: int}
    order_by: [R.X]
    groups:
      - [{X: 1}]
    phase: validation
    condition: unpaired_fields
    rule: LOOKUP-10
  - id: distinct-beside-sum-is-refused
    context: aggregate
    covers: [SUM, distinct]
    text: "SUM(R.X)"
    columns: {X: int}
    distinct: true
    groups:
      - [{X: 1}]
    phase: validation
    condition: unpaired_fields
    rule: LOOKUP-10
  - id: distinct-beside-a-record-count-is-refused
    context: aggregate
    covers: [COUNT, distinct]
    text: "COUNT(R.*)"
    columns: {X: int}
    distinct: true
    groups:
      - [{X: 1}]
    phase: validation
    condition: unpaired_fields
    rule: LOOKUP-10

  # MEDIAN, Q1, Q3 and QUANTILE are R's default quantile, type 7 of Hyndman
  # and Fan, at 0.5, 0.25, 0.75 and the aggregate's quantile p: the n present
  # values sorted ascending, h = (n - 1) * p + 1 in binary64, j its floor and
  # g = h - j, then x_j + g * (x_{j+1} - x_j), or x_j when g is 0. STDDEV and
  # VARIANCE are the sample deviation and variance, the squared deviations
  # from the ordered MEAN added in record order and divided by n - 1. GEOMEAN
  # is EXP of the ordered mean of LN(x); its cases' LN and EXP steps are those
  # whose pinned portable result is also the correctly rounded one. Each is a
  # float, skips missing values and gives missing for a group with no present
  # value, and STDDEV and VARIANCE for a group with one. GEOMEAN of a zero
  # fails, an int difference outside the int range fails, and a quantile
  # outside 0 through 1, QUANTILE without one and one beside another reducer
  # are refused before any record is read (FORMULA-15, FORMULA-18, FORMULA-19,
  # FORMULA-23, FORMULA-24, LOOKUP-10, VALUE-5, VALUE-8, VALUE-10, VALUE-19).
  - id: median-is-the-middle-value-or-between-the-two-middle-values
    context: aggregate
    covers: [MEDIAN, missing, typing]
    text: "MEDIAN(R.X)"
    columns: {X: int}
    groups:
      - [{X: 50}, {X: 10}, {X: 40}, {X: 20}, {X: 30}]
      - [{X: 9}, {X: 2}, {X: 10}, {X: 5}, {X: 4}, {X: 7}]
      - [{X: 7}]
      - [{X: null}, {X: 3}, {X: 1}]
      - [{X: null}]
      - []
    type: float
    values: [30.0, 6.0, 7.0, 2.0, null, null]
  - id: the-first-quartile-interpolates-between-sorted-values
    context: aggregate
    covers: [Q1]
    text: "Q1(R.X)"
    columns: {X: int}
    groups:
      - [{X: 2}, {X: 4}, {X: 5}, {X: 7}, {X: 9}, {X: 10}]
      - [{X: 1}, {X: 2}, {X: 3}, {X: 4}, {X: 5}, {X: 6}, {X: 7}, {X: 8}]
      - [{X: 10}, {X: 20}, {X: 30}, {X: 40}, {X: 50}]
      - [{X: 7}]
    type: float
    values: [4.25, 2.75, 20.0, 7.0]
  - id: the-third-quartile-interpolates-between-sorted-values
    context: aggregate
    covers: [Q3]
    text: "Q3(R.X)"
    columns: {X: int}
    groups:
      - [{X: 2}, {X: 4}, {X: 5}, {X: 7}, {X: 9}, {X: 10}]
      - [{X: 1}, {X: 2}, {X: 3}, {X: 4}, {X: 5}, {X: 6}, {X: 7}, {X: 8}]
      - [{X: 10}, {X: 20}, {X: 30}, {X: 40}, {X: 50}]
      - [{X: 7}]
    type: float
    values: [8.5, 6.25, 40.0, 7.0]
  - id: quantile-reads-the-probability-its-field-gives
    context: aggregate
    covers: [QUANTILE, precision, missing]
    text: "QUANTILE(R.X)"
    columns: {X: int}
    quantile: 0.9
    groups:
      - [{X: 1}, {X: 2}, {X: 3}, {X: 4}, {X: 5}, {X: 6}, {X: 7}, {X: 8},
         {X: 9}, {X: 10}]
      - [{X: 3}, {X: 1}, {X: 2}]
      - [{X: 7}]
      - [{X: null}]
    type: float
    values: [9.1, 2.8, 7.0, null]
  - id: a-quantile-of-zero-is-the-least-value
    context: aggregate
    covers: [QUANTILE]
    text: "QUANTILE(R.X)"
    columns: {X: int}
    quantile: 0
    groups:
      - [{X: 3}, {X: 1}, {X: 2}]
    type: float
    values: [1.0]
  - id: a-quantile-of-one-is-the-greatest-value
    context: aggregate
    covers: [QUANTILE]
    text: "QUANTILE(R.X)"
    columns: {X: int}
    quantile: 1
    groups:
      - [{X: 3}, {X: 1}, {X: 2}]
    type: float
    values: [3.0]
  - id: stddev-is-the-sample-standard-deviation
    context: aggregate
    covers: [STDDEV, missing]
    text: "STDDEV(R.X)"
    columns: {X: int}
    groups:
      - [{X: 2}, {X: 4}, {X: 4}, {X: 4}, {X: 5}, {X: 5}, {X: 7}, {X: 9}]
      - [{X: 10}, {X: 20}, {X: 30}, {X: 40}, {X: 50}]
      - [{X: 7}]
      - [{X: null}]
      - []
    type: float
    values: [2.138089935299395, 15.811388300841896, null, null, null]
  - id: variance-divides-by-one-less-than-the-count
    context: aggregate
    covers: [VARIANCE, precision, missing]
    text: "VARIANCE(R.X)"
    columns: {X: int}
    groups:
      - [{X: 2}, {X: 4}, {X: 4}, {X: 4}, {X: 5}, {X: 5}, {X: 7}, {X: 9}]
      - [{X: 2}, {X: 4}, {X: 5}, {X: 7}, {X: 9}, {X: 10}]
      - [{X: null}, {X: 7}]
    type: float
    values: [4.571428571428571, 9.366666666666667, null]
  - id: geomean-is-exp-of-the-ordered-mean-log
    context: aggregate
    covers: [GEOMEAN, precision, missing]
    text: "GEOMEAN(R.X)"
    columns: {X: int}
    groups:
      - [{X: 1}, {X: 10}, {X: 100}]
      - [{X: 1}, {X: 1}]
      - [{X: null}]
      - []
    type: float
    values: [10.000000000000002, 1.0, null, null]
  - id: a-coefficient-of-variation-is-arithmetic-over-reductions
    context: aggregate
    covers: [STDDEV, MEAN, "*", "/"]
    text: "100 * STDDEV(R.X) / MEAN(R.X)"
    columns: {X: int}
    groups:
      - [{X: 2}, {X: 4}, {X: 4}, {X: 4}, {X: 5}, {X: 5}, {X: 7}, {X: 9}]
    type: float
    values: [42.76179870598791]
  - id: geomean-of-a-zero-fails
    context: aggregate
    covers: [GEOMEAN]
    text: "GEOMEAN(R.X)"
    columns: {X: int}
    groups:
      - [{X: 2}, {X: 0}]
    type: float
    phase: derivation
    condition: ln_of_nonpositive
    rule: FORMULA-15
  - id: a-median-whose-int-difference-overflows-fails
    context: aggregate
    covers: [MEDIAN, overflow]
    text: "MEDIAN(R.X)"
    columns: {X: int}
    groups:
      - [{X: -9223372036854775808}, {X: 9223372036854775807}]
    type: float
    phase: derivation
    condition: integer_overflow
    rule: VALUE-5
  - id: stddev-takes-a-number
    context: aggregate
    covers: [STDDEV]
    text: "STDDEV(R.S)"
    columns: {S: str}
    groups:
      - [{S: "1"}]
    phase: validation
    condition: incompatible_input_type
    rule: FORMULA-23
  - id: a-quantile-above-one-is-refused
    context: aggregate
    covers: [QUANTILE]
    text: "QUANTILE(R.X)"
    columns: {X: int}
    quantile: 1.5
    groups:
      - [{X: 1}]
    phase: validation
    condition: invalid_field_type
    rule: FORMULA-18
  - id: quantile-without-its-probability-is-refused
    context: aggregate
    covers: [QUANTILE]
    text: "QUANTILE(R.X)"
    columns: {X: int}
    groups:
      - [{X: 1}]
    phase: validation
    condition: unpaired_fields
    rule: LOOKUP-10
  - id: a-probability-beside-mean-is-refused
    context: aggregate
    covers: [MEAN]
    text: "MEAN(R.X)"
    columns: {X: int}
    quantile: 0.5
    groups:
      - [{X: 1}]
    phase: validation
    condition: unpaired_fields
    rule: LOOKUP-10
  - id: a-probability-beside-median-is-refused
    context: aggregate
    covers: [MEDIAN]
    text: "MEDIAN(R.X)"
    columns: {X: int}
    quantile: 0.5
    groups:
      - [{X: 1}]
    phase: validation
    condition: unpaired_fields
    rule: LOOKUP-10

  # Arithmetic and the numeric functions combine reductions and stand in
  # their arguments: a record whose argument is missing contributes nothing,
  # a missing reduction propagates, and a grouping column may stand outside a
  # reduction (FORMULA-14, FORMULA-22, FORMULA-23, FORMULA-24).
  - id: a-ratio-of-reductions-is-a-float
    context: aggregate
    covers: [SUM, COUNT, "/", missing]
    text: "SUM(R.X) / COUNT(R.*)"
    columns: {X: int}
    groups:
      - [{X: 1}, {X: 2}, {X: null}]
      - [{X: 4}]
      - []
    type: float
    values: [1.0, 4.0, null]
  - id: arithmetic-over-a-reduction-keeps-an-int
    context: aggregate
    covers: [SUM, "+", missing]
    text: "SUM(R.X) + 1"
    columns: {X: int}
    groups:
      - [{X: 1}, {X: 2}]
      - []
    type: int
    values: [4, null]
  - id: a-reduction-argument-skips-a-record-missing-either-factor
    context: aggregate
    covers: [SUM, "*", missing]
    text: "SUM(R.X * R.Z)"
    columns: {X: int, Z: int}
    groups:
      - [{X: 2, Z: 3}, {X: 4, Z: null}, {X: null, Z: 5}]
      - [{X: null, Z: 1}]
    type: int
    values: [6, null]
  - id: a-function-may-stand-in-a-reduction-argument
    context: aggregate
    covers: [SUM, ABS]
    text: "SUM(ABS(R.X))"
    columns: {X: int}
    groups:
      - [{X: -1}, {X: 2}, {X: -3}]
    type: int
    values: [6]
  - id: nullif-may-take-a-reduction
    context: aggregate
    covers: [NULLIF, SUM]
    text: "NULLIF(SUM(R.X), 0)"
    columns: {X: int}
    groups:
      - [{X: 1}, {X: -1}]
      - [{X: 2}]
    type: int
    values: [null, 2]
  - id: unary-minus-negates-a-reduction
    context: aggregate
    covers: [SUM, "unary -"]
    text: "-SUM(R.X)"
    columns: {X: int}
    groups:
      - [{X: 1}, {X: 2}]
    type: int
    values: [-3]
  - id: a-grouping-column-may-stand-outside-a-reduction
    context: aggregate
    covers: [SUM, "*"]
    text: "SUM(R.X) * R.N"
    columns: {N: int, X: int}
    group_by: [N]
    groups:
      - [{N: 2, X: 1}, {N: 2, X: 3}]
      - [{N: 10, X: null}, {N: 10, X: 5}]
    type: int
    values: [8, 50]

  # aggregate.expr refuses comparisons, Boolean logic, string and temporal
  # literals and str_contains (FORMULA-27), names outside the closed lists
  # (FORMULA-13), nested reductions (FORMULA-21), an identifier outside a
  # reduction that is not a grouping column (FORMULA-22) and arithmetic over a
  # reduction or grouping column that is not numeric (FORMULA-23).
  - id: a-comparison-is-refused-in-an-aggregate
    context: aggregate
    covers: [">", context]
    text: "SUM(R.X) > 1"
    columns: {X: int}
    groups:
      - [{X: 2}]
    phase: validation
    condition: prohibited_construct
    rule: FORMULA-27
  - id: boolean-logic-is-refused-in-an-aggregate
    context: aggregate
    covers: [AND, context]
    text: "SUM(R.X) AND COUNT(R.*)"
    columns: {X: int}
    groups:
      - [{X: 2}]
    phase: validation
    condition: prohibited_construct
    rule: FORMULA-27
  - id: a-string-literal-is-refused-in-an-aggregate
    context: aggregate
    covers: [literal, context]
    text: "SUM(R.X) + 'a'"
    columns: {X: int}
    groups:
      - [{X: 2}]
    phase: validation
    condition: prohibited_construct
    rule: FORMULA-27
  - id: a-temporal-literal-is-refused-in-an-aggregate
    context: aggregate
    covers: [DATE, context]
    text: "DATE '2025-06-01'"
    columns: {X: int}
    groups:
      - [{X: 2}]
    phase: validation
    condition: prohibited_construct
    rule: FORMULA-27
  - id: str-contains-is-refused-in-an-aggregate-at-its-pattern
    context: aggregate
    covers: [STR_CONTAINS, literal, context]
    text: "str_contains(R.S, 'a')"
    columns: {S: str}
    groups:
      - [{S: "a"}]
    phase: validation
    condition: prohibited_construct
    rule: FORMULA-27
  - id: avg-is-not-a-reducer
    context: aggregate
    covers: [vocabulary]
    text: "AVG(R.X)"
    columns: {X: int}
    groups:
      - [{X: 2}]
    phase: validation
    condition: prohibited_function
    rule: FORMULA-13
  - id: percentile-is-not-a-reducer
    context: aggregate
    covers: [vocabulary]
    text: "PERCENTILE(R.X)"
    columns: {X: int}
    groups:
      - [{X: 2}]
    phase: validation
    condition: prohibited_function
    rule: FORMULA-13
  - id: rounding-a-reduction-is-refused
    context: aggregate
    covers: [vocabulary]
    text: "ROUND(SUM(R.F), 2)"
    columns: {F: float}
    groups:
      - [{F: 2.5}]
    phase: validation
    condition: prohibited_function
    rule: FORMULA-13
  - id: coalescing-a-reduction-is-refused
    context: aggregate
    covers: [vocabulary]
    text: "COALESCE(SUM(R.X), 0)"
    columns: {X: int}
    groups:
      - [{X: 2}]
    phase: validation
    condition: prohibited_function
    rule: FORMULA-13
  - id: reductions-do-not-nest
    context: aggregate
    covers: [MAX, SUM]
    text: "MAX(SUM(R.X))"
    columns: {X: int}
    groups:
      - [{X: 2}]
    phase: validation
    condition: nested_reduction
    rule: FORMULA-21
  - id: an-identifier-outside-a-reduction-must-be-grouped
    context: aggregate
    covers: [SUM, "+"]
    text: "SUM(R.X) + R.Z"
    columns: {X: int, Z: int}
    groups:
      - [{X: 2, Z: 1}]
    phase: validation
    condition: aggregate_identifier_not_grouped
    rule: FORMULA-22
  - id: arithmetic-over-a-text-reduction-is-refused
    context: aggregate
    covers: [MIN, "+"]
    text: "MIN(R.S) + 1"
    columns: {S: str}
    groups:
      - [{S: "a"}]
    phase: validation
    condition: incompatible_input_type
    rule: FORMULA-23
  - id: arithmetic-over-a-text-grouping-column-is-refused
    context: aggregate
    covers: [SUM, "+"]
    text: "SUM(R.X) + R.G"
    columns: {G: str, X: int}
    group_by: [G]
    groups:
      - [{G: "a", X: 1}]
    phase: validation
    condition: incompatible_input_type
    rule: FORMULA-23
  - id: a-text-reduction-in-arithmetic-is-refused-before-any-record-is-read
    context: aggregate
    covers: [MAX, "*", typing]
    text: "2 * MAX(R.S)"
    columns: {S: str}
    groups:
      - []
    phase: validation
    condition: incompatible_input_type
    rule: FORMULA-23
