# Shared fixtures for the portable regular-expression contract.
#
# Every case names one pattern and, unless the pattern is rejected, one
# subject and the outcome each consumer produces for it:
#
#   schema_pattern  the schema `pattern` descriptor keyword, a full match
#   matches         the `matches` column verification, a search
#   str_extract     the str_extract expression, a search keeping one group
#   str_replace     optional: the str_replace expression, a search replacing
#                   every match, with its replacement text and its result
#
# The matches outcome also governs the str_contains expression and predicate
# call. Those consumers share search semantics but retain their own result
# type, missing behavior, and invalid-pattern condition.
#
# A str_extract outcome is null when the pattern matched nowhere. It is a
# mapping of the requested group and its value when the pattern matched, and
# that value is null when the match did not enter the group.
#
# A str_replace outcome is a mapping of the replacement text and the
# complete result. A subject the pattern matches nowhere is its own result.
#
# A case carrying `invalid: true` records a pattern the portable contract
# rejects. Every consumer rejects such a pattern, using invalid_regex except
# the str_contains predicate call, which uses invalid_predicate. It therefore
# names no subject and no outcome.
#
# Subjects are YAML double-quoted scalars so that a non-ASCII scalar value is
# written as an escape and this file stays ASCII. Patterns are
# single-quoted so that a backslash is literal, and spell a non-ASCII scalar
# with the ECMAScript \u{...} escape instead.
#
# The `dialect` tag marks a case the normalization layer exists to pin: the
# host libraries the consumers build on disagree there (on what `\d`, `\w`,
# `\s`, `.`, and `$` match), so the case proves the normalization rather
# than an engine choice.

schema_version: "1.0"
contract: regex
contract_version: "2.0.0"
portable_contract:
  grammar: "ECMA-262 Pattern with the Unicode flag set, without property escapes and without variable-length lookbehind"
  normalization: "REQ-0822 through REQ-0826 over the host library: ASCII-only \\d and \\w, the ECMA-262 \\s set, scalar dot, end-only $, \\u{...} expansion, and rejection of (?P<...>), inline flags, \\p{...}, malformed escapes, and variable-length lookbehind"
cases:
  - id: ascii-digit-class-rejects-arabic-indic-digit
    covers: [unicode, escaping, dialect]
    pattern: '^\d$'
    subject: "\u0665"
    schema_pattern: false
    matches: false
    str_extract: null
    str_replace: {replacement: "-", value: "\u0665"}
  - id: ascii-digit-class-accepts-ascii-digit
    covers: [unicode, escaping]
    pattern: '^\d$'
    subject: "5"
    schema_pattern: true
    matches: true
    str_extract: {group: 0, value: "5"}
  - id: ascii-word-class-rejects-latin1-letter
    covers: [unicode, escaping, dialect]
    pattern: '^\w$'
    subject: "\u00E9"
    schema_pattern: false
    matches: false
    str_extract: null
  - id: whitespace-class-accepts-zero-width-no-break-space
    covers: [unicode, escaping, dialect]
    pattern: '^\s$'
    subject: "\uFEFF"
    schema_pattern: true
    matches: true
    str_extract: {group: 0, value: "\uFEFF"}
  - id: dot-rejects-line-separator
    covers: [unicode, dialect]
    pattern: '^.$'
    subject: "\u2028"
    schema_pattern: false
    matches: false
    str_extract: null
  - id: dot-matches-supplementary-scalar-once
    covers: [unicode]
    pattern: '^.$'
    subject: "\U0001D400"
    schema_pattern: true
    matches: true
    str_extract: {group: 0, value: "\U0001D400"}
    str_replace: {replacement: "-", value: "-"}
  - id: supplementary-scalar-is-not-two-characters
    covers: [unicode]
    pattern: '^..$'
    subject: "\U0001D400"
    schema_pattern: false
    matches: false
    str_extract: null
  - id: code-point-escape-matches-supplementary-scalar
    covers: [unicode, escaping, dialect]
    pattern: '^\u{1D400}$'
    subject: "\U0001D400"
    schema_pattern: true
    matches: true
    str_extract: {group: 0, value: "\U0001D400"}
  - id: code-point-escape-matches-latin1-letter
    covers: [unicode, escaping, dialect]
    pattern: '^\u{00E9}$'
    subject: "\u00E9"
    schema_pattern: true
    matches: true
    str_extract: {group: 0, value: "\u00E9"}
  - id: property-escape-accepts-unicode-letters
    covers: [unicode, escaping, dialect]
    pattern: '^\p{L}+$'
    invalid: true
  - id: property-escape-rejects-non-latin-digit-as-letter
    covers: [unicode, escaping, dialect]
    pattern: '^\p{L}$'
    invalid: true
  - id: canonically-equivalent-subject-does-not-match
    covers: [unicode, dialect]
    pattern: '^\u{00E9}$'
    subject: "e\u0301"
    schema_pattern: false
    matches: false
    str_extract: null
  - id: anchored-pattern-spans-the-whole-subject
    covers: [anchors]
    pattern: '^AE-[0-9]{3}$'
    subject: "AE-007"
    schema_pattern: true
    matches: true
    str_extract: {group: 0, value: "AE-007"}
  - id: dollar-rejects-trailing-line-feed
    covers: [anchors, dialect]
    pattern: '^a$'
    subject: "a\n"
    schema_pattern: false
    matches: false
    str_extract: null
  - id: caret-does-not-match-after-a-line-feed
    covers: [anchors]
    pattern: '^b'
    subject: "a\nb"
    schema_pattern: false
    matches: false
    str_extract: null
    str_replace: {replacement: "-", value: "a\nb"}
  - id: unanchored-pattern-searches-the-subject
    covers: [anchors, search]
    pattern: '[0-9]{3}'
    subject: "AE-007-X"
    schema_pattern: false
    matches: true
    str_extract: {group: 0, value: "007"}
    str_replace: {replacement: "#", value: "AE-#-X"}
  - id: word-boundary-anchors-inside-the-subject
    covers: [anchors, escaping]
    pattern: '\bAE\b'
    subject: "X AE Y"
    schema_pattern: false
    matches: true
    str_extract: {group: 0, value: "AE"}
  - id: variable-length-lookbehind-is-rejected
    covers: [anchors, dialect]
    pattern: '(?<=a+)b'
    invalid: true
  - id: group-zero-is-the-whole-match
    covers: [capture-groups]
    pattern: '^CATH-([^-]+)-[0-9]{4}$'
    subject: "CATH-SITE01-0042"
    schema_pattern: true
    matches: true
    str_extract: {group: 0, value: "CATH-SITE01-0042"}
  - id: group-one-is-the-first-opening-parenthesis
    covers: [capture-groups]
    pattern: '^CATH-([^-]+)-[0-9]{4}$'
    subject: "CATH-SITE01-0042"
    schema_pattern: true
    matches: true
    str_extract: {group: 1, value: "SITE01"}
  - id: non-capturing-group-takes-no-number
    covers: [capture-groups]
    pattern: '^(?:AE)-([0-9]{3})$'
    subject: "AE-007"
    schema_pattern: true
    matches: true
    str_extract: {group: 1, value: "007"}
  - id: named-group-is-numbered-in-source-order
    covers: [capture-groups, dialect]
    pattern: '^(?<prefix>[A-Z]+)-(?<serial>[0-9]+)$'
    subject: "AE-007"
    schema_pattern: true
    matches: true
    str_extract: {group: 2, value: "007"}
  - id: nested-groups-number-by-opening-parenthesis
    covers: [capture-groups]
    pattern: '^((a)(b))$'
    subject: "ab"
    schema_pattern: true
    matches: true
    str_extract: {group: 2, value: "a"}
  - id: lookahead-contributes-no-group-number
    covers: [capture-groups]
    pattern: '^(?=AE)([A-Z]+)$'
    subject: "AE"
    schema_pattern: true
    matches: true
    str_extract: {group: 1, value: "AE"}
  - id: backreference-names-a-group-number
    covers: [capture-groups, escaping]
    pattern: '^(a)\1$'
    subject: "aa"
    schema_pattern: true
    matches: true
    str_extract: {group: 1, value: "a"}
  - id: unentered-alternative-group-has-no-value
    covers: [capture-groups]
    pattern: '^(?:(a)|(b))$'
    subject: "b"
    schema_pattern: true
    matches: true
    str_extract: {group: 1, value: null}
  - id: optional-group-that-did-not-participate
    covers: [capture-groups]
    pattern: '^a(b)?$'
    subject: "a"
    schema_pattern: true
    matches: true
    str_extract: {group: 1, value: null}
  - id: repeated-alternative-clears-an-unentered-capture
    covers: [capture-groups, dialect]
    pattern: '(?:(a)|b){2,3}'
    subject: "abb"
    schema_pattern: true
    matches: true
    str_extract: {group: 1, value: null}
  - id: empty-optional-repetition-preserves-the-last-consuming-capture
    covers: [capture-groups, empty-match, dialect]
    pattern: '(a|){1,3}b'
    subject: "ab"
    schema_pattern: true
    matches: true
    str_extract: {group: 1, value: "a"}
  - id: nested-repeated-alternative-clears-an-unentered-capture
    covers: [capture-groups, dialect]
    pattern: '(a|(b))+'
    subject: "aba"
    schema_pattern: true
    matches: true
    str_extract: {group: 2, value: null}
  - id: escaped-dot-matches-only-a-full-stop
    covers: [escaping]
    pattern: '^a\.b$'
    subject: "a.b"
    schema_pattern: true
    matches: true
    str_extract: {group: 0, value: "a.b"}
  - id: escaped-dot-rejects-another-scalar
    covers: [escaping]
    pattern: '^a\.b$'
    subject: "axb"
    schema_pattern: false
    matches: false
    str_extract: null
  - id: unescaped-dot-matches-any-non-terminator
    covers: [escaping]
    pattern: '^a.b$'
    subject: "axb"
    schema_pattern: true
    matches: true
    str_extract: {group: 0, value: "axb"}
  - id: escaped-solidus-is-an-ordinary-scalar
    covers: [escaping]
    pattern: '^/a/$'
    subject: "/a/"
    schema_pattern: true
    matches: true
    str_extract: {group: 0, value: "/a/"}
  - id: star-pattern-keeps-an-empty-leftmost-match
    covers: [empty-match, search]
    pattern: 'a*'
    subject: "bbb"
    schema_pattern: false
    matches: true
    str_extract: {group: 0, value: ""}
    str_replace: {replacement: "-", value: "-b-b-b-"}
  - id: empty-alternative-matches-the-empty-subject
    covers: [empty-match]
    pattern: '^(?:a|)$'
    subject: ""
    schema_pattern: true
    matches: true
    str_extract: {group: 0, value: ""}
    str_replace: {replacement: "-", value: "-"}
  - id: empty-match-is-the-empty-string-not-missing
    covers: [empty-match]
    pattern: 'x*'
    subject: "y"
    schema_pattern: false
    matches: true
    str_extract: {group: 0, value: ""}
    str_replace: {replacement: "-", value: "-y-"}
  - id: replacement-resumes-where-a-nonempty-match-ends
    covers: [empty-match, search]
    pattern: 'a*'
    subject: "baa"
    schema_pattern: false
    matches: true
    str_extract: {group: 0, value: ""}
    str_replace: {replacement: "-", value: "-b--"}
  - id: replacement-steps-over-one-supplementary-scalar
    covers: [empty-match, unicode]
    pattern: 'x*'
    subject: "\U0001D400"
    schema_pattern: false
    matches: true
    str_extract: {group: 0, value: ""}
    str_replace: {replacement: "-", value: "-\U0001D400-"}
  - id: replacement-caret-matches-only-at-the-start
    covers: [anchors, search]
    pattern: '^a'
    subject: "aaa"
    schema_pattern: false
    matches: true
    str_extract: {group: 0, value: "a"}
    str_replace: {replacement: "", value: "aa"}
  - id: replacement-lookbehind-reads-before-the-scan-position
    covers: [anchors, search]
    pattern: '(?<=a)a'
    subject: "aaa"
    schema_pattern: false
    matches: true
    str_extract: {group: 0, value: "a"}
    str_replace: {replacement: "-", value: "a--"}
  - id: replacement-text-is-literal
    covers: [capture-groups, escaping]
    pattern: '(b)'
    subject: "abc"
    schema_pattern: false
    matches: true
    str_extract: {group: 0, value: "b"}
    str_replace: {replacement: "$1\\", value: "a$1\\c"}
  - id: replacement-whitespace-run-includes-no-break-space
    covers: [unicode, dialect, search]
    pattern: '\s+'
    subject: "a \u00A0\tb"
    schema_pattern: false
    matches: true
    str_extract: {group: 0, value: " \u00A0\t"}
    str_replace: {replacement: " ", value: "a b"}
  - id: python-named-group-syntax-is-rejected
    covers: [unsupported, dialect]
    pattern: '(?P<name>a)'
    invalid: true
  - id: inline-flag-group-is-rejected
    covers: [unsupported, dialect]
    pattern: '(?i)a'
    invalid: true
  - id: malformed-escape-is-rejected
    covers: [unsupported, escaping, dialect]
    pattern: '\a'
    invalid: true
  - id: lone-quantifier-brace-is-rejected
    covers: [unsupported, dialect]
    pattern: 'a{'
    invalid: true
  - id: unbalanced-parenthesis-is-rejected
    covers: [unsupported]
    pattern: 'a('
    invalid: true
  - id: reversed-class-range-is-rejected
    covers: [unsupported]
    pattern: '[z-a]'
    invalid: true
  - id: reversed-quantifier-bounds-are-rejected
    covers: [unsupported]
    pattern: 'a{2,1}'
    invalid: true
  - id: duplicate-group-name-is-rejected
    covers: [unsupported]
    pattern: '(?<dup>a)|(?<dup>b)'
    invalid: true
  - id: class-set-notation-is-rejected-without-the-v-flag
    covers: [unsupported]
    pattern: '[\p{L}--[a]]'
    invalid: true
