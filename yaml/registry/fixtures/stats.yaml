registry_version: "1.0.0"
namespace: stats
specification_versions: ["1.0"]

entries:
  - canonical_name: MEDIAN
    aliases: []
    evaluation_kind: reducer
    signature:
      parameters:
        - {name: value, types: [int, float]}
      min_arity: 1
      max_arity: 1
    type_promotion: always_float
    result_type: float
    missing_values: ignore_missing_all_missing
    failures:
      domain: []
      overflow: fail
      non_finite_result: fail
    determinism: order_independent
    accuracy:
      mode: binary64
      absolute_tolerance: 1.0e-15
      relative_tolerance: 1.0e-15
    availability: {since: "1.0", deprecated: null}
    definition: >-
      Conformance-only median using the midpoint of the two central values for
      an even number of non-missing values.
