version: "1.0"

root_class:
    - domain: {type: str, required: true}
    - datasets: {type: "dict[str, path]", required: true}
    - base: {type: str, required: false}
    - parents: {type: [path, "list[path]"], required: false}
    - keys: {type: "list[str]", required: true}
    - columns: {type: "list[column_class]", required: true}
    - rows: {type: "list[row_class]", required: false}
    - verifications: {type: [verification_class, "list[verification_class]"], required: false}
    - metadata: {type: list, required: false}
    
column_class:
    - name: {type: str, required: true}
    - type: {type: str, required: true}
    - label: {type: str, required: false}
    - derivation: {type: derivation_class, required: false}
    - verifications: {type: [verification_class, "list[verification_class]"], required: false}
    - metadata: {type: list, required: false}

row_class:
    - id: {type: str, required: true}
    - dataset: {type: str, required: false}
    - filter: {type: [sql, "list[sql]"], required: false}
    - derivations: {type: "dict[str, derivation_class]", required: true}

derivation_class: 
    - source: {type: variable, required: false}
    - literal: {type: [str, int, float, bool, "null"], required: false}
    - operations: {type: [operation_class, "list[operation_class]"], required: false}
    - group_by: {type: "list[variable]", required: false}
    - exception: {type: exception_class, required: false}

variable:
    type: str
    pattern: '^[A-Za-z_][A-Za-z0-9_]*(\.[A-Za-z_][A-Za-z0-9_]*)*$'

path:
    type: str
    min_length: 1

sql:
    type: str
    min_length: 1

operation_class:
    type: "dict[str, dict[str, operation_argument]]"
    size: 1

operation_argument:
    type: [str, int, float, bool, "null", variable_argument, "list[operation_argument]", "dict[str, operation_argument]"]

variable_argument:
    - source: {type: variable, required: true}

exception_class:
    type: "dict[str, dict[str, exception_argument]]"
    size: 1

exception_argument:
    type: [str, int, float, bool, "null", variable_argument, "list[exception_argument]", "dict[str, exception_argument]"]

verification_class:
    type: "dict[str, dict[str, verification_argument]]"
    size: 1

verification_argument:
    type: [str, int, float, bool, "null", variable_argument, "list[verification_argument]", "dict[str, verification_argument]"]
    
