version: "1.0"

# R006 defines this notation: classes, descriptors, type expressions, and
# registries. Every field description here documents the field and does not
# validate it.

includes:
    - schema_shared.yaml
    - schema_derivation.yaml
    - schema_verification.yaml
    - schema_metadata.yaml

root_class:
    - schema_version:
        type: str
        required: true
        description: Schema bundle this specification is written against; R006 requires an exact match.
    - domain:
        type: identifier
        required: true
        description: Name of the output dataset this specification derives.
    - keys:
        type: "list[identifier]"
        required: true
        description: Output columns identifying a row; R005 defines the identity they assert.
    - input:
        type: "dict[identifier, dataset_source]"
        required: true
        description: Source datasets readable by this specification, each under the name it is read through.
    - base:
        type: identifier
        required: false
        description: Input dataset whose records build output rows when rows is absent; R001 states when it is required.
    - parents:
        type: [path, "list[path]"]
        required: false
        description: Ordered local specification layers resolved under R017 before validation and execution.
    - intermediates:
        type: "list[intermediate_class]"
        required: false
        description: Named dataset lookups several columns read through <lookup-id>.<column>; R003 defines them.
    - output:
        type: output_class
        required: true
        description: Artifact presentation independent of dependency-ordered declarations; R005 defines it.
    - columns:
        type: "list[column_class]"
        required: true
        description: Columns in the dependency order R001 requires; output.columns controls artifact order.
    - rows:
        type: "list[row_class]"
        required: false
        description: Row templates constructing output rows from
            input records or groups; R001 evaluates them.
    - verifications:
        type: [dataset_verification, "list[dataset_verification]"]
        required: false
        description: Assertions over the completed dataset; R009 defines them.
    - submission:
        type: submission_dataset_class
        required: false
        description: Governed dataset metadata a submission document is generated from; R024 defines it.
    - metadata:
        type: "dict[str, str]"
        required: false
        description: Free-form annotations carried with the specification; R024 reserves the key names it governs.

output_class:
    - path:
        type: path
        required: true
        description: File this specification produces; R020 selects the serialization profile from its extension.
    - decimals:
        type: int
        required: false
        description: Fixed display digits for every float column of a csv artifact; R020 defines the rounding and rejects it for parquet.
    - columns:
        type: "list[identifier]"
        required: true
        description: Declared columns selected for the artifact, in the order R005 requires.
    - violation_log:
        type: path
        required: false
        description: Sidecar dataset recording warning-level verification violations; R009 fixes its schema and R020 serializes it.
    - order_by:
        type: "list[order_by_term]"
        required: false
        description: Terms ordering artifact rows after every verification; omission keeps R001 construction order.

intermediate_class:
    - id:
        type: intermediate_id
        required: true
        description: Name through which the looked-up record is read.
    - dataset:
        type: identifier
        required: true
        description: Declared dataset the record is selected from.
    - key:
        type: [identifier, "list[identifier]"]
        required: false
        description: Dataset columns paired by position with key_base; omit to match on the applicable output keys (R003-40).
    - key_base:
        type: [variable, "list[variable]"]
        required: false
        description: Current-row values paired by position with key; omit when they name the same columns as key. Must not repeat the key names (R003-45).
    - between:
        type: intermediate_between_class
        required: false
        description: Current-row value matched inclusively against lower and upper dataset bounds.
    - filter:
        type: predicate
        required: false
        description: Predicate selecting eligible records before matching.
    - order_by:
        type: "list[order_by_term]"
        required: false
        description: Terms ordering eligible records; declared with keep.
    - keep:
        type: str
        required: false
        values: [first, last]
        description: Ordered record to retain; declared with order_by.
    - columns:
        type: "list[identifier]"
        required: false
        description: Dataset columns the lookup may read; defaults to every dataset column.
    - missing:
        type: literal_value
        required: false
        description: Value returned when the lookup yields nothing; defaults to missing.
    - strict:
        type: bool
        required: false
        default: false
        description: Fail when the lookup yields nothing.

intermediate_between_class:
    - value:
        type: variable
        required: true
        description: Value read from the current row.
    - lower:
        type: identifier
        required: true
        description: Dataset column whose value is an inclusive lower bound.
    - upper:
        type: identifier
        required: true
        description: Dataset column whose value is an inclusive upper bound.

column_class:
    - name:
        type: identifier
        required: true
        description: Column name this specification declares.
    - type:
        type: column_type
        required: true
        description: Declared data type this column must carry in the completed dataset.
    - label:
        type: str
        required: false
        description: Descriptive text carried with the column for a reader of the dataset.
    - derivation:
        type: derivation
        required: false
        description: How the column's value is produced; R005 owns where a column may be derived.
    - verifications:
        type: [column_verification, "list[column_verification]"]
        required: false
        description: Assertions over this column's completed values; R009 defines them.
    - submission:
        type: submission_column_class
        required: false
        description: Governed column metadata a submission document is generated from; R024 defines it.
    - metadata:
        type: "dict[str, str]"
        required: false
        description: Free-form annotations carried with the column; R024 reserves the key names it governs.

row_class:
    - id:
        type: row_id
        required: true
        description: Identifier of this row template, unique within rows.
    - dataset:
        type: identifier
        required: false
        description: Input dataset whose records build this entry's output rows; required when more than one dataset is declared.
    - group_by:
        type: "list[variable]"
        required: false
        description: Grouping keys over input records, producing
            one candidate row per group; R001 defines grouped construction.
    - filter:
        type: predicate
        required: false
        description: Predicate selecting input records for an ungrouped
            row template or completed candidate groups for a grouped row
            template.
    - derivations:
        type: "dict[identifier, derivation]"
        required: true
        description: Columns this row template derives; R005 owns
            coverage across row templates.

variable:
    type: str
    pattern: '^[A-Za-z_][A-Za-z0-9_]*(\.[A-Za-z_][A-Za-z0-9_]*)*$'
    description: Qualified source variable or unqualified current-output column.

dataset_source:
    type: [project_path, dataset_class]
    description: Path to the dataset, or a path with its producing specification or field types.

dataset_class:
    - path:
        type: project_path
        required: true
        description: Source data path, relative to the specification or rooted at an approved data root and confined by R021; R023 selects the source profile from its extension.
    - types:
        type: "dict[identifier, column_type]"
        required: false
        description: Type each named field carries; R014 types the rest.
    - schema:
        type: project_path
        required: false
        description: Producing specification whose output contract supplies the source fields and types; R014 defines the workflow edge.

intermediate_id:
    type: str
    pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
    description: Identifier of a lookup, unique among dataset identifiers, other lookups, and the output domain.

row_id:
    type: str
    min_length: 1
    description: Identifier of a row template, unique within rows.

regex:
    type: str
    min_length: 1
    description: Regular expression applied to a string value under R022.

predicate:
    type: str
    min_length: 1
