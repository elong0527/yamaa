version: "1.0"

# R006 defines this notation: classes, descriptors, type expressions, and
# registries. Every field description here documents the field and does not
# validate it.

includes:
    - schema_shared.yaml
    - schema_derivation.yaml
    - schema_verification.yaml

root_class:
    - schema_version:
        type: str
        required: true
        description: Schema bundle this specification is written against; R006 requires an exact match.
    - domain:
        type: domain_name
        required: true
        description: Name of the output dataset this specification derives.
    - datasets:
        type: "dict[dataset_id, dataset_source]"
        required: true
        description: Source datasets readable by this specification, each under the name it is read through.
    - base:
        type: dataset_id
        required: false
        description: Dataset whose records drive row construction; R001 states when it is required.
    - parents:
        type: [path, "list[path]"]
        required: false
        description: Ordered local specification layers resolved under R017 before validation and execution.
    - record_lookups:
        type: "list[record_lookup_class]"
        required: false
        description: Records of other datasets named so that several columns can read them; R015 defines them.
    - keys:
        type: "list[column_name]"
        required: true
        description: Output columns identifying a row; R005 defines the identity they assert.
    - output:
        type: output_class
        required: true
        description: Artifact presentation independent of dependency-ordered declarations; R005 defines it.
    - columns:
        type: "list[column_class]"
        required: true
        description: Columns in the dependency order R001 requires; output.columns controls artifact order.
    - rows:
        type: "list[row_class]"
        required: false
        description: Templates constructing output rows from driving records or groups; R001 evaluates them.
    - verifications:
        type: [dataset_verification, "list[dataset_verification]"]
        required: false
        description: Assertions over the completed dataset; R009 defines them.
    - metadata:
        type: "dict[str, str]"
        required: false
        description: Free-form annotations carried with the specification; nothing validates their content.

output_class:
    - path:
        type: path
        required: true
        description: File this specification produces; R020 selects the serialization profile from its extension.
    - decimals:
        type: int
        required: false
        description: Fixed display digits for every float column of a csv artifact; R020 defines the rounding and rejects it for parquet.
    - columns:
        type: "list[column_name]"
        required: true
        description: Declared columns selected for the artifact, in the order R005 requires.
    - order_by:
        type: "list[order_by_term]"
        required: false
        description: Terms ordering artifact rows after every verification; omission keeps R001 construction order.

record_lookup_class:
    - id:
        type: record_lookup_id
        required: true
        description: Name through which the looked-up record is read.
    - dataset:
        type: dataset_id
        required: true
        description: Declared dataset the record is selected from.
    - source:
        type: [variable, "list[variable]"]
        required: false
        description: Current-row values paired by position with key; omit both source and key to match on output keys.
    - key:
        type: [dataset_column, "list[dataset_column]"]
        required: false
        description: Dataset columns paired by position with source.
    - between:
        type: record_lookup_between_class
        required: false
        description: Current-row value matched inclusively against lower and upper dataset bounds.
    - filter:
        type: sql
        required: false
        description: Predicate selecting eligible records before matching.
    - order_by:
        type: "list[order_by_term]"
        required: false
        description: Terms ordering eligible records; declared with keep.
    - keep:
        type: str
        required: false
        values: [first, last]
        description: Ordered record to retain; declared with order_by.
    - unmatched:
        type: str
        required: false
        values: [missing, fail]
        description: Result when no record matches; R015 states the default.
    - incomplete:
        type: str
        required: false
        values: [missing, fail]
        description: Result when a declared source or between value is missing; defaults to fail.

record_lookup_between_class:
    - value:
        type: variable
        required: true
        description: Value read from the current row.
    - lower:
        type: dataset_column
        required: true
        description: Dataset column whose value is an inclusive lower bound.
    - upper:
        type: dataset_column
        required: true
        description: Dataset column whose value is an inclusive upper bound.

column_class:
    - name:
        type: column_name
        required: true
        description: Column name this specification declares.
    - type:
        type: column_type
        required: true
        description: Declared data type this column must carry in the completed dataset.
    - label:
        type: str
        required: false
        description: Descriptive text carried with the column for a reader of the dataset.
    - derivation:
        type: derivation
        required: false
        description: How the column's value is produced; R005 owns where a column may be derived.
    - verifications:
        type: [column_verification, "list[column_verification]"]
        required: false
        description: Assertions over this column's completed values; R009 defines them.
    - metadata:
        type: "dict[str, str]"
        required: false
        description: Free-form annotations carried with the column; nothing validates their content.

row_class:
    - id:
        type: row_id
        required: true
        description: Identifier of this row template, unique within rows.
    - dataset:
        type: dataset_id
        required: false
        description: Dataset driving this template's records; R001 falls back to base.
    - group_by:
        type: "list[variable]"
        required: false
        description: Non-empty driver-variable grain producing one candidate row per group; R001 defines grouped construction.
    - filter:
        type: sql
        required: false
        description: Predicate selecting driver records for an ungrouped template or completed candidate groups for a grouped template.
    - derivations:
        type: "dict[column_name, derivation]"
        required: true
        description: Columns this template derives; R005 owns coverage across templates.

variable:
    type: str
    pattern: '^[A-Za-z_][A-Za-z0-9_]*(\.[A-Za-z_][A-Za-z0-9_]*)*$'
    description: Qualified source variable or unqualified current-output column.

domain_name:
    type: str
    pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
    description: Name of the dataset this specification derives.

dataset_source:
    type: [project_path, dataset_class]
    description: Path to the dataset, or a path with its producing specification or field types.

dataset_class:
    - path:
        type: project_path
        required: true
        description: Source data path, resolved relative to the specification and confined by R021.
    - types:
        type: "dict[dataset_column, column_type]"
        required: false
        description: Type each named field carries; R014 types the rest.
    - schema:
        type: project_path
        required: false
        description: Producing specification whose output contract supplies the source fields and types; R014 defines the workflow edge.

dataset_id:
    type: str
    pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
    description: Identifier of a dataset declared in datasets.

record_lookup_id:
    type: str
    pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
    description: Identifier of a record lookup, unique among dataset identifiers, other record lookups, and the output domain.

dataset_column:
    type: str
    pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
    description: Column of a declared dataset, named without its dataset prefix.

column_name:
    type: str
    pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
    description: Name of a column declared by this specification.

row_id:
    type: str
    min_length: 1
    description: Identifier of a row template, unique within rows.

regex:
    type: str
    min_length: 1
    description: Regular expression applied to a string value under R022.

sql:
    type: str
    min_length: 1
