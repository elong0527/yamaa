version: "1.0"

# See REQ-1045 in rules/specification/structure.md.

includes:
    - schema_shared.yaml
    - schema_derivation.yaml
    - schema_verification.yaml
    - schema_metadata.yaml

root_class:
    - schema_version:
        type: str
        required: true
        description: See REQ-1042 in rules/specification/structure.md.
    - domain:
        type: identifier
        required: true
        description: See REQ-1042 in rules/specification/structure.md.
    - keys:
        type: "list[identifier]"
        required: true
        description: See REQ-1042 in rules/specification/structure.md.
    - input:
        type: "dict[identifier, dataset_source]"
        required: true
        description: See REQ-1042 in rules/specification/structure.md.
    - base:
        type: identifier
        required: false
        description: See REQ-1042 in rules/specification/structure.md.
    - parents:
        type: [path, "list[path]"]
        required: false
        description: See REQ-1042 in rules/specification/structure.md.
    - intermediates:
        type: "list[intermediate_class]"
        required: false
        description: See REQ-1042 in rules/specification/structure.md.
    - output:
        type: output_class
        required: true
        description: See REQ-1042 in rules/specification/structure.md.
    - columns:
        type: "list[column_class]"
        required: true
        description: See REQ-1042 in rules/specification/structure.md.
    - rows:
        type: "list[row_class]"
        required: false
        description: See REQ-1042 in rules/specification/structure.md.
    - filter:
        type: predicate
        required: false
        description: See REQ-1042 in rules/specification/structure.md.
    - verifications:
        type: [dataset_verification, "list[dataset_verification]"]
        required: false
        description: See REQ-1042 in rules/specification/structure.md.
    - submission:
        type: submission_dataset_class
        required: false
        description: See REQ-1042 in rules/specification/structure.md.
    - metadata:
        type: "dict[str, str]"
        required: false
        description: See REQ-1042 in rules/specification/structure.md.

output_class:
    - path:
        type: path
        required: true
        description: See REQ-1047 in rules/storage/publication.md.
    - decimals:
        type: int
        required: false
        description: See REQ-1047 in rules/storage/publication.md.
    - columns:
        type: "list[identifier]"
        required: true
        description: See REQ-1047 in rules/storage/publication.md.
    - warning_log:
        type: path
        required: false
        description: See REQ-1047 in rules/storage/publication.md.
    - verification_log:
        type: path
        required: false
        description: See REQ-1047 in rules/storage/publication.md.
    - order_by:
        type: "list[order_by_term]"
        required: false
        description: See REQ-1047 in rules/storage/publication.md.

intermediate_class:
    - id:
        type: intermediate_id
        required: true
        description: See REQ-1048 in rules/operations/lookup.md.
    - dataset:
        type: identifier
        required: true
        description: See REQ-1048 in rules/operations/lookup.md.
    - key:
        type: [identifier, "list[identifier]"]
        required: false
        description: See REQ-1048 in rules/operations/lookup.md.
    - key_base:
        type: [variable, "list[variable]"]
        required: false
        description: See REQ-1048 in rules/operations/lookup.md.
    - between:
        type: intermediate_between_class
        required: false
        description: See REQ-1048 in rules/operations/lookup.md.
    - filter:
        type: predicate
        required: false
        description: See REQ-1048 in rules/operations/lookup.md.
    - order_by:
        type: "list[order_by_term]"
        required: false
        description: See REQ-1048 in rules/operations/lookup.md.
    - keep:
        type: str
        required: false
        values: [first, last]
        description: See REQ-1048 in rules/operations/lookup.md.
    - columns:
        type: "list[identifier]"
        required: false
        description: See REQ-1048 in rules/operations/lookup.md.
    - missing:
        type: literal_value
        required: false
        description: See REQ-1048 in rules/operations/lookup.md.
    - strict:
        type: bool
        required: false
        default: false
        description: See REQ-1048 in rules/operations/lookup.md.
    - derivations:
        type: "dict[identifier, derivation]"
        required: false
        description: See REQ-1185 in rules/operations/lookup.md.

intermediate_between_class:
    - value:
        type: variable
        required: true
        description: See REQ-1049 in rules/operations/lookup.md.
    - lower:
        type: identifier
        required: true
        description: See REQ-1049 in rules/operations/lookup.md.
    - upper:
        type: identifier
        required: true
        description: See REQ-1049 in rules/operations/lookup.md.

column_class:
    - name:
        type: identifier
        required: true
        description: See REQ-1043 in rules/specification/structure.md.
    - type:
        type: column_type
        required: true
        description: See REQ-1043 in rules/specification/structure.md.
    - label:
        type: str
        required: false
        description: See REQ-1043 in rules/specification/structure.md.
    - derivation:
        type: derivation
        required: false
        description: See REQ-1043 in rules/specification/structure.md.
    - verifications:
        type: [column_verification, "list[column_verification]"]
        required: false
        description: See REQ-1043 in rules/specification/structure.md.
    - submission:
        type: submission_column_class
        required: false
        description: See REQ-1043 in rules/specification/structure.md.
    - metadata:
        type: "dict[str, str]"
        required: false
        description: See REQ-1043 in rules/specification/structure.md.

row_class:
    - id:
        type: row_id
        required: true
        description: See REQ-1056 in rules/execution/rows.md.
    - dataset:
        type: identifier
        required: false
        description: See REQ-1056 in rules/execution/rows.md.
    - group_by:
        type: "list[variable]"
        required: false
        description: See REQ-1056 in rules/execution/rows.md.
    - filter:
        type: predicate
        required: false
        description: See REQ-1056 in rules/execution/rows.md.
    - derivations:
        type: "dict[identifier, derivation]"
        required: true
        description: See REQ-1056 in rules/execution/rows.md.
    - submission:
        type: "dict[identifier, submission_column_class]"
        required: false
        description: See REQ-1056 in rules/execution/rows.md.

variable:
    type: str
    pattern: '^[A-Za-z_][A-Za-z0-9_]*(\.[A-Za-z_][A-Za-z0-9_]*)*$'
    description: See REQ-1057 in rules/specification/binding.md.

dataset_source:
    type: [project_path, dataset_class]
    description: See REQ-1059 in rules/storage/ingestion.md.

dataset_class:
    - path:
        type: project_path
        required: true
        description: See REQ-1060 in rules/storage/ingestion.md.
    - types:
        type: "dict[identifier, column_type]"
        required: false
        description: See REQ-1060 in rules/storage/ingestion.md.
    - schema:
        type: project_path
        required: false
        description: See REQ-1060 in rules/storage/ingestion.md.
    - empty_string:
        type: str
        required: false
        default: missing
        values: [missing, present]
        description: See REQ-1158 in rules/storage/ingestion.md.

intermediate_id:
    type: str
    pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
    description: See REQ-1050 in rules/operations/lookup.md.

row_id:
    type: str
    min_length: 1
    description: See REQ-1044 in rules/specification/structure.md.

regex:
    type: str
    min_length: 1
    description: See REQ-1058 in rules/specification/binding.md.

predicate:
    type: str
    min_length: 1
