version: "1.0"

root_class:
    - domain: {type: str, required: true}
    - datasets: {type: "dict[str, path]", required: true}
    - base: {type: str, required: false}
    - parents: {type: [path, "list[path]"], required: false}
    - keys: {type: "list[str]", required: true}
    - columns: {type: "list[column_class]", required: true}
    - rows: {type: "list[row_class]", required: false}
    - metadata: {type: list, required: false}
    
column_class:
    - name: {type: str, required: true}
    - type: {type: str, required: true}
    - label: {type: str, required: false}
    - derivation: {type: derivation_class, required: false}
    - metadata: {type: list, required: false}

row_class:
    - id: {type: str, required: true}
    - dataset: {type: str, required: false}
    - filter: {type: [sql, "list[sql]"], required: false}
    - derivations: {type: "dict[str, derivation_class]", required: true}

derivation_class: 
    - source: {type: str, required: false}
    - literal: {type: [str, int, float, bool, null], required: false}
    - mapping: {type: mapping_class, required: false}
    - cut: {type: cut_class, required: false}
    - string_operation: {type: string_operation_class, required: false}
    - numeric_operation: {type: numeric_operation_class, required: false}
    - date_operation: {type: date_operation_class, required: false}
    - filter: {type: [sql, "list[sql]"], required: false}
    - group_by: {type: "list[str]", required: false}
    - aggregate: {type: aggregate_class, required: false}
    - function: {type: function_call, required: false}
    - exception: {type: exception_class, required: false}

mapping_class: 
    - dict: {type: dict, required: false}
    - case_sensitive: {type: bool, required: false}
    - file: {type: str, required: false}
    - key: {type: str, required: false}

cut_class: 
    - breaks: {type: "list[int, float]", required: true}
    - labels: {type: "list[str]", required: false}
    - include.lowest: {type: bool, required: false}
    - right: {type: bool, required: false}

string_operation_class: 
    # reference: https://rstudio.github.io/cheatsheets/html/strings.html
    - detect: {type: str, required: false}
    - prefix: {type: str, required: false}
    - suffix: {type: str, required: false}
    - extract: {type: str, required: false}
    - glue: {type: str, required: false}

numeric_operation_class: 
    - max: {type: [int, float], required: false}
    - min: {type: [int, float], required: false}
    - mean: {type: [int, float], required: false}
    - median: {type: [int, float], required: false}
    - mode: {type: [int, float], required: false}
    - sum: {type: [int, float], required: false}
    - sd: {type: [int, float], required: false}
    - var: {type: [int, float], required: false}

date_operation_class: 
    - year: {type: str, required: false}
    - month: {type: str, required: false}
    - day: {type: str, required: false}

verification_class: 
    - allowed_values: {type: list, required: false}
    - range: {type: [int, float], required: false}
    - group_by: {type: "list[str]", required: false}
    - max_missing_pct: {type: [int, float], required: false}
    
