version: "1.0"

expressions:
    diff: # See TIME-4.
        - type:
            type: temporal_type
            required: true
            description: Declared type of both dates or both datetimes, which selects the units (TIME-4).
        - start:
            type: variable
            required: true
            description: Starting date or datetime (TIME-4).
        - end:
            type: variable
            required: true
            description: Ending date or datetime; an earlier end produces a negative result (TIME-4).
        - unit:
            type: str
            required: true
            values: [day, week, month, year, second, minute, hour]
            description: Calendar unit day, week, month or year for dates, or elapsed unit second, minute, hour or day for datetimes, where a day is 86400 seconds (TIME-4).
        - closed:
            type: str
            default: right
            values: [right, both, neither]
            description: Which endpoints the day count includes, the end only, both or neither, defined only for dates with unit day (TIME-5).
    impute: # See TIME-8.
        - type:
            type: temporal_type
            required: true
            description: Declared type of the completed value (TIME-8).
        - source:
            type: variable
            required: true
            description: Collected ISO 8601 date or datetime text, read up to its first unknown field, or a value of the declared type (TIME-7).
        - month:
            type: int
            description: Month supplied to a source collected only to the year, 1 to 12, declared only beside day; without it such a source gives missing (TIME-10).
        - day:
            type: [int, day_rule]
            description: Day supplied to a source collected to the year or the month, an integer from 1 to 31 or first or last resolved against the month the date lands in; without it a source with no day gives missing (TIME-10).
        - time:
            type: time_rule
            description: Time fields supplied when the source does not carry them, first supplying 00 to each and last 23, 59 and 59; declared exactly when type is datetime (TIME-10).
        - not_before:
            type: variable
            description: Value of the declared type the completed value must not precede; it moves only supplied components, and a bound outside the interval the collected components admit is ignored (TIME-9).
        - not_after:
            type: variable
            description: Value of the declared type the completed value must not follow; it moves only supplied components, a bound outside the collected interval is ignored, and it wins when the bounds cross (TIME-9).
        - fallback:
            type: variable
            description: Value of the declared type returned, with collected precision none, when the source is missing (TIME-13).
        - invalid:
            type: substitute_value
            description: Result when the source is text that cannot be read as collected date text, such as an ISO 8601 interval or duration (TIME-13).
    precision: # See TIME-7.
        - type:
            type: temporal_type
            required: true
            description: Declared type whose collected precision is reported, at most day for a date (TIME-7).
        - source:
            type: variable
            required: true
            description: Collected ISO 8601 date or datetime text, read up to its first unknown field, or a value of the declared type (TIME-7).
        - invalid:
            type: substitute_value
            description: Result when the source is text that cannot be read as collected date text, such as an ISO 8601 interval or duration (TIME-13).
    imputation_flag:
        - source:
            type: variable
            required: true
            description: Imputed date or datetime whose collected precision is flagged (TIME-18).
        - part:
            type: str
            required: true
            values: [date, time]
            description: Flag derived, the date flag of a date or datetime or the time flag of a datetime (TIME-18).
        - seconds_collected:
            type: bool
            default: true
            description: Whether the study collects seconds, so a time collected to the minute had its seconds imputed (TIME-18).
    to_date: # See TIME-2.
        - source:
            type: variable
            required: true
            description: Datetime whose calendar date is returned, or ISO 8601 date or datetime text whose date part is returned (TIME-2).
    study_day: # See TIME-6.
        - source:
            type: variable
            required: true
            description: Date whose study day is returned (TIME-6).
        - reference:
            type: variable
            required: true
            description: Reference start date, which is study day 1 (TIME-6).
    to_epoch_day: # See TIME-3.
        - source:
            type: variable
            required: true
            description: Date converted to days since 1970-01-01 (TIME-3).
    dtc:
        - year:
            type: variable
            required: true
            description: Collected year, four digits as text or an integer from 1 to 9999; a missing year gives missing (TIME-19).
        - month:
            type: variable
            description: Collected month, two digits as text or an integer from 1 to 12; the text stops before a missing month (TIME-19).
        - day:
            type: variable
            description: Collected day within its month, declared only beside month (TIME-19).
        - hour:
            type: variable
            description: Collected hour from 0 to 23, declared only beside day (TIME-19).
        - minute:
            type: variable
            description: Collected minute from 0 to 59, declared only beside hour (TIME-19).
        - second:
            type: variable
            description: Collected second from 0 to 59, declared only beside minute (TIME-19).
        - invalid:
            type: substitute_value
            description: Result when a part the text reads is not its field's digits or lies outside its range (TIME-19).
    time_of_day:
        - source:
            type: variable
            required: true
            description: Datetime whose time of day is returned as whole seconds since midnight (TIME-20).

    shift: # See TIME-14.
        - type:
            type: temporal_type
            required: true
            description: Declared type of the source and the result (TIME-14).
        - source:
            type: variable
            required: true
            description: Complete date or civil datetime to move (TIME-14).
        - days:
            type: shift_days
            description: Signed integer literal or integer variable moving a date; declared exactly when type is date (TIME-14).
        - amount:
            type: shift_amount
            description: Signed numeric literal or variable moving a datetime, an integer with unit second; declared exactly when type is datetime (TIME-14).
        - unit:
            type: str
            values: [second, minute, hour, day]
            description: Elapsed unit of the amount, where a day is 86400 seconds; declared exactly when type is datetime (TIME-14).
    duration_value: # See TIME-17.
        - source:
            type: variable
            required: true
            description: ISO 8601 fixed-length duration text (TIME-17).
        - unit:
            type: str
            required: true
            values: [second, minute, hour, day]
            description: Numeric result unit of second, minute, hour or day (TIME-17).
        - invalid:
            type: substitute_value
            description: Literal result for invalid or out-of-range duration text (TIME-17).

temporal_type:
    type: str
    values: [date, datetime]
    description: Declared temporal type a type-dispatched operation reads and returns, never inferred from runtime text (TIME-1).

day_rule:
    type: str
    values: [first, last]
    description: Day resolved against the month the completed date lands in (TIME-8).

time_rule:
    type: str
    values: [first, last]
    description: Earliest or latest civil moment the collected source admits, each missing time field taking its first or last value (TIME-8).

shift_days:
    type: [variable, int]
    kind: name
    description: Integer variable or signed integer literal (TIME-14).

shift_amount:
    type: [variable, int, float]
    kind: name
    description: Numeric variable or signed numeric literal (TIME-14).
