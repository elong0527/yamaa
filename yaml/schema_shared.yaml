version: "1.0"

# See REQ-1150 in rules/values/types.md.

column_type:
    type: str
    values: [str, int, float, date, datetime]

literal_value:
    type: [str, int, float, bool, "null"]
    description: See REQ-1149 in rules/values/types.md.

path:
    type: str
    min_length: 1

project_path:
    type: str
    min_length: 1
    description: See REQ-1151 in rules/storage/resources.md.

identifier:
    type: str
    pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
    description: See REQ-1046 in rules/specification/structure.md.

function_contract_version:
    type: str
    min_length: 1
    description: See REQ-1087 in rules/operations/functions.md.

function_param_type:
    type: str
    values: [str, int, float, bool, date, datetime]

function_string_literal_class:
    - literal: {type: str, required: true}

function_date_literal_class:
    - date: {type: str, required: true}

function_datetime_literal_class:
    - datetime: {type: str, required: true}

function_value:
    type:
        - literal_value
        - function_date_literal_class
        - function_datetime_literal_class

