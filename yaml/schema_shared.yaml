version: "1.0"

# Types shared by specification and project-environment schema entry points.

column_type:
    type: str
    values: [str, int, float, date, datetime]

literal_value:
    type: [str, int, float, bool, "null"]
    description: Scalar literal after R011 normalizes any non-finite float to
        missing.

path:
    type: str
    min_length: 1

project_path:
    type: str
    min_length: 1
    description: Stored project resource a run reads; R021 confines it to the
        approved project root and fixes its written form.

function_name:
    type: str
    pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
    description: Logical function resolved by a project environment at the
        implementation stage.

function_contract_version:
    type: str
    min_length: 1
    description: Exact logical contract version required by a function call.

function_parameter_name:
    type: str
    pattern: '^[A-Za-z_][A-Za-z0-9_]*$'

function_param_type:
    type: str
    values: [str, int, float, bool, date, datetime]

function_string_literal_class:
    - literal: {type: str, required: true}

function_date_literal_class:
    - date: {type: str, required: true}

function_datetime_literal_class:
    - datetime: {type: str, required: true}

function_value:
    type:
        - literal_value
        - function_date_literal_class
        - function_datetime_literal_class

standard_id:
    type: str
    pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
    description: Identifier of a standard declared by the study document R026
        defines.

codelist_id:
    type: str
    pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
    description: Identifier of a codelist declared by the study document R026
        defines.

document_id:
    type: str
    pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
    description: Identifier of a supporting document declared by the study
        document R026 defines.
