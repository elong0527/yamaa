  - id: distinct-is-not-a-keyword-inside-a-reducer
    context: aggregate
    covers: [reduction, rejection]
    text: "COUNT(DISTINCT AETERM)"
    parse: reject
    condition: invalid_expression
  - id: string-agg-is-not-the-join-name
    context: aggregate
    covers: [vocabulary, rejection]
    text: "STRING_AGG(SEQN)"
    parse: reject
    condition: prohibited_function
  # Aggregate: the statistical reducers each reduce one expression, a number
  # in arithmetic. QUANTILE's probability is a field of the aggregate, never
  # an argument, and a quartile's spelling is still a name outside a call.
  - id: the-quartiles-are-reducers
    context: aggregate
    covers: [reduction, vocabulary, arithmetic]
    text: "Q3(A) - Q1(A)"
    parse: accept
    identifiers: [A]
    shape: (- (reduce Q3 (id A)) (reduce Q1 (id A)))
  - id: a-quartile-spelling-is-a-name-outside-a-call
    context: aggregate
    covers: [identifier, reduction]
    text: "MEDIAN(Q1)"
    parse: accept
    identifiers: [Q1]
    shape: (reduce MEDIAN (id Q1))
  - id: quantile-reduces-one-expression
    context: aggregate
    covers: [reduction, vocabulary]
    text: "QUANTILE(PC.PCSTRESN)"
    parse: accept
    identifiers: [PC.PCSTRESN]
    shape: (reduce QUANTILE (id PC.PCSTRESN))
  - id: a-probability-is-not-a-quantile-argument
    context: aggregate
    covers: [reduction, rejection]
    text: "QUANTILE(A, 0.9)"
    parse: reject
    condition: invalid_expression
  - id: a-deviation-may-stand-in-arithmetic
    context: aggregate
    covers: [reduction, arithmetic, precedence]
    text: "100 * STDDEV(A) / MEAN(A)"
    parse: accept
    identifiers: [A]
    shape: (/ (* (int 100) (reduce STDDEV (id A))) (reduce MEAN (id A)))
  - id: variance-and-geomean-are-case-insensitive
    context: aggregate
    covers: [reduction, keyword-case]
    text: "variance(A) + GeoMean(B)"
    parse: accept
    identifiers: [A, B]
    shape: (+ (reduce VARIANCE (id A)) (reduce GEOMEAN (id B)))
  - id: a-statistical-reducer-takes-no-record-star
    context: aggregate
    covers: [star, rejection]
    text: "MEDIAN(AE.*)"
    parse: reject
    condition: invalid_expression
  - id: percentile-is-not-the-quantile-name
    context: aggregate
    covers: [vocabulary, rejection]
    text: "PERCENTILE(A)"
    parse: reject
    condition: prohibited_function
  - id: stdev-is-not-the-deviation-name
    context: aggregate
    covers: [vocabulary, rejection]
    text: "STDEV(A)"
    parse: reject
    condition: prohibited_function
  - id: a-median-is-refused-in-an-expression-field
    context: derivation
    covers: [reduction, context, rejection]
    text: "MEDIAN(AVAL)"
    parse: reject
    condition: prohibited_function
  # Predicates: the remaining refusals.
  - id: an-empty-predicate-is-rejected
    context: predicate
    covers: [rejection]
    text: ""
    parse: reject
    condition: invalid_expression
  - id: an-unclosed-logical-group-is-rejected
    context: predicate
    covers: [grouping, rejection]
    text: "(A = 1"
    parse: reject
    condition: invalid_expression
  - id: a-trailing-comparison-is-rejected
    context: predicate
    covers: [rejection]
    text: "A = 1 B = 2"
    parse: reject
    condition: invalid_expression
