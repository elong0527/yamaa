# Machine-readable grammar of the one expression language.
#
# This file is the single source for the closed grammar written in a field
# typed `predicate`, in `aggregate.expr` and as text in an expression field.
# The grammar block of the Formulas rules is rendered from `productions`, and
# the shared parser and binder are checked against `vocabulary`, `reserved`
# and `cases`, so the rule and the implementation cannot drift apart without
# failing validation.
#
# Each case names the context it is written in. A context decides the root
# and the constructs and functions a text may use, so the same text can be
# admitted in one context and refused in another. A field typed `predicate`
# is read in the `predicate` context, `aggregate.expr` in the `aggregate`
# context, and text in an expression field in the `derivation` context.
#
# `grammar/README.md` states the file format and the shape notation.
schema_version: "1.0"
contract: expression
contract_version: "1.1.0"
rule: formulas
start: expression
contexts: [predicate, aggregate, derivation]
productions:
  - name: expression
    definition: |-
      disjunction
  - name: disjunction
    definition: |-
      conjunction ("OR" conjunction)*
  - name: conjunction
    definition: |-
      negation ("AND" negation)*
  - name: negation
    definition: |-
      "NOT"* comparison
  - name: comparison
    definition: |-
      sum [compare sum | membership | range | pattern | null_test]
  - name: compare
    definition: |-
      "=" | "<>" | "<" | "<=" | ">" | ">="
  - name: membership
    definition: |-
      ["NOT"] "IN" "(" expression ("," expression)* ")"
  - name: range
    definition: |-
      ["NOT"] "BETWEEN" sum "AND" sum
  - name: pattern
    definition: |-
      ["NOT"] "LIKE" sum ["ESCAPE" string]
  - name: null_test
    definition: |-
      "IS" ["NOT"] "NULL"
  - name: sum
    definition: |-
      product (("+" | "-") product)*
  - name: product
    definition: |-
      factor (("*" | "/") factor)*
  - name: factor
    definition: |-
      ["+" | "-"] primary
  - name: primary
    definition: |-
      literal | reduction | call | identifier | "(" expression ")"
  - name: reduction
    definition: |-
      reducer "(" expression ")" | "COUNT" "(" star ")"
  - name: star
    definition: |-
      name "." "*"
  - name: call
    definition: |-
      function "(" [expression ("," expression)*] ")"
  - name: identifier
    definition: |-
      name ["." name]
  - name: literal
    definition: |-
      number | string | temporal | "TRUE" | "FALSE" | "NULL"
  - name: temporal
    definition: |-
      ("DATE" | "DATETIME") string
  - name: number
    definition: |-
      digits ["." digits] [("e" | "E") ["+" | "-"] digits]
  - name: digits
    definition: |-
      digit { digit }
  - name: name
    definition: |-
      (letter | "_") { letter | digit | "_" }
  - name: letter
    definition: |-
      "A" ... "Z" | "a" ... "z"
  - name: digit
    definition: |-
      "0" ... "9"
  - name: string
    definition: |-
      "'" { non_quote | "''" } "'"
  - name: non_quote
    prose: true
    definition: |-
      any Unicode scalar value other than "'"
imports: {}
# Both tables are closed: a name outside them, or another argument count,
# fails with prohibited_function whatever a host dialect provides. A
# function's result decides where it may stand; a reducer's argument forms
# say whether it takes the record star.
vocabulary:
  function:
    ABS: {min_arguments: 1, max_arguments: 1, result: numeric}
    CEIL: {min_arguments: 1, max_arguments: 1, result: numeric}
    FLOOR: {min_arguments: 1, max_arguments: 1, result: numeric}
    TRUNC: {min_arguments: 1, max_arguments: 1, result: numeric}
    SQRT: {min_arguments: 1, max_arguments: 1, result: numeric}
    POWER: {min_arguments: 2, max_arguments: 2, result: numeric}
    EXP: {min_arguments: 1, max_arguments: 1, result: numeric}
    LN: {min_arguments: 1, max_arguments: 1, result: numeric}
    LOG10: {min_arguments: 1, max_arguments: 1, result: numeric}
    NORM_CDF: {min_arguments: 1, max_arguments: 1, result: numeric}
    NORM_INV: {min_arguments: 1, max_arguments: 1, result: numeric}
    MOD: {min_arguments: 2, max_arguments: 2, result: numeric}
    NULLIF: {min_arguments: 2, max_arguments: 2, result: numeric}
    STR_CONTAINS: {min_arguments: 2, max_arguments: 2, result: boolean}
  reducer:
    SUM: {argument: [expression]}
    COUNT: {argument: [expression, star]}
    MIN: {argument: [expression]}
    MAX: {argument: [expression]}
    MEAN: {argument: [expression]}
    ONLY: {argument: [expression]}
    STR_JOIN: {argument: [expression]}
    MEDIAN: {argument: [expression]}
    Q1: {argument: [expression]}
    Q3: {argument: [expression]}
    QUANTILE: {argument: [expression]}
    STDDEV: {argument: [expression]}
    VARIANCE: {argument: [expression]}
    GEOMEAN: {argument: [expression]}
# A reserved word is case-insensitive and cannot be a bare identifier. A
# qualified field may still use one of these spellings after its qualifier.
# `DATE` and `DATETIME` begin a temporal literal only before a string, and
# `ESCAPE` is a keyword only after a `LIKE` pattern; elsewhere each is a name.
reserved:
  - "AND"
  - "BETWEEN"
  - "FALSE"
  - "IN"
  - "IS"
  - "LIKE"
  - "NOT"
  - "NULL"
  - "OR"
  - "TRUE"
cases:
  # Predicates: comparisons, logic and their precedence.
  - id: equality-over-an-unqualified-identifier
    context: predicate
    covers: [comparison, identifier]
    text: "SAFFL = 'Y'"
    parse: accept
    identifiers: [SAFFL]
    shape: (= (id SAFFL) (str 'Y'))
  - id: every-comparison-operator-parses
    context: predicate
    covers: [comparison]
    text: "A = 1 AND B <> 2 AND C < 3 AND D <= 4 AND E > 5 AND F >= 6"
    parse: accept
    identifiers: [A, B, C, D, E, F]
    shape: (and (and (and (and (and (= (id A) (int 1)) (<> (id B) (int
      2))) (< (id C) (int 3))) (<= (id D) (int 4))) (> (id E) (int 5)))
      (>= (id F) (int 6)))
  - id: not-equal-bang-is-outside-the-grammar
    context: predicate
    covers: [comparison, rejection]
    text: "AGE != 18"
    parse: reject
    condition: invalid_expression
  - id: comparisons-do-not-associate
    context: predicate
    covers: [comparison, precedence, rejection]
    text: "A = B = C"
    parse: reject
    condition: invalid_expression
  - id: and-binds-tighter-than-or
    context: predicate
    covers: [logic, precedence]
    text: "A = 1 OR B = 2 AND C = 3"
    parse: accept
    identifiers: [A, B, C]
    shape: (or (= (id A) (int 1)) (and (= (id B) (int 2)) (= (id C)
      (int 3))))
  - id: parentheses-override-logical-precedence
    context: predicate
    covers: [logic, precedence, grouping]
    text: "(A = 1 OR B = 2) AND C = 3"
    parse: accept
    identifiers: [A, B, C]
    shape: (and (or (= (id A) (int 1)) (= (id B) (int 2))) (= (id C)
      (int 3)))
  - id: repeated-or-associates-from-the-left
    context: predicate
    covers: [logic, precedence]
    text: "A = 1 OR B = 2 OR C = 3"
    parse: accept
    identifiers: [A, B, C]
    shape: (or (or (= (id A) (int 1)) (= (id B) (int 2))) (= (id C)
      (int 3)))
  - id: not-binds-tighter-than-and
    context: predicate
    covers: [logic, precedence]
    text: "NOT A = 1 AND B = 2"
    parse: accept
    identifiers: [A, B]
    shape: (and (not (= (id A) (int 1))) (= (id B) (int 2)))
  - id: repeated-not-nests
    context: predicate
    covers: [logic]
    text: "NOT NOT TRUE"
    parse: accept
    identifiers: []
    shape: (not (not true))
  - id: boolean-literals-are-case-insensitive
    context: predicate
    covers: [logic, keyword-case]
    text: "true OR False"
    parse: accept
    identifiers: []
    shape: (or true false)
  - id: keywords-are-case-insensitive
    context: predicate
    covers: [logic, keyword-case]
    text: "A = 1 and B = 2 or C = 3"
    parse: accept
    identifiers: [A, B, C]
    shape: (or (and (= (id A) (int 1)) (= (id B) (int 2))) (= (id C)
      (int 3)))
  - id: a-truth-value-is-not-a-comparison-operand
    context: predicate
    covers: [logic, context, rejection]
    text: "FLAG = TRUE"
    parse: reject
    condition: invalid_expression
  - id: a-bare-operand-is-not-a-predicate
    context: predicate
    covers: [context, rejection]
    text: "SAFFL"
    parse: reject
    condition: invalid_expression
  # Predicates: arithmetic is a comparison operand.
  - id: arithmetic-is-a-comparison-operand
    context: predicate
    covers: [arithmetic, comparison]
    text: "AVAL + 1 > 2"
    parse: accept
    identifiers: [AVAL]
    shape: (> (+ (id AVAL) (int 1)) (int 2))
  - id: arithmetic-binds-tighter-than-a-comparison
    context: predicate
    covers: [arithmetic, comparison, precedence]
    text: "ALT > 3 * ULN"
    parse: accept
    identifiers: [ALT, ULN]
    shape: (> (id ALT) (* (int 3) (id ULN)))
  - id: a-numeric-function-is-a-comparison-operand
    context: predicate
    covers: [call, comparison]
    text: "ABS(AVAL) > 2"
    parse: accept
    identifiers: [AVAL]
    shape: (> (call ABS (id AVAL)) (int 2))
  - id: between-bounds-may-be-arithmetic
    context: predicate
    covers: [between, arithmetic]
    text: "AVAL BETWEEN BASE - 1 AND BASE + 1"
    parse: accept
    identifiers: [AVAL, BASE]
    shape: (between (id AVAL) (- (id BASE) (int 1)) (+ (id BASE) (int 1)))
  - id: the-upper-bound-of-between-binds-tighter-than-and
    context: predicate
    covers: [between, logic, precedence]
    text: "AVAL BETWEEN 1 AND 10 AND SAFFL = 'Y'"
    parse: accept
    identifiers: [AVAL, SAFFL]
    shape: (and (between (id AVAL) (int 1) (int 10)) (= (id SAFFL) (str
      'Y')))
  - id: a-null-test-may-take-arithmetic
    context: predicate
    covers: [null-test, arithmetic]
    text: "A + B IS NULL"
    parse: accept
    identifiers: [A, B]
    shape: (is-null (+ (id A) (id B)))
  - id: a-reduction-is-refused-in-a-predicate
    context: predicate
    covers: [reduction, context, rejection]
    text: "SUM(AVAL) > 1"
    parse: reject
    condition: prohibited_function
  # Names.
  - id: identifiers-are-case-sensitive-in-a-predicate
    context: predicate
    covers: [identifier, keyword-case]
    text: "aval = AVAL"
    parse: accept
    identifiers: [AVAL, aval]
    shape: (= (id aval) (id AVAL))
  - id: a-qualified-identifier-names-its-relation
    context: predicate
    covers: [identifier]
    text: "EX.EXDOSE > 0"
    parse: accept
    identifiers: [EX.EXDOSE]
    shape: (> (id EX.EXDOSE) (int 0))
  - id: a-qualified-field-may-spell-a-keyword
    context: predicate
    covers: [identifier, reserved]
    text: "DM.NOT = 1"
    parse: accept
    identifiers: [DM.NOT]
    shape: (= (id DM.NOT) (int 1))
  - id: a-bare-keyword-is-not-an-identifier
    context: predicate
    covers: [reserved, rejection]
    text: "LIKE = 1"
    parse: reject
    condition: invalid_expression
  - id: a-temporal-keyword-without-a-string-is-a-name
    context: predicate
    covers: [identifier, reserved, temporal]
    text: "DATE = DATE '2025-06-01'"
    parse: accept
    identifiers: [DATE]
    shape: (= (id DATE) (date '2025-06-01'))
  - id: an-underscore-may-open-a-name
    context: predicate
    covers: [identifier]
    text: "_FLAG = 'Y'"
    parse: accept
    identifiers: [_FLAG]
    shape: (= (id _FLAG) (str 'Y'))
  - id: a-digit-may-not-open-a-name
    context: predicate
    covers: [identifier, rejection]
    text: "2FLAG = 'Y'"
    parse: reject
    condition: invalid_expression
  - id: a-three-part-identifier-is-outside-the-grammar
    context: predicate
    covers: [identifier, rejection]
    text: "A.B.C = 1"
    parse: reject
    condition: invalid_expression
  # Predicates: membership, ranges, patterns and null tests.
  - id: in-list-keeps-its-operands-in-order
    context: predicate
    covers: [in]
    text: "AEACN IN ('DRUG WITHDRAWN', 'DOSE REDUCED')"
    parse: accept
    identifiers: [AEACN]
    shape: (in (id AEACN) (str 'DRUG WITHDRAWN') (str 'DOSE REDUCED'))
  - id: not-in-negates-the-list-membership
    context: predicate
    covers: [in]
    text: "AVISITN NOT IN (1, 2)"
    parse: accept
    identifiers: [AVISITN]
    shape: (not-in (id AVISITN) (int 1) (int 2))
  - id: an-empty-in-list-is-outside-the-grammar
    context: predicate
    covers: [in, rejection]
    text: "AVISITN IN ()"
    parse: reject
    condition: invalid_expression
  - id: between-takes-two-inclusive-endpoints
    context: predicate
    covers: [between]
    text: "AVAL BETWEEN 1 AND 10"
    parse: accept
    identifiers: [AVAL]
    shape: (between (id AVAL) (int 1) (int 10))
  - id: not-between-negates-the-range
    context: predicate
    covers: [between]
    text: "AVAL NOT BETWEEN 1.5 AND 10"
    parse: accept
    identifiers: [AVAL]
    shape: (not-between (id AVAL) (float 1.5) (int 10))
  - id: between-requires-its-and
    context: predicate
    covers: [between, rejection]
    text: "AVAL BETWEEN 1 10"
    parse: reject
    condition: invalid_expression
  - id: like-without-escape-has-no-escape-character
    context: predicate
    covers: [like]
    text: "AEDECOD LIKE 'HEAD%'"
    parse: accept
    identifiers: [AEDECOD]
    shape: (like (id AEDECOD) (str 'HEAD%'))
  - id: escape-declares-one-scalar
    context: predicate
    covers: [like, escape]
    text: "AEDECOD LIKE '100!%' ESCAPE '!'"
    parse: accept
    identifiers: [AEDECOD]
    shape: (like (id AEDECOD) (str '100!%') (escape '!'))
  - id: not-like-negates-the-match
    context: predicate
    covers: [like]
    text: "AEDECOD NOT LIKE 'HEAD%'"
    parse: accept
    identifiers: [AEDECOD]
    shape: (not-like (id AEDECOD) (str 'HEAD%'))
  - id: escape-rejects-a-two-scalar-literal
    context: predicate
    covers: [like, escape, rejection]
    text: "AEDECOD LIKE 'a' ESCAPE '!!'"
    parse: reject
    condition: invalid_expression
  - id: a-dangling-escape-is-rejected
    context: predicate
    covers: [like, escape, rejection]
    text: "AEDECOD LIKE 'HEAD!' ESCAPE '!'"
    parse: reject
    condition: invalid_expression
  - id: a-doubled-escape-character-is-not-dangling
    context: predicate
    covers: [like, escape]
    text: "AEDECOD LIKE 'HEAD!!' ESCAPE '!'"
    parse: accept
    identifiers: [AEDECOD]
    shape: (like (id AEDECOD) (str 'HEAD!!') (escape '!'))
  - id: is-null-tests-missingness
    context: predicate
    covers: [null-test]
    text: "AEENDTC IS NULL"
    parse: accept
    identifiers: [AEENDTC]
    shape: (is-null (id AEENDTC))
  - id: is-not-null-tests-presence
    context: predicate
    covers: [null-test]
    text: "AEENDTC IS NOT NULL"
    parse: accept
    identifiers: [AEENDTC]
    shape: (is-not-null (id AEENDTC))
  - id: is-requires-null
    context: predicate
    covers: [null-test, rejection]
    text: "AEENDTC IS 'Y'"
    parse: reject
    condition: invalid_expression
  - id: null-is-an-operand-of-a-comparison
    context: predicate
    covers: [literal, null-test, null-literal]
    text: "AVAL = NULL"
    parse: accept
    identifiers: [AVAL]
    shape: (= (id AVAL) null)
  # Predicates: str_contains.
  - id: str-contains-is-a-truth-valued-call
    context: predicate
    covers: [call]
    text: "NOT str_contains(AETERM, '^HEAD')"
    parse: accept
    identifiers: [AETERM]
    shape: (not (call STR_CONTAINS (id AETERM) (str '^HEAD')))
  - id: str-detect-is-not-a-function
    context: predicate
    covers: [call, vocabulary, rejection]
    text: "str_detect(AEDECOD, 'X')"
    parse: reject
    condition: prohibited_function
  - id: str-contains-requires-two-arguments
    context: predicate
    covers: [call, vocabulary, rejection]
    text: "str_contains(AEDECOD)"
    parse: reject
    condition: prohibited_function
  - id: str-contains-pattern-must-be-a-string-literal
    context: predicate
    covers: [call, rejection]
    text: "str_contains(AEDECOD, 1)"
    parse: reject
    condition: invalid_expression
  - id: str-contains-rejects-an-invalid-pattern
    context: predicate
    covers: [call, rejection]
    text: "str_contains(AEDECOD, '(')"
    parse: reject
    condition: invalid_expression
  # Literals.
  - id: an-integer-literal-has-no-fraction-or-exponent
    context: predicate
    covers: [literal]
    text: "AVAL = 42"
    parse: accept
    identifiers: [AVAL]
    shape: (= (id AVAL) (int 42))
  - id: a-signed-literal-keeps-its-sign
    context: predicate
    covers: [literal, unary]
    text: "AVAL = -3"
    parse: accept
    identifiers: [AVAL]
    shape: (= (id AVAL) (int -3))
  - id: a-sign-before-a-number-is-the-numbers-own
    context: derivation
    covers: [literal, unary]
    text: "A + -1"
    parse: accept
    identifiers: [A]
    shape: (+ (id A) (int -1))
  - id: the-least-int-is-a-signed-literal
    context: derivation
    covers: [literal, unary]
    text: "A + -9223372036854775808"
    parse: accept
    identifiers: [A]
    shape: (+ (id A) (int -9223372036854775808))
  - id: a-literal-outside-the-int-range-is-refused-in-a-predicate
    context: predicate
    covers: [literal, rejection]
    text: "AVAL = 9223372036854775808"
    parse: reject
    condition: integer_overflow
  - id: a-literal-outside-the-int-range-is-refused-in-a-formula
    context: derivation
    covers: [literal, rejection]
    text: "9223372036854775808 * 0"
    parse: reject
    condition: integer_overflow
  - id: an-exponent-makes-a-literal-float
    context: predicate
    covers: [literal]
    text: "AVAL = 1e3"
    parse: accept
    identifiers: [AVAL]
    shape: (= (id AVAL) (float 1e3))
  - id: a-fraction-makes-a-literal-float
    context: predicate
    covers: [literal]
    text: "AVAL = 2.50"
    parse: accept
    identifiers: [AVAL]
    shape: (= (id AVAL) (float 2.50))
  - id: a-trailing-decimal-point-is-outside-the-grammar
    context: predicate
    covers: [literal, rejection]
    text: "AVAL = 2."
    parse: reject
    condition: invalid_expression
  - id: a-leading-decimal-point-is-outside-the-grammar
    context: derivation
    covers: [literal, rejection]
    text: "A + .5"
    parse: reject
    condition: invalid_expression
  - id: a-doubled-quote-is-one-quote
    context: predicate
    covers: [literal, escape]
    text: "COMMENT = 'it''s'"
    parse: accept
    identifiers: [COMMENT]
    shape: (= (id COMMENT) (str 'it''s'))
  - id: a-backslash-is-an-ordinary-scalar
    context: predicate
    covers: [literal, escape]
    text: "PATH = 'C:\\new'"
    parse: accept
    identifiers: [PATH]
    shape: (= (id PATH) (str 'C:\new'))
  - id: an-unterminated-string-is-rejected
    context: predicate
    covers: [literal, rejection]
    text: "COMMENT = 'open"
    parse: reject
    condition: invalid_expression
  - id: a-date-literal-needs-its-keyword
    context: predicate
    covers: [literal, temporal]
    text: "ADT >= DATE '2025-06-01'"
    parse: accept
    identifiers: [ADT]
    shape: (>= (id ADT) (date '2025-06-01'))
  - id: a-datetime-literal-carries-a-time
    context: predicate
    covers: [literal, temporal]
    text: "ADTM >= DATETIME '2025-06-01T08:30'"
    parse: accept
    identifiers: [ADTM]
    shape: (>= (id ADTM) (datetime '2025-06-01T08:30'))
  - id: a-quoted-date-without-its-keyword-is-text
    context: predicate
    covers: [literal, temporal]
    text: "ADT >= '2025-06-01'"
    parse: accept
    identifiers: [ADT]
    shape: (>= (id ADT) (str '2025-06-01'))
  - id: a-date-literal-that-names-no-day-is-rejected
    context: predicate
    covers: [literal, temporal, rejection]
    text: "ADT >= DATE '2025-02-30'"
    parse: reject
    condition: invalid_expression
  # Arithmetic: precedence, association and signs.
  - id: multiplication-binds-tighter-than-addition
    context: derivation
    covers: [arithmetic, precedence]
    text: "A + B * C"
    parse: accept
    identifiers: [A, B, C]
    shape: (+ (id A) (* (id B) (id C)))
  - id: division-binds-tighter-than-subtraction
    context: derivation
    covers: [arithmetic, precedence]
    text: "A - B / C"
    parse: accept
    identifiers: [A, B, C]
    shape: (- (id A) (/ (id B) (id C)))
  - id: repeated-subtraction-associates-from-the-left
    context: derivation
    covers: [arithmetic, precedence]
    text: "A - B - C"
    parse: accept
    identifiers: [A, B, C]
    shape: (- (- (id A) (id B)) (id C))
  - id: repeated-division-associates-from-the-left
    context: derivation
    covers: [arithmetic, precedence]
    text: "A / B / C"
    parse: accept
    identifiers: [A, B, C]
    shape: (/ (/ (id A) (id B)) (id C))
  - id: parentheses-override-arithmetic-precedence
    context: derivation
    covers: [arithmetic, grouping]
    text: "(A + B) * C"
    parse: accept
    identifiers: [A, B, C]
    shape: (* (+ (id A) (id B)) (id C))
  - id: a-unary-sign-binds-only-its-primary
    context: derivation
    covers: [unary, precedence]
    text: "-A * B"
    parse: accept
    identifiers: [A, B]
    shape: (* (neg (id A)) (id B))
  - id: a-leading-plus-is-a-unary-sign
    context: derivation
    covers: [unary]
    text: "+A + B"
    parse: accept
    identifiers: [A, B]
    shape: (+ (pos (id A)) (id B))
  - id: a-unary-sign-applies-to-a-group
    context: derivation
    covers: [unary, grouping]
    text: "-(A + B)"
    parse: accept
    identifiers: [A, B]
    shape: (neg (+ (id A) (id B)))
  - id: a-doubled-sign-is-outside-the-grammar
    context: derivation
    covers: [unary, rejection]
    text: "--A"
    parse: reject
    condition: invalid_expression
  - id: identifiers-are-case-sensitive-in-a-formula
    context: derivation
    covers: [identifier, keyword-case]
    text: "aval + AVAL"
    parse: accept
    identifiers: [AVAL, aval]
    shape: (+ (id aval) (id AVAL))
  - id: a-qualified-identifier-reads-a-record-lookup-field
    context: derivation
    covers: [identifier]
