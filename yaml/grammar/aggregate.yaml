# Machine-readable grammar for R013's aggregate reduction language.
#
# This file is the single source for the closed grammar written in
# `aggregate.expr`. R013's `## Grammar` block is rendered from `productions`,
# and every implementation's parser is checked against `vocabulary` and
# `cases`, so the rule, the R parser, and the Python parser cannot drift
# apart without failing validation.
#
# The operators, precedence, permitted `function` names, and reserved
# spellings are R010's; `imports` names what this contract takes from
# another rather than restating it.
#
# `grammar/README.md` states the file format and the shape notation.

schema_version: "1.0"
contract: aggregate
contract_version: "1.0.0"
rule: R013
start: expr
productions:
  - name: expr
    definition: |-
      term (("+" | "-") term)*
  - name: term
    definition: |-
      factor (("*" | "/") factor)*
  - name: factor
    definition: |-
      ("-" | "+")? primary
  - name: primary
    definition: |-
      number | "NULL" | identifier | reduction | call | "(" expr ")"
  - name: reduction
    definition: |-
      reducer "(" (expr | star) ")"
  - name: star
    definition: |-
      name "." "*"
  - name: call
    definition: |-
      function "(" [expr ("," expr)*] ")"
  - name: identifier
    definition: |-
      name ["." name]
  - name: number
    definition: |-
      digits ["." digits] [("e" | "E") ["+" | "-"] digits]
imports:
  name: predicate
  digits: predicate
  function: numeric
  prohibited: numeric
# `reducer` is closed: a name outside this table is a validation error, and
# widening it is an amendment to R013. `COUNT` is the one reducer that may
# take `star` instead of an expression, because it counts records rather
# than values.
vocabulary:
  reducer:
    SUM: {argument: [expr]}
    COUNT: {argument: [expr, star]}
    MIN: {argument: [expr]}
    MAX: {argument: [expr]}
    MEAN: {argument: [expr]}
    ONLY: {argument: [expr]}
cases:
  - id: a-reduction-reads-one-relation-field
    covers: [reduction]
    text: "SUM(EX.EXDOSE)"
    parse: accept
    identifiers: [EX.EXDOSE]
    shape: (reduce SUM (id EX.EXDOSE))
  - id: count-star-counts-records-rather-than-values
    covers: [reduction, star]
    text: "COUNT(EX.*)"
    parse: accept
    identifiers: []
    shape: (reduce COUNT (star EX))
  - id: count-of-a-field-counts-non-missing-values
    covers: [reduction]
    text: "COUNT(EX.EXDOSE)"
    parse: accept
    identifiers: [EX.EXDOSE]
    shape: (reduce COUNT (id EX.EXDOSE))
  - id: every-permitted-reducer-parses
    covers: [reduction, vocabulary]
    text: "MIN(A) + MAX(A) + MEAN(A) + ONLY(A) + SUM(A) + COUNT(A)"
    parse: accept
    identifiers: [A]
    shape: (+ (+ (+ (+ (+ (reduce MIN (id A)) (reduce MAX (id A)))
      (reduce MEAN (id A))) (reduce ONLY (id A))) (reduce SUM (id A)))
      (reduce COUNT (id A)))
  - id: reducer-names-are-case-insensitive
    covers: [reduction, keyword-case]
    text: "sum(A)"
    parse: accept
    identifiers: [A]
    shape: (reduce SUM (id A))
  - id: identifiers-are-case-sensitive
    covers: [identifier, keyword-case]
    text: "SUM(aval) + SUM(AVAL)"
    parse: accept
    identifiers: [AVAL, aval]
    shape: (+ (reduce SUM (id aval)) (reduce SUM (id AVAL)))
  - id: a-reduction-combines-with-arithmetic
    covers: [reduction, arithmetic]
    text: "SUM(EX.EXDOSE) / COUNT(EX.EXSEQ)"
    parse: accept
    identifiers: [EX.EXDOSE, EX.EXSEQ]
    shape: (/ (reduce SUM (id EX.EXDOSE)) (reduce COUNT (id EX.EXSEQ)))
  - id: multiplication-binds-tighter-than-addition
    covers: [arithmetic, precedence]
    text: "SUM(A) + B * C"
    parse: accept
    identifiers: [A, B, C]
    shape: (+ (reduce SUM (id A)) (* (id B) (id C)))
  - id: repeated-subtraction-associates-from-the-left
    covers: [arithmetic, precedence]
    text: "SUM(A) - SUM(B) - SUM(C)"
    parse: accept
    identifiers: [A, B, C]
    shape: (- (- (reduce SUM (id A)) (reduce SUM (id B))) (reduce SUM
      (id C)))
  - id: parentheses-override-precedence
    covers: [arithmetic, grouping]
    text: "(SUM(A) + SUM(B)) * 2"
    parse: accept
    identifiers: [A, B]
    shape: (* (+ (reduce SUM (id A)) (reduce SUM (id B))) (int 2))
  - id: a-unary-sign-applies-to-a-reduction
    covers: [unary]
    text: "-SUM(A)"
    parse: accept
    identifiers: [A]
    shape: (neg (reduce SUM (id A)))
  - id: a-function-may-wrap-a-reduction-argument
    covers: [call, reduction]
    text: "SUM(ABS(A))"
    parse: accept
    identifiers: [A]
    shape: (reduce SUM (call ABS (id A)))
  - id: a-function-may-take-a-reduction
    covers: [call, reduction]
    text: "COALESCE(SUM(A), 0)"
    parse: accept
    identifiers: [A]
    shape: (call COALESCE (reduce SUM (id A)) (int 0))
  - id: a-literal-and-null-are-primaries
    covers: [literal, null-literal]
    text: "COALESCE(SUM(A), NULL, 1.5)"
    parse: accept
    identifiers: [A]
    shape: (call COALESCE (reduce SUM (id A)) null (float 1.5))
  - id: reductions-do-not-nest
    covers: [reduction, rejection]
    text: "MAX(SUM(EX.EXDOSE))"
    parse: reject
    condition: nested_reduction
  - id: a-reduction-nested-under-arithmetic-still-nests
    covers: [reduction, rejection]
    text: "SUM(1 + MIN(A))"
    parse: reject
    condition: nested_reduction
  - id: only-count-takes-a-star
    covers: [star, rejection]
    text: "SUM(EX.*)"
    parse: reject
    condition: invalid_aggregate_expression
  - id: a-star-outside-a-reducer-is-rejected
    covers: [star, rejection]
    text: "EX.* + 1"
    parse: reject
    condition: invalid_aggregate_expression
  - id: a-star-takes-no-second-argument
    covers: [star, rejection]
    text: "COUNT(EX.*, 1)"
    parse: reject
    condition: invalid_aggregate_expression
  - id: a-reducer-takes-exactly-one-argument
    covers: [reduction, rejection]
    text: "SUM(A, B)"
    parse: reject
    condition: invalid_aggregate_expression
  - id: avg-is-not-the-portable-reducer-name
    covers: [vocabulary, rejection]
    text: "AVG(A)"
    parse: reject
    condition: prohibited_function
  - id: median-is-not-in-the-vocabulary
    covers: [vocabulary, rejection]
    text: "MEDIAN(A)"
    parse: reject
    condition: prohibited_function
  - id: rounding-is-not-in-the-vocabulary
    covers: [vocabulary, rejection]
    text: "ROUND(SUM(A), 2)"
    parse: reject
    condition: prohibited_function
  - id: greatest-requires-two-arguments
    covers: [vocabulary, rejection]
    text: "GREATEST(SUM(A))"
    parse: reject
    condition: prohibited_function
  - id: a-comparison-is-not-an-aggregate-expression
    covers: [prohibited, rejection]
    text: "SUM(A) > 1"
    parse: reject
    condition: prohibited_construct
  - id: a-boolean-operator-is-not-an-aggregate-expression
    covers: [prohibited, rejection]
    text: "SUM(A) AND SUM(B)"
    parse: reject
    condition: prohibited_construct
  - id: a-conditional-is-not-an-aggregate-expression
    covers: [prohibited, rejection]
    text: "CASE WHEN A THEN 1 ELSE 2 END"
    parse: reject
    condition: prohibited_construct
  - id: a-window-is-not-an-aggregate-expression
    covers: [prohibited, rejection]
    text: "SUM(A) OVER B"
    parse: reject
    condition: prohibited_construct
  - id: a-string-literal-is-not-an-aggregate-expression
    covers: [prohibited, rejection]
    text: "SUM(A) + 'text'"
    parse: reject
    condition: prohibited_construct
  - id: an-empty-expression-is-rejected
    covers: [rejection]
    text: ""
    parse: reject
    condition: invalid_aggregate_expression
  - id: an-unclosed-reducer-is-rejected
    covers: [reduction, rejection]
    text: "SUM(A"
    parse: reject
    condition: invalid_aggregate_expression
  - id: a-trailing-token-is-rejected
    covers: [rejection]
    text: "SUM(A) SUM(B)"
    parse: reject
    condition: invalid_aggregate_expression
