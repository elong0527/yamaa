version: "1.0"

# See REQ-1129 in rules/operations/windows.md.

window_spec:
    - group_by:
        type: "list[variable]"
        description: See REQ-1122 in rules/operations/windows.md.
    - order_by:
        type: "list[order_by_term]"
        description: See REQ-1122 in rules/operations/windows.md.
    - filter:
        type: predicate
        description: See REQ-1122 in rules/operations/windows.md.

expressions:
    row_number: # See REQ-1123 in rules/operations/windows.md.
        - window:
            type: window_spec
            description: See REQ-1123 in rules/operations/windows.md.
    rank: # See REQ-1124 in rules/operations/windows.md.
        - method:
            type: str
            default: competition
            values: [competition, dense]
            description: See REQ-1124 in rules/operations/windows.md.
        - window:
            type: window_spec
            description: See REQ-1124 in rules/operations/windows.md.
    row_value: # See REQ-1125 in rules/operations/windows.md.
        - source:
            type: variable
            required: true
            description: See REQ-1125 in rules/operations/windows.md.
        - offset:
            type: int
            required: true
            description: See REQ-1125 in rules/operations/windows.md.
        - window:
            type: window_spec
            description: See REQ-1125 in rules/operations/windows.md.
    previous_non_missing: # See REQ-1126 in rules/operations/windows.md.
        - source:
            type: variable
            required: true
            description: See REQ-1126 in rules/operations/windows.md.
        - window:
            type: window_spec
            description: See REQ-1126 in rules/operations/windows.md.
    baseline_flag: # See REQ-1127 in rules/operations/windows.md.
        - date:
            type: variable
            required: true
            description: See REQ-1127 in rules/operations/windows.md.
        - reference_date:
            type: variable
            required: true
            description: See REQ-1127 in rules/operations/windows.md.
        - window:
            type: window_spec
            description: See REQ-1127 in rules/operations/windows.md.
