version: "1.0"

expressions:
    row_number: # Numbers eligible rows from 1 within each partition.
        # Filtering happens before partitioning; excluded rows receive missing.
        # Ordering ties preserve row-template order, then base-record order.
        - group_by:
            type: "list[variable]"
            description: Variables defining partitions; omission uses one partition.
        - order_by:
            type: "list[order_by_term]"
            required: true
            description: Terms ordering eligible rows within each partition.
        - filter:
            type: sql
            description: Predicate selecting rows to number.
    rank: # Numbers eligible rows from 1 within each partition, sharing a number across ties.
        # Rows equal on every order term take the lowest number they could take,
        # so the next distinct value takes its own position and the numbers
        # between are skipped. A row's number is therefore the count of rows
        # ordered strictly before it, plus one. Two missing values are equal for
        # this purpose, whatever nulls places them among.
        # Filtering happens before partitioning; excluded rows receive missing.
        - group_by:
            type: "list[variable]"
            description: Variables defining partitions; omission uses one partition.
        - order_by:
            type: "list[order_by_term]"
            required: true
            description: Terms ordering eligible rows within each partition.
        - filter:
            type: sql
            description: Predicate selecting rows to number.
    dense_rank: # Numbers the distinct ordered values from 1 within each partition.
        # Rows equal on every order term take one number and the next distinct
        # value takes the following one, so no number is skipped and the largest
        # number in a partition is how many distinct values it holds. Ties and
        # filtering behave as they do for rank.
        - group_by:
            type: "list[variable]"
            description: Variables defining partitions; omission uses one partition.
        - order_by:
            type: "list[order_by_term]"
            required: true
            description: Terms ordering eligible rows within each partition.
        - filter:
            type: sql
            description: Predicate selecting rows to number.
    row_value: # Returns the source value from another row of the ordered partition.
        # offset counts along the declared order: positive moves toward later
        # rows and negative toward earlier ones, so reversing every order_by
        # direction and negating offset gives the same result.
        # A row with fewer than |offset| rows on that side of it within its
        # partition yields missing, which does not distinguish an absent row
        # from a present row whose value is missing.
        - source:
            type: variable
            required: true
            description: Variable read from the offset row.
        - offset:
            type: int
            required: true
            description: Rows to move along the declared order; nonzero.
        - group_by:
            type: "list[variable]"
            description: Variables defining partitions; omission uses one partition.
        - order_by:
            type: "list[order_by_term]"
            required: true
            description: Terms ordering rows within each partition.
    baseline_flag: # Returns Y for the unique latest eligible row, missing elsewhere.
        # An eligible row has a non-missing date at or before reference_date.
        # A tie for the latest eligible date is an error.
        - group_by:
            type: "list[variable]"
            description: Variables defining baseline-selection partitions.
        - date:
            type: variable
            required: true
            description: Candidate baseline date.
        - reference_date:
            type: variable
            required: true
            description: Inclusive upper bound for the baseline date.
    baseline_value: # Broadcasts the value from the row whose flag is Y.
        # No flagged row returns missing; more than one is an error.
        - group_by:
            type: "list[variable]"
            description: Variables defining broadcast partitions.
        - value:
            type: variable
            required: true
            description: Variable copied from the flagged row.
        - flag:
            type: variable
            required: true
            description: Variable identifying the source row with Y.
