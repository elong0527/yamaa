version: "1.0"

expressions:
    str_extract: # See REQ-1111 in rules/operations/text.md.
        - source:
            type: variable
            required: true
            description: See REQ-1111 in rules/operations/text.md.
        - pattern:
            type: regex
            required: true
            description: See REQ-1111 in rules/operations/text.md.
        - group:
            type: int
            default: 0
            description: See REQ-1111 in rules/operations/text.md.
        - missing:
            type: literal_value
            description: See REQ-1111 in rules/operations/text.md.
        - no_match:
            type: literal_value
            description: See REQ-1111 in rules/operations/text.md.
    str_concat: # See REQ-1112 in rules/operations/text.md.
        - sources:
            type: "list[expression]"
            required: true
            description: See REQ-1112 in rules/operations/text.md.
        - missing:
            type: literal_value
            description: See REQ-1112 in rules/operations/text.md.
    str_template: # See REQ-1113 in rules/operations/text.md.
        type: [string_template, str_template_class]
        description: See REQ-1113 in rules/operations/text.md.
    str_upper: # See REQ-1114 in rules/operations/text.md.
        - source:
            type: variable
            required: true
            description: See REQ-1114 in rules/operations/text.md.
        - missing:
            type: literal_value
            description: See REQ-1114 in rules/operations/text.md.
    str_lower: # See REQ-1115 in rules/operations/text.md.
        - source:
            type: variable
            required: true
            description: See REQ-1115 in rules/operations/text.md.
        - missing:
            type: literal_value
            description: See REQ-1115 in rules/operations/text.md.
    str_sentence: # See REQ-1240 in rules/operations/text.md.
        - source:
            type: variable
            required: true
            description: See REQ-1240 in rules/operations/text.md.
        - missing:
            type: literal_value
            description: See REQ-1240 in rules/operations/text.md.
    str_title: # See REQ-1241 in rules/operations/text.md.
        - source:
            type: variable
            required: true
            description: See REQ-1241 in rules/operations/text.md.
        - missing:
            type: literal_value
            description: See REQ-1241 in rules/operations/text.md.

string_template:
    type: str
    description: See REQ-1116 in rules/operations/text.md.

str_template_class:
    - template:
        type: string_template
        required: true
        description: See REQ-1117 in rules/operations/text.md.
    - missing:
        type: literal_value
        description: See REQ-1117 in rules/operations/text.md.
