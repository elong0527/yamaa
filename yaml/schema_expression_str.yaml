version: "1.0"

expressions:
    str_extract: # Extracts one regular-expression match group from a string.
        - source:
            type: variable
            required: true
            description: String variable to search.
        - pattern:
            type: regex
            required: true
            description: ECMAScript regular expression matched against source.
        - group:
            type: int
            default: 0
            description: Match group to return; 0 is the full match.
        - missing:
            type: literal_value
            description: Value returned when source is missing.
        - no_match:
            type: literal_value
            description: Value returned when pattern does not match source.
    str_concat: # Concatenates string expression results in order.
        - sources:
            type: "list[expression]"
            required: true
            description: Expressions to concatenate in order.
        - missing:
            type: literal_value
            description: Value returned when any source is missing.
    str_template: # Interpolates string variables under R012.
        type: [string_template, str_template_class]
        description: Portable string template, concise or with missing handling.
    str_upper: # Converts every character in a string to uppercase.
        - source:
            type: variable
            required: true
            description: String variable to convert to uppercase.
        - missing:
            type: literal_value
            description: Value returned when source is missing.
    str_lower: # Converts every character in a string to lowercase.
        - source:
            type: variable
            required: true
            description: String variable to convert to lowercase.
        - missing:
            type: literal_value
            description: Value returned when source is missing.

string_template:
    type: str
    description: Template string defined by R012.

str_template_class:
    - template:
        type: string_template
        required: true
        description: Text containing literal content and braced variables.
    - missing:
        type: literal_value
        description: Value returned when any placeholder value is missing.
