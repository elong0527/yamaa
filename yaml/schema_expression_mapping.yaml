version: "1.0"

expressions:
    mapping: # See REQ-1110 in rules/operations/text.md.
        - source:
            type: filtered_source
            required: true
            description: See REQ-1110 in rules/operations/text.md.
        - dict:
            type: "dict[str, literal_value]"
            required: false
            description: See REQ-1110 in rules/operations/text.md.
        - dict_yaml:
            type: project_path
            required: false
            description: See REQ-1110 in rules/operations/text.md.
        - case_sensitive:
            type: bool
            default: true
            description: See REQ-1110 in rules/operations/text.md.
        - missing:
            type: literal_value
            description: See REQ-1110 in rules/operations/text.md.
        - unmapped:
            type: literal_value
            description: See REQ-1110 in rules/operations/text.md.
        - strict:
            type: bool
            required: false
            description: See REQ-1110 in rules/operations/text.md.
    lookup: # See REQ-1055 in rules/operations/lookup.md.
        - value:
            type: identifier
            required: true
            description: See REQ-1055 in rules/operations/lookup.md.
        - dataset:
            type: identifier
            required: true
            description: See REQ-1055 in rules/operations/lookup.md.
        - key_base:
            type: [variable, "list[variable]"]
            required: false
            description: See REQ-1055 in rules/operations/lookup.md.
        - key:
            type: [identifier, "list[identifier]"]
            required: false
            description: See REQ-1055 in rules/operations/lookup.md.
        - filter:
            type: predicate
            required: false
            description: See REQ-1055 in rules/operations/lookup.md.
        - between:
            type: intermediate_between_class
            required: false
            description: See REQ-1055 in rules/operations/lookup.md.
        - order_by:
            type: "list[order_by_term]"
            required: false
            description: See REQ-1055 in rules/operations/lookup.md.
        - keep:
            type: str
            required: false
            values: [first, last]
            description: See REQ-1055 in rules/operations/lookup.md.
        - missing:
            type: literal_value
            required: false
            description: See REQ-1055 in rules/operations/lookup.md.
        - strict:
            type: bool
            required: false
            default: false
            description: See REQ-1055 in rules/operations/lookup.md.
    cut: # See REQ-1118 in rules/operations/computation.md.
        - source:
            type: variable
            required: true
            description: See REQ-1118 in rules/operations/computation.md.
        - breaks:
            type: "list[float]"
            required: true
            description: See REQ-1118 in rules/operations/computation.md.
        - labels:
            type: "list[str]"
            required: true
            description: See REQ-1118 in rules/operations/computation.md.
        - right:
            type: bool
            default: false
            description: See REQ-1118 in rules/operations/computation.md.
        - missing:
            type: literal_value
            description: See REQ-1118 in rules/operations/computation.md.
