version: "1.0"

expressions:
    mapping: # See REQ-1110.
        - source:
            type: filtered_source
            required: true
            description: See REQ-1110.
        - dict:
            type: ["dict[str, literal_value]", project_path]
            required: true
            description: See REQ-1110.
        - case_sensitive:
            type: bool
            default: true
            description: See REQ-1110.
        - missing:
            type: literal_value
            description: See REQ-1110.
        - unmapped:
            type: literal_value
            description: See REQ-1110.
    cut: # See REQ-1118.

        - source:
            type: variable
            required: true
            description: See REQ-1118.
        - breaks:
            type: "list[float]"
            required: true
            description: See REQ-1118.
        - labels:
            type: "list[str]"
            required: true
            description: See REQ-1118.
        - right:
            type: bool
            default: false
            description: See REQ-1118.
        - missing:
            type: literal_value
            description: See REQ-1118.
