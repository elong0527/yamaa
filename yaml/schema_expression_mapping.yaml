version: "1.0"

expressions:
    mapping: # Looks up a string source in an inline dictionary.
        # Case-insensitive lookup folds ASCII a-z to A-Z under R019; folded keys
        # must be unique.
        - source:
            type: filtered_source
            required: true
            description: String variable used as the dictionary key.
        - dict:
            type: "dict[str, literal_value]"
            required: true
            description: Source-value to result-value dictionary.
        - case_sensitive:
            type: bool
            default: true
            description: Compare exactly when true; use R019 ASCII folding when false.
        - missing:
            type: literal_value
            description: Value returned when source is missing.
        - unmapped:
            type: literal_value
            description: Value returned when source has no dictionary entry.
    lookup: # Looks up one value in a declared dataset by explicit key pairs.
        # Key_base and key lists pair by position, have equal length, and form a
        # unique combined dataset key. Pair order does not change the result.
        # Either list may be omitted: an omitted key is inferred from the
        # applicable output keys (R003-40), and an omitted key_base defaults to
        # the key names. Key_base must not repeat the key names (R003-45).
        - value:
            type: identifier
            required: true
            description: Dataset column returned by the lookup.
        - dataset:
            type: identifier
            required: true
            description: Declared dataset containing the lookup table.
        - key_base:
            type: [variable, "list[variable]"]
            required: false
            description: One or more current-row lookup values; omit when they name the same columns as key. Must not repeat the key names (R003-45).
        - key:
            type: [identifier, "list[identifier]"]
            required: false
            description: Dataset columns paired by position with key_base; omit to match on the applicable output keys (R003-40).
        - filter:
            type: predicate
            required: false
            description: Predicate selecting eligible records before matching.
        - between:
            type: intermediate_between_class
            required: false
            description: Current-row value matched inclusively against lower and upper dataset bounds.
        - order_by:
            type: "list[order_by_term]"
            required: false
            description: Terms ordering eligible records; declared with keep.
        - keep:
            type: str
            required: false
            values: [first, last]
            description: Ordered record to retain; declared with order_by.
        - missing:
            type: literal_value
            required: false
            description: Value returned when the lookup yields nothing; defaults to missing.
        - strict:
            type: bool
            required: false
            default: false
            description: Fail when the lookup yields nothing.
    cut: # Assigns a numeric source to one of the labeled break intervals.
        - source:
            type: variable
            required: true
            description: Numeric variable to classify.
        - breaks:
            type: "list[float]"
            required: true
            description: Ascending interval boundaries.
        - labels:
            type: "list[str]"
            required: true
            description: One label per interval; exactly one more than breaks.
        - right:
            type: bool
            default: false
            description: Right-closed/left-open; false is left-closed/right-open.
        - missing:
            type: literal_value
            description: Value returned when source is missing.
