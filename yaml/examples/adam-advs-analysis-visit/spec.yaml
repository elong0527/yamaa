schema_version: "1.0.0-rc.1"
domain: ADVS
datasets:
  ADVSPRE: input/advs_pre.csv
base: ADVSPRE
keys: [STUDYID, USUBJID, PARAMCD, VSSEQ]

output:
  path: advs.csv
  columns: [STUDYID, USUBJID, PARAMCD, VSSEQ, VISIT, VISITNUM, ADT, ADY, AVAL, AVISIT, AVISITN, ANL01FL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: ADVSPRE.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: ADVSPRE.USUBJID

  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation:
      source: ADVSPRE.PARAMCD

  - name: VSSEQ
    type: int
    label: Sequence Number
    derivation:
      source: ADVSPRE.VSSEQ

  - name: VISIT
    type: str
    label: Visit Name
    derivation:
      source: ADVSPRE.VISIT

  - name: VISITNUM
    type: float
    label: Visit Number
    derivation:
      source: ADVSPRE.VISITNUM

  - name: ADT
    type: date
    label: Analysis Date
    derivation:
      source: ADVSPRE.ADT

  - name: ADY
    type: int
    label: Analysis Relative Day
    derivation:
      source: ADVSPRE.ADY

  - name: AVAL
    type: float
    label: Analysis Value
    derivation:
      source: ADVSPRE.AVAL
    verifications:
      not_missing: {}

  - name: AVISIT
    type: str
    label: Analysis Visit
    derivation:
      cut:
        source: ADY
        breaks: [0, 2, 22, 43]
        labels: [SCREENING, BASELINE, WEEK 2, WEEK 4, POST-TREATMENT]
        right: false
        missing: null
    verifications:
      allowed_values:
        values: [SCREENING, BASELINE, WEEK 2, WEEK 4, POST-TREATMENT]

  - name: AVISITN
    type: int
    label: Analysis Visit (N)
    derivation:
      mapping:
        source: AVISIT
        dict:
          SCREENING: -1
          BASELINE: 0
          WEEK 2: 2
          WEEK 4: 4
          POST-TREATMENT: 99
        missing: null

  - name: AWRANK
    type: int
    label: Analysis Window Rank
    derivation:
      row_number:
        group_by: [STUDYID, USUBJID, PARAMCD, AVISIT]
        order_by: [ADY, VSSEQ]
        filter: "AVISIT IS NOT NULL"

  - name: ANL01FL
    type: str
    label: Analysis Record Flag 01
    derivation:
      case:
        branches:
          - when: "AWRANK = 1"
            then:
              literal: Y

verifications:
  - unique:
      columns: [STUDYID, USUBJID, PARAMCD, VSSEQ]
  - row_count:
      min: 9
      max: 9
  - all_or_none:
      id: analysis-visit-completeness
      columns: [AVISIT, AVISITN]
  - implies:
      id: analysis-record-has-analysis-visit
      when: "ANL01FL = 'Y'"
      then: "AVISIT IS NOT NULL AND ADY IS NOT NULL"
  - implies:
      id: baseline-window-is-study-day-one
      when: "AVISIT = 'BASELINE'"
      then: "ADY = 1"
