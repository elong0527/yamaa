schema_version: "1.0"
domain: ADEX
keys: [STUDYID, USUBJID, EXTRT]
input:
  TRT: input/subject_treatment.csv
  EX: {path: input/ex.csv, types: {EXDOSE: float}}
base: TRT

output:
  path: adex.csv
  columns: [STUDYID, USUBJID, EXTRT, DOSECUM]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: TRT.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: TRT.USUBJID

  - name: EXTRT
    type: str
    label: Name of Treatment
    derivation:
      source: TRT.EXTRT

  - name: DOSECUM
    type: float
    label: Cumulative Dose
    derivation:
      aggregate: "SUM(EX.EXDOSE)"
