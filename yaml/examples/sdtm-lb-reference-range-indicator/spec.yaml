schema_version: "1.0.0-rc.1"
domain: LB
datasets:
  LB_RAW: input/lb_raw.csv
  LBRANGE: input/lbrange.csv
base: LB_RAW
keys: [STUDYID, USUBJID, LBSEQ]

record_lookups:
  - id: REFRANGE
    dataset: LBRANGE
    source: [LBTESTCD, SEX]
    key: [LBTESTCD, SEX]

output:
  path: lb.csv
  columns: [STUDYID, DOMAIN, USUBJID, LBSEQ, LBTESTCD, SEX, LBSTRESN, LBORRESU, LBSTNRLO, LBSTNRHI, LBNRIND]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: LB_RAW.STUDYID

  - name: DOMAIN
    type: str
    label: Domain Abbreviation
    derivation:
      literal: LB

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: LB_RAW.USUBJID

  - name: LBSEQ
    type: int
    label: Sequence Number
    derivation:
      source: LB_RAW.LBSEQ

  - name: LBTESTCD
    type: str
    label: Lab Test or Examination Short Name
    derivation:
      source: LB_RAW.LBTESTCD

  - name: SEX
    type: str
    label: Sex
    derivation:
      source: LB_RAW.SEX

  - name: LBSTRESN
    type: float
    label: Numeric Result/Finding in Standard Units
    derivation:
      source: LB_RAW.LBSTRESN

  - name: LBORRESU
    type: str
    label: Original Units
    derivation:
      source: REFRANGE.UNIT

  - name: LBSTNRLO
    type: float
    label: Reference Range Lower Limit-Std Units
    derivation:
      source: REFRANGE.NRLO

  - name: LBSTNRHI
    type: float
    label: Reference Range Upper Limit-Std Units
    derivation:
      source: REFRANGE.NRHI

  - name: LBNRIND
    type: str
    label: Reference Range Indicator
    derivation:
      case:
        branches:
          - when: "LBSTRESN IS NULL"
            then:
              literal: null
          - when: "LBSTRESN < LBSTNRLO"
            then:
              literal: LOW
          - when: "LBSTRESN > LBSTNRHI"
            then:
              literal: HIGH
        otherwise:
          literal: NORMAL

verifications:
  - row_count:
      min: 7
      max: 7
  - all_or_none:
      id: reference-dictionary-entry-is-complete
      columns: [LBORRESU, LBSTNRLO, LBSTNRHI]
