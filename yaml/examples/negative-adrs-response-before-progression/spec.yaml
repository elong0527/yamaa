schema_version: "1.0"
domain: ADRS
datasets:
  ADSL: input/adsl.csv
  ADRSPRE: input/adrs_pre.csv
base: ADSL
keys: [STUDYID, USUBJID, PARAMCD]

columns:
  - name: STUDYID
    type: str
    derivation:
      source: ADSL.STUDYID

  - name: USUBJID
    type: str
    derivation:
      source: ADSL.USUBJID

  - name: PARAMCD
    type: str
    derivation:
      literal: BORPD

  - name: PARAM
    type: str
    derivation:
      literal: Best Overall Response up to Progression

  - name: PDDT
    type: date
    derivation:
      aggregate:
        filter: "ADRSPRE.AVALC = 'PD'"
        expr: "MIN(ADRSPRE.ADT)"

  - name: AVAL
    type: int
    derivation:
      aggregate:
        filter: "PDDT IS NULL OR ADRSPRE.ADT <= PDDT"
        expr: "MIN(ADRSPRE.AVAL)"

  - name: AVALC
    type: str
    derivation:
      case:
        branches:
          - when: "AVAL = 1"
            then:
              literal: CR
          - when: "AVAL = 2"
            then:
              literal: PR
          - when: "AVAL = 3"
            then:
              literal: SD
          - when: "AVAL = 4"
            then:
              literal: NON-CR/NON-PD
          - when: "AVAL = 5"
            then:
              literal: PD
          - when: "AVAL = 6"
            then:
              literal: NE

verifications:
  - unique:
      columns: [STUDYID, USUBJID, PARAMCD]
  - row_count:
      min: 4
      max: 4
