schema_version: "1.0"
domain: ADAE
datasets:
  AE: input/ae.csv
base: AE
keys: [STUDYID, USUBJID, AESEQ]

output:
  columns: [STUDYID, USUBJID, AESEQ, AETERM, ASTDTM]

columns:
  - name: STUDYID
    type: str
    derivation:
      source: AE.STUDYID

  - name: USUBJID
    type: str
    derivation:
      source: AE.USUBJID

  - name: AESEQ
    type: int
    derivation:
      source: AE.AESEQ

  - name: AETERM
    type: str
    derivation:
      source: AE.AETERM

  - name: ASTDTM
    type: datetime
    derivation:
      source: AE.AESTDTC
