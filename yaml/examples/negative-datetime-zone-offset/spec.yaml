schema_version: "1.0.0-rc.1"
domain: ADAE
datasets:
  AE: input/ae.csv
base: AE
keys: [STUDYID, USUBJID, AESEQ]

output:
  path: adae.csv
  columns: [STUDYID, USUBJID, AESEQ, AETERM, ASTDTM]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: AE.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: AE.USUBJID

  - name: AESEQ
    type: int
    label: Sequence Number
    derivation:
      source: AE.AESEQ

  - name: AETERM
    type: str
    label: Reported Term for the Adverse Event
    derivation:
      source: AE.AETERM

  - name: ASTDTM
    type: datetime
    label: Analysis Start Date/Time
    derivation:
      source: AE.AESTDTC
