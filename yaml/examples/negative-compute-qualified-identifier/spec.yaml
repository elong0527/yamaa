schema_version: "1.0"
domain: ADEX
datasets:
  TRT: input/subject_treatment.csv
  EX: input/ex.csv
base: TRT
keys: [STUDYID, USUBJID]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: TRT.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: TRT.USUBJID

  - name: DOSEDBL
    type: float
    label: Doubled Dose
    derivation:
      compute:
        expr: "EX.EXDOSE * 2"
