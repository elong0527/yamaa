schema_version: "1.0"
domain: ADLB
datasets:
  LB: input/lb.csv
  ADSL: input/adsl.csv
base: LB
keys: [STUDYID, USUBJID, PARAMCD, LBSEQ]

output:
  path: adlb.csv
  columns: [STUDYID, USUBJID, PARAMCD, LBSEQ, ADT, TRTSDT, AVAL, ABLFL, BASE]

rows:
  - id: record
    dataset: LB
    derivations:
      STUDYID: {source: LB.STUDYID}
      USUBJID: {source: LB.USUBJID}
      PARAMCD: {source: LB.LBTESTCD}
      LBSEQ: {source: LB.LBSEQ}

columns:
  - name: STUDYID
    type: str
    label: Study Identifier

  - name: USUBJID
    type: str
    label: Unique Subject Identifier

  - name: PARAMCD
    type: str
    label: Parameter Code

  - name: LBSEQ
    type: int
    label: Sequence Number

  - name: ADT
    type: date
    label: Analysis Date
    derivation:
      source: LB.LBDTC

  - name: TRTSDT
    type: date
    label: Date of First Exposure to Treatment
    derivation:
      source: ADSL.TRTSDT

  - name: AVAL
    type: float
    label: Analysis Value
    derivation:
      source: LB.LBSTRESN

  - name: ABLFL
    type: str
    label: Baseline Record Flag
    derivation:
      baseline_flag:
        group_by: [STUDYID, USUBJID, PARAMCD]
        date: ADT
        reference_date: TRTSDT

  - name: BASE
    type: float
    label: Baseline Value
    derivation:
      baseline_value:
        group_by: [STUDYID, USUBJID, PARAMCD]
        value: AVAL
        flag: ABLFL
