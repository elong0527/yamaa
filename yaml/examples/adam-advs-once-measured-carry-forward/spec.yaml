schema_version: "1.0"
domain: ADVS
datasets:
  VS: input/vs.csv
  ADSL: input/adsl.csv
base: VS
keys: [STUDYID, USUBJID, VSSEQ]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: VS.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: VS.USUBJID

  - name: VSSEQ
    type: int
    label: Sequence Number
    derivation:
      source: VS.VSSEQ

  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation:
      source: VS.VSTESTCD

  - name: ADT
    type: date
    label: Analysis Date
    derivation:
      source: VS.VSDTC

  - name: AVAL
    type: float
    label: Analysis Value
    derivation:
      source: VS.VSSTRESN

  - name: TRTSDT
    type: date
    label: Date of First Exposure to Treatment
    derivation:
      source: ADSL.TRTSDT

  - name: HEIGHTBL
    type: float
    label: Baseline Height
    derivation:
      baseline_value:
        group_by: [STUDYID, USUBJID]
        value: AVAL
        flag: HGTBLFL

  - name: HGTDT
    type: date
    label: Height Assessment Date
    output: false
    derivation:
      case:
        branches:
          - when: "PARAMCD = 'HEIGHT'"
            then:
              source: ADT

  - name: HGTBLFL
    type: str
    label: Baseline Height Record Flag
    output: false
    derivation:
      baseline_flag:
        group_by: [STUDYID, USUBJID]
        date: HGTDT
        reference_date: TRTSDT

verifications:
  - row_count:
      min: 7
      max: 7
  - implies:
      id: height-record-supplies-subject-height
      when: "PARAMCD = 'HEIGHT' AND HGTBLFL = 'Y'"
      then: "AVAL = HEIGHTBL"
