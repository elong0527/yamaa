schema_version: "1.0"
domain: ADVS
datasets:
  VS: input/vs.csv
  ADSL:
    path: input/adsl.csv
    types: {PLANCNT: int}

base: ADSL
expand:
  count: ADSL.PLANCNT
  index: ASEQ
keys: [STUDYID, USUBJID, ASEQ]

record_lookups:
  - id: COLLECTED
    dataset: VS
    source: [STUDYID, USUBJID, PARAMCD, ADT]
    key: [STUDYID, USUBJID, VSTESTCD, VSDTC]
    unmatched: missing

output:
  columns: [STUDYID, USUBJID, ASEQ, VSSEQ, PARAMCD, ADT, AVAL, TRTSDT, HEIGHTBL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: ADSL.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: ADSL.USUBJID

  - name: ASEQ
    type: int
    label: Analysis Sequence Number

  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation:
      case:
        branches:
          - when: "ASEQ = 1"
            then: {literal: HEIGHT}
        otherwise: {literal: WEIGHT}

  - name: ADT
    type: date
    label: Analysis Date
    derivation:
      case:
        branches:
          - when: "ASEQ = 1"
            then: {source: ADSL.HGTDT}
          - when: "ASEQ = 2"
            then: {source: ADSL.WGTBLDT}
        otherwise: {source: ADSL.WGTW3DT}

  - name: VSSEQ
    type: int
    label: Sequence Number
    derivation:
      source: COLLECTED.VSSEQ

  - name: AVAL
    type: float
    label: Analysis Value
    derivation:
      source: COLLECTED.VSSTRESN

  - name: TRTSDT
    type: date
    label: Date of First Exposure to Treatment
    derivation:
      source: ADSL.TRTSDT

  - name: HGTDT
    type: date
    label: Height Assessment Date
    derivation:
      case:
        branches:
          - when: "PARAMCD = 'HEIGHT' AND AVAL IS NOT NULL"
            then: {source: ADT}

  - name: HGTBLFL
    type: str
    label: Baseline Height Record Flag
    derivation:
      baseline_flag:
        group_by: [STUDYID, USUBJID]
        date: HGTDT
        reference_date: TRTSDT

  - name: HEIGHTBL
    type: float
    label: Baseline Height
    derivation:
      baseline_value:
        group_by: [STUDYID, USUBJID]
        value: AVAL
        flag: HGTBLFL

verifications:
  - unique:
      columns: [STUDYID, USUBJID, ASEQ]
  - row_count:
      min: 9
      max: 9
  - all_or_none:
      id: collected-record-carries-sequence-and-value
      columns: [VSSEQ, AVAL]
  - implies:
      id: height-record-supplies-subject-height
      when: "PARAMCD = 'HEIGHT' AND HGTBLFL = 'Y'"
      then: "AVAL = HEIGHTBL"
