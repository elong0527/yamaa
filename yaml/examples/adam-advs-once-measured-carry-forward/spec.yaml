schema_version: "1.0"
domain: ADVS
datasets:
  PLAN:
    path: input/plan.csv
    types: {ASEQ: int}
  VS: input/vs.csv
  ADSL: input/adsl.csv

base: PLAN
keys: [STUDYID, USUBJID, ASEQ]

record_lookups:
  - id: SUBJECT
    dataset: ADSL
    source: [STUDYID, USUBJID]
    key: [STUDYID, USUBJID]

  - id: COLLECTED
    dataset: VS
    source: [STUDYID, USUBJID, PARAMCD, ADT]
    key: [STUDYID, USUBJID, VSTESTCD, VSDTC]
    unmatched: missing

output:
  profile: csv
  columns: [STUDYID, USUBJID, ASEQ, VSSEQ, PARAMCD, ADT, AVAL, TRTSDT, HEIGHTBL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: PLAN.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: PLAN.USUBJID

  - name: ASEQ
    type: int
    label: Analysis Sequence Number
    derivation:
      source: PLAN.ASEQ

  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation:
      source: PLAN.PARAMCD

  - name: ADT
    type: date
    label: Analysis Date
    derivation:
      source: PLAN.ADT

  - name: VSSEQ
    type: int
    label: Sequence Number
    derivation:
      source: COLLECTED.VSSEQ

  - name: AVALCOL
    type: float
    label: Collected Analysis Value
    derivation:
      source: COLLECTED.VSSTRESN

  - name: AVALPREV
    type: float
    label: Previous Non-Missing Analysis Value
    derivation:
      previous_non_missing:
        source: AVALCOL
        group_by: [STUDYID, USUBJID, PARAMCD]
        order_by: [ADT, ASEQ]

  - name: AVAL
    type: float
    label: Analysis Value
    derivation:
      coalesce:
        sources: [AVALCOL, AVALPREV]

  - name: TRTSDT
    type: date
    label: Date of First Exposure to Treatment
    derivation:
      source: SUBJECT.TRTSDT

  - name: HGTDT
    type: date
    label: Height Assessment Date
    derivation:
      case:
        branches:
          - when: "PARAMCD = 'HEIGHT' AND AVALCOL IS NOT NULL"
            then: {source: ADT}

  - name: HGTBLFL
    type: str
    label: Baseline Height Record Flag
    derivation:
      baseline_flag:
        group_by: [STUDYID, USUBJID]
        date: HGTDT
        reference_date: TRTSDT

  - name: HEIGHTBL
    type: float
    label: Baseline Height
    derivation:
      baseline_value:
        group_by: [STUDYID, USUBJID]
        value: AVALCOL
        flag: HGTBLFL

verifications:
  - unique:
      columns: [STUDYID, USUBJID, ASEQ]
  - row_count:
      min: 12
      max: 12
  - all_or_none:
      id: collected-record-carries-sequence-and-value
      columns: [VSSEQ, AVALCOL]
  - implies:
      id: height-record-supplies-subject-height
      when: "PARAMCD = 'HEIGHT' AND HGTBLFL = 'Y'"
      then: "AVALCOL = HEIGHTBL"
  - implies:
      id: uncollected-filled-value-comes-from-predecessor
      when: "VSSEQ IS NULL AND AVAL IS NOT NULL"
      then: "AVAL = AVALPREV"
  - implies:
      id: no-predecessor-leaves-uncollected-value-missing
      when: "VSSEQ IS NULL AND AVALPREV IS NULL"
      then: "AVAL IS NULL"
