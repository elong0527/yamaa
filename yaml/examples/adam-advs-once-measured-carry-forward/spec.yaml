schema_version: "1.0"
domain: ADVS
datasets:
  VS: input/vs.csv
  ADSL:
    path: input/adsl.csv
    types: {PLANCNT: int}

derived:
  - id: SPINE
    base: ADSL
    expand:
      count: ADSL.PLANCNT
      as: ASEQ
    keys: [STUDYID, USUBJID, ASEQ]
    columns:
      - name: STUDYID
        type: str
        derivation: {source: ADSL.STUDYID}
      - name: USUBJID
        type: str
        derivation: {source: ADSL.USUBJID}
      - name: ASEQ
        type: int
      - name: PARAMCD
        type: str
        derivation:
          case:
            branches:
              - when: "ASEQ = 1"
                then: {literal: HEIGHT}
            otherwise: {literal: WEIGHT}
      - name: ADT
        type: date
        derivation:
          case:
            branches:
              - when: "ASEQ = 1"
                then: {source: ADSL.HGTDT}
              - when: "ASEQ = 2"
                then: {source: ADSL.WGTBLDT}
            otherwise: {source: ADSL.WGTW3DT}
      - name: TRTSDT
        type: date
        derivation: {source: ADSL.TRTSDT}

base: SPINE
keys: [STUDYID, USUBJID, ASEQ]

record_lookups:
  - id: COLLECTED
    dataset: VS
    source: [STUDYID, USUBJID, PARAMCD, ADT]
    key: [STUDYID, USUBJID, VSTESTCD, VSDTC]
    unmatched: missing

columns:
  - name: STUDYID
    type: str
    derivation: {source: SPINE.STUDYID}

  - name: USUBJID
    type: str
    derivation: {source: SPINE.USUBJID}

  - name: ASEQ
    type: int
    derivation: {source: SPINE.ASEQ}

  - name: VSSEQ
    type: int
    derivation: {source: COLLECTED.VSSEQ}

  - name: PARAMCD
    type: str
    derivation: {source: SPINE.PARAMCD}

  - name: ADT
    type: date
    derivation: {source: SPINE.ADT}

  - name: AVAL
    type: float
    derivation: {source: COLLECTED.VSSTRESN}

  - name: TRTSDT
    type: date
    derivation: {source: SPINE.TRTSDT}

  - name: HEIGHTBL
    type: float
    derivation:
      baseline_value:
        group_by: [STUDYID, USUBJID]
        value: AVAL
        flag: HGTBLFL

  - name: HGTDT
    type: date
    output: false
    derivation:
      case:
        branches:
          - when: "PARAMCD = 'HEIGHT' AND AVAL IS NOT NULL"
            then: {source: ADT}

  - name: HGTBLFL
    type: str
    output: false
    derivation:
      baseline_flag:
        group_by: [STUDYID, USUBJID]
        date: HGTDT
        reference_date: TRTSDT

verifications:
  - unique:
      columns: [STUDYID, USUBJID, ASEQ]
  - row_count:
      min: 9
      max: 9
  - all_or_none:
      id: collected-record-carries-sequence-and-value
      columns: [VSSEQ, AVAL]
  - implies:
      id: height-record-supplies-subject-height
      when: "PARAMCD = 'HEIGHT' AND HGTBLFL = 'Y'"
      then: "AVAL = HEIGHTBL"
