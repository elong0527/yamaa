schema_version: "1.0"
domain: DM
datasets:
  ODM: odm.csv
base: ODM
keys: [STUDYID, USUBJID]

output:
  columns: [STUDYID, USUBJID, RFSTDTC, RANDDT, RANDDTTM]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: ODM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: ODM.USUBJID

  - name: RFSTDTC
    type: date
    label: Subject Reference Start Date
    derivation:
      source: ODM.RFSTDTC

  - name: RANDDT
    type: date
    label: Date of Randomization
    derivation:
      source: ODM.RANDDT

  - name: RANDDTTM
    type: datetime
    label: Date and Time of Randomization
    derivation:
      source: ODM.RANDDTTM
