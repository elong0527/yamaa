schema_version: "1.0"
domain: DM
input:
  ODM: odm.csv
keys: [STUDYID, USUBJID]

output:
  path: dm.parquet
  columns: [STUDYID, USUBJID, RFSTDTC, RANDDT, RANDDTTM]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: ODM.StudyOID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: ODM.SubjectKey

  - name: RFSTDTC
    type: date
    label: Subject Reference Start Date
    derivation:
      source: ODM.IT.DM.RFSTDTC

  - name: RANDDT
    type: date
    label: Date of Randomization
    derivation:
      source: ODM.Value

  - name: RANDDTTM
    type: datetime
    label: Date and Time of Randomization
    derivation:
      source: ODM.IT.DM.RANDDTTM

rows:
  - id: subject
    filter: "ODM.ItemOID = 'IT.DM.RANDDT'"
    derivations: {}
