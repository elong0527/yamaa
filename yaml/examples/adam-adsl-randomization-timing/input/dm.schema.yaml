schema_version: "1.0"
domain: DM
datasets:
  DM_RAW: dm_raw.csv
base: DM_RAW
keys: [STUDYID, USUBJID]

output:
  columns: [STUDYID, USUBJID, RFSTDTC, RANDDT, RANDDTTM]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: DM_RAW.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: DM_RAW.USUBJID

  - name: RFSTDTC
    type: date
    label: Subject Reference Start Date
    derivation:
      source: DM_RAW.RFSTDTC

  - name: RANDDT
    type: date
    label: Date of Randomization
    derivation:
      source: DM_RAW.RANDDT

  - name: RANDDTTM
    type: datetime
    label: Date and Time of Randomization
    derivation:
      source: DM_RAW.RANDDTTM
