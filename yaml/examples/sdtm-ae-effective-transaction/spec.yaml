schema_version: "1.0"
domain: AE
datasets:
  AE_REC: input/ae_records.csv
  AE_TXN: {path: input/ae_txn.csv, types: {TXNSEQ: int, AUDITDTC: datetime}}
base: AE_REC
keys: [STUDYID, USUBJID, AESEQ]

record_lookups:
  - id: EFFECTIVE
    dataset: AE_TXN
    order_by: [AE_TXN.AUDITDTC, AE_TXN.TXNSEQ]
    keep: last

columns:
  - name: STUDYID
    type: str
    derivation:
      source: AE_REC.STUDYID

  - name: DOMAIN
    type: str
    derivation:
      literal: AE

  - name: USUBJID
    type: str
    derivation:
      source: AE_REC.USUBJID

  - name: AESEQ
    type: int
    derivation:
      source: AE_REC.AESEQ

  - name: AETERM
    type: str
    derivation:
      source: EFFECTIVE.AETERM

  - name: AESEV
    type: str
    derivation:
      source: EFFECTIVE.AESEV

  - name: TXNTYPE
    type: str
    derivation:
      source: EFFECTIVE.TXNTYPE
    verifications:
      allowed_values:
        values: [INSERT, UPDATE, REMOVE]

  - name: AUDITDTC
    type: datetime
    derivation:
      source: EFFECTIVE.AUDITDTC

verifications:
  - unique:
      columns: [STUDYID, USUBJID, AESEQ]
  - row_count:
      min: 4
      max: 4
  - all_or_none:
      id: effective-record-completeness
      columns: [AETERM, AESEV, TXNTYPE, AUDITDTC]
