schema_version: "1.0"
domain: AE
datasets:
  AE_REC: input/ae_records.csv
  AE_TXN: input/ae_txn.csv
base: AE_REC
keys: [STUDYID, USUBJID, AESEQ]

columns:
  - name: STUDYID
    type: str
    derivation:
      source: AE_REC.STUDYID

  - name: DOMAIN
    type: str
    derivation:
      literal: AE

  - name: USUBJID
    type: str
    derivation:
      source: AE_REC.USUBJID

  - name: AESEQ
    type: int
    derivation:
      source: AE_REC.AESEQ

  - name: AETERM
    type: str
    derivation:
      source:
        variable: AE_TXN.AETERM
        multiple_matches:
          order_by: [AE_TXN.AUDITDTC, AE_TXN.TXNSEQ]
          keep: last

  - name: AESEV
    type: str
    derivation:
      source:
        variable: AE_TXN.AESEV
        multiple_matches:
          order_by: [AE_TXN.AUDITDTC, AE_TXN.TXNSEQ]
          keep: last

  - name: TXNTYPE
    type: str
    derivation:
      source:
        variable: AE_TXN.TXNTYPE
        multiple_matches:
          order_by: [AE_TXN.AUDITDTC, AE_TXN.TXNSEQ]
          keep: last
    verifications:
      allowed_values:
        values: [INSERT, UPDATE, REMOVE]

  - name: AUDITDTC
    type: datetime
    derivation:
      source:
        variable: AE_TXN.AUDITDTC
        multiple_matches:
          order_by: [AE_TXN.AUDITDTC, AE_TXN.TXNSEQ]
          keep: last

verifications:
  - unique:
      columns: [STUDYID, USUBJID, AESEQ]
  - row_count:
      min: 4
      max: 4
  - all_or_none:
      id: effective-record-completeness
      columns: [AETERM, AESEV, TXNTYPE, AUDITDTC]
