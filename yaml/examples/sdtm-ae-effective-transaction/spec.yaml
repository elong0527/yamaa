schema_version: "1.0.0-rc.1"
domain: AE
datasets:
  AE_REC: input/ae_records.csv
  AE_TXN: {path: input/ae_txn.csv, types: {TXNSEQ: int, AUDITDTC: datetime}}
base: AE_REC
keys: [STUDYID, USUBJID, AESEQ]

record_lookups:
  - id: EFFECTIVE
    dataset: AE_TXN
    order_by: [AE_TXN.AUDITDTC, AE_TXN.TXNSEQ]
    keep: last

output:
  path: ae.csv
  columns: [STUDYID, DOMAIN, USUBJID, AESEQ, AETERM, AESEV, TXNTYPE, AUDITDTC]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier

  - name: DOMAIN
    type: str
    label: Domain Abbreviation

  - name: USUBJID
    type: str
    label: Unique Subject Identifier

  - name: AESEQ
    type: int
    label: Sequence Number

  - name: AETERM
    type: str
    label: Reported Term for the Adverse Event

  - name: AESEV
    type: str
    label: Severity/Intensity

  - name: TXNTYPE
    type: str
    label: Transaction Type
    verifications:
      allowed_values:
        values: [INSERT, UPDATE]

  - name: AUDITDTC
    type: datetime
    label: Audit Date/Time

rows:
  - id: effective
    group_by: [AE_REC.STUDYID, AE_REC.USUBJID, AE_REC.AESEQ]
    filter: "TXNTYPE <> 'REMOVE'"
    derivations:
      STUDYID:
        aggregate: "ONLY(AE_REC.STUDYID)"
      DOMAIN: {literal: AE}
      USUBJID: {source: AE_REC.USUBJID}
      AESEQ: {source: AE_REC.AESEQ}
      AETERM: {source: EFFECTIVE.AETERM}
      AESEV: {source: EFFECTIVE.AESEV}
      TXNTYPE: {source: EFFECTIVE.TXNTYPE}
      AUDITDTC: {source: EFFECTIVE.AUDITDTC}

verifications:
  - unique:
      columns: [STUDYID, USUBJID, AESEQ]
  - row_count:
      min: 3
      max: 3
  - all_or_none:
      id: effective-record-completeness
      columns: [AETERM, AESEV, TXNTYPE, AUDITDTC]
