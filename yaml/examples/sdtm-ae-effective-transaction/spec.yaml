schema_version: "1.0"
domain: AE
datasets:
  AE_REC: input/ae_records.csv
  AE_TXN: {path: input/ae_txn.csv, types: {TXNSEQ: int, AUDITDTC: datetime}}

derived:
  - id: AE_EFFECTIVE
    base: AE_REC
    record_lookups:
      - id: EFFECTIVE
        dataset: AE_TXN
        order_by: [AE_TXN.AUDITDTC, AE_TXN.TXNSEQ]
        keep: last
    keys: [STUDYID, USUBJID, AESEQ]
    columns:
      - name: STUDYID
        type: str
        derivation: {source: AE_REC.STUDYID}
      - name: USUBJID
        type: str
        derivation: {source: AE_REC.USUBJID}
      - name: AESEQ
        type: int
        derivation: {source: AE_REC.AESEQ}
      - name: AETERM
        type: str
        derivation: {source: EFFECTIVE.AETERM}
      - name: AESEV
        type: str
        derivation: {source: EFFECTIVE.AESEV}
      - name: TXNTYPE
        type: str
        derivation: {source: EFFECTIVE.TXNTYPE}
      - name: AUDITDTC
        type: datetime
        derivation: {source: EFFECTIVE.AUDITDTC}

base: AE_EFFECTIVE
keys: [STUDYID, USUBJID, AESEQ]

columns:
  - name: STUDYID
    type: str
    derivation:
      source: AE_EFFECTIVE.STUDYID

  - name: DOMAIN
    type: str
    derivation:
      literal: AE

  - name: USUBJID
    type: str
    derivation:
      source: AE_EFFECTIVE.USUBJID

  - name: AESEQ
    type: int
    derivation:
      source: AE_EFFECTIVE.AESEQ

  - name: AETERM
    type: str
    derivation:
      source: AE_EFFECTIVE.AETERM

  - name: AESEV
    type: str
    derivation:
      source: AE_EFFECTIVE.AESEV

  - name: TXNTYPE
    type: str
    derivation:
      source: AE_EFFECTIVE.TXNTYPE
    verifications:
      allowed_values:
        values: [INSERT, UPDATE, REMOVE]

  - name: AUDITDTC
    type: datetime
    derivation:
      source: AE_EFFECTIVE.AUDITDTC

rows:
  - id: active
    filter: "AE_EFFECTIVE.TXNTYPE <> 'REMOVE'"
    derivations: {}

verifications:
  - unique:
      columns: [STUDYID, USUBJID, AESEQ]
  - row_count:
      min: 3
      max: 3
  - all_or_none:
      id: effective-record-completeness
      columns: [AETERM, AESEV, TXNTYPE, AUDITDTC]
