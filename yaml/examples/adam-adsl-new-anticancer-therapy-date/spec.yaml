schema_version: "1.0"
domain: ADSL
datasets:
  ADSL_RAW: input/adsl.csv
  CM: input/cm.csv
  PR: input/pr.csv
base: ADSL_RAW
keys: [STUDYID, USUBJID]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: ADSL_RAW.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: ADSL_RAW.USUBJID

  - name: TRTSDT
    type: date
    label: Date of First Exposure to Treatment
    derivation:
      source: ADSL_RAW.TRTSDT
    verifications:
      not_missing: {}

  - name: NACTDT
    type: date
    label: New Anti-Cancer Therapy Start Date
    derivation:
      least:
        sources: [CMNACTDT, PRNACTDT]

  - name: NACTDY
    type: int
    label: New Anti-Cancer Therapy Start Relative Day
    derivation:
      study_day:
        date: NACTDT
        reference: TRTSDT

  - name: NACTFL
    type: str
    label: New Anti-Cancer Therapy Flag
    derivation:
      case:
        branches:
          - when: "NACTDT IS NOT NULL"
            then:
              literal: Y
    verifications:
      allowed_values:
        values: [Y]

  - name: CMNACTDT
    type: date
    label: First New Anti-Cancer Medication Date
    output: false
    derivation:
      aggregate:
        filter: "CM.CMCAT = 'ON TREATMENT' AND CM.CMSTDTC IS NOT NULL"
        expr: "MIN(CM.CMSTDTC)"

  - name: PRNACTDT
    type: date
    label: First New Anti-Cancer Procedure Date
    output: false
    derivation:
      aggregate:
        filter: "PR.PRCAT = 'CANCER RELATED' AND PR.PRSCAT = 'ON TREATMENT' AND PR.PRSTDTC IS NOT NULL"
        expr: "MIN(PR.PRSTDTC)"

verifications:
  - unique:
      columns: [STUDYID, USUBJID]
  - row_count:
      min: 5
      max: 5
  - all_or_none:
      id: therapy-date-day-and-flag-agree
      columns: [NACTDT, NACTDY, NACTFL]
  - implies:
      id: new-therapy-starts-on-or-after-treatment-start
      when: "NACTFL = 'Y'"
      then: "NACTDT >= TRTSDT"
