schema_version: "1.0"
domain: ADSL
datasets:
  DM: input/dm.csv
base: DM
keys: [STUDYID, USUBJID, SITEID]

output:
  profile: csv-v1
  columns: [STUDYID, USUBJID, INVID]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: DM.USUBJID

  - name: SITEID
    type: str
    label: Study Site Identifier
    derivation:
      source: DM.SITEID

  - name: INVID
    type: str
    label: Investigator Identifier
    derivation:
      source: DM.INVID
