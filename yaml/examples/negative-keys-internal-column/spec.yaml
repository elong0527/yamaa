schema_version: "1.0"
domain: ADSL
datasets:
  DM: input/dm.csv
base: DM
keys: [STUDYID, USUBJID, SITEID]

output:
  columns: [STUDYID, USUBJID, INVID]

columns:
  - name: STUDYID
    type: str
    derivation:
      source: DM.STUDYID

  - name: USUBJID
    type: str
    derivation:
      source: DM.USUBJID

  - name: SITEID
    type: str
    output: false
    derivation:
      source: DM.SITEID

  - name: INVID
    type: str
    derivation:
      source: DM.INVID
