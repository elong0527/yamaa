schema_version: "1.0"
domain: ADSL
datasets:
  SOURCE: input/adsl.csv
base: SOURCE
keys: [STUDYID, USUBJID]

output:
  columns: [STUDYID, USUBJID, HEIGHTCM, WEIGHTKG, BMI]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: SOURCE.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: SOURCE.USUBJID

  - name: HEIGHTCM
    type: float
    label: Height (cm)
    derivation:
      source: SOURCE.HEIGHTCM

  - name: WEIGHTKG
    type: float
    label: Weight (kg)
    derivation:
      source: SOURCE.WEIGHTKG

  - name: BMI
    type: float
    label: Body Mass Index (kg/m2)
    derivation:
      function:
        name: bmi
        contract_version: "1.0.0"
        args:
          weight_kg: WEIGHTKG
          height_cm: HEIGHTCM
          cm_per_m: 100
