schema_version: "1.0"
domain: DM
datasets:
  ODM: input/odm.csv
base: ODM
keys: [STUDYID, USUBJID]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: ODM.StudyOID

  - name: DOMAIN
    type: str
    label: Domain Abbreviation
    derivation:
      literal: DM

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: ODM.SubjectKey

  - name: SUBJID
    type: str
    label: Subject Identifier for the Study
    derivation:
      source: ODM.SubjectKey

  - name: SEX
    type: str
    label: Sex
    derivation:
      mapping:
        source: ODM.Value
        dict:
          Male: M
          Female: F
        missing: U
        unmapped: U

  - name: AGE
    type: int
    label: Age
    derivation:
      source:
        variable: ODM.IT.DM.AGE
        missing: null

  - name: ARM
    type: str
    label: Description of Planned Arm
    derivation:
      source:
        variable: ODM.IT.DM.ARM
        missing: Unassigned

  - name: ACTARM
    type: str
    label: Description of Actual Arm
    derivation:
      source: ARM

rows:
  - id: subject
    filter: "ODM.ItemOID = 'IT.DM.SEX'"
    derivations: {}
