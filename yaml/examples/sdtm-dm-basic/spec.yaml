schema_version: "1.0"
domain: DM
keys: [STUDYID, USUBJID]

input:
  ODM: input/odm.csv

output:
  path: dm.csv
  columns: [DOMAIN, STUDYID, USUBJID, SUBJID, SEX, AGE, ARM, ACTARM]

columns:
  - name: DOMAIN
    type: str
    label: Domain Abbreviation
    derivation:
      literal: DM

  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: ODM.StudyOID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: ODM.SubjectKey

  - name: SUBJID
    type: str
    label: Subject Identifier for the Study
    derivation:
      source: USUBJID

  - name: SEX
    type: str
    label: Sex
    derivation:
      mapping:
        source:
          filter: ODM.ItemOID = 'IT.DM.SEX'
          variable: ODM.Value
        dict:
          Male: M
          Female: F
        missing: U
        unmapped: U

  - name: AGE
    type: int
    label: Age
    derivation:
      source:
        filter: ODM.ItemOID = 'IT.DM.AGE'
        variable: ODM.Value

  - name: ARM
    type: str
    label: Description of Planned Arm
    derivation:
      coalesce:
        sources:
          - filter: ODM.ItemOID = 'IT.DM.ARM'
            variable: ODM.Value
        default: Unassigned

  - name: ACTARM
    type: str
    label: Description of Actual Arm
    derivation:
      source: ARM
