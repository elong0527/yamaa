schema_version: "1.0"
domain: ADAE
datasets:
  AE: input/ae.csv
  ADSL: input/adsl.csv
base: AE
keys: [STUDYID, USUBJID, AESEQ]

output:
  profile: csv-v1
  columns: [STUDYID, USUBJID, AESEQ, ASTDT, TRTSDT, TRTEDT, TRTA, TRTEMFL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: AE.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: AE.USUBJID

  - name: AESEQ
    type: int
    label: Sequence Number
    derivation:
      source: AE.AESEQ

  - name: ASTDT
    type: date
    label: Analysis Start Date
    derivation:
      source: AE.AESTDTC
    verifications:
      not_missing: {}

  - name: TRTSDT
    type: date
    label: Date of First Exposure to Treatment
    derivation:
      source: ADSL.TRTSDT

  - name: TRTEDT
    type: date
    label: Date of Last Exposure to Treatment
    derivation:
      source: ADSL.TRTEDT

  - name: TRTA
    type: str
    label: Actual Treatment
    derivation:
      source: ADSL.TRT01A

  - name: TRTEMFL
    type: str
    label: Treatment Emergent Analysis Flag
    derivation:
      case:
        branches:
          - when: "ASTDT IS NOT NULL AND TRTSDT IS NOT NULL AND TRTEDT IS NOT NULL AND ASTDT >= TRTSDT AND ASTDT <= TRTEDT"
            then:
              literal: Y
    verifications:
      allowed_values:
        values: [Y]

verifications:
  - unique:
      columns: [STUDYID, USUBJID, AESEQ]
  - row_count:
      min: 6
      max: 6
  - all_or_none:
      id: treatment-period-completeness
      columns: [TRTSDT, TRTEDT]
  - implies:
      id: treatment-emergent-event-is-within-treatment
      when: "TRTEMFL = 'Y'"
      then: "ASTDT >= TRTSDT AND ASTDT <= TRTEDT"
