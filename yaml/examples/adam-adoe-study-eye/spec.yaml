schema_version: "1.0"
domain: ADOE
datasets:
  OE: input/oe.csv
  ADSL: input/adsl.csv
base: OE
keys: [STUDYID, USUBJID, OESEQ]

columns:
  - name: STUDYID
    type: str
    derivation:
      source: OE.STUDYID

  - name: USUBJID
    type: str
    derivation:
      source: OE.USUBJID

  - name: OESEQ
    type: int
    derivation:
      source: OE.OESEQ

  - name: PARAMCD
    type: str
    derivation:
      source: OE.OETESTCD

  - name: OELAT
    type: str
    derivation:
      source: OE.OELAT
    verifications:
      allowed_values:
        values: [LEFT, RIGHT]

  - name: AVAL
    type: float
    derivation:
      source: OE.OESTRESN

  - name: STUDYEYE
    type: str
    output: false
    derivation:
      source: ADSL.STUDYEYE

  - name: AFEYE
    type: str
    derivation:
      case:
        branches:
          - when: "OELAT = STUDYEYE"
            then:
              literal: STUDY EYE
          - when: "STUDYEYE IS NOT NULL"
            then:
              literal: FELLOW EYE
    verifications:
      allowed_values:
        values: [STUDY EYE, FELLOW EYE]

verifications:
  - unique:
      columns: [STUDYID, USUBJID, OESEQ]
  - row_count:
      min: 6
      max: 6
  - implies:
      id: study-eye-record-carries-the-study-laterality
      when: "AFEYE = 'STUDY EYE'"
      then: "OELAT = STUDYEYE"
