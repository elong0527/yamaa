schema_version: "1.0"
domain: ADSL
datasets:
  DM: input/dm.csv
base: DM
keys: [STUDYID, USUBJID]

columns:
  - name: STUDYID
    type: str
    derivation:
      source: DM.STUDYID

  - name: USUBJID
    type: str
    derivation:
      source: DM.USUBJID

  - name: SMOKEFL
    type: str
    derivation:
      mapping:
        source: DM.SMOKSTAT
        case_sensitive: false
        dict:
          Y: "Y"
          y: "Y"
          N: "N"
