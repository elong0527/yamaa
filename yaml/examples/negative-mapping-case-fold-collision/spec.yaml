schema_version: "1.0"
domain: ADSL
datasets:
  DM: input/dm.csv
base: DM
keys: [STUDYID, USUBJID]

output:
  profile: csv-v1
  columns: [STUDYID, USUBJID, SMOKEFL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: DM.USUBJID

  - name: SMOKEFL
    type: str
    label: Smoker Flag
    derivation:
      mapping:
        source: DM.SMOKSTAT
        case_sensitive: false
        dict:
          Y: "Y"
          y: "Y"
          N: "N"
