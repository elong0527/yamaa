schema_version: "1.0"
domain: ADLB
datasets:
  LB: input/lb.csv
  LBREF:
    path: input/lbref
base: LB
keys: [STUDYID, USUBJID, PARAMCD]

output:
  columns: [STUDYID, USUBJID, PARAMCD, SEX, AVAL, ANRHI]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: LB.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: LB.USUBJID

  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation:
      source: LB.LBTESTCD

  - name: SEX
    type: str
    label: Sex
    derivation:
      source: LB.SEX

  - name: AVAL
    type: float
    label: Analysis Value
    derivation:
      source: LB.LBSTRESN

  - name: ANRHI
    type: float
    label: Analysis Normal Range Upper Limit
    derivation:
      mapping_from:
        source: [PARAMCD, SEX]
        dataset: LBREF
        key: [LBTESTCD, SEX]
        value: ANRHI
