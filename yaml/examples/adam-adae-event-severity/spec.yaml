schema_version: "1.0"
domain: ADAE
datasets:
  AE: input/ae.csv
  SUPP: input/supp.csv
base: AE
keys: [STUDYID, USUBJID, AESEQ]

output:
  path: adae.csv
  columns: [STUDYID, USUBJID, AESEQ, AEDECOD, AESEV]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: AE.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: AE.USUBJID

  - name: AESEQ
    type: int
    label: Sequence Number
    derivation:
      source: AE.AESEQ

  - name: AEDECOD
    type: str
    label: Dictionary-Derived Term
    derivation:
      source: AE.AEDECOD

  - name: AESEV
    type: str
    label: Severity
    derivation:
      source: SUPP.AESEV
