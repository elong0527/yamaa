schema_version: "1.0"
domain: ADAE
datasets:
  AE: {path: input/ae.csv, types: {AESEQ: int}}
  SUPP: {path: input/supp.csv, types: {AESEQ: int}}
base: AE
keys: [STUDYID, USUBJID, AESEQ]

output:
  path: adae.csv
  columns: [STUDYID, USUBJID, AESEQ, AEDECOD, AESEV]

rows:
  - id: record
    dataset: AE
    derivations:
      STUDYID: {source: AE.STUDYID}
      USUBJID: {source: AE.USUBJID}
      AESEQ: {source: AE.AESEQ}

columns:
  - name: STUDYID
    type: str
    label: Study Identifier

  - name: USUBJID
    type: str
    label: Unique Subject Identifier

  - name: AESEQ
    type: int
    label: Sequence Number

  - name: AEDECOD
    type: str
    label: Dictionary-Derived Term
    derivation:
      source: AE.AEDECOD

  - name: AESEV
    type: str
    label: Severity
    derivation:
      source: SUPP.AESEV
