schema_version: "1.0"
domain: ADEX
datasets:
  EX:
    path: input/ex.csv
    types: {EXSEQ: int, EXDOSE: float, EXDOSCNT: int}

base: EX
expand:
  count: EX.EXDOSCNT
  as: ADOSEN
keys: [STUDYID, USUBJID, EXSEQ, ADOSEN]

columns:
  - name: STUDYID
    type: str
    derivation: {source: EX.STUDYID}

  - name: USUBJID
    type: str
    derivation: {source: EX.USUBJID}

  - name: EXSEQ
    type: int
    derivation: {source: EX.EXSEQ}

  - name: EXTRT
    type: str
    derivation: {source: EX.EXTRT}

  - name: EXDOSE
    type: float
    derivation: {source: EX.EXDOSE}

  - name: EXDOSU
    type: str
    derivation: {source: EX.EXDOSU}

  - name: ASTDT
    type: date
    derivation: {source: EX.EXSTDTC}

  - name: AENDT
    type: date
    derivation: {source: EX.EXENDTC}

  - name: ADOSEN
    type: int

  - name: NDOSE
    type: int
    derivation: {source: EX.EXDOSCNT}

verifications:
  - unique:
      columns: [STUDYID, USUBJID, EXSEQ, ADOSEN]
  - row_count:
      min: 8
      max: 8
