schema_version: "1.0"
domain: ADEX
datasets:
  TRT: input/subject_treatment.csv
  EX: input/ex.csv
base: TRT
keys: [STUDYID, USUBJID, EXTRT]

columns:
  - name: STUDYID
    type: str
    derivation:
      source: TRT.STUDYID

  - name: USUBJID
    type: str
    derivation:
      source: TRT.USUBJID

  - name: EXTRT
    type: str
    derivation:
      source: TRT.EXTRT

  - name: DOSECUM
    type: float
    derivation:
      sum:
        source: EX.EXDOSE

  - name: NDOSREC
    type: int
    derivation:
      count:
        source: EX.EXSEQ

  - name: NDOSVAL
    type: int
    derivation:
      count:
        source: EX.EXDOSE

verifications:
  - row_count:
      min: 3
      max: 3
  - implies:
      id: recorded-dose-implies-a-record
      when: "NDOSVAL > 0"
      then: "NDOSREC >= NDOSVAL"
