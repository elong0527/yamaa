schema_version: "1.0"
domain: ADEX
datasets:
  TRT: input/subject_treatment.csv
  EX: {path: input/ex.csv, types: {EXDOSE: float}}
base: TRT
keys: [STUDYID, USUBJID, EXTRT]

columns:
  - name: STUDYID
    type: str
    derivation:
      source: TRT.STUDYID

  - name: USUBJID
    type: str
    derivation:
      source: TRT.USUBJID

  - name: EXTRT
    type: str
    derivation:
      source: TRT.EXTRT

  - name: DOSECUM
    type: float
    derivation:
      aggregate: "SUM(EX.EXDOSE)"

  - name: NDOSREC
    type: int
    derivation:
      aggregate: "COUNT(EX.EXSEQ)"

  - name: NDOSVAL
    type: int
    derivation:
      aggregate: "COUNT(EX.EXDOSE)"

verifications:
  - row_count:
      min: 3
      max: 3
  - implies:
      id: recorded-dose-implies-a-record
      when: "NDOSVAL > 0"
      then: "NDOSREC >= NDOSVAL"
