schema_version: "1.0"
domain: ADSL
datasets:
  DM: input/dm.csv
  CM: {path: input/cm.csv, types: {CMSEQ: int}}
base: DM
keys: [STUDYID, USUBJID]

columns:
  - name: STUDYID
    type: str
    derivation:
      source: DM.STUDYID

  - name: USUBJID
    type: str
    derivation:
      source: DM.USUBJID

  - name: RESCTRT
    type: str
    derivation:
      source:
        variable: CM.CMTRT
        multiple_matches:
          order_by: [CM.CMSTDTC, CM.CMSEQ]
          keep: first
          filter: "CM.CMCAT = 'RESCUE MEDICATION'"

verifications:
  - row_count:
      min: 2
      max: 2
