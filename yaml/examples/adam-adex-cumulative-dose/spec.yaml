schema_version: "1.0.0-rc.1"
domain: ADEX
datasets:
  TRT: input/subject_treatment.csv
  EX: {path: input/ex.csv, types: {EXDOSE: float}}
base: TRT
keys: [STUDYID, USUBJID, EXTRT]

output:
  path: adex.csv
  columns: [STUDYID, USUBJID, EXTRT, EXDOSU, DOSECUM, NCYCLES, RDI]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: TRT.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: TRT.USUBJID

  - name: EXTRT
    type: str
    label: Name of Treatment
    derivation:
      source: TRT.EXTRT

  - name: EXDOSU
    type: str
    label: Dose Units
    derivation:
      source: TRT.EXDOSU

  - name: DOSECUM
    type: float
    label: Cumulative Dose
    derivation:
      aggregate: "SUM(EX.EXDOSE)"

  - name: NCYCLES
    type: int
    label: Number of Treatment Cycles
    derivation:
      aggregate: "COUNT(EX.EXSEQ)"

  - name: PLANDOSE
    type: float
    label: Planned Dose per Cycle
    derivation:
      source: TRT.PLANDOSE

  - name: PLANCYC
    type: int
    label: Planned Number of Cycles
    derivation:
      source: TRT.PLANCYC

  - name: RDI
    type: float
    label: Relative Dose Intensity
    derivation:
      compute:
        expr: "100 * DOSECUM / NULLIF(PLANDOSE * PLANCYC, 0)"

verifications:
  - row_count:
      min: 3
      max: 3
