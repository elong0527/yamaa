schema_version: "1.0"
domain: ADVS
datasets:
  VS: input/vs.csv
base: VS
keys: [STUDYID, USUBJID, VSSEQ]

output:
  columns: [STUDYID, USUBJID, VSSEQ, ADT, AVAL, PREVAL]

columns:
  - name: STUDYID
    type: str
    derivation:
      source: VS.STUDYID

  - name: USUBJID
    type: str
    derivation:
      source: VS.USUBJID

  - name: VSSEQ
    type: int
    derivation:
      source: VS.VSSEQ

  - name: ADT
    type: date
    derivation:
      source: VS.VSDTC

  - name: AVAL
    type: float
    derivation:
      source: VS.VSSTRESN

  - name: PREVAL
    type: float
    derivation:
      row_value:
        source: AVAL
        offset: 0
        group_by: [STUDYID, USUBJID]
        order_by: [ADT, VSSEQ]
