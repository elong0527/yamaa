schema_version: "1.0.0-rc.1"
domain: VS
datasets:
  VS_RAW: input/vs_raw.csv
  DM: input/dm.csv
  TV: input/tv.csv
  TEPOCH:
    path: input/tepoch.csv
    types: {DYLO: int, DYHI: int}
base: VS_RAW
keys: [STUDYID, USUBJID, VSSEQ]

record_lookups:
  - id: PLANNEDVISIT
    dataset: TV
    source: VISIT
    key: VISIT
    unmatched: missing

  - id: EPOCHDEF
    dataset: TEPOCH
    source: STUDYID
    key: STUDYID
    between:
      value: VSDY
      lower: DYLO
      upper: DYHI
    incomplete: missing
    unmatched: fail

output:
  path: vs.csv
  columns: [STUDYID, DOMAIN, USUBJID, VSSEQ, VSTESTCD, VSORRES, VSDTC, VISIT, VISITNUM, EPOCH, VSDY]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: VS_RAW.STUDYID

  - name: DOMAIN
    type: str
    label: Domain Abbreviation
    derivation:
      literal: VS

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: VS_RAW.USUBJID

  - name: VSSEQ
    type: int
    label: Sequence Number
    derivation:
      source: VS_RAW.VSSEQ
    verifications:
      not_missing: {}

  - name: VSTESTCD
    type: str
    label: Vital Signs Test Short Name
    derivation:
      source: VS_RAW.VSTESTCD

  - name: VSORRES
    type: str
    label: Result or Finding in Original Units
    derivation:
      source: VS_RAW.VSORRES

  - name: VSDTC
    type: date
    label: Date/Time of Measurements
    derivation:
      source: VS_RAW.VSDTC

  - name: VISIT
    type: str
    label: Visit Name
    derivation:
      source: VS_RAW.VISIT

  - name: VISITNUM
    type: float
    label: Visit Number
    derivation:
      source: PLANNEDVISIT.VISITNUM

  - name: RFSTDTC
    type: date
    label: Subject Reference Start Date/Time
    derivation:
      source: DM.RFSTDTC

  - name: VSDY
    type: int
    label: Study Day of Vital Signs
    derivation:
      study_day:
        date: VSDTC
        reference: RFSTDTC

  - name: EPOCH
    type: str
    label: Epoch
    derivation:
      source: EPOCHDEF.EPOCH
    verifications:
      allowed_values:
        values: [SCREENING, TREATMENT, FOLLOW-UP]

verifications:
  - unique:
      columns: [STUDYID, USUBJID, VSSEQ]
  - row_count:
      min: 7
      max: 7
  - implies:
      id: study-day-requires-both-dates
      when: "VSDTC IS NOT NULL AND RFSTDTC IS NOT NULL"
      then: "VSDY IS NOT NULL"
  - implies:
      id: study-day-has-no-day-zero
      when: "VSDY IS NOT NULL"
      then: "VSDY <> 0"
  - implies:
      id: reference-start-date-is-study-day-one
      when: "VSDTC IS NOT NULL AND RFSTDTC IS NOT NULL AND VSDTC = RFSTDTC"
      then: "VSDY = 1"
