schema_version: "1.0"
domain: VS
datasets:
  VS_RAW: input/vs_raw.csv
  DM: input/dm.csv
  TV: input/tv.csv
base: VS_RAW
keys: [STUDYID, USUBJID, VSSEQ]

record_lookups:
  - id: PLANNEDVISIT
    dataset: TV
    source: VISIT
    key: VISIT
    unmatched: missing

output:
  columns: [STUDYID, DOMAIN, USUBJID, VSSEQ, VSTESTCD, VSORRES, VSDTC, VISIT, VISITNUM, EPOCH, VSDY]

columns:
  - name: STUDYID
    type: str
    derivation:
      source: VS_RAW.STUDYID

  - name: DOMAIN
    type: str
    derivation:
      literal: VS

  - name: USUBJID
    type: str
    derivation:
      source: VS_RAW.USUBJID

  - name: VSSEQ
    type: int
    derivation:
      source: VS_RAW.VSSEQ
    verifications:
      not_missing: {}

  - name: VSTESTCD
    type: str
    derivation:
      source: VS_RAW.VSTESTCD

  - name: VSORRES
    type: str
    derivation:
      source: VS_RAW.VSORRES

  - name: VSDTC
    type: date
    derivation:
      source: VS_RAW.VSDTC

  - name: VISIT
    type: str
    derivation:
      source: VS_RAW.VISIT

  - name: VISITNUM
    type: float
    derivation:
      source: PLANNEDVISIT.VISITNUM

  - name: EPOCH
    type: str
    derivation:
      source: PLANNEDVISIT.EPOCH
    verifications:
      allowed_values:
        values: [SCREENING, TREATMENT, FOLLOW-UP]

  - name: RFSTDTC
    type: date
    derivation:
      source: DM.RFSTDTC

  - name: VSDY
    type: int
    derivation:
      study_day:
        date: VSDTC
        reference: RFSTDTC

verifications:
  - unique:
      columns: [STUDYID, USUBJID, VSSEQ]
  - row_count:
      min: 7
      max: 7
  - all_or_none:
      id: scheduled-visit-metadata-completeness
      columns: [VISITNUM, EPOCH]
  - implies:
      id: study-day-requires-both-dates
      when: "VSDTC IS NOT NULL AND RFSTDTC IS NOT NULL"
      then: "VSDY IS NOT NULL"
  - implies:
      id: study-day-has-no-day-zero
      when: "VSDY IS NOT NULL"
      then: "VSDY <> 0"
  - implies:
      id: reference-start-date-is-study-day-one
      when: "VSDTC IS NOT NULL AND RFSTDTC IS NOT NULL AND VSDTC = RFSTDTC"
      then: "VSDY = 1"
