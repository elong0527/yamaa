schema_version: "1.0"
domain: ADLB
datasets:
  LB: input/lb.csv
  LBREF: input/lbref.csv
base: LB
keys: [STUDYID, USUBJID, PARAMCD]

columns:
  - name: STUDYID
    type: str
    derivation:
      source: LB.STUDYID

  - name: USUBJID
    type: str
    derivation:
      source: LB.USUBJID

  - name: PARAMCD
    type: str
    derivation:
      source: LB.LBTESTCD

  - name: SEX
    type: str
    derivation:
      source: LB.SEX

  - name: AVAL
    type: float
    derivation:
      source: LB.LBSTRESN

  - name: ANRHI
    type: float
    derivation:
      mapping_from:
        source: [PARAMCD, SEX]
        dataset: LBREF
        key: LBTESTCD
        value: ANRHI
