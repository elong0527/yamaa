schema_version: "1.0"
domain: ADVS
datasets:
  ADVSIN: {path: input/advs.csv, types: {AVAL: float}}
base: ADVSIN
keys: [STUDYID, USUBJID, AVISIT, PARAMCD]

record_lookups:
  - id: BASE_HEIGHT
    dataset: ADVSIN
    filter: "PARAMCD = 'HEIGHT'"
    source: [STUDYID, USUBJID]
    key: [STUDYID, USUBJID]
    unmatched: missing

output:
  columns: [STUDYID, USUBJID, PARAMCD, PARAM, AVAL, AVISIT, DTYPE]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier

  - name: USUBJID
    type: str
    label: Unique Subject Identifier

  - name: PARAMCD
    type: str
    label: Parameter Code

  - name: PARAM
    type: str
    label: Parameter

  - name: BASE_HEIGHT_VAL
    type: float
    label: Baseline Height Value

  - name: SOURCE_PARAMCD
    type: str
    label: Source Parameter Code

  - name: PROVENANCE
    type: str
    label: Row Provenance

  - name: AVAL
    type: float
    label: Analysis Value

  - name: AVISIT
    type: str
    label: Analysis Visit Name

  - name: DTYPE
    type: str
    label: Derivation Type

rows:
  - id: collected
    derivations:
      STUDYID: {source: ADVSIN.STUDYID}
      USUBJID: {source: ADVSIN.USUBJID}
      PARAMCD: {source: ADVSIN.PARAMCD}
      PARAM: {source: ADVSIN.PARAM}
      BASE_HEIGHT_VAL: {literal: null}
      SOURCE_PARAMCD: {source: ADVSIN.PARAMCD}
      PROVENANCE: {literal: COLLECTED}
      AVAL: {source: ADVSIN.AVAL}
      AVISIT: {source: ADVSIN.AVISIT}
      DTYPE: {literal: null}

  - id: derived_bmi
    group_by: [ADVSIN.STUDYID, ADVSIN.USUBJID, ADVSIN.PARAMCD, ADVSIN.AVISIT, ADVSIN.AVAL]
    filter: "SOURCE_PARAMCD = 'WEIGHT' AND AVAL IS NOT NULL"
    derivations:
      STUDYID: {source: ADVSIN.STUDYID}
      USUBJID: {source: ADVSIN.USUBJID}
      PARAMCD: {literal: BMI}
      PARAM: {literal: Body Mass Index (kg/m^2)}
      BASE_HEIGHT_VAL: {source: BASE_HEIGHT.AVAL}
      SOURCE_PARAMCD: {source: ADVSIN.PARAMCD}
      PROVENANCE: {literal: DERIVED}
      AVAL:
        compute:
          expr: "ADVSIN.AVAL / NULLIF((BASE_HEIGHT_VAL / 100) * (BASE_HEIGHT_VAL / 100), 0)"
      AVISIT: {source: ADVSIN.AVISIT}
      DTYPE: {literal: CALCULATION}

verifications:
  - unique:
      columns: [STUDYID, USUBJID, AVISIT, PARAMCD]
  - predicate:
      id: no-pre-existing-target
      assert: "NOT (PARAMCD = 'BMI' AND PROVENANCE = 'COLLECTED')"
  - predicate:
      id: check-height-unit
      assert: "PARAMCD <> 'HEIGHT' OR PARAM = 'Height (cm)'"
  - predicate:
      id: check-weight-unit
      assert: "PARAMCD <> 'WEIGHT' OR PARAM = 'Weight (kg)'"
