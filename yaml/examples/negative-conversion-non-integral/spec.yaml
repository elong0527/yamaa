schema_version: "1.0"
domain: ADVS
datasets:
  VS: input/vs.csv
base: VS
keys: [STUDYID, USUBJID, VSSEQ]

columns:
  - name: STUDYID
    type: str
    derivation:
      source: VS.STUDYID

  - name: USUBJID
    type: str
    derivation:
      source: VS.USUBJID

  - name: VSSEQ
    type: int
    derivation:
      source: VS.VSSEQ

  - name: AVAL
    type: int
    derivation:
      source: VS.VSSTRESN
