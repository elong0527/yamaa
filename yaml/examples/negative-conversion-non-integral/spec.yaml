schema_version: "1.0"
domain: ADVS
datasets:
  VS: {path: input/vs.csv, types: {VSSTRESN: float}}
base: VS
keys: [STUDYID, USUBJID, VSSEQ]

output:
  profile: csv-v1
  columns: [STUDYID, USUBJID, VSSEQ, AVAL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: VS.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: VS.USUBJID

  - name: VSSEQ
    type: int
    label: Sequence Number
    derivation:
      source: VS.VSSEQ

  - name: AVAL
    type: int
    label: Analysis Value
    derivation:
      source: VS.VSSTRESN
