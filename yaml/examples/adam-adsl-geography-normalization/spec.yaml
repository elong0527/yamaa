schema_version: "1.0"
domain: ADSL
datasets:
  DM: input/dm.csv
base: DM
keys: [STUDYID, USUBJID]

output:
  profile: csv
  columns: [STUDYID, USUBJID, COUNTRY, REGION1]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: DM.USUBJID

  - name: COUNTRY
    type: str
    label: Country
    derivation:
      str_upper:
        source: DM.COUNTRY
        missing: UNKNOWN
    verifications:
      allowed_values:
        values: [USA, CAN, DEU, UNKNOWN]

  - name: REGION1
    type: str
    label: Geographic Region 1
    derivation:
      mapping:
        source: COUNTRY
        dict:
          USA: North America
          CAN: North America
          DEU: Europe
        unmapped: Rest of World
    verifications:
      allowed_values:
        values: [North America, Europe, Rest of World]

verifications:
  - unique:
      columns: [STUDYID, USUBJID]
  - row_count:
      min: 4
      max: 4
