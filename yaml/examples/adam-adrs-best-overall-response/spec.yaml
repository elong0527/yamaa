schema_version: "1.0"
domain: ADRS
datasets:
  ADSL: input/adsl.csv
  ADRSSEL:
    path: input/adrs_selection.csv
    types: {BORSEQ: int}
base: ADSL
keys: [STUDYID, USUBJID, PARAMCD]

record_lookups:
  - id: RESPONSE
    dataset: ADRSSEL
    filter: "ADRSSEL.BORSEQ = 1"
    unmatched: missing

output:
  columns: [STUDYID, USUBJID, PARAMCD, PARAM, RANDDT, AVALC, AVAL, ADT]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: ADSL.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: ADSL.USUBJID

  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation:
      literal: BOR

  - name: PARAM
    type: str
    label: Parameter
    derivation:
      literal: Best Overall Response by Investigator

  - name: RANDDT
    type: date
    label: Randomization Date
    derivation:
      source: ADSL.RANDDT
    verifications:
      not_missing: {}

  - name: AVALC
    type: str
    label: Analysis Value (C)
    derivation:
      source: RESPONSE.BORCAT
    verifications:
      allowed_values:
        values: [CR, PR, SD, NON-CR/NON-PD, PD, NE]

  - name: AVAL
    type: int
    label: Analysis Value
    derivation:
      mapping:
        source: AVALC
        dict:
          CR: 1
          PR: 2
          SD: 3
          NON-CR/NON-PD: 4
          PD: 5
          NE: 6
        missing: null
    verifications:
      range:
        min: 1
        max: 6

  - name: ADT
    type: date
    label: Analysis Date
    derivation:
      source: RESPONSE.ADT

verifications:
  - unique:
      columns: [STUDYID, USUBJID, PARAMCD]
  - row_count:
      min: 6
      max: 6
  - all_or_none:
      id: best-response-value-rank-and-date-agree
      columns: [AVALC, AVAL, ADT]
  - implies:
      id: best-response-is-not-before-randomization
      when: "ADT IS NOT NULL"
      then: "ADT >= RANDDT"
