schema_version: "1.0"
domain: ADRS
datasets:
  ADSL: input/adsl.csv
  ADRSPRE: input/adrs_pre.csv
base: ADSL
keys: [STUDYID, USUBJID, PARAMCD]

record_lookups:
  - id: RESPONSE
    dataset: ADRSPRE
    as: WHICH
    candidates:
      - id: CR
        filter: "ADRSPRE.AVALC = 'CR'"
        order_by: [ADRSPRE.ADT, ADRSPRE.ASEQ]
        keep: first
      - id: PR
        filter: "ADRSPRE.AVALC = 'PR'"
        order_by: [ADRSPRE.ADT, ADRSPRE.ASEQ]
        keep: first
      - id: SD
        filter: "ADRSPRE.AVALC = 'SD' AND ADRSPRE.RANDDY >= 42"
        order_by: [ADRSPRE.ADT, ADRSPRE.ASEQ]
        keep: first
      - id: NON-CR/NON-PD
        filter: "ADRSPRE.AVALC = 'NON-CR/NON-PD' AND ADRSPRE.RANDDY >= 42"
        order_by: [ADRSPRE.ADT, ADRSPRE.ASEQ]
        keep: first
      - id: PD
        filter: "ADRSPRE.AVALC = 'PD'"
        order_by: [ADRSPRE.ADT, ADRSPRE.ASEQ]
        keep: first
      - id: NE
        filter: "ADRSPRE.AVALC IN ('CR', 'PR', 'SD', 'NON-CR/NON-PD', 'NE')"
        order_by: [ADRSPRE.ADT, ADRSPRE.ASEQ]
        keep: first
    unmatched: missing

columns:
  - name: STUDYID
    type: str
    derivation:
      source: ADSL.STUDYID

  - name: USUBJID
    type: str
    derivation:
      source: ADSL.USUBJID

  - name: PARAMCD
    type: str
    derivation:
      literal: BOR

  - name: PARAM
    type: str
    derivation:
      literal: Best Overall Response by Investigator

  - name: RANDDT
    type: date
    derivation:
      source: ADSL.RANDDT
    verifications:
      not_missing: {}

  - name: AVALC
    type: str
    derivation:
      source: RESPONSE.WHICH
    verifications:
      allowed_values:
        values: [CR, PR, SD, NON-CR/NON-PD, PD, NE]

  - name: AVAL
    type: int
    derivation:
      mapping:
        source: AVALC
        dict:
          CR: 1
          PR: 2
          SD: 3
          NON-CR/NON-PD: 4
          PD: 5
          NE: 6
        missing: null
    verifications:
      range:
        min: 1
        max: 6

  - name: ADT
    type: date
    derivation:
      source: RESPONSE.ADT

verifications:
  - unique:
      columns: [STUDYID, USUBJID, PARAMCD]
  - row_count:
      min: 6
      max: 6
  - all_or_none:
      id: best-response-value-rank-and-date-agree
      columns: [AVALC, AVAL, ADT]
  - implies:
      id: best-response-is-not-before-randomization
      when: "ADT IS NOT NULL"
      then: "ADT >= RANDDT"
