schema_version: "1.0"
domain: ADSL
datasets:
  DM: input/dm.csv
base: DM
keys: [STUDYID, USUBJID]

output:
  columns: [STUDYID, USUBJID, DTHDT, LSTVSDY, LSTALVDT]

columns:
  - name: STUDYID
    type: str
    derivation:
      source: DM.STUDYID

  - name: USUBJID
    type: str
    derivation:
      source: DM.USUBJID

  - name: DTHDT
    type: date
    derivation:
      source: DM.DTHDTC

  - name: LSTVSDY
    type: int
    derivation:
      source: DM.LSTVSDY

  - name: LSTALVDT
    type: date
    derivation:
      greatest:
        sources: [DTHDT, LSTVSDY]
