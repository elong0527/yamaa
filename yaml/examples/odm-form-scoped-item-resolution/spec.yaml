schema_version: "1.0.0-rc.1"
domain: LB
datasets:
  ODM: input/odm.csv
base: ODM
keys: [STUDYID, USUBJID, LBSEQ]

output:
  path: lb.csv
  columns: [STUDYID, DOMAIN, USUBJID, LBSEQ, LBTESTCD, LBTEST, LBCAT, LBORRES, LBDTC]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: ODM.StudyOID

  - name: DOMAIN
    type: str
    label: Domain Abbreviation
    derivation:
      literal: LB

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: ODM.SubjectKey

  - name: LBTESTCD
    type: str
    label: Lab Test or Examination Short Name
    derivation:
      mapping:
        source: ODM.FormOID
        dict:
          FO.LB_CHEM: ALT
          FO.LB_HEM: HGB
          FO.LB_THY: TSH
          FO.LB_UA: URPROT
          FO.LB_EXTRA: OTHER

  - name: LBTEST
    type: str
    label: Lab Test or Examination Name
    derivation:
      mapping:
        source: ODM.FormOID
        dict:
          FO.LB_CHEM: Alanine Aminotransferase
          FO.LB_HEM: Hemoglobin
          FO.LB_THY: Thyrotropin
          FO.LB_UA: Urine Protein
          FO.LB_EXTRA: Other Laboratory Test

  - name: LBCAT
    type: str
    label: Category for Lab Test
    derivation:
      mapping:
        source: ODM.FormOID
        dict:
          FO.LB_CHEM: CHEMISTRY
          FO.LB_HEM: HEMATOLOGY
          FO.LB_THY: THYROID
          FO.LB_UA: URINALYSIS
          FO.LB_EXTRA: OTHER

  - name: LBORRES
    type: str
    label: Result or Finding in Original Units
    derivation:
      source: ODM.Value

  - name: LBDTC
    type: date
    label: Date/Time of Specimen Collection
    derivation:
      source:
        variable: ODM.IT.LB.LBDTC
        missing: null

  - name: FORMORD
    type: int
    label: Form Order
    derivation:
      mapping:
        source: ODM.FormOID
        dict:
          FO.LB_CHEM: 1
          FO.LB_HEM: 2
          FO.LB_THY: 3
          FO.LB_UA: 4
          FO.LB_EXTRA: 5

  - name: LBSEQ
    type: int
    label: Sequence Number
    derivation:
      row_number:
        group_by: [STUDYID, USUBJID]
        order_by: [FORMORD]

rows:
  - id: reported-result
    filter: "ODM.ItemOID = 'IT.LB.RESULT' AND ODM.Value IS NOT NULL"
    derivations: {}

verifications:
  - row_count:
      min: 5
      max: 5
