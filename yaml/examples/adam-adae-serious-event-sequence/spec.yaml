schema_version: "1.0"
domain: ADAE
datasets:
  AE: input/ae.csv
base: AE
keys: [STUDYID, USUBJID, AESEQ]

output:
  profile: csv
  columns: [STUDYID, USUBJID, AESEQ, AESER, ASTDT, SERSEQ]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: AE.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: AE.USUBJID

  - name: AESEQ
    type: int
    label: Sequence Number
    derivation:
      source: AE.AESEQ

  - name: AESER
    type: str
    label: Serious Event
    derivation:
      source: AE.AESER
    verifications:
      - allowed_values:
          values: ["Y", "N"]

  - name: ASTDT
    type: date
    label: Analysis Start Date
    derivation:
      source: AE.AESTDTC

  - name: SERSEQ
    type: int
    label: Serious Event Sequence Number
    derivation:
      row_number:
        group_by: [STUDYID, USUBJID]
        order_by: [ASTDT, AESEQ]
        filter: "AESER = 'Y'"
