schema_version: "1.0"
domain: ADAE
datasets:
  AE: input/ae.csv
  DM: input/dm.csv
base: AE
keys: [STUDYID, USUBJID, AESEQ]

record_lookups:
  - id: DEATHEV
    dataset: AE
    source: [STUDYID, USUBJID]
    key: [STUDYID, USUBJID]
    filter: "AE.AEOUT = 'FATAL'"
    unmatched: missing

output:
  columns: [STUDYID, USUBJID, AESEQ, AEDECOD, ASTDT, DTHFL, DTHCAUS, DTHDT]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: AE.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: AE.USUBJID

  - name: AESEQ
    type: int
    label: Sequence Number
    derivation:
      source: AE.AESEQ

  - name: AEDECOD
    type: str
    label: Dictionary-Derived Term
    derivation:
      source: AE.AEDECOD

  - name: ASTDT
    type: date
    label: Analysis Start Date
    derivation:
      source: AE.ASTDT

  - name: EVDTHDT
    type: date
    label: Death Date from Fatal Event
    derivation:
      source: DEATHEV.ASTDT

  - name: DMDTHDT
    type: date
    label: Death Date from Demographics
    derivation:
      source: DM.DTHDT

  - name: FATALFL
    type: str
    label: Fatal Event Flag
    derivation:
      case:
        branches:
          - when: "AE.AEOUT = 'FATAL'"
            then:
              literal: Y

  - name: DTHFL
    type: str
    label: Death Flag
    derivation:
      case:
        branches:
          - when: "EVDTHDT IS NOT NULL OR DMDTHDT IS NOT NULL"
            then:
              literal: Y
    verifications:
      allowed_values:
        values: [Y]

  - name: DTHCAUS
    type: str
    label: Cause of Death
    derivation:
      source: DEATHEV.AEDECOD

  - name: DTHDT
    type: date
    label: Date of Death
    derivation:
      coalesce:
        sources: [EVDTHDT, DMDTHDT]

verifications:
  - unique:
      columns: [STUDYID, USUBJID, AESEQ]
  - row_count:
      min: 5
      max: 5
  - implies:
      id: fatal-event-carries-its-own-cause
      when: "FATALFL = 'Y'"
      then: "DTHCAUS = AEDECOD AND DTHDT = ASTDT"
  - implies:
      id: no-cause-without-a-fatal-event
      when: "DTHCAUS IS NOT NULL"
      then: "DTHDT IS NOT NULL"
  - implies:
      id: death-date-marks-the-subject
      when: "DTHDT IS NOT NULL"
      then: "DTHFL = 'Y'"
