schema_version: "1.0"
domain: ADSL
datasets:
  DM: input/dm.csv
  EX: input/ex.csv
base: DM
keys: [STUDYID, USUBJID]

output:
  profile: csv-v1
  columns: [POPFL, SAFFL, ITTFL, TRTSDT, RANDDT, AGEGR1, AGERNK, STUDYID, USUBJID, AGE]

columns:
  - name: TRTSDT
    type: date
    label: Date of First Exposure to Treatment
    derivation:
      aggregate:
        filter: "EX.EXSTDTC IS NOT NULL"
        expr: "MIN(EX.EXSTDTC)"

  - name: SAFFL
    type: str
    label: Safety Population Flag
    derivation:
      case:
        branches:
          - when: "TRTSDT IS NOT NULL"
            then:
              literal: Y
        otherwise:
          literal: N

  - name: RANDDT
    type: date
    label: Randomization Date
    derivation:
      source: DM.RANDDT

  - name: RANDFL
    type: str
    label: Randomized Population Flag
    derivation:
      case:
        branches:
          - when: "RANDDT IS NOT NULL"
            then:
              literal: Y
        otherwise:
          literal: N

  - name: ITTFL
    type: str
    label: Intent-to-Treat Population Flag
    derivation:
      case:
        branches:
          - when: "RANDFL = 'Y'"
            then:
              literal: Y
        otherwise:
          literal: N

  - name: POPFL
    type: str
    label: Analysis Population Flag
    derivation:
      case:
        branches:
          - when: "SAFFL = 'Y' AND ITTFL = 'Y'"
            then:
              literal: Y
        otherwise:
          literal: N

  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: DM.USUBJID

  - name: AGE
    type: int
    label: Age
    derivation:
      source: DM.AGE

  - name: AGEGR1
    type: str
    label: Pooled Age Group 1
    derivation:
      cut:
        source: AGE
        breaks: [65]
        labels: ["<65", ">=65"]
        right: false

  - name: AGERNK
    type: int
    label: Pooled Age Group 1 Rank
    derivation:
      row_number:
        group_by: [STUDYID]
        order_by: [AGE, USUBJID]

verifications:
  - unique:
      columns: [STUDYID, USUBJID]
  - row_count:
      min: 3
      max: 3
  - implies:
      id: analysis-population-requires-both-flags
      when: "POPFL = 'Y'"
      then: "SAFFL = 'Y' AND ITTFL = 'Y'"
