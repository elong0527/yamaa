schema_version: "1.0"
domain: ADAE
datasets:
  AE: input/ae.csv
base: AE
keys: [STUDYID, USUBJID, AESEQ]

output:
  profile: csv
  columns: [STUDYID, USUBJID, AESEQ, ASEV, ASEVN, SEVRANK, SEVLVL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: AE.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: AE.USUBJID

  - name: AESEQ
    type: int
    label: Sequence Number
    derivation:
      source: AE.AESEQ

  - name: ASEV
    type: str
    label: Analysis Severity/Intensity
    derivation:
      source: AE.AESEV
    verifications:
      - allowed_values:
          values: [MILD, MODERATE, SEVERE]

  - name: ASEVN
    type: int
    label: Analysis Severity/Intensity (N)
    derivation:
      mapping:
        source: ASEV
        missing: null
        dict:
          MILD: 1
          MODERATE: 2
          SEVERE: 3

  - name: SEVRANK
    type: int
    label: Severity Rank
    derivation:
      rank:
        group_by: [STUDYID, USUBJID]
        order_by:
          - variable: ASEVN
            direction: desc
            nulls: last

  - name: SEVLVL
    type: int
    label: Severity Level
    derivation:
      rank:
        method: dense
        group_by: [STUDYID, USUBJID]
        order_by:
          - variable: ASEVN
            direction: desc
            nulls: last

verifications:
  - row_count:
      min: 9
      max: 9
