schema_version: "1.0"
domain: ADLB
datasets:
  LB: {path: input/lb.csv, types: {AVAL: float, ANRLO: float}}
base: LB
keys: [STUDYID, USUBJID, PARAMCD]

output:
  path: adlb.csv
  columns: [STUDYID, USUBJID, PARAMCD, AVAL, AVALC, ANRLO, R2ANRLO, R2ANRLOC]
  order_by: [USUBJID, PARAMCD]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: LB.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: LB.USUBJID

  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation:
      source: LB.PARAMCD

  - name: AVAL
    type: float
    label: Analysis Value
    derivation:
      source: LB.AVAL

  - name: AVALC
    type: str
    label: Analysis Value (C)
    derivation:
      format_number: {source: AVAL, decimals: 2}

  - name: ANRLO
    type: float
    label: Analysis Normal Range Lower Limit
    derivation:
      source: LB.ANRLO

  - name: R2ANRLO
    type: float
    label: Ratio to Lower Limit of Normal
    derivation:
      compute:
        expr: "AVAL / NULLIF(ANRLO, 0)"

  - name: R2ANRLOC
    type: str
    label: Ratio to Lower Limit of Normal (C)
    derivation:
      format_number: {source: R2ANRLO, decimals: 4}

verifications:
  - unique:
      columns: [STUDYID, USUBJID, PARAMCD]
  - row_count:
      min: 5
      max: 5
