schema_version: "1.0"
domain: ADTTE
datasets:
  ADSL: input/adsl.csv
  ADAE:
    path: input/adae.csv
    types:
      AESEQ: int
base: ADSL
keys: [STUDYID, USUBJID, PARAMCD]

record_lookups:
  - id: AE_REC
    dataset: ADAE
    source: [STUDYID, USUBJID]
    key: [STUDYID, USUBJID]
    unmatched: missing
    order_by: [ADAE.ASTDT, ADAE.AESEQ]
    keep: first

output:
  columns: [STUDYID, USUBJID, PARAMCD, PARAM, STARTDT, ADT, AVAL, CNSR, EVNTDESC, SRCDOM, SRCVAR, SRCSEQ]

rows:
  - id: TTE
    dataset: ADSL
    group_by: [ADSL.STUDYID, ADSL.USUBJID]
    filter: "ADT IS NOT NULL"
    derivations:
      STUDYID:
        source: ADSL.STUDYID
      USUBJID:
        source: ADSL.USUBJID
      STARTDT:
        source: ADSL.TRTSDT
      AEDT:
        source: AE_REC.ASTDT
      AESEQ:
        source: AE_REC.AESEQ
      CENSORDT:
        source: ADSL.EOSDT
      RAWDT:
        case:
          branches:
            - when: "AEDT IS NOT NULL"
              then:
                source: AEDT
          otherwise:
            source: CENSORDT
      ADT:
        case:
          branches:
            - when: "STARTDT IS NOT NULL AND STARTDT > RAWDT"
              then:
                source: STARTDT
          otherwise:
            source: RAWDT
      AVAL:
        date_diff:
          start: STARTDT
          end: ADT
          unit: day
          bounds: inclusive
      CNSR:
        case:
          branches:
            - when: "AEDT IS NOT NULL"
              then:
                literal: 0
          otherwise:
            literal: 1
      EVNTDESC:
        case:
          branches:
            - when: "AEDT IS NOT NULL"
              then:
                literal: AE
          otherwise:
            literal: END OF STUDY
      SRCDOM:
        case:
          branches:
            - when: "AEDT IS NOT NULL"
              then:
                literal: ADAE
          otherwise:
            literal: ADSL
      SRCVAR:
        case:
          branches:
            - when: "AEDT IS NOT NULL"
              then:
                literal: ASTDT
          otherwise:
            literal: EOSDT
      SRCSEQ:
        case:
          branches:
            - when: "AEDT IS NOT NULL"
              then:
                source: AESEQ

columns:
  - name: STUDYID
    type: str
    label: Study Identifier

  - name: USUBJID
    type: str
    label: Unique Subject Identifier

  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation:
      literal: TTAE

  - name: PARAM
    type: str
    label: Parameter
    derivation:
      literal: Time to First Adverse Event

  - name: STARTDT
    type: date
    label: Time-to-Event Origin Date

  - name: AEDT
    type: date
    label: Adverse Event Date

  - name: AESEQ
    type: int
    label: Adverse Event Source Sequence Number

  - name: CENSORDT
    type: date
    label: End of Study Date

  - name: RAWDT
    type: date
    label: Selected Date Before Clamping

  - name: ADT
    type: date
    label: Analysis Date

  - name: AVAL
    type: int
    label: Analysis Value

  - name: CNSR
    type: int
    label: Censor

  - name: EVNTDESC
    type: str
    label: Event or Censoring Description

  - name: SRCDOM
    type: str
    label: Source Data

  - name: SRCVAR
    type: str
    label: Source Variable

  - name: SRCSEQ
    type: int
    label: Source Sequence Number
