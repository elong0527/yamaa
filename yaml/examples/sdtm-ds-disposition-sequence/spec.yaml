schema_version: "1.0"
domain: DS
datasets:
  DS_RAW: input/ds_raw.csv
base: DS_RAW
keys: [STUDYID, USUBJID, DSSEQ]

columns:
  - name: STUDYID
    type: str
    derivation:
      source: DS_RAW.STUDY

  - name: DOMAIN
    type: str
    derivation:
      literal: DS
    verifications:
      allowed_values:
        values: [DS]

  - name: USUBJID
    type: str
    derivation:
      source: DS_RAW.PATNUM

  - name: DSSEQ
    type: int
    derivation:
      row_number:
        group_by: [STUDYID, USUBJID]
        order_by: [DSDTC]
    verifications:
      not_missing: {}

  - name: DSDECOD
    type: str
    derivation:
      source: DS_RAW.DSDECOD
    verifications:
      not_missing: {}
      allowed_values:
        values: [COMPLETED, RANDOMIZED, ADVERSE EVENT, SCREEN FAILURE]

  - name: DSCAT
    type: str
    derivation:
      case:
        branches:
          - when: "DSDECOD = 'RANDOMIZED'"
            then:
              literal: PROTOCOL MILESTONE
          - when: "DSDECOD = 'SCREEN FAILURE'"
            then:
              literal: DISPOSITION EVENT
        otherwise:
          literal: STUDY COMPLETION
    verifications:
      allowed_values:
        values: [PROTOCOL MILESTONE, DISPOSITION EVENT, STUDY COMPLETION]

  - name: DSDTC
    type: date
    derivation:
      value:
        source: DS_RAW.DSDTCOL
      conversion_failure: null

verifications:
  - unique:
      columns: [STUDYID, USUBJID, DSSEQ]
  - row_count:
      min: 6
      max: 6
  - implies:
      id: randomized-record-is-a-milestone
      when: "DSDECOD = 'RANDOMIZED'"
      then: "DSCAT = 'PROTOCOL MILESTONE'"
  - implies:
      id: completion-record-is-a-completion
      when: "DSDECOD = 'COMPLETED'"
      then: "DSCAT = 'STUDY COMPLETION'"
