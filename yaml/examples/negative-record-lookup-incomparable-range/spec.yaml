schema_version: "1.0"
domain: VS
datasets:
  VS_RAW:
    path: input/vs.csv
    types: {VSSEQ: int, VSDTC: date}
  EPOCHS:
    path: input/epoch.csv
    types: {DYLO: int, DYHI: int}
base: VS_RAW
keys: [STUDYID, USUBJID, VSSEQ]

record_lookups:
  - id: EPOCHDEF
    dataset: EPOCHS
    source: STUDYID
    key: STUDYID
    between: {value: VSDTC, lower: DYLO, upper: DYHI}

output:
  path: vs.csv
  columns: [STUDYID, USUBJID, VSSEQ, VSDTC, EPOCH]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: {source: VS_RAW.STUDYID}

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: {source: VS_RAW.USUBJID}

  - name: VSSEQ
    type: int
    label: Sequence Number
    derivation: {source: VS_RAW.VSSEQ}

  - name: VSDTC
    type: date
    label: Date/Time of Measurements
    derivation: {source: VS_RAW.VSDTC}

  - name: EPOCH
    type: str
    label: Epoch
    derivation: {source: EPOCHDEF.EPOCH}
