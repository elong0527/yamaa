schema_version: "1.0"
domain: ADAE
datasets:
  AE: input/ae.csv
  ADSL: input/adsl.csv
base: AE
keys: [STUDYID, USUBJID, AESEQ]

output:
  profile: csv
  columns: [STUDYID, USUBJID, AESEQ, AETERM, ASTDTM, TRTSDTM, TRTEMFL, AOCCFL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: AE.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: AE.USUBJID

  - name: AESEQ
    type: int
    label: Sequence Number
    derivation:
      source: AE.AESEQ

  - name: AETERM
    type: str
    label: Reported Term for the Adverse Event
    derivation:
      source: AE.AETERM

  - name: ASTDTM
    type: datetime
    label: Analysis Start Date/Time
    derivation:
      source: AE.AESTDTC

  - name: TRTSDTM
    type: datetime
    label: Datetime of First Exposure to Treatment
    derivation:
      source: ADSL.TRTSDTM

  - name: TRTEMFL
    type: str
    label: Treatment Emergent Analysis Flag
    derivation:
      case:
        branches:
          - when: "ASTDTM IS NOT NULL AND TRTSDTM IS NOT NULL AND ASTDTM >= TRTSDTM"
            then:
              literal: Y
    verifications:
      allowed_values:
        values: [Y]

  - name: AOCCSEQ
    type: int
    label: Subject Occurrence Sequence Number
    derivation:
      row_number:
        group_by: [STUDYID, USUBJID]
        order_by: [ASTDTM, AESEQ]
        filter: "TRTEMFL = 'Y'"

  - name: AOCCFL
    type: str
    label: First Occurrence Within Subject Flag
    derivation:
      case:
        branches:
          - when: "AOCCSEQ = 1"
            then:
              literal: Y
    verifications:
      allowed_values:
        values: [Y]

verifications:
  - unique:
      columns: [STUDYID, USUBJID, AESEQ]
  - row_count:
      min: 7
      max: 7
  - implies:
      id: treatment-emergent-onset-is-not-before-first-dose
      when: "TRTEMFL = 'Y'"
      then: "ASTDTM >= TRTSDTM"
  - implies:
      id: occurrence-flag-requires-treatment-emergence
      when: "AOCCFL = 'Y'"
      then: "TRTEMFL = 'Y'"
