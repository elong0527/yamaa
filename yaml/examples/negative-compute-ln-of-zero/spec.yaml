schema_version: "1.0"
domain: ADLB
datasets:
  LB: input/lb.csv
base: LB
keys: [STUDYID, USUBJID, PARAMCD]

output:
  profile: csv
  columns: [STUDYID, USUBJID, PARAMCD, AVAL, AVALLN]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: LB.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: LB.USUBJID

  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation:
      source: LB.LBTESTCD

  - name: AVAL
    type: float
    label: Analysis Value
    derivation:
      source: LB.LBSTRESN

  - name: AVALLN
    type: float
    label: Natural Log of Analysis Value
    derivation:
      compute:
        expr: "LN(AVAL)"
