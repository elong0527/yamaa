schema_version: "1.0"
domain: AE
datasets:
  ODM: input/odm.csv
keys: [STUDYID, USUBJID, AESEQ]

record_lookups:
  - id: AEAESTDTC
    dataset: ODM
    source: [USUBJID, AE_EVENT_NUM]
    key: [SubjectKey, StudyEventRepeatKey]
    filter: "ODM.ItemOID = 'IT.AE.AESTDTC'"
    unmatched: missing
  - id: AEAELNKID
    dataset: ODM
    source: [USUBJID, AE_EVENT_NUM]
    key: [SubjectKey, StudyEventRepeatKey]
    filter: "ODM.ItemOID = 'IT.AE.AELNKID'"
    unmatched: missing

output:
  path: ae.csv
  columns: [STUDYID, USUBJID, AESEQ, AETERM, AESTDTC, AELNKID]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: ODM.StudyOID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier

  - name: AE_EVENT_NUM
    type: str
    label: AE Event Number

  - name: AETERM
    type: str
    label: Reported Term for the Adverse Event

  - name: AESTDTC
    type: date
    label: Start Date/Time of Adverse Event
    derivation:
      source: AEAESTDTC.Value

  - name: AELNKID
    type: str
    label: Link ID
    derivation:
      source: AEAELNKID.Value

  - name: AESEQ
    type: int
    label: Sequence Number
    derivation:
      row_number:
        group_by: [STUDYID, USUBJID]
        order_by: [AESTDTC, AETERM]

rows:
  - id: ae_event
    filter: "ODM.ItemOID = 'IT.AE.AETERM' AND ODM.Value IS NOT NULL"
    derivations:
      USUBJID:
        source: ODM.SubjectKey
      AE_EVENT_NUM:
        source: ODM.StudyEventRepeatKey
      AETERM:
        source: ODM.Value

verifications:
  - unique:
      columns: [STUDYID, USUBJID, AESEQ]
  - row_count:
      min: 4
      max: 4
