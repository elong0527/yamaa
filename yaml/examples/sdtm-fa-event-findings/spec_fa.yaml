schema_version: "1.0"
domain: FA
datasets:
  ODM: input/odm.csv
  AE: expected/ae.csv
keys: [STUDYID, USUBJID, FASEQ]

record_lookups:
  - id: FADIAMU
    dataset: ODM
    source: [USUBJID, FA_EVENT_NUM]
    key: [SubjectKey, StudyEventRepeatKey]
    filter: "ODM.ItemOID = 'IT.FA.DIAMETER.U'"
    unmatched: missing

output:
  path: fa.csv
  columns: [STUDYID, USUBJID, FASEQ, FAOBJ, FALNKID, FACAT, FASCAT, FATESTCD, FATEST, FAORRES, FAORRESU, FASTRESC, FASTRESU]
  order_by: [STUDYID, USUBJID, FASEQ]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: ODM.StudyOID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier

  - name: FALNKID
    type: str
    label: Link ID
    derivation:
      source: ODM.IT.FA.LINKID

  - name: FAOBJ
    type: str
    label: Object
    derivation:
      mapping_from:
        source: [USUBJID, FALNKID]
        dataset: AE
        key: [USUBJID, AELNKID]
        value: AETERM
        unmapped: null

  - name: FACAT
    type: str
    label: Category
    derivation:
      literal: SKIN FINDINGS

  - name: FASCAT
    type: str
    label: Subcategory
    derivation:
      literal: RASH SUPPLEMENT

  - name: FA_EVENT_NUM
    type: str
    label: FA Event Number

  - name: FATESTCD
    type: str
    label: Test Short Name

  - name: FATEST
    type: str
    label: Test Name

  - name: FAORRES
    type: str
    label: Result or Finding in Original Units

  - name: FAORRESU
    type: str
    label: Original Units

  - name: FASTRESC
    type: str
    label: Character Result/Finding in Standard Format

  - name: FASTRESU
    type: str
    label: Standard Units

  - name: FASEQ
    type: int
    label: Sequence Number
    derivation:
      row_number:
        group_by: [STUDYID, USUBJID]
        order_by: [FALNKID, FATESTCD]

  - name: AELNKID_MATCH
    type: str
    label: Matched AE Link ID
    derivation:
      mapping_from:
        source: [USUBJID, FALNKID]
        dataset: AE
        key: [USUBJID, AELNKID]
        value: AELNKID
        unmapped: null

rows:
  - id: fa_location
    dataset: ODM
    filter: "ODM.ItemOID = 'IT.FA.LOCATION' AND ODM.Value IS NOT NULL"
    derivations:
      USUBJID:
        source: ODM.SubjectKey
      FA_EVENT_NUM:
        source: ODM.StudyEventRepeatKey
      FATESTCD:
        literal: LOC
      FATEST:
        literal: Location of Rash
      FAORRES:
        source: ODM.Value
      FAORRESU:
        literal: null
      FASTRESC:
        source: ODM.Value
      FASTRESU:
        literal: null

  - id: fa_diameter
    dataset: ODM
    filter: "ODM.ItemOID = 'IT.FA.DIAMETER' AND ODM.Value IS NOT NULL"
    derivations:
      USUBJID:
        source: ODM.SubjectKey
      FA_EVENT_NUM:
        source: ODM.StudyEventRepeatKey
      FATESTCD:
        literal: DIAM
      FATEST:
        literal: Lesion Diameter
      FAORRES:
        source: ODM.Value
      FAORRESU:
        source: FADIAMU.Value
      FASTRESC:
        source: ODM.Value
      FASTRESU:
        source: FADIAMU.Value

  - id: fa_biopsied
    dataset: ODM
    filter: "ODM.ItemOID = 'IT.FA.BIOPSD' AND ODM.Value IS NOT NULL"
    derivations:
      USUBJID:
        source: ODM.SubjectKey
      FA_EVENT_NUM:
        source: ODM.StudyEventRepeatKey
      FATESTCD:
        literal: BIOPSY
      FATEST:
        literal: Lesion Biopsied
      FAORRES:
        source: ODM.Value
      FAORRESU:
        literal: null
      FASTRESC:
        source: ODM.Value
      FASTRESU:
        literal: null

verifications:
  - unique:
      columns: [STUDYID, USUBJID, FASEQ]
  - row_count:
      min: 9
      max: 9
  - implies:
      id: fa-linkid-matches-ae-linkid
      when: "FALNKID IS NOT NULL"
      then: "AELNKID_MATCH IS NOT NULL"
