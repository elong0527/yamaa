schema_version: "1.0"
domain: DM
datasets:
  DM_RAW: input/dm_raw.csv
base: DM_RAW
keys: [STUDYID, USUBJID]

output:
  profile: csv
  columns: [STUDYID, USUBJID, SUBJID, SITEID]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: DM_RAW.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      str_concat:
        sources:
          - source: DM_RAW.STUDYID
          - literal: '-'
          - source: DM_RAW.SITEID
          - literal: '-'
          - source: DM_RAW.SUBJID
    verifications:
      - max_length:
          max: 20

  - name: SUBJID
    type: str
    label: Subject Identifier for the Study
    derivation:
      source: DM_RAW.SUBJID

  - name: SITEID
    type: str
    label: Study Site Identifier
    derivation:
      source: DM_RAW.SITEID
