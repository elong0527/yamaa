schema_version: "1.0"
domain: ADQS
datasets:
  QS: {path: input/qs.csv, types: {QSSTRESN: float}}
base: QS
keys: [STUDYID, USUBJID, VISIT, PARAMCD]

output:
  columns: [STUDYID, USUBJID, VISIT, PARAMCD, PARAM, AVAL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: QS.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: QS.USUBJID

  - name: VISIT
    type: str
    label: Visit Name
    derivation:
      source: QS.VISIT

  - name: PARAMCD
    type: str
    label: Parameter Code
    verifications:
      allowed_values:
        values: [PF01, PF02, PF03, PF04, PFSCORE]

  - name: PARAM
    type: str
    label: Parameter

  - name: ITEMRESN
    type: float
    label: Numeric Item Response

  - name: ITEMSUM
    type: float
    label: Sum of Item Responses
    derivation:
      aggregate:
        expr: "SUM(ITEMRESN)"
        group_by: [STUDYID, USUBJID, VISIT]

  - name: ITEMANS
    type: int
    label: Number of Answered Items
    derivation:
      aggregate:
        expr: "COUNT(ITEMRESN)"
        group_by: [STUDYID, USUBJID, VISIT]

  - name: AVAL
    type: float
    label: Analysis Value
    derivation:
      case:
        branches:
          - when: "PARAMCD = 'PFSCORE' AND ITEMANS >= 3"
            then:
              compute:
                expr: "100 * (ITEMSUM / ITEMANS) / 4"
          - when: "PARAMCD = 'PFSCORE'"
            then:
              literal: null
        otherwise:
          source: ITEMRESN
    verifications:
      range:
        min: 0
        max: 100

rows:
  - id: item
    filter: "QS.QSCAT = 'PHYSICAL FUNCTIONING SCALE'"
    derivations:
      PARAMCD:
        source: QS.QSTESTCD
      PARAM:
        source: QS.QSTEST
      ITEMRESN:
        source: QS.QSSTRESN

  - id: subscale
    filter: "QS.QSCAT = 'PHYSICAL FUNCTIONING SCALE' AND QS.QSTESTCD = 'PF01'"
    derivations:
      PARAMCD:
        literal: PFSCORE
      PARAM:
        literal: Physical Functioning Subscale Score
      ITEMRESN:
        literal: null

verifications:
  - unique:
      columns: [STUDYID, USUBJID, VISIT, PARAMCD]
  - row_count:
      min: 25
      max: 25
  - implies:
      id: subscale-score-rests-on-three-answered-items
      when: "PARAMCD = 'PFSCORE' AND AVAL IS NOT NULL"
      then: "ITEMANS >= 3"
  - implies:
      id: an-item-response-stays-within-the-answer-range
      when: "PARAMCD IN ('PF01', 'PF02', 'PF03', 'PF04')"
      then: "AVAL IS NULL OR (AVAL >= 0 AND AVAL <= 4)"
