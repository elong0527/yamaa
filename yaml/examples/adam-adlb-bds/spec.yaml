schema_version: "1.0"
domain: ADLB
datasets:
  LB: input/lb.csv
  ADSL: input/adsl.csv
base: LB
keys: [STUDYID, USUBJID, PARAMCD, ADT, ASEQ]

output:
  columns: [STUDYID, USUBJID, PARAMCD, PARAM, ADT, TRTSDT, TRT01A, AVAL, AVALU, ABLFL, BASE, CHG, PCHG, ASEQ]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: LB.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: LB.USUBJID

  - name: PARAMCD
    type: str
    label: Parameter Code

  - name: PARAM
    type: str
    label: Parameter

  - name: ADT
    type: date
    label: Analysis Date
    derivation:
      source: LB.LBDTC

  - name: TRTSDT
    type: date
    label: Date of First Exposure to Treatment
    derivation:
      source: ADSL.TRTSDT

  - name: TRT01A
    type: str
    label: Actual Treatment for Period 01
    derivation:
      source: ADSL.TRT01A

  - name: AVAL
    type: float
    label: Analysis Value

  - name: AVALU
    type: str
    label: Analysis Value Unit

  - name: ABLFL
    type: str
    label: Baseline Record Flag
    derivation:
      baseline_flag:
        group_by: [STUDYID, USUBJID, PARAMCD]
        date: ADT
        reference_date: TRTSDT

  - name: BASE
    type: float
    label: Baseline Value
    derivation:
      baseline_value:
        group_by: [STUDYID, USUBJID, PARAMCD]
        value: AVAL
        flag: ABLFL

  - name: CHG
    type: float
    label: Change from Baseline
    derivation:
      compute:
        expr: "AVAL - BASE"

  - name: PCHG
    type: float
    label: Percent Change from Baseline
    derivation:
      compute:
        expr: "100 * (AVAL - BASE) / NULLIF(BASE, 0)"

  - name: ASEQ
    type: int
    label: Analysis Sequence Number
    derivation:
      row_number:
        group_by: [STUDYID, USUBJID]
        order_by: [PARAMCD, ADT]

rows:
  - id: alt
    filter: "LB.LBTESTCD = 'ALT' AND LB.LBSTRESN IS NOT NULL"
    derivations:
      PARAMCD:
        literal: ALT
      PARAM:
        literal: Alanine Aminotransferase
      AVAL:
        source: LB.LBSTRESN
      AVALU:
        source: LB.LBSTRESU

  - id: alt_si
    filter: "LB.LBTESTCD = 'ALT' AND LB.LBSTRESN IS NOT NULL"
    derivations:
      PARAMCD:
        literal: ALTSI
      PARAM:
        literal: Alanine Aminotransferase (SI)
      AVAL:
        compute:
          expr: "LB.LBSTRESN * 0.0167"
      AVALU:
        literal: ukat/L

  - id: ast
    filter: "LB.LBTESTCD = 'AST' AND LB.LBSTRESN IS NOT NULL"
    derivations:
      PARAMCD:
        literal: AST
      PARAM:
        literal: Aspartate Aminotransferase
      AVAL:
        source: LB.LBSTRESN
      AVALU:
        source: LB.LBSTRESU
