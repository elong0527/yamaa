domain: ADLB
datasets:
  LB: input/lb.csv
  ADSL: input/adsl.csv
base: LB
keys: [STUDYID, USUBJID, PARAMCD, ADT, ASEQ]

columns:
  - name: STUDYID
    type: str
    derivation:
      source: LB.STUDYID

  - name: USUBJID
    type: str
    derivation:
      source: LB.USUBJID

  - name: PARAMCD
    type: str

  - name: PARAM
    type: str

  - name: ADT
    type: date

  - name: TRTSDT
    type: date
    derivation:
      source: ADSL.TRTSDT

  - name: TRT01A
    type: str
    derivation:
      source: ADSL.TRT01A

  - name: AVAL
    type: float

  - name: AVALU
    type: str

  - name: ABLFL
    type: str
    derivation:
      group_by: [STUDYID, USUBJID, PARAMCD]
      function: "baseline_flag(date = ADT, reference_date = TRTSDT)"

  - name: BASE
    type: float
    derivation:
      group_by: [STUDYID, USUBJID, PARAMCD]
      function: "baseline_value(value = AVAL, flag = ABLFL)"

  - name: CHG
    type: float
    derivation:
      function: "subtract(minuend = AVAL, subtrahend = BASE)"

  - name: PCHG
    type: float
    derivation:
      function: "percent_change(value = AVAL, base = BASE)"

  - name: ASEQ
    type: int
    derivation:
      group_by: [STUDYID, USUBJID]
      function: "row_number(order_by = [PARAMCD, ADT])"

rows:
  - id: alt
    filter: "LB.LBTESTCD = 'ALT' AND LB.LBSTRESN IS NOT NULL"
    derivations:
      PARAMCD:
        literal: ALT
      PARAM:
        literal: Alanine Aminotransferase
      ADT:
        source: LB.LBDTC
      AVAL:
        source: LB.LBSTRESN
      AVALU:
        source: LB.LBSTRESU

  - id: alt_si
    filter: "LB.LBTESTCD = 'ALT' AND LB.LBSTRESN IS NOT NULL"
    derivations:
      PARAMCD:
        literal: ALTSI
      PARAM:
        literal: Alanine Aminotransferase (SI)
      ADT:
        source: LB.LBDTC
      AVAL:
        function: "multiply(value = LB.LBSTRESN, factor = 0.0167)"
      AVALU:
        literal: ukat/L

  - id: ast
    filter: "LB.LBTESTCD = 'AST' AND LB.LBSTRESN IS NOT NULL"
    derivations:
      PARAMCD:
        literal: AST
      PARAM:
        literal: Aspartate Aminotransferase
      ADT:
        source: LB.LBDTC
      AVAL:
        source: LB.LBSTRESN
      AVALU:
        source: LB.LBSTRESU
