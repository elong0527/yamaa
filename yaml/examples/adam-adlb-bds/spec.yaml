domain: ADLB
datasets:
  LB: input/lb.csv
  ADSL: input/adsl.csv
base: LB
keys: [STUDYID, USUBJID, PARAMCD, ADT, ASEQ]

columns:
  - name: STUDYID
    type: str
    derivation:
      source: LB.STUDYID

  - name: USUBJID
    type: str
    derivation:
      source: LB.USUBJID

  - name: PARAMCD
    type: str

  - name: PARAM
    type: str

  - name: ADT
    type: date

  - name: TRTSDT
    type: date
    derivation:
      source: ADSL.TRTSDT

  - name: TRT01A
    type: str
    derivation:
      source: ADSL.TRT01A

  - name: AVAL
    type: float

  - name: AVALU
    type: str

  - name: ABLFL
    type: str
    derivation:
      baseline_flag:
        group_by: [STUDYID, USUBJID, PARAMCD]
        date: {source: ADT}
        reference_date: {source: TRTSDT}

  - name: BASE
    type: float
    derivation:
      baseline_value:
        group_by: [STUDYID, USUBJID, PARAMCD]
        value: {source: AVAL}
        flag: {source: ABLFL}

  - name: CHG
    type: float
    derivation:
      subtract:
        minuend: {source: AVAL}
        subtrahend: {source: BASE}

  - name: PCHG
    type: float
    derivation:
      percent_change:
        value: {source: AVAL}
        base: {source: BASE}

  - name: ASEQ
    type: int
    derivation:
      row_number:
        group_by: [STUDYID, USUBJID]
        order_by:
          - {source: PARAMCD}
          - {source: ADT}

rows:
  - id: alt
    filter: "LB.LBTESTCD = 'ALT' AND LB.LBSTRESN IS NOT NULL"
    derivations:
      PARAMCD:
        literal: ALT
      PARAM:
        literal: Alanine Aminotransferase
      ADT:
        source: LB.LBDTC
      AVAL:
        source: LB.LBSTRESN
      AVALU:
        source: LB.LBSTRESU

  - id: alt_si
    filter: "LB.LBTESTCD = 'ALT' AND LB.LBSTRESN IS NOT NULL"
    derivations:
      PARAMCD:
        literal: ALTSI
      PARAM:
        literal: Alanine Aminotransferase (SI)
      ADT:
        source: LB.LBDTC
      AVAL:
        multiply:
          value: {source: LB.LBSTRESN}
          factor: 0.0167
      AVALU:
        literal: ukat/L

  - id: ast
    filter: "LB.LBTESTCD = 'AST' AND LB.LBSTRESN IS NOT NULL"
    derivations:
      PARAMCD:
        literal: AST
      PARAM:
        literal: Aspartate Aminotransferase
      ADT:
        source: LB.LBDTC
      AVAL:
        source: LB.LBSTRESN
      AVALU:
        source: LB.LBSTRESU
