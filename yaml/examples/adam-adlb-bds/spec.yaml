domain: ADLB
datasets:
  LB: input/lb.csv
  ADSL: input/adsl.csv
base: LB
keys: [STUDYID, USUBJID, PARAMCD, ADT, ASEQ]

columns:
  - name: STUDYID
    type: str
    derivation:
      source: LB.STUDYID

  - name: USUBJID
    type: str
    derivation:
      source: LB.USUBJID

  - name: PARAMCD
    type: str

  - name: PARAM
    type: str

  - name: ADT
    type: date

  - name: TRTSDT
    type: date
    derivation:
      source: ADSL.TRTSDT

  - name: TRT01A
    type: str
    derivation:
      source: ADSL.TRT01A

  - name: AVAL
    type: float

  - name: AVALU
    type: str

  - name: ABLFL
    type: str
    derivation:
      group_by: [STUDYID, USUBJID, PARAMCD]
      operations:
        - baseline_flag:
            date: {source: ADT}
            reference_date: {source: TRTSDT}

  - name: BASE
    type: float
    derivation:
      group_by: [STUDYID, USUBJID, PARAMCD]
      operations:
        - baseline_value:
            value: {source: AVAL}
            flag: {source: ABLFL}

  - name: CHG
    type: float
    derivation:
      operations:
        - subtract:
            minuend: {source: AVAL}
            subtrahend: {source: BASE}

  - name: PCHG
    type: float
    derivation:
      where: "ABLFL IS NULL"
      operations:
        - percent_change:
            value: {source: AVAL}
            base: {source: BASE}

  - name: ASEQ
    type: int
    derivation:
      group_by: [STUDYID, USUBJID]
      operations:
        - row_number:
            order_by:
              - {source: PARAMCD}
              - {source: ADT}

rows:
  - id: alt
    filter: "LB.LBTESTCD = 'ALT' AND LB.LBSTRESN IS NOT NULL"
    derivations:
      PARAMCD:
        literal: ALT
      PARAM:
        literal: Alanine Aminotransferase
      ADT:
        source: LB.LBDTC
      AVAL:
        source: LB.LBSTRESN
      AVALU:
        source: LB.LBSTRESU

  - id: alt_si
    filter: "LB.LBTESTCD = 'ALT' AND LB.LBSTRESN IS NOT NULL"
    derivations:
      PARAMCD:
        literal: ALTSI
      PARAM:
        literal: Alanine Aminotransferase (SI)
      ADT:
        source: LB.LBDTC
      AVAL:
        source: LB.LBSTRESN
        operations:
          - multiply:
              factor: 0.0167
      AVALU:
        literal: ukat/L

  - id: ast
    filter: "LB.LBTESTCD = 'AST' AND LB.LBSTRESN IS NOT NULL"
    derivations:
      PARAMCD:
        literal: AST
      PARAM:
        literal: Aspartate Aminotransferase
      ADT:
        source: LB.LBDTC
      AVAL:
        source: LB.LBSTRESN
      AVALU:
        source: LB.LBSTRESU
