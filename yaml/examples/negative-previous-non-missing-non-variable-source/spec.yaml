schema_version: "1.0"
domain: ADVS
datasets:
  VS: input/vs.csv
base: VS
keys: [STUDYID, USUBJID, VSSEQ]

output:
  path: advs.csv
  columns: [STUDYID, USUBJID, VSSEQ, SYSBP, PRIORBP]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: VS.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: VS.USUBJID

  - name: VSSEQ
    type: int
    label: Sequence Number
    derivation:
      source: VS.VSSEQ

  - name: SYSBP
    type: int
    label: Systolic Blood Pressure
    derivation:
      source: VS.SYSBP

  - name: PRIORBP
    type: int
    label: Prior Systolic Blood Pressure
    derivation:
      previous_non_missing:
        source: {literal: 120}
        group_by: [STUDYID, USUBJID]
        order_by:
          - {variable: VSSEQ, direction: asc}
