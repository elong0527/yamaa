schema_version: "1.0"
domain: ADPC
datasets:
  PC:
    path: input/pc.csv
    types: {PCSEQ: int, PCDAT: date}
base: PC
keys: [STUDYID, USUBJID, PCSEQ]

output:
  path: adpc.csv
  columns: [STUDYID, USUBJID, PCSEQ, PCDT, PCTM, ADTM]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: {source: PC.STUDYID}
  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: {source: PC.USUBJID}
  - name: PCSEQ
    type: int
    label: Sequence Number
    derivation: {source: PC.PCSEQ}
  - name: PCDT
    type: date
    label: Specimen Collection Date
    derivation: {source: PC.PCDAT}
  - name: PCTM
    type: str
    label: Specimen Collection Time Text
    derivation: {source: PC.PCTIM}
  - name: ADTM
    type: datetime
    label: Analysis Date/Time
    derivation:
      to_datetime: {date: PCDT, time: PCTM}
