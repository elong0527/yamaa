schema_version: "1.0"
domain: ADRS
datasets:
  RS: input/rs.csv
base: RS
keys: [STUDYID, USUBJID, RSSEQ]

output:
  columns: [STUDYID, USUBJID, PARAMCD, RSSEQ, ADT, AVALC, CONFIRMED]

columns:
  - name: STUDYID
    type: str
    derivation:
      source: RS.STUDYID

  - name: USUBJID
    type: str
    derivation:
      source: RS.USUBJID

  - name: PARAMCD
    type: str
    derivation:
      literal: CONFRESP

  - name: RSSEQ
    type: int
    derivation:
      source: RS.RSSEQ

  - name: ADT
    type: date
    derivation:
      source: RS.RSDTC

  - name: AVALC
    type: str
    derivation:
      source: RS.RSSTRESC

  - name: NEXTDT
    type: date
    derivation:
      row_value:
        source: ADT
        offset: 1
        group_by: [STUDYID, USUBJID]
        order_by: [ADT, RSSEQ]

  - name: NEXTRESP
    type: str
    derivation:
      row_value:
        source: AVALC
        offset: 1
        group_by: [STUDYID, USUBJID]
        order_by: [ADT, RSSEQ]

  - name: DAYS_TO_NEXT
    type: int
    derivation:
      date_diff:
        start: ADT
        end: NEXTDT
        unit: day

  - name: CONFIRMED
    type: str
    derivation:
      case:
        branches:
          - when: "AVALC = 'PD'"
            then:
              literal: Y
          - when: "AVALC IN ('PR', 'CR') AND NEXTRESP IN ('PR', 'CR') AND DAYS_TO_NEXT >= 28"
            then:
              literal: Y
        otherwise:
          literal: N

verifications:
  - row_count:
      min: 9
      max: 9
