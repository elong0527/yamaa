schema_version: "1.0"
domain: ADRS
datasets:
  RS: input/rs.csv
base: RS
keys: [STUDYID, USUBJID, RSSEQ]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: RS.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: RS.USUBJID

  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation:
      literal: CONFRESP

  - name: RSSEQ
    type: int
    label: Sequence Number
    derivation:
      source: RS.RSSEQ

  - name: ADT
    type: date
    label: Analysis Date
    derivation:
      source: RS.RSDTC

  - name: AVALC
    type: str
    label: Analysis Value (C)
    derivation:
      source: RS.RSSTRESC

  - name: CONFIRMED
    type: str
    label: Confirmation Flag
    derivation:
      case:
        branches:
          - when: "AVALC = 'PD'"
            then:
              literal: Y
          - when: "AVALC IN ('PR', 'CR') AND NEXTRESP IN ('PR', 'CR') AND DAYS_TO_NEXT >= 28"
            then:
              literal: Y
        otherwise:
          literal: N

  - name: NEXTDT
    type: date
    label: Next Assessment Date
    output: false
    derivation:
      row_value:
        source: ADT
        offset: 1
        group_by: [STUDYID, USUBJID]
        order_by: [ADT, RSSEQ]

  - name: NEXTRESP
    type: str
    label: Next Response
    output: false
    derivation:
      row_value:
        source: AVALC
        offset: 1
        group_by: [STUDYID, USUBJID]
        order_by: [ADT, RSSEQ]

  - name: DAYS_TO_NEXT
    type: int
    label: Days to Next Assessment
    output: false
    derivation:
      date_diff:
        start: ADT
        end: NEXTDT
        unit: day

verifications:
  - row_count:
      min: 9
      max: 9
