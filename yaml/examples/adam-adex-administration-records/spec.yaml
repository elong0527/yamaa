schema_version: "1.0"
domain: ADEX
datasets:
  EXADM:
    path: input/ex_administrations.csv
    types: {EXSEQ: int, EXDOSE: float, ADOSEN: int, NDOSE: int}

base: EXADM
keys: [STUDYID, USUBJID, EXSEQ, ADOSEN]

output:
  columns: [STUDYID, USUBJID, EXSEQ, EXTRT, EXDOSE, EXDOSU, ASTDT, AENDT, ADOSEN, NDOSE]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: {source: EXADM.STUDYID}

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: {source: EXADM.USUBJID}

  - name: EXSEQ
    type: int
    label: Sequence Number
    derivation: {source: EXADM.EXSEQ}

  - name: EXTRT
    type: str
    label: Name of Treatment
    derivation: {source: EXADM.EXTRT}

  - name: EXDOSE
    type: float
    label: Dose per Administration
    derivation: {source: EXADM.EXDOSE}

  - name: EXDOSU
    type: str
    label: Dose Units
    derivation: {source: EXADM.EXDOSU}

  - name: ASTDT
    type: date
    label: Analysis Start Date
    derivation: {source: EXADM.EXSTDTC}

  - name: AENDT
    type: date
    label: Analysis End Date
    derivation: {source: EXADM.EXENDTC}

  - name: ADOSEN
    type: int
    label: Administration Number
    derivation: {source: EXADM.ADOSEN}

  - name: NDOSE
    type: int
    label: Number of Administrations
    derivation: {source: EXADM.NDOSE}

verifications:
  - unique:
      columns: [STUDYID, USUBJID, EXSEQ, ADOSEN]
  - row_count:
      min: 8
      max: 8
