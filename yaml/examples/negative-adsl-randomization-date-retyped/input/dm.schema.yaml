schema_version: "1.0"
domain: DM
datasets:
  ODM: odm.csv
base: ODM
keys: [STUDYID, USUBJID]

output:
  path: dm.csv
  columns: [STUDYID, USUBJID, RANDDT]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: ODM.StudyOID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: ODM.SubjectKey

  - name: RANDDT
    type: date
    label: Date of Randomization
    derivation:
      source: ODM.Value

rows:
  - id: subject
    filter: "ODM.ItemOID = 'IT.DM.RANDDT'"
    derivations: {}
