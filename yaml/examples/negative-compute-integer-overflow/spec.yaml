schema_version: "1.0"
domain: ADLB
datasets:
  LB: input/lb.csv
base: LB
keys: [STUDYID, USUBJID]

output:
  columns: [STUDYID, USUBJID, CELLTOT]

columns:
  - name: STUDYID
    type: str
    derivation:
      source: LB.STUDYID

  - name: USUBJID
    type: str
    derivation:
      source: LB.USUBJID

  - name: CELLCNT
    type: int
    output: false
    derivation:
      source: LB.CELLCNT

  - name: VOLUML
    type: int
    output: false
    derivation:
      source: LB.VOLUML

  - name: CELLTOT
    type: int
    derivation:
      compute:
        expr: "CELLCNT * VOLUML"
