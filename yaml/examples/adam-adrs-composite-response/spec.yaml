schema_version: "1.0"
domain: ADRS
datasets:
  ADRSPRE: input/adrs_pre.csv
  ADSL: input/adsl.csv

derived:
  - id: DECISION
    base: ADRSPRE
    keys: [STUDYID, USUBJID, AVISIT]
    columns:
      - name: STUDYID
        type: str
        derivation: {source: ADRSPRE.STUDYID}
      - name: USUBJID
        type: str
        derivation: {source: ADRSPRE.USUBJID}
      - name: AVISIT
        type: str
        derivation: {source: ADRSPRE.AVISIT}
      - name: PCHG
        type: float
        derivation: {source: ADRSPRE.PCHG}
      - name: SAEFL
        type: str
        derivation: {source: ADSL.SAEFL}
      - name: DCSREAS
        type: str
        derivation: {source: ADSL.DCSREAS}

base: DECISION
keys: [STUDYID, USUBJID, PARAMCD, AVISIT]

record_lookups:
  - id: OUTCOME
    dataset: DECISION
    as: RULE
    candidates:
      - id: SAFETY
        filter: "DECISION.SAEFL = 'Y' OR DECISION.DCSREAS IS NOT NULL"
      - id: MISSING
        filter: "DECISION.PCHG IS NULL"
      - id: THRESHOLD
        filter: "DECISION.PCHG <= -75"
      - id: OTHERWISE

columns:
  - name: STUDYID
    type: str
    derivation:
      source: DECISION.STUDYID

  - name: USUBJID
    type: str
    derivation:
      source: DECISION.USUBJID

  - name: PARAMCD
    type: str
    derivation:
      literal: RESP75

  - name: PARAM
    type: str
    derivation:
      literal: EASI-75 Response

  - name: AVISIT
    type: str
    derivation:
      source: DECISION.AVISIT

  - name: PCHG
    type: float
    derivation:
      source: DECISION.PCHG

  - name: SAEFL
    type: str
    derivation:
      source: DECISION.SAEFL

  - name: DCSREAS
    type: str
    derivation:
      source: DECISION.DCSREAS

  - name: RULE
    type: str
    output: false
    derivation:
      source: OUTCOME.RULE

  - name: AVALC
    type: str
    derivation:
      mapping:
        source: RULE
        dict:
          SAFETY: NON-RESPONDER
          MISSING: NOT EVALUABLE
          THRESHOLD: RESPONDER
          OTHERWISE: NON-RESPONDER
    verifications:
      - not_missing: {}
      - allowed_values:
          values: [RESPONDER, NON-RESPONDER, NOT EVALUABLE]

  - name: ARSN
    type: str
    derivation:
      mapping:
        source: RULE
        dict:
          SAFETY: SAFETY OR DISCONTINUATION RULE
          MISSING: COMPONENT MISSING
          THRESHOLD: THRESHOLD MET
          OTHERWISE: THRESHOLD NOT MET
    verifications:
      not_missing: {}

  - name: AVAL
    type: int
    derivation:
      case:
        branches:
          - when: "AVALC = 'RESPONDER'"
            then:
              literal: 1
          - when: "AVALC = 'NON-RESPONDER'"
            then:
              literal: 0

verifications:
  - unique:
      columns: [STUDYID, USUBJID, PARAMCD, AVISIT]
  - row_count:
      min: 5
      max: 5
  - implies:
      id: numeric-response-is-missing-only-when-not-evaluable
      when: "AVAL IS NULL"
      then: "AVALC = 'NOT EVALUABLE'"
  - implies:
      id: responder-meets-threshold
      when: "AVALC = 'RESPONDER'"
      then: "PCHG <= -75"
  - implies:
      id: safety-override-is-not-a-responder
      when: "SAEFL = 'Y' OR DCSREAS IS NOT NULL"
      then: "AVALC = 'NON-RESPONDER'"
