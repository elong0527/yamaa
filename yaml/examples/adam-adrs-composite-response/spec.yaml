schema_version: "1.0"
domain: ADRS
datasets:
  ADRSPRE: input/adrs_pre.csv
  ADSL: input/adsl.csv

base: ADRSPRE
keys: [STUDYID, USUBJID, PARAMCD, AVISIT]

output:
  profile: csv
  columns: [STUDYID, USUBJID, PARAMCD, PARAM, AVISIT, PCHG, SAEFL, DCSREAS, AVALC, ARSN, AVAL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: ADRSPRE.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: ADRSPRE.USUBJID

  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation:
      literal: RESP75

  - name: PARAM
    type: str
    label: Parameter
    derivation:
      literal: EASI-75 Response

  - name: AVISIT
    type: str
    label: Analysis Visit
    derivation:
      source: ADRSPRE.AVISIT

  - name: PCHG
    type: float
    label: Percent Change from Baseline
    derivation:
      source: ADRSPRE.PCHG

  - name: SAEFL
    type: str
    label: Serious Adverse Event Flag
    derivation:
      source: ADSL.SAEFL

  - name: DCSREAS
    type: str
    label: Reason for Discontinuation
    derivation:
      source: ADSL.DCSREAS

  - name: RULE
    type: str
    label: Decision Rule
    derivation:
      case:
        branches:
          - when: "SAEFL = 'Y' OR DCSREAS IS NOT NULL"
            then: {literal: SAFETY}
          - when: "PCHG IS NULL"
            then: {literal: MISSING}
          - when: "PCHG <= -75"
            then: {literal: THRESHOLD}
        otherwise: {literal: OTHERWISE}

  - name: AVALC
    type: str
    label: Analysis Value (C)
    derivation:
      mapping:
        source: RULE
        dict:
          SAFETY: NON-RESPONDER
          MISSING: NOT EVALUABLE
          THRESHOLD: RESPONDER
          OTHERWISE: NON-RESPONDER
    verifications:
      - not_missing: {}
      - allowed_values:
          values: [RESPONDER, NON-RESPONDER, NOT EVALUABLE]

  - name: ARSN
    type: str
    label: Analysis Reason
    derivation:
      mapping:
        source: RULE
        dict:
          SAFETY: SAFETY OR DISCONTINUATION RULE
          MISSING: COMPONENT MISSING
          THRESHOLD: THRESHOLD MET
          OTHERWISE: THRESHOLD NOT MET
    verifications:
      not_missing: {}

  - name: AVAL
    type: int
    label: Analysis Value
    derivation:
      case:
        branches:
          - when: "AVALC = 'RESPONDER'"
            then:
              literal: 1
          - when: "AVALC = 'NON-RESPONDER'"
            then:
              literal: 0

verifications:
  - unique:
      columns: [STUDYID, USUBJID, PARAMCD, AVISIT]
  - row_count:
      min: 5
      max: 5
  - implies:
      id: numeric-response-is-missing-only-when-not-evaluable
      when: "AVAL IS NULL"
      then: "AVALC = 'NOT EVALUABLE'"
  - implies:
      id: responder-meets-threshold
      when: "AVALC = 'RESPONDER'"
      then: "PCHG <= -75"
  - implies:
      id: safety-override-is-not-a-responder
      when: "SAEFL = 'Y' OR DCSREAS IS NOT NULL"
      then: "AVALC = 'NON-RESPONDER'"
