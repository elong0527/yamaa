domain: ADSL
datasets:
  DM: input/dm.csv
  EX: input/ex.csv
base: DM
keys: [STUDYID, USUBJID]

columns:
  - name: STUDYID
    type: str
    derivation:
      source: DM.STUDYID

  - name: USUBJID
    type: str
    derivation:
      source: DM.USUBJID

  - name: TR01SDT
    type: date
    derivation:
      min:
        source: EX.EXSTDTC
        filter: "EX.APERIOD = 1 AND EX.EXSTDTC IS NOT NULL"

  - name: TR01EDT
    type: date
    derivation:
      max:
        source: EX.EXENDTC
        filter: "EX.APERIOD = 1 AND EX.EXENDTC IS NOT NULL"

  - name: TR02SDT
    type: date
    derivation:
      min:
        source: EX.EXSTDTC
        filter: "EX.APERIOD = 2 AND EX.EXSTDTC IS NOT NULL"

  - name: TR02EDT
    type: date
    derivation:
      max:
        source: EX.EXENDTC
        filter: "EX.APERIOD = 2 AND EX.EXENDTC IS NOT NULL"

  - name: EXFIRST
    type: str
    derivation:
      source:
        variable: EX.EXTRT
        multiple_matches:
          order_by: [EX.APERIOD, EX.EXSTDTC, EX.EXSEQ]
          keep: first

  - name: EXLAST
    type: str
    derivation:
      source:
        variable: EX.EXTRT
        multiple_matches:
          order_by: [EX.APERIOD, EX.EXSTDTC, EX.EXSEQ]
          keep: last

  - name: TRT01A
    type: str
    derivation:
      case:
        branches:
          - when: "TR01SDT IS NOT NULL"
            then:
              source: EXFIRST
    verifications:
      allowed_values:
        values: [VITAMIN D3, PLACEBO]

  - name: TRT02A
    type: str
    derivation:
      case:
        branches:
          - when: "TR02SDT IS NOT NULL"
            then:
              source: EXLAST
    verifications:
      allowed_values:
        values: [VITAMIN D3, PLACEBO]

  - name: WASH0
    type: int
    output: false
    derivation:
      case:
        branches:
          - when: "TR01EDT IS NOT NULL AND TR02SDT IS NOT NULL"
            then:
              date_diff:
                start: TR01EDT
                end: TR02SDT
                unit: day

  - name: WASHDUR
    type: float
    derivation:
      compute:
        expr: "WASH0 - 1"
    verifications:
      range:
        min: 0

verifications:
  - unique:
      columns: [STUDYID, USUBJID]
  - row_count:
      min: 3
      max: 3
  - all_or_none:
      id: period-two-completeness
      columns: [TR02SDT, TR02EDT, TRT02A, WASH0, WASHDUR]
  - implies:
      id: period-two-follows-period-one
      when: "TR02SDT IS NOT NULL"
      then: "TR02SDT > TR01EDT"
  - implies:
      id: crossover-changes-treatment
      when: "TRT02A IS NOT NULL"
      then: "TRT02A <> TRT01A"
