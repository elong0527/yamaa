schema_version: "1.0"
domain: ADSL
datasets:
  DM: input/dm.csv
  EX: {path: input/ex.csv, types: {EXSEQ: int, APERIOD: int}}
base: DM
keys: [STUDYID, USUBJID]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: DM.USUBJID

  - name: TR01SDT
    type: date
    label: Date of First Exposure in Period 01
    derivation:
      aggregate:
        filter: "EX.APERIOD = 1 AND EX.EXSTDTC IS NOT NULL"
        expr: "MIN(EX.EXSTDTC)"

  - name: TR01EDT
    type: date
    label: Date of Last Exposure in Period 01
    derivation:
      aggregate:
        filter: "EX.APERIOD = 1 AND EX.EXENDTC IS NOT NULL"
        expr: "MAX(EX.EXENDTC)"

  - name: TR02SDT
    type: date
    label: Date of First Exposure in Period 02
    derivation:
      aggregate:
        filter: "EX.APERIOD = 2 AND EX.EXSTDTC IS NOT NULL"
        expr: "MIN(EX.EXSTDTC)"

  - name: TR02EDT
    type: date
    label: Date of Last Exposure in Period 02
    derivation:
      aggregate:
        filter: "EX.APERIOD = 2 AND EX.EXENDTC IS NOT NULL"
        expr: "MAX(EX.EXENDTC)"

  - name: TRT01A
    type: str
    label: Actual Treatment for Period 01
    derivation:
      source:
        variable: EX.EXTRT
        multiple_matches:
          order_by: [EX.EXSTDTC, EX.EXSEQ]
          keep: first
          filter: "EX.APERIOD = 1"
    verifications:
      allowed_values:
        values: [VITAMIN D3, PLACEBO]

  - name: TRT02A
    type: str
    label: Actual Treatment for Period 02
    derivation:
      source:
        variable: EX.EXTRT
        multiple_matches:
          order_by: [EX.EXSTDTC, EX.EXSEQ]
          keep: first
          filter: "EX.APERIOD = 2"
    verifications:
      allowed_values:
        values: [VITAMIN D3, PLACEBO]

  - name: WASHDUR
    type: int
    label: Washout Duration (Days)
    derivation:
      date_diff:
        start: TR01EDT
        end: TR02SDT
        unit: day
        bounds: between
    verifications:
      range:
        min: 0

verifications:
  - unique:
      columns: [STUDYID, USUBJID]
  - row_count:
      min: 3
      max: 3
  - all_or_none:
      id: period-two-completeness
      columns: [TR02SDT, TR02EDT, TRT02A, WASHDUR]
  - implies:
      id: period-two-follows-period-one
      when: "TR02SDT IS NOT NULL"
      then: "TR02SDT > TR01EDT"
  - implies:
      id: crossover-changes-treatment
      when: "TRT02A IS NOT NULL"
      then: "TRT02A <> TRT01A"
