schema_version: "1.0"
domain: ADSL
datasets:
  DM: input/dm.csv
base: DM
keys: [STUDYID, USUBJID]

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, SITEID, SITEFOLD]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: DM.USUBJID

  - name: SITEID
    type: int
    label: Site Number
    derivation:
      source: DM.SITENO

  - name: SITEFOLD
    type: str
    label: Folded Site Identifier
    derivation:
      str_lower:
        source: SITEID
