schema_version: "1.0"
domain: VS
datasets:
  VS_RAW: {path: input/vs.csv, types: {VSSEQ: int, VSSTRESN: float}}
base: VS_RAW
keys: [STUDYID, USUBJID, VSSEQ]

output:
  path: vs.csv
  columns: [STUDYID, USUBJID, VSSEQ, VSTESTCD, VSSTRESN]
  order_by: [USUBJID, VISITNUM]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: VS_RAW.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: VS_RAW.USUBJID

  - name: VSSEQ
    type: int
    label: Sequence Number
    derivation:
      source: VS_RAW.VSSEQ

  - name: VSTESTCD
    type: str
    label: Vital Signs Test Short Name
    derivation:
      source: VS_RAW.VSTESTCD

  - name: VSSTRESN
    type: float
    label: Numeric Result/Finding in Standard Units
    derivation:
      source: VS_RAW.VSSTRESN
