schema_version: "1.0"
domain: ADSL
datasets:
  DM: input/dm.csv
base: DM
keys: [STUDYID, USUBJID]

columns:
  - name: STUDYID
    type: str
    derivation:
      source: DM.STUDYID

  - name: USUBJID
    type: str
    derivation:
      source: DM.USUBJID

  - name: SITEID
    type: str
    output: false
    derivation:
      source: DM.SITEID

  - name: SUBJID
    type: str
    output: false
    derivation:
      source: DM.SUBJID

  - name: SUBJREF
    type: str
    derivation:
      str_template: "{SITEID + ':' + SUBJID}"
