schema_version: "1.0"
domain: ADTR
datasets:
  TRVISIT: input/trvisit.csv
  TR: input/tr.csv
  TU: input/tu.csv

derived:
  - id: ASSESS
    base: TRVISIT
    keys: [STUDYID, USUBJID, AVISIT]
    columns:
      - name: STUDYID
        type: str
        label: Study Identifier
        derivation: {source: TRVISIT.STUDYID}
      - name: USUBJID
        type: str
        label: Unique Subject Identifier
        derivation: {source: TRVISIT.USUBJID}
      - name: AVISIT
        type: str
        label: Analysis Visit
        derivation: {source: TRVISIT.AVISIT}
      - name: AVISITN
        type: int
        label: Analysis Visit (N)
        derivation: {source: TRVISIT.AVISITN}
      - name: ADT
        type: date
        label: Analysis Date
        derivation: {source: TRVISIT.ADT}
      - name: AVAL
        type: float
        label: Analysis Value
        derivation:
          aggregate:
            filter: "TR.TRGRPID = 'TARGET' AND TR.TRTESTCD = 'LDIAM'"
            expr: "SUM(TR.TRSTRESN)"
      - name: NMEAS
        type: int
        label: Number of Measured Target Lesions
        derivation:
          aggregate:
            filter: "TR.TRGRPID = 'TARGET' AND TR.TRTESTCD = 'LDIAM'"
            expr: "COUNT(TR.TRSTRESN)"
      - name: NTARGET
        type: int
        label: Number of Target Lesions
        derivation:
          aggregate:
            filter: "TU.TUGRPID = 'TARGET'"
            expr: "COUNT(TU.TULNKID)"
      - name: ANL01FL
        type: str
        label: Analysis Record Flag 01
        derivation:
          case:
            branches:
              - when: "NMEAS = NTARGET"
                then: {literal: Y}

base: ASSESS
keys: [STUDYID, USUBJID, AVISIT]

output:
  columns: [STUDYID, USUBJID, AVISIT, AVISITN, ADT, PARAMCD, PARAM, AVAL, NMEAS, NTARGET, ANL01FL, NADIR]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: ASSESS.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: ASSESS.USUBJID

  - name: AVISIT
    type: str
    label: Analysis Visit
    derivation:
      source: ASSESS.AVISIT

  - name: AVISITN
    type: int
    label: Analysis Visit (N)
    derivation:
      source: ASSESS.AVISITN

  - name: ADT
    type: date
    label: Analysis Date
    derivation:
      source: ASSESS.ADT

  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation:
      literal: SDIAM

  - name: PARAM
    type: str
    label: Parameter
    derivation:
      literal: Sum of Target Lesion Diameters (mm)

  - name: AVAL
    type: float
    label: Analysis Value
    derivation:
      source: ASSESS.AVAL

  - name: NMEAS
    type: int
    label: Number of Measured Target Lesions
    derivation:
      source: ASSESS.NMEAS

  - name: NTARGET
    type: int
    label: Number of Target Lesions
    derivation:
      source: ASSESS.NTARGET

  - name: ANL01FL
    type: str
    label: Analysis Record Flag 01
    derivation:
      source: ASSESS.ANL01FL
    verifications:
      allowed_values:
        values: [Y]

  - name: NADIR
    type: float
    label: Nadir Sum of Target Lesion Diameters
    derivation:
      aggregate:
        filter: "ASSESS.ANL01FL = 'Y'"
        group_by: [ASSESS.STUDYID, ASSESS.USUBJID]
        between:
          value: ADT
          lower: ASSESS.ADT
        expr: "MIN(ASSESS.AVAL)"

verifications:
  - unique:
      columns: [STUDYID, USUBJID, AVISIT]
  - row_count:
      min: 7
      max: 7
  - predicate:
      id: measured-lesions-do-not-exceed-the-target-lesions
      assert: "NMEAS IS NULL OR NMEAS <= NTARGET"
  - implies:
      id: complete-assessment-has-a-sum
      when: "ANL01FL = 'Y'"
      then: "AVAL IS NOT NULL"
  - implies:
      id: dated-assessment-has-a-nadir
      when: "ADT IS NOT NULL"
      then: "NADIR IS NOT NULL"
