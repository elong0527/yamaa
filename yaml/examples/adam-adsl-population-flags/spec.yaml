schema_version: "1.0"
domain: ADSL
datasets:
  ADSLPRE: input/adsl_pre.csv
base: ADSLPRE
keys: [STUDYID, USUBJID]

output:
  profile: csv-v1
  columns: [STUDYID, USUBJID, ARMCD, TRTSDT, SAFFL, ITTFL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: ADSLPRE.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: ADSLPRE.USUBJID

  - name: ARMCD
    type: str
    label: Planned Arm Code
    derivation:
      source: ADSLPRE.ARMCD

  - name: TRTSDT
    type: date
    label: Date of First Exposure to Treatment
    derivation:
      source: ADSLPRE.TRTSDT

  - name: SAFFL
    type: str
    label: Safety Population Flag
    derivation:
      case:
        branches:
          - when: "TRTSDT IS NOT NULL"
            then:
              literal: Y
        otherwise:
          literal: N
    verifications:
      - not_missing: {}
      - allowed_values:
          values: [Y, N]

  - name: ITTFL
    type: str
    label: Intent-to-Treat Population Flag
    derivation:
      case:
        branches:
          - when: "ARMCD IS NOT NULL"
            then:
              literal: Y
        otherwise:
          literal: N
    verifications:
      - not_missing: {}
      - allowed_values:
          values: [Y, N]

verifications:
  - unique:
      columns: [STUDYID, USUBJID]
  - row_count:
      min: 4
      max: 4
  - implies:
      id: safety-flag-requires-treatment-start
      when: "SAFFL = 'Y'"
      then: "TRTSDT IS NOT NULL"
  - implies:
      id: intent-to-treat-flag-requires-arm
      when: "ITTFL = 'Y'"
      then: "ARMCD IS NOT NULL"
