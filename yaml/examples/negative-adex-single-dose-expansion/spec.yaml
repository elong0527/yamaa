schema_version: "1.0"
domain: ADEX
datasets:
  EX:
    path: input/ex.csv
    types: {EXSEQ: int, EXDOSE: float, EXDOSCNT: int}
base: EX
keys: [STUDYID, USUBJID, EXSEQ, ADOSEN]

columns:
  - name: STUDYID
    type: str
    derivation:
      source: EX.STUDYID

  - name: USUBJID
    type: str
    derivation:
      source: EX.USUBJID

  - name: EXSEQ
    type: int
    derivation:
      source: EX.EXSEQ

  - name: EXTRT
    type: str
    derivation:
      source: EX.EXTRT

  - name: EXDOSE
    type: float
    derivation:
      source: EX.EXDOSE

  - name: EXDOSU
    type: str
    derivation:
      source: EX.EXDOSU

  - name: ASTDT
    type: date
    derivation:
      source: EX.EXSTDTC

  - name: AENDT
    type: date
    derivation:
      source: EX.EXENDTC

  - name: ADOSEN
    type: int

  - name: NDOSE
    type: int
    derivation:
      source: EX.EXDOSCNT

  - name: NDOSMAX
    type: int
    output: false
    derivation:
      aggregate:
        group_by: [STUDYID, USUBJID, EXSEQ]
        expr: "MAX(ADOSEN)"

rows:
  - id: dose_1
    filter: "EX.EXDOSCNT >= 1"
    derivations:
      ADOSEN:
        literal: 1

  - id: dose_2
    filter: "EX.EXDOSCNT >= 2"
    derivations:
      ADOSEN:
        literal: 2

  - id: dose_3
    filter: "EX.EXDOSCNT >= 3"
    derivations:
      ADOSEN:
        literal: 3

verifications:
  - unique:
      columns: [STUDYID, USUBJID, EXSEQ, ADOSEN]
  - predicate:
      id: a-record-is-expanded-into-every-administration-it-holds
      assert: "NDOSMAX = NDOSE"
