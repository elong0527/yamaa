schema_version: "1.0"
domain: ADAE
datasets:
  AE: input/ae.csv
base: AE
keys: [STUDYID, USUBJID, AESEQ]

output:
  path: adae.csv
  columns: [STUDYID, USUBJID, AESEQ, AESPID, AEREFNUM, AETERM, AETERMLO, AERELLC, AREL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: AE.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: AE.USUBJID

  - name: AESEQ
    type: int
    label: Sequence Number
    derivation:
      source: AE.AESEQ

  - name: AESPID
    type: str
    label: Sponsor-Defined Identifier
    derivation:
      source: AE.AESPID

  - name: AEREFNUM
    type: int
    label: Adverse Event Reference Number
    derivation:
      str_extract:
        source: AESPID
        pattern: '^AE-([0-9]{3})$'
        group: 1
        missing: '0'
        no_match: '-1'
    verifications:
      - not_missing: {}
      - range:
          min: -1
          max: 999

  - name: AETERM
    type: str
    label: Reported Term for the Adverse Event
    derivation:
      source: AE.AETERM

  - name: AETERMLO
    type: str
    label: Reported Term in Lower Case
    derivation:
      str_lower:
        source: AETERM
    verifications:
      not_missing: {}

  - name: AERELLC
    type: str
    label: Causality in Lower Case
    derivation:
      str_lower:
        source: AE.AEREL
        missing: not reported

  - name: AREL
    type: str
    label: Analysis Causality
    derivation:
      str_upper:
        source: AERELLC
    verifications:
      - not_missing: {}
      - allowed_values:
          values: [RELATED, POSSIBLY RELATED, NOT RELATED, NOT REPORTED]

verifications:
  - unique:
      columns: [STUDYID, USUBJID, AESEQ]
  - row_count:
      min: 5
      max: 5
