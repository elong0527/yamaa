schema_version: "1.0"
domain: LB
datasets:
  LB_RAW: {path: input/lb_raw.csv, types: {LBSTRESN: float}}
base: LB_RAW
keys: [STUDYID, USUBJID, LBSEQ]

output:
  profile: csv-v1
  columns: [STUDYID, DOMAIN, USUBJID, LBSEQ, LBTESTCD, SEX, LBSTRESN, ATOXGR]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: LB_RAW.STUDYID

  - name: DOMAIN
    type: str
    label: Domain Abbreviation
    derivation:
      literal: LB

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: LB_RAW.USUBJID

  - name: LBSEQ
    type: int
    label: Sequence Number
    derivation:
      source: LB_RAW.LBSEQ

  - name: LBTESTCD
    type: str
    label: Lab Test or Examination Short Name
    derivation:
      source: LB_RAW.LBTESTCD

  - name: SEX
    type: str
    label: Sex
    derivation:
      source: LB_RAW.SEX

  - name: LBSTRESN
    type: float
    label: Numeric Result/Finding in Standard Units
    derivation:
      source: LB_RAW.LBSTRESN

  - name: ATOXGR
    type: str
    label: Analysis Toxicity Grade

  - name: REPROGRADE
    type: str
    label: Reproduced Toxicity Grade
    derivation:
      source: LB_RAW.REPROGRADE

rows:
  - id: neutrophils
    filter: "LB_RAW.LBTESTCD = 'ANC'"
    derivations:
      ATOXGR:
        cut:
          source: LB_RAW.LBSTRESN
          breaks: [0.1, 0.5, 1.0, 1.5]
          labels: ['4', '3', '2', '1', '0']
          right: false

  - id: haemoglobin-male
    filter: "LB_RAW.LBTESTCD = 'HGB' AND LB_RAW.SEX = 'M'"
    derivations:
      ATOXGR:
        cut:
          source: LB_RAW.LBSTRESN
          breaks: [8.0, 10.0, 13.5]
          labels: ['3', '2', '1', '0']
          right: false

  - id: haemoglobin-female
    filter: "LB_RAW.LBTESTCD = 'HGB' AND LB_RAW.SEX = 'F'"
    derivations:
      ATOXGR:
        cut:
          source: LB_RAW.LBSTRESN
          breaks: [8.0, 10.0, 12.0]
          labels: ['3', '2', '1', '0']
          right: false

verifications:
  - row_count:
      min: 6
      max: 6
  - predicate:
      id: reproduced-grade-agrees
      assert: "ATOXGR = REPROGRADE"
