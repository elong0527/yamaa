schema_version: "1.0"
domain: ADSL
keys: [STUDYID, USUBJID]
input:
  DM: {path: input/dm.csv}

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, SITEID, SEX]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: DM.USUBJID

  - name: SITEID
    type: str
    label: Study Site Identifier
    derivation:
      source: DM.SITEID

  - name: SEX
    type: str
    label: Sex
    derivation:
      source: DM.SEX
