schema_version: "1.0"
domain: ADLB
datasets:
  LB:
    path: input/lb.csv
    types:
      USUBJID: str
      LBTESTCD: str
      LBSTRESN: float
      LBSTRESU: str
base: LB
keys:
  - USUBJID
  - PARAMCD
output:
  columns:
    - USUBJID
    - PARAMCD
    - AVAL
    - AVALU
columns:
  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      value:
        source:
          variable: LB.USUBJID
  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation:
      value:
        source:
          variable: LB.LBTESTCD
  - name: AVAL
    type: float
    label: Analysis Value
    derivation:
      value:
        source:
          variable: LB.LBSTRESN
    metadata:
      role: analysis-value
  - name: AVALU
    type: str
    label: Standardized Analysis Unit
    derivation:
      value:
        source:
          variable: LB.LBSTRESU
verifications:
  - unique:
      columns:
        - USUBJID
        - PARAMCD
metadata:
  scope: study
