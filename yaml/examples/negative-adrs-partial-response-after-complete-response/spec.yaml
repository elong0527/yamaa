schema_version: "1.0"
domain: ADRS
datasets:
  RS: input/rs.csv
base: RS
keys: [STUDYID, USUBJID, RSSEQ]

output:
  profile: csv-v1
  columns: [STUDYID, USUBJID, RSSEQ, PARAMCD, ADT, AVALC]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: RS.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: RS.USUBJID

  - name: RSSEQ
    type: int
    label: Sequence Number
    derivation:
      source: RS.RSSEQ

  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation:
      literal: OVR

  - name: ADT
    type: date
    label: Analysis Date
    derivation:
      source: RS.RSDTC

  - name: AVALC
    type: str
    label: Analysis Value (C)
    derivation:
      source: RS.RSSTRESC
    verifications:
      allowed_values:
        values: [CR, PR, SD, NON-CR/NON-PD, PD, NE]

  - name: PREVAVALC
    type: str
    label: Previous Analysis Value (C)
    derivation:
      row_value:
        source: AVALC
        offset: -1
        group_by: [STUDYID, USUBJID]
        order_by: [ADT, RSSEQ]

verifications:
  - unique:
      columns: [STUDYID, USUBJID, RSSEQ]
  - row_count:
      min: 6
      max: 6
  - predicate:
      id: response-does-not-fall-back-after-a-complete-response
      assert: "NOT (AVALC = 'PR' AND PREVAVALC IS NOT NULL AND PREVAVALC = 'CR')"
