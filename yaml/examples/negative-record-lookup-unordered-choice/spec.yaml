schema_version: "1.0"
domain: ADSL
datasets:
  DM: input/dm.csv
  EX: input/ex.csv
base: DM
keys: [STUDYID, USUBJID]

record_lookups:
  - id: DOSING
    dataset: EX

columns:
  - name: STUDYID
    type: str
    derivation:
      source: DM.STUDYID

  - name: USUBJID
    type: str
    derivation:
      source: DM.USUBJID

  - name: TRT01A
    type: str
    derivation:
      source: DOSING.EXTRT

  - name: TRT01DOSE
    type: float
    derivation:
      source: DOSING.EXDOSE
