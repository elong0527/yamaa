schema_version: "1.0"
domain: ADLB
datasets:
  LB: input/lb.csv
base: LB
keys: [STUDYID, USUBJID, LBSEQ]

output:
  path: adlb.csv
  columns: [STUDYID, USUBJID, LBSEQ, AVAL, AVALSUM]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: LB.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: LB.USUBJID

  - name: LBSEQ
    type: int
    label: Sequence Number
    derivation:
      source: LB.LBSEQ

  - name: AVAL
    type: float
    label: Analysis Value
    derivation:
      source: LB.LBSTRESN

  - name: AVALSUM
    type: float
    label: Sum in Source Record Order
    derivation:
      aggregate:
        group_by: [STUDYID, USUBJID]
        expr: "SUM(AVAL)"

verifications:
  - unique:
      columns: [STUDYID, USUBJID, LBSEQ]
  - row_count:
      min: 3
      max: 3
