schema_version: "1.0"
domain: ADEG
datasets:
  ADEG_IN:
    path: input/adeg.csv
    types: {AVAL: float}
base: ADEG_IN
keys: [STUDYID, USUBJID, PARAMCD, AVISIT]

output:
  path: adeg.csv
  columns: [STUDYID, USUBJID, PARAMCD, PARAM, AVISIT, AVAL, AVALU]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: ADEG_IN.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: ADEG_IN.USUBJID

  - name: PARAMCD
    type: str
    label: Parameter Code

  - name: PARAM
    type: str
    label: Parameter

  - name: AVISIT
    type: str
    label: Analysis Visit
    derivation:
      source: ADEG_IN.AVISIT

  - name: AVAL
    type: float
    label: Analysis Value

  - name: AVALU
    type: str
    label: Analysis Value Unit

  - name: _PROVENANCE
    type: str
    label: Internal Row Provenance

rows:
  - id: collected
    derivations:
      PARAMCD:
        source: ADEG_IN.PARAMCD
      PARAM:
        source: ADEG_IN.PARAM
      AVAL:
        source: ADEG_IN.AVAL
      AVALU:
        source: ADEG_IN.AVALU
      _PROVENANCE:
        literal: collected

  - id: derived_rrr
    filter: "ADEG_IN.PARAMCD = 'HR' AND ADEG_IN.AVAL IS NOT NULL AND ADEG_IN.AVAL <> 0"
    derivations:
      PARAMCD:
        literal: RRR
      PARAM:
        literal: RR Duration Rederived (ms)
      AVAL:
        compute:
          expr: "60000 / ADEG_IN.AVAL"
      AVALU:
        literal: ms
      _PROVENANCE:
        literal: derived

verifications:
  - unique:
      columns: [STUDYID, USUBJID, PARAMCD, AVISIT]
  - implies:
      id: contributing-hr-uses-beats-per-minute
      when: "PARAMCD = 'HR' AND AVAL IS NOT NULL AND AVAL <> 0"
      then: "AVALU = 'beats/min'"
  - implies:
      id: reject-pre-existing-rrr
      when: "PARAMCD = 'RRR'"
      then: "_PROVENANCE = 'derived'"
