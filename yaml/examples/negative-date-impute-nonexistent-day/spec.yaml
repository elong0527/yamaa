schema_version: "1.0"
domain: ADAE
datasets:
  AE: input/ae.csv
base: AE
keys: [STUDYID, USUBJID, AESEQ]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: AE.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: AE.USUBJID

  - name: AESEQ
    type: int
    label: Sequence Number
    derivation:
      source: AE.AESEQ

  - name: AENDT
    type: date
    label: Analysis End Date
    derivation:
      date_impute:
        source: AE.AEENDTC
        month: 12
        day: 31
