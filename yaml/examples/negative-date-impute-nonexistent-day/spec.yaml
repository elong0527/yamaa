schema_version: "1.0.0-rc.1"
domain: ADAE
datasets:
  AE: input/ae.csv
base: AE
keys: [STUDYID, USUBJID, AESEQ]

output:
  path: adae.csv
  columns: [STUDYID, USUBJID, AESEQ, AENDT]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: AE.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: AE.USUBJID

  - name: AESEQ
    type: int
    label: Sequence Number
    derivation:
      source: AE.AESEQ

  - name: AENDT
    type: date
    label: Analysis End Date
    derivation:
      date_impute:
        source: AE.AEENDTC
        month: 12
        day: 31
