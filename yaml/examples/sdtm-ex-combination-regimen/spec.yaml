schema_version: "1.0"
domain: EX
datasets:
  EX_RAW: input/ex_raw.csv
base: EX_RAW
keys: [STUDYID, USUBJID, EXSEQ]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: EX_RAW.STUDYID

  - name: DOMAIN
    type: str
    label: Domain Abbreviation
    derivation:
      literal: EX

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: EX_RAW.USUBJID

  - name: EXSEQ
    type: int
    label: Sequence Number
    derivation:
      row_number:
        group_by: [STUDYID, USUBJID]
        order_by: [EXSTDTC, EXTRT]

  - name: EXTRT
    type: str
    label: Name of Treatment
    derivation:
      source: EX_RAW.EXTRT

  - name: EXDOSE
    type: float
    label: Dose
    derivation:
      source: EX_RAW.EXDOSE

  - name: EXDOSU
    type: str
    label: Dose Units
    derivation:
      source: EX_RAW.EXDOSU

  - name: EXSTDTC
    type: date
    label: Start Date/Time of Treatment
    derivation:
      source: EX_RAW.EXSTDTC

  - name: EXENDTC
    type: date
    label: End Date/Time of Treatment
    derivation:
      source: EX_RAW.EXENDTC

  - name: EXADJ
    type: str
    label: Reason for Dose Adjustment
    derivation:
      source: EX_RAW.EXADJ

verifications:
  - row_count:
      min: 9
      max: 9
  - predicate:
      id: every-administration-has-dose-and-unit
      assert: "EXDOSE IS NOT NULL AND EXDOSU IS NOT NULL"
