schema_version: "1.0"
domain: LB
datasets:
  BX_RAW: input/bx_raw.csv
base: BX_RAW
keys: [STUDYID, USUBJID, LBSEQ]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: BX_RAW.STUDYID

  - name: DOMAIN
    type: str
    label: Domain Abbreviation
    derivation:
      literal: LB

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: BX_RAW.USUBJID

  - name: LBSEQ
    type: int
    label: Sequence Number
    derivation:
      row_number:
        group_by: [STUDYID, USUBJID]
        order_by: [LBLOC, LBTESTCD]

  - name: LBTESTCD
    type: str
    label: Lab Test or Examination Short Name
    derivation:
      literal: IL13

  - name: LBTEST
    type: str
    label: Lab Test or Examination Name
    derivation:
      literal: Interleukin 13

  - name: LBSPEC
    type: str
    label: Specimen Material Type
    derivation:
      literal: SKIN

  - name: LBLOC
    type: str
    label: Location Used for Measurement

  - name: LBORRES
    type: str
    label: Result or Finding in Original Units

  - name: LBORRESU
    type: str
    label: Original Units
    derivation:
      source: BX_RAW.RESU

  - name: LBSTRESN
    type: float
    label: Numeric Result/Finding in Standard Units
    derivation:
      source: LBORRES

  - name: LBSTAT
    type: str
    label: Completion Status
    derivation:
      case:
        branches:
          - when: "LBORRES IS NULL"
            then:
              literal: NOT DONE
    verifications:
      allowed_values:
        values: [NOT DONE]

rows:
  - id: lesional
    filter: "BX_RAW.COHORT <> 'NONAD'"
    derivations:
      LBLOC:
        literal: LESIONAL
      LBORRES:
        source: BX_RAW.LESRES

  - id: non_lesional
    derivations:
      LBLOC:
        literal: NON-LESIONAL
      LBORRES:
        source: BX_RAW.NLESRES

verifications:
  - unique:
      columns: [STUDYID, USUBJID, LBSEQ]
  - row_count:
      min: 5
      max: 5
  - implies:
      id: not-done-record-has-no-result
      when: "LBSTAT = 'NOT DONE'"
      then: "LBORRES IS NULL AND LBSTRESN IS NULL"
  - implies:
      id: collected-result-is-not-flagged
      when: "LBORRES IS NOT NULL"
      then: "LBSTAT IS NULL"
