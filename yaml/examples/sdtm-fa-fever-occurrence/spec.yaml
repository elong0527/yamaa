schema_version: "1.0"
domain: FA
datasets:
  VS: input/vs.csv
base: VS
keys: [STUDYID, USUBJID, FASEQ]

output:
  columns:
    - STUDYID
    - DOMAIN
    - USUBJID
    - FASEQ
    - FATESTCD
    - FATEST
    - FACAT
    - FASCAT
    - FAOBJ
    - FAORRES
    - FASTRESC
    - FAREASND
    - FAEVAL
    - FARFTDTC
    - FAEVLINT
    - FAEVINTX
    - FADTC
    - FADY
    - FATPTREF
    - FATPTNUM
    - FALNKID
    - FALNKGRP
    - FATPT
    - VSSTRESN

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: VS.STUDYID

  - name: DOMAIN
    type: str
    label: Domain Abbreviation
    derivation:
      literal: FA

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: VS.USUBJID

  - name: FASEQ
    type: int
    label: Sequence Number
    derivation:
      source: VS.VSSEQ

  - name: FATESTCD
    type: str
    label: Findings About Test Short Name
    derivation:
      literal: OCCUR
    verifications:
      allowed_values:
        values: [OCCUR]

  - name: FATEST
    type: str
    label: Findings About Test Name
    derivation:
      literal: Occurrence Indicator

  - name: FACAT
    type: str
    label: Category for Findings About
    derivation:
      literal: REACTOGENICITY

  - name: FASCAT
    type: str
    label: Subcategory for Findings About
    derivation:
      literal: SYSTEMIC

  - name: FAOBJ
    type: str
    label: Object of the Observation
    derivation:
      literal: FEVER
    verifications:
      allowed_values:
        values: [FEVER]

  - name: FAORRES
    type: str
    label: Result or Finding in Original Units
    derivation:
      case:
        branches:
          - when: "VS.VSSTRESU = 'C' AND VS.VSSTRESN >= 38"
            then:
              literal: Y
          - when: "VS.VSSTRESU = 'C' AND VS.VSSTRESN < 38"
            then:
              literal: N
    verifications:
      allowed_values:
        values: [Y, N]

  - name: FASTRESC
    type: str
    label: Character Result/Finding in Std Format
    derivation:
      source: FAORRES
    verifications:
      allowed_values:
        values: [Y, N]

  - name: FAREASND
    type: str
    label: Reason Not Done
    derivation:
      source: VS.VSREASND

  - name: FAEVAL
    type: str
    label: Evaluator
    derivation:
      source: VS.VSEVAL

  - name: FARFTDTC
    type: str
    label: Date/Time of Reference Time Point
    derivation:
      source: VS.VSRFTDTC

  - name: FAEVLINT
    type: str
    label: Evaluation Interval
    derivation:
      source: VS.VSEVLINT

  - name: FAEVINTX
    type: str
    label: Evaluation Interval Text
    derivation:
      source: VS.VSEVINTX

  - name: FADTC
    type: str
    label: Date/Time of Collection
    derivation:
      source: VS.VSDTC

  - name: FADY
    type: int
    label: Study Day of Collection
    derivation:
      source: VS.VSDY

  - name: FATPTREF
    type: str
    label: Time Point Reference
    derivation:
      source: VS.VSTPTREF

  - name: FATPTNUM
    type: float
    label: Time Point Number
    derivation:
      source: VS.VSTPTNUM

  - name: FALNKID
    type: str
    label: Link ID
    derivation:
      source: VS.VSLNKID

  - name: FALNKGRP
    type: str
    label: Link Group ID
    derivation:
      source: VS.VSLNKGRP

  - name: FATPT
    type: str
    label: Planned Time Point Name
    derivation:
      source: VS.VSTPT

  - name: VSSTRESN
    type: float
    label: Numeric Result/Finding in Standard Units
    derivation:
      source: VS.VSSTRESN

rows:
  - id: fever_occurrence
    filter: "VS.VSCAT = 'REACTOGENICITY' AND VS.VSTESTCD = 'TEMP'"
    derivations: {}
