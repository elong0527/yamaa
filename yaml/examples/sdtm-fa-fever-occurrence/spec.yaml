schema_version: "1.0"
domain: FA
datasets:
  VS:
    path: input/vs.csv
    types:
      VSSEQ: int
      VSSTRESN: float
base: VS
keys: [STUDYID, USUBJID, FASEQ]

output:
  columns:
    - STUDYID
    - DOMAIN
    - USUBJID
    - FASEQ
    - FATESTCD
    - FATEST
    - FACAT
    - FASCAT
    - FAOBJ
    - FAORRES
    - FASTRESC
    - VSSTRESN

columns:
  - name: STUDYID
    type: str
    label: Study Identifier

  - name: DOMAIN
    type: str
    label: Domain Abbreviation

  - name: USUBJID
    type: str
    label: Unique Subject Identifier

  - name: FASEQ
    type: int
    label: Sequence Number

  - name: FATESTCD
    type: str
    label: Findings About Test Short Name

  - name: FATEST
    type: str
    label: Findings About Test Name

  - name: FACAT
    type: str
    label: Category for Findings About

  - name: FASCAT
    type: str
    label: Subcategory for Findings About

  - name: FAOBJ
    type: str
    label: Object of the Observation

  - name: FAORRES
    type: str
    label: Result or Finding in Original Units

  - name: FASTRESC
    type: str
    label: Character Result/Finding in Std Format

  - name: VSSTRESN
    type: float
    label: Numeric Result/Finding in Standard Units

rows:
  - id: fever_occurrence
    filter: "VS.VSCAT = 'REACTOGENICITY' AND VS.VSTESTCD = 'TEMP'"
    derivations:
      STUDYID: {source: VS.STUDYID}
      DOMAIN: {literal: FA}
      USUBJID: {source: VS.USUBJID}
      FASEQ: {source: VS.VSSEQ}
      FATESTCD: {literal: OCCUR}
      FATEST: {literal: Occurrence Indicator}
      FACAT: {literal: REACTOGENICITY}
      FASCAT: {literal: SYSTEMIC}
      FAOBJ: {literal: FEVER}
      FAORRES:
        case:
          branches:
            - when: "VS.VSSTRESU = 'C' AND VS.VSSTRESN >= 38"
              then: {literal: Y}
            - when: "VS.VSSTRESU = 'C' AND VS.VSSTRESN < 38"
              then: {literal: N}
      FASTRESC: {source: FAORRES}
      VSSTRESN: {source: VS.VSSTRESN}
