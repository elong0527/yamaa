schema_version: "1.0"
domain: ADAE
datasets:
  AE: input/ae.csv
  ADSL: input/adsl.csv
base: AE
keys: [STUDYID, USUBJID, AESEQ]

output:
  columns: [STUDYID, USUBJID, AESEQ, AETERM, AESTDTC, ASTDT, ASTDTC, ASTDTF, TRTSDT, TRTEMFL]

columns:
  - name: STUDYID
    type: str
    derivation:
      source: AE.STUDYID

  - name: USUBJID
    type: str
    derivation:
      source: AE.USUBJID

  - name: AESEQ
    type: int
    derivation:
      source: AE.AESEQ

  - name: AETERM
    type: str
    derivation:
      source: AE.AETERM

  - name: AESTDTC
    type: str
    derivation:
      source: AE.AESTDTC

  - name: ASTDT
    type: date
    derivation:
      date_impute:
        source: AESTDTC
        month: 6
        day: 15
        missing: null
        invalid: null

  - name: ASTDTC
    type: str
    derivation:
      source: ASTDT

  - name: ASTDTPR
    type: str
    derivation:
      date_precision:
        source: AESTDTC
        missing: null
        invalid: null

  - name: ASTDTF
    type: str
    derivation:
      mapping:
        source: ASTDTPR
        missing: null
        dict:
          D: null
          M: "D"
          Y: "M"
    verifications:
      allowed_values:
        values: ["D", "M"]

  - name: TRTSDT
    type: date
    derivation:
      source: ADSL.TRTSDT

  - name: TRTEMFL
    type: str
    derivation:
      case:
        branches:
          - when: "ASTDT IS NOT NULL AND TRTSDT IS NOT NULL AND ASTDT >= TRTSDT"
            then:
              literal: Y
    verifications:
      allowed_values:
        values: [Y]

verifications:
  - unique:
      columns: [STUDYID, USUBJID, AESEQ]
  - row_count:
      min: 6
      max: 6
  - all_or_none:
      id: analysis-date-completeness
      columns: [ASTDTC, ASTDT]
  - implies:
      id: imputation-flag-requires-an-analysis-date
      when: "ASTDTF IS NOT NULL"
      then: "ASTDT IS NOT NULL"
  - implies:
      id: treatment-emergent-event-has-an-analysis-date
      when: "TRTEMFL = 'Y'"
      then: "ASTDT IS NOT NULL AND ASTDT >= TRTSDT"
