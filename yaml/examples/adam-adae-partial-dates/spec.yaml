schema_version: "1.0"
domain: ADAE
datasets:
  AE: input/ae.csv
  ADSL: input/adsl.csv
base: AE
keys: [STUDYID, USUBJID, AESEQ]

output:
  path: adae.csv
  columns: [STUDYID, USUBJID, AESEQ, AETERM, AESTDTC, ASTDT, ASTDTC, ASTDTF, TRTSDT, TRTEMFL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: AE.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: AE.USUBJID

  - name: AESEQ
    type: int
    label: Sequence Number
    derivation:
      source: AE.AESEQ

  - name: AETERM
    type: str
    label: Reported Term for the Adverse Event
    derivation:
      source: AE.AETERM

  - name: AESTDTC
    type: str
    label: Start Date/Time of Adverse Event
    derivation:
      source: AE.AESTDTC

  - name: TRTSDT
    type: date
    label: Date of First Exposure to Treatment
    derivation:
      source: ADSL.TRTSDT

  - name: ASTDT
    type: date
    label: Analysis Start Date
    derivation:
      date_impute:
        source: AESTDTC
        month: 6
        day: 15
        minimum_source_precision: month
        not_before: TRTSDT
        missing: null
        invalid: null

  - name: ASTDTC
    type: str
    label: Analysis Start Date (C)
    derivation:
      source: ASTDT

  - name: ASTDTPR
    type: str
    label: Analysis Start Date Precision
    derivation:
      date_precision:
        source: ASTDT
        missing: null

  - name: ASTDTF
    type: str
    label: Analysis Start Date Imputation Flag
    derivation:
      case:
        branches:
          - when: "ASTDT IS NOT NULL AND ASTDTPR = 'M'"
            then:
              literal: "D"
    verifications:
      allowed_values:
        values: ["D"]

  - name: TRTEMFL
    type: str
    label: Treatment Emergent Analysis Flag
    derivation:
      case:
        branches:
          - when: "ASTDT IS NOT NULL AND TRTSDT IS NOT NULL AND ASTDT >= TRTSDT"
            then:
              literal: Y
    verifications:
      allowed_values:
        values: [Y]

verifications:
  - unique:
      columns: [STUDYID, USUBJID, AESEQ]
  - row_count:
      min: 10
      max: 10
  - all_or_none:
      id: analysis-date-completeness
      columns: [ASTDTC, ASTDT]
  - implies:
      id: imputation-flag-requires-an-analysis-date
      when: "ASTDTF IS NOT NULL"
      then: "ASTDT IS NOT NULL"
  - implies:
      id: supplied-day-never-precedes-treatment-start
      when: "ASTDTF = 'D'"
      then: "ASTDT >= TRTSDT"
  - implies:
      id: treatment-emergent-event-has-an-analysis-date
      when: "TRTEMFL = 'Y'"
      then: "ASTDT IS NOT NULL AND ASTDT >= TRTSDT"
