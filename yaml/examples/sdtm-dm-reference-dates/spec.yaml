schema_version: "1.0"
domain: DM
datasets:
  DM_RAW: input/dm_raw.csv
  EX: {path: input/ex.csv, types: {EXSEQ: int}}
  DS: input/ds.csv
  AE: input/ae.csv
base: DM_RAW
keys: [STUDYID, USUBJID]

record_lookups:
  - id: LASTEX
    dataset: EX
    filter: "EX.EXENDTC IS NOT NULL"
    order_by: [EX.EXENDTC, EX.EXSEQ]
    keep: last

columns:
  - name: STUDYID
    type: str
    derivation:
      source: DM_RAW.STUDYID

  - name: DOMAIN
    type: str
    derivation:
      literal: DM

  - name: USUBJID
    type: str
    derivation:
      source: DM_RAW.USUBJID

  - name: RFICDTC
    type: date
    derivation:
      source: DM_RAW.RFICDTC
    verifications:
      not_missing: {}

  - name: RFXSTDTC
    type: date
    derivation:
      aggregate:
        filter: "EX.EXSTDTC IS NOT NULL"
        expr: "MIN(EX.EXSTDTC)"

  - name: RFXENDTC
    type: date
    derivation:
      source: LASTEX.EXENDTC

  - name: RFSTDTC
    type: date
    derivation:
      source: RFXSTDTC

  - name: EXDOSE0
    type: float
    output: false
    derivation:
      source: LASTEX.EXDOSE

  - name: DSDT0
    type: date
    output: false
    derivation:
      aggregate:
        filter: "DS.DSCAT = 'DISPOSITION EVENT' AND DS.DSSTDTC IS NOT NULL"
        expr: "MAX(DS.DSSTDTC)"

  - name: AEDT0
    type: date
    output: false
    derivation:
      aggregate:
        filter: "AE.AEENDTC IS NOT NULL"
        expr: "MAX(AE.AEENDTC)"

  - name: RFENDTC
    type: date
    derivation:
      greatest:
        sources: [RFXENDTC, DSDT0, AEDT0]

verifications:
  - unique:
      columns: [STUDYID, USUBJID]
  - row_count:
      min: 4
      max: 4
  - all_or_none:
      id: exposure-reference-completeness
      columns: [RFXSTDTC, RFXENDTC, RFSTDTC, EXDOSE0]
  - implies:
      id: exposure-window-is-ordered
      when: "RFXSTDTC IS NOT NULL AND RFXENDTC IS NOT NULL"
      then: "RFXENDTC >= RFXSTDTC"
  - implies:
      id: consent-precedes-first-exposure
      when: "RFXSTDTC IS NOT NULL"
      then: "RFICDTC <= RFXSTDTC"
  - implies:
      id: participation-ends-no-earlier-than-last-exposure
      when: "RFXENDTC IS NOT NULL"
      then: "RFENDTC >= RFXENDTC"
