schema_version: "1.0.0-rc.1"
domain: TEST
datasets:
  SOURCE:
    path: input/source.csv
    types: {VALUE: float}
base: SOURCE
keys: [ID]

output:
  path: test.csv
  columns: [ID, RESULT]

columns:
  - name: ID
    type: str
    label: Identifier
    derivation:
      source: SOURCE.ID

  - name: RESULT
    type: float
    label: Project Function Result
    derivation:
      function:
        name: project_value
        contract_version: "2.0.0"
        args:
          x: SOURCE.VALUE
