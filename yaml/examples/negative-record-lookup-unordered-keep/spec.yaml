schema_version: "1.0"
domain: ADSL
datasets:
  DM: input/dm.csv
  EX: input/ex.csv
base: DM
keys: [STUDYID, USUBJID]

record_lookups:
  - id: DOSING
    dataset: EX
    order_by: [EX.EXSTDTC, EX.EXSEQ]

output:
  profile: csv
  columns: [STUDYID, USUBJID, TRT01A]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: DM.USUBJID

  - name: TRT01A
    type: str
    label: Actual Treatment for Period 01
    derivation:
      source: DOSING.EXTRT
