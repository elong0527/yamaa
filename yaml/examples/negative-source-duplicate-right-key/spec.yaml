schema_version: "1.0"
domain: ADSL
datasets:
  DM: input/dm.csv
  ADSL_RAW: input/adsl_raw.csv
base: DM
keys: [STUDYID, USUBJID]

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, TRT01A]

rows:
  - id: record
    dataset: DM
    derivations:
      STUDYID: {source: DM.STUDYID}
      USUBJID: {source: DM.USUBJID}

columns:
  - name: STUDYID
    type: str
    label: Study Identifier

  - name: USUBJID
    type: str
    label: Unique Subject Identifier

  - name: TRT01A
    type: str
    label: Actual Treatment for Period 01
    derivation:
      source: ADSL_RAW.TRT01A
