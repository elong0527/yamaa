schema_version: "1.0"
domain: ADSL
datasets:
  DM: input/dm.csv
  ADSL_RAW: input/adsl_raw.csv
base: DM
keys: [STUDYID, USUBJID]

columns:
  - name: STUDYID
    type: str
    derivation:
      source: DM.STUDYID

  - name: USUBJID
    type: str
    derivation:
      source: DM.USUBJID

  - name: TRT01A
    type: str
    derivation:
      source: ADSL_RAW.TRT01A
