schema_version: "1.0"
domain: SUPPMH
datasets:
  MH_PRE: input/mh_pre.csv
base: MH_PRE
keys: [STUDYID, RDOMAIN, USUBJID, IDVAR, IDVARVAL, QNAM]

output:
  profile: csv-v1
  columns: [STUDYID, RDOMAIN, USUBJID, IDVAR, IDVARVAL, QNAM, QLABEL, QVAL, QORIG, QEVAL]
  order_by: [STUDYID, RDOMAIN, USUBJID, IDVAR, IDVARVAL, QNAM]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: MH_PRE.STUDYID

  - name: RDOMAIN
    type: str
    label: Related Domain Abbreviation
    derivation:
      literal: MH

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: MH_PRE.USUBJID

  - name: IDVAR
    type: str
    label: Identifying Variable
    derivation:
      literal: MHSEQ

  - name: IDVARVAL
    type: str
    label: Identifying Variable Value
    derivation:
      source: MH_PRE.MHSEQ
    verifications:
      not_missing: {}

  - name: QNAM
    type: str
    label: Qualifier Variable Name
    verifications:
      allowed_values:
        values: [MHFAMHX, MHCONF]

  - name: QLABEL
    type: str
    label: Qualifier Label

  - name: QVAL
    type: str
    label: Data Value
    verifications:
      - not_missing: {}
      - allowed_values:
          values: [Y, N]

  - name: QORIG
    type: str
    label: Origin
    derivation:
      literal: CRF

  - name: QEVAL
    type: str
    label: Evaluator
    derivation:
      literal: null

rows:
  - id: family_history
    filter: "MH_PRE.MHFAMHX IS NOT NULL"
    derivations:
      QNAM:
        literal: MHFAMHX
      QLABEL:
        literal: Family History
      QVAL:
        source: MH_PRE.MHFAMHX

  - id: medical_record_confirmation
    filter: "MH_PRE.MHCONF IS NOT NULL"
    derivations:
      QNAM:
        literal: MHCONF
      QLABEL:
        literal: Confirmed by Medical Records
      QVAL:
        source: MH_PRE.MHCONF

verifications:
  - unique:
      columns: [STUDYID, RDOMAIN, USUBJID, IDVAR, IDVARVAL, QNAM]
  - row_count:
      min: 7
      max: 7
  - implies:
      id: qualifier-value-has-parent-identifier
      when: "QVAL IS NOT NULL"
      then: "RDOMAIN IS NOT NULL AND IDVAR IS NOT NULL AND IDVARVAL IS NOT NULL"
