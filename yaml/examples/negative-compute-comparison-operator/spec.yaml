schema_version: "1.0"
domain: ADLB
datasets:
  LB: input/lb.csv
base: LB
keys: [STUDYID, USUBJID, PARAMCD]

output:
  columns: [STUDYID, USUBJID, PARAMCD, AVAL, ANRHI, HIFL]

columns:
  - name: STUDYID
    type: str
    derivation:
      source: LB.STUDYID

  - name: USUBJID
    type: str
    derivation:
      source: LB.USUBJID

  - name: PARAMCD
    type: str
    derivation:
      source: LB.LBTESTCD

  - name: AVAL
    type: float
    derivation:
      source: LB.LBSTRESN

  - name: ANRHI
    type: float
    derivation:
      source: LB.LBSTNRHI

  - name: HIFL
    type: int
    derivation:
      compute:
        expr: "AVAL > ANRHI"
