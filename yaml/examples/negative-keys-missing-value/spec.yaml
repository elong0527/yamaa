schema_version: "1.0.0-rc.1"
domain: ADVS
datasets:
  ADVSPRE: input/advs_pre.csv
base: ADVSPRE
keys: [STUDYID, USUBJID, PARAMCD, AVISIT]

output:
  path: advs.csv
  columns: [STUDYID, USUBJID, PARAMCD, VSSEQ, ADT, ADY, AVAL, AVISIT]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: ADVSPRE.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: ADVSPRE.USUBJID

  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation:
      source: ADVSPRE.PARAMCD

  - name: VSSEQ
    type: int
    label: Sequence Number
    derivation:
      source: ADVSPRE.VSSEQ

  - name: ADT
    type: date
    label: Analysis Date
    derivation:
      source: ADVSPRE.ADT

  - name: ADY
    type: int
    label: Analysis Relative Day
    derivation:
      source: ADVSPRE.ADY

  - name: AVAL
    type: float
    label: Analysis Value
    derivation:
      source: ADVSPRE.AVAL

  - name: AVISIT
    type: str
    label: Analysis Visit
    derivation:
      cut:
        source: ADY
        breaks: [0, 2, 22, 43]
        labels: [SCREENING, BASELINE, WEEK 2, WEEK 4, POST-TREATMENT]
        right: false
        missing: null
