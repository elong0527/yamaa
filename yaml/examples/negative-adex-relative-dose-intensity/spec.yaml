schema_version: "1.0"
domain: ADEX
datasets:
  TRT: input/subject_treatment.csv
  EX: input/ex.csv
base: TRT
keys: [STUDYID, USUBJID, EXTRT]

columns:
  - name: STUDYID
    type: str
    derivation:
      source: TRT.STUDYID

  - name: USUBJID
    type: str
    derivation:
      source: TRT.USUBJID

  - name: EXTRT
    type: str
    derivation:
      source: TRT.EXTRT

  - name: EXDOSU
    type: str
    derivation:
      source: TRT.EXDOSU

  - name: DOSECUM
    type: float
    derivation:
      aggregate: "SUM(EX.EXDOSE)"

  - name: RDI
    type: float
    derivation:
      aggregate: "100 * SUM(EX.EXDOSE) / EX.EXPLDOS"
