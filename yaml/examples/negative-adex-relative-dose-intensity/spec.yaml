schema_version: "1.0"
domain: ADEX
datasets:
  TRT: input/subject_treatment.csv
  EX: {path: input/ex.csv, types: {EXDOSE: float, EXPLDOS: float}}
base: TRT
keys: [STUDYID, USUBJID, EXTRT]

output:
  path: adex.csv
  columns: [STUDYID, USUBJID, EXTRT, EXDOSU, DOSECUM, RDI]

rows:
  - id: record
    dataset: TRT
    derivations:
      STUDYID: {source: TRT.STUDYID}
      USUBJID: {source: TRT.USUBJID}
      EXTRT: {source: TRT.EXTRT}

columns:
  - name: STUDYID
    type: str
    label: Study Identifier

  - name: USUBJID
    type: str
    label: Unique Subject Identifier

  - name: EXTRT
    type: str
    label: Name of Treatment

  - name: EXDOSU
    type: str
    label: Dose Units
    derivation:
      source: TRT.EXDOSU

  - name: DOSECUM
    type: float
    label: Cumulative Dose
    derivation:
      aggregate: "SUM(EX.EXDOSE)"

  - name: RDI
    type: float
    label: Relative Dose Intensity
    derivation:
      aggregate: "100 * SUM(EX.EXDOSE) / EX.EXPLDOS"
