schema_version: "1.0"
domain: ADEX
datasets:
  TRT: input/subject_treatment.csv
  EX: {path: input/ex.csv, types: {EXDOSE: float, EXPLDOS: float}}
base: TRT
keys: [STUDYID, USUBJID, EXTRT]

output:
  profile: csv
  columns: [STUDYID, USUBJID, EXTRT, EXDOSU, DOSECUM, RDI]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: TRT.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: TRT.USUBJID

  - name: EXTRT
    type: str
    label: Name of Treatment
    derivation:
      source: TRT.EXTRT

  - name: EXDOSU
    type: str
    label: Dose Units
    derivation:
      source: TRT.EXDOSU

  - name: DOSECUM
    type: float
    label: Cumulative Dose
    derivation:
      aggregate: "SUM(EX.EXDOSE)"

  - name: RDI
    type: float
    label: Relative Dose Intensity
    derivation:
      aggregate: "100 * SUM(EX.EXDOSE) / EX.EXPLDOS"
