schema_version: "1.0"
domain: ADSL
datasets:
  ADSLPRE: input/adsl_pre.csv
  DS: input/ds.csv
base: ADSLPRE
keys: [STUDYID, USUBJID]

record_lookups:
  - id: COMPLT
    dataset: DS
    filter: "DS.DSDECOD = 'COMPLETED'"
    unmatched: missing

output:
  profile: csv
  columns: [STUDYID, USUBJID, TRTSDT, COMPFL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: ADSLPRE.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: ADSLPRE.USUBJID

  - name: TRTSDT
    type: date
    label: Date of First Exposure to Treatment
    derivation:
      source: ADSLPRE.TRTSDT

  - name: COMPREC
    type: str
    label: Completion Disposition Term
    derivation:
      source: COMPLT.DSDECOD

  - name: COMPFL
    type: str
    label: Completion Flag
    derivation:
      case:
        branches:
          - when: "COMPREC IS NOT NULL"
            then:
              literal: Y
        otherwise:
          literal: N
    verifications:
      allowed_values:
        values: [Y, N]

verifications:
  - unique:
      columns: [STUDYID, USUBJID]
  - row_count:
      min: 4
      max: 4
  - implies:
      id: completer-received-treatment
      when: "COMPFL = 'Y'"
      then: "TRTSDT IS NOT NULL"
