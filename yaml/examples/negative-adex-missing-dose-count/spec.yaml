schema_version: "1.0"
domain: ADEX
datasets:
  EX:
    path: input/ex.csv
    types: {EXSEQ: int, EXDOSE: float, EXDOSCNT: int}

base: EX
expand:
  count: EX.EXDOSCNT
  index: ADOSEN
keys: [STUDYID, USUBJID, EXSEQ, ADOSEN]
output:
  columns: [STUDYID, USUBJID, EXSEQ, EXTRT, EXDOSE, EXDOSU, ASTDT, AENDT, ADOSEN]
columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation: {source: EX.STUDYID}
  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: {source: EX.USUBJID}
  - name: EXSEQ
    type: int
    label: Sequence Number
    derivation: {source: EX.EXSEQ}
  - name: EXTRT
    type: str
    label: Name of Treatment
    derivation: {source: EX.EXTRT}
  - name: EXDOSE
    type: float
    label: Dose per Administration
    derivation: {source: EX.EXDOSE}
  - name: EXDOSU
    type: str
    label: Dose Units
    derivation: {source: EX.EXDOSU}
  - name: ASTDT
    type: date
    label: Analysis Start Date
    derivation: {source: EX.EXSTDTC}
  - name: AENDT
    type: date
    label: Analysis End Date
    derivation: {source: EX.EXENDTC}
  - name: ADOSEN
    type: int
    label: Administration Number
