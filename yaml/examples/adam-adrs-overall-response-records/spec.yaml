schema_version: "1.0"
domain: ADRS
datasets:
  RS: input/rs.csv
  ADSL: input/adsl.csv
base: RS
keys: [STUDYID, USUBJID, RSSEQ]

output:
  profile: csv-v1
  columns: [STUDYID, USUBJID, RSSEQ, PARAMCD, PARAM, RSDTC, ADT, ADY, AVALC, AVAL, ANL01FL]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: RS.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: RS.USUBJID

  - name: RSSEQ
    type: int
    label: Sequence Number
    derivation:
      source: RS.RSSEQ

  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation:
      literal: OVR

  - name: PARAM
    type: str
    label: Parameter
    derivation:
      literal: Overall Response by Investigator

  - name: RSDTC
    type: str
    label: Date/Time of Assessment
    derivation:
      source: RS.RSDTC

  - name: ADT
    type: date
    label: Analysis Date
    derivation:
      date_impute:
        source: RSDTC
        month: 1
        day: 1
    verifications:
      not_missing: {}

  - name: AVALC
    type: str
    label: Analysis Value (C)
    derivation:
      source: RS.RSSTRESC
    verifications:
      allowed_values:
        values: [CR, PR, SD, NON-CR/NON-PD, PD, NE]

  - name: AVAL
    type: int
    label: Analysis Value
    derivation:
      mapping:
        source: AVALC
        dict:
          CR: 1
          PR: 2
          SD: 3
          NON-CR/NON-PD: 4
          PD: 5
          NE: 6
    verifications:
      range:
        min: 1
        max: 6

  - name: TRTSDT
    type: date
    label: Date of First Exposure to Treatment
    derivation:
      source: ADSL.TRTSDT

  - name: ADY
    type: int
    label: Analysis Relative Day
    derivation:
      study_day:
        date: ADT
        reference: TRTSDT

  - name: WORSTAVAL
    type: int
    label: Worst Analysis Value
    derivation:
      aggregate:
        expr: "MAX(AVAL)"
        group_by: [STUDYID, USUBJID, ADT]

  - name: WORSTORD
    type: int
    label: Worst Response Order
    derivation:
      row_number:
        group_by: [STUDYID, USUBJID, ADT]
        order_by: [RSSEQ]
        filter: "AVAL = WORSTAVAL"

  - name: ANL01FL
    type: str
    label: Analysis Record Flag 01
    derivation:
      case:
        branches:
          - when: "WORSTORD = 1"
            then:
              literal: Y
    verifications:
      allowed_values:
        values: [Y]

rows:
  - id: overall_response
    filter: "RS.RSTESTCD = 'OVRLRESP' AND RS.RSEVAL = 'INVESTIGATOR'"
    derivations: {}

verifications:
  - unique:
      columns: [STUDYID, USUBJID, RSSEQ]
  - row_count:
      min: 10
      max: 10
  - implies:
      id: analysis-flag-marks-the-worst-response-of-its-date
      when: "ANL01FL = 'Y'"
      then: "AVAL = WORSTAVAL"
  - implies:
      id: assessment-is-not-before-treatment-start
      when: "ADT IS NOT NULL"
      then: "ADY >= 1"
