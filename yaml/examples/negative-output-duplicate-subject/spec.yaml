schema_version: "1.0"
domain: ADSL
datasets:
  DM: input/dm.csv
keys: [STUDYID, USUBJID]

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, AGE, SEX]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier

  - name: AGE
    type: int
    label: Age
    derivation:
      source: DM.AGE

  - name: SEX
    type: str
    label: Sex
    derivation:
      source: DM.SEX

rows:
  - id: record
    derivations:
      USUBJID: {source: DM.USUBJID}
