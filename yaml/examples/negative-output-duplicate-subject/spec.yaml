schema_version: "1.0.0-rc.1"
domain: ADSL
datasets:
  DM: input/dm.csv
base: DM
keys: [STUDYID, USUBJID]

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, AGE, SEX]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: DM.USUBJID

  - name: AGE
    type: int
    label: Age
    derivation:
      source: DM.AGE

  - name: SEX
    type: str
    label: Sex
    derivation:
      source: DM.SEX
