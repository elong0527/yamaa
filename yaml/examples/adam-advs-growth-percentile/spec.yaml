schema_version: "1.0"
domain: ADVS
datasets:
  ADVSPRE: input/advs_pre.csv
  LMS:
    path: input/lms_ref.csv
    types: {L: float, M: float, S: float, AGE: int}
base: ADVSPRE
keys: [STUDYID, USUBJID, AVISIT, PARAMCD]

record_lookups:
  - id: GROWTH
    dataset: LMS
    source: [ADVSPRE.PARAMCD, ADVSPRE.SEX, ADVSPRE.AGE]
    key: [PARAMCD, SEX, AGE]
    unmatched: missing

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: ADVSPRE.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: ADVSPRE.USUBJID

  - name: AVISIT
    type: str
    label: Analysis Visit
    derivation:
      source: ADVSPRE.AVISIT

  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation:
      case:
        branches:
          - when: "ADVSPRE.PARAMCD = 'BMI'"
            then:
              literal: BMIPCTL
          - when: "ADVSPRE.PARAMCD = 'WEIGHT'"
            then:
              literal: WGTPCTL
    verifications:
      allowed_values:
        values: [BMIPCTL, WGTPCTL]

  - name: PARAM
    type: str
    label: Parameter
    derivation:
      case:
        branches:
          - when: "PARAMCD = 'BMIPCTL'"
            then:
              literal: BMI-for-Age Percentile
          - when: "PARAMCD = 'WGTPCTL'"
            then:
              literal: Weight-for-Age Percentile

  - name: AVAL
    type: float
    label: Analysis Value
    derivation:
      case:
        branches:
          - when: "ZNUM IS NOT NULL"
            then:
              function:
                name: growth_percentile
                args:
                  z: ZNUM

  - name: ZNUM
    type: float
    label: Growth Z-Score
    output: false
    derivation:
      compute:
        expr: "(POWER(AVALSRC / LMS_M, LMS_L) - 1) / (LMS_L * LMS_S)"

  - name: LMS_M
    type: float
    label: Growth Reference Median
    output: false
    derivation:
      source: GROWTH.M

  - name: LMS_L
    type: float
    label: Growth Reference Skewness
    output: false
    derivation:
      source: GROWTH.L

  - name: LMS_S
    type: float
    label: Growth Reference Coefficient of Variation
    output: false
    derivation:
      source: GROWTH.S

  - name: AVALSRC
    type: float
    label: Source Analysis Value
    output: false
    derivation:
      source: ADVSPRE.AVAL

verifications:
  - unique:
      columns: [STUDYID, USUBJID, AVISIT, PARAMCD]
  - row_count:
      min: 5
      max: 5
  - implies:
      id: percentile-requires-a-growth-reference
      when: "AVAL IS NOT NULL"
      then: "LMS_M IS NOT NULL"
