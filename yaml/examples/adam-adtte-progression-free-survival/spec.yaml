schema_version: "1.0"
domain: ADTTE
datasets:
  ADSL: input/adsl.csv
  RS: {path: input/rs.csv, types: {RSSEQ: int}}
  DS: {path: input/ds.csv, types: {DSSEQ: int}}
base: ADSL
keys: [STUDYID, USUBJID, PARAMCD]

record_lookups:
  - id: PROGRESSION
    dataset: RS
    filter: "RS.RSTESTCD = 'OVRLRESP' AND RS.RSSTRESC = 'PD' AND RS.ADEQFL = 'Y'"
    order_by: [RS.RSDTC, RS.RSSEQ]
    keep: first
  - id: DEATH
    dataset: DS
    filter: "DS.DSDECOD = 'DEATH'"
    order_by: [DS.DSDTC, DS.DSSEQ]
    keep: first
  - id: LASTASSESS
    dataset: RS
    filter: "RS.RSTESTCD = 'OVRLRESP' AND RS.ADEQFL = 'Y'"
    order_by: [RS.RSDTC, RS.RSSEQ]
    keep: last

output:
  profile: csv
  columns: [STUDYID, USUBJID, PARAMCD, PARAM, STARTDT, ADT, AVAL, CNSR, EVNTDESC, SRCDOM, SRCVAR, SRCSEQ]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: ADSL.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: ADSL.USUBJID

  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation:
      literal: PFS

  - name: PARAM
    type: str
    label: Parameter
    derivation:
      literal: Progression-Free Survival

  - name: STARTDT
    type: date
    label: Time-to-Event Origin Date
    derivation:
      source: ADSL.RANDDT

  - name: PDDT
    type: date
    label: Disease Progression Date
    derivation:
      source: PROGRESSION.RSDTC

  - name: PDSEQ
    type: int
    label: Disease Progression Source Sequence Number
    derivation:
      source: PROGRESSION.RSSEQ

  - name: DEATHDT
    type: date
    label: Death Date
    derivation:
      source: DEATH.DSDTC

  - name: DEATHSEQ
    type: int
    label: Death Source Sequence Number
    derivation:
      source: DEATH.DSSEQ

  - name: CENSORDT
    type: date
    label: Censoring Date
    derivation:
      source: LASTASSESS.RSDTC

  - name: CENSORSEQ
    type: int
    label: Censoring Source Sequence Number
    derivation:
      source: LASTASSESS.RSSEQ

  - name: EVENTDT
    type: date
    label: Event Date
    derivation:
      least:
        sources: [PDDT, DEATHDT]

  - name: ADT
    type: date
    label: Analysis Date
    derivation:
      coalesce:
        sources: [EVENTDT, CENSORDT]

  - name: AVAL
    type: int
    label: Analysis Value
    derivation:
      date_diff:
        start: STARTDT
        end: ADT
        unit: day
        bounds: inclusive

  - name: CNSR
    type: int
    label: Censor
    derivation:
      case:
        branches:
          - when: "EVENTDT IS NOT NULL"
            then:
              literal: 0
        otherwise:
          literal: 1

  - name: EVNTDESC
    type: str
    label: Event or Censoring Description
    derivation:
      case:
        branches:
          - when: "EVENTDT IS NULL"
            then:
              literal: CENSORED
          - when: "PDDT IS NOT NULL AND (DEATHDT IS NULL OR PDDT <= DEATHDT)"
            then:
              literal: DISEASE PROGRESSION
        otherwise:
          literal: DEATH

  - name: SRCDOM
    type: str
    label: Source Data
    derivation:
      case:
        branches:
          - when: "EVNTDESC = 'DEATH'"
            then:
              literal: DS
        otherwise:
          literal: RS

  - name: SRCVAR
    type: str
    label: Source Variable
    derivation:
      case:
        branches:
          - when: "EVNTDESC = 'DEATH'"
            then:
              literal: DSDTC
        otherwise:
          literal: RSDTC

  - name: SRCSEQ
    type: int
    label: Source Sequence Number
    derivation:
      case:
        branches:
          - when: "EVNTDESC = 'DISEASE PROGRESSION'"
            then:
              source: PDSEQ
          - when: "EVNTDESC = 'DEATH'"
            then:
              source: DEATHSEQ
        otherwise:
          source: CENSORSEQ

verifications:
  - row_count:
      min: 5
      max: 5
  - all_or_none:
      id: traceability-triplet-is-complete
      columns: [SRCDOM, SRCVAR, SRCSEQ]
  - predicate:
      id: endpoint-is-not-before-randomization
      assert: "ADT >= STARTDT"
