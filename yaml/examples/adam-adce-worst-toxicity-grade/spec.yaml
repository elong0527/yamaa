schema_version: "1.0"
domain: ADCE
datasets:
  CE: input/ce.csv
base: CE
keys: [STUDYID, USUBJID, CESEQ]

columns:
  - name: STUDYID
    type: str
    derivation:
      source: CE.STUDYID

  - name: USUBJID
    type: str
    derivation:
      source: CE.USUBJID

  - name: CESEQ
    type: int
    derivation:
      source: CE.CESEQ

  - name: CETERM
    type: str
    derivation:
      source: CE.CETERM

  - name: ASTDT
    type: date
    derivation:
      source: CE.ASTDT

  - name: ASEV
    type: str
    derivation:
      source: CE.CESEV
    verifications:
      allowed_values:
        values: [MILD, MODERATE, SEVERE]

  - name: ASEVN
    type: int
    derivation:
      mapping:
        source: ASEV
        dict: {MILD: 1, MODERATE: 2, SEVERE: 3}
    verifications:
      allowed_values:
        values: [1, 2, 3]

  - name: ATOXGR
    type: str
    derivation:
      str_template: "GRADE {ASEVN}"
    verifications:
      allowed_values:
        values: [GRADE 1, GRADE 2, GRADE 3]

  - name: ATOXGRN
    type: int
    derivation:
      source: ASEVN

  - name: WGRSEQ
    type: int
    output: false
    derivation:
      row_number:
        group_by: [STUDYID, USUBJID]
        order_by:
          - {variable: ASEVN, direction: desc}
          - ASTDT
          - CESEQ
        filter: "ASEVN IS NOT NULL"

  - name: AOCCFL
    type: str
    derivation:
      case:
        branches:
          - when: "WGRSEQ = 1"
            then:
              literal: Y
    verifications:
      allowed_values:
        values: [Y]

verifications:
  - unique:
      columns: [STUDYID, USUBJID, CESEQ]
  - row_count:
      min: 7
      max: 7
  - implies:
      id: worst-grade-flag-requires-a-graded-event
      when: "AOCCFL = 'Y'"
      then: "ASEV IS NOT NULL"
  - implies:
      id: worst-grade-flag-is-unique-within-subject
      when: "AOCCFL = 'Y'"
      then: "WGRSEQ = 1"
