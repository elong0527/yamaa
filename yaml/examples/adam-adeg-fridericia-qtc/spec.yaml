schema_version: "1.0"
domain: ADEG
datasets:
  ADEG: input/adeg.csv
base: ADEG
keys: [STUDYID, USUBJID, PARAMCD, AVISIT]

record_lookups:
  - id: RR_REC
    dataset: ADEG
    filter: "ADEG.PARAMCD = 'RR'"
    source: [ADEG.STUDYID, ADEG.USUBJID, ADEG.AVISIT]
    key: [STUDYID, USUBJID, AVISIT]
    unmatched: missing

output:
  columns: [STUDYID, USUBJID, PARAMCD, PARAM, AVISIT, AVAL, AVALU]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: ADEG.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: ADEG.USUBJID

  - name: PARAMCD
    type: str
    label: Parameter Code

  - name: PARAM
    type: str
    label: Parameter

  - name: AVISIT
    type: str
    label: Analysis Visit
    derivation:
      source: ADEG.AVISIT

  - name: AVAL
    type: float
    label: Analysis Value

  - name: AVALU
    type: str
    label: Analysis Value Unit

rows:
  - id: original
    derivations:
      PARAMCD:
        source: ADEG.PARAMCD
      PARAM:
        source: ADEG.PARAM
      AVAL:
        source: ADEG.AVAL
      AVALU:
        source: ADEG.AVALU
  - id: qtcfr
    filter: "ADEG.PARAMCD = 'QT'"
    derivations:
      PARAMCD:
        literal: QTCFR
      PARAM:
        literal: "QTcF - Fridericia's Correction Formula Rederived (ms)"
      AVAL:
        compute:
          expr: "ADEG.AVAL / POWER(RR_REC.AVAL / 1000, 1 / 3)"
      AVALU:
        literal: ms

verifications:
  - unique:
      columns: [STUDYID, USUBJID, PARAMCD, AVISIT]
  - row_count:
      min: 8
      max: 8
  - implies:
      id: derived-parameter-has-expected-unit
      when: "PARAMCD = 'QTCFR'"
      then: "AVALU = 'ms'"
