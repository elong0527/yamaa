schema_version: "1.0"
domain: ADEG
datasets:
  ADEG: input/adeg.csv
base: ADEG
keys: [STUDYID, USUBJID, PARAMCD, AVISIT]

record_lookups:
  - id: RR_REC
    dataset: ADEG
    filter: "ADEG.PARAMCD = 'RR'"
    source: [STUDYID, USUBJID, AVISIT]
    key: [STUDYID, USUBJID, AVISIT]
    unmatched: missing

output:
  columns: [STUDYID, USUBJID, PARAMCD, PARAM, AVISIT, AVAL, AVALU]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: ADEG.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: ADEG.USUBJID

  - name: PARAMCD
    type: str
    label: Parameter Code

  - name: PARAM
    type: str
    label: Parameter

  - name: AVISIT
    type: str
    label: Analysis Visit
    derivation:
      source: ADEG.AVISIT

  - name: QTVAL
    type: float
    label: Source QT Interval
    output: false
    derivation:
      source: ADEG.AVAL

  - name: RRVAL
    type: float
    label: Source RR Interval
    output: false
    derivation:
      source: RR_REC.AVAL

  - name: AVAL
    type: float
    label: Analysis Value
    derivation:
      case:
        branches:
          - when: "PARAMCD = 'QTCFR'"
            then:
              compute:
                expr: "QTVAL / POWER(RRVAL / 1000, 1 / 3)"
        otherwise:
          source: ADEG.AVAL

  - name: AVALU
    type: str
    label: Analysis Value Unit
    derivation:
      case:
        branches:
          - when: "PARAMCD = 'QTCFR'"
            then:
              literal: ms
        otherwise:
          source: ADEG.AVALU

rows:
  - id: original
    derivations:
      PARAMCD:
        source: ADEG.PARAMCD
      PARAM:
        source: ADEG.PARAM
  - id: qtcfr
    filter: "ADEG.PARAMCD = 'QT'"
    derivations:
      PARAMCD:
        literal: QTCFR
      PARAM:
        literal: "QTcF - Fridericia's Correction Formula Rederived (ms)"

verifications:
  - unique:
      columns: [STUDYID, USUBJID, PARAMCD, AVISIT]
  - row_count:
      min: 8
      max: 8
  - implies:
      id: derived-parameter-has-expected-unit
      when: "PARAMCD = 'QTCFR'"
      then: "AVALU = 'ms'"
