schema_version: "1.0"
domain: ADEG
datasets:
  ADEG_IN: input/adeg.csv
base: ADEG_IN
keys: [STUDYID, USUBJID, PARAMCD, AVISIT]

record_lookups:
  - id: RR_REC
    dataset: ADEG_IN
    filter: "ADEG_IN.PARAMCD = 'RR'"
    source: [ADEG_IN.STUDYID, ADEG_IN.USUBJID, ADEG_IN.AVISIT]
    key: [STUDYID, USUBJID, AVISIT]
    unmatched: missing

output:
  columns: [STUDYID, USUBJID, PARAMCD, PARAM, AVISIT, AVAL, AVALU]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: ADEG_IN.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: ADEG_IN.USUBJID

  - name: PARAMCD
    type: str
    label: Parameter Code

  - name: PARAM
    type: str
    label: Parameter

  - name: AVISIT
    type: str
    label: Analysis Visit
    derivation:
      source: ADEG_IN.AVISIT

  - name: AVAL
    type: float
    label: Analysis Value

  - name: AVALU
    type: str
    label: Analysis Value Unit

rows:
  - id: original
    derivations:
      PARAMCD:
        source: ADEG_IN.PARAMCD
      PARAM:
        source: ADEG_IN.PARAM
      AVAL:
        source: ADEG_IN.AVAL
      AVALU:
        source: ADEG_IN.AVALU
  - id: qtcfr
    filter: "ADEG_IN.PARAMCD = 'QT'"
    derivations:
      PARAMCD:
        literal: QTCFR
      PARAM:
        literal: "QTcF - Fridericia's Correction Formula Rederived (ms)"
      AVAL:
        compute:
          expr: "ADEG_IN.AVAL / POWER(RR_REC.AVAL / 1000, 1 / 3)"
      AVALU:
        literal: ms

verifications:
  - unique:
      columns: [STUDYID, USUBJID, PARAMCD, AVISIT]
  - row_count:
      min: 8
      max: 8
  - implies:
      id: derived-parameter-has-expected-unit
      when: "PARAMCD = 'QTCFR'"
      then: "AVALU = 'ms'"
