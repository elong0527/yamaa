schema_version: "1.0"
domain: ADEG
datasets:
  ADEG_IN: {path: input/adeg.csv, types: {AVAL: float}}
base: ADEG_IN
keys: [STUDYID, USUBJID, PARAMCD, AVISIT]

output:
  path: adeg.csv
  columns: [STUDYID, USUBJID, PARAMCD, PARAM, AVISIT, AVAL, AVALU]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: ADEG_IN.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: ADEG_IN.USUBJID

  - name: PARAMCD
    type: str
    label: Parameter Code

  - name: PARAM
    type: str
    label: Parameter

  - name: AVISIT
    type: str
    label: Analysis Visit
    derivation:
      source: ADEG_IN.AVISIT

  - name: QTVAL
    type: float
    label: QT Interval

  - name: RRVAL
    type: float
    label: RR Interval

  - name: AVAL
    type: float
    label: Analysis Value

  - name: AVALU
    type: str
    label: Analysis Value Unit

rows:
  - id: original
    derivations:
      PARAMCD:
        source: ADEG_IN.PARAMCD
      PARAM:
        source: ADEG_IN.PARAM
      AVAL:
        source: ADEG_IN.AVAL
      QTVAL:
        literal: null
      RRVAL:
        literal: null
      AVALU:
        source: ADEG_IN.AVALU
  - id: qtcfr
    group_by: [ADEG_IN.STUDYID, ADEG_IN.USUBJID, ADEG_IN.AVISIT]
    filter: "QTVAL IS NOT NULL AND RRVAL IS NOT NULL"
    derivations:
      PARAMCD:
        literal: QTCFR
      PARAM:
        literal: "QTcF - Fridericia's Correction Formula Rederived (ms)"
      QTVAL:
        aggregate:
          filter: "ADEG_IN.PARAMCD = 'QT'"
          expr: "ONLY(ADEG_IN.AVAL)"
      RRVAL:
        aggregate:
          filter: "ADEG_IN.PARAMCD = 'RR'"
          expr: "ONLY(ADEG_IN.AVAL)"
      AVAL:
        compute:
          expr: "QTVAL / POWER(RRVAL / 1000, 1 / 3)"
      AVALU:
        literal: ms

verifications:
  - unique:
      columns: [STUDYID, USUBJID, PARAMCD, AVISIT]
  - row_count:
      min: 8
      max: 8
  - implies:
      id: derived-parameter-has-expected-unit
      when: "PARAMCD = 'QTCFR'"
      then: "AVALU = 'ms'"
