domain: ADSL
datasets:
  DM: input/dm.csv
base: DM
keys: [STUDYID, USUBJID]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: DM.USUBJID

  - name: SEX
    type: str
    label: Sex
    verifications:
      - not_missing: {}
      - allowed_values:
          values: [M, F]
    derivation:
      mapping:
        source: DM.SEX
        case_sensitive: false
        dict:
          M: M
          F: F

  - name: SEXN
    type: int
    label: Sex (N)
    derivation:
      mapping:
        source: DM.SEX
        case_sensitive: false
        dict:
          M: 1
          F: 2

  - name: SEXDECOD
    type: str
    label: Sex Decoded
    derivation:
      mapping:
        source: DM.SEX
        case_sensitive: false
        dict:
          M: Male
          F: Female

  - name: RACE
    type: str
    label: Race
    derivation:
      source: DM.RACE

  - name: RACEN
    type: int
    label: Race (N)
    derivation:
      mapping:
        source: DM.RACE
        dict:
          WHITE: 1
          BLACK OR AFRICAN AMERICAN: 2
          ASIAN: 3
        unmapped:
          literal: 99

verifications:
  - unique:
      columns: [STUDYID, USUBJID]
  - row_count:
      min: 6
      max: 6
