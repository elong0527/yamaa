domain: ADSL
datasets:
  DM: input/dm.csv
base: DM
keys: [STUDYID, USUBJID]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: DM.USUBJID

  - name: SEX
    type: str
    label: Sex
    verifications:
      - not_missing: {}
      - allowed_values:
          values: [M, F, U]
      - matches:
          pattern: '^[MFU]$'
    derivation:
      mapping:
        source: DM.SEX
        case_sensitive: false
        dict:
          M: M
          F: F
          U: U
        missing: U
        unmapped: U

  - name: SEXN
    type: int
    label: Sex (N)
    derivation:
      mapping:
        source: DM.SEX
        case_sensitive: false
        dict:
          M: 1
          F: 2
          U: 0
        missing: 0
        unmapped: 0

  - name: SEXDECOD
    type: str
    label: Sex Decoded
    derivation:
      mapping:
        source: DM.SEX
        case_sensitive: false
        dict:
          M: Male
          F: Female
          U: Unknown
        missing: Unknown
        unmapped: Unknown

  - name: RACE
    type: str
    label: Race
    derivation:
      source: DM.RACE

  - name: RACEN
    type: int
    label: Race (N)
    derivation:
      mapping:
        source: DM.RACE
        dict:
          WHITE: 1
          BLACK OR AFRICAN AMERICAN: 2
          ASIAN: 3
        missing: 99
        unmapped: 99

  - name: AGE
    type: int
    label: Age
    verifications:
      - range:
          min: 0
          max: 120
    derivation:
      value:
        source: DM.AGE
      conversion_failure: null

  - name: AGEGR1
    type: str
    label: Pooled Age Group 1
    derivation:
      cut:
        source: AGE
        breaks: [18, 65]
        labels: ['<18', '18-64', '>=65']
        missing: UNKNOWN

verifications:
  - unique:
      columns: [STUDYID, USUBJID]
  - row_count:
      min: 8
      max: 8
  - predicate:
      id: numeric-mappings-are-in-range
      assert: "SEXN >= 0 AND RACEN >= 1"
