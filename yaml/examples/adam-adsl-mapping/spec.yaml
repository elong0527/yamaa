domain: ADSL
datasets:
  DM: input/dm.csv
base: DM
keys: [STUDYID, USUBJID]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: DM.USUBJID

  - name: SEX
    type: str
    label: Sex
    derivation:
      source: DM.SEX
      operations:
        - mapping:
            case_sensitive: false
            dict:
              M: M
              F: F

  - name: SEXN
    type: int
    label: Sex (N)
    derivation:
      source: DM.SEX
      operations:
        - mapping:
            case_sensitive: false
            dict:
              M: 1
              F: 2

  - name: SEXDECOD
    type: str
    label: Sex Decoded
    derivation:
      source: DM.SEX
      operations:
        - mapping:
            case_sensitive: false
            dict:
              M: Male
              F: Female

  - name: RACE
    type: str
    label: Race
    derivation:
      source: DM.RACE

  - name: RACEN
    type: int
    label: Race (N)
    derivation:
      source: DM.RACE
      operations:
        - mapping:
            dict:
              WHITE: 1
              BLACK OR AFRICAN AMERICAN: 2
              ASIAN: 3
      exception:
        - unmapped:
            default: 99
