schema_version: "1.0"
domain: VS
datasets:
  VS_RAW: input/vs_raw.csv
base: VS_RAW
keys: [STUDYID, USUBJID, VSSEQ]

output:
  columns: [STUDYID, DOMAIN, USUBJID, VSSEQ, VISIT, VSTESTCD, VSTEST, VSORRES, VSORRESU, VSSTRESN, VSSTRESC, VSSTRESU]

columns:
  - name: STUDYID
    type: str
    derivation:
      source: VS_RAW.STUDYID

  - name: DOMAIN
    type: str
    derivation:
      literal: VS

  - name: USUBJID
    type: str
    derivation:
      source: VS_RAW.USUBJID

  - name: VSSEQ
    type: int
    derivation:
      source: VS_RAW.VSSEQ
    verifications:
      not_missing: {}

  - name: VISIT
    type: str
    derivation:
      source: VS_RAW.VISIT

  - name: VSTESTCD
    type: str
    derivation:
      source: VS_RAW.VSTESTCD
    verifications:
      allowed_values:
        values: [HEIGHT, WEIGHT, TEMP]

  - name: VSTEST
    type: str
    derivation:
      source: VS_RAW.VSTEST

  - name: VSORRES
    type: str
    derivation:
      source: VS_RAW.VSORRES

  - name: VSORRESU
    type: str
    derivation:
      source: VS_RAW.VSORRESU
    verifications:
      allowed_values:
        values: [cm, kg, C, LB, F]

  - name: VSSTRESN
    type: float

  - name: VSSTRESC
    type: str
    derivation:
      source: VSSTRESN

  - name: VSSTRESU
    type: str
    verifications:
      allowed_values:
        values: [cm, kg, C]

rows:
  - id: height
    filter: "VS_RAW.VSTESTCD = 'HEIGHT'"
    derivations:
      VSSTRESN:
        source: VS_RAW.VSORRES
      VSSTRESU:
        case:
          branches:
            - when: "VS_RAW.VSORRES IS NOT NULL"
              then:
                literal: cm

  - id: weight
    filter: "VS_RAW.VSTESTCD = 'WEIGHT'"
    derivations:
      VSSTRESN:
        case:
          branches:
            - when: "VS_RAW.VSORRESU = 'LB'"
              then:
                compute:
                  expr: "VS_RAW.VSORRES * 0.45359237"
          otherwise:
            source: VS_RAW.VSORRES
      VSSTRESU:
        case:
          branches:
            - when: "VS_RAW.VSORRES IS NOT NULL"
              then:
                literal: kg

  - id: temp
    filter: "VS_RAW.VSTESTCD = 'TEMP'"
    derivations:
      VSSTRESN:
        case:
          branches:
            - when: "VS_RAW.VSORRESU = 'F'"
              then:
                compute:
                  expr: "(VS_RAW.VSORRES - 32) * 5 / 9"
          otherwise:
            source: VS_RAW.VSORRES
      VSSTRESU:
        case:
          branches:
            - when: "VS_RAW.VSORRES IS NOT NULL"
              then:
                literal: C

verifications:
  - unique:
      columns: [STUDYID, USUBJID, VSSEQ]
  - row_count:
      min: 6
      max: 6
  - all_or_none:
      id: standardized-result-completeness
      columns: [VSSTRESN, VSSTRESC, VSSTRESU]
  - implies:
      id: unconverted-result-is-unchanged
      when: "VSORRESU = VSSTRESU"
      then: "VSSTRESC = VSORRES"
