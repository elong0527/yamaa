schema_version: "1.0.0-rc.1"
domain: ADSL
datasets:
  DM: input/dm.csv
base: DM
keys: [STUDYID, USUBJID]

output:
  path: adsl.csv
  columns: [STUDYID, USUBJID, BSA]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: DM.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: DM.USUBJID

  - name: HEIGHTCM
    type: float
    label: Height (cm)
    derivation:
      source: DM.HEIGHTCM

  - name: WEIGHTKG
    type: float
    label: Weight (kg)
    derivation:
      source: DM.WEIGHTKG

  - name: BSA
    type: float
    label: Body Surface Area (m2)
    derivation:
      compute:
        expr: "SQRT(HEIGHTCM * WEIGHTKG / 3600)"
