schema_version: "1.0"
domain: ADRS
datasets:
  ADSL: input/adsl.csv
  TU: input/tu.csv
base: ADSL

record_lookups:
  - id: TU_TARGET
    dataset: TU
    source: [STUDYID, USUBJID]
    key: [STUDYID, USUBJID]
    filter: "TU.TUTESTCD = 'TUMIDENT' AND TU.VISIT = 'SCREENING' AND TU.TUSTRESC = 'TARGET'"
    order_by: [TU.TUSEQ]
    keep: first
    unmatched: missing

keys:
  - STUDYID
  - USUBJID
  - PARAMCD

output:
  columns:
    - STUDYID
    - USUBJID
    - PARAMCD
    - PARAM
    - AVALC
    - AVAL

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: ADSL.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: ADSL.USUBJID

  - name: PARAMCD
    type: str
    label: Parameter Code
    derivation:
      literal: MDIS

  - name: PARAM
    type: str
    label: Parameter
    derivation:
      literal: Measurable Disease at Baseline

  - name: _TUSTRESC
    type: str
    label: Target Disease Record
    derivation:
      source: TU_TARGET.TUSTRESC

  - name: AVALC
    type: str
    label: Analysis Value (C)
    derivation:
      case:
        branches:
          - when: "_TUSTRESC IS NOT NULL"
            then:
              literal: "Y"
        otherwise:
          literal: "N"

  - name: AVAL
    type: int
    label: Analysis Value
    derivation:
      case:
        branches:
          - when: "AVALC = 'Y'"
            then:
              literal: 1
        otherwise:
          literal: 0
