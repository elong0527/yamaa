schema_version: "1.0"
domain: RELREC
datasets:
  AE: input/ae.csv
  CM: input/cm.csv
keys: [STUDYID, USUBJID, RDOMAIN, IDVAR, IDVARVAL, RELID]

output:
  profile: csv
  columns: [STUDYID, USUBJID, RDOMAIN, IDVAR, IDVARVAL, RELTYPE, RELID]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier

  - name: USUBJID
    type: str
    label: Unique Subject Identifier

  - name: RDOMAIN
    type: str
    label: Related Domain Abbreviation

  - name: IDVAR
    type: str
    label: Identifying Variable

  - name: IDVARVAL
    type: str
    label: Identifying Variable Value

  - name: RELTYPE
    type: str
    label: Relationship Type
    derivation:
      literal: null

  - name: RELID
    type: str
    label: Relationship Identifier

rows:
  - id: ae_link_1
    dataset: AE
    filter: "AE.AELNKID1 IS NOT NULL"
    derivations:
      STUDYID:
        source: AE.STUDYID
      USUBJID:
        source: AE.USUBJID
      RDOMAIN:
        literal: AE
      IDVAR:
        literal: AESEQ
      IDVARVAL:
        source: AE.AESEQ
      RELID:
        source: AE.AELNKID1

  - id: ae_link_2
    dataset: AE
    filter: "AE.AELNKID2 IS NOT NULL"
    derivations:
      STUDYID:
        source: AE.STUDYID
      USUBJID:
        source: AE.USUBJID
      RDOMAIN:
        literal: AE
      IDVAR:
        literal: AESEQ
      IDVARVAL:
        source: AE.AESEQ
      RELID:
        source: AE.AELNKID2

  - id: cm_link_1
    dataset: CM
    filter: "CM.CMLNKID1 IS NOT NULL"
    derivations:
      STUDYID:
        source: CM.STUDYID
      USUBJID:
        source: CM.USUBJID
      RDOMAIN:
        literal: CM
      IDVAR:
        literal: CMSEQ
      IDVARVAL:
        source: CM.CMSEQ
      RELID:
        source: CM.CMLNKID1

  - id: cm_link_2
    dataset: CM
    filter: "CM.CMLNKID2 IS NOT NULL"
    derivations:
      STUDYID:
        source: CM.STUDYID
      USUBJID:
        source: CM.USUBJID
      RDOMAIN:
        literal: CM
      IDVAR:
        literal: CMSEQ
      IDVARVAL:
        source: CM.CMSEQ
      RELID:
        source: CM.CMLNKID2

verifications:
  - unique:
      columns: [STUDYID, USUBJID, RDOMAIN, IDVAR, IDVARVAL, RELID]
  - row_count:
      min: 6
      max: 6
  - implies:
      id: relationship-row-identifies-a-record
      when: "RELID IS NOT NULL"
      then: "RDOMAIN IS NOT NULL AND IDVAR IS NOT NULL AND IDVARVAL IS NOT NULL"
