schema_version: "1.0"
domain: ADLB
datasets:
  LB: input/lb.csv
base: LB
keys: [STUDYID, USUBJID, LBSEQ]

output:
  path: adlb.csv
  columns: [STUDYID, USUBJID, LBSEQ, LBSTRESN, VISITSEQ]

columns:
  - name: STUDYID
    type: str
    label: Study Identifier
    derivation:
      source: LB.STUDYID

  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: LB.USUBJID

  - name: LBSEQ
    type: int
    label: Sequence Number
    derivation:
      source: LB.LBSEQ

  - name: LBSTRESN
    type: float
    label: Numeric Result
    derivation:
      source: LB.LBSTRESN

  - name: VISITSEQ
    type: int
    label: Visit Sequence
    derivation:
      row_number:
        group_by: [STUDYID, USUBJID]
        order_by:
          - {variable: LBSEQ, direction: asc}
        filter: 7
