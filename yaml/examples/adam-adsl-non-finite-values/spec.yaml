schema_version: "1.0"
domain: ADSL
datasets:
  DM:
    path: input/dm.csv
    types:
      POSITIVE_INFINITY: float
      NEGATIVE_INFINITY: float
      NOT_A_NUMBER: float
base: DM
keys: [USUBJID]

output:
  profile: csv
  columns:
    - USUBJID
    - YAML_PINF
    - YAML_NINF
    - YAML_NAN
    - SOURCE_PINF
    - SOURCE_NINF
    - SOURCE_NAN
    - FUNCTION_PINF
    - FUNCTION_NINF
    - FUNCTION_NAN

columns:
  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation:
      source: DM.USUBJID

  - name: YAML_PINF
    type: float
    label: Positive Infinity YAML Literal
    derivation:
      literal: .inf

  - name: YAML_NINF
    type: float
    label: Negative Infinity YAML Literal
    derivation:
      literal: -.Inf

  - name: YAML_NAN
    type: float
    label: Not-a-Number YAML Literal
    derivation:
      literal: .NAN

  - name: SOURCE_PINF
    type: float
    label: Positive Infinity Source Value
    derivation:
      source: DM.POSITIVE_INFINITY

  - name: SOURCE_NINF
    type: float
    label: Negative Infinity Source Value
    derivation:
      source: DM.NEGATIVE_INFINITY

  - name: SOURCE_NAN
    type: float
    label: Not-a-Number Source Value
    derivation:
      source: DM.NOT_A_NUMBER

  - name: FUNCTION_PINF
    type: float
    label: Positive Infinity Function Result
    derivation:
      function:
        name: non_finite_value
        contract_version: "1.0.0"
        args:
          kind: {literal: positive-infinity}

  - name: FUNCTION_NINF
    type: float
    label: Negative Infinity Function Result
    derivation:
      function:
        name: non_finite_value
        contract_version: "1.0.0"
        args:
          kind: {literal: negative-infinity}

  - name: FUNCTION_NAN
    type: float
    label: Not-a-Number Function Result
    derivation:
      function:
        name: non_finite_value
        contract_version: "1.0.0"
        args:
          kind: {literal: nan}
