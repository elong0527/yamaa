version: "1.0"

expressions:
    source: {type: [variable, source_binding_class]}
    literal: {type: literal_value}
    coalesce:
        - sources: {type: "list[variable]", required: true}
        - default: {type: literal_value, required: false}
    case:
        - branches: {type: "list[case_branch_class]", required: true}
        - else: {type: expression, required: false}

source_binding_class:
    - variable: {type: variable, required: true}
    - missing: {type: literal_value, required: false}
    - multiple_matches: {type: multiple_matches_class, required: false}

multiple_matches_class:
    - order_by: {type: "list[variable]", required: true}
    - keep: {type: str, required: true, values: [first, last]}

case_branch_class:
    - when: {type: sql, required: true}
    - then: {type: expression, required: true}
