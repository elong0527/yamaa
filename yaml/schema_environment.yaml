version: "1.0"

includes:
    - schema_shared.yaml

environment_class:
    - schema_version:
        type: str
        required: true
        description: See REQ-1080.
    - version:
        type: str
        required: true
        min_length: 1
        description: See REQ-1080.
    - runtime:
        type: project_runtime_class
        required: true
        description: See REQ-1080.
    - functions:
        type: "dict[identifier, function_contract_class]"
        required: true
        description: See REQ-1080.

project_runtime_class:
    - language:
        type: str
        required: true
        values: [r, python]
        description: See REQ-1081.
    - artifact:
        type: runtime_artifact_class
        required: true
        description: See REQ-1081.

runtime_artifact_class:
    - reference:
        type: str
        required: true
        min_length: 1
        description: See REQ-1082.

function_contract_class:
    - contract:
        type: path
    - contract_version:
        type: function_contract_version
        description: See REQ-1083.
    - implementation_version:
        type: str
        min_length: 1
        description: See REQ-1083.
    - description:
        type: str
        min_length: 1
        description: See REQ-1083.
    - comparison_decimals:
        type: int
        default: 4
        description: See REQ-1083.
    - may_return_missing:
        type: bool
        default: false
        description: See REQ-1083.
    - params:
        type: "list[function_parameter_class]"
        description: See REQ-1083.
    - returns:
        type: column_type
        description: See REQ-1083.
    - binding:
        type: function_binding_class
        required: true
        description: See REQ-1083.
    - conformance:
        type: path
        required: true
        description: See REQ-1083.

shared_function_contract_class:
    - contract_version:
        type: function_contract_version
        required: true
    - description:
        type: str
        required: true
        min_length: 1
    - comparison_decimals:
        type: int
        default: 4
    - may_return_missing:
        type: bool
        default: false
    - params:
        type: "list[function_parameter_class]"
        required: true
    - returns:
        type: column_type
        required: true

function_parameter_class:
    - name: {type: identifier, required: true}
    - type: {type: function_param_type, required: true}
    - required: {type: bool, default: true}
    - default: {type: function_value}
    - accepts_missing: {type: bool, default: false}

function_binding_class:
    - call:
        type: qualified_callable
        required: true
        description: See REQ-1084.
    - args:
        type: "dict[identifier, host_argument_name]"
        description: See REQ-1084.

function_conformance_class:
    - schema_version: {type: str, required: true}
    - function: {type: identifier, required: true}
    - contract_version: {type: function_contract_version, required: true}
    - cases: {type: "list[function_conformance_case_class]", required: true}

function_conformance_case_class:
    - id: {type: function_case_id, required: true}
    - covers: {type: "list[function_coverage]", required: true}
    - args: {type: "dict[identifier, function_value]", required: true}
    - result: {type: function_value, required: true}

qualified_callable:
    type: str
    min_length: 1

host_argument_name:
    type: str
    min_length: 1

function_case_id:
    type: str
    pattern: '^[a-z][a-z0-9-]*$'

function_coverage:
    type: str
    pattern: '^(normal|boundary|nullable-output|numeric-comparison|(default|accepted-missing|short-circuit-missing|boolean-true|boolean-false):[A-Za-z_][A-Za-z0-9_]*)$'
