version: '1.0'
includes:
- schema_shared.yaml
environment_class:
- schema_version:
    type: str
    required: true
    description: See REQ-1080.
- lock:
    type: project_path
    description: See REQ-1080.
- functions:
    type: dict[identifier, function_definition]
    description: See REQ-1080.
function_definition:
  type:
  - project_path
  - function_definition_class
  description: See REQ-1083.
function_definition_class:
- function:
    type: qualified_callable
    required: true
    description: See REQ-1083.
- description:
    type: str
    required: true
    min_length: 1
    description: See REQ-1083.
- params:
    type: list[function_parameter_class]
    required: true
    description: See REQ-1083.
- returns:
    type: column_type
    required: true
    description: See REQ-1083.
- may_return_missing:
    type: bool
    default: false
    description: See REQ-1083.
- comparison_decimals:
    type: int
    default: 4
    description: See REQ-1083.
- tests:
    type: list[function_test_class]
    required: true
    description: See REQ-1083.
function_parameter_class:
- name:
    type: identifier
    required: true
    description: See REQ-1083.
- type:
    type: function_param_type
    required: true
    description: See REQ-1083.
- required:
    type: bool
    default: true
    description: See REQ-1083.
- default:
    type: function_value
    description: See REQ-1083.
- accepts_missing:
    type: bool
    default: false
    description: See REQ-1083.
qualified_callable:
  type: str
  min_length: 1
  description: See REQ-0669.
function_case_id:
  type: str
  pattern: ^[a-z][a-z0-9-]*$
  description: See REQ-1083.
function_coverage:
  type: str
  pattern: ^(normal|boundary|nullable-output|numeric-comparison|(default|accepted-missing|short-circuit-missing|boolean-true|boolean-false):[A-Za-z_][A-Za-z0-9_]*)$
  description: See REQ-1083.
function_test_class:
- id:
    type: function_case_id
    required: true
    description: See REQ-1083.
- covers:
    type: list[function_coverage]
    required: true
    description: See REQ-1083.
- args:
    type: dict[identifier, function_value]
    required: true
    description: See REQ-1083.
- result:
    type: function_value
    required: true
    description: See REQ-1083.
