  - {"source": "schema_verification.yaml:comment:43", "text": "Bounds how many rows a group holds, or the whole output. group_by partitions the artifact's rows and applies both bounds to every group; a group's count is how many of its rows filter admits, and a row is admitted only when the predicate is TRUE. A grouped count requires id, which an ungrouped count does not.", "owner": "execution/verification", "group": "dataset_verifications.row_count", "target": "REQ-1152"}
provenance_addenda:
  - {"source": "cdisc:adam-conformance-rules-5.0:code-decode-bijection", "text": "ADaM conformance rules 92/93, 95/96, 77, 109/110, and 410 require code/decode pairs such as TRTP/TRTPN to stand in a one-to-one mapping within each parameter.", "owner": "execution/verification", "group": "dataset_verifications", "target": "REQ-1153"}
  - {"source": "schema_verification.yaml:dataset_verifications.row_count.when.description", "text": "Predicate over one completed output row. A group is bound when at least one of its rows evaluates the predicate to TRUE; the bounds then apply to that group. A group no row of which evaluates it to TRUE is exempt.", "owner": "execution/verification", "group": "dataset_verifications.row_count", "target": "REQ-1154"}
  - {"source": "cdisc:adam-conformance-rules-5.0:usubjid-membership", "text": "ADaM conformance rule 53 requires every USUBJID in an ADaM dataset to appear in SDTM DM.", "owner": "execution/verification", "group": "dataset_verifications", "target": "REQ-1155"}
  - {"source": "schema_metadata.yaml:submission_column_class.inventory_vocabulary.description", "text": "Declares that every non-missing value of the column must equal the name of a dataset the study document declares; the admitted values are the study's dataset inventory.", "owner": "submission/terminology", "group": "submission_column_class", "target": "REQ-1156"}
  - {"source": "cdisc:adam-conformance-rules-5.0:copy-fidelity", "text": "ADaM conformance rule 2 requires a variable copied unchanged from SDTM to keep its label, attributes, and values.", "owner": "submission/metadata", "group": "submission_origin_class", "target": "REQ-1157"}
  - {"source": "schema.yaml:dataset_class.empty_string.description", "text": "How a stored empty string in a character field reads: missing (the default) or present as the collected empty string.", "owner": "storage/ingestion", "group": "dataset_class", "target": "REQ-1158"}
  - {"source": "yamaa:issue-632:empty-string-missing-semantics", "text": "Under the missing convention a stored empty string in a str field is the missing value recognized before typing; under present it is the collected empty string. The convention applies at ingestion, after the container profile decodes.", "owner": "storage/ingestion", "group": "empty_string", "target": "REQ-1159"}
  - {"source": "yamaa:issue-632:empty-string-scope", "text": "The empty-string convention applies to str fields only; other types keep their existing empty handling.", "owner": "storage/ingestion", "group": "empty_string", "target": "REQ-1160"}
  - {"source": "yamaa:issue-632:empty-string-delimited", "text": "A delimited source must not declare the present convention, because the delimited profile admits no empty string.", "owner": "storage/ingestion", "group": "empty_string", "target": "REQ-1161"}
  - {"source": "schema.yaml:row_class.submission.description", "text": "Optional per-value submission metadata for one row template, keyed by column; the declaration rules live in the submission metadata contract.", "owner": "execution/rows", "group": "row_class", "target": "REQ-1056"}
