  - {"source": "schema_expression_date.yaml:expressions.date_diff.bounds.description", "text": "Endpoints counted. exclusive counts from start to end excluding start; inclusive counts both endpoints and is one greater; between counts neither and is one smaller. The three values are defined only with unit day; with unit week, month, or year bounds must be absent or exclusive, and any other value fails validation under R016.", "owner": "operations/temporal", "group": "expressions.date_diff", "target": "REQ-1104"}
