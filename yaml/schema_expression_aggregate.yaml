version: "1.0.0-rc.1"

# R013 defines the reducer grammar, the results it pins, and its failures.

expressions:
    aggregate: # Reduces one relation or the current driver group to one value under R013.
        type: [aggregate_expression, aggregate_class]

aggregate_class:
    - filter:
        type: sql
        description: Predicate selecting records before reduction.
    - between:
        type: aggregate_between_class
        description: Current-row value matched inclusively against one or two columns of a qualified right-side relation.
    - group_by:
        type: "list[variable]"
        description: Grain of an ordinary right-side or output-row reduction; omit when the enclosing grouped row owns the grain.
    - expr:
        type: aggregate_expression
        required: true
        description: Closed reducer expression over the records of one relation.

aggregate_expression:
    type: str
    min_length: 1
    description: Reducer expression in the portable grammar defined by R013.

aggregate_between_class:
    - value:
        type: variable
        required: true
        description: Value read from the current row.
    - lower:
        type: variable
        required: false
        description: Qualified right-side variable serving as an inclusive lower bound.
    - upper:
        type: variable
        required: false
        description: Qualified right-side variable serving as an inclusive upper bound.
