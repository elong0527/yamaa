version: "1.0"

# See REQ-1091 in rules/operations/aggregation.md.

expressions:
# See REQ-1092 in rules/operations/aggregation.md.
    aggregate:
        type: [aggregate_expression, aggregate_class]

aggregate_class:
    - filter:
        type: predicate
        description: See REQ-1088 in rules/operations/aggregation.md.
    - between:
        type: aggregate_between_class
        description: See REQ-1088 in rules/operations/aggregation.md.
    - group_by:
        type: "list[variable]"
        description: See REQ-1088 in rules/operations/aggregation.md.
    - key:
        type: [identifier, "list[identifier]"]
        required: false
        description: See REQ-1088 in rules/operations/aggregation.md.
    - key_base:
        type: [variable, "list[variable]"]
        required: false
        description: See REQ-1088 in rules/operations/aggregation.md.
    - derive:
        type: "list[derive_binding_class]"
        required: false
        description: See REQ-1189 in rules/operations/aggregation.md.
    - expr:
        type: aggregate_expression
        required: true
        description: See REQ-1088 in rules/operations/aggregation.md.

derive_binding_class:
    - name:
        type: identifier
        required: true
        description: See REQ-1192 in rules/operations/aggregation.md.
    - type:
        type: column_type
        required: true
        description: See REQ-1192 in rules/operations/aggregation.md.
    - derivation:
        type: derivation
        required: true
        description: See REQ-1192 in rules/operations/aggregation.md.

aggregate_expression:
    type: str
    min_length: 1
    description: See REQ-1089 in rules/operations/aggregation.md.

aggregate_between_class:
    - value:
        type: variable
        required: true
        description: See REQ-1090 in rules/operations/aggregation.md.
    - lower:
        type: variable
        required: false
        description: See REQ-1090 in rules/operations/aggregation.md.
    - upper:
        type: variable
        required: false
        description: See REQ-1090 in rules/operations/aggregation.md.
