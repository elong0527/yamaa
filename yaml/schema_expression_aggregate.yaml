version: "1.0"

# See REQ-1091.

expressions:
# See REQ-1092.
    aggregate:
        type: [aggregate_expression, aggregate_class]

aggregate_class:
    - fields_from: match_key_range_fields
    - fields_from: match_filter_fields
    - group_by:
        type: "list[variable]"
        description: See REQ-1088.
    - derive:
        type: "list[derive_binding_class]"
        required: false
        description: See REQ-1189.
    - expr:
        type: aggregate_expression
        required: true
        description: See REQ-1088.

derive_binding_class:
    - name:
        type: identifier
        required: true
        description: See REQ-1192.
    - type:
        type: column_type
        required: true
        description: See REQ-1192.
    - derivation:
        type: derivation
        required: true
        description: See REQ-1192.

aggregate_expression:
    type: str
    min_length: 1
    description: See REQ-1089.
