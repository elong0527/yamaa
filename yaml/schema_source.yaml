version: "1.0"

# R006 defines this notation. This is the schema-bundle entry point for the
# portable source sidecar that R014 defines.

root_class:
    - schema_version:
        type: str
        required: true
        description: Source-schema bundle version; R006 requires an exact match.
    - fields:
        type: "dict[dataset_column, column_type]"
        required: true
        description: Complete mapping from stored field names to R011 types.

dataset_column:
    type: str
    pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
    description: Column in the source dataset.

column_type:
    type: str
    values: [str, int, float, date, datetime]
