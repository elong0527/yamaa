version: "1.0"

# Every negative fixture whose expected phase is validation appears exactly
# once. Implemented entries name the validator family that must emit the
# registered condition at every declared path. Blocked entries name the open
# issue that owns the missing diagnostic.
fixtures:
  negative-adae-review-condition-arithmetic:
    rule: R004
    condition: invalid_predicate
    spec_paths: ["columns.REVIEWFL.derivation.case.branches[0].when"]
    validator: predicate
  negative-adae-review-text-date:
    rule: R004
    condition: incompatible_input_type
    spec_paths: ["columns.REVIEWFL.derivation.case.branches[0].when"]
    validator: predicate
  negative-adae-review-unknown-date:
    rule: R004
    condition: unknown_field
    spec_paths: ["columns.REVIEWFL.derivation.case.branches[0].when"]
    validator: predicate
  negative-adex-relative-dose-intensity:
    rule: R013
    condition: aggregate_identifier_not_grouped
    spec_paths: [columns.RDI.derivation.aggregate]
    blocked_by: "#103"
  negative-adlb-computed-parameter:
    rule: R001
    condition: dependency_cycle
    spec_paths:
      - columns.AVAL.derivation.case
      - columns.ALTVAL.derivation.aggregate
    blocked_by: "#103"
  negative-adsl-cyclic-parent:
    rule: R017
    condition: inheritance_cycle
    spec_paths: [parents]
    validator: inheritance
  negative-adsl-inherited-output:
    rule: R017
    condition: missing_entry_output
    spec_paths: [parents]
    validator: inheritance
  negative-adsl-invalid-parent-clear:
    rule: R017
    condition: invalid_clear
    spec_paths: [columns.USUBJID.type]
    validator: inheritance
  negative-adsl-parent-version-mismatch:
    rule: R017
    condition: schema_version_mismatch
    spec_paths: [parents]
    validator: inheritance
  negative-adsl-randomization-date-retyped:
    rule: R017
    condition: redundant_field_type
    spec_paths: [datasets.DM.types.RANDDT]
    validator: inheritance
  negative-adsl-remote-parent:
    rule: R017
    condition: invalid_parent_path
    spec_paths: [parents]
    validator: inheritance
  negative-adsl-subject-reference:
    rule: R012
    condition: invalid_string_template
    spec_paths: [columns.SUBJREF.derivation.str_template]
    blocked_by: "#103"
  negative-column-type-unknown:
    rule: R011
    condition: value_not_permitted
    spec_paths: [columns.AVAL.type]
    validator: schema
  negative-compute-aggregate-function:
    rule: R010
    condition: prohibited_function
    spec_paths: [columns.AVALTOT.derivation.compute.expr]
    validator: numeric_expression
  negative-compute-comparison-operator:
    rule: R010
    condition: prohibited_construct
    spec_paths: [columns.HIFL.derivation.compute.expr]
    validator: numeric_expression
  negative-compute-qualified-identifier:
    rule: R010
    condition: qualified_identifier
    spec_paths: [columns.DOSEDBL.derivation.compute.expr]
    validator: numeric_expression
  negative-dataset-path-absolute:
    rule: R021
    condition: resource_path_not_relative
    spec_paths: [datasets.LBREF.path]
    validator: resource_path
  negative-dataset-path-directory:
    rule: R021
    condition: resource_path_not_regular_file
    spec_paths: [datasets.LBREF.path]
    validator: resource_path
  negative-dataset-path-missing:
    rule: R021
    condition: resource_path_missing
    spec_paths: [datasets.LBREF.path]
    validator: resource_path
  negative-dataset-path-parent-escape:
    rule: R021
    condition: resource_path_parent_traversal
    spec_paths: [datasets.LBREF.path]
    validator: resource_path
  negative-dataset-path-symlink:
