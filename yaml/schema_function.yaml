version: "1.0"

expressions:
    function: # See REQ-1085 in rules/operations/functions.md.
        - name:
            type: identifier
            required: true
            description: See REQ-1085 in rules/operations/functions.md.
        - contract_version:
            type: function_contract_version
            required: true
            description: See REQ-1085 in rules/operations/functions.md.
        - args:
            type: "dict[identifier, function_arg]"
            default: {}
            description: See REQ-1085 in rules/operations/functions.md.

function_arg:
    type:
        - variable
        - int
        - float
        - bool
        - "null"
        - function_string_literal_class
        - function_date_literal_class
        - function_datetime_literal_class
    description: See REQ-1086 in rules/operations/functions.md.
