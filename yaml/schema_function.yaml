version: "1.0.0-rc.1"

expressions:
    function: # Calls a logical function once per row when an implementation is supplied.
        # Vectorization is valid only when equivalent to logical row-wise calls.
        # R018 defines environment resolution, validation, and invocation.
        - name:
            type: function_name
            required: true
            description: Function name resolved in the project environment.
        - contract_version:
            type: function_contract_version
            required: true
            description: Exact logical contract version required from the environment.
        - args:
            type: "dict[function_parameter_name, function_arg]"
            default: {}
            description: Named arguments passed to the function.

function_arg:
    type:
        - variable
        - int
        - float
        - bool
        - "null"
        - function_string_literal_class
        - function_date_literal_class
        - function_datetime_literal_class
    description: Named variable or scalar literal leaf; arbitrary nesting is not allowed.
