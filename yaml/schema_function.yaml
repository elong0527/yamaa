version: "1.0"

expressions:
    function: # Calls a named project-environment function once per logical row.
        # Vectorization is valid only when equivalent to logical row-wise calls.
        # Availability, signature, and package setup are project configuration.
        - name:
            type: function_name
            required: true
            description: Function name resolved in the project environment.
        - args:
            type: "dict[str, function_arg]"
            default: {}
            description: Named arguments passed to the function.

function_name:
    type: str
    min_length: 1
    description: Name of a function resolved in the project environment.

function_arg:
    type: [variable, int, float, bool, "null", expression]
    description: Variable or non-string literal; strings use an explicit expression.
