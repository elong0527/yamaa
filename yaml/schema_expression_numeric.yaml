version: "1.0"

# See REQ-1121.

expressions:
    compute: # See REQ-1119.
        - expr:
            type: numeric_expression
            required: true
            description: See REQ-1119.
    round_half_away_from_zero: # See REQ-1172.
        - source:
            type: variable
            required: true
            description: See REQ-1172.
        - digits:
            type: int
            required: true
            description: See REQ-1172.

numeric_expression:
    type: str
    min_length: 1
    description: See REQ-1120.
