version: "1.0"

expressions:
    multiply:
        - source: {type: variable, required: true}
        - factor: {type: float, required: true}
    add:
        - source: {type: variable, required: true}
        - addend: {type: float, required: true}
    subtract:
        - minuend: {type: variable, required: true}
        - subtrahend: {type: variable, required: true}
    percent_change:
        - value: {type: variable, required: true}
        - base: {type: variable, required: true}
