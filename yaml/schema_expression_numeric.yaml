version: "1.0.0-rc.1"

# R010 defines the closed numeric grammar, types, and failure conditions.

expressions:
    compute: # Evaluates one scalar numeric formula under R010.
        - expr:
            type: numeric_expression
            required: true
            description: Closed numeric expression over named variables.

numeric_expression:
    type: str
    min_length: 1
    description: Numeric formula in the portable grammar defined by R010.
