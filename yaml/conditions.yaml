version: "1.0"

# Every condition an implementation may raise, keyed to the phases that may
# raise it, with the message its issues carry (P-MSG-1). Negative benchmarks
# must reference a registered condition whose phases include the fixture's
# phase. Every condition has error severity (D28).
#
# A message is one plain clause that starts in lower case or with a
# placeholder, is ASCII, has no final period and names no file position.
# Rust renders it from the issue's record: `{key}` is the context value of
# that key and `{spec_path}` the first spec path, while `{{` and `}}` write
# braces. Text renders as written, a number as its exact spelling, a Boolean
# as `true` or `false`, missing as `null`, a list as its items joined with
# `, `, and an object as canonical JSON. Every cause of a condition records
# each key its message names. Messages are not frozen: programs match on
# condition and rule, never on message.
#
# A condition's history goes with it, from the `conditions` section of
# tools/migrate/renames.yaml for 0.6.0: `renamed_from` gives the name it had
# before a release renamed it, and `retired` below lists each condition a
# release retired, with that release as `retired_in`. With them, the
# catalogue that `conditions()` returns names every condition a program
# written for an earlier release may match, and this file at a release's tag
# is that release's catalogue.

conditions:
  aggregate_identifier_not_grouped:
    phases: [validation]
    message: "{identifier} is read outside a reduction in {expr}, but it is not a grouping column"
  aggregate_multiple_records:
    phases: [derivation, row_construction]
    message: "{expr} reads {record_count} records in one group, but {reducer} takes exactly one"
  all_or_none_failed:
    phases: [verification]
    message: "the listed values are neither all missing nor all present in {failure_count} of the rows"
  allowed_values_failed:
    phases: [verification]
    message: "column {column} holds a value outside its allowed values"
  ambiguous_baseline:
    phases: [derivation]
    message: "{operation} for {column} cannot choose between {match_count} eligible rows tied on {date}"
  ambiguous_dictionary:
    phases: [validation]
    message: "the case-insensitive mapping keys {entries} all fold to {folded_key}"
  artifact_outside_document:
    phases: [validation]
    message: "the artifact {artifact} of {dataset} is outside the directory of {define}"
  artifact_path_collision:
    phases: [validation]
    message: "{spec_path} would write {path}, which another output also writes"
  assert_failed:
    phases: [verification]
    message: "the assert predicate is not TRUE in {failure_count} of the rows"
  codelist_duplicate_value:
    phases: [validation]
    message: "codelist {codelist} lists the value {value} more than once"
  codelist_extended_alias:
    phases: [validation]
    message: "the extended item {value} of codelist {codelist} declares alias {alias}, which an extended item may not have"
  codelist_extension_not_admitted:
    phases: [validation]
    message: "codelist {codelist} is not an extensible published codelist, so its items cannot be extended"
  codelist_partial_item_field:
    phases: [validation]
    message: "codelist {codelist} declares {field} for some of its items but not all"
  codelist_shape_invalid:
    phases: [validation]
    message: "codelist {codelist} has an item list or item value its declaration does not admit"
  codelist_type_mismatch:
    phases: [validation]
    message: "column {column} binds codelist {codelist}, whose data type {codelist_data_type} its type {column_type} does not admit"
  conflicting_absence_policy:
    phases: [validation]
    message: "the lookup of {dataset} declares an answer for absence together with require_match: true"
  # SUB-14 (D69)
  conflicting_origins:
    phases: [validation]
    message: "column {column} declares a {origin_type} origin that conflicts with another of its origins"
  conflicting_row_construction:
    phases: [validation]
    message: "a root filter cannot be declared together with the rows {rows}"
  conversion_failed:
    phases: [convert, validation]
    message: "{spec_path} gives a value that does not convert to {to}, or that leaves the range of {to}"
  core_mandatory_conflict:
    phases: [validation]
    message: "the core designation of column {column} does not fit its model or its mandatory setting"
  correlated_derivation_with_unique_verification:
    phases: [validation]
    message: "intermediate {intermediate} declares verifications, so its derivations cannot read the current input record"
  correlated_filter_with_unique_verification:
    phases: [validation]
    message: "intermediate {intermediate} declares verifications, so its filter cannot read the current input record"
  data_type_failed:
    phases: [verification]
    message: "column {column} holds a value that is not ISO 8601 {data_type} text in {failure_count} of the rows"
  decimals_not_applicable:
    phases: [validation]
    message: "output.decimals of {path} applies only to a csv artifact that no transport file reads"
  declared_length_conflict:
    phases: [validation]
    message: "column {column} declares length {length}, but its max_length verification states {max_length}"
  dependency_cycle:
    phases: [validation]
    message: "{cycle} form a dependency cycle"
  division_by_zero:
    phases: [derivation]
    message: "{expr} divides by zero"
  driver_unavailable:
    phases: [validation]
    message: "the driver dataset {dataset} named at {spec_path} is not available"
  duplicate_dataset_entry:
    phases: [validation]
    message: "the section lists dataset {detail} or its artifact more than once"
  duplicate_define_identifier:
    phases: [validation]
    message: "{spec_path} repeats the identifier {identifier}, already used in its identifier space"
  duplicate_derivation:
    phases: [validation]
    message: "{identifier} conflicts with another derivation or field of the same name"
  duplicate_identifier:
    phases: [validation]
    message: "{spec_path} repeats the identifier {identifier}, declared earlier"
  duplicate_intermediate_records:
    phases: [verification]
    message: "the unique verification of intermediate {intermediate} finds {columns} repeated in {dataset}"
  duplicate_key:
    phases: [output]
    message: "the output keys repeat in {duplicate_count} of the rows"
  # LAYER-3
  duplicate_layer:
    phases: [validation]
    message: "include {path} names a layer the specification already composes"
  duplicate_order_term:
    phases: [validation]
    message: "output.order_by names column {column} more than once"
  # PROJECT-5
  duplicate_specification_name:
    phases: [validation]
    message: "the project lists two specifications named {name}"
  empty_string_present_unsupported:
    phases: [validation]
    message: "input {dataset} declares empty_string: present, which a delimited source cannot hold"
  engine_rejected:
    phases: [engine]
    message: "the engine refused the operation in its {step} step: {code}"
  field_parse_failed:
    phases: [ingest]
    message: "field {field} of input {dataset} holds '{value}', which does not parse as {type}"
  forward_reference:
    phases: [validation]
    message: "column {column} reads {dependency}, which is declared after it"
  function_call_failed:
    phases: [derivation, validation]
    message: "the call to project function {call} failed"
  function_conformance_failed:
    phases: [validation]
    message: "function {function} fails its test case {case}: {reason}"
  function_file_invalid:
    phases: [validation]
    message: "a function file or lock cannot be admitted ({reason})"
    renamed_from: project_environment_invalid
  function_implementation_missing:
    phases: [validation]
    message: "project function {function} has no implementation for {language}"
    renamed_from: project_environment_missing
  incomparable_range_types:
    phases: [validation]
    message: "a range value of type {value_type} cannot be compared with its bounds"
  incomparable_sources:
    phases: [validation]
    message: "the sources {sources} have types {types}, which cannot be compared"
  incompatible_input_type:
    phases: [validation]
    message: "{spec_path} reads a value of type {actual}, which it does not accept"
  inheritance_cycle:
    phases: [validation]
    message: "the layers form a cycle: {cycle}"
  integer_overflow:
    phases: [derivation, validation]
    message: "{value} is outside the int range -9223372036854775808 to 9223372036854775807"
  internal_column_in_keys:
    phases: [validation]
    message: "keys names {column}, which is not an output column"
  interval_or_duration_text:
    phases: [impute]
    message: "{operation} reads '{value}' from {source}, which is an ISO 8601 interval or duration, not date text"
  invalid_aggregate_context:
    phases: [validation]
    message: "{expr} is not allowed here: {reason}"
  invalid_calendar_date:
    phases: [impute]
    message: "impute completes '{value}' to {completed}, which is not a calendar date"
  invalid_clear:
    phases: [validation]
    message: "field {field} cannot be cleared"
  invalid_date_text:
    phases: [impute, validation]
    message: "{operation} reads '{value}', which is not valid date text"
  invalid_declaration:
    phases: [validation]
    message: "the verification declaration is invalid: {reason}"
  # LOOKUP-22
  invalid_derive_step:
    phases: [validation]
    message: "the derive step is invalid: {reason}"
  invalid_duration_text:
    phases: [impute]
    message: "{spec_path} reads '{value}' from {source}, which is not an ISO 8601 duration"
  invalid_expression:
    phases: [validation]
    message: "{expr} does not follow the expression grammar"
  invalid_field_type:
    phases: [validation]
    message: "{spec_path} has a value of the wrong type or form (expected {expected})"
  invalid_function_argument:
    phases: [derivation, validation]
    message: "project function {function} receives an argument it does not accept"
  invalid_function_result:
    phases: [derivation]
    message: "project function {function} returned a result its declaration does not admit"
  invalid_intermediate_driver:
    phases: [validation]
    message: "intermediate {intermediate} drives rows, so it cannot declare {fields}"
  invalid_odm_context:
    phases: [validation]
    message: "an odm read of {dataset} is not valid in this {location}"
  invalid_operation_count:
    phases: [validation]
    message: "the {registry} entry declares {count} operations instead of exactly one"
  invalid_parent_path:
    phases: [validation]
    message: "parent {parent} is not a relative file path"
  invalid_power:
    phases: [derivation]
    message: "{expr} raises {base} to the power {exponent}, which has no real result"
  invalid_probability:
    phases: [derivation]
    message: "{expr} applies {function} to {value}, which is not a probability strictly between 0 and 1"
  invalid_producer_contract:
    phases: [validation]
    message: "the schema link of input {dataset} is not a valid producer contract"
  invalid_regex:
    phases: [validation]
    message: "the pattern '{pattern}' is not a valid regular expression"
  invalid_size:
    phases: [validation]
    message: "the value does not have the size {size}"
  invalid_string_template:
    phases: [validation]
    message: "the string template is invalid ({reason})"
  invalid_text:
    phases: [ingest, validation]
    message: "{path} holds text that is not valid Unicode"
  invalid_yaml:
    phases: [validation]
    message: "the file is not valid YAML: {reason}"
  key_dependency:
    phases: [validation]
    message: "key column {column} is not computed from one base record and earlier keys"
  length_failed:
    phases: [verification]
    message: "column {column} holds a value longer than {max} characters in {failure_count} of the rows"
  ln_of_nonpositive:
    phases: [derivation]
    message: "{expr} applies {function} to a zero or negative value, which has no logarithm"
  matches_failed:
    phases: [verification]
    message: "column {column} holds a value that does not match its pattern in {failure_count} of the rows"
  method_missing:
    phases: [validation]
    message: "column {column} declares a Derived origin but no method"
  minimum_length:
    phases: [validation]
    message: "the value is shorter than the minimum length {minimum}"
  missing_derivation:
    phases: [validation]
    message: "no derivation gives column {column} its value"
  missing_input:
    phases: [mapping]
    message: "the string template reads {variable}, which is missing"
  missing_key:
    phases: [output]
    message: "key column {column} is missing in {missing_count} of the rows"
  missing_report:
    phases: [validation]
    message: "the warning verifications {warnings} need output.report, which is not declared"
  missing_required_field:
    phases: [validation]
    message: "{spec_path} lacks the field {field}, which it requires"
  missing_value_required:
    phases: [validation]
    message: "a flag that declares false_value {false_value} must also declare missing"
  # LOOKUP-18; also emitted by the retained aggregate reference validator.
  mixed_relations:
    phases: [validation]
    message: "{expr} mixes the relations {relations}"
  month_out_of_range:
    phases: [validation]
    message: "month {month} is outside 1 to 12"
  multiple_matches:
    phases: [join]
    message: "lookup {intermediate} finds {match_count} matching records in {dataset} and has no rule to choose one"
  multiple_values_per_key:
    phases: [derivation]
    message: "{identifier} gives {value_count} different values for one row"
  nested_reduction:
    phases: [validation]
    message: "{outer} contains the reduction {inner}, and reductions cannot nest"
  no_applicable_keys:
    phases: [validation]
    message: "the lookup of {dataset} has no applicable key ({hint})"
  non_ascii_source:
    phases: [validation]
    message: "{path} holds a character outside ASCII"
  not_missing_failed:
    phases: [verification]
    message: "column {column} is missing in {failure_count} of the rows"
  # PROJECT-12 and PROJECT-13
  nothing_to_save:
    phases: [output]
    message: "the project {operation} has nothing to save"
  odm_not_unique:
    phases: [derivation, row_construction]
    message: "the ODM item {item} has {records} records in one scope"
  odm_schema_field_ambiguous:
    phases: [validation]
    message: "field {field} of input {dataset} matches more than one stored field: {stored}"
  odm_schema_field_missing:
    phases: [validation]
    message: "input {dataset} lacks the ODM fields {fields}"
  odm_schema_field_type:
    phases: [validation]
    message: "the ODM input {dataset} declares or stores a field type it may not"
  odm_schema_value_missing:
    phases: [ingest]
    message: "field {field} of ODM input {dataset} is missing in record {record}"
  ordinal_field_collision:
    phases: [validation]
    message: "the ordinal field {field} of input {dataset} collides with a stored field"
  origin_contradicts_derivation:
    phases: [validation]
    message: "an origin of column {column} contradicts the column's derivation"
  origin_description_missing:
    phases: [validation]
    message: "the {origin_type} origin of column {column} lacks the description its type requires"
  origin_document_missing:
    phases: [validation]
    message: "the collected origin of column {detail} lacks its annotated case report form reference"
  origin_missing:
    phases: [validation]
    message: "column {column} declares no origin"
  origin_source_not_admitted:
    phases: [validation]
    message: "the {origin_type} origin of column {column} has a source the {model} model does not admit"
  parent_not_found:
    phases: [validation]
    message: "parent {path} does not exist"
  # LAYER-10
  parent_on_another_share:
    phases: [validation]
    message: "path {path} is declared in a layer on {parent_root}, another share than the entry's {entry_root}"
  pattern_mismatch:
    phases: [validation]
    message: "the value '{value}' does not match the pattern {pattern}"
  phase_boundary:
    phases: [validation]
    message: "{identifier} is read before the phase that makes it available"
  predecessor_label_mismatch:
    phases: [validation]
    message: "column {detail} is labelled '{label}', but its predecessor {predecessor} is labelled '{predecessor_label}'"
  producer_contract_mismatch:
    phases: [validation]
    message: "the artifact of {dataset} does not match its producing specification's output"
  # PROJECT-11
  producer_not_completed:
    phases: [validation]
    message: "this specification did not run because the producer of its input {dataset} did not complete"
  # PROJECT-8
