version: "1.0"

# Every condition an implementation may raise, keyed to the phases that may
# raise it. Negative benchmarks must reference a registered condition whose
# phases include the fixture's phase. Conditions are raised under REQ
# citations in the contracts; old R0xx diagnostic families survive only as
# compatibility names in rules/migration.yaml.

conditions:
  aggregate_identifier_not_grouped: {phases: [validation]}
  aggregate_multiple_records: {phases: [derivation, row_construction]}
