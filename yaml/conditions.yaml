  reference_data_repeating_conflict:
    phases: [validation]
    message: "dataset {dataset} declares both reference_data and repeating"
  refuted_value_origin:
    phases: [validation]
    message: "the {origin_type} origin of value-level entry {entry} of column {column} contradicts its derivation"
  regex_group_out_of_range:
    phases: [validation]
    message: "group {group} is not a capture group of {pattern} (group count {group_count})"
  rename_only_intermediate:
    phases: [validation]
    message: "intermediate {intermediate} only renames {dataset} and adds nothing"
  reserved_metadata_key:
    phases: [validation]
    message: "metadata key {key} is reserved for a governed field"
