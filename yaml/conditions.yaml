    message: "the archive {path} cannot be read: {reason}"
  source_odm_archive_member:
    phases: [ingest]
    message: "no member of {path} can be read: {reason}"
  source_odm_attribute_ambiguous:
    phases: [ingest]
    message: "{path} has more than one namespaced attribute named {attribute}"
  source_odm_attribute_invalid:
    phases: [ingest]
    message: "{element} in {path} has the unsupported {attribute} value '{value}'"
  source_odm_attribute_missing:
    phases: [ingest]
    message: "{element} in {path} requires a non-empty {attribute}"
  source_odm_compression_unsupported:
    phases: [ingest]
    message: "{path} uses {format} compression, but only plain and gzip TAR archives are read"
  source_odm_document_unsupported:
    phases: [ingest]
    message: "{path} is not a supported ODM 1.3 or 2.0 document: {reason}"
  source_odm_layout_unsupported:
