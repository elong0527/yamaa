version: "1.0"

# Every condition an implementation may raise, keyed to the phases that may
# raise it. Negative benchmarks must reference a registered condition whose
# phases include the fixture's phase. Conditions are raised under REQ
# citations in the contracts; old R0xx diagnostic families survive only as
# compatibility names in rules/migration.yaml.

conditions:
  aggregate_identifier_not_grouped: {phases: [validation]}
  aggregate_multiple_records: {phases: [derivation, row_construction]}
  all_or_none_failed: {phases: [verification]}
  allowed_values_failed: {phases: [verification]}
  ambiguous_baseline: {phases: [derivation]}
  ambiguous_dictionary: {phases: [validation]}
  artifact_path_collision: {phases: [validation]}
  assert_failed: {phases: [verification]}
  conflicting_absent_policy: {phases: [validation]}
  conversion_failed: {phases: [convert]}
  core_mandatory_conflict: {phases: [validation]}
  correlated_filter_with_unique_verification: {phases: [validation]}
  decimals_not_applicable: {phases: [validation]}
  dependency_cycle: {phases: [validation]}
  division_by_zero: {phases: [derivation]}
  duplicate_derivation: {phases: [validation]}
  duplicate_identifier: {phases: [validation]}
  duplicate_intermediate_records: {phases: [verification]}
  duplicate_key: {phases: [output]}
  duplicate_order_term: {phases: [validation]}
  field_parse_failed: {phases: [ingest]}
  forward_reference: {phases: [validation]}
  function_contract_mismatch: {phases: [validation]}
  implication_failed: {phases: [verification]}
  incomparable_range_types: {phases: [validation]}
