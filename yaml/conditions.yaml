    message: "{path} names field {field} more than once"
  source_field_name_empty:
    phases: [ingest]
    message: "field {field} of {path} has an empty name"
  source_field_type_unsupported:
    phases: [ingest]
    message: "field {field} of {path} has the unsupported type {stored_type}"
  source_field_value_invalid:
    phases: [ingest]
    message: "field {field} of {path} holds the invalid value {value}"
  source_header_absent:
    phases: [ingest]
    message: "{path} has no header record"
  # ODM-1: the refusals of an ODM source; `path` is the source as given.
  source_odm_archive_invalid:
