    phases: [validation]
    message: "{identifier} reads a driver field that is neither a group key nor inside an aggregate"
  unique_failed:
    phases: [verification]
    message: "the combination of {columns} repeats in {failure_count} of the rows"
  unknown_artifact_profile:
    phases: [validation]
    message: "the extension of {path} is not one of {permitted}"
  unknown_codelist:
    phases: [validation]
    message: "column {column} binds codelist {codelist}, which is not declared"
  # LOOKUP-22
  unknown_derive_variable:
    phases: [validation]
    message: "{variable} is not a derive binding of the aggregate"
  unknown_document:
    phases: [validation]
    message: "{spec_path} names the document {document}, which is not declared"
  unknown_field:
    phases: [validation]
    message: "{identifier} is not a known field or reference at {spec_path}"
  unknown_intermediate_driver_type:
    phases: [validation]
    message: "intermediate {intermediate} drives rows but exposes fields without a known type: {columns}"
  unknown_operation:
    phases: [validation]
    message: "{operation} is not an operation of {registry}"
  unknown_project_function:
    phases: [validation]
    message: "project function {function} is not declared"
  unknown_reference:
    phases: [validation]
    message: "{column} reads {dependency}, which no input or earlier column declares"
  # PROJECT-14
  unknown_section:
    phases: [validation]
    message: "the project declares no section {section}"
  # PROJECT-6
  unknown_specification_name:
    phases: [validation]
    message: "the project has no specification named {name}"
  # DEFINE-8
  unknown_standard:
    phases: [validation]
    message: "section {section} declares no standard {value}"
  unknown_window:
    phases: [validation]
    message: "window {window} is not declared"
  # PROJECT-10
  unlinked_producer:
    phases: [validation]
    message: "input {dataset} reads {path}, the artifact of another specification, without a schema link"
  unmapped_value:
    phases: [mapping]
    message: "the value '{value}' of {source} has no mapping"
  unmatched_key:
    phases: [join]
    message: "lookup {intermediate} finds no record in {dataset}, and require_match is true"
  unmatched_pattern:
    phases: [mapping]
    message: "the value '{value}' does not match the pattern {pattern}"
  unpaired_fields:
    phases: [validation]
    message: "the lookup declares {declared} without {missing}"
  unresolvable_name:
    phases: [validation]
    message: "{identifier} must be qualified, for example as {suggestion}"
  # SCHEMA-2, LAYER-4
  unsupported_language_version:
    phases: [validation]
    message: "this engine does not read language version {version}"
    renamed_from: schema_version_mismatch
  unsupported_operation:
    phases: [planning]
    message: "{operation} is not supported by this engine"
  untransportable_text:
    phases: [validation]
    message: "{spec_path} holds a {whitespace} character, which define.xml cannot carry there"
  value_level_multiple_matches:
    phases: [verification]
    message: "several value-level entries of column {column} select the same row in {failure_count} of the rows"
  value_level_overlap:
    phases: [validation]
    message: "the value-level entries {entries} of column {column} overlap"
  value_level_unmatched:
    phases: [verification]
    message: "value-level entry {entry} of column {column} selects no row"
  value_level_where_invalid:
    phases: [validation]
    message: "the where clause of value-level entry {entry} of column {column} is invalid ({reason})"
  value_not_permitted:
    phases: [validation]
    message: "{spec_path} has the value {value}, which is not permitted"
  window_order_by_required:
    phases: [validation]
    message: "{operation} needs a window order_by"
  xpt_display_format_invalid:
    phases: [validation]
    message: "display format {display_format} of column {column} is not a SAS format an XPT file carries"
  xpt_file_too_large:
    phases: [output]
    message: "the XPT file for {dataset} would hold {bytes} bytes, more than the transport carries"
  xpt_last_row_blank:
    phases: [output]
    message: "the last row of {dataset} would encode to blanks only"
  xpt_value_out_of_range:
    phases: [output]
    message: "column {column} of {dataset} holds {value}, which an XPT file cannot carry: {detail}"
  zero_offset:
    phases: [validation]
    message: "row_value takes a nonzero offset, not {offset}"

