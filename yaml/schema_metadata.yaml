version: "1.0"

# See REQ-1148 in rules/submission/metadata.md.

submission_dataset_class:
    - label:
        type: str
        required: true
        min_length: 1
        description: See REQ-1130 in rules/submission/metadata.md.
    - class:
        type: dataset_class_name
        required: true
        description: See REQ-1130 in rules/submission/metadata.md.
    - subclass:
        type: dataset_subclass_name
        required: false
        description: See REQ-1130 in rules/submission/metadata.md.
    - structure:
        type: str
        required: true
        min_length: 1
        description: See REQ-1130 in rules/submission/metadata.md.
    - repeating:
        type: bool
        required: true
        description: See REQ-1130 in rules/submission/metadata.md.
    - reference_data:
        type: bool
        default: false
        description: See REQ-1130 in rules/submission/metadata.md.
    - domain:
        type: identifier
        required: false
        description: See REQ-1130 in rules/submission/metadata.md.
    - comment:
        type: submission_comment
        required: false
        description: See REQ-1130 in rules/submission/metadata.md.

submission_column_class:
    - core:
        type: core_designation
        required: false
        description: See REQ-1131 in rules/submission/metadata.md.
    - mandatory:
        type: bool
        required: false
        description: See REQ-1131 in rules/submission/metadata.md.
    - role:
        type: str
        required: false
        min_length: 1
        description: See REQ-1131 in rules/submission/metadata.md.
    - data_type:
        type: define_data_type
        required: false
        description: See REQ-1131 in rules/submission/metadata.md.
    - length:
        type: int
        required: false
        description: See REQ-1131 in rules/submission/metadata.md.
    - significant_digits:
        type: int
        required: false
        description: See REQ-1131 in rules/submission/metadata.md.
    - display_format:
        type: str
        required: false
        min_length: 1
        description: See REQ-1131 in rules/submission/metadata.md.
    - codelist:
        type: identifier
        required: false
        description: See REQ-1131 in rules/submission/metadata.md.
    - inventory_vocabulary:
        type: bool
        required: false
        description: See REQ-1156 in rules/submission/terminology.md.
    - origin:
        type: submission_origin_class
        required: true
        description: See REQ-1131 in rules/submission/metadata.md.
    - method:
        type: submission_method
        required: false
        description: See REQ-1131 in rules/submission/metadata.md.
    - comment:
        type: submission_comment
        required: false
        description: See REQ-1131 in rules/submission/metadata.md.

# See REQ-1157 in rules/submission/metadata.md.

submission_origin_class:
    - type:
        type: origin_type
        required: true
        description: See REQ-1132 in rules/submission/metadata.md.
    - source:
        type: origin_source
        required: false
        description: See REQ-1132 in rules/submission/metadata.md.
    - description:
        type: str
        required: false
        min_length: 1
        description: See REQ-1132 in rules/submission/metadata.md.
    - documents:
        type: "list[document_reference]"
        required: false
        description: See REQ-1132 in rules/submission/metadata.md.

submission_method_class:
    - name:
        type: str
        required: false
        min_length: 1
        description: See REQ-1133 in rules/submission/metadata.md.
    - type:
        type: method_type
        default: Computation
        description: See REQ-1133 in rules/submission/metadata.md.
    - description:
        type: str
        required: true
        min_length: 1
        description: See REQ-1133 in rules/submission/metadata.md.
    - expression:
        type: formal_expression_class
        required: false
        description: See REQ-1133 in rules/submission/metadata.md.
    - documents:
        type: "list[document_reference]"
        required: false
        description: See REQ-1133 in rules/submission/metadata.md.

submission_comment_class:
    - text:
        type: str
        required: true
        min_length: 1
        description: See REQ-1134 in rules/submission/metadata.md.
    - documents:
        type: "list[document_reference]"
        required: false
        description: See REQ-1134 in rules/submission/metadata.md.

formal_expression_class:
    - context:
        type: str
        required: true
        min_length: 1
        description: See REQ-1135 in rules/submission/metadata.md.
    - code:
        type: str
        required: true
        min_length: 1
        description: See REQ-1135 in rules/submission/metadata.md.

document_reference_class:
    - document:
        type: identifier
        required: true
        description: See REQ-1136 in rules/submission/metadata.md.
    - pages:
        type: page_reference_class
        required: false
        description: See REQ-1136 in rules/submission/metadata.md.

page_reference_class:
    - type:
        type: str
        required: true
        values: [PhysicalRef, NamedDestination]
        description: See REQ-1137 in rules/submission/metadata.md.
    - refs:
        type: str
        required: true
        min_length: 1
        description: See REQ-1137 in rules/submission/metadata.md.
    - title:
        type: str
        required: false
        min_length: 1
        description: See REQ-1137 in rules/submission/metadata.md.

submission_comment:
    type: [str, submission_comment_class]
    description: See REQ-1138 in rules/submission/metadata.md.

submission_method:
    type: [str, submission_method_class]
    description: See REQ-1139 in rules/submission/metadata.md.

document_reference:
    type: [identifier, document_reference_class]
    description: See REQ-1140 in rules/submission/metadata.md.

core_designation:
    type: str
    values: [Req, Exp, Perm]
    description: See REQ-1141 in rules/submission/metadata.md.

origin_type:
    type: str
    values: [Assigned, Collected, Derived, Not Available, Other, Predecessor,
        Protocol]
    description: See REQ-1142 in rules/submission/metadata.md.

origin_source:
    type: str
    values: [Investigator, Sponsor, Subject, Vendor]
    description: See REQ-1143 in rules/submission/metadata.md.

method_type:
    type: str
    values: [Computation, Imputation]
    description: See REQ-1144 in rules/submission/metadata.md.

define_data_type:
    type: str
    values: [text, integer, float, date, datetime, time, partialDate,
        partialTime, partialDatetime, incompleteDate, incompleteTime,
        incompleteDatetime, durationDatetime, intervalDatetime, URI]
    description: See REQ-1145 in rules/submission/metadata.md.

dataset_class_name:
    type: str
    values: [ADAM OTHER, BASIC DATA STRUCTURE, DEVICE LEVEL ANALYSIS DATASET,
        EVENTS, FINDINGS, FINDINGS ABOUT, INTERVENTIONS,
        MEDICAL DEVICE BASIC DATA STRUCTURE,
        MEDICAL DEVICE OCCURRENCE DATA STRUCTURE, OCCURRENCE DATA STRUCTURE,
        REFERENCE DATA STRUCTURE, RELATIONSHIP, SPECIAL PURPOSE,
        STUDY REFERENCE, SUBJECT LEVEL ANALYSIS DATASET, TRIAL DESIGN]
    description: See REQ-1146 in rules/submission/metadata.md.

dataset_subclass_name:
    type: str
    values: [ADVERSE EVENT, MEDICAL DEVICE TIME-TO-EVENT,
        NON-COMPARTMENTAL ANALYSIS, POPULATION PHARMACOKINETIC ANALYSIS,
        TIME-TO-EVENT]
    description: See REQ-1147 in rules/submission/metadata.md.
