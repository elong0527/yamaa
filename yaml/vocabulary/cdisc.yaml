# The closed CDISC vocabularies a specification and a project file are read
# against: models (SUB-3), dataset classes and subclasses (SUB-4), standard
# names (DEFINE-6, CT-2) and statuses (DEFINE-13), publishing sets (CT-2),
# origin types and sources (SUB-14), column roles (SUB-9), core designations
# (SUB-10), submission data types (SUB-6) and where comparators (SUB-12).
#
# `version` is the newest language version whose values this file lists, and
# each value's `since` is the version that admitted it. A vocabulary grows
# only by adding values; a value is never removed in 1.x.
#
# Each vocabulary names the schema type that spells it (`type`), or the class
# field that lists its values (`field`, written class.field), in yaml/ and
# yaml/v1/, which must list exactly its values; `schemas` limits that to the
# schema sets it names. One that names a Define-XML `enumeration` must equal
# that simple type of the Define-XML schema bundled at
# rust/tests/schemas/define/2.1/define-enumerations.xsd, whose release
# `source` names. `python -m tools.validation.check_cdisc_vocabulary` checks
# both.
#
# The tables of SUB-3, SUB-9, SUB-10, SUB-15, SUB-26 and JSON-10 list these
# values too; `python -m tools.validation.check_cdisc_tables` keeps them to
# this file.
version: "1.0"
source:
  define_xml: "2.1.11"
  terminology: "2026-03-27"
vocabularies:
  # The CDISC spellings of the three models (P-MODEL-1). Only the 1.0 schema
  # declares `model`.
  model:
    field: root_class.model
    schemas: [yaml/v1]
    values:
      - {value: SDTM, since: "1.0"}
      - {value: SEND, since: "1.0"}
      - {value: ADaM, since: "1.0"}
  dataset_class:
    type: dataset_class_name
    enumeration: ItemGroupClass
    values:
      - {value: ADAM OTHER, since: "1.0"}
      - {value: BASIC DATA STRUCTURE, since: "1.0"}
      - {value: DEVICE LEVEL ANALYSIS DATASET, since: "1.0"}
      - {value: EVENTS, since: "1.0"}
      - {value: FINDINGS, since: "1.0"}
      - {value: FINDINGS ABOUT, since: "1.0"}
      - {value: INTERVENTIONS, since: "1.0"}
      - {value: MEDICAL DEVICE BASIC DATA STRUCTURE, since: "1.0"}
      - {value: MEDICAL DEVICE OCCURRENCE DATA STRUCTURE, since: "1.0"}
      - {value: OCCURRENCE DATA STRUCTURE, since: "1.0"}
      - {value: REFERENCE DATA STRUCTURE, since: "1.0"}
      - {value: RELATIONSHIP, since: "1.0"}
      - {value: SPECIAL PURPOSE, since: "1.0"}
      - {value: STUDY REFERENCE, since: "1.0"}
      - {value: SUBJECT LEVEL ANALYSIS DATASET, since: "1.0"}
      - {value: TRIAL DESIGN, since: "1.0"}
  dataset_subclass:
    type: dataset_subclass_name
    enumeration: ItemGroupSubClass
    values:
      - {value: ADVERSE EVENT, since: "1.0"}
      - {value: MEDICAL DEVICE TIME-TO-EVENT, since: "1.0"}
      - {value: NON-COMPARTMENTAL ANALYSIS, since: "1.0"}
      - {value: POPULATION PHARMACOKINETIC ANALYSIS, since: "1.0"}
      - {value: TIME-TO-EVENT, since: "1.0"}
  standard_name:
    type: standard_name
    enumeration: StandardName
    values:
      - {value: ADaMIG, since: "1.0"}
      - {value: ADaMIG-MD, since: "1.0"}
      - {value: BIMO, since: "1.0"}
      - {value: CDISC/NCI, since: "1.0"}
      - {value: SDTMIG, since: "1.0"}
      - {value: SDTMIG-AP, since: "1.0"}
      - {value: SDTMIG-MD, since: "1.0"}
      - {value: SENDIG, since: "1.0"}
      - {value: SENDIG-AR, since: "1.0"}
      - {value: SENDIG-DART, since: "1.0"}
      - {value: SENDIG-GENETOX, since: "1.0"}
  # The Define-XML schema lists these three and also admits any other text;
  # an implementation guide's status takes only the three. The 0.5 schema in
  # yaml/ lists Draft and Final, as Provisional is new in 1.0 (P-STD-1), so
  # only yaml/v1/ is compared.
  standard_status:
    field: implementation_guide_class.status
    enumeration: StandardStatus
    schemas: [yaml/v1]
    values:
      - {value: Draft, since: "1.0"}
      - {value: Final, since: "1.0"}
      - {value: Provisional, since: "1.0"}
  publishing_set:
    field: terminology_standard_class.publishing_set
    enumeration: StandardPublishingSet
    values:
      - {value: ADaM, since: "1.0"}
      - {value: CDASH, since: "1.0"}
      - {value: DEFINE-XML, since: "1.0"}
      - {value: SDTM, since: "1.0"}
      - {value: SEND, since: "1.0"}
  origin_type:
    type: origin_type
    enumeration: OriginType
    values:
      - {value: Assigned, since: "1.0"}
      - {value: Collected, since: "1.0"}
      - {value: Derived, since: "1.0"}
      - {value: Not Available, since: "1.0"}
      - {value: Other, since: "1.0"}
      - {value: Predecessor, since: "1.0"}
      - {value: Protocol, since: "1.0"}
  origin_source:
    type: origin_source
    enumeration: OriginSource
    values:
      - {value: Investigator, since: "1.0"}
      - {value: Sponsor, since: "1.0"}
      - {value: Subject, since: "1.0"}
      - {value: Vendor, since: "1.0"}
  # The Define-XML schema leaves ItemRef/@Role open; SDTM v2.0 section 2.1
  # publishes these nine, which SENDIG 3.1.1 section 2.4 also uses.
  role:
    type: column_role
    values:
      - {value: Identifier, since: "1.0"}
      - {value: Topic, since: "1.0"}
      - {value: Timing, since: "1.0"}
      - {value: Grouping Qualifier, since: "1.0"}
      - {value: Result Qualifier, since: "1.0"}
      - {value: Synonym Qualifier, since: "1.0"}
      - {value: Record Qualifier, since: "1.0"}
      - {value: Variable Qualifier, since: "1.0"}
      - {value: Rule, since: "1.0"}
  # Define-XML has no core attribute; SDTMIG 3.4 section 4.1.5 publishes Req,
  # Exp and Perm, and the ADaM implementation guides Req, Cond and Perm.
  core_designation:
    type: core_designation
    values:
      - {value: Req, since: "1.0"}
      - {value: Exp, since: "1.0"}
      - {value: Perm, since: "1.0"}
      - {value: Cond, since: "1.0"}
  # Within the DataType of ODM 1.3.2, bundled at
  # rust/tests/schemas/odm/1.3.2/ODM1-3-2-foundation.xsd, which Define-XML
  # uses and its enumerations do not repeat.
  submission_data_type:
    type: define_data_type
    values:
      - {value: text, since: "1.0"}
      - {value: integer, since: "1.0"}
      - {value: float, since: "1.0"}
      - {value: date, since: "1.0"}
      - {value: datetime, since: "1.0"}
      - {value: time, since: "1.0"}
      - {value: partialDate, since: "1.0"}
      - {value: partialTime, since: "1.0"}
      - {value: partialDatetime, since: "1.0"}
      - {value: incompleteDate, since: "1.0"}
      - {value: incompleteTime, since: "1.0"}
      - {value: incompleteDatetime, since: "1.0"}
      - {value: durationDatetime, since: "1.0"}
      - {value: intervalDatetime, since: "1.0"}
      - {value: URI, since: "1.0"}
  # The comparator a where condition states; a bare list of values is EQ or
  # IN. Within the Comparator of ODM 1.3.2. Only the 1.0 schema declares it.
  comparator:
    field: where_comparison_class.comparator
    schemas: [yaml/v1]
    values:
      - {value: NE, since: "1.0"}
      - {value: NOTIN, since: "1.0"}
