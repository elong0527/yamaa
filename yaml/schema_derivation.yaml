version: "1.0"

includes:
    - schema_expression_core.yaml
    - schema_expression_mapping.yaml
    - schema_expression_str.yaml
    - schema_expression_numeric.yaml
    - schema_expression_date.yaml
    - schema_expression_window.yaml
    - schema_expression_aggregate.yaml
    - schema_expression_odm.yaml
    - schema_expression_function.yaml

expression:
    type: [str, int, float, bool, "null", operation]
    kind: expression
    description: One expression, either text in the closed grammar, where a bare name is a reference and quoted text a literal, or a YAML number, Boolean or null, which is a literal, or a mapping holding one registered operation (EXPR-5).

operation:
    registry: expressions

derivation:
    type: [expression, handled_expression_class]
    kind: expression

handled_expression_class:
    - value: {type: expression, required: true}
    - unconvertible: {type: substitute_value, required: false}

# See LOOKUP-15.
intermediate_derivation:
    type: [untyped_intermediate_derivation, intermediate_binding_class]
    kind: expression

untyped_intermediate_derivation:
    type: expression

intermediate_binding_class:
    - type: {type: column_type, required: true}
    - derivation: {type: untyped_intermediate_derivation, required: true}
    - unconvertible: {type: substitute_value, required: false}
