[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cdiscbuilderv2"
version = "0.2.0"
description = "Next generation CDISC SDTM builder using Yamaa schema and Polars with EDC ODM XML ingestion"
readme = "README.md"
authors = [{name = "Ming-Chun Chen", email = "hellomingchun@gmail.com"}]
license = {text = "MIT"}
keywords = ["cdisc", "sdtm", "clinical-trials", "clinical-data", "edc", "odm", "polars", "yamaa"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "pyyaml>=6.0",
    "polars>=0.20.0",
    "defusedxml>=0.7.1",
    "pyreadstat>=1.2.0",
    "reportlab>=5.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pyarrow>=10.0.0",
    "pandas>=1.5.0",
]
requires-python = ">=3.9"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/hellomingchun/cdiscbuilderv2"
Repository = "https://github.com/hellomingchun/cdiscbuilderv2"
Issues = "https://github.com/hellomingchun/cdiscbuilderv2/issues"

[project.scripts]
cdiscbuilder = "cdiscbuilderv2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cdiscbuilderv2 = [
    "schemas/**/*",
    "schemas/standards/*",
    "schemas/templates/*",
    "schemas/examples/cath/*",
]
