VS:
  type: FINDINGS
  definitions:
    STUDYID:
      source: "StudyOID"
    DOMAIN:
      literal: "VS"
    USUBJID:
      source: "SubjectKey"
    VSSEQ:
      group: ["USUBJID"]
    EPOCH:
      literal: "TREATMENT"
    VSDY:
      function_: "calculate_study_day"
      args: ["VSDTC", "_DM_REF.RFSTDTC"]

  columns:
    - name: SYSBP
      formoid: ["FO.NCT00789880.VS"]
      itemoid: ["IT.NCT00789880.VS.SYSBP"]
      VSTESTCD: {literal: "SYSBP"}
      VSTEST: {literal: "Systolic Blood Pressure"}
      VSORRES: {source: "IT.NCT00789880.VS.SYSBP"}
      VSORRESU: {literal: "mmHg"}
      VSSTRESC: {source: "IT.NCT00789880.VS.SYSBP"}
      VSSTRESN: {source: "IT.NCT00789880.VS.SYSBP", type: "float"}
      VSSTRESU: {literal: "mmHg"}
      VSDTC: {source: "IT.NCT00789880.VS.VSDTC"}
      
    - name: DIABP
      formoid: ["FO.NCT00789880.VS"]
      itemoid: ["IT.NCT00789880.VS.DIABP"]
      VSTESTCD: {literal: "DIABP"}
