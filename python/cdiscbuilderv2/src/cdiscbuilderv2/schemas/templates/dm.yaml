# Special Purpose Domain Template (e.g., DM, CO, SV)
# Characteristics: 
# - Often exactly one record per subject (like DM) or highly specific key structures
# - Explicitly requires 'keys' to override default repeating keys when necessary

_DM_REF:
  - formoid: ["FO.NCT00789880.DM"]
    keys: ["StudyOID", "SubjectKey"]
    columns:
      USUBJID:
        source: "SubjectKey"
      RFSTDTC:
        source: "IT.NCT00789880.DM.RFSTDTC"

DM:
  - formoid: ["FO.NCT00789880.DM"]
    # OVERRIDE DEFAULT KEYS for Subject-level granularity
    keys: ["StudyOID", "SubjectKey"]
    columns:
      # Metadata overrides
      STUDYID:
        source: "StudyOID"
      DOMAIN:
        literal: "DM"
      USUBJID:
        source: "SubjectKey"
      SUBJID:
        source: "SubjectKey"
        
      # Local variables
      SITEID:
        source: "IT.NCT00789880.DM.SITEID"
      AGE:
        source: "IT.NCT00789880.DM.AGE"
      AGEU:
        literal: "YEARS"
      SEX:
        source: "IT.NCT00789880.DM.SEX"
        value_mapping:
          "Male": "M"
          "Female": "F"
          "Unknown": "U"
      RACE:
        source: "IT.NCT00789880.DM.RACE"
      ETHNIC:
        source: "IT.NCT00789880.DM.ETHNIC"
        value_mapping:
          "NOT HISPANIC": "NOT HISPANIC OR LATINO"
          "HISPANIC": "HISPANIC OR LATINO"
      COUNTRY:
        source: "IT.NCT00789880.DM.COUNTRY"
      ARMCD:
        source: "IT.NCT00789880.DM.ARMCD"
      ARM:
        source: "IT.NCT00789880.DM.ARM"
      ACTARMCD:
        source: "ARMCD" # copies from already mapped ARMCD
      ACTARM:
        source: "ARM"
      RFSTDTC:
        source: "IT.NCT00789880.DM.RFSTDTC"
        
      # Cross-domain references (will be NA until EX/DS domains are configured)
      RFXSTDTC:
        source: "EX.EXSTDTC"
      RFXENDTC:
        source: "EX.EXENDTC"
      RFENDTC:
        function_: "calc_rfendtc"
        args: ["RFSTDTC", "DS.DSSTDY"]
