schema_version: "1.0"
version: "1.0.0"

runtime:
  language: python
  artifact:
    reference: org.example/yamaa/bmi-python:1.0.0
    digest: sha256:3fcd8a9f177c36d7e6596d68524a5baecf96bdeae1c0434f2a6aef8cd9745577

functions:
  bmi:
    contract_version: "1.0.0"
    description: Calculate body mass index from kilograms and centimetres.
    params:
      - name: weight_kg
        type: float
      - name: height_cm
        type: float
      - name: cm_per_m
        type: int
        required: false
        default: 100
    returns: float
    binding:
      call: projectbmi.bmi
    conformance: conformance/bmi.yaml
