[build-system]
requires = ["maturin==1.9.6"]
build-backend = "yamaa_build_backend"
backend-path = ["."]

[project]
name = "yamaa"
version = "0.5.0"
description = "Python helpers for the yamaa clinical data specification"
readme = "README.md"
requires-python = ">=3.12"
# The project is MIT, with Unicode-3.0 data in its Unicode tables; the wheels
# also link Apache-2.0, BSD-3-Clause and Zlib crates.
# tools.packaging.generate_third_party_notices derives this expression.
license = "MIT AND Apache-2.0 AND BSD-3-Clause AND Unicode-3.0 AND Zlib"
license-files = ["LICENSE.txt", "LICENSE-THIRD-PARTY.txt", "LICENSE-UNICODE.txt", "LICENSE-READSTAT.txt", "LICENSE-YAML.txt"]
authors = [
  { name = "Yilong Zhang", email = "elong0527@gmail.com" },
  { name = "Ming-Chun Chen" },
  { name = "Peng Zhang" },
  { name = "Bingjun Wang" },
  { name = "Jingwei Xiong" },
]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
  # Polars before 2.0.0 returns None from Series methods on CPython 3.15.
  # The locked Parquet 55.2.0 writer records only type-defined column orders,
  # which Polars 1.35.2 reads; the IEEE 754 total-order form needs 1.43.2.
  "polars>=1.35.2; python_version < '3.15'",
  "polars>=2.0.0; python_version >= '3.15'",
  "packaging>=25",
]

[project.optional-dependencies]
style = [
  # Source nodes and marks for layout fixes, and YAML 1.2 values for lints.
  "pyyaml>=6.0.3",
  "py-yaml12>=0.2",
]
test = [
  # Tests include style checks and independent artifact/report readers.
  "pyyaml>=6.0.3",
  "py-yaml12>=0.2",
  # lxml 6.1.3 disables external parameter entities by default; 6.1.1 also
  # patched the libxslt bundled in its Linux wheels.
  "lxml>=6.1.3",
  # The older PyArrow and pydantic-core releases have no CPython 3.15 wheels.
  "pyarrow>=23.0.1; python_version < '3.15'",
  "pyarrow>=26.0.0; python_version >= '3.15'",
  "pydantic>=2.12.4; python_version < '3.15'",
  "pydantic>=2.14.0; python_version >= '3.15'",
  # Independent Dataset-JSON validation belongs to qualification, not runtime.
  "jsonschema>=4.25",
  "pytest>=9.1.1",
  "ruff>=0.16.7",
  "pyrefly>=1.4.0",
  "types-PyYAML>=6.0.12",
]

[dependency-groups]
benchmark = ["yamaa-benchmarks"]
tooling = [
  "yamaa-tools",
  # Dashboard snippets read specification names with the YAML 1.2 parser.
  "py-yaml12>=0.2",
  "mkdocs==1.6.1",
  "mkdocs-material==9.7.7",
  "markdown-it-py==4.0.0",
  "mdurl==0.1.2",
]
# Harbor runs the agent evaluations in evaluations/harbor/. Install it with
# `uv sync --project python --group harbor`; the package never imports it.
harbor = ["harbor==0.23.0"]

[tool.maturin]
locked = true
include = [{path = "yamaa_build_backend.py", format = "sdist"}]
bindings = "pyo3"
features = ["extension-module"]
module-name = "yamaa._native"
manifest-path = "../rust/crates/yamaa-python/Cargo.toml"
python-source = "src"
# A source archive must rebuild the extension rather than carry editable binaries.
exclude = [
  # Imports and tests must not change distribution contents. Applies to both formats.
  "**/__pycache__/**",
  "**/*.pyc",
  "**/*.pyo",
  {path = "src/yamaa/_native*.pyd", format = "sdist"},
  {path = "src/yamaa/_native*.so", format = "sdist"},
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend = "../pyproject.toml"

[tool.pyrefly]
project-includes = ["src/yamaa"]
preset = "default"

[tool.uv]
# `make setup` installs a built wheel, which uv rebuilds only when a file listed
# here changes. List every wheel input: the package files, the build backend,
# and the Rust sources the backend restores into a source archive. Paths are
# relative to this directory. uv walks everything under a glob's literal prefix,
# so no glob starts at `.`, `..` or `../rust`, which hold `.venv`, `build` and
# `target`.
cache-keys = [
  { file = "pyproject.toml" },
  { file = "README.md" },
  { file = "LICENSE.txt" },
  { file = "LICENSE-THIRD-PARTY.txt" },
  { file = "LICENSE-READSTAT.txt" },
  { file = "LICENSE-UNICODE.txt" },
  { file = "LICENSE-YAML.txt" },
  { file = "src/**" },
  { file = "yamaa_build_backend.py" },
  { file = "../rust/Cargo.toml" },
  { file = "../rust/Cargo.lock" },
  { file = "../rust/rust-toolchain.toml" },
  { file = "../rust/crates/*/Cargo.toml" },
  { file = "../rust/crates/*/build.rs" },
  { file = "../rust/crates/*/src/**/*.rs" },
  { file = "../rust/crates/yamaa-adapters/vendor/**" },
  { file = "../rust/vendor/**" },
]

[tool.uv.sources]
yamaa-benchmarks = { path = "../rust/tests/project-programs/python", editable = true }
yamaa-tools = { path = "..", editable = true }
