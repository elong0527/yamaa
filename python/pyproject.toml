[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "yamaa"
version = "0.2.0"
description = "Python helpers for the yamaa clinical data specification"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "yamaa contributors" }]
dependencies = [
  "jsonschema>=4.25",
  "lxml>=6.1.0",
  "polars>=1.35.2",
  "py-yaml12>=0.2",
  "pyarrow>=23.0.1",
  "pydantic>=2.12.4",
  "pyyaml>=6.0.3",
]

[project.optional-dependencies]
test = [
  "pytest>=9.1.1",
  "ruff>=0.16.7",
]

[dependency-groups]
# Harbor runs the agent evaluations in evaluations/harbor/. Install it with
# `uv sync --project python --group harbor`; the package never imports it.
harbor = ["harbor==0.23.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/yamaa"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
