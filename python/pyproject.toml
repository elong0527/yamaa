[build-system]
requires = ["maturin==1.9.6"]
build-backend = "maturin"

[project]
name = "yamaa"
version = "0.2.0"
description = "Python helpers for the yamaa clinical data specification"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT AND Unicode-3.0"
license-files = ["LICENSE-UNICODE.txt", "LICENSE-WINDOWS.txt"]
authors = [{ name = "yamaa contributors" }]
dependencies = [
  "jsonschema>=4.25",
  "lxml>=6.1.0",
  "polars>=1.35.2",
  "py-yaml12>=0.2",
  "pyarrow>=23.0.1",
  "pydantic>=2.12.4",
  "packaging>=25",
  "pyyaml>=6.0.3",
]

[project.optional-dependencies]
test = [
  "pytest>=9.1.1",
  "ruff>=0.16.7",
]

[dependency-groups]
# Harbor runs the agent evaluations in evaluations/harbor/. Install it with
# `uv sync --project python --group harbor`; the package never imports it.
harbor = ["harbor==0.23.0"]

[tool.maturin]
bindings = "pyo3"
module-name = "yamaa._native"
manifest-path = "../rust/crates/yamaa-python/Cargo.toml"
python-source = "src"
# A source archive must rebuild the extension rather than carry editable binaries.
exclude = [
  {path = "src/yamaa/_native*.pyd", format = "sdist"},
  {path = "src/yamaa/_native*.so", format = "sdist"},
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
