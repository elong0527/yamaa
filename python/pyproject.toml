[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "yamaa"
version = "0.1.0"
description = "Python helpers for the YAMAA clinical data specification"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "YAMAA contributors" }]
dependencies = [
  "lxml>=6.1.3,<7",
  "polars>=1.35.2,<2",
  "pyarrow>=25.0.1,<26",
  "pydantic>=2.13.5,<3",
]

[project.optional-dependencies]
test = [
  "pytest>=9.1.1,<10",
  "ruff>=0.16.7,<0.17",
]

[tool.hatch.build.targets.wheel]
packages = ["src/yamaa"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
