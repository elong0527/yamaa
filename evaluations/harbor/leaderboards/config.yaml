attempts: 1
harbor:
  visibility: private
  metadata_schema:
    type: object
    required:
    - agent
    - agent_version
    - model
    - variant
    - date
    - attempts
    - job
    - grading_protocol
    - image_reference
    - verifier_image_reference
    - yamaa_commit
    - agent_configuration
    properties:
      agent:
        type: string
        description: Harbor agent name
      agent_version:
        type: string
        description: Agent version the job pinned
      model:
        type: string
        description: provider/model, as passed to build.py --model
      variant:
        type: string
        description: The agent's model variant, OpenCode's reasoning effort (low,
          medium, high, xhigh), or default when the job set none
      agent_configuration:
        type: object
        description: Preserved behavior settings with credentials redacted
      date:
        type: string
        format: date
        description: Day the first trial started (UTC)
      attempts:
        type: integer
        description: Attempts per task (Harbor n_attempts)
      job:
        type: string
        description: Harbor job name
      job_url:
        type: string
        description: Link to the uploaded Harbor job
      job_id:
        type:
        - string
        - 'null'
        description: Harbor job id, when the job directory recorded it
      harbor_version:
        type:
        - string
        - 'null'
        description: Harbor version from the job's lock.json
      grading_protocol:
        type: string
        description: Version of the grading and submission isolation protocol
      image_reference:
        type: string
        description: Agent image reference recorded in preserved task evidence
      verifier_image_reference:
        type: string
        description: Separate verifier image reference recorded in preserved task
          evidence
      yamaa_commit:
        type:
        - string
        - 'null'
        description: yamaa commit the tasks were built from (task.toml metadata),
          with +dirty when the tree had uncommitted changes
  metrics_schema:
    type: object
    required:
    - reward
    - cell_accuracy
    - row_accuracy
    - n_trials
    - n_errors
    properties:
      reward:
        type: number
        description: 'Mean per-task pass rate: the share of attempts that pass (every
          golden cell matches, the rerun reproduces the output, no other language
          or web tool); an errored trial counts as 0'
      task_pass_rate_display:
        type: string
        description: Task pass rate formatted as a percentage
      n_passed_trials:
        type: integer
        description: Attempts that passed every required check
      passed_trials_display:
        type: string
        description: Successful attempts / total attempts
      cell_accuracy:
        type: number
        description: Mean share of golden cells reproduced
      row_accuracy:
        type: number
        description: Mean share of golden rows reproduced
      n_trials:
        type: integer
        description: Trials the metrics aggregate
      n_errors:
        type: integer
        description: Trials that ended in an exception
      input_tokens:
        type:
        - integer
        - 'null'
        description: Total input tokens, when every trial reported them
      output_tokens:
        type:
        - integer
        - 'null'
        description: Total output tokens, when every trial reported them
      cost_usd:
        type:
        - number
        - 'null'
        description: Total model cost, when every trial reported it
      agent_seconds:
        type:
        - number
        - 'null'
        description: Mean agent execution time per trial
      trial_reward:
        type: number
        description: Mean reward over trials, matching Harbor
      reward_ci_low:
        type:
        - number
        - 'null'
        description: Lower 95 percent task bootstrap bound; null for a single task
      reward_ci_high:
        type:
        - number
        - 'null'
        description: Upper 95 percent task bootstrap bound; null for a single task
      cost_per_trial_usd:
        type:
        - number
        - 'null'
        description: Mean cost per attempt when every trial reports cost
    patternProperties:
      ^pass_at_[0-9]+$:
        type: number
        description: Harbor's unbiased pass@k averaged over tasks, for each k that
          the fewest attempts on a task allow (k = 2, 4, 5, 8, 10, ...)
  columns:
  - id: agent
    header: Agent
    accessor: metadata.agent
    type: text
  - id: agent_version
    header: Version
    accessor: metadata.agent_version
    type: text
  - id: model
    header: Model
    accessor: metadata.model
    type: text
  - id: variant
    header: Variant
    accessor: metadata.variant
    type: text
  - id: reward
    header: Task pass rate
    accessor: metrics.reward
    type: number
    display_accessor: metrics.task_pass_rate_display
    display_type: text
    align: right
    description: 'Mean per-task pass rate: every golden cell matches, the rerun reproduces
      the output, and no other language or web tool was used'
  - id: passed_trials
    header: Passed / attempts
    accessor: metrics.n_passed_trials
    type: number
    display_accessor: metrics.passed_trials_display
    display_type: text
    align: right
  - id: job
    header: Job
    accessor: metadata.job_url
    type: link
  - id: pass_at_2
    header: Pass@2
    accessor: metrics.pass_at_2
    type: number
    align: right
  - id: cell_accuracy
    header: Cell accuracy
    accessor: metrics.cell_accuracy
    type: number
    align: right
  - id: n_errors
    header: Errors
    accessor: metrics.n_errors
    type: number
    align: right
  - id: input_tokens
    header: Tokens in
    accessor: metrics.input_tokens
    type: number
    align: right
  - id: output_tokens
    header: Tokens out
    accessor: metrics.output_tokens
    type: number
    align: right
  - id: reward_ci_low
    header: Pass rate lower bound
    accessor: metrics.reward_ci_low
    type: number
    align: right
  - id: reward_ci_high
    header: Pass rate upper bound
    accessor: metrics.reward_ci_high
    type: number
    align: right
  - id: cost_per_trial_usd
    header: Cost per attempt
    accessor: metrics.cost_per_trial_usd
    type: number
    align: right
  - id: cost_usd
    header: Cost
    accessor: metrics.cost_usd
    type: number
    align: right
  - id: date
    header: Date
    accessor: metadata.date
    type: date
  - id: yamaa_commit
    header: Tasks from
    accessor: metadata.yamaa_commit
    type: text
  rank_by:
  - accessor: metrics.reward
    direction: desc
    nulls: last
  - accessor: metrics.cell_accuracy
    direction: desc
    nulls: last
  - accessor: metrics.cost_per_trial_usd
    direction: asc
    nulls: last
