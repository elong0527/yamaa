# A leaderboard ranks Harbor jobs uploaded to Harbor Hub, one row per job:
# one agent, model, and variant (reasoning effort).
# A run belongs here only when it covers every task below with equal
# attempt counts and at least `attempts` attempts each, at the tasks' own
# timeouts, so every row answers
# the same question. Metrics are computed from the listed tasks only.
# What each prompt tier keeps is in evaluations/harbor/prompts/README.md;
# rows rank by complete task pass rate first; cell accuracy is secondary.
# This board is the whole R track on the brief prompts: every buildable
# SDTM and ADaM benchmark, each requiring `/app/output/result.R`.
