# A leaderboard ranks Harbor jobs uploaded to Harbor Hub, one row per job:
# one agent, model, and variant (reasoning effort).
# A run belongs here only when it covers every task below with at least
# `attempts` attempts each, at the tasks' own timeouts, so every row answers
# the same question. Metrics are computed from the listed tasks only.
# This board is the R track: every task carries the R system prompt and
# requires `/app/output/result.R` alongside the dataset.
package: yamaa/yamaa-sdtm-adam-r
tasks:
  - adam-adae-death-r
  - adam-adsl-age-group-r
  - adam-adtte-dor-r
attempts: 3

# The Harbor Hub definition, in the shape `harbor hub leaderboard create
# --config` takes. `leaderboard.py export` adds `package` above and writes
# it with the rows built from the jobs, ready to create once the dataset is
# published and the jobs uploaded.
harbor:
  name: adam-pilot-r
  title: ADaM pilot (R)
  description: >-
    Three ADaM benchmarks solved in R: age groups in ADSL, death
    information on every adverse event in ADAE, and duration of response
    in ADTTE. An agent gets the R system prompt, the benchmark's prompt
    and input datasets, with no internet but the model's API. A task passes
    when its output matches every golden cell, the verifier's rerun of
    `/app/output/result.R` from a clean state writes the same output, the
    held-out rerun without every third subject writes the golden of the
    subjects kept, and the agent used no Python and no web tool. One row
    per model variant, each with at least three attempts per task.
  visibility: private
  metadata_schema:
    type: object
    required: [agent, agent_version, model, variant, date, attempts, job]
    properties:
      agent:
        type: string
        description: Harbor agent name
      agent_version:
        type: string
        description: Agent version the job pinned
      model:
        type: string
        description: provider/model, as passed to build.py --model
      variant:
        type: string
        description: >-
          The agent's model variant, OpenCode's reasoning effort (low,
          medium, high, xhigh), or default when the job set none
      date:
        type: string
        format: date
        description: Day the first trial started (UTC)
      attempts:
        type: integer
        description: Attempts per task (Harbor n_attempts)
      job:
        type: string
        description: Harbor job name
      job_id:
        type: [string, "null"]
        description: Harbor job id, when the job directory recorded it
      harbor_version:
        type: [string, "null"]
        description: Harbor version from the job's lock.json
      yamaa_commit:
        type: [string, "null"]
        description: >-
          yamaa commit the tasks were built from (task.toml metadata), with
          +dirty when the tree had uncommitted changes
  metrics_schema:
    type: object
    required: [reward, cell_accuracy, row_accuracy, n_trials, n_errors]
    properties:
      reward:
        type: number
        description: >-
          Mean reward over trials (Harbor's mean): the share of trials that
          pass (every golden cell matches, the rerun reproduces the output,
          no other language or web tool); an errored trial counts as 0
      cell_accuracy:
        type: number
        description: Mean share of golden cells reproduced
      row_accuracy:
        type: number
        description: Mean share of golden rows reproduced
      n_trials:
        type: integer
        description: Trials the metrics aggregate
      n_errors:
        type: integer
        description: Trials that ended in an exception
      input_tokens:
        type: [integer, "null"]
        description: Total input tokens, when every trial reported them
      output_tokens:
        type: [integer, "null"]
        description: Total output tokens, when every trial reported them
      cost_usd:
        type: [number, "null"]
        description: Total model cost, when every trial reported it
      agent_seconds:
        type: [number, "null"]
        description: Mean agent execution time per trial
    patternProperties:
      "^pass_at_[0-9]+$":
        type: number
        description: >-
          Harbor's unbiased pass@k averaged over tasks, for each k that the
          fewest attempts on a task allow (k = 2, 4, 5, 8, 10, ...)
  columns:
    - id: agent
      header: Agent
      accessor: metadata.agent
      type: text
    - id: agent_version
      header: Version
      accessor: metadata.agent_version
      type: text
    - id: model
      header: Model
      accessor: metadata.model
      type: text
    - id: variant
      header: Variant
      accessor: metadata.variant
      type: text
    - id: reward
      header: Pass rate
      accessor: metrics.reward
      type: number
      align: right
      description: >-
        Share of trials that pass: every golden cell matches, the rerun
        reproduces the output, and no other language or web tool was used
    - id: pass_at_2
      header: Pass@2
      accessor: metrics.pass_at_2
      type: number
      align: right
    - id: cell_accuracy
      header: Cell accuracy
      accessor: metrics.cell_accuracy
      type: number
      align: right
    - id: n_errors
      header: Errors
      accessor: metrics.n_errors
      type: number
      align: right
    - id: input_tokens
      header: Tokens in
      accessor: metrics.input_tokens
      type: number
      align: right
    - id: output_tokens
      header: Tokens out
      accessor: metrics.output_tokens
      type: number
      align: right
    - id: cost_usd
      header: Cost
      accessor: metrics.cost_usd
      type: number
      align: right
    - id: date
      header: Date
      accessor: metadata.date
      type: date
    - id: yamaa_commit
      header: Tasks from
      accessor: metadata.yamaa_commit
      type: text
  rank_by:
    - accessor: metrics.reward
      direction: desc
      nulls: last
    - accessor: metrics.cell_accuracy
      direction: desc
      nulls: last
    - accessor: metrics.cost_usd
      direction: asc
      nulls: last
