[package]
autotests = false
name = "yamaa-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT AND Unicode-3.0"
publish.workspace = true

[features]
test-support = []

[dependencies]
thiserror = "2.0.21"
serde_json = { version = "1.0.145", features = ["arbitrary_precision"] }
# Canonical numeric formatting and portable mathematics.
ryu = { version = "1.0.20", default-features = false }
# Disable architecture-specific math implementations. Exact: the portable-math
# golden values and saved bytes depend on this implementation.
libm = { version = "=0.2.16", default-features = false }
# Exact decimal rounding intermediates.
num-bigint = { version = "0.5.1", default-features = false }

# Integration targets are finite and explicit; support files are never discovered as binaries.
[[test]]
name = "numeric_tests"
path = "tests/numeric_tests.rs"

[[test]]
name = "scalar_tests"
path = "tests/scalar_tests.rs"

[[test]]
name = "relations_tests"
path = "tests/relations_tests.rs"

[[test]]
name = "schema_tests"
path = "tests/schema_tests.rs"

[[test]]
name = "project_tests"
path = "tests/project_tests.rs"

[[test]]
name = "source_tests"
path = "tests/source_tests.rs"

[[test]]
name = "diagnostics_tests"
path = "tests/diagnostics_tests.rs"

[[test]]
name = "portable_math_golden"
path = "tests/portable_math_golden.rs"

[[test]]
name = "execution_tests"
path = "tests/execution_tests.rs"

[[test]]
name = "preparation_tests"
path = "tests/preparation_tests.rs"

[[test]]
name = "service_tests"
path = "tests/service_tests.rs"

[[test]]
name = "test_support"
path = "tests/test_support.rs"
required-features = ["test-support"]
