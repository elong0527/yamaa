[package]
name = "yamaa-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT AND Unicode-3.0"
authors.workspace = true
publish.workspace = true
autotests = false

[dependencies]
thiserror = "2.0.21"
# Canonical numeric formatting and portable mathematics.
ryu = { version = "1.0.20", default-features = false }
# Disable architecture-specific math implementations. Exact: the portable-math
# golden values and saved bytes depend on this implementation.
libm = { version = "=0.2.16", default-features = false }
# Exact decimal rounding intermediates. The 0.4 series that the num crate of
# Arrow and Parquet 55.2.0 requires, so the engine builds one copy (#3696);
# 0.4.8 carries the division fix that 0.4.7 lacks.
num-bigint = { version = "0.4.8", default-features = false }
# Linear-time matching for the portable regex subset. Unicode tables stay off:
# the validator spells \d, \w, \s, \b and . as explicit sets. The lazy DFA,
# one-pass DFA and bounded backtracker are faster crate-internal engines with
# the same leftmost-first results and no further dependencies.
regex = { version = "1.13.1", default-features = false, features = ["std", "perf-dfa", "perf-onepass", "perf-backtrack"] }
# The row hash of grouping, under fixed seeds (#4188). Arrow already builds
# it into every host, so the engine adds no crate.
ahash = { version = "0.8.12", default-features = false }

[lints]
workspace = true

# The integration tests are one binary: tests/main.rs declares each family
# file under tests/ as a module and checks that none is left out (#3556).
[[test]]
name = "main"
path = "tests/main.rs"
