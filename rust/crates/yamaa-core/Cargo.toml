[package]
name = "yamaa-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT AND Unicode-3.0"
authors.workspace = true
publish.workspace = true

[dependencies]
thiserror = "2.0.21"
# Canonical numeric formatting and portable mathematics.
ryu = { version = "1.0.20", default-features = false }
# Disable architecture-specific math implementations. Exact: the portable-math
# golden values and saved bytes depend on this implementation.
libm = { version = "=0.2.16", default-features = false }
# Exact decimal rounding intermediates.
num-bigint = { version = "0.5.1", default-features = false }
# Linear-time matching for the portable regex subset. Unicode tables stay off:
# the validator spells \d, \w, \s, \b and . as explicit sets. The lazy DFA,
# one-pass DFA and bounded backtracker are faster crate-internal engines with
# the same leftmost-first results and no further dependencies.
regex = { version = "1.13.1", default-features = false, features = ["std", "perf-dfa", "perf-onepass", "perf-backtrack"] }

[features]
# Test-only: compile the executor selector into `DatasetPlan::execute`
# (#2841). The equivalence gate and the executor probe enable it; the
# YAMAA_EXECUTOR environment variable then selects `compare` (both
# executors, attempts compared) or `resolved`. Unset, today's executor runs.
executor-comparison = []

[lints]
workspace = true
