[package]
name = "yamaa-boundary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
autotests = false

# The boundary depends on nothing else in the workspace, and each host
# binding links it beside the engine (rust/interface/README.md).

[features]
# The engine loader of the test-only loaded mode (src/loader.rs), which the
# bindings' dynamic-engine feature selects. No shipped build compiles it.
loader = ["dep:libc", "dep:windows-sys"]

# The loader's system calls, from crates the lock already holds.
[target.'cfg(unix)'.dependencies]
libc = { version = "0.2.191", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", optional = true, features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

[dev-dependencies]
# The handshake family decodes the shared host truth,
# rust/tests/host-fixtures/cases.json; the adapters already lock serde_json.
serde_json = "1.0.145"

[lints]
workspace = true

# The integration tests are one binary: tests/main.rs declares each family
# file under tests/ as a module and checks that none is left out (#3556).
[[test]]
name = "main"
path = "tests/main.rs"
