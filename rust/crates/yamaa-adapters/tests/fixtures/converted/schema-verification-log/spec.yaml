yamaa: "1.0"
type: spec
model: ADaM
domain: ADSL
keys: [USUBJID]
input:
  DM: input/dm.csv

output:
  path: adsl.csv
  columns: [USUBJID, AGE]
  # Every evaluated check, held or violated, gets one line in the run
  # report; a violated one also lists every offending key.
  report: adsl-checks.csv

columns:
  - name: USUBJID
    type: str
    label: Unique Subject Identifier
    derivation: DM.USUBJID

  - name: AGE
    type: int
    label: Age
    derivation: DM.AGE
    verifications:
      - not_missing
      # A warning, not an error: an age outside 18-100 is reported and the
      # run still succeeds with every row kept.
      - range:
          min: 18
          max: 100
          severity: warning

verifications:
  - row_count:
      min: 1
