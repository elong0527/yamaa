version: "1.0"

# See VALUE-1.

column_type:
    type: str
    values: [str, int, float, date, datetime]

literal_value:
    type: [str, int, float, bool, "null"]
    description: See VALUE-4.

path:
    type: str
    min_length: 1

project_path:
    type: str
    min_length: 1
    description: See FILE-2.

identifier:
    type: str
    pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
    description: See SPEC-2.

function_contract_version:
    type: str
    min_length: 1
    description: See FUNC-4.

function_param_type:
    type: str
    values: [str, int, float, bool, date, datetime]

function_string_literal_class:
    - literal: {type: str, required: true}

function_date_literal_class:
    - date: {type: str, required: true}

function_datetime_literal_class:
    - datetime: {type: str, required: true}

function_value:
    type:
        - literal_value
        - function_date_literal_class
        - function_datetime_literal_class
