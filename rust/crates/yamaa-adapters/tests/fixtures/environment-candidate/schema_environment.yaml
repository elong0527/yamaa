version: '1.0'
includes:
- schema_shared.yaml
environment_class:
- schema_version:
    type: str
    required: true
- language:
    type: str
    values:
    - python
    - r
- lock:
    type: path
- functions:
    type: dict[identifier, function_definition]
- codelists:
    type: list[codelist_source]
- study:
    type: study_class
- sdtm:
    type: submission_section_class
- adam:
    type: submission_section_class
- send:
    type: submission_section_class
function_definition:
  type:
  - path
  - function_definition_class
function_definition_class:
- function:
    type: qualified_callable
    required: true
- description:
    type: str
    required: true
    min_length: 1
- params:
    type: list[function_parameter_class]
    required: true
- returns:
    type: column_type
    required: true
- may_return_missing:
    type: bool
    default: false
- comparison_decimals:
    type: int
    default: 4
- tests:
    type: list[function_test_class]
    required: true
function_parameter_class:
- name:
    type: identifier
    required: true
- type:
    type: function_param_type
    required: true
- required:
    type: bool
    default: true
- default:
    type: function_value
- accepts_missing:
    type: bool
    default: false
qualified_callable:
  type: str
  min_length: 1
function_case_id:
  type: str
  pattern: ^[a-z][a-z0-9-]*$
function_coverage:
  type: str
  pattern: ^(normal|boundary|nullable-output|numeric-comparison|(default|accepted-missing|short-circuit-missing|boolean-true|boolean-false):[A-Za-z_][A-Za-z0-9_]*)$
function_test_class:
- id:
    type: function_case_id
    required: true
- covers:
    type: list[function_coverage]
    required: true
- args:
    type: dict[identifier, function_value]
    required: true
- result:
    type: function_value
    required: true
codelist_source:
  type:
  - path
  - codelist_source_class
codelist_source_class:
- standard:
    type: terminology_standard_class
- codelists:
    type: list[codelist_class]
    required: true
terminology_standard_class:
- name:
    type: str
    required: true
    min_length: 1
- publishing_set:
    type: str
    required: true
    values:
    - ADaM
    - CDASH
    - DEFINE-XML
    - SDTM
    - SEND
- version:
    type: str
    required: true
    min_length: 1
study_class:
- id:
    type: define_id
    required: true
    description: See REQ-1062.
- name:
    type: str
    required: true
    min_length: 1
    description: See REQ-1062.
- description:
    type: str
    required: true
    min_length: 1
    description: See REQ-1062.
- protocol_name:
    type: str
    required: true
    min_length: 1
    description: See REQ-1062.
metadata_version_class:
- id:
    type: define_id
    required: true
    description: See REQ-1063.
- name:
    type: str
    required: true
    min_length: 1
    description: See REQ-1063.
- description:
    type: str
    required: false
    min_length: 1
    description: See REQ-1063.
codelist_class:
- id:
    type: identifier
    required: true
    description: See REQ-1077.
- name:
    type: str
    required: true
    min_length: 1
    description: See REQ-1077.
- data_type:
    type: str
    default: text
    values:
    - text
    - integer
    - float
    description: See REQ-1077.
- extensible:
    type: bool
    default: false
    description: See REQ-1077.
- alias:
    type: str
    required: false
    min_length: 1
    description: See REQ-1077.
- format_name:
    type: str
    required: false
    min_length: 1
    description: See REQ-1077.
- items:
    type: list[codelist_item_class]
    required: false
    description: See REQ-1077.
- external:
    type: external_codelist_class
    required: false
    description: See REQ-1077.
codelist_item_class:
- value:
    type: literal_value
    required: true
    description: See REQ-1078.
- decode:
    type: str
    required: false
    min_length: 1
    description: See REQ-1078.
- rank:
    type: int
    required: false
    description: See REQ-1078.
- alias:
    type: str
    required: false
    min_length: 1
    description: See REQ-1078.
- extended:
    type: bool
    default: false
    description: See REQ-1078.
external_codelist_class:
- dictionary:
    type: str
    required: true
    min_length: 1
    description: See REQ-1079.
- version:
    type: str
    required: true
    min_length: 1
    description: See REQ-1079.
- href:
    type: str
    required: false
    min_length: 1
    description: See REQ-1079.
define_id:
  type: str
  pattern: ^[A-Za-z_][A-Za-z0-9_.-]*$
  description: See REQ-1068.
relative_href:
  type: str
  pattern: ^(?!/)(?!.*(^|/)\.\.(/|$))[^\\]+$
  description: See REQ-1070.
language_tag:
  type: str
  pattern: ^[A-Za-z]{2,3}(-[A-Za-z0-9]{1,8})*$
  description: See REQ-1073.
standard_name:
  type: str
  values:
  - ADaMIG
  - ADaMIG-MD
  - BIMO
  - CDISC/NCI
  - SDTMIG
  - SDTMIG-AP
  - SDTMIG-MD
  - SENDIG
  - SENDIG-AR
  - SENDIG-DART
  - SENDIG-GENETOX
  description: See REQ-1074.
submission_section_class:
- standard:
    type: implementation_guide_class
    required: true
- specs:
    type: list[path]
    required: true
- define:
    type: path
    required: true
- documents:
    type: list[document_class]
- dataset_json:
    type: bool
    default: false
- context:
    type: str
    default: Submission
    values:
    - Submission
    - Other
- xml_lang:
    type: language_tag
    default: en
- file_oid:
    type: define_id
- metadata_version:
    type: metadata_version_class
- originator:
    type: str
    min_length: 1
- stylesheet:
    type: relative_href
implementation_guide_class:
- name:
    type: standard_name
    required: true
- version:
    type: str
    required: true
    min_length: 1
- status:
    type: str
    required: true
    values:
    - Draft
    - Final
document_class:
- id:
    type: identifier
    required: true
    description: See REQ-1065.
- kind:
    type: str
    required: true
    values:
    - annotated_crf
    - supplemental
    - other
    description: See REQ-1065.
- link:
    type: relative_href
    required: true
    description: See REQ-1065.
- title:
    type: str
    required: true
    min_length: 1
    description: See REQ-1065.
