version: '1.0'
includes:
- schema_shared.yaml
environment_class:
- schema_version:
    type: str
    required: true
- lock:
    type: path
- functions:
    type: dict[identifier, function_definition]
function_definition:
  type:
  - path
  - function_definition_class
function_definition_class:
- function:
    type: qualified_callable
    required: true
- description:
    type: str
    required: true
    min_length: 1
- params:
    type: list[function_parameter_class]
    required: true
- returns:
    type: column_type
    required: true
- may_return_missing:
    type: bool
    default: false
- comparison_decimals:
    type: int
    default: 4
- tests:
    type: list[function_test_class]
    required: true
function_parameter_class:
- name:
    type: identifier
    required: true
- type:
    type: function_param_type
    required: true
- required:
    type: bool
    default: true
- default:
    type: function_value
- accepts_missing:
    type: bool
    default: false
qualified_callable:
  type: str
  min_length: 1
function_case_id:
  type: str
  pattern: ^[a-z][a-z0-9-]*$
function_coverage:
  type: str
  pattern: ^(normal|boundary|nullable-output|numeric-comparison|(default|accepted-missing|short-circuit-missing|boolean-true|boolean-false):[A-Za-z_][A-Za-z0-9_]*)$
function_test_class:
- id:
    type: function_case_id
    required: true
- covers:
    type: list[function_coverage]
    required: true
- args:
    type: dict[identifier, function_value]
    required: true
- result:
    type: function_value
    required: true
