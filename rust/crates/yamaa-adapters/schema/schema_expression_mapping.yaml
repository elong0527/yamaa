version: "1.0"

expressions:
    mapping: # See EXPR-11.
        - source:
            type: filtered_source
            required: true
            description: String variable used as the dictionary key, or a filtered source carrying it (EXPR-11).
        - dict:
            type: mapping_dict
            required: true
            description: Source-value to result-value dictionary, written inline or as the path of a YAML file holding it (EXPR-11).
        - case_sensitive:
            type: bool
            default: true
            description: Compare exactly when true; fold ASCII letters when false (EXPR-12).
        - missing:
            type: substitute_value
            description: Value returned when the source is missing; without it, a missing source gives missing (EXPR-11).
        - unmapped:
            type: substitute_value
            description: Value returned when the source is present but has no dictionary entry; without it, such a source fails (EXPR-11).
    decode: # See EXPR-15.
        - source:
            type: filtered_source
            required: true
            description: Variable holding the coded value, or a filtered source carrying it (EXPR-15).
        - codelist:
            type: identifier
            required: true
            description: Codelist the project file declares, whose item decodes replace the coded values (EXPR-15, CT-1).
        - missing:
            type: substitute_value
            description: Value returned when the source is missing; without it, a missing source gives missing (EXPR-15).
        - unmapped:
            type: substitute_value
            description: Value returned when the source is present but no item of the codelist lists it; without it, such a source fails (EXPR-15).
    cut: # See EXPR-13.
        - source:
            type: filtered_source
            required: true
            description: Numeric variable to classify, or a filtered source carrying it (EXPR-13).
        - breaks:
            type: "list[float]"
            required: true
            description: Ascending interval boundaries (EXPR-13).
        - labels:
            type: "list[str]"
            required: true
            description: One label per interval; exactly one more than breaks (EXPR-13).
        - closed:
            type: str
            default: left
            values: [left, right]
            description: Boundary each interval includes, left-closed and right-open, or right-closed and left-open (EXPR-13).
        - missing:
            type: substitute_value
            description: Value returned when the source is missing; without it, a missing source gives missing (EXPR-13).

mapping_dict:
    type: ["dict[str, substitute_value]", project_path]
    kind: value
    description: Inline dictionary, or the path of a YAML file holding one (EXPR-11).
