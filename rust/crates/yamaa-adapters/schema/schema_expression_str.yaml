version: "1.0"

expressions:
    str_pad: # See TEXT-2.
        - source:
            type: variable
            required: true
            description: See TEXT-2.
        - width:
            type: int
            required: true
            description: See TEXT-2.
    str_substr: # See TEXT-13.
        - source:
            type: variable
            required: true
            description: String variable whose scalars are taken (TEXT-13).
        - start:
            type: int
            description: Position of the first scalar taken, counted from 1; required unless piece is declared, and refused beside it (TEXT-13, TEXT-16).
        - length:
            type: int
            description: Most scalars taken; without it, they run to the end of the source; required beside piece (TEXT-13, TEXT-16).
        - piece:
            type: int
            description: Which piece, counted from 1, of the text broken between words into pieces of at most length scalars; declared instead of start (TEXT-16).
        - missing:
            type: substitute_value
            description: Value returned when the source is missing; without it, a missing source gives missing (TEXT-13).
    str_length: # See TEXT-14.
        - source:
            type: variable
            required: true
            description: String variable whose scalars are counted (TEXT-14).
        - missing:
            type: substitute_value
            description: Value returned when the source is missing; without it, a missing source gives missing (TEXT-14).
    str_extract: # See TEXT-10.
        - source:
            type: variable
            required: true
            description: String variable to search (TEXT-10).
        - pattern:
            type: regex
            required: true
            description: Regular expression searched for in the source (TEXT-9).
        - group:
            type: int
            default: 0
            description: Match group to return; 0 is the full match (TEXT-10).
        - missing:
            type: substitute_value
            description: Value returned when the source is missing; without it, a missing source gives missing (TEXT-10).
        - no_match:
            type: substitute_value
            description: Value returned when the pattern does not match the source (TEXT-10).
    str_replace: # See TEXT-11.
        - source:
            type: variable
            required: true
            description: String variable to search (TEXT-11).
        - pattern:
            type: regex
            required: true
            description: Regular expression whose every match in the source is replaced (TEXT-11).
        - replacement:
            type: str
            required: true
            description: Literal text that replaces each match (TEXT-11).
        - missing:
            type: substitute_value
            description: Value returned when the source is missing; without it, a missing source gives missing (TEXT-11).
    str_template: # See TEXT-4.
        type: [string_template, str_template_class]
        description: Portable string template, concise or with missing handling (TEXT-4).
    str_case: # See TEXT-5.
        - source:
            type: variable
            required: true
            description: String variable whose ASCII letters change case (TEXT-5).
        - to:
            type: str
            required: true
            values: [upper, lower, sentence, title, proper]
            description: Case to produce, one of upper, lower, sentence, title or proper (TEXT-5).
        - delimiters:
            type: str
            description: ASCII characters, each listed once, after which proper raises the next character, declared only with proper; without it they are the blank, slash, hyphen, open parenthesis, period and tab (TEXT-5).
        - missing:
            type: substitute_value
            description: Value returned when the source is missing; without it, a missing source gives missing (TEXT-5).

string_template:
    type: str
    kind: expression
    description: Template string of literal text, braced placeholders and doubled braces (TEXT-3).

str_template_class:
    - template:
        type: string_template
        required: true
        description: Text containing literal content and braced variables (TEXT-3).
    - missing:
        type: substitute_value
        description: Value returned when any placeholder value is missing; without it, a missing placeholder fails (TEXT-4).
