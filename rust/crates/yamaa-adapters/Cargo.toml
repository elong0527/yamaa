[package]
name = "yamaa-adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
yamaa-core = { path = "../yamaa-core" }
yamaa-engine = { path = "../yamaa-engine" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["arbitrary_precision"] }
# Same parser revision used by the existing Python/R yaml12 packages. Keep
# source parsing at the adapter boundary; the core accepts owned documents.
saphyr-parser = { git = "https://github.com/t-kalinowski/saphyr", rev = "bd5bf9624347b24fa77cc2ef4a67ab2ef5c2cf8b", default-features = false }
num-bigint = { version = "=0.5.1", default-features = false }

arrow-array = { version = "=60.0.0", default-features = false }
arrow-schema = { version = "=60.0.0", default-features = false }
arrow-buffer = { version = "=60.0.0", default-features = false }
arrow-ipc = { version = "=60.0.0", default-features = false }
flatbuffers = { version = "=25.12.19", default-features = false }
parquet = { version = "=60.0.0", default-features = false }
