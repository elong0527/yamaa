[package]
name = "yamaa-adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["yaml", "parquet", "readstat"]
# Document syntax admission; owned core documents do not require this parser.
yaml = ["dep:saphyr-parser", "dep:num-bigint"]
# Source and artifact codecs share one edge, including native Zstd compression.
parquet = ["dep:parquet", "dep:bytes", "dep:base64", "dep:brotli", "dep:flate2", "dep:lz4_flex", "dep:zstd", "dep:snap"]
# SAS binary input only; disabling this feature omits the bundled ReadStat build.
readstat = ["dep:cc"]

[dependencies]
yamaa-core = { path = "../yamaa-core" }
toml = { version = ">=0.9.8, <2", default-features = false, features = ["parse", "std", "serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["raw_value"] }
# Source parsing stays at the adapter boundary; the core accepts owned documents.
# 0.0.11 fixes comments interrupting multiline plain scalars (YAML case BS4K).
saphyr-parser = { version = ">=0.0.11", default-features = false, optional = true }
num-bigint = { version = "0.5.1", default-features = false, optional = true }

arrow-array = { version = "=60.0.0", default-features = false, features = ["ffi"] }
arrow-schema = { version = "=60.0.0", default-features = false }
arrow-buffer = { version = "=60.0.0", default-features = false }
arrow-ipc = { version = "=60.0.0", default-features = false }
flatbuffers = { version = "=25.12.19", default-features = false }
parquet = { version = "=60.0.0", default-features = false, features = ["arrow", "snap", "brotli", "flate2-rust_backend", "lz4", "zstd"], optional = true }
# Direct page admission bounds decompression before the general source reader.
# These storage dependencies stay at the adapter boundary.
bytes = { version = "1.12.1", optional = true }
base64 = { version = "0.23.1", optional = true }
brotli = { version = "9.0.0", default-features = false, features = ["std"], optional = true }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"], optional = true }
lz4_flex = { version = "0.14.0", optional = true }
zstd = { version = "0.14.0", default-features = false, optional = true }
snap = { version = "1.1.2", optional = true }

# Safe descriptor-relative filesystem IO for the native R resource transport.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["fs", "process"] }

# User-mode, handle-relative Windows filesystem transport only.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_Security_Authorization", "Win32_Globalization"] }

[build-dependencies]
# Builds the reviewed read-only SAS input backend when readstat is enabled.
cc = { version = "1.7.0", optional = true }
