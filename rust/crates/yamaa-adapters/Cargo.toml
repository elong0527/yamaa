[package]
name = "yamaa-adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
autotests = false

[features]
default = ["yaml", "parquet", "readstat", "odm", "arrow"]
# Document syntax admission; owned core documents do not require this parser.
yaml = ["dep:yamaa-saphyr-parser", "dep:num-bigint"]
# Source and artifact codecs share one edge, including native Zstd compression.
# The reader reads the Arrow schema a file embeds, so it needs Arrow too.
parquet = ["arrow", "dep:arrow-ipc", "dep:flatbuffers", "dep:bytes", "dep:base64", "dep:brotli", "dep:flate2", "dep:lz4_flex", "dep:zstd", "dep:snap"]
# SAS binary input only; disabling this feature omits the bundled ReadStat build.
readstat = ["dep:cc"]
# ODM XML clinical items from plain XML or plain/gzip TAR input; pure Rust.
odm = ["dep:quick-xml", "dep:flate2"]
# The Arrow form of tables: a public table's record batches and their C
# stream, and the import of a host frame's C stream. No physical reader.
arrow = ["dep:arrow-array", "dep:arrow-schema", "dep:arrow-buffer"]

[dependencies]
yamaa-core = { path = "../yamaa-core" }
# toml 1.1 needs Rust 1.85; the workspace builds from 1.82.
toml = { version = ">=0.9.8, <1.1", default-features = false, features = ["parse", "std", "serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["raw_value"] }
# Source parsing stays at the adapter boundary; the core accepts owned documents.
# The vendored saphyr-parser 0.2.1 with the reviewed compact-flow fix (#2196).
# A path dependency reaches every graph that builds this crate, including a
# project that embeds the facade by git or path, which a workspace [patch]
# does not (#2929). Published releases through 0.2.2 lack the fix (#2583).
yamaa-saphyr-parser = { version = "=0.2.1", path = "../../vendor/saphyr-parser", default-features = false, optional = true }
# YAML integer scalars, with yamaa-core's num-bigint release.
num-bigint = { version = "0.4.8", default-features = false, optional = true }

# Arrow 55.2.0 is the newest release that builds with Rust 1.82; 56 needs
# 1.84 and 57 needs 1.85. The engine's own tables are columnar
# (column_table.rs); Arrow is their form at the hosts' edge (the arrow
# feature), and arrow-ipc and flatbuffers read the Arrow schema that a Parquet
# file embeds (the parquet feature).
arrow-array = { version = "=55.2.0", default-features = false, features = ["ffi"], optional = true }
arrow-schema = { version = "=55.2.0", default-features = false, optional = true }
arrow-buffer = { version = "=55.2.0", default-features = false, optional = true }
arrow-ipc = { version = "=55.2.0", default-features = false, optional = true }
flatbuffers = { version = "=25.12.19", default-features = false, optional = true }
# Direct page admission bounds decompression before the general source reader.
# These storage dependencies stay at the adapter boundary. base64 and lz4_flex
# stay in the 0.22 and 0.11 series that Parquet 55.2.0 requires, so the
# differential harness's oracle builds one copy of each with the engine
# (#3696). zstd 0.14.3, with zstd-safe 8.2.0, fixes RUSTSEC-2026-0391 and
# RUSTSEC-2026-0395 to 0406, so the oracle's zstd 0.13 is a second copy that
# only tests compile; both zstd-safe copies link the one zstd-sys (#4066).
# flate2 decompresses with its zlib-rs backend, as it did while
# Parquet 55, which selects it, was in the engine's build (#3878).
bytes = { version = "1.12.1", optional = true }
base64 = { version = "0.22.1", optional = true }
brotli = { version = "8.0.4", default-features = false, features = ["std"], optional = true }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend", "zlib-rs"], optional = true }
lz4_flex = { version = "0.11.6", optional = true }
zstd = { version = "0.14.3", default-features = false, optional = true }
snap = { version = "1.1.2", optional = true }
# ODM XML tokenizing only; the adapter adds namespace, reference and
# well-formedness checks. Default features off: no encoding_rs or serde.
# 0.42 needs Rust 1.86.
quick-xml = { version = "0.41.0", default-features = false, optional = true }

# Safe descriptor-relative filesystem IO for the native R resource transport.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["fs", "process"] }

# User-mode, handle-relative Windows filesystem transport only.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_Security_Authorization", "Win32_Globalization"] }

[dev-dependencies]
# The differential harness's oracle, parquet 55.2.0, and the writer of the
# test inputs that pyarrow once wrote: only test builds compile it, and no
# package builds or vendors it (#3878).
parquet = { version = "=55.2.0", default-features = false, features = ["arrow", "snap", "brotli", "flate2", "lz4", "zstd"] }

[build-dependencies]
# Builds the reviewed read-only SAS input backend when readstat is enabled.
cc = { version = "1.7.0", optional = true }

[lints]
workspace = true

# The integration tests are one binary: tests/main.rs declares each family
# file under tests/ as a module and checks that none is left out (#3556).
[[test]]
name = "main"
path = "tests/main.rs"

# format_features.rs is the focused capability test that the minimal format
# builds compile alone and inspect for linked symbols
# (tools/ci/format_features.py), so it stays its own binary.
[[test]]
name = "format_features"
path = "tests/format_features.rs"
