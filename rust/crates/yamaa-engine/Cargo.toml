[package]
autotests = false
name = "yamaa-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
test-support = []

[dependencies]
yamaa-core = { path = "../yamaa-core" }

# Integration targets are finite and explicit; support files are never discovered as binaries.
[[test]]
name = "execution_tests"
path = "tests/execution_tests.rs"

[[test]]
name = "preparation_tests"
path = "tests/preparation_tests.rs"

[[test]]
name = "project_tests"
path = "tests/project_tests.rs"

[[test]]
name = "service_tests"
path = "tests/service_tests.rs"

[[test]]
name = "test_support"
path = "tests/test_support.rs"
required-features = ["test-support"]
