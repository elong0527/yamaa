[package]
name = "yamaa-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
autotests = false

# The engine's C ABI over the facade (rust/crates/yamaa-boundary/src/abi.rs),
# which both bindings link and reach through yamaa-boundary's client.
[dependencies]
yamaa = { path = "../yamaa" }
yamaa-boundary = { path = "../yamaa-boundary" }

[features]
# The loadable engine of the test-only loaded mode: this crate built as a
# library (cargo rustc --crate-type cdylib) exports yamaa_engine_negotiate,
# which a binding built with its own dynamic-engine feature loads from beside
# its module (rust/interface/README.md). No shipped build enables it.
dynamic-engine = []

[dev-dependencies]
# The loading tests drive the loader the bindings' loaded mode uses.
yamaa-boundary = { path = "../yamaa-boundary", features = ["loader"] }
# The lifetime tests read exported streams as a host does, with the Arrow
# release the facade locks.
arrow-array = { version = "=55.2.0", default-features = false, features = ["ffi"] }
# The families decode the shared host truth,
# rust/tests/host-fixtures/cases.json; the adapters already lock serde_json.
serde_json = "1.0.145"

[lints]
workspace = true

# The integration tests are one binary: tests/main.rs declares each family
# file under tests/ as a module and checks that none is left out (#3556).
[[test]]
name = "main"
path = "tests/main.rs"

# The loading tests' fixture engines (tests/abi_loading.rs), each a library
# that cargo test builds beside the test binary: an engine of the next
# boundary version, a library without the negotiation entry, and engines
# without plan_reuse and without format_parquet.
[[example]]
name = "fixture_next_version"
crate-type = ["cdylib"]

[[example]]
name = "fixture_no_entry"
crate-type = ["cdylib"]

[[example]]
name = "fixture_no_plan_reuse"
crate-type = ["cdylib"]

[[example]]
name = "fixture_no_format_parquet"
crate-type = ["cdylib"]
