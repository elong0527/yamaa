[package]
name = "yamaa-r"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "yamaa_r"
crate-type = ["staticlib"]
# No Rust tests: R CMD check and the installed R suites test the binding, and
# a test harness would link against R.
test = false
doctest = false
# No benches: bench defaults to true, and --all-targets would check the
# library a second time, under cfg(test).
bench = false

[dependencies]
# The facade, whose public items the binding calls (rust/interface/README.md).
yamaa = { path = "../yamaa" }
# The interface handshake, the gate and the handle census.
yamaa-boundary = { path = "../yamaa-boundary" }
extendr-api = "0.9.0"
# Build Arrow input streams from R vectors, using the facade's Arrow major.
arrow-array = { version = "=55.2.0", default-features = false, features = ["ffi"] }

[lints]
workspace = true
