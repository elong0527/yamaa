[package]
name = "yamaa-r"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "yamaa_r"
crate-type = ["staticlib"]
# No Rust tests: R CMD check and the installed R suites test the binding, and
# a test harness would link against R.
test = false
doctest = false
# No benches: bench defaults to true, and --all-targets would check the
# library a second time, under cfg(test).
bench = false

[dependencies]
# The client through which the binding reaches the engine: the handshake,
# the gate and every call (rust/interface/README.md).
yamaa-boundary = { path = "../yamaa-boundary" }
# The engine, linked into the library: its negotiation entry hands the client
# the function table.
yamaa-engine = { path = "../yamaa-engine" }
# Reads the engine's Arrow C streams into plain R vectors; the engine already
# links this release, through Parquet too.
arrow-array = { version = "=55.2.0", default-features = false, features = ["ffi"] }
arrow-schema = { version = "=55.2.0", default-features = false }
extendr-api = "0.9.0"

[lints]
workspace = true
