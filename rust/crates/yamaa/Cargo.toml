[package]
name = "yamaa"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
autotests = false

[features]
default = ["yaml", "parquet", "readstat", "odm", "arrow"]
# Document syntax admission; owned core documents do not require this parser.
yaml = ["yamaa-adapters/yaml"]
# Source and artifact codecs share one edge, including native Zstd compression.
parquet = ["yamaa-adapters/parquet"]
# SAS binary input only; disabling this feature omits the bundled ReadStat build.
readstat = ["yamaa-adapters/readstat"]
# ODM XML clinical items from plain XML or plain/gzip TAR input; pure Rust.
odm = ["yamaa-adapters/odm"]
# The Arrow form of tables, which is not a format: the re-exported Arrow
# types, a table's record batches and C stream, InputFrame::import, and an
# output read as a stream (SpecRequest::stream and its streamed-run types).
arrow = ["yamaa-adapters/arrow", "dep:arrow-array", "dep:arrow-schema"]

[dependencies]
# The forwarded format features above are the only admission edges: without
# them adapters builds with no physical reader, leaving the CSV route.
yamaa-adapters = { path = "../yamaa-adapters", default-features = false }
yamaa-core = { path = "../yamaa-core" }
# The Arrow form of tables at the hosts' edge (the arrow feature). These edges
# select no physical reader; format admission stays behind the features above.
arrow-array = { version = "=55.2.0", default-features = false, features = ["ffi"], optional = true }
arrow-schema = { version = "=55.2.0", default-features = false, optional = true }

[lints]
workspace = true

# The integration tests are one binary: tests/main.rs declares each family
# file under tests/ as a module and checks that none is left out (#3556).
[[test]]
name = "main"
path = "tests/main.rs"

# plan_identity.rs changes the process's working directory, so it runs in its own
# process.
[[test]]
name = "plan_identity"
path = "tests/plan_identity.rs"

# save_table_relative.rs changes the process's working directory, so it runs in its own
# process.
[[test]]
name = "save_table_relative"
path = "tests/save_table_relative.rs"
