[build-system]
requires = ["maturin==1.9.6"]
build-backend = "maturin"

[project]
name = "yamaa-native"
version = "0.1.0"
description = "Optional native installation prototype for yamaa"
requires-python = ">=3.12"
license = "MIT AND Unicode-3.0"
license-files = ["LICENSE-UNICODE.txt"]

[tool.maturin]
bindings = "pyo3"
module-name = "yamaa_native"
# The sdist moves pyproject.toml to its root; retain the stub beside it.
include = [
    { path = "yamaa_native.pyi", format = "sdist" },
    { path = "LICENSE-UNICODE.txt", format = "sdist" },
]
