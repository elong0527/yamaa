[package]
name = "yamaa-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib"]
# No Rust tests: the installed Python suites test the binding, and a test
# harness would link against Python.
test = false
doctest = false
# No benches: bench defaults to true, and --all-targets would check the
# library a second time, under cfg(test).
bench = false

[features]
default = ["linked-engine"]
extension-module = ["pyo3/extension-module"]
# The engine is linked into the module by default: its negotiation entry is
# called as a Rust function. With dynamic-engine instead, the test-only
# loaded mode, it links no engine and loads the engine library from beside
# its own file at the handshake (rust/interface/README.md); a repository
# check refuses that feature in every shipped build.
linked-engine = ["dep:yamaa-engine"]
dynamic-engine = ["yamaa-boundary/loader"]

[dependencies]
# The client through which the binding reaches the engine: the handshake,
# the gate and every call (rust/interface/README.md).
yamaa-boundary = { path = "../yamaa-boundary" }
# The engine, linked into the module unless the loaded mode loads it: its
# negotiation entry hands the client the function table.
yamaa-engine = { path = "../yamaa-engine", optional = true }
# Reads the engine's Arrow C streams for `to_pylist()`, and moves them into
# capsules; the engine already links this release.
arrow-array = { version = "=55.2.0", default-features = false, features = ["ffi"] }
arrow-schema = { version = "=55.2.0", default-features = false }
# PyO3 0.28 needs Rust 1.83; the workspace builds from 1.82.
pyo3 = { version = ">=0.27.2, <0.28", features = ["abi3-py312"] }

[build-dependencies]
pyo3-build-config = ">=0.27.2, <0.28"

[lints]
workspace = true
