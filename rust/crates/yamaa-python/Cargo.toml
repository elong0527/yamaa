[package]
name = "yamaa-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib"]
doctest = false

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
yamaa-core = { path = "../yamaa-core" }
yamaa-adapters = { path = "../yamaa-adapters" }
pyo3 = { version = "0.27.2", features = ["abi3-py312"] }

[build-dependencies]
pyo3-build-config = "0.27.2"
