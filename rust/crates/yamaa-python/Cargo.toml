[package]
name = "yamaa-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib"]
# No Rust tests: the installed Python suites test the binding, and a test
# harness would link against Python.
test = false
doctest = false
# No benches: bench defaults to true, and --all-targets would check the
# library a second time, under cfg(test).
bench = false

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
# The facade, whose public items the binding calls (rust/interface/README.md).
yamaa = { path = "../yamaa" }
# The interface handshake, the gate and the handle census.
yamaa-boundary = { path = "../yamaa-boundary" }
# Pickle preserves public table schemas and batches without a Python library.
arrow-ipc = { version = "=55.2.0", default-features = false }
# Keep Python integer arguments exact without Python's decimal-string limit.
num-bigint = { version = "0.4.8", default-features = false }
# PyO3 0.28 needs Rust 1.83; the workspace builds from 1.82.
pyo3 = { version = ">=0.27.2, <0.28", features = ["abi3-py312", "num-bigint"] }

[build-dependencies]
pyo3-build-config = ">=0.27.2, <0.28"

[lints]
workspace = true
