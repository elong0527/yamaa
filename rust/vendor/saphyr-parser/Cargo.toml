# yamaa's patched copy of saphyr-parser 0.2.1 (see PROVENANCE.md). Its own
# package and library names keep it apart from a published saphyr-parser that
# an embedder's graph may already hold.
[package]
name = "yamaa-saphyr-parser"
version = "0.2.1"
edition = "2021"
rust-version = "1.82.0"
authors = ["Ethiraric <ethiraric@gmail.com>", "David Aguilar <davvid@gmail.com>", "Yuheng Chen <yuhengchen@sensetime.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/saphyr-rs/saphyr"
description = "A fully YAML 1.2 compliant YAML library"
readme = "README.md"
publish = false
build = false
autobins = false

[lib]
name = "yamaa_saphyr_parser"
path = "src/lib.rs"

[features]
debug_prints = []

[dependencies]
arraydeque = { version = "0.5.1", default-features = false }
thiserror = { version = "2.0.20", default-features = false }
