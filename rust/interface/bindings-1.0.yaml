# Draft of the yamaa 1.0 host interface for Python, R and the command line
# (#3030 Phase 0 item 3; sections 2.7, 2.8 and 2.11; decisions D11, D12 and
# D36 to D46). The design document docs/design/interface-1.0.md, and its API
# page docs/design/interface-1.0/api.md, give the reasons, the measurements
# and the options not taken.
#
# Status: a proposal for owner review. No generator or repository check reads
# it. tools/packaging/generate_bindings.py reads only bindings.yaml, which is
# format 2 and declares today's surface: it reconciles every declared export
# with the handwritten #[pyclass], #[pymethods], #[pyfunction] and #[extendr]
# surfaces and checks every vocabulary and table against the facade constant
# it names, so declaring the unimplemented 1.0 surface there would fail
# `make check-repository` and the generator's tests. This file is read only by
# the generic YAML, ASCII and rule-citation checks, and no source package
# stages rust/interface/. Each Phase 3 pull request (#2845 for the Python and
# R hosts, #3060 for the command line) moves the part it implements into
# bindings.yaml, in format 2's grammar (README.md), and the last deletes this
# file.
#
# Sections:
#   values, tables, records   frozen vocabularies and table columns
#   public                    the user-facing surface of each host, frozen by
#                             section 2.11 and compared with the latest
#                             release tag from 1.0.0
#   cli                       the command line (D12)
#   python, r                 native registrations (private), as in format 1
#   operations, host_only     each operation's counterpart in every host
#
# Type tokens of the native sections keep their format 1 meanings (see
# README.md). Value types in `tables` and `records` are the language's column
# types: str, int, float, date, datetime, plus list<T> and optional<T>. Their
# host projections are fixed once in public.types.
format: yamaa.host-interface
format_version: 2
status: draft
boundary: rust_generated_host_glue
contract: README.md

imports:
  records:
    owner: https://github.com/elong0527/yamaa/issues/2674
    crate: yamaa-adapters
    roles: [boundary_version, diagnostic, result, plan]
  arrow_stream:
    rust: yamaa_adapters::arrow_bridge::FFI_ArrowArrayStream

# Unchanged design contract of format 1 (#2870); info().features reports the
# optional features that are compiled in, under these same names.
handshake:
  version: records.boundary_version
  python: _interface_handshake
  r: interface_handshake
  python_error: InterfaceError
  r_error: yamaa_interface_error
  required_features: [structured_records, arrow_c_stream, plan_reuse]
  optional_features:
    format_yaml: yamaa-adapters/yaml
    format_parquet: yamaa-adapters/parquet
    format_readstat: yamaa-adapters/readstat
    format_odm: yamaa-adapters/odm
  failure_record: records.diagnostic
  result_record: records.result

# Closed value vocabularies of the public surface. Each grows only by adding
# values in a 1.x minor release (section 2.11).
values:
  # D36. `skipped` is only a project-run member whose run-scope producer
  # failed or was skipped (PROJECT-11, producer_not_completed).
  status: [succeeded, failed, skipped]
  # Section 2.7. Every 1.0 issue is `error`; `warning` is reserved for static
  # warnings added later.
  severity: [error, warning]
  # yaml/conditions.yaml, in run order (the proposed phase card, P-PHASE-1).
  phase:
    - validation
    - planning
    - ingest
    - row_construction
    - join
    - mapping
    - impute
    - derivation
    - convert
    - verification
    - output
    - engine
  # Section 2.1; `codelists` is RFC item P-TYPE-1.
  file_type: [spec, project, codelists, function]
  section: [sdtm, adam, send]
  host: [python, r, cli]
  # The facade's Cargo features (rust/crates/yamaa/Cargo.toml), all four on in
  # every shipped package and binary.
  feature: [odm, parquet, readstat, yaml]
  # The yamaa.style findings ported to Rust (D40), less `literal_form`, which
  # retires with `{literal: X}` (D18), plus five proposed findings:
  # redundant_long_form (P-LONG-1), restated_default (P-HND-3),
  # scalar_as_text (a whole-field literal written as grammar text),
  # unused_input_key (P-JOIN-1) and equality_filter (P-ORD-3).
  lint_finding:
    - field_order
    - root_spacing
    - entry_spacing
    - blank_lines
    - line_width
    - invalid_suppression
    - repeated_row_derivation
    - redundant_intermediate
    - missing_label
    - redundant_long_form
    - restated_default
    - scalar_as_text
    - unused_input_key
    - equality_filter
  report_kind: [run, input, rows, handler, column, check]
  report_outcome: [succeeded, failed, held, violated]
  output_format: [text, json]

# Frozen table columns, in order. New columns may only be appended (2.11).
tables:
  issues:
    owner: "section 2.7 (D28); rust/crates/yamaa/src/diagnostic.rs"
    order: report order, the first issue first; at most 10000 rows (Limits::FINDINGS)
    columns:
      - name: severity
        type: str
        values: severity
      - name: phase
        type: str
        values: phase
      - name: condition
        type: str
        values: yaml/conditions.yaml
      - name: rule
        type: optional<str>
        meaning: card ID the condition cites; missing for engine_rejected and unsupported_operation
      - name: spec_paths
        type: list<str>
        meaning: every spec path the issue concerns, possibly none
      - name: file
        type: optional<str>
        meaning: absolute path, forward slashes, of the YAML file that wrote the first spec path
      - name: line
        type: optional<int>
        meaning: one-based line of that node
      - name: column
        type: optional<int>
        meaning: one-based column of that node, in Unicode scalar values
      - name: message
        type: str
        meaning: rendered in Rust from the condition's template in yaml/conditions.yaml; not frozen
      - name: context
        type: str
        meaning: canonical JSON text (RFC 8785) of the condition's facts
      - name: source_span
        type: optional<list<int>>
        meaning: "[start, end] UTF-8 byte offsets into the expression text"
      - name: operand_route
        type: optional<list<str>>
        meaning: operand steps from the expression root to the failing node
  report:
    owner: "CHECK-23 and CHECK-24 (#2998)"
    columns:
      - {name: ARTIFACT, type: str}
      - {name: KIND, type: str, values: report_kind}
      - {name: SPEC_PATH, type: str}
      - {name: NAME, type: optional<str>}
      - {name: ID, type: optional<str>}
      - {name: TARGET, type: optional<str>}
      - {name: RULE, type: optional<str>}
      - {name: SEVERITY, type: optional<str>, values: severity}
      - {name: OUTCOME, type: optional<str>, values: report_outcome}
      - {name: CONDITION, type: optional<str>}
      - {name: COUNT, type: optional<int>}
      - {name: TOTAL, type: optional<int>}
      - {name: KEYS, type: optional<str>}
      - {name: DETAILS, type: str}
  lint:
    owner: "section 2.8 (D40)"
    order: files in argument order, a directory's files in sorted path order, then line, column and finding
    columns:
      - name: file
        type: str
        meaning: absolute path, forward slashes
      - name: line
        type: int
      - name: column
        type: int
      - name: finding
        type: str
        values: lint_finding
      - name: spec_path
        type: str
        meaning: spec path of the departure, `$` for the root
      - name: message
        type: str
        meaning: rendered in Rust; not frozen
  odm_items:
    owner: "yamaa_core::odm_items::COLUMNS (30 columns); read_odm and the ODM input profile (D26)"
    columns: {rust: yamaa::ODM_COLUMNS, types: "SourceOrdinal int, every other column optional<str>"}
  selftest_cases:
    owner: "#3062, which may refine these columns before 1.0.0"
    columns:
      - {name: case, type: str}
      - {name: status, type: str, values: status}
      - {name: message, type: optional<str>, meaning: "why a case failed; not frozen"}

records:
  info:
    owner: "section 2.8 (D41)"
    fields:
      - name: version
        type: str
        meaning: engine version in SemVer spelling (yamaa::VERSION), identical in every host
      - name: language_versions
        type: list<str>
        meaning: every `yamaa:` file version the engine reads, oldest first; ["1.0"] in 1.0.0
      - name: features
        type: list<str>
        values: feature
        meaning: compiled optional features, sorted
      - name: host
        type: str
        values: host
      - name: host_version
        type: optional<str>
        meaning: Python or R version; missing for cli
      - name: platform
        type: str
        meaning: "<os>-<arch> of the compiled engine: linux-x86_64, linux-aarch64, windows-x86_64 or macos-aarch64"

# The user-facing surface. Python and R names, arguments, defaults, members
# and result types here are what section 2.11 freezes; the native sections
# below are private and may change in any release.
public:
  types:
    path:
      python: "str | os.PathLike[str]"
      r: "character(1); forward slashes, Windows backslashes and UNC accepted (D42)"
      cli: PATH argument, native spelling accepted
    path_list:
      python: "a path or a list of paths"
      r: character()
      cli: one or more PATH arguments
    text:
      python: str
      r: character(1)
      cli: flag value
    optional_text:
      python: "str | None"
      r: character(1) or NULL
      cli: optional flag
    flag:
      python: bool
      r: logical(1)
      cli: flag without value
    count:
      python: int
      r: numeric(1), a whole number
      cli: integer flag value
    status:
      python: str
      r: character(1)
      cli: "`status` key in JSON; exit status"
    names:
      python: list[str]
      r: character()
      cli: none
    paths_written:
      python: "list[str], absolute, forward slashes, publication order"
      r: "character(), the same strings, returned invisibly"
      cli: one absolute path per line
    table:
      python: yamaa.Table
      r: data.frame under the D44 type mapping
      cli: JSON array of objects
    optional_table:
      python: "yamaa.Table | None"
      r: data.frame or NULL
      cli: none
    tree:
      python: "dict[str, object]"
      r: named list
      cli: canonical JSON document
    json_text:
      python: str
      r: character(1)
      cli: JSON document
    info:
      python: "dict[str, object], keys in records.info order"
      r: named list, names in records.info order
      cli: text block, or JSON object with --format json
    summary:
      python: "repr() and str() return it"
      r: "format() returns its lines; print() writes them and returns the object invisibly"
      cli: the summary line of text output

  functions:
    - name: spec
      since: 0.5.0
      args: {path: path}
      returns: Spec
      python: yamaa.spec(path)
      r: yamaa_spec(path)
      cli: "PATH of check, run and resolve when the file declares `type: spec`"
    - name: project
      since: 0.5.0
      args: {path: path}
      returns: Project
      python: yamaa.project(path)
      r: yamaa_project(path)
      cli: "PATH of check, run, submission and resolve when the file declares `type: project`"
    - name: read_odm
      since: 0.5.0
      args:
        source: path
        archive_member: optional_text = None
        max_archive_members: count = 10000
        max_expanded_bytes: count = 268435456
        max_xml_depth: count = 64
      returns: table
      table: odm_items
      raises: refusal
      python: "yamaa.read_odm(source, *, archive_member=None, max_archive_members=10000, max_expanded_bytes=268435456, max_xml_depth=64)"
      r: "yamaa_read_odm(source, archive_member = NULL, max_archive_members = 10000, max_expanded_bytes = 268435456, max_xml_depth = 64)"
      cli: "read-odm SOURCE OUT [--archive-member NAME] [--max-archive-members N] [--max-expanded-bytes N] [--max-xml-depth N]"
    - name: lint
      since: 1.0.0
      args: {paths: path_list, fix: flag = false}
      returns: table
      table: lint
      raises: refusal
      effect: "with fix, rewrites files in place by the proved layout fixes, each atomically; the table lists the findings that remain"
      python: yamaa.lint(paths, fix=False)
      r: yamaa_lint(paths, fix = FALSE)
      cli: lint [--fix] PATH...
    - name: schema
      since: 1.0.0
      args: {file_type: text}
      returns: json_text
      values: file_type
      raises: refusal
      python: yamaa.schema(file_type)
      r: yamaa_schema(file_type)
      cli: schema TYPE
    - name: selftest
      since: 1.0.0
      args: {}
      returns: SelfTest
      python: yamaa.selftest()
      r: yamaa_selftest()
      cli: selftest

  # Result and lazy classes. No class is constructible by users; Python
  # exposes the classes under these names for isinstance and annotations.
  classes:
    Spec:
      python: yamaa.Spec
      r: yamaa_spec
      reads: nothing until a method runs
      members:
        - {name: check, kind: method, args: {}, returns: Check, cli: check PATH}
        - {name: resolve, kind: method, args: {}, returns: tree, raises: refusal, cli: resolve PATH}
        - {name: run, kind: method, args: {}, returns: Run, cli: run PATH}
    Project:
      python: yamaa.Project
      r: yamaa_project
      reads: nothing until a member runs
      members:
        - {name: spec, kind: method, args: {name: text}, returns: Spec, raises: refusal, cli: --spec NAME}
        - {name: check, kind: method, args: {}, returns: Check, cli: check PATH}
        - {name: run, kind: method, args: {section: optional_text = None}, returns: ProjectRun, cli: "run PATH [--section S]"}
        - name: submission
          kind: method
          args: {section: optional_text = None, created: optional_text = None}
          keyword_only: [created]
          returns: Submission
          cli: "submission PATH [--section S] [--created T]"
    Check:
      python: yamaa.Check
      r: yamaa_check
      members:
        - {name: issues, kind: property, returns: table, table: issues}
    Run:
      python: yamaa.Run
      r: yamaa_run
      members:
        - {name: output, kind: property, returns: optional_table, meaning: missing when the run failed}
        - {name: issues, kind: property, returns: table, table: issues}
        - {name: report, kind: property, returns: optional_table, table: report}
        - {name: save, kind: method, args: {}, returns: paths_written, raises: refusal, since_returns: 1.0.0}
    MemberRun:
      python: yamaa.MemberRun
      r: yamaa_member_run
      members:
        - {name: output, kind: property, returns: optional_table}
        - {name: issues, kind: property, returns: table, table: issues}
        - {name: report, kind: property, returns: optional_table, table: report}
    ProjectRun:
      python: yamaa.ProjectRun
      r: yamaa_project_run
      members:
        - {name: names, kind: property, returns: names, meaning: run-scope spec names in run order}
        - {name: member, kind: index, args: {name: text}, returns: MemberRun, raises: refusal, python: "__getitem__", r: "[["}
        - {name: contains, kind: protocol, args: {name: text}, returns: flag, python: __contains__, r: "name %in% names(x)"}
        - {name: iterate, kind: protocol, returns: names, python: __iter__}
        - {name: issues, kind: property, returns: table, table: issues}
        - {name: report, kind: property, returns: table, table: report}
        - {name: save, kind: method, args: {}, returns: paths_written, raises: refusal, since_returns: 1.0.0}
    Submission:
      python: yamaa.Submission
      r: yamaa_submission
      members:
        - {name: issues, kind: property, returns: table, table: issues}
        - {name: save, kind: method, args: {}, returns: paths_written, raises: refusal, since_returns: 1.0.0}
    SelfTest:
      since: 1.0.0
      owner: "#3062"
      python: yamaa.SelfTest
      r: yamaa_selftest
      members:
        - {name: status, kind: property, returns: status}
        - {name: cases, kind: property, returns: table, table: selftest_cases}
        - {name: info, kind: property, returns: info, record: info}
        - {name: summary, kind: printing, python: __repr__, r: [print, format]}

  errors:
    refusal:
      meaning: "save(), resolve(), an unknown spec name or section, and the refusals of read_odm, lint and schema (2.8)"
      python: {class: yamaa.Error, base: Exception, attributes: {issues: table, paths: paths_written}}
      r: {class: [yamaa_error, error, condition], fields: {message: text, call: "NULL", issues: data.frame, paths: character()}}
      cli: {exit_status: 1}
      text: "D39: the first issue's line and the count of the others"
      paths: "proposed: files written before the refusal, such as the report of a failed run (OUTPUT-10, PROJECT-12)"
    argument:
      meaning: a wrong argument type
      python: TypeError
      r: an ordinary error condition
      cli: {exit_status: 2}
    interrupt:
      meaning: "D46: Ctrl+C stops the call and publishes nothing; no result carries a status for it"
      python: KeyboardInterrupt, the original object
      r: the original interrupt condition
      cli: the process ends by the signal

  metadata:
    package_version:
      python: yamaa.__version__ (distribution metadata, PEP 440 spelling)
      r: packageVersion("yamaa")
      cli: "the `version` line of yamaa --version"
    exports:
      python: [Error, Table, __version__, info, lint, project, read_odm, schema, selftest, spec]
      r: [yamaa_info, yamaa_lint, yamaa_project, yamaa_read_odm, yamaa_schema, yamaa_selftest, yamaa_spec]
      r_s3_methods:
        - "[[.yamaa_project_run"

cli:
  binary: yamaa
  crate: rust/crates/yamaa-cli
  depends_on: the yamaa facade crate only (section 2.10)
  synopsis:
    - yamaa [--format text|json] COMMAND [ARGUMENTS]
    - yamaa --version [--format text|json]
    - yamaa --help
  inputs: "only the command line: no configuration file, no environment variable, no global option (2.8)"
  global_flags:
    - {name: --format, values: output_format, default: text, position: before or after COMMAND}
    - {name: --version, effect: print info() and exit 0}
    - {name: --help, effect: print usage and exit 0}
  streams:
    stdout: "the command's output: text, or with --format json exactly one canonical JSON document (RFC 8785) followed by one LF"
    stderr: "usage and argument errors (exit status 2), with one exception (D142): a panic inside a selftest case fails that case, so the command exits 1, and Rust's default panic hook writes the panic message, which shows where the engine panicked, to stderr"
  exit_status:
    0: "the command completed and its status is succeeded; for resolve, schema and --version, the output was printed"
    1: "the command completed with findings: a status of failed or skipped, remaining lint findings, a failed selftest case, or a refusal that carries issues"
    2: "the command could not run as asked: invalid usage or arguments, a PATH whose declared type the command does not take, or a failure to write to stdout; a file problem the engine reports as an issue exits 1"
  interrupt: "Ctrl+C stops the command and publishes nothing (D46); the process ends by the signal, which POSIX shells report as status 130"
  commands:
    - name: check
      synopsis: yamaa check PATH [--spec NAME]
      args: [{name: PATH, type: path}]
      flags:
        - {name: --spec, value: NAME, valid_when: "PATH declares `type: project`", host: Project.spec(name)}
      operations: [spec_check, project_check]
      text: the summary line, then one line per issue
      json_keys: [command, path, spec, status, issues]
    - name: run
      synopsis: yamaa run PATH [--spec NAME | --section SECTION]
      args: [{name: PATH, type: path}]
      flags:
        - {name: --spec, value: NAME, valid_when: "PATH declares `type: project`"}
        - {name: --section, value: SECTION, values: section, valid_when: "PATH declares `type: project`"}
      operations: [spec_run, run_save, project_run, project_run_save]
      effect: runs, then saves; a failed run saves only its report (OUTPUT-10, PROJECT-12)
      text: the summary, one line per issue, then one written path per line
      json_keys: [command, path, spec, section, status, members, issues, paths]
    - name: submission
      synopsis: yamaa submission PATH [--section SECTION] [--created TIME]
      args: [{name: PATH, type: path, valid_when: "PATH declares `type: project`"}]
      flags:
        - {name: --section, value: SECTION, values: section}
        - {name: --created, value: TIME, meaning: "ISO 8601 creation time; omitted, the time used is printed"}
      operations: [project_submission, submission_save]
      effect: composes, then saves
      text: "the summary, `created: TIME` when --created is omitted, one line per issue, then one written path per line"
      json_keys: [command, path, section, created, status, issues, paths]
    - name: resolve
      synopsis: yamaa resolve PATH [--spec NAME]
      args: [{name: PATH, type: path}]
      flags:
        - {name: --spec, value: NAME, valid_when: "PATH declares `type: project`"}
      operations: [spec_resolve]
      text: "the resolved specification as canonical JSON (both formats); on refusal, the issues and exit status 1"
      json_keys: "the resolved document itself; on refusal [command, path, spec, status, issues]"
    - name: read-odm
      synopsis: yamaa read-odm SOURCE OUT [--archive-member NAME] [--max-archive-members N] [--max-expanded-bytes N] [--max-xml-depth N]
      args: [{name: SOURCE, type: path}, {name: OUT, type: path, meaning: "its extension selects csv or parquet (OUTPUT-5); written atomically"}]
      flags:
        - {name: --archive-member, value: NAME}
        - {name: --max-archive-members, value: N, default: 10000}
        - {name: --max-expanded-bytes, value: N, default: 268435456}
        - {name: --max-xml-depth, value: N, default: 64}
      operations: [read_odm]
      text: the written path
      json_keys: [command, path, status, rows, issues, paths]
    - name: lint
      synopsis: yamaa lint [--fix] PATH...
      args: [{name: PATH, type: path, repeat: true}]
      flags:
        - {name: --fix, meaning: apply the proved layout fixes in place}
      operations: [lint]
      text: "one `file:line:column: finding message` line per finding, then `N lint findings in M of K files`, with `; fixed F files` under --fix"
      json_keys: "[command, status, findings, paths]; on refusal [command, status, findings, issues, paths]"
    - name: schema
      synopsis: yamaa schema TYPE
      args: [{name: TYPE, values: file_type}]
      operations: [schema]
      text: the JSON Schema document (both formats)
      json_keys: "the JSON Schema document itself; on refusal [command, type, status, issues]"
    - name: selftest
      synopsis: yamaa selftest
      operations: [selftest]
      text: "the facade's report, as the hosts print it (D119): the summary line, `first failure: <case>: <message>` when a case failed, `not covered: <adapters>` when an adapter is not covered, then the engine, language, host and platform"
      json_keys: [command, status, info, cases]
  json:
    issue_keys: [severity, phase, condition, rule, spec_paths, file, line, column, message, context, source_span, operand_route]
    issue_context: a JSON object, not text
    member_keys: [name, status, rows, columns, issue_count]
    finding_keys: [file, line, column, finding, spec_path, message]
    case_keys: [case, status, message]
    info_keys: [version, language_versions, features, host, host_version, platform]

# Native registrations (private). Python: module yamaa._native.
python:
  module: yamaa._native
  registration: rust/crates/yamaa-python/src/lib.rs
  exports:
    - kind: constant
      name: _CORE_VERSION
      rust: yamaa_core::VERSION
      type: text
    - kind: exception
      name: _Error
      rust: api_entry::_Error
      base: Exception
    - kind: class
      name: _Run
      rust: api_entry::Run
      constructible: false
      methods:
        - {name: output, args: {}, returns: "optional<Table>"}
        - {name: issues, args: {}, returns: Table}
        - {name: report, args: {}, returns: "optional<Table>"}
        - {name: save, args: {}, returns: "list<text>"}
        - {name: observations, args: {include_measurements: "bool = false"}, returns: "optional<text>"}
    - kind: class
      name: _ProjectRun
      rust: api_entry::ProjectRun
      constructible: false
      methods:
        - {name: names, args: {}, returns: "list<text>"}
        - {name: output, args: {name: text}, returns: "optional<Table>"}
        - {name: member_issues, args: {name: text}, returns: Table}
        - {name: member_report, args: {name: text}, returns: "optional<Table>"}
        - {name: issues, args: {}, returns: Table}
        - {name: report, args: {}, returns: Table}
        - {name: save, args: {}, returns: "list<text>"}
    - kind: class
      name: _Submission
      rust: api_entry::Submission
      constructible: false
      methods:
        - {name: issues, args: {}, returns: Table}
        - {name: save, args: {}, returns: "list<text>"}
    - kind: class
      name: _SelfTest
      rust: api_entry::SelfTest
      constructible: false
      methods:
        - {name: status, args: {}, returns: text}
        - {name: cases, args: {}, returns: Table}
        - {name: info, args: {}, returns: context_object}
        - {name: summary, args: {}, returns: text}
    - kind: class
      name: _Plans
      rust: api_entry::Plans
      constructible: false
      methods: []
    - {kind: function, name: _plans, rust: api_entry::_plans, args: {}, returns: _Plans}
    - kind: function
      name: _spec_check
      rust: api_entry::_spec_check
      args: {specification: text, project: "optional<text> = None"}
      returns: _Check
    - kind: function
      name: _spec_run
      rust: api_entry::_spec_run
      args: {specification: text, project: "optional<text> = None", plans: "optional<_Plans> = None"}
      returns: _Run
    - kind: function
      name: _spec_resolve
      rust: api_entry::_spec_resolve
      args: {specification: text, project: "optional<text> = None"}
      returns: context_object
    - kind: function
      name: _project_spec
      rust: api_entry::_project_spec
      args: {project: text, name: text}
      returns: text
    - kind: function
      name: _project_check
      rust: api_entry::_project_check
      args: {project: text}
      returns: _Check
    - kind: function
      name: _project_run
      rust: api_entry::_project_run
      args: {project: text, section: "optional<text> = None", plans: "optional<_Plans> = None"}
      returns: _ProjectRun
    - kind: function
      name: _project_submission
      rust: api_entry::_project_submission
      args: {project: text, section: "optional<text> = None", created: "optional<text> = None"}
      returns: _Submission
    - kind: function
      name: _read_odm
      rust: api_entry::_read_odm
      args:
        source: text
        archive_member: "optional<text> = None"
        max_archive_members: "index = 10000"
        max_expanded_bytes: "index = 268435456"
        max_xml_depth: "index = 64"
      returns: Table
    - kind: function
      name: _lint
      rust: api_entry::_lint
      args: {paths: "list<text>", fix: "bool = false"}
      returns: Table
    - kind: function
      name: _schema
      rust: api_entry::_schema
      args: {file_type: text}
      returns: text
    - kind: function
      name: _selftest
      rust: api_entry::_selftest
      args: {}
      returns: _SelfTest
  # Removed with 1.0: _style_same_value (lint is in Rust, so the Python style
  # package and its private command go).

# Native registrations (private). R: extendr functions behind .native_* wrappers.
r:
  module: yamaa
  registration: rust/crates/yamaa-r/src/lib.rs
  groups:
    - module: yamaa
      source: rust/crates/yamaa-r/src/lib.rs
      functions:
        - {name: core_version, args: {}, returns: text}
    - module: api_entry
      source: rust/crates/yamaa-r/src/api_entry.rs
      functions:
        - {name: spec_check, args: {specification: raw, project: robj, version: raw}, returns: r_reply}
        - {name: plans, args: {handle: robj}, returns: r_reply}
        - name: spec_run
          args: {specification: raw, project: robj, version: raw, capabilities: r_list, plans: robj}
          returns: r_reply
        - {name: spec_resolve, args: {specification: raw, project: robj, version: raw}, returns: r_reply}
        - name: read_odm
          args: {source: raw, archive_member: robj, max_archive_members: index, max_expanded_bytes: index, max_xml_depth: index}
          returns: r_reply
        - {name: run_output, args: {handle: robj}, returns: r_reply}
        - {name: run_issues, args: {handle: robj}, returns: r_reply}
        - {name: run_report, args: {handle: robj}, returns: r_reply}
        - {name: run_save, args: {handle: robj}, returns: r_reply}
        - {name: run_observations, args: {handle: robj, include_measurements: bool}, returns: r_reply}
        - {name: project_spec, args: {project: raw, name: raw, version: raw}, returns: r_reply}
        - {name: project_check, args: {project: raw, version: raw}, returns: r_reply}
        - name: project_run
          args: {project: raw, section: robj, version: raw, capabilities: r_list, plans: robj}
          returns: r_reply
        - {name: project_run_names, args: {handle: robj}, returns: r_reply}
        - {name: project_run_output, args: {handle: robj, name: raw}, returns: r_reply}
        - {name: project_run_member_issues, args: {handle: robj, name: raw}, returns: r_reply}
        - {name: project_run_member_report, args: {handle: robj, name: raw}, returns: r_reply}
        - {name: project_run_issues, args: {handle: robj}, returns: r_reply}
        - {name: project_run_report, args: {handle: robj}, returns: r_reply}
        - {name: project_run_save, args: {handle: robj}, returns: r_reply}
        - name: project_submission
          args: {project: raw, section: robj, created: robj, version: raw}
          returns: r_reply
        - {name: submission_issues, args: {handle: robj}, returns: r_reply}
        - {name: submission_save, args: {handle: robj}, returns: r_reply}
        - {name: lint, args: {paths: robj, fix: bool}, returns: r_reply}
        - {name: schema, args: {file_type: raw}, returns: r_reply}
        - {name: selftest, args: {version: raw}, returns: r_reply}
        - {name: selftest_status, args: {handle: robj}, returns: r_reply}
        - {name: selftest_cases, args: {handle: robj}, returns: r_reply}
        - {name: selftest_info, args: {handle: robj}, returns: r_reply}
        - {name: selftest_summary, args: {handle: robj}, returns: r_reply}

# Every operation names its native export in Python and R and, where a
# command reaches it, the command-line command. The command line calls the
# facade directly, so it has no native registration to pair.
operations:
  core_version: {python: [_CORE_VERSION], r: [core_version], cli: [--version]}
  plans: {python: [_plans], r: [plans]}
  spec_check: {python: [_spec_check], r: [spec_check], cli: [check]}
  spec_run: {python: [_spec_run], r: [spec_run], cli: [run]}
  spec_resolve: {python: [_spec_resolve], r: [spec_resolve], cli: [resolve]}
  read_odm: {python: [_read_odm], r: [read_odm], cli: [read-odm]}
  run_output: {python: [_Run.output], r: [run_output]}
  run_issues: {python: [_Run.issues], r: [run_issues], cli: [run]}
  run_report: {python: [_Run.report], r: [run_report]}
  run_save: {python: [_Run.save], r: [run_save], cli: [run]}
  run_observations: {python: [_Run.observations], r: [run_observations]}
  project_spec: {python: [_project_spec], r: [project_spec], cli: [check, run, resolve]}
  project_check: {python: [_project_check], r: [project_check], cli: [check]}
  project_run: {python: [_project_run], r: [project_run], cli: [run]}
  project_run_names: {python: [_ProjectRun.names], r: [project_run_names], cli: [run]}
  project_run_output: {python: [_ProjectRun.output], r: [project_run_output]}
  project_run_member_issues: {python: [_ProjectRun.member_issues], r: [project_run_member_issues]}
  project_run_member_report: {python: [_ProjectRun.member_report], r: [project_run_member_report]}
  project_run_issues: {python: [_ProjectRun.issues], r: [project_run_issues], cli: [run]}
  project_run_report: {python: [_ProjectRun.report], r: [project_run_report]}
  project_run_save: {python: [_ProjectRun.save], r: [project_run_save], cli: [run]}
  project_submission: {python: [_project_submission], r: [project_submission], cli: [submission]}
  submission_issues: {python: [_Submission.issues], r: [submission_issues], cli: [submission]}
  submission_save: {python: [_Submission.save], r: [submission_save], cli: [submission]}
  lint: {python: [_lint], r: [lint], cli: [lint]}
  schema: {python: [_schema], r: [schema], cli: [schema]}
  selftest: {python: [_selftest], r: [selftest], cli: [selftest]}
  selftest_status: {python: [_SelfTest.status], r: [selftest_status], cli: [selftest]}
  selftest_cases: {python: [_SelfTest.cases], r: [selftest_cases], cli: [selftest]}
  selftest_info: {python: [_SelfTest.info], r: [selftest_info], cli: [selftest]}
  selftest_summary: {python: [_SelfTest.summary], r: [selftest_summary], cli: [selftest]}

# Host transport: Python checks interrupts inside each native call, R through
# the two helpers. yamaa.Table's methods are Python-only (bindings.yaml).
host_only:
  python: []
  r: []
  cli: []
