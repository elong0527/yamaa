# Authoritative declaration input for the generators specified in README.md.
# Both hosts' native registrations and declarations, and their public layers,
# are generated from this file, with the normalized manifest of its frozen
# sections; make check-repository and the native qualification lane compare
# the generated files with it.
#
# Sections (format 2):
#   imports, handshake        the boundary version and the diagnostic record,
#                             and the interface handshake of both hosts
#   values, tables, records   closed vocabularies, table columns and records,
#                             each checked against the facade constant it names
#   public                    the user-facing surface of each host
#   cli                       the command line
#   python, r                 native registrations (private)
#   operations, host_only     each operation's Python and R exports
#
# It declares the whole host surface that the hosts and the command line
# implement; the stability contract freezes its manifest from 1.0.0.
format: yamaa.host-interface
format_version: 2
boundary: rust_generated_host_glue
contract: README.md

# Roles are imports, not declarations of a second schema. The generator
# resolves each role to its public symbol: the boundary's version to
# yamaa_boundary::BOUNDARY_VERSION, which it writes into both hosts' requests,
# and the diagnostic record to core's yamaa_core::diagnostic::Diagnostic; an
# unresolved role is a generation error.
imports:
  boundary:
    crate: yamaa-boundary
    roles: [version]
  records:
    owner: https://github.com/elong0527/yamaa/issues/2674
    crate: yamaa-core
    roles: [diagnostic]
  arrow_stream:
    rust: yamaa_adapters::arrow_bridge::FFI_ArrowArrayStream

# The interface handshake (README.md, "Version and feature handshake"). The
# generated Python module and R .onLoad send the request, with the boundary
# version and these identifiers, before any other native call, and raise
# python_error or signal r_error with the refusal envelope's fields and the
# message of its reason. Every identifier is one of yamaa-boundary's, and each
# optional one a format with the Cargo feature that compiles it. census names
# each host's private accessor of the live native handles.
handshake:
  version: boundary.version
  python: _interface_handshake
  r: interface_handshake
  python_error: InterfaceError
  r_error: yamaa_interface_error
  census: {python: _live_handles, r: live_handles}
  required_features: [structured_records, arrow_c_stream, plan_reuse]
  optional_features:
    format_yaml: yamaa-adapters/yaml
    format_parquet: yamaa-adapters/parquet
    format_readstat: yamaa-adapters/readstat
    format_odm: yamaa-adapters/odm
  # One template per reason, filled from the envelope: {requested_version},
  # {supported_version} and {missing_features}, where the reason has them.
  messages:
    version_mismatch: "yamaa's native module has interface version {supported_version}, but its code needs version {requested_version}: reinstall yamaa"
    malformed_request: "yamaa's native module refused its code's interface request as malformed: reinstall yamaa"
    missing_feature: "yamaa's native module lacks the interface features {missing_features} that its code needs: reinstall yamaa"
    missing_interface: "yamaa's native module has no interface handshake, but its code needs interface version {requested_version}: reinstall yamaa"

# Closed value vocabularies of the public surface. Each names the facade
# constant that owns it, and the generator refuses any difference from that
# constant, order included.
values:
  # The status of every result (D36, P-STATUS-1). A selftest case that this
  # build cannot run is `skipped`: not covered (D119).
  status:
    rust: yamaa::STATUSES
    values: [succeeded, failed, skipped]
  # The phases of the registered conditions (yaml/conditions.yaml), in run
  # order.
  phase:
    rust: yamaa::PHASES
    values:
      - validation
      - planning
      - ingest
      - row_construction
      - join
      - mapping
      - impute
      - derivation
      - convert
      - verification
      - output
      - engine
  severity:
    rust: yamaa::SEVERITIES
    values: [error, warning]
  report_kind:
    rust: yamaa::REPORT_KINDS
    values: [run, input, rows, handler, column, check]
  report_outcome:
    rust: yamaa::REPORT_OUTCOMES
    values: [succeeded, failed, held, violated]
  # The findings of lint() (D40, P-LINT-2), in the order the style guide names
  # them; the 1.0 findings follow the 1.0 specification language.
  lint_finding:
    rust: yamaa::LINT_FINDINGS
    values:
      - field_order
      - root_spacing
      - entry_spacing
      - blank_lines
      - line_width
      - invalid_suppression
      - repeated_row_derivation
      - redundant_intermediate
      - missing_label
      - redundant_long_form
      - restated_default
      - scalar_as_text
      - unused_input_key
      - equality_filter
      - partial_restatement
  # The file types a yamaa file declares in `type` (SCHEMA-2), as schema()
  # takes them (D149).
  file_type:
    rust: yamaa::FILE_TYPES
    values: [spec, project, codelists, function]
  # The sections a project file declares (PROJECT-3), in run order: the
  # `section` a project's run and submission take.
  section:
    rust: yamaa::SECTIONS
    values: [sdtm, adam, send]
  # The optional features an engine compiles, sorted, by their Cargo names
  # (D41, P-INFO-1); every shipped package and binary compiles all four.
  feature:
    rust: yamaa::FEATURES
    values: [odm, parquet, readstat, yaml]
  # The hosts that report engine information (D41).
  host:
    rust: yamaa::HOSTS
    values: [python, r, cli]

# Table columns, in order. Each table names the facade constant that holds
# its column names, and the generator refuses any difference. Column types are
# the language's: str, int, float, date and datetime, with list<T> and
# optional<T>; a column's `values` names a vocabulary above, or the condition
# registry.
tables:
  # Section 2.7 (D28): the frozen twelve columns. file, line and column say
  # where the first spec path is written (#3262, D181); an issue without a
  # spec path, or whose path names no node of a file the call read, has none.
  issues:
    rust: yamaa::ISSUE_COLUMNS
    order: report order, the first issue first
    columns:
      - {name: severity, type: str, values: severity}
      - {name: phase, type: str, values: phase}
      - {name: condition, type: str, values: yaml/conditions.yaml}
      - name: rule
        type: optional<str>
        meaning: card ID the condition cites; missing for engine_rejected and unsupported_operation
      - {name: spec_paths, type: list<str>, meaning: "every spec path the issue concerns, possibly none"}
      - name: file
        type: optional<str>
        meaning: absolute path, forward slashes, of the YAML file that wrote the first spec path
      - {name: line, type: optional<int>, meaning: one-based line of that node}
      - name: column
        type: optional<int>
        meaning: one-based column of that node, in Unicode scalar values
      - name: message
        type: str
        meaning: rendered in Rust from the condition's template in yaml/conditions.yaml; not frozen
      - {name: context, type: str, meaning: "canonical JSON text (RFC 8785) of the condition's facts"}
      - name: source_span
        type: optional<list<int>>
        meaning: "[start, end] UTF-8 byte offsets into the expression text"
      - name: operand_route
        type: optional<list<str>>
        meaning: operand steps from the expression root to the failing node
  report:
    rust: yamaa::REPORT_COLUMNS
    order: CHECK-23
    columns:
      - {name: ARTIFACT, type: str}
      - {name: KIND, type: str, values: report_kind}
      - {name: SPEC_PATH, type: str}
      - {name: NAME, type: optional<str>}
      - {name: ID, type: optional<str>}
      - {name: TARGET, type: optional<str>}
      - {name: RULE, type: optional<str>}
      - {name: SEVERITY, type: optional<str>, values: severity}
      - {name: OUTCOME, type: optional<str>, values: report_outcome}
      - {name: CONDITION, type: optional<str>}
      - {name: COUNT, type: optional<int>}
      - {name: TOTAL, type: optional<int>}
      - {name: KEYS, type: optional<str>}
      - {name: DETAILS, type: str}
  lint:
    rust: yamaa::LINT_COLUMNS
    order: files in argument order, a directory's files in sorted path order, then line, column and finding
    columns:
      - {name: file, type: str, meaning: "absolute path, forward slashes"}
      - {name: line, type: int, meaning: one-based}
      - {name: column, type: int, meaning: "one-based, in Unicode scalar values"}
      - {name: finding, type: str, values: lint_finding}
      - {name: spec_path, type: str, meaning: "spec path of the departure, `$` for the root"}
      - {name: message, type: str, meaning: rendered in Rust; not frozen}
  odm_items:
    rust: yamaa::ODM_COLUMNS
    order: the clinical items in source order
    columns:
      - {name: ODMVersion, type: optional<str>}
      - {name: FileOID, type: optional<str>}
      - {name: StudyOID, type: optional<str>}
      - {name: MetaDataVersionOID, type: optional<str>}
      - {name: SubjectKey, type: optional<str>}
      - {name: StudySubjectID, type: optional<str>}
      - {name: SubjectStatus, type: optional<str>}
      - {name: StudyEventOID, type: optional<str>}
      - {name: StudyEventRepeatKey, type: optional<str>}
      - {name: EventName, type: optional<str>}
      - {name: StartDate, type: optional<str>}
      - {name: EventStatus, type: optional<str>}
      - {name: EventWorkflowStatus, type: optional<str>}
      - {name: FormOID, type: optional<str>}
      - {name: FormRepeatKey, type: optional<str>}
      - {name: FormName, type: optional<str>}
      - {name: FormLayoutOID, type: optional<str>}
      - {name: FormStatus, type: optional<str>}
      - {name: FormWorkflowStatus, type: optional<str>}
      - {name: OpenQueries, type: optional<str>}
      - {name: ItemGroupOID, type: optional<str>}
      - {name: ItemGroupRepeatKey, type: optional<str>}
      - {name: ItemGroupName, type: optional<str>}
      - {name: TransactionType, type: optional<str>}
      - {name: ItemOID, type: optional<str>}
      - {name: ItemName, type: optional<str>}
      - {name: Value, type: optional<str>}
      - {name: ValuePresent, type: str, meaning: "`true` or `false`"}
      - {name: IsNull, type: str, meaning: "`true` or `false`"}
      - {name: SourceOrdinal, type: int, meaning: "the item's position in source order, from one"}
  # D119: one row per selftest case, the bundled benchmarks that
  # benchmarks/selftest.yaml names.
  selftest_cases:
    rust: yamaa::SELFTEST_COLUMNS
    order: the cases in the order benchmarks/selftest.yaml lists them
    columns:
      - {name: case, type: str, meaning: the benchmark the case runs}
      - {name: status, type: str, values: status}
      - name: message
        type: optional<str>
        meaning: why the case failed or is not covered, missing when it passed; not frozen
  # #3700: the condition catalogue, every condition of the registry
  # (yaml/conditions.yaml) and every condition a release retired.
  conditions:
    rust: yamaa::CONDITION_COLUMNS
    order: conditions in name order, the retired ones among them
    columns:
      - {name: condition, type: str, values: yaml/conditions.yaml}
      - {name: severity, type: str, values: severity}
      - name: phases
        type: list<str>
        values: phase
        meaning: the phases that may report it, as yaml/conditions.yaml lists them; none for a retired condition
      - name: rules
        type: list<str>
        meaning: "the card IDs the registry's causes of it cite, in card order; none for engine_rejected, unsupported_operation and a retired condition"
      - name: message
        type: optional<str>
        meaning: the template its issues' messages render from (P-MSG-1); missing for a retired condition; not frozen
      - name: renamed_from
        type: optional<str>
        meaning: the name it had before a release renamed it; missing when no release did
      - name: retired_in
        type: optional<str>
        meaning: the release that retired it, such as 0.6.0; missing for a condition the engine may report

# Named records a host returns as a dict or named list.
records:
  # D41 (P-INFO-1): what the engine is and where it runs, in the order of the
  # facade's yamaa::Info; info() returns it, and a selftest holds it.
  info:
    owner: "section 2.8 (D41); yamaa::Info"
    fields:
      - {name: version, type: str, meaning: "the engine version, yamaa::VERSION, the same in every host"}
      - name: language_versions
        type: list<str>
        meaning: "every `yamaa:` language version the engine reads, oldest first"
      - {name: features, type: list<str>, values: feature, meaning: "the optional features compiled in, sorted"}
      - {name: host, type: str, values: host}
      - {name: host_version, type: optional<str>, meaning: "the Python or R version; missing for cli"}
      - {name: platform, type: str, meaning: "`<os>-<arch>` of the compiled engine, such as linux-x86_64"}

# The user-facing surface of each host: names, arguments with their order and
# defaults, members and result types. The generator writes the Python public
# module and R's exported functions, S3 methods and NAMESPACE from it, and the
# manifest records what the stability contract freezes. README.md defines the
# member kinds and how `holds` and `calls` delegate to the native exports.
public:
  python:
    version: __version__
    doc: |-
      Run yamaa clinical data specifications through the shared Rust engine.

      `spec()` and `project()` read nothing; each method runs one engine operation
      and returns a fixed result, and only a result's `save()` writes files. An
      object's first `run()` compiles its specifications and keeps them; a later
      `run()` reuses them while its paths still name the files they were compiled
      from and every one is unchanged, and compiles again otherwise.

  # Host projections of the type tokens used below.
  types:
    path: {python: "str or os.PathLike, unannotated", r: "character(1)"}
    path_list: {python: "a path or a list of paths, unannotated", r: "character()"}
    optional_path: {python: "str or os.PathLike or None, unannotated", r: "character(1) or NULL"}
    text: {python: str, r: "character(1)"}
    optional_text: {python: "str | None", r: "character(1) or NULL"}
    count: {python: int, r: "numeric(1), a whole number"}
    flag: {python: bool, r: "logical(1)"}
    names: {python: "list[str]", r: "character()"}
    paths_written:
      python: "list[str], absolute with forward slashes, in publication order"
      r: "character(), the same paths; save() returns them invisibly"
    tree: {python: dict, r: named list}
    json_text: {python: "str, canonical JSON (RFC 8785)", r: "character(1), canonical JSON (RFC 8785)"}
    table: {python: yamaa.Table, r: data.frame}
    optional_table: {python: "yamaa.Table | None", r: data.frame or NULL}
    # A run's output, which a streamed run produces as it is read (#3697).
    run_output:
      python: "yamaa.Table | None; with stream=True a yamaa.Table whose Arrow stream produces the output as it is read, once"
      r: "data.frame or NULL; with stream = TRUE an Arrow C stream that produces the output as it is read: an external pointer of class nanoarrow_array_stream, or NULL"
    status: {python: "str, one of values.status", r: "character(1), one of values.status"}
    file_type: {python: "str, one of values.file_type", r: "character(1), one of values.file_type"}
    info: {python: "dict, keys in records.info order", r: "named list, names in records.info order"}
    nothing: {python: None, r: "NULL, invisibly"}
    # Python-only projections, which only yamaa.Table's members use.
    rows: {python: "list[dict[str, object]], one dict per row, keyed by the column names in order"}
    arrow_capsule: {python: "PyCapsule named arrow_array_stream, a fresh Arrow C stream"}
    schema_request: {python: "object or None; anything but None is refused"}
    arrow_table: {python: pyarrow.Table}
    polars_frame: {python: polars.DataFrame}
    pandas_frame: {python: "pandas.DataFrame, each column a pandas.ArrowDtype of its Arrow type"}

  # Host projections of the language's column types (D11, D44): the type of
  # each table column, and of each value that a row holds.
  value_types:
    str: {python: "Arrow Utf8, Python str", r: character}
    int: {python: "Arrow Int64, Python int", r: "double; an error beyond 2^53"}
    float: {python: "Arrow Float64, Python float", r: double}
    date: {python: "Arrow Date32, datetime.date", r: Date}
    datetime: {python: "Arrow Timestamp(second), naive datetime.datetime", r: "POSIXct in UTC"}
    list: {python: "Arrow List, Python list", r: "list column; NULL for a missing list"}

  functions:
    - name: spec
      python: yamaa.spec
      r: yamaa_spec
      args: {path: path}
      returns: Spec
      doc: One specification; nothing is read until a method runs.
    - name: project
      python: yamaa.project
      r: yamaa_project
      args: {path: path}
      returns: Project
      doc: A project file; nothing is read until a method runs.
    - name: read_odm
      python: yamaa.read_odm
      r: yamaa_read_odm
      args:
        source: path
        archive_member: optional_text = None
        max_archive_members: count = 10000
        max_expanded_bytes: count = 268435456
        max_xml_depth: count = 64
      keyword_only: [archive_member, max_archive_members, max_expanded_bytes, max_xml_depth]
      returns: table
      table: odm_items
      raises: refusal
      calls: read_odm
      doc: Read the clinical items of an ODM XML file, or of one member of a TAR.
    - name: lint
      python: yamaa.lint
      r: yamaa_lint
      args: {paths: path_list, fix: flag = false}
      returns: table
      table: lint
      raises: refusal
      calls: lint
      doc: Lint yamaa files, first applying the proved fixes when fix is true.
    # D149: the JSON Schema of yaml/json/, as canonical JSON text; any other
    # type is refused as unexpected_file_type (SCHEMA-2).
    - name: schema
      python: yamaa.schema
      r: yamaa_schema
      args: {file_type: file_type}
      returns: json_text
      raises: refusal
      calls: schema
      doc: The JSON Schema of a file type, spec, project, codelists or function, as canonical JSON text.
    # #3700: the catalogue that the bundled yaml/conditions.yaml and the
    # registry give, the same in every host.
    - name: conditions
      python: yamaa.conditions
      r: yamaa_conditions
      returns: table
      table: conditions
      calls: conditions
      doc: Every condition the engine may report or a release retired, with its severity, phases, rules, message template and history.
    # D41: the record a selftest's `info` holds, made by the same helper in
    # each binding.
    - name: info
      python: yamaa.info
      r: yamaa_info
      returns: info
      record: info
      calls: info
      doc: The engine version, the language versions it reads, its features, the host and the platform.
    - name: selftest
      python: yamaa.selftest
      r: yamaa_selftest
      returns: SelfTest
      calls: selftest
      doc: Run the bundled selftest cases through this installation's engine, comparing each with its expected files.

  # Result and lazy classes, in definition order: a class is defined before
  # any class that returns it. Every result has a `status` (D36, P-STATUS-1)
  # and every class prints the text Rust renders for it (D37, P-PRINT-1). In
  # R every result also has names() and length() (D44), which the generator
  # derives: a result with an index member names its keys, and any other its
  # properties and methods in the order declared here.
  classes:
    Check:
      python: yamaa.Check
      r: yamaa_check
      holds: {native: handle}
      doc: Static findings; `issues` is empty when nothing is wrong.
      members:
        - name: status
          kind: property
          returns: status
          calls: check_status
          doc: "`failed` when the check found an issue, and `succeeded` otherwise."
        - {name: issues, kind: property, returns: table, table: issues, calls: check_issues}
        - {name: summary, kind: printing, python: __repr__, r: [print, format], calls: check_summary}
    Run:
      python: yamaa.Run
      r: yamaa_run
      holds: {native: handle}
      doc: One specification run; nothing is written until `save()`.
      members:
        - name: status
          kind: property
          returns: status
          calls: run_status
          doc: "`succeeded` when the run built its output with no issue, and `failed` otherwise."
        - name: output
          kind: property
          returns: run_output
          calls: run_output
          doc: The output dataset, or None when the run failed; with stream, read as it is produced.
        - name: issues
          kind: property
          returns: table
          table: issues
          calls: run_issues
          doc: What is wrong, one row per finding.
        - name: report
          kind: property
          returns: optional_table
          table: report
          calls: run_report
          doc: What the run read, counted and checked.
        - name: save
          kind: method
          returns: paths_written
          raises: refusal
          calls: run_save
          doc: Write the declared report file, then the output dataset; return the paths written.
        - {name: summary, kind: printing, python: __repr__, r: [print, format], calls: run_summary}
        # Installed-run evidence for qualification suites: R's
        # `.run_observations(run)`; Python reads `run._native.observations()`.
        - name: observations
          kind: private
          args: {include_measurements: flag = false}
          returns: optional_text
          calls: run_observations
    MemberRun:
      python: yamaa.MemberRun
      r: yamaa_member_run
      holds: {native: handle, name: name}
      doc: One specification's run inside a project run; save the project run.
      members:
        - name: status
          kind: property
          returns: status
          raises: refusal
          calls: project_run_member_status
          doc: "As a run's, or `skipped` when a producer in the project run did not complete."
        - {name: output, kind: property, returns: optional_table, raises: refusal, calls: project_run_output}
        - name: issues
          kind: property
          returns: table
          table: issues
          raises: refusal
          calls: project_run_member_issues
        - name: report
          kind: property
          returns: optional_table
          table: report
          raises: refusal
          calls: project_run_member_report
        - name: summary
          kind: printing
          python: __repr__
          r: [print, format]
          calls: project_run_member_summary
    ProjectRun:
      python: yamaa.ProjectRun
      r: yamaa_project_run
      holds: {native: handle}
      doc: Every specification a project run built, by `domain` name.
      members:
        - name: status
          kind: property
          returns: status
          calls: project_run_status
          doc: "`succeeded` when every specification succeeded and no project finding refused the run."
        - name: names
          kind: property
          returns: names
          calls: project_run_names
          doc: The specifications in the run scope, in run order.
        # An absent name raises the refusal that the member's issues give.
        - name: member
          kind: index
          python: __getitem__
          r: "[["
          args: {name: text}
          returns: MemberRun
          raises: refusal
          calls: project_run_member_issues
        - {name: contains, kind: protocol, python: __contains__}
        - {name: iterate, kind: protocol, python: __iter__, doc: "The names, as `names` lists them."}
        # D44: len() counts the names, as R's length() does.
        - {name: length, kind: protocol, python: __len__, doc: "The number of names."}
        - {name: issues, kind: property, returns: table, table: issues, calls: project_run_issues}
        - {name: report, kind: property, returns: table, table: report, calls: project_run_report}
        - name: save
          kind: method
          returns: paths_written
          raises: refusal
          calls: project_run_save
          doc: Write each report file, then each output unless a run failed; return the paths written.
        - {name: summary, kind: printing, python: __repr__, r: [print, format], calls: project_run_summary}
    Submission:
      python: yamaa.Submission
      r: yamaa_submission
      holds: {native: handle}
      doc: define.xml and each selected section's Dataset-JSON or SAS Transport files.
      members:
        - name: status
          kind: property
          returns: status
          calls: submission_status
          doc: "`succeeded` when every selected section composed with no issue, and `failed` otherwise."
        # D69, D129: one time for every section.
        - name: created
          kind: property
          returns: text
          calls: submission_created
          doc: The ISO 8601 creation time the documents carry, as given or as read once for every section.
        - {name: issues, kind: property, returns: table, table: issues, calls: submission_issues}
        - name: save
          kind: method
          returns: paths_written
          raises: refusal
          calls: submission_save
          doc: Write each section's transport files, then its define.xml; return the paths written.
        - {name: summary, kind: printing, python: __repr__, r: [print, format], calls: submission_summary}
    # A lazy object prints the path it holds, as given (D37): it has read
    # nothing to say more about.
    Spec:
      python: yamaa.Spec
      r: yamaa_spec
      holds: {path: specification, project: project}
      doc: One specification, read only when a method runs.
      members:
        - name: check
          kind: method
          args: {parent: optional_path = None}
          returns: Check
          raises: refusal
          calls: spec_check
          doc: >-
            Report problems without reading study data or running project code;
            with `parent`, check this fragment as if the specification at that path were its parent.
        - name: resolve
          kind: method
          returns: tree
          raises: refusal
          calls: spec_resolve
          doc: The specification after its layers are composed.
        # #3697: with stream, nothing is read until the output is.
        - name: run
          kind: method
          args: {stream: flag = false}
          keyword_only: [stream]
          returns: Run
          raises: refusal
          calls: spec_run
          doc: Build the dataset in memory, or with stream as its output is read.
        - {name: summary, kind: printing, python: __repr__, r: [print, format], calls: spec_summary}
    Project:
      python: yamaa.Project
      r: yamaa_project
      holds: {path: project}
      doc: A study's project file, read only when a method runs.
      members:
        - name: spec
          kind: method
          args: {name: text}
          returns: Spec
          raises: refusal
          calls: project_spec
          doc: The listed specification whose `domain` is `name`.
        # D45: what a run of every section names, read without data.
        - name: names
          kind: property
          returns: names
          raises: refusal
          calls: project_names
          doc: The listed specifications by `domain` name, in run order, read without study data.
        - {name: check, kind: method, returns: Check, raises: refusal, calls: project_check}
        - name: run
          kind: method
          args: {section: optional_text = None}
          returns: ProjectRun
          raises: refusal
          calls: project_run
          doc: Build every specification of one section, or of all sections.
        - name: submission
          kind: method
          args: {section: optional_text = None, created: optional_text = None}
          keyword_only: [created]
          returns: Submission
          raises: refusal
          calls: project_submission
        - {name: summary, kind: printing, python: __repr__, r: [print, format], calls: project_summary}
    # The installation self-test (D28, D119). Its printed text is the report:
    # the summary line, the first failure, the adapters no case covered and
    # the information line, rendered in Rust.
    SelfTest:
      python: yamaa.SelfTest
      r: yamaa_selftest
      holds: {native: handle}
      doc: The selftest cases run through this installation's engine; printing it gives the report.
      members:
        - name: status
          kind: property
          returns: status
          calls: selftest_status
          doc: "`failed` when a case failed, and `succeeded` otherwise."
        - name: cases
          kind: property
          returns: table
          table: selftest_cases
          calls: selftest_cases
          doc: One row per case, in the order the cases are listed.
        - name: info
          kind: property
          returns: info
          record: info
          calls: selftest_info
          doc: The engine, language versions, features, host and platform that ran the cases.
        - {name: summary, kind: printing, python: __repr__, r: [print, format], calls: selftest_summary}
    # Every table a Python call returns (D11, D43): the native class Table of
    # yamaa._native, which the public module exports as it is, so each member
    # is a native method that host_only names. R's tables are data frames
    # (D44), so the class is Python's alone. A conversion imports its library
    # only when it is called; to_pylist() imports nothing, and the package
    # has no runtime dependency.
    Table:
      python: yamaa.Table
      hosts: [python]
      members:
        - {name: num_rows, kind: property, returns: count}
        - {name: column_names, kind: property, returns: names}
        - {name: length, kind: protocol, python: __len__, returns: count}
        - {name: preview, kind: printing, python: __repr__}
        - name: arrow_stream
          kind: protocol
          python: __arrow_c_stream__
          args: {requested_schema: schema_request = None}
          returns: arrow_capsule
        - {name: to_pylist, kind: method, returns: rows}
        - {name: to_arrow, kind: method, returns: arrow_table, imports: [pyarrow]}
        - {name: to_polars, kind: method, returns: polars_frame, imports: [polars]}
        - {name: to_pandas, kind: method, returns: pandas_frame, imports: [pandas, pyarrow]}

  errors:
    refusal:
      python:
        class: yamaa.Error
        base: Exception
        attributes: {issues: table, paths: paths_written}
      r:
        class: [yamaa_error, error, condition]
        fields: {message: text, call: "NULL", issues: table, paths: paths_written}
      table: issues
      doc: >-
        A yamaa operation could not complete; `issues` says why, and `paths`
        lists the files a refused save wrote first.

# The command line (D12, section 2.8): the `yamaa` binary, which calls the
# facade directly and so pairs no native export. README.md gives the grammar,
# and tools/tests/test_bindings_cli.py keeps the commands, their arguments and
# flags, the global flags, the output formats and the exit statuses equal to
# what the binary's parser takes (rust/crates/yamaa-cli/src/arguments.rs and
# main.rs).
cli:
  binary: yamaa
  crate: rust/crates/yamaa-cli
  depends_on: the yamaa facade crate only (section 2.10)
  synopsis:
    - yamaa [--format text|json] COMMAND [ARGUMENTS]
    - yamaa --version [--format text|json]
    - yamaa --help
  inputs: "only the command line: no configuration file, environment variable or colour changes what it does"
  # The command line's own vocabularies, which no facade constant owns.
  values:
    output_format: [text, json]
  global_flags:
    - {name: --format, values: output_format, default: text, position: before or after COMMAND}
    - name: --version
      effect: >-
        print info() for the host cli, one field per line, or with --format
        json one object with json.info_keys whose host_version is null; exit 0
    - name: --help
      effect: print the usage and exit 0; given anywhere before --, it wins over every other argument
  # D142: the panic message of a selftest case is the one write to standard
  # error that exit status 2 does not explain.
  streams:
    stdout: >-
      what the command prints, each line ending in a line feed: text, or with
      --format json one canonical JSON document (RFC 8785) on one line; as
      text, a refusal prints its error text (D39), which carries the first
      issue's line, then each other issue's line and the files written before
      it
    stderr: >-
      only the refusals of exit status 2, each as `yamaa: <message>`, then
      `run 'yamaa --help' for usage` unless the write to standard output
      failed; and the panic message of a selftest case that panicked, which
      fails that case
  # D68, D98: an unknown section, an unknown schema TYPE and a PATH whose type
  # cannot be read are refusals the facade explains with issues (D125, D149).
  exit_status:
    0: >-
      the command completed and succeeded: its status is succeeded and any
      save wrote everything, or resolve, schema, --version or --help printed
      its output
    1: >-
      the command completed with findings: a status of failed or skipped, a
      refused save, remaining lint findings, a failed selftest case, or a
      refusal that carries issues
    2: >-
      the command could not run as asked: a usage error, an argument the
      facade cannot take, a PATH whose declared type the command does not
      take, or a failed write to standard output; a file problem the engine
      reports as an issue exits 1
  # D203: an interrupt is not one of exit_status's statuses (D98).
  interrupt: >-
    Ctrl+C stops check, run and submission at the engine's next cancellation
    checkpoint, so they print nothing and a save writes every file it planned
    or none (D46, D74), and it stops the other commands at once, so an
    interrupted lint --fix, which replaces each file atomically, can leave
    some files fixed and others not; the process then ends the native way: on
    POSIX it re-raises SIGINT, which shells report as status 130, falling back
    to exit(130), and on Windows it exits with STATUS_CONTROL_C_EXIT (D203)
  # Each command's JSON document has its json_keys, which canonical JSON
  # prints sorted. A refusal prints the same keys, or its refusal_keys where
  # they differ. The paths a command wrote, printed one per line and in
  # `paths`, are absolute with forward slashes, in publication order (D38).
  commands:
    # D122: check, run, submission and resolve read the type their PATH
    # declares. A type the command does not take, at all or with the flags
    # given, is a usage error (exit status 2).
    - name: check
      synopsis: yamaa check PATH [--spec NAME | --parent PATH]
      args:
        - {name: PATH, type: path, meaning: "a spec, or a project, as its type: header declares"}
      flags:
        - {name: --spec, value: NAME, valid_when: "PATH declares type: project", host: Project.spec(name)}
        - name: --parent
          value: PATH
          meaning: the specification the fragment is checked on, as its parent
          valid_when: "PATH declares type: spec, without --spec"
          host: Spec.check(parent)
      operations: [spec_check, project_check, project_spec]
      text: the summary line, then each issue's line
      json_keys: [command, path, spec, status, issues]
    - name: run
      synopsis: yamaa run PATH [--spec NAME | --section SECTION]
      args:
        - {name: PATH, type: path, meaning: "a spec, or a project, as its type: header declares"}
      flags:
        - name: --spec
          value: NAME
          valid_when: "PATH declares type: project, without --section"
          host: Project.spec(name)
        - name: --section
          value: SECTION
          values: section
          valid_when: "PATH declares type: project, without --spec"
          host: Project.run(section)
      operations: [spec_run, run_save, project_spec, project_run, project_run_save]
      effect: "runs, then saves; a failed run saves only its report (OUTPUT-10, PROJECT-12)"
      text: "the summary line, a project run's member lines, each issue's line, then each written path"
      json_keys: [command, path, spec, section, status, members, issues, paths]
    # D129: without --created, the submission reads the clock once for every
    # section and prints the time it read.
    - name: submission
      synopsis: yamaa submission PATH [--section SECTION] [--created TIME]
      args:
        - {name: PATH, type: path, valid_when: "PATH declares type: project"}
      flags:
        - {name: --section, value: SECTION, values: section, host: Project.submission(section)}
        - name: --created
          value: TIME
          meaning: the ISO 8601 creation time the documents carry
          host: Project.submission(created=TIME)
      operations: [project_submission, submission_save]
      effect: composes, then saves
      text: "the summary line, `created: <time>` when --created is omitted, each issue's line, then each written path"
      json_keys: [command, path, section, created, status, issues, paths]
    - name: resolve
      synopsis: yamaa resolve PATH [--spec NAME]
      args:
        - {name: PATH, type: path, meaning: "a spec, or a project with --spec"}
      flags:
        - {name: --spec, value: NAME, valid_when: "PATH declares type: project, which needs it", host: Project.spec(name)}
      operations: [spec_resolve, project_spec]
      text: the resolved specification as canonical JSON, in both formats
      json_keys: the resolved specification itself
      refusal_keys: [command, path, spec, status, issues]
    # D134, D169: the status follows the read, as a run's follows the run.
    - name: read-odm
      synopsis: yamaa read-odm SOURCE OUT [--archive-member NAME] [--max-archive-members N] [--max-expanded-bytes N] [--max-xml-depth N]
      args:
        - {name: SOURCE, type: path, meaning: "an ODM XML file, or a TAR archive that holds one"}
        - {name: OUT, type: path, meaning: "the file saved, whose extension, .csv or .parquet, selects its profile (OUTPUT-5)"}
      flags:
        - {name: --archive-member, value: NAME, host: read_odm(archive_member)}
        - {name: --max-archive-members, value: N, default: 10000, host: read_odm(max_archive_members)}
        - {name: --max-expanded-bytes, value: N, default: 268435456, host: read_odm(max_expanded_bytes)}
        - {name: --max-xml-depth, value: N, default: 64, host: read_odm(max_xml_depth)}
      operations: [read_odm]
      effect: >-
        reads SOURCE as read_odm() does, then saves its items to OUT; the
        status stays succeeded when only the save is refused, and rows, the
        number of items read, is null only when the read is refused
      text: the written path
      json_keys: [command, path, rows, status, issues, paths]
    - name: lint
      synopsis: yamaa lint [--fix] PATH...
      args:
        - {name: PATH, type: path, repeat: true, meaning: "a yamaa file, or a directory of them"}
      flags:
        - {name: --fix, meaning: apply the proved layout fixes in place first}
      operations: [lint]
      effect: lints each PATH; paths lists the files --fix rewrote
      text: >-
        each finding's line, `<file>:<line>:<column>: <finding> <message>`,
        then `N lint findings in M of K files`, with `; fixed F files` under
        --fix
      json_keys: [command, status, findings, paths]
      refusal_keys: [command, status, findings, issues, paths]
    # D149: TYPE goes to the facade as given.
    - name: schema
      synopsis: yamaa schema TYPE
      args:
        - {name: TYPE, values: file_type, meaning: any other text is refused as unexpected_file_type}
      operations: [schema]
      text: the JSON Schema of TYPE as canonical JSON, in both formats
      json_keys: the JSON Schema itself
      refusal_keys: [command, type, status, issues]
    # #3700: the catalogue that conditions() returns; nothing can refuse it.
    - name: conditions
      synopsis: yamaa conditions
      operations: [conditions]
      text: >-
        a line of the catalogue's column names, then one line per condition,
        each cell separated by a tab, a list's items joined with `, ` and a
        missing cell empty
      json_keys: [command, status, conditions]
    # D119: a case this build does not cover is skipped, which fails nothing.
    - name: selftest
      synopsis: yamaa selftest
      operations: [selftest]
      text: >-
        the facade's report, as the hosts print it: the summary line, `first
        failure: <case>: <message>` when a case failed, `not covered:
        <adapters>` when an adapter is not covered, then the engine, language,
        host and platform
      json_keys: [command, status, cases, info]
  # The keys of the objects the documents hold: each of `issues`, `members`,
  # `findings`, `cases` and `conditions`, and an `info`. An issue has the
  # columns of the issues table, its `context` an object rather than canonical
  # JSON text. A member without output has null `rows` and `columns`, and one
  # whose listing could not be read is named by the listing's path (D130). A
  # condition has the columns of the catalogue, its lists as lists.
  json:
    issue_keys:
      - severity
      - phase
      - condition
      - rule
      - spec_paths
      - file
      - line
      - column
      - message
      - context
      - source_span
      - operand_route
    member_keys: [name, status, rows, columns, issue_count]
    finding_keys: [file, line, column, finding, spec_path, message]
    case_keys: [case, status, message]
    condition_keys: [condition, severity, phases, rules, message, renamed_from, retired_in]
    info_keys: [version, language_versions, features, host, host_version, platform]

# Complete current registrations, in source order. Both hosts expose the same
# operations: every export is paired with its counterpart under `operations`
# unless `host_only` names it as host transport. Signatures describe the
# current wire projections, not the imported record types: the generator
# resolves the record roles above but projects none of their fields. Type tokens
# and per-host asymmetries are defined in README.md. Implicit interpreter/self
# arguments are omitted. All returned values are owned unless marked otherwise.
python:
  module: yamaa._native
  registration: rust/crates/yamaa-python/src/lib.rs
  exports:
    - kind: constant
      name: _CORE_VERSION
      rust: yamaa_core::VERSION
      type: text
    # yamaa.Table: the public module exports this class as it is.
    - kind: class
      name: Table
      rust: arrow_bridge::Table
      constructible: false
      methods:
        - {name: num_rows, kind: getter, args: {}, returns: index}
        - {name: column_names, kind: getter, args: {}, returns: "list<text>"}
        - {name: __len__, args: {}, returns: index}
        - {name: __repr__, args: {}, returns: text}
        - name: __arrow_c_stream__
          args: {requested_schema: "optional<host_object> = None"}
          returns: arrow_stream_capsule
        - {name: to_pylist, args: {}, returns: "list<row>"}
        - {name: to_arrow, args: {}, returns: host_object}
        - {name: to_polars, args: {}, returns: host_object}
        - {name: to_pandas, args: {}, returns: host_object}
    - kind: exception
      name: _Error
      rust: api_entry::_Error
      base: Exception
    - kind: class
      name: _Check
      rust: api_entry::Check
      constructible: false
      methods:
        - {name: status, args: {}, returns: text}
        - {name: issues, args: {}, returns: Table}
        - {name: summary, args: {}, returns: text}
    - kind: class
      name: _Run
      rust: api_entry::Run
      constructible: false
      methods:
        - {name: status, args: {}, returns: text}
        - {name: output, args: {}, returns: "optional<Table>"}
        - {name: issues, args: {}, returns: Table}
        - {name: report, args: {}, returns: "optional<Table>"}
        - {name: save, args: {}, returns: "list<text>"}
        - {name: summary, args: {}, returns: text}
        - {name: observations, args: {include_measurements: "bool = false"}, returns: "optional<text>"}
    - kind: class
      name: _ProjectRun
      rust: api_entry::ProjectRun
      constructible: false
      methods:
        - {name: status, args: {}, returns: text}
        - {name: names, args: {}, returns: "list<text>"}
        - {name: member_status, args: {name: text}, returns: text}
        - {name: output, args: {name: text}, returns: "optional<Table>"}
        - {name: member_issues, args: {name: text}, returns: Table}
        - {name: member_report, args: {name: text}, returns: "optional<Table>"}
        - {name: member_summary, args: {name: text}, returns: text}
        - {name: issues, args: {}, returns: Table}
        - {name: report, args: {}, returns: Table}
        - {name: save, args: {}, returns: "list<text>"}
        - {name: summary, args: {}, returns: text}
    - kind: class
      name: _Submission
      rust: api_entry::Submission
      constructible: false
      methods:
        - {name: status, args: {}, returns: text}
        - {name: created, args: {}, returns: text}
        - {name: issues, args: {}, returns: Table}
        - {name: save, args: {}, returns: "list<text>"}
        - {name: summary, args: {}, returns: text}
    - kind: class
      name: _SelfTest
      rust: api_entry::SelfTest
      constructible: false
      methods:
        - {name: status, args: {}, returns: text}
        - {name: cases, args: {}, returns: Table}
        - {name: info, args: {}, returns: context_object}
        - {name: summary, args: {}, returns: text}
    - kind: class
      name: _Plans
      rust: api_entry::Plans
      constructible: false
      methods: []
    - kind: function
      name: _plans
      rust: api_entry::_plans
      args: {}
      returns: _Plans
    - kind: function
      name: _spec_check
      rust: api_entry::_spec_check
      args: {specification: text, project: "optional<text> = None", parent: "optional<text> = None"}
      returns: _Check
    - kind: function
      name: _spec_summary
      rust: api_entry::_spec_summary
      args: {specification: text}
      returns: text
    - kind: function
      name: _spec_run
      rust: api_entry::_spec_run
      args:
        specification: text
        project: "optional<text> = None"
        plans: "optional<_Plans> = None"
        stream: "bool = false"
      returns: _Run
    - kind: function
      name: _spec_resolve
      rust: api_entry::_spec_resolve
      args: {specification: text, project: "optional<text> = None"}
      returns: context_object
    - kind: function
      name: _project_spec
      rust: api_entry::_project_spec
      args: {project: text, name: text}
      returns: text
    - kind: function
      name: _project_summary
      rust: api_entry::_project_summary
      args: {project: text}
      returns: text
    - kind: function
      name: _project_names
      rust: api_entry::_project_names
      args: {project: text}
      returns: "list<text>"
    - kind: function
      name: _project_check
      rust: api_entry::_project_check
      args: {project: text}
      returns: _Check
    - kind: function
      name: _project_run
      rust: api_entry::_project_run
      args: {project: text, section: "optional<text> = None", plans: "optional<_Plans> = None"}
      returns: _ProjectRun
    - kind: function
      name: _project_submission
      rust: api_entry::_project_submission
      args: {project: text, section: "optional<text> = None", created: "optional<text> = None"}
      returns: _Submission
    - kind: function
      name: _read_odm
      rust: api_entry::_read_odm
      args:
        source: text
        archive_member: "optional<text> = None"
        max_archive_members: "index = 10000"
        max_expanded_bytes: "index = 268435456"
        max_xml_depth: "index = 64"
      returns: Table
    - kind: function
      name: _lint
      rust: api_entry::_lint
      args: {paths: "list<text>", fix: "bool = false"}
      returns: Table
    - kind: function
      name: _schema
      rust: api_entry::_schema
      args: {file_type: text}
      returns: text
    - kind: function
      name: _conditions
      rust: api_entry::_conditions
      args: {}
      returns: Table
    - kind: function
      name: _info
      rust: api_entry::_info
      args: {}
      returns: context_object
    - kind: function
      name: _selftest
      rust: api_entry::_selftest
      args: {}
      returns: _SelfTest
    # The interface handshake and the census of live handles.
    - kind: function
      name: _interface_handshake
      rust: interface::_interface_handshake
      args: {request: host_object}
      returns: handshake_record
    - kind: function
      name: _live_handles
      rust: interface::_live_handles
      args: {}
      returns: handle_census

r:
  module: yamaa
  registration: rust/crates/yamaa-r/src/lib.rs
  # Includes every function in recursively used extendr_module! blocks.
  # extendr supplies wrap__<name>, get_yamaa_metadata and registration machinery.
  groups:
    - module: yamaa
      source: rust/crates/yamaa-r/src/lib.rs
      functions:
        - {name: core_version, args: {}, returns: text}
    - module: api_entry
      source: rust/crates/yamaa-r/src/api_entry.rs
      functions:
        - {name: spec_check, args: {specification: raw, project: robj, parent: robj, version: raw}, returns: r_reply}
        - {name: check_status, args: {handle: robj}, returns: r_reply}
        - {name: check_issues, args: {handle: robj}, returns: r_reply}
        - {name: check_summary, args: {handle: robj}, returns: r_reply}
        - {name: spec_summary, args: {specification: raw}, returns: r_reply}
        - {name: plans, args: {handle: robj}, returns: r_reply}
        - name: spec_run
          args: {specification: raw, project: robj, version: raw, capabilities: r_list, plans: robj, stream: bool}
          returns: r_reply
        - {name: spec_resolve, args: {specification: raw, project: robj, version: raw}, returns: r_reply}
        - name: read_odm
          args: {source: raw, archive_member: robj, max_archive_members: index, max_expanded_bytes: index, max_xml_depth: index}
          returns: r_reply
        - {name: run_status, args: {handle: robj}, returns: r_reply}
        - {name: run_output, args: {handle: robj}, returns: r_reply}
        - {name: run_issues, args: {handle: robj}, returns: r_reply}
        - {name: run_report, args: {handle: robj}, returns: r_reply}
        - {name: run_save, args: {handle: robj}, returns: r_reply}
        - {name: run_summary, args: {handle: robj}, returns: r_reply}
        - {name: run_observations, args: {handle: robj, include_measurements: bool}, returns: r_reply}
        - {name: project_spec, args: {project: raw, name: raw, version: raw}, returns: r_reply}
        - {name: project_summary, args: {project: raw}, returns: r_reply}
        - {name: project_names, args: {project: raw, version: raw}, returns: r_reply}
        - {name: project_check, args: {project: raw, version: raw}, returns: r_reply}
        - name: project_run
          args: {project: raw, section: robj, version: raw, capabilities: r_list, plans: robj}
          returns: r_reply
        - {name: project_run_status, args: {handle: robj}, returns: r_reply}
        - {name: project_run_names, args: {handle: robj}, returns: r_reply}
        - {name: project_run_member_status, args: {handle: robj, name: raw}, returns: r_reply}
        - {name: project_run_output, args: {handle: robj, name: raw}, returns: r_reply}
        - {name: project_run_member_issues, args: {handle: robj, name: raw}, returns: r_reply}
        - {name: project_run_member_report, args: {handle: robj, name: raw}, returns: r_reply}
        - {name: project_run_member_summary, args: {handle: robj, name: raw}, returns: r_reply}
        - {name: project_run_issues, args: {handle: robj}, returns: r_reply}
