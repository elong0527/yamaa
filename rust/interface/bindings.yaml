# Host transport: both hosts check interrupts inside their native calls.
# yamaa.Table is Python's table type, and R converts every
# table to a data frame instead, so each of its methods is Python-only.
host_only:
  python:
    - Table.num_rows
    - Table.column_names
    - Table.__len__
    - Table.__repr__
    - Table.__arrow_c_stream__
    - Table.to_pylist
    - Table.to_arrow
    - Table.to_polars
    - Table.to_pandas
  r: []
