# Authoritative declaration input for the generators specified in README.md.
# Both hosts' native registrations and declarations, and their public layers,
# are generated from this file, with the normalized manifest of its frozen
# sections; make check-repository and the native qualification lane compare
# the generated files with it.
#
# Sections (format 2):
#   values, tables, records   closed vocabularies, table columns and records,
#                             each checked against the facade constant it names
#   public                    the user-facing surface of each host
#   cli                       the command line (empty until #3060)
#   python, r                 native registrations (private)
#   operations, host_only     each operation's counterpart in every host
#
# This file declares today's surface only. The 1.0 surface drafted in
# bindings-1.0.yaml moves here with the pull request that implements it.
format: yamaa.host-interface
format_version: 2
boundary: rust_generated_host_glue
contract: README.md

# Roles are imports, not declarations of a second record schema. The generator
# resolves each role to its public symbol in yamaa_adapters::diagnostic_record
# (BOUNDARY_VERSION, ResultRecord, PlanRecord), and the diagnostic role to
# core's yamaa_core::diagnostic::Diagnostic; an unresolved role is a generation
# error.
imports:
  records:
    owner: https://github.com/elong0527/yamaa/issues/2674
    crate: yamaa-adapters
    roles: [boundary_version, diagnostic, result, plan]
  arrow_stream:
    rust: yamaa_adapters::arrow_bridge::FFI_ArrowArrayStream

handshake:
  version: records.boundary_version
  python: _interface_handshake
  r: interface_handshake
  python_error: InterfaceError
  r_error: yamaa_interface_error
  required_features: [structured_records, arrow_c_stream, plan_reuse]
  optional_features:
    format_yaml: yamaa-adapters/yaml
    format_parquet: yamaa-adapters/parquet
    format_readstat: yamaa-adapters/readstat
    format_odm: yamaa-adapters/odm
  failure_record: records.diagnostic
  result_record: records.result

# Closed value vocabularies of the public surface. Each names the facade
# constant that owns it, and the generator refuses any difference from that
# constant, order included.
values:
  # The status of every result (D36, P-STATUS-1). A selftest case that this
  # build cannot run is `skipped`: not covered (D119).
  status:
    rust: yamaa::STATUSES
    values: [succeeded, failed, skipped]
  # The phases of the registered conditions (yaml/conditions.yaml), in run
  # order.
  phase:
    rust: yamaa::PHASES
    values:
      - validation
      - planning
      - ingest
      - row_construction
      - join
      - mapping
      - impute
      - derivation
      - convert
      - verification
      - output
      - engine
  severity:
    rust: yamaa::SEVERITIES
    values: [error, warning]
  report_kind:
    rust: yamaa::REPORT_KINDS
    values: [run, input, rows, handler, column, check]
  report_outcome:
    rust: yamaa::REPORT_OUTCOMES
    values: [succeeded, failed, held, violated]
  # The findings of lint() (D40, P-LINT-2), in the order the style guide names
  # them; the five 1.0 findings follow the 1.0 specification language.
  lint_finding:
    rust: yamaa::LINT_FINDINGS
    values:
      - field_order
      - root_spacing
      - entry_spacing
      - blank_lines
      - line_width
      - invalid_suppression
      - repeated_row_derivation
      - redundant_intermediate
      - missing_label

# Table columns, in order. Each table names the facade constant that holds
# its column names, and the generator refuses any difference. Column types are
# the language's: str, int, float, date and datetime, with list<T> and
# optional<T>; a column's `values` names a vocabulary above, or the condition
# registry.
tables:
  # Section 2.7 (D28): the frozen twelve columns. Issue locations (#3262)
  # fill file, line and column; until then they are missing.
  issues:
    rust: yamaa::ISSUE_COLUMNS
    order: report order, the first issue first
    columns:
      - {name: severity, type: str, values: severity}
      - {name: phase, type: str, values: phase}
      - {name: condition, type: str, values: yaml/conditions.yaml}
      - name: rule
        type: optional<str>
        meaning: card ID the condition cites; missing for engine_rejected and unsupported_operation
      - {name: spec_paths, type: list<str>, meaning: "every spec path the issue concerns, possibly none"}
      - name: file
        type: optional<str>
        meaning: absolute path, forward slashes, of the YAML file that wrote the first spec path
      - {name: line, type: optional<int>, meaning: one-based line of that node}
      - name: column
        type: optional<int>
        meaning: one-based column of that node, in Unicode scalar values
      - name: message
        type: str
        meaning: rendered in Rust from the condition's template in yaml/conditions.yaml; not frozen
      - {name: context, type: str, meaning: "canonical JSON text (RFC 8785) of the condition's facts"}
      - name: source_span
        type: optional<list<int>>
        meaning: "[start, end] UTF-8 byte offsets into the expression text"
      - name: operand_route
        type: optional<list<str>>
        meaning: operand steps from the expression root to the failing node
  report:
    rust: yamaa::REPORT_COLUMNS
    order: CHECK-23
    columns:
      - {name: ARTIFACT, type: str}
      - {name: KIND, type: str, values: report_kind}
      - {name: SPEC_PATH, type: str}
      - {name: NAME, type: optional<str>}
      - {name: ID, type: optional<str>}
      - {name: TARGET, type: optional<str>}
      - {name: RULE, type: optional<str>}
      - {name: SEVERITY, type: optional<str>, values: severity}
      - {name: OUTCOME, type: optional<str>, values: report_outcome}
      - {name: CONDITION, type: optional<str>}
      - {name: COUNT, type: optional<int>}
      - {name: TOTAL, type: optional<int>}
      - {name: KEYS, type: optional<str>}
      - {name: DETAILS, type: str}
  lint:
    rust: yamaa::LINT_COLUMNS
    order: files in argument order, a directory's files in sorted path order, then line, column and finding
    columns:
      - {name: file, type: str, meaning: "absolute path, forward slashes"}
      - {name: line, type: int, meaning: one-based}
      - {name: column, type: int, meaning: "one-based, in Unicode scalar values"}
      - {name: finding, type: str, values: lint_finding}
      - {name: spec_path, type: str, meaning: "spec path of the departure, `$` for the root"}
      - {name: message, type: str, meaning: rendered in Rust; not frozen}
  odm_items:
    rust: yamaa::ODM_COLUMNS
    order: the clinical items in source order
    columns:
      - {name: ODMVersion, type: optional<str>}
      - {name: FileOID, type: optional<str>}
      - {name: StudyOID, type: optional<str>}
      - {name: MetaDataVersionOID, type: optional<str>}
      - {name: SubjectKey, type: optional<str>}
      - {name: StudySubjectID, type: optional<str>}
      - {name: SubjectStatus, type: optional<str>}
      - {name: StudyEventOID, type: optional<str>}
      - {name: StudyEventRepeatKey, type: optional<str>}
      - {name: EventName, type: optional<str>}
      - {name: StartDate, type: optional<str>}
      - {name: EventStatus, type: optional<str>}
      - {name: EventWorkflowStatus, type: optional<str>}
      - {name: FormOID, type: optional<str>}
      - {name: FormRepeatKey, type: optional<str>}
      - {name: FormName, type: optional<str>}
      - {name: FormLayoutOID, type: optional<str>}
      - {name: FormStatus, type: optional<str>}
      - {name: FormWorkflowStatus, type: optional<str>}
      - {name: OpenQueries, type: optional<str>}
      - {name: ItemGroupOID, type: optional<str>}
      - {name: ItemGroupRepeatKey, type: optional<str>}
      - {name: ItemGroupName, type: optional<str>}
      - {name: TransactionType, type: optional<str>}
      - {name: ItemOID, type: optional<str>}
      - {name: ItemName, type: optional<str>}
      - {name: Value, type: optional<str>}
      - {name: ValuePresent, type: str, meaning: "`true` or `false`"}
      - {name: IsNull, type: str, meaning: "`true` or `false`"}
      - {name: SourceOrdinal, type: int, meaning: "the item's position in source order, from one"}
  # D119: one row per selftest case, the bundled benchmarks that
  # benchmarks/selftest.yaml names.
  selftest_cases:
    rust: yamaa::SELFTEST_COLUMNS
    order: the cases in the order benchmarks/selftest.yaml lists them
    columns:
      - {name: case, type: str, meaning: the benchmark the case runs}
      - {name: status, type: str, values: status}
      - name: message
        type: optional<str>
        meaning: why the case failed or is not covered, missing when it passed; not frozen

# Named records a host returns as a dict or named list.
records:
  # D41 (P-INFO-1): what the engine is and where it runs, in the order of the
  # facade's yamaa::Info.
  info:
    owner: "section 2.8 (D41); yamaa::Info"
    fields:
      - {name: version, type: str, meaning: "the engine version, yamaa::VERSION, the same in every host"}
      - name: language_versions
        type: list<str>
        meaning: "every `yamaa:` language version the engine reads, oldest first"
      - {name: features, type: list<str>, meaning: "the optional features compiled in, sorted"}
      - {name: host, type: str, meaning: "`python`, `r` or `cli`"}
      - {name: host_version, type: optional<str>, meaning: "the Python or R version; missing for cli"}
      - {name: platform, type: str, meaning: "`<os>-<arch>` of the compiled engine, such as linux-x86_64"}

# The user-facing surface of each host: names, arguments with their order and
# defaults, members and result types. The generator writes the Python public
# module and R's exported functions, S3 methods and NAMESPACE from it, and the
# manifest records what the stability contract freezes. README.md defines the
# member kinds and how `holds` and `calls` delegate to the native exports.
public:
  python:
    version: __version__
    doc: |-
      Run yamaa clinical data specifications through the shared Rust engine.

      `spec()` and `project()` read nothing; each method runs one engine operation
      and returns a fixed result, and only a result's `save()` writes files. An
      object's first `run()` compiles its specifications and keeps them; a later
      `run()` reuses them while its paths still name the files they were compiled
      from and every one is unchanged, and compiles again otherwise.

  # Host projections of the type tokens used below.
  types:
    path: {python: "str or os.PathLike, unannotated", r: "character(1)"}
    path_list: {python: "a path or a list of paths, unannotated", r: "character()"}
    text: {python: str, r: "character(1)"}
    optional_text: {python: "str | None", r: "character(1) or NULL"}
    count: {python: int, r: "numeric(1), a whole number"}
    flag: {python: bool, r: "logical(1)"}
    names: {python: "list[str]", r: "character()"}
    paths_written:
      python: "list[str], absolute with forward slashes, in publication order"
      r: "character(), the same paths; save() returns them invisibly"
    tree: {python: dict, r: named list}
    table: {python: polars.DataFrame, r: data.frame}
    optional_table: {python: "polars.DataFrame | None", r: data.frame or NULL}
    status: {python: "str, one of values.status", r: "character(1), one of values.status"}
    info: {python: "dict, keys in records.info order", r: "named list, names in records.info order"}
    nothing: {python: None, r: "NULL, invisibly"}

  functions:
    - name: spec
      python: yamaa.spec
      r: yamaa_spec
      args: {path: path}
      returns: Spec
      doc: One specification; nothing is read until a method runs.
    - name: project
      python: yamaa.project
      r: yamaa_project
      args: {path: path}
      returns: Project
      doc: A project file; nothing is read until a method runs.
    - name: read_odm
      python: yamaa.read_odm
      r: yamaa_read_odm
      args:
        source: path
        archive_member: optional_text = None
        max_archive_members: count = 10000
        max_expanded_bytes: count = 268435456
        max_xml_depth: count = 64
      keyword_only: [archive_member, max_archive_members, max_expanded_bytes, max_xml_depth]
      returns: table
      table: odm_items
      raises: refusal
      calls: read_odm
      doc: Read the clinical items of an ODM XML file, or of one member of a TAR.
    - name: lint
      python: yamaa.lint
      r: yamaa_lint
      args: {paths: path_list, fix: flag = false}
      returns: table
      table: lint
      raises: refusal
      calls: lint
      doc: Lint specification files, first applying the proved layout fixes when fix is true.
    - name: selftest
      python: yamaa.selftest
      r: yamaa_selftest
      returns: SelfTest
      calls: selftest
      doc: Run the bundled selftest cases through this installation's engine, comparing each with its expected files.

  # Result and lazy classes, in definition order: a class is defined before
  # any class that returns it.
  classes:
    Check:
      python: yamaa.Check
      r: yamaa_check
      holds: {table: issues}
      doc: Static findings; `issues` is empty when nothing is wrong.
      members:
        - {name: issues, kind: field, returns: table, table: issues}
    Run:
      python: yamaa.Run
      r: yamaa_run
      holds: {native: handle}
      interrupt: run_interrupt
      doc: One specification run; nothing is written until `save()`.
      members:
        - name: output
          kind: property
          returns: optional_table
          calls: run_output
          doc: The output dataset, or None when the run failed.
        - name: issues
          kind: property
          returns: table
          table: issues
          calls: run_issues
          doc: What is wrong, one row per finding.
        - name: report
          kind: property
          returns: optional_table
          table: report
          calls: run_report
          doc: What the run read, counted and checked.
        - name: save
          kind: method
          returns: paths_written
          raises: refusal
          calls: run_save
          doc: Write the declared report file, then the output dataset; return the paths written.
        # Installed-run evidence for qualification suites: R's
        # `.run_observations(run)`; Python reads `run._native.observations()`.
        - name: observations
          kind: private
          args: {include_measurements: flag = false}
          returns: optional_text
          calls: run_observations
    MemberRun:
      python: yamaa.MemberRun
      r: yamaa_member_run
      holds: {native: handle, name: name}
      doc: One specification's run inside a project run; save the project run.
      members:
        - {name: output, kind: property, returns: optional_table, raises: refusal, calls: project_run_output}
        - name: issues
          kind: property
          returns: table
          table: issues
          raises: refusal
          calls: project_run_member_issues
        - name: report
          kind: property
          returns: optional_table
          table: report
          raises: refusal
          calls: project_run_member_report
    ProjectRun:
      python: yamaa.ProjectRun
      r: yamaa_project_run
      holds: {native: handle}
      interrupt: project_run_interrupt
      doc: Every specification a project run built, by `domain` name.
      members:
        - name: names
          kind: property
          returns: names
          calls: project_run_names
          doc: The specifications in the run scope, in run order.
        # An absent name raises the refusal that the member's issues give.
        - name: member
          kind: index
          python: __getitem__
          r: "[["
          args: {name: text}
          returns: MemberRun
          raises: refusal
          calls: project_run_member_issues
        - {name: contains, kind: protocol, python: __contains__}
        - {name: iterate, kind: protocol, python: __iter__, doc: "The names, as `names` lists them."}
        - {name: issues, kind: property, returns: table, table: issues, calls: project_run_issues}
        - {name: report, kind: property, returns: table, table: report, calls: project_run_report}
        - name: save
          kind: method
          returns: paths_written
          raises: refusal
          calls: project_run_save
          doc: Write each report file, then each output unless a run failed; return the paths written.
    Submission:
      python: yamaa.Submission
      r: yamaa_submission
      holds: {native: handle}
      doc: define.xml and each selected section's Dataset-JSON or SAS Transport files.
      members:
        - {name: issues, kind: property, returns: table, table: issues, calls: submission_issues}
        - name: save
          kind: method
          returns: paths_written
          raises: refusal
          calls: submission_save
          doc: Write each section's transport files, then its define.xml; return the paths written.
    Spec:
      python: yamaa.Spec
      r: yamaa_spec
      holds: {path: specification, project: project}
      doc: One specification, read only when a method runs.
      members:
        - name: check
          kind: method
          returns: Check
          raises: refusal
          calls: spec_check
          doc: Report problems without reading study data or running project code.
        - name: resolve
          kind: method
          returns: tree
          raises: refusal
          calls: spec_resolve
          doc: The specification after its layers are composed.
        - {name: run, kind: method, returns: Run, raises: refusal, calls: spec_run, doc: Build the dataset in memory.}
    Project:
      python: yamaa.Project
      r: yamaa_project
      holds: {path: project}
      doc: A study's project file, read only when a method runs.
      members:
        - name: spec
          kind: method
          args: {name: text}
          returns: Spec
          raises: refusal
          calls: project_spec
          doc: The listed specification whose `domain` is `name`.
        - {name: check, kind: method, returns: Check, raises: refusal, calls: project_check}
        - name: run
          kind: method
          args: {section: optional_text = None}
          returns: ProjectRun
          raises: refusal
          calls: project_run
          doc: Build every specification of one section, or of all sections.
        - name: submission
          kind: method
          args: {section: optional_text = None, created: optional_text = None}
          keyword_only: [created]
          returns: Submission
          raises: refusal
          calls: project_submission
    # The installation self-test (D28, D119). Its printed text is the report:
    # the summary line, the first failure, the adapters no case covered and
    # the information line, rendered in Rust.
    SelfTest:
      python: yamaa.SelfTest
      r: yamaa_selftest
      holds: {native: handle}
      doc: The selftest cases run through this installation's engine; printing it gives the report.
      members:
        - name: status
          kind: property
          returns: status
          calls: selftest_status
          doc: "`failed` when a case failed, and `succeeded` otherwise."
        - name: cases
          kind: property
          returns: table
          table: selftest_cases
          calls: selftest_cases
          doc: One row per case, in the order the cases are listed.
        - name: info
          kind: property
          returns: info
          record: info
          calls: selftest_info
          doc: The engine, language versions, features, host and platform that ran the cases.
        - {name: summary, kind: printing, python: __repr__, r: [print, format], calls: selftest_summary}

  errors:
    refusal:
      python:
        class: yamaa.Error
        base: Exception
        attributes: {issues: table, paths: paths_written}
      r:
        class: [yamaa_error, error, condition]
        fields: {message: text, call: "NULL", issues: table, paths: paths_written}
      table: issues
      doc: >-
        A yamaa operation could not complete; `issues` says why, and `paths`
        lists the files a refused save wrote first.

# The command line (D12), which #3060 adds. README.md gives its grammar.
cli: {}


# Complete current registrations, in source order. Both hosts expose the same
# operations: every export is paired with its counterpart under `operations`
# unless `host_only` names it as host transport. Signatures describe the
# current wire projections, not the imported record types: the generator
# resolves the record roles above but projects none of their fields. Type tokens
# and per-host asymmetries are defined in README.md. Implicit interpreter/self
# arguments are omitted. All returned values are owned unless marked otherwise.
python:
  module: yamaa._native
  registration: rust/crates/yamaa-python/src/lib.rs
  exports:
    - kind: constant
      name: _CORE_VERSION
      rust: yamaa_core::VERSION
      type: text
    - kind: class
      name: _ArrowTable
      rust: arrow_bridge::ArrowTable
      constructible: false
      methods:
        - name: __arrow_c_stream__
          args: {requested_schema: "optional<host_object> = None"}
          returns: arrow_stream_capsule
    - kind: exception
      name: _Error
      rust: api_entry::_Error
      base: Exception
    - kind: class
      name: _Run
      rust: api_entry::Run
      constructible: false
      methods:
        - {name: output, args: {}, returns: "optional<_ArrowTable>"}
        - {name: issues, args: {}, returns: _ArrowTable}
        - {name: report, args: {}, returns: "optional<_ArrowTable>"}
        - {name: save, args: {}, returns: "list<text>"}
        - {name: observations, args: {include_measurements: "bool = false"}, returns: "optional<text>"}
    - kind: class
      name: _ProjectRun
      rust: api_entry::ProjectRun
      constructible: false
      methods:
        - {name: names, args: {}, returns: "list<text>"}
        - {name: output, args: {name: text}, returns: "optional<_ArrowTable>"}
        - {name: member_issues, args: {name: text}, returns: _ArrowTable}
        - {name: member_report, args: {name: text}, returns: "optional<_ArrowTable>"}
        - {name: issues, args: {}, returns: _ArrowTable}
        - {name: report, args: {}, returns: _ArrowTable}
        - {name: save, args: {}, returns: "list<text>"}
    - kind: class
      name: _Submission
      rust: api_entry::Submission
      constructible: false
      methods:
        - {name: issues, args: {}, returns: _ArrowTable}
        - {name: save, args: {}, returns: "list<text>"}
    - kind: class
      name: _SelfTest
      rust: api_entry::SelfTest
      constructible: false
      methods:
        - {name: status, args: {}, returns: text}
        - {name: cases, args: {}, returns: _ArrowTable}
        - {name: info, args: {}, returns: context_object}
        - {name: summary, args: {}, returns: text}
    - kind: class
      name: _Plans
      rust: api_entry::Plans
      constructible: false
      methods: []
    - kind: function
      name: _plans
      rust: api_entry::_plans
      args: {}
      returns: _Plans
    - kind: function
      name: _spec_check
      rust: api_entry::_spec_check
      args: {specification: text, project: "optional<text> = None"}
      returns: _ArrowTable
    - kind: function
      name: _spec_run
      rust: api_entry::_spec_run
      args: {specification: text, project: "optional<text> = None", plans: "optional<_Plans> = None"}
      returns: _Run
    - kind: function
      name: _spec_resolve
      rust: api_entry::_spec_resolve
      args: {specification: text, project: "optional<text> = None"}
      returns: context_object
    - kind: function
      name: _project_spec
      rust: api_entry::_project_spec
      args: {project: text, name: text}
      returns: text
    - kind: function
      name: _project_check
      rust: api_entry::_project_check
      args: {project: text}
      returns: _ArrowTable
    - kind: function
      name: _project_run
      rust: api_entry::_project_run
      args: {project: text, section: "optional<text> = None", plans: "optional<_Plans> = None"}
      returns: _ProjectRun
    - kind: function
      name: _project_submission
      rust: api_entry::_project_submission
      args: {project: text, section: "optional<text> = None", created: "optional<text> = None"}
      returns: _Submission
    - kind: function
      name: _read_odm
      rust: api_entry::_read_odm
      args:
        source: text
        archive_member: "optional<text> = None"
        max_archive_members: "index = 10000"
        max_expanded_bytes: "index = 268435456"
        max_xml_depth: "index = 64"
      returns: _ArrowTable
    - kind: function
      name: _lint
      rust: api_entry::_lint
      args: {paths: "list<text>", fix: "bool = false"}
      returns: _ArrowTable
    - kind: function
      name: _selftest
      rust: api_entry::_selftest
      args: {}
      returns: _SelfTest

r:
  module: yamaa
  registration: rust/crates/yamaa-r/src/lib.rs
  # Includes every function in recursively used extendr_module! blocks.
  # extendr supplies wrap__<name>, get_yamaa_metadata and registration machinery.
  groups:
    - module: yamaa
      source: rust/crates/yamaa-r/src/lib.rs
      functions:
        - {name: core_version, args: {}, returns: text}
    - module: api_entry
      source: rust/crates/yamaa-r/src/api_entry.rs
      functions:
        - {name: spec_check, args: {specification: raw, project: robj, version: raw}, returns: r_reply}
        - {name: plans, args: {handle: robj}, returns: r_reply}
        - name: spec_run
          args: {specification: raw, project: robj, version: raw, capabilities: r_list, plans: robj}
          returns: r_reply
