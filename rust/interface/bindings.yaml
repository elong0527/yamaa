# Authoritative declaration input for the Python/R generators specified in README.md.
# Both hosts' registrations and native declarations are generated from this file;
# make check-repository and the native qualification lane compare the generated
# files with it.
format: yamaa.host-interface
format_version: 1
boundary: rust_generated_host_glue
contract: README.md

# Roles are imports, not declarations of a second record schema. The generator
# resolves each role to its public symbol in yamaa_adapters::diagnostic_record
# (BOUNDARY_VERSION, DiagnosticRecord, ResultRecord, PlanRecord); an unresolved
# role is a generation error.
imports:
  records:
    owner: https://github.com/elong0527/yamaa/issues/2674
    crate: yamaa-adapters
    roles: [boundary_version, diagnostic, result, plan]
  arrow_stream:
    rust: yamaa_adapters::arrow_bridge::FFI_ArrowArrayStream

handshake:
  version: records.boundary_version
  python: _interface_handshake
  r: interface_handshake
  python_error: InterfaceError
  r_error: yamaa_interface_error
  required_features: [structured_records, arrow_c_stream]
  optional_features:
    format_yaml: yamaa-adapters/yaml
    format_parquet: yamaa-adapters/parquet
    format_readstat: yamaa-adapters/readstat
    format_odm: yamaa-adapters/odm
    plan_reuse: yamaa::Plans
  failure_record: records.diagnostic
  result_record: records.result

# Complete current registrations, in source order. Both hosts expose the same
# operations: every export is paired with its counterpart under `operations`
# unless `host_only` names it as host transport. Signatures describe the
# current wire projections, not the imported record types: the generator
# resolves the record roles above but projects none of their fields. Type tokens
# and per-host asymmetries are defined in README.md. Implicit interpreter/self
# arguments are omitted. All returned values are owned unless marked otherwise.
python:
  module: yamaa._native
  registration: rust/crates/yamaa-python/src/lib.rs
  exports:
    - kind: constant
      name: _CORE_VERSION
      rust: yamaa_core::VERSION
      type: text
    - kind: class
      name: _ArrowTable
      rust: arrow_bridge::ArrowTable
      constructible: false
      methods:
        - name: __arrow_c_stream__
          args: {requested_schema: "optional<host_object> = None"}
          returns: arrow_stream_capsule
    - kind: exception
      name: _Error
      rust: api_entry::_Error
      base: Exception
    - kind: class
      name: _Run
      rust: api_entry::Run
      constructible: false
      methods:
        - {name: output, args: {}, returns: "optional<_ArrowTable>"}
        - {name: issues, args: {}, returns: _ArrowTable}
        - {name: report, args: {}, returns: "optional<_ArrowTable>"}
        - {name: save, args: {}, returns: unit}
        - {name: observations, args: {include_measurements: "bool = false"}, returns: "optional<text>"}
    - kind: class
      name: _ProjectRun
      rust: api_entry::ProjectRun
      constructible: false
      methods:
        - {name: names, args: {}, returns: "list<text>"}
        - {name: output, args: {name: text}, returns: "optional<_ArrowTable>"}
        - {name: member_issues, args: {name: text}, returns: _ArrowTable}
        - {name: member_report, args: {name: text}, returns: "optional<_ArrowTable>"}
        - {name: issues, args: {}, returns: _ArrowTable}
        - {name: report, args: {}, returns: _ArrowTable}
        - {name: save, args: {}, returns: unit}
    - kind: class
      name: _Submission
      rust: api_entry::Submission
      constructible: false
      methods:
        - {name: issues, args: {}, returns: _ArrowTable}
        - {name: save, args: {}, returns: unit}
    - kind: class
      name: _Plans
      rust: api_entry::Plans
      constructible: false
      methods: []
    - kind: function
      name: _plans
      rust: api_entry::_plans
      args: {}
      returns: _Plans
    - kind: function
      name: _spec_check
      rust: api_entry::_spec_check
      args: {specification: text, project: "optional<text> = None"}
      returns: _ArrowTable
    - kind: function
      name: _spec_run
      rust: api_entry::_spec_run
      args: {specification: text, project: "optional<text> = None", plans: "optional<_Plans> = None"}
      returns: _Run
    - kind: function
      name: _spec_resolve
      rust: api_entry::_spec_resolve
      args: {specification: text, project: "optional<text> = None"}
      returns: context_object
    - kind: function
      name: _project_spec
      rust: api_entry::_project_spec
      args: {project: text, name: text}
      returns: text
    - kind: function
      name: _project_check
      rust: api_entry::_project_check
      args: {project: text}
      returns: _ArrowTable
    - kind: function
      name: _project_run
      rust: api_entry::_project_run
      args: {project: text, section: "optional<text> = None", plans: "optional<_Plans> = None"}
      returns: _ProjectRun
    - kind: function
      name: _project_submission
      rust: api_entry::_project_submission
      args: {project: text, section: "optional<text> = None", created: "optional<text> = None"}
      returns: _Submission
    - kind: function
      name: _read_odm
      rust: api_entry::_read_odm
      args:
        source: text
        archive_member: "optional<text> = None"
        max_archive_members: "index = 10000"
        max_expanded_bytes: "index = 268435456"
        max_xml_depth: "index = 64"
      returns: _ArrowTable
    - kind: function
      name: _style_same_value
      rust: style::_style_same_value
      args: {before: bytes, after: bytes}
      returns: bool

r:
  module: yamaa
  registration: rust/crates/yamaa-r/src/lib.rs
  # Includes every function in recursively used extendr_module! blocks.
  # extendr supplies wrap__<name>, get_yamaa_metadata and registration machinery.
  groups:
    - module: yamaa
      source: rust/crates/yamaa-r/src/lib.rs
      functions:
        - {name: core_version, args: {}, returns: text}
    - module: api_entry
      source: rust/crates/yamaa-r/src/api_entry.rs
      functions:
        - {name: spec_check, args: {specification: raw, project: robj, version: raw}, returns: r_reply}
        - {name: plans, args: {}, returns: r_reply}
        - name: spec_run
          args: {specification: raw, project: robj, version: raw, capabilities: r_list, plans: robj}
          returns: r_reply
        - {name: spec_resolve, args: {specification: raw, project: robj, version: raw}, returns: r_reply}
        - name: read_odm
          args: {source: raw, archive_member: robj, max_archive_members: index, max_expanded_bytes: index, max_xml_depth: index}
          returns: r_reply
        - {name: run_output, args: {handle: robj}, returns: r_reply}
        - {name: run_issues, args: {handle: robj}, returns: r_reply}
        - {name: run_report, args: {handle: robj}, returns: r_reply}
        - {name: run_save, args: {handle: robj}, returns: r_reply}
        - {name: run_observations, args: {handle: robj, include_measurements: bool}, returns: r_reply}
        - {name: run_interrupt, args: {handle: robj}, returns: r_reply}
        - {name: project_spec, args: {project: raw, name: raw, version: raw}, returns: r_reply}
        - {name: project_check, args: {project: raw, version: raw}, returns: r_reply}
        - name: project_run
          args: {project: raw, section: robj, version: raw, capabilities: r_list, plans: robj}
          returns: r_reply
        - {name: project_run_names, args: {handle: robj}, returns: r_reply}
        - {name: project_run_output, args: {handle: robj, name: raw}, returns: r_reply}
        - {name: project_run_member_issues, args: {handle: robj, name: raw}, returns: r_reply}
        - {name: project_run_member_report, args: {handle: robj, name: raw}, returns: r_reply}
        - {name: project_run_issues, args: {handle: robj}, returns: r_reply}
        - {name: project_run_report, args: {handle: robj}, returns: r_reply}
        - {name: project_run_save, args: {handle: robj}, returns: r_reply}
        - {name: project_run_interrupt, args: {handle: robj}, returns: r_reply}
        - name: project_submission
          args: {project: raw, section: robj, created: robj, version: raw}
          returns: r_reply
        - {name: submission_issues, args: {handle: robj}, returns: r_reply}
        - {name: submission_save, args: {handle: robj}, returns: r_reply}

# Every Python export and every R export names its counterpart here; the
# generator refuses an export missing from both this table and host_only.
operations:
  core_version: {python: [_CORE_VERSION], r: [core_version]}
  plans: {python: [_plans], r: [plans]}
  spec_check: {python: [_spec_check], r: [spec_check]}
  spec_run: {python: [_spec_run], r: [spec_run]}
  spec_resolve: {python: [_spec_resolve], r: [spec_resolve]}
  read_odm: {python: [_read_odm], r: [read_odm]}
  run_output: {python: [_Run.output], r: [run_output]}
  run_issues: {python: [_Run.issues], r: [run_issues]}
  run_report: {python: [_Run.report], r: [run_report]}
  run_save: {python: [_Run.save], r: [run_save]}
  run_observations: {python: [_Run.observations], r: [run_observations]}
  project_spec: {python: [_project_spec], r: [project_spec]}
  project_check: {python: [_project_check], r: [project_check]}
  project_run: {python: [_project_run], r: [project_run]}
  project_run_names: {python: [_ProjectRun.names], r: [project_run_names]}
  project_run_output: {python: [_ProjectRun.output], r: [project_run_output]}
  project_run_member_issues: {python: [_ProjectRun.member_issues], r: [project_run_member_issues]}
  project_run_member_report: {python: [_ProjectRun.member_report], r: [project_run_member_report]}
  project_run_issues: {python: [_ProjectRun.issues], r: [project_run_issues]}
  project_run_report: {python: [_ProjectRun.report], r: [project_run_report]}
  project_run_save: {python: [_ProjectRun.save], r: [project_run_save]}
  project_submission: {python: [_project_submission], r: [project_submission]}
  submission_issues: {python: [_Submission.issues], r: [submission_issues]}
  submission_save: {python: [_Submission.save], r: [submission_save]}
# Host transport: Python checks interrupts inside the native calls, R through
# these two helpers; the style command and the Arrow capsule are Python-only.
host_only:
  python: [_style_same_value, _ArrowTable.__arrow_c_stream__]
  r: [run_interrupt, project_run_interrupt]
