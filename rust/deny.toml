# Advisory check for the shipped Rust graph, run by the dependency-graphs
# workflow as `cargo deny --manifest-path rust/Cargo.toml check advisories`.
# Only the advisories section is configured; licenses, bans and sources are
# not checked here. The same workflow also checks Cargo.lock against OSV,
# which carries GitHub's advisories as well, with osv-scanner.toml at the
# repository root.

[graph]
all-features = true

[advisories]
# Any RustSec vulnerability, unsound or unmaintained notice, or yanked
# release in Cargo.lock fails the check. An ignored advisory must carry its
# id, a reason and a review date, for example:
#   { id = "RUSTSEC-0000-0000", reason = "... review by 2027-01-01" },
# OSV reports RustSec advisories too, so an advisory ignored here is ignored
# in osv-scanner.toml as well, with the same reason and review date.
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained, not vulnerable, and a procedural macro that runs only at compile time. It arrives through extendr-api 0.9.0, the latest release, which the R binding builds, and through parquet 55.2.0, which only the adapters' and the application's tests compile, as their differential oracle (#3954). Review by 2027-04-30." },
    { id = "RUSTSEC-2026-0176", reason = "PyO3 0.27.2 is the newest release that builds with the workspace's minimum Rust 1.82 (#3111), which stays the minimum through 1.0.0 for CRAN's two-year-old cargo rule (#3154). The fix arrived in 0.29.0, which needs Rust 1.83, and no 0.27 or 0.28 release carries it. The Python binding iterates a PyList or PyTuple only with next, through for loops and collect, and never calls Iterator::nth or nth_back on one, directly or through an adapter such as skip or step_by. Review by 2027-01-31." },
    { id = "RUSTSEC-2026-0177", reason = "PyO3 0.27.2 is the newest release that builds with the workspace's minimum Rust 1.82 (#3111), which stays the minimum through 1.0.0 for CRAN's two-year-old cargo rule (#3154). The fix arrived in 0.29.0, which needs Rust 1.83, and no 0.27 or 0.28 release carries it. The Python binding never calls PyCFunction::new_closure, and no other locked crate depends on PyO3. Review by 2027-01-31." },
]
