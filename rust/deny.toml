# Advisory check for the shipped Rust graph, run by the dependency-graphs
# workflow as `cargo deny --manifest-path rust/Cargo.toml check advisories`.
# Only the advisories section is configured; licenses, bans and sources are
# not checked here.

[graph]
all-features = true

[advisories]
# Any RustSec vulnerability, unsound or unmaintained notice, or yanked
# release in Cargo.lock fails the check. An ignored advisory must carry its
# id, a reason and a review date, for example:
#   { id = "RUSTSEC-0000-0000", reason = "... review by 2027-01-01" },
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2026-0176", reason = "pyo3 0.27.2: out-of-bounds read in nth/nth_back on PyList and PyTuple iterators. yamaa-python calls neither, directly or through skip/step_by. The PyO3 0.30 bump in #2851 removes it. Review by 2026-12-31." },
    { id = "RUSTSEC-2026-0177", reason = "pyo3 0.27.2: PyCFunction::new_closure lacks a Sync bound. yamaa-python does not call new_closure. The PyO3 0.30 bump in #2851 removes it. Review by 2026-12-31." },
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained, not vulnerable. It arrives through extendr-api 0.9.0, the latest release, and has no maintained replacement upstream. Review by 2027-04-30." },
]
