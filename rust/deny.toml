# Advisory check for the shipped Rust graph, run by the dependency-graphs
# workflow as `cargo deny --manifest-path rust/Cargo.toml check advisories`.
# Only the advisories section is configured; licenses, bans and sources are
# not checked here. The same workflow also checks Cargo.lock against OSV,
# which carries GitHub's advisories as well, with osv-scanner.toml at the
# repository root.

[graph]
all-features = true

[advisories]
# Any RustSec vulnerability, unsound or unmaintained notice, or yanked
# release in Cargo.lock fails the check. An ignored advisory must carry its
# id, a reason and a review date, for example:
#   { id = "RUSTSEC-0000-0000", reason = "... review by 2027-01-01" },
# OSV reports RustSec advisories too, so an advisory ignored here is ignored
# in osv-scanner.toml as well, with the same reason and review date.
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained, not vulnerable, and a procedural macro that runs only at compile time. It arrives through extendr-api 0.9.0, the latest release, and through parquet 55.2.0, which the engine pins exactly as the newest release that builds with Rust 1.82. Review by 2027-04-30." },
]
