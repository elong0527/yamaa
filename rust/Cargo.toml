[workspace]
exclude = ["vendor/saphyr-parser"]
members = ["crates/yamaa-core", "crates/yamaa-adapters", "crates/yamaa", "crates/yamaa-python", "crates/yamaa-r"]
default-members = ["crates/yamaa-core", "crates/yamaa-adapters"]
resolver = "2"

[workspace.package]
version = "0.5.0"
authors = [
    "Yilong Zhang <elong0527@gmail.com>",
    "Ming-Chun Chen",
    "Peng Zhang",
    "Bingjun Wang",
    "Jingwei Xiong",
]
edition = "2021"
rust-version = "1.90"
license = "MIT"
publish = false

# Every unsafe operation sits in its own `unsafe {}` block, also inside an
# `unsafe fn`, as edition 2024 expects.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
lto = "thin"

# Release code generation for the test suite: optimized, with debug assertions
# and overflow checks off exactly as in the shipped extension. Cross-crate
# link-time optimization stays with the shipped artifact, which CI qualifies
# installed; applying it to every integration-test binary cost 12-20 minutes per
# platform. `false` keeps Cargo's default per-crate (thin local) optimization.
[profile.release-test]
inherits = "release"
lto = false

[patch.crates-io]
saphyr-parser = { path = "vendor/saphyr-parser" }
