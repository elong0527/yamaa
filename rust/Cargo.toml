[workspace]
# yamaa-adapters depends on the vendored YAML parser by path. A path dependency
# inside this directory would otherwise join the workspace, and workspace-wide
# test and Clippy runs would cover the upstream sources.
exclude = ["vendor/saphyr-parser"]
members = ["crates/yamaa-core", "crates/yamaa-adapters", "crates/yamaa-application", "crates/yamaa", "crates/yamaa-boundary", "crates/yamaa-python", "crates/yamaa-r", "crates/yamaa-cli"]
default-members = ["crates/yamaa-core", "crates/yamaa-adapters", "crates/yamaa-application"]
resolver = "2"

[workspace.package]
version = "0.6.0"
authors = [
    "Yilong Zhang <elong0527@gmail.com>",
    "Ming-Chun Chen",
    "Peng Zhang",
    "Bingjun Wang",
    "Jingwei Xiong",
]
edition = "2021"
rust-version = "1.82"
license = "MIT"
publish = false

# Every unsafe operation sits in its own `unsafe {}` block, also inside an
# `unsafe fn`. Edition 2021 allows this by default; the workspace denies it.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# Clippy 1.82, the minimum toolchain's, warns on an `if` chain that compares
# the same two values and on `format!` collected into a string; the pinned
# Clippy moved both lints to pedantic.
comparison_chain = "allow"
format_collect = "allow"
# The function ceiling, at the threshold rust/clippy.toml sets: CI's Clippy
# runs with `-D warnings`, so a new function over it fails (#3806).
too_many_lines = "warn"

# Panics unwind, Cargo's default: the facade's batch streams and the R
# binding's entry points contain a panic as a refusal (yamaa and yamaa-r),
# which `panic = "abort"` would turn into the end of the host process.
[profile.release]
lto = "thin"

# The Python wheels and the command-line binaries build with this profile:
# release, without the symbol table. The R package builds with release and
# strips nothing itself, as CRAN's Repository Policy asks and
# tools/packaging/check_cargo_lock.py checks. Its shared object keeps its
# symbols on Linux and macOS, and on Windows R's own toolchain links every
# package DLL with `-s` (#3030 D140).
# The R bundle's manifest leaves out this table with this comment
# (tools/staging/engine_bundle.py), so keep them one block.
[profile.dist]
inherits = "release"
strip = "symbols"

# Release code generation for the test suite: optimized, with debug assertions
# and overflow checks off exactly as in the shipped extension. Cross-crate
# link-time optimization stays with the shipped artifact, which CI qualifies
# installed; applying it to every integration-test binary cost 12-20 minutes per
# platform. `false` keeps Cargo's default per-crate (thin local) optimization.
[profile.release-test]
inherits = "release"
lto = false
