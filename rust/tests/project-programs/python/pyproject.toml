[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "yamaa-benchmarks"
version = "1.0.0"
requires-python = ">=3.12"
description = "Ordinary installed project functions for yamaa benchmarks"

[tool.hatch.build.targets.wheel]
packages = ["src/yamaa_benchmarks"]

[tool.uv]
# `make setup` installs a built wheel, which uv rebuilds only when a file listed
# here changes. List every wheel input: this file and the package sources.
cache-keys = [
  { file = "pyproject.toml" },
  { file = "src/**" },
]
