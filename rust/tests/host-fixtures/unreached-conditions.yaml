# The registered conditions (yaml/conditions.yaml) that no parity case reaches
# (#2846): no negative benchmark's expected/error.yaml names one, and no case
# of the shared host fixtures (the JSON files beside this list) does. Each is
# unreachable by design, with the reason no case can reach it, or not covered
# yet, under the family issue that adds its case (#3423 for validation, #3424
# for planning and ingest, #3428 for row_construction to convert, #3432 for
# verification, output and engine, by the condition's first registered phase).
# tools/validation/check_diagnostics.py keeps the list exact: a registered
# condition needs a case or an entry, and an entry names a registered
# condition that no case reaches. A family issue removes each entry it covers,
# or moves it to unreachable with its reason; not_covered is empty when #2846
# is done. Each list is sorted.

unreachable:
  bare_derivation_scalar: >-
    only the 0.5 path raises it, until P2-13 removes that path: in 1.0 a YAML
    number, Boolean or null derivation is a literal (EXPR-5)
  day_not_permitted: >-
    only the 0.5 path raises it, until P2-13 removes that path: 1.0 drops
    minimum_source_precision, and #3030 D61 retired its benchmarks
  day_required: >-
    only the 0.5 path raises it, until P2-13 removes that path: 1.0 drops
    minimum_source_precision, and #3030 D61 retired its benchmarks
  invalid_size: >-
    no schema the engine ships declares a size constraint (yaml/ and yaml/v1/),
    so no file can fail one (SCHEMA-12); the schema-language tests reach it
    with a schema of their own
  model_contract_mismatch: >-
    only the 0.5 path raises it, until P2-13 removes that path: final
    normalized model admission reads only a 0.5 model, and the 1.0 front end
    reports the same faults under their schema conditions (SCHEMA-7,
    SCHEMA-12, SCHEMA-13)
  month_not_permitted: >-
    only the 0.5 path raises it, until P2-13 removes that path: 1.0 drops
    minimum_source_precision, and #3030 D61 retired its benchmarks
  month_required: >-
    only the 0.5 path raises it, until P2-13 removes that path: 1.0 drops
    minimum_source_precision, and #3030 D61 retired its benchmarks
  parent_on_another_share: >-
    only a layer on a network share that the entry is not on raises it
    (LAYER-10, FILE-4); only Windows hosts have shares, which no portable case
    can stage, so the adapters' resolver tests reach it
    (rust/crates/yamaa-adapters/tests/host_resources.rs)
  project_environment_invalid: >-
    only the 0.5 path raises it, until P2-13 removes that path: a 1.0 project
    reports a listed file it cannot admit with function_file_invalid or
    FILE-11's conditions (FUNC-2, FUNC-3, #3030 D107)
  project_environment_missing: >-
    only the 0.5 path raises it, until P2-13 removes that path: a 1.0 host
    without an environments entry calls its functions without a lock
    (PROJECT-2), the cause #3030 D188 kept
  publication_failed: >-
    only a host file system failure while a save stages or replaces a file
    raises it (OUTPUT-8): a target the walk cannot reach fails with FILE-7's
    and FILE-8's conditions (#3030 D189), and no portable case can make a write
    into a writable directory fail
  resource_path_content_changed: >-
    only a file that changes while one call reads it raises it (FILE-10):
    a host compiles a spec or project object again once a file it holds has
    changed (#3069), so no case can change a file mid-call; the facade's
    plan tests reach it (rust/crates/yamaa/tests/plan_contracts.rs)
  schema_version_mismatch: >-
    only the 0.5 path raises it, until P2-13 removes that path: a 1.0 file
    declares yamaa, and a version the engine does not read fails as
    unsupported_language_version (SCHEMA-2, #3030 D125)
  source_system_incomplete: >-
    no host reaches it: the schema refuses an empty source_system_version
    first (minimum_length, SCHEMA-12), and every host passes its own nonempty
    version as the installed one (DEFINE-12); the core's submission tests
    reach it with an empty installed version
  unknown_standard_family: >-
    only the 0.5 path raises it, until P2-13 removes that path: a guide a 1.0
    section lists outside its model fails as standard_model_mismatch (DEFINE-6,
    #3030 D58)
  xpt_file_too_large: >-
    XPT-10 refuses a transport file past 5,000,000,000 bytes, which takes a
    published dataset of at least 25 million 200-byte values (SUB-24 measures a
    character variable by its longest value) or 625 million numbers; no parity
    case can carry one, so XPT-10's encoder test owns it
not_covered: {}
