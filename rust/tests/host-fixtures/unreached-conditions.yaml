# The registered conditions (yaml/conditions.yaml) that no parity case reaches
# (#2846): no negative benchmark's expected/error.yaml names one, and no case
# of the shared host fixtures (the JSON files beside this list) does. Each is
# unreachable by design, with the reason no case can reach it, or not covered
# yet, under the family issue that adds its case (#3423 for validation, #3424
# for planning and ingest, #3428 for row_construction to convert, #3432 for
# verification, output and engine, by the condition's first registered phase).
# tools/validation/check_diagnostics.py keeps the list exact: a registered
# condition needs a case or an entry, and an entry names a registered
# condition that no case reaches. A family issue removes each entry it covers,
# or moves it to unreachable with its reason; not_covered is empty when #2846
# is done. Each list is sorted.

unreachable:
  day_not_permitted: >-
    only the 0.5 path raises it, until P2-13 removes that path: 1.0 drops
    minimum_source_precision, and #3030 D61 retired its benchmarks
  day_required: >-
    only the 0.5 path raises it, until P2-13 removes that path: 1.0 drops
    minimum_source_precision, and #3030 D61 retired its benchmarks
  month_not_permitted: >-
    only the 0.5 path raises it, until P2-13 removes that path: 1.0 drops
    minimum_source_precision, and #3030 D61 retired its benchmarks
  month_required: >-
